---
- name: Convert deployed Golden VMs to vCenter Templates
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - community.vmware

  vars:

    # ========================================================================
    # vCENTER
    # ========================================================================

    vcenter_hostname: "vcenter-01.vgs.com"
    vcenter_username: "administrator@vsphere.local"
    vcenter_password: "Vigneshv12$"

    validate_certs: false

    # ========================================================================
    # DATACENTER
    # ========================================================================

    vcenter_datacenter: "Datacenter"

    # ========================================================================
    # GOLDEN VMs
    # ========================================================================

    golden_vms:
      - "GOLDENTEMPLATE_CENTOS_07"
      - "GOLDENTEMPLATE_ROCKYOS_08"
      - "GOLDENTEMPLATE_ROCKYOS_09"

    # ========================================================================
    # TIMEOUTS
    # ========================================================================

    shutdown_timeout: 300
    verify_delay: 10

  tasks:

    # ========================================================================
    # DISPLAY
    # ========================================================================

    - name: Display configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "GOLDEN VM -> TEMPLATE CONVERSION"
          - "============================================================"
          - "vCenter       : {{ vcenter_hostname }}"
          - "Username      : {{ vcenter_username }}"
          - "Datacenter    : {{ vcenter_datacenter }}"
          - "Validate Cert : {{ validate_certs }}"
          - "============================================================"
          - "Golden VMs:"
          - "{{ golden_vms }}"
          - "============================================================"

    # ========================================================================
    # PASSWORD
    # ========================================================================

    - name: Fail if vCenter password is not supplied
      ansible.builtin.fail:
        msg: |
          ============================================================
          VCENTER_PASSWORD IS NOT SET
          ============================================================

          Run:

          export VCENTER_PASSWORD='YOUR_VCENTER_PASSWORD'

          Then:

          ansible-playbook convert_golden_vms_to_templates.yml

          ============================================================
      when: vcenter_password | length == 0

    # ========================================================================
    # COLLECTION
    # ========================================================================

    - name: Check community.vmware collection
      ansible.builtin.command:
        argv:
          - ansible-galaxy
          - collection
          - list
      register: vmware_collection
      changed_when: false

    - name: Display VMware collection
      ansible.builtin.debug:
        msg: "{{ vmware_collection.stdout }}"

    # ========================================================================
    # VM DISCOVERY
    #
    # vmware_guest_info gives a clean "non-existing VM" result, so use it
    # directly for discovery rather than vmware_guest_find.
    # ========================================================================

    - name: Check golden VM existence and state
      community.vmware.vmware_guest_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        datacenter: "{{ vcenter_datacenter }}"
        name: "{{ item }}"
        schema: vsphere
        properties:
          - config.name
          - config.template
          - runtime.powerState
        validate_certs: "{{ validate_certs }}"
      delegate_to: localhost
      loop: "{{ golden_vms }}"
      loop_control:
        label: "{{ item }}"
      register: golden_vm_info
      failed_when: false

    # ========================================================================
    # DISPLAY RAW DISCOVERY
    # ========================================================================

    - name: Display VM discovery results
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "{{ item.item }}"
          - "============================================================"
          - "Failed : {{ item.failed | default(false) }}"
          - "Message: {{ item.msg | default('VM found') }}"
          - >-
            Template:
            {{
              item.instance.config.template
              if (item.failed | default(false) | bool) == false
              else 'NOT_FOUND'
            }}
          - >-
            Power State:
            {{
              item.instance.runtime.powerState
              if (item.failed | default(false) | bool) == false
              else 'NOT_FOUND'
            }}
          - "============================================================"
      loop: "{{ golden_vm_info.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ========================================================================
    # EXISTING VM LIST
    # ========================================================================

    - name: Initialize existing VM list
      ansible.builtin.set_fact:
        existing_golden_vms: []

    - name: Add successfully discovered VMs
      ansible.builtin.set_fact:
        existing_golden_vms: "{{ existing_golden_vms + [item.item] }}"
      loop: "{{ golden_vm_info.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - not (item.failed | default(false) | bool)
        - item.instance is defined
        - item.instance.config is defined

    # ========================================================================
    # NON-EXISTING VM LIST
    # ========================================================================

    - name: Initialize missing VM list
      ansible.builtin.set_fact:
        missing_golden_vms: []

    - name: Add missing VMs
      ansible.builtin.set_fact:
        missing_golden_vms: "{{ missing_golden_vms + [item.item] }}"
      loop: "{{ golden_vm_info.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - (item.failed | default(false) | bool) or item.instance is not defined

    # ========================================================================
    # DISPLAY EXISTING / MISSING
    # ========================================================================

    - name: Display discovery summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "GOLDEN VM DISCOVERY SUMMARY"
          - "============================================================"
          - "Existing VMs:"
          - "{{ existing_golden_vms }}"
          - "Missing VMs:"
          - "{{ missing_golden_vms }}"
          - "============================================================"

    # ========================================================================
    # SKIP MISSING VMs
    # ========================================================================

    - name: Skip golden VM because it does not exist
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SKIP - VM NOT DEPLOYED"
          - "============================================================"
          - "VM:"
          - "{{ item }}"
          - "Reason:"
          - "The VM does not exist in vCenter yet."
          - "No conversion will be attempted."
          - "============================================================"
      loop: "{{ missing_golden_vms }}"
      loop_control:
        label: "{{ item }}"

    # ========================================================================
    # BUILD VMs REQUIRING CONVERSION
    # ========================================================================

    - name: Initialize conversion list
      ansible.builtin.set_fact:
        vms_to_convert: []

    - name: Add non-template VMs to conversion list
      ansible.builtin.set_fact:
        vms_to_convert: "{{ vms_to_convert + [item.item] }}"
      loop: "{{ golden_vm_info.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - not (item.failed | default(false) | bool)
        - item.instance is defined
        - item.instance.config is defined
        - not (item.instance.config.template | default(false) | bool)

    # ========================================================================
    # DISPLAY ALREADY-CONVERTED VMs
    # ========================================================================

    - name: Display already converted templates
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SKIP - ALREADY TEMPLATE"
          - "============================================================"
          - "VM:"
          - "{{ item.item }}"
          - "Template:"
          - "{{ item.instance.config.template }}"
          - "============================================================"
      loop: "{{ golden_vm_info.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - not (item.failed | default(false) | bool)
        - item.instance is defined
        - item.instance.config is defined
        - item.instance.config.template | default(false) | bool

    # ========================================================================
    # DISPLAY CONVERSION LIST
    # ========================================================================

    - name: Display VMs requiring conversion
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMs TO CONVERT"
          - "============================================================"
          - "{{ vms_to_convert }}"
          - "============================================================"

    # ========================================================================
    # POWER OFF ONLY VMs REQUIRING CONVERSION
    # ========================================================================

    - name: Power off VM before template conversion
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        datacenter: "{{ vcenter_datacenter }}"
        name: "{{ item }}"
        state: poweredoff
        state_change_timeout: "{{ shutdown_timeout }}"
        validate_certs: "{{ validate_certs }}"
      delegate_to: localhost
      loop: "{{ vms_to_convert }}"
      loop_control:
        label: "{{ item }}"

    # ========================================================================
    # WAIT
    # ========================================================================

    - name: Wait after power off
      ansible.builtin.pause:
        seconds: "{{ verify_delay }}"

    # ========================================================================
    # VERIFY POWER OFF
    # ========================================================================

    - name: Verify VMs are powered off
      community.vmware.vmware_guest_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        datacenter: "{{ vcenter_datacenter }}"
        name: "{{ item }}"
        schema: vsphere
        properties:
          - config.name
          - config.template
          - runtime.powerState
        validate_certs: "{{ validate_certs }}"
      delegate_to: localhost
      loop: "{{ vms_to_convert }}"
      loop_control:
        label: "{{ item }}"
      register: powered_off_info

    - name: Assert VMs are powered off
      ansible.builtin.assert:
        that:
          - item.instance.runtime.powerState == "poweredOff"
          - not (item.instance.config.template | default(false) | bool)
        fail_msg: |
          ============================================================
          VM NOT READY FOR TEMPLATE CONVERSION
          ============================================================

          VM:
          {{ item.item }}

          Power State:
          {{ item.instance.runtime.powerState }}

          Template:
          {{ item.instance.config.template | default(false) }}

          ============================================================
      loop: "{{ powered_off_info.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ========================================================================
    # CONVERT TO TEMPLATE
    # ========================================================================

    - name: Convert golden VM to template
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        datacenter: "{{ vcenter_datacenter }}"
        name: "{{ item }}"
        state: present
        is_template: true
        validate_certs: "{{ validate_certs }}"
      delegate_to: localhost
      loop: "{{ vms_to_convert }}"
      loop_control:
        label: "{{ item }}"

    # ========================================================================
    # VERIFY TEMPLATE STATUS
    # ========================================================================

    - name: Verify converted template
      community.vmware.vmware_guest_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        datacenter: "{{ vcenter_datacenter }}"
        name: "{{ item }}"
        schema: vsphere
        properties:
          - config.name
          - config.template
          - runtime.powerState
        validate_certs: "{{ validate_certs }}"
      delegate_to: localhost
      loop: "{{ vms_to_convert }}"
      loop_control:
        label: "{{ item }}"
      register: template_verification

    # ========================================================================
    # DISPLAY RESULTS
    # ========================================================================

    - name: Display template conversion results
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "TEMPLATE CONVERSION"
          - "============================================================"
          - "VM            : {{ item.item }}"
          - "Template      : {{ item.instance.config.template | default(false) }}"
          - "Power State   : {{ item.instance.runtime.powerState | default('UNKNOWN') }}"
          - "============================================================"
      loop: "{{ template_verification.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ========================================================================
    # ASSERT CONVERSION
    # ========================================================================

    - name: Assert VM is a template
      ansible.builtin.assert:
        that:
          - item.instance.config.template | default(false) | bool
        fail_msg: |
          ============================================================
          TEMPLATE CONVERSION FAILED
          ============================================================

          VM:
          {{ item.item }}

          Template:
          {{ item.instance.config.template | default('UNKNOWN') }}

          ============================================================
        success_msg: "Template conversion verified."
      loop: "{{ template_verification.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ========================================================================
    # FINAL SUMMARY
    # ========================================================================

    - name: Display final conversion summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "GOLDEN TEMPLATE CONVERSION COMPLETE"
          - "============================================================"
          - "CENTOS 7      : GOLDENTEMPLATE_CENTOS_07"
          - "ROCKY LINUX 8 : GOLDENTEMPLATE_ROCKYOS_08"
          - "ROCKY LINUX 9 : GOLDENTEMPLATE_ROCKYOS_09"
          - "============================================================"
          - "Existing:"
          - "{{ existing_golden_vms }}"
          - "Converted:"
          - "{{ vms_to_convert }}"
          - "Skipped - Missing:"
          - "{{ missing_golden_vms }}"
          - "============================================================"
          - "Missing VMs are skipped."
          - "Existing templates are skipped."
          - "============================================================"
