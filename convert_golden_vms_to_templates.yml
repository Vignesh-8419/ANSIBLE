---
- name: Convert deployed Golden VMs to vCenter Templates
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - community.vmware

  vars:

    # ========================================================================
    # vCENTER
    # ========================================================================

    vcenter_hostname: "vcenter-01.vgs.com"
    vcenter_username: "administrator@vsphere.local"
    vcenter_password: "Vigneshv12$"

    validate_certs: false

    # ========================================================================
    # DATACENTER
    # ========================================================================

    vcenter_datacenter: "Datacenter"

    # ========================================================================
    # GOLDEN VMs
    # ========================================================================

    golden_vms:
      - "GOLDENTEMPLATE_CENTOS_07"
      - "GOLDENTEMPLATE_ROCKYOS_08"
      - "GOLDENTEMPLATE_ROCKYOS_09"

    # ========================================================================
    # TIMEOUTS
    # ========================================================================

    shutdown_timeout: 300
    verify_delay: 10

  tasks:

    # ========================================================================
    # DISPLAY
    # ========================================================================

    - name: Display configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "GOLDEN VM -> TEMPLATE CONVERSION"
          - "============================================================"
          - "vCenter       : {{ vcenter_hostname }}"
          - "Username      : {{ vcenter_username }}"
          - "Datacenter    : {{ vcenter_datacenter }}"
          - "Validate Cert : {{ validate_certs }}"
          - "============================================================"
          - "Golden VMs:"
          - "{{ golden_vms }}"
          - "============================================================"

    # ========================================================================
    # PASSWORD
    # ========================================================================

    - name: Fail if vCenter password is not supplied
      ansible.builtin.fail:
        msg: |
          ============================================================
          VCENTER_PASSWORD IS NOT SET
          ============================================================

          Run:

          export VCENTER_PASSWORD='YOUR_VCENTER_PASSWORD'

          Then run:

          ansible-playbook convert_golden_vms_to_templates.yml

          ============================================================
      when: vcenter_password | length == 0

    # ========================================================================
    # CHECK COLLECTION
    # ========================================================================

    - name: Check community.vmware collection
      ansible.builtin.command:
        argv:
          - ansible-galaxy
          - collection
          - list
      register: vmware_collection
      changed_when: false

    - name: Display VMware collection
      ansible.builtin.debug:
        msg: "{{ vmware_collection.stdout }}"

    # ========================================================================
    # CHECK EVERY VM
    #
    # vmware_guest_find returns an error when a VM does not exist.
    # We deliberately don't fail here.
    # ========================================================================

    - name: Check whether golden VM exists
      community.vmware.vmware_guest_find:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        name: "{{ item }}"
        validate_certs: "{{ validate_certs }}"
      delegate_to: localhost

      loop: "{{ golden_vms }}"

      loop_control:
        label: "{{ item }}"

      register: golden_vm_find
      failed_when: false

    # ========================================================================
    # BUILD EXISTING VM LIST
    # ========================================================================

    - name: Initialize existing VM list
      ansible.builtin.set_fact:
        existing_golden_vms: []

    - name: Add existing golden VM to list
      ansible.builtin.set_fact:
        existing_golden_vms: "{{ existing_golden_vms + [item.item] }}"
      loop: "{{ golden_vm_find.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.failed is not defined or not item.failed
        - item.item is defined

    # ========================================================================
    # DISPLAY DISCOVERY
    # ========================================================================

    - name: Display discovered golden VMs
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "GOLDEN VM DISCOVERY"
          - "============================================================"
          - "Requested:"
          - "{{ golden_vms }}"
          - "Existing:"
          - "{{ existing_golden_vms }}"
          - "============================================================"

    # ========================================================================
    # DISPLAY SKIPPED NON-EXISTENT VMs
    # ========================================================================

    - name: Display non-existent golden VMs
      ansible.builtin.debug:
        msg: |
          ============================================================
          SKIPPING VM - NOT FOUND
          ============================================================

          VM:
          {{ item }}

          The VM has not been deployed yet.
          Nothing will be converted.

          ============================================================
      loop: "{{ golden_vms }}"
      when: item not in existing_golden_vms

    # ========================================================================
    # GET VM INFORMATION
    #
    # Only for VMs that actually exist.
    # ========================================================================

    - name: Get existing golden VM information
      community.vmware.vmware_guest_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"

        datacenter: "{{ vcenter_datacenter }}"

        name: "{{ item }}"

        schema: vsphere

        properties:
          - config.name
          - config.template
          - runtime.powerState
          - config.cpuHotAddEnabled
          - config.memoryHotAddEnabled
          - config.hardware.numCPU
          - config.hardware.memoryMB

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      loop: "{{ existing_golden_vms }}"

      loop_control:
        label: "{{ item }}"

      register: golden_vm_info

    # ========================================================================
    # DISPLAY CURRENT STATE
    # ========================================================================

    - name: Display current golden VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "{{ item.item }}"
          - "============================================================"
          - "Power State    : {{ item.instance.runtime.powerState | default('UNKNOWN') }}"
          - "Already Template: {{ item.instance.config.template | default(false) }}"
          - "CPU Hot Add    : {{ item.instance.config.cpuHotAddEnabled | default('UNKNOWN') }}"
          - "Memory Hot Add : {{ item.instance.config.memoryHotAddEnabled | default('UNKNOWN') }}"
          - "vCPU           : {{ item.instance.config.hardware.numCPU | default('UNKNOWN') }}"
          - "Memory MB      : {{ item.instance.config.hardware.memoryMB | default('UNKNOWN') }}"
          - "============================================================"
      loop: "{{ golden_vm_info.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ========================================================================
    # DISPLAY ALREADY-CONVERTED VMs
    # ========================================================================

    - name: Display VMs already converted to templates
      ansible.builtin.debug:
        msg: |
          ============================================================
          SKIPPING - ALREADY A TEMPLATE
          ============================================================

          VM:
          {{ item.item }}

          Template:
          {{ item.instance.config.template }}

          ============================================================
      loop: "{{ golden_vm_info.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.instance.config.template | default(false) | bool

    # ========================================================================
    # BUILD CONVERSION LIST
    # ========================================================================

    - name: Initialize conversion list
      ansible.builtin.set_fact:
        vms_to_convert: []

    - name: Add VM to conversion list
      ansible.builtin.set_fact:
        vms_to_convert: "{{ vms_to_convert + [item.item] }}"
      loop: "{{ golden_vm_info.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - not (item.instance.config.template | default(false) | bool)

    # ========================================================================
    # DISPLAY CONVERSION LIST
    # ========================================================================

    - name: Display VMs requiring conversion
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMs TO CONVERT"
          - "============================================================"
          - "{{ vms_to_convert }}"
          - "============================================================"

    # ========================================================================
    # POWER OFF ONLY VMs REQUIRING CONVERSION
    # ========================================================================

    - name: Power off VM before template conversion
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"

        datacenter: "{{ vcenter_datacenter }}"

        name: "{{ item }}"

        state: poweredoff

        state_change_timeout: "{{ shutdown_timeout }}"

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      loop: "{{ vms_to_convert }}"

      loop_control:
        label: "{{ item }}"

    # ========================================================================
    # WAIT
    # ========================================================================

    - name: Wait after power off
      ansible.builtin.pause:
        seconds: "{{ verify_delay }}"

    # ========================================================================
    # VERIFY POWER OFF
    # ========================================================================

    - name: Verify VMs are powered off
      community.vmware.vmware_guest_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"

        datacenter: "{{ vcenter_datacenter }}"

        name: "{{ item }}"

        schema: vsphere

        properties:
          - config.name
          - config.template
          - runtime.powerState

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      loop: "{{ vms_to_convert }}"

      loop_control:
        label: "{{ item }}"

      register: powered_off_info

    - name: Assert VMs are powered off
      ansible.builtin.assert:
        that:
          - item.instance.runtime.powerState == "poweredOff"
          - not (item.instance.config.template | default(false) | bool)
        fail_msg: |
          ============================================================
          VM NOT READY FOR TEMPLATE CONVERSION
          ============================================================

          VM:
          {{ item.item }}

          Power State:
          {{ item.instance.runtime.powerState }}

          Template:
          {{ item.instance.config.template | default(false) }}

          ============================================================
      loop: "{{ powered_off_info.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ========================================================================
    # CONVERT TO TEMPLATE
    #
    # Only VMs that:
    #   - exist
    #   - are not already templates
    #   - are powered off
    # ========================================================================

    - name: Convert golden VM to template
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"

        datacenter: "{{ vcenter_datacenter }}"

        name: "{{ item }}"

        state: present

        is_template: true

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      loop: "{{ vms_to_convert }}"

      loop_control:
        label: "{{ item }}"

    # ========================================================================
    # VERIFY TEMPLATE STATUS
    # ========================================================================

    - name: Verify converted template
      community.vmware.vmware_guest_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"

        datacenter: "{{ vcenter_datacenter }}"

        name: "{{ item }}"

        schema: vsphere

        properties:
          - config.name
          - config.template
          - runtime.powerState

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      loop: "{{ vms_to_convert }}"

      loop_control:
        label: "{{ item }}"

      register: template_verification

    # ========================================================================
    # DISPLAY CONVERSION RESULTS
    # ========================================================================

    - name: Display template conversion results
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "TEMPLATE CONVERSION"
          - "============================================================"
          - "VM            : {{ item.item }}"
          - "Template      : {{ item.instance.config.template | default(false) }}"
          - "Power State   : {{ item.instance.runtime.powerState | default('UNKNOWN') }}"
          - "============================================================"
      loop: "{{ template_verification.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ========================================================================
    # ASSERT CONVERSION
    # ========================================================================

    - name: Assert VM is a template
      ansible.builtin.assert:
        that:
          - item.instance.config.template | default(false) | bool

        fail_msg: |
          ============================================================
          TEMPLATE CONVERSION FAILED
          ============================================================

          VM:
          {{ item.item }}

          Template:
          {{ item.instance.config.template | default('UNKNOWN') }}

          ============================================================

        success_msg: "Template conversion verified."

      loop: "{{ template_verification.results }}"

      loop_control:
        label: "{{ item.item }}"

    # ========================================================================
    # FINAL SUMMARY
    # ========================================================================

    - name: Display final conversion summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "GOLDEN TEMPLATE CONVERSION COMPLETE"
          - "============================================================"
          - "CENTOS 7      : GOLDENTEMPLATE_CENTOS_07"
          - "ROCKY LINUX 8 : GOLDENTEMPLATE_ROCKYOS_08"
          - "ROCKY LINUX 9 : GOLDENTEMPLATE_ROCKYOS_09"
          - "============================================================"
          - "Existing VMs:"
          - "{{ existing_golden_vms }}"
          - "Converted:"
          - "{{ vms_to_convert }}"
          - "Skipped:"
          - >-
            {{
              golden_vms
              | difference(existing_golden_vms)
            }}
          - "============================================================"
          - "Non-existent VMs are skipped."
          - "Already-template VMs are skipped."
          - "============================================================"
