vmaccepteula

rootpw Root@123

network --bootproto=static --device=vmnic0 --ip=192.168.253.128 --netmask=255.255.255.0 --gateway=192.168.253.2 --nameserver=192.168.253.1 --hostname=esxi-host-01.vgs.com

install --firstdisk --overwritevmfs

reboot

%firstboot --interpreter=busybox

esxcli system hostname set --fqdn=esxi-host-01.vgs.com

vim-cmd hostsvc/enable_ssh
