---
- name: Offline Infrastructure Patching Orchestrator Rocky Linux 9
  hosts: "{{ target_hosts.split(',') | map('trim') | map('regex_replace', '$', '*') | join(',') }}"
  become: yes
  become_method: sudo
  become_user: root
  gather_facts: no
  any_errors_fatal: false

  vars:
    backup_dir_name: "backup_repos_original"

  pre_tasks:

    # ============================================================
    # LOAD NETBOX CONTEXT
    # ============================================================

    - name: Load NetBox Context
      set_fact:
        nb_ctx: "{{ config_context[0] }}"

    - name: Build Repository Variables
      set_fact:
        repo_url: "{{ nb_ctx.httpd_server_url | regex_replace('/$','') }}"
        rocky9_baseos: "{{ (nb_ctx.repositories | selectattr('id','equalto','rocky9-baseos') | first).folder }}"
        rocky9_appstream: "{{ (nb_ctx.repositories | selectattr('id','equalto','rocky9-appstream') | first).folder }}"
        rocky9_installed_rhel: "{{ (nb_ctx.repositories | selectattr('id','equalto','rocky9-rhel-installed') | first).folder }}"

  tasks:

    # ============================================================
    # DISPLAY CONFIGURATION
    # ============================================================

    - name: Display NetBox Context
      debug:
        msg:
          - "===================================================="
          - "NETBOX REPOSITORY CONFIGURATION"
          - "===================================================="
          - "Repository URL : {{ repo_url }}"
          - "BaseOS Repo    : {{ rocky9_baseos }}"
          - "AppStream Repo : {{ rocky9_appstream }}"
          - "Installed Repo : {{ rocky9_installed_rhel }}"
          - "===================================================="

    - name: Display Target Environment Info
      debug:
        msg:
          - "===================================================="
          - "PATCH TARGET"
          - "===================================================="
          - "Processing Agent Node Workflow for {{ inventory_hostname }}"
          - "===================================================="

    # ============================================================
    # REPOSITORY CONNECTIVITY CHECKS
    # ============================================================

    - name: Verify DNS Resolution
      shell: |
        getent hosts {{ repo_url | regex_replace('^https?://','') | regex_replace('/.*$','') }}
      register: dns_check
      changed_when: false
      failed_when: dns_check.rc != 0

    - name: Verify BaseOS Repository Metadata
      uri:
        url: "{{ repo_url }}/{{ rocky9_baseos }}/repodata/repomd.xml"
        method: GET
        status_code: 200
        timeout: 30

    - name: Verify AppStream Repository Metadata
      uri:
        url: "{{ repo_url }}/{{ rocky9_appstream }}/repodata/repomd.xml"
        method: GET
        status_code: 200
        timeout: 30

    - name: Verify Installed RHEL Repository Metadata
      uri:
        url: "{{ repo_url }}/{{ rocky9_installed_rhel }}/repodata/repomd.xml"
        method: GET
        status_code: 200
        timeout: 30

    # ============================================================
    # BACKUP CURRENT REPOSITORIES
    # ============================================================

    - name: Create Repository Backup Directory
      file:
        path: "/etc/yum.repos.d/{{ backup_dir_name }}"
        state: directory
        mode: "0755"

    - name: Find Existing Repository Files
      find:
        paths: /etc/yum.repos.d
        patterns: "*.repo"
        file_type: file
        depth: 1
      register: found_repos

    - name: Backup Existing Repository Files
      command:
        cmd: "mv {{ item.path }} /etc/yum.repos.d/{{ backup_dir_name }}/"
      loop: "{{ found_repos.files }}"
      when: found_repos.matched > 0

    # ============================================================
    # PATCHING BLOCK
    # ============================================================

    - block:

        # ========================================================
        # CREATE TEMPORARY REPOSITORIES
        # ========================================================

        - name: Create Temporary BaseOS Repository
          copy:
            dest: /etc/yum.repos.d/rocky9-baseos.repo
            mode: "0644"
            content: |
              [rocky9-baseos]
              name=Rocky Linux 9 BaseOS
              baseurl={{ repo_url }}/{{ rocky9_baseos }}
              enabled=1
              gpgcheck=0
              sslverify=0

        - name: Create Temporary AppStream Repository
          copy:
            dest: /etc/yum.repos.d/rocky9-appstream.repo
            mode: "0644"
            content: |
              [rocky9-appstream]
              name=Rocky Linux 9 AppStream
              baseurl={{ repo_url }}/{{ rocky9_appstream }}
              enabled=1
              gpgcheck=0
              sslverify=0

        - name: Create Temporary Installed RHEL Repository
          copy:
            dest: /etc/yum.repos.d/rocky9-installed-rhel.repo
            mode: "0644"
            content: |
              [rocky9-installed-rhel]
              name=Rocky Linux 9 Installed RHEL Packages
              baseurl={{ repo_url }}/{{ rocky9_installed_rhel }}
              enabled=1
              gpgcheck=0
              sslverify=0

        # ========================================================
        # DNF PATCHING
        # ========================================================

        - name: Clean DNF Cache
          command: dnf clean all

        - name: Build DNF Cache
          shell: |
            dnf makecache \
              --disablerepo='*' \
              --enablerepo=rocky9-baseos,rocky9-appstream,rocky9-installed-rhel

        - name: Execute Operating System Patching
          shell: |
            dnf update -y \
              --disablerepo='*' \
              --enablerepo=rocky9-baseos,rocky9-appstream,rocky9-installed-rhel \
              --allowerasing \
              --nobest
          register: dnf_shell_output

        - name: Display Patch Output
          debug:
            var: dnf_shell_output.stdout_lines

        - name: Determine Whether Updates Were Installed
          set_fact:
            updates_installed: "{{ 'Nothing to do.' not in dnf_shell_output.stdout }}"

        # ========================================================
        # KERNEL STATUS
        # ========================================================

        - name: Capture Running Kernel
          command: uname -r
          register: running_kernel
          changed_when: false

        - name: Capture Latest Installed Kernel
          shell: |
            rpm -q kernel --last | head -1 | awk '{print $1}' | sed 's/^kernel-//'
          register: latest_kernel
          changed_when: false

        - name: Determine Whether Reboot Is Required
          set_fact:
            reboot_required: "{{ running_kernel.stdout | trim != latest_kernel.stdout | trim }}"

        - name: Display Kernel Status
          debug:
            msg:
              - "===================================================="
              - "KERNEL STATUS"
              - "===================================================="
              - "Running Kernel   : {{ running_kernel.stdout | trim }}"
              - "Latest Kernel    : {{ latest_kernel.stdout | trim }}"
              - "Updates Installed: {{ updates_installed }}"
              - "Reboot Required  : {{ reboot_required }}"
              - "===================================================="

        # ========================================================
        # DETECT SINGLE DISK / DUAL DISK EFI
        # ========================================================

        - name: Detect Secondary EFI Partition
          shell: |
            if [ -b /dev/sdb1 ] && \
               blkid -s TYPE -o value /dev/sdb1 2>/dev/null | grep -qx "vfat"; then
              echo "SECONDARY_EFI_PRESENT"
            else
              echo "SINGLE_DISK_OR_NO_SECONDARY_EFI"
            fi
          register: efi_layout
          changed_when: false

        - name: Display Disk and EFI Layout
          debug:
            msg:
              - "===================================================="
              - "EFI CONFIGURATION"
              - "===================================================="
              - "EFI Detection : {{ efi_layout.stdout | trim }}"
              - "Mode          : {{ 'DUAL DISK / SECONDARY EFI SYNC ENABLED' if 'SECONDARY_EFI_PRESENT' in efi_layout.stdout else 'SINGLE DISK / SECONDARY EFI SYNC SKIPPED' }}"
              - "===================================================="

        # ========================================================
        # UPDATE GRUB - ALL SERVER TYPES
        # ========================================================

        - name: Update GRUB Configuration
          shell: |
            set -e
            grub2-mkconfig -o /boot/grub2/grub.cfg
          register: grub_update
          when:
            - reboot_required | bool

        - name: Display GRUB Update Output
          debug:
            var: grub_update.stdout_lines
          when:
            - reboot_required | bool

        # ========================================================
        # SYNCHRONIZE SECONDARY EFI - DUAL DISK ONLY
        # ========================================================

        - name: Synchronize Secondary EFI Partition
          shell: |
            set -e

            EFI1_WAS_MOUNTED=0
            EFI2_WAS_MOUNTED=0

            mkdir -p /boot/efi
            mkdir -p /boot/efi2

            if mountpoint -q /boot/efi; then
              EFI1_WAS_MOUNTED=1
            else
              mount /dev/sda1 /boot/efi
            fi

            if mountpoint -q /boot/efi2; then
              EFI2_WAS_MOUNTED=1
            else
              mount /dev/sdb1 /boot/efi2
            fi

            rsync -aH --delete /boot/efi/ /boot/efi2/

            sync

            if [ "${EFI2_WAS_MOUNTED}" -eq 0 ]; then
              umount /boot/efi2
            fi

            if [ "${EFI1_WAS_MOUNTED}" -eq 0 ]; then
              umount /boot/efi
            fi
          register: efi_sync
          when:
            - reboot_required | bool
            - "'SECONDARY_EFI_PRESENT' in efi_layout.stdout"

        - name: Display Secondary EFI Sync Output
          debug:
            var: efi_sync.stdout_lines
          when:
            - reboot_required | bool
            - "'SECONDARY_EFI_PRESENT' in efi_layout.stdout"

        - name: Display Single Disk EFI Skip Message
          debug:
            msg:
              - "===================================================="
              - "SECONDARY EFI SYNCHRONIZATION"
              - "===================================================="
              - "Status : SKIPPED"
              - "Reason : Single disk or no secondary VFAT EFI partition"
              - "===================================================="
          when:
            - reboot_required | bool
            - "'SECONDARY_EFI_PRESENT' not in efi_layout.stdout"

        # ========================================================
        # REBOOT
        # ========================================================

        - name: Schedule Reboot
          shell: shutdown -r +1
          when:
            - reboot_required | bool

        - name: Display Reboot Status
          debug:
            msg:
              - "===================================================="
              - "PATCHING COMPLETED"
              - "===================================================="
              - "Host             : {{ inventory_hostname }}"
              - "Updates Installed: {{ updates_installed }}"
              - "Reboot Required  : {{ reboot_required }}"
              - "Reboot           : {{ 'SCHEDULED IN 1 MINUTE' if reboot_required | bool else 'NOT REQUIRED' }}"
              - "===================================================="

      # ==========================================================
      # FAILURE HANDLING
      # ==========================================================

      rescue:

        - name: Restore Original Repositories After Failure
          shell: |
            rm -f /etc/yum.repos.d/rocky9-baseos.repo
            rm -f /etc/yum.repos.d/rocky9-appstream.repo
            rm -f /etc/yum.repos.d/rocky9-installed-rhel.repo

            if [ -d "/etc/yum.repos.d/{{ backup_dir_name }}" ]; then
              mv /etc/yum.repos.d/{{ backup_dir_name }}/*.repo /etc/yum.repos.d/ 2>/dev/null || true
              rmdir /etc/yum.repos.d/{{ backup_dir_name }} 2>/dev/null || true
            fi

        - name: Fail Playbook
          fail:
            msg: "Offline patching failed on {{ inventory_hostname }}. Original repositories restored."

      # ==========================================================
      # ALWAYS RESTORE ORIGINAL REPOSITORIES
      # ==========================================================

      always:

        - name: Remove Temporary Repository Files
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/yum.repos.d/rocky9-baseos.repo
            - /etc/yum.repos.d/rocky9-appstream.repo
            - /etc/yum.repos.d/rocky9-installed-rhel.repo

        - name: Restore Original Repository Files
          shell: |
            if [ -d "/etc/yum.repos.d/{{ backup_dir_name }}" ]; then
              mv /etc/yum.repos.d/{{ backup_dir_name }}/*.repo /etc/yum.repos.d/ 2>/dev/null || true
              rmdir /etc/yum.repos.d/{{ backup_dir_name }} 2>/dev/null || true
            fi
          changed_when: false

        - name: Final DNF Cleanup
          command: dnf clean all
          ignore_errors: true
