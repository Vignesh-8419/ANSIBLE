---
- name: Configure Foreman Smart Proxy Features
  hosts: all
  become: true
  gather_facts: true

  vars:
    foreman_server: "cent-07-01.vgs.com"
    foreman_proxy: "cent-07-02.vgs.com"

    proxy_ssl_ca: "/etc/foreman-proxy/foreman_ssl_ca.pem"
    proxy_ssl_cert: "/etc/foreman-proxy/foreman_ssl_cert.pem"
    proxy_ssl_key: "/etc/foreman-proxy/foreman_ssl_key.pem"

    omapi_key_name: "omapi_key"
    omapi_key_file: "/etc/foreman-proxy/dhcp-omapi.key"

  handlers:
    - name: Restart Foreman Proxy
      ansible.builtin.service:
        name: foreman-proxy
        state: restarted
        enabled: true

    - name: Restart DHCP
      ansible.builtin.service:
        name: dhcpd
        state: restarted
        enabled: true

  tasks:

    ###########################################################################
    # FOREMAN SERVER
    ###########################################################################

    - name: Display Foreman server information
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Foreman Server: {{ foreman_server }}"
          - "Smart Proxy: {{ foreman_proxy }}"

    - name: Check Foreman client certificate
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/foreman/client_cert.pem
        - /etc/foreman/client_key.pem
        - /etc/foreman/proxy_ca.pem
      register: foreman_cert_files
      when: inventory_hostname == foreman_server

    - name: Display Foreman certificate status
      ansible.builtin.debug:
        msg: "{{ item.item }} exists = {{ item.stat.exists }}"
      loop: "{{ foreman_cert_files.results }}"
      when:
        - inventory_hostname == foreman_server
        - foreman_cert_files is defined

    ###########################################################################
    # SMART PROXY CERTIFICATES
    ###########################################################################

    - name: Check Smart Proxy SSL certificates
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ proxy_ssl_ca }}"
        - "{{ proxy_ssl_cert }}"
        - "{{ proxy_ssl_key }}"
      register: proxy_cert_files
      when: inventory_hostname == foreman_proxy

    - name: Fail when Smart Proxy SSL certificates are missing
      ansible.builtin.fail:
        msg: "Required Smart Proxy SSL certificate is missing: {{ item.item }}"
      when:
        - inventory_hostname == foreman_proxy
        - not item.stat.exists
      loop: "{{ proxy_cert_files.results }}"

    - name: Display Smart Proxy certificate status
      ansible.builtin.debug:
        msg: "{{ item.item }} exists = {{ item.stat.exists }}"
      loop: "{{ proxy_cert_files.results }}"
      when: inventory_hostname == foreman_proxy

    ###########################################################################
    # DHCP OMAPI KEY
    ###########################################################################

    - name: Check existing OMAPI key
      ansible.builtin.stat:
        path: "{{ omapi_key_file }}"
      register: omapi_key_existing
      when: inventory_hostname == foreman_proxy

    - name: Find existing generated OMAPI key files
      ansible.builtin.find:
        paths: /tmp
        patterns: "Komapi_key.+*.key"
        file_type: file
      register: existing_omapi_tmp_keys
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_existing.stat.exists

    - name: Generate OMAPI key when no generated key exists
      ansible.builtin.command:
        cmd: "dnssec-keygen -a HMAC-MD5.SIG-ALG.REG.INT -b 128 -n HOST {{ omapi_key_name }}"
        chdir: /tmp
      register: omapi_key_generate
      changed_when: true
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_existing.stat.exists
        - existing_omapi_tmp_keys.matched | int == 0

    - name: Find generated OMAPI key file
      ansible.builtin.find:
        paths: /tmp
        patterns: "Komapi_key.+*.key"
        file_type: file
      register: generated_omapi_key_files
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_existing.stat.exists

    - name: Fail when OMAPI key file was not generated
      ansible.builtin.fail:
        msg: |
          OMAPI key file was not found in /tmp.

          Files found:
          {{ generated_omapi_key_files.files | map(attribute='path') | list }}
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_existing.stat.exists
        - generated_omapi_key_files.matched | int == 0

    - name: Read generated OMAPI key file
      ansible.builtin.slurp:
        src: "{{ generated_omapi_key_files.files | map(attribute='path') | list | first }}"
      register: generated_omapi_key_content
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_existing.stat.exists
        - generated_omapi_key_files.matched | int > 0

    - name: Extract OMAPI secret
      ansible.builtin.set_fact:
        omapi_secret: >-
          {{
            (generated_omapi_key_content.content | b64decode
            | regex_search('secret\\s+\"([^\"]+)\"', '\\1'))
            | first
          }}
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_existing.stat.exists
        - generated_omapi_key_files.matched | int > 0

    - name: Fail when OMAPI secret could not be extracted
      ansible.builtin.fail:
        msg: |
          OMAPI key was found but no secret could be extracted.

          OMAPI key file:
          {{ generated_omapi_key_files.files | map(attribute='path') | list | first }}

          Content:
          {{ generated_omapi_key_content.content | b64decode }}
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_existing.stat.exists
        - omapi_secret | default('') | length == 0

    - name: Display OMAPI secret extraction status
      ansible.builtin.debug:
        msg: "OMAPI secret successfully extracted"
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_existing.stat.exists
        - omapi_secret | default('') | length > 0

    - name: Create OMAPI key file
      ansible.builtin.copy:
        dest: "{{ omapi_key_file }}"
        owner: root
        group: foreman-proxy
        mode: "0640"
        content: |
          key "{{ omapi_key_name }}" {
            algorithm hmac-md5;
            secret "{{ omapi_secret }}";
          };
      notify:
        - Restart DHCP
        - Restart Foreman Proxy
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_existing.stat.exists
        - omapi_secret | default('') | length > 0

    - name: Ensure existing OMAPI key has correct permissions
      ansible.builtin.file:
        path: "{{ omapi_key_file }}"
        owner: root
        group: foreman-proxy
        mode: "0640"
      when:
        - inventory_hostname == foreman_proxy

    ###########################################################################
    # DHCP CONFIGURATION
    ###########################################################################

    - name: Enable DHCP feature in Foreman Smart Proxy
      ansible.builtin.copy:
        dest: /etc/foreman-proxy/settings.d/dhcp.yml
        owner: root
        group: foreman-proxy
        mode: "0640"
        content: |
          ---
          :enabled: true
          :use_provider: dhcp_isc
          :server: 127.0.0.1
          :ping_free_ip: true
      notify: Restart Foreman Proxy
      when: inventory_hostname == foreman_proxy

    - name: Configure ISC DHCP provider
      ansible.builtin.copy:
        dest: /etc/foreman-proxy/settings.d/dhcp_isc.yml
        owner: root
        group: foreman-proxy
        mode: "0640"
        content: |
          ---
          :config: /etc/dhcp/dhcpd.conf
          :leases: /var/lib/dhcpd/dhcpd.leases
          :key_name: {{ omapi_key_name }}
          :key_secret: "{{ lookup('file', omapi_key_file) | regex_search('secret\\s+\"([^\"]+)\"', '\\1') | first }}"
          :omapi_port: 7911
      notify: Restart Foreman Proxy
      when: inventory_hostname == foreman_proxy

    - name: Ensure DHCP leases directory exists
      ansible.builtin.file:
        path: /var/lib/dhcpd
        state: directory
        owner: root
        group: foreman-proxy
        mode: "0750"
      when: inventory_hostname == foreman_proxy

    - name: Ensure DHCP leases file exists
      ansible.builtin.file:
        path: /var/lib/dhcpd/dhcpd.leases
        state: touch
        owner: root
        group: foreman-proxy
        mode: "0640"
      when: inventory_hostname == foreman_proxy

    ###########################################################################
    # DNS CONFIGURATION
    ###########################################################################

    - name: Enable DNS feature in Foreman Smart Proxy
      ansible.builtin.copy:
        dest: /etc/foreman-proxy/settings.d/dns.yml
        owner: root
        group: foreman-proxy
        mode: "0640"
        content: |
          ---
          :enabled: true
          :use_provider: dns_nsupdate
          :dns_ttl: 86400
      notify: Restart Foreman Proxy
      when: inventory_hostname == foreman_proxy

    ###########################################################################
    # TFTP CONFIGURATION
    ###########################################################################

    - name: Create TFTP root directory
      ansible.builtin.file:
        path: /var/lib/tftpboot
        state: directory
        owner: foreman-proxy
        group: foreman-proxy
        mode: "0755"
      when: inventory_hostname == foreman_proxy

    - name: Enable TFTP feature in Foreman Smart Proxy
      ansible.builtin.copy:
        dest: /etc/foreman-proxy/settings.d/tftp.yml
        owner: root
        group: foreman-proxy
        mode: "0640"
        content: |
          ---
          :enabled: true
          :tftproot: /var/lib/tftpboot
      notify: Restart Foreman Proxy
      when: inventory_hostname == foreman_proxy

    ###########################################################################
    # PERMISSIONS
    ###########################################################################

    - name: Ensure foreman-proxy can read DHCP configuration
      ansible.builtin.file:
        path: /etc/dhcp/dhcpd.conf
        owner: root
        group: foreman-proxy
        mode: "0640"
      when: inventory_hostname == foreman_proxy

    - name: Ensure foreman-proxy can read DHCP leases
      ansible.builtin.file:
        path: /var/lib/dhcpd/dhcpd.leases
        owner: root
        group: foreman-proxy
        mode: "0640"
      when: inventory_hostname == foreman_proxy

    ###########################################################################
    # RESTART SERVICES
    ###########################################################################

    - name: Flush handlers before verification
      ansible.builtin.meta: flush_handlers

    - name: Enable and restart Foreman Proxy
      ansible.builtin.service:
        name: foreman-proxy
        state: restarted
        enabled: true
      when: inventory_hostname == foreman_proxy

    - name: Enable and restart DHCP service
      ansible.builtin.service:
        name: dhcpd
        state: restarted
        enabled: true
      when: inventory_hostname == foreman_proxy

    ###########################################################################
    # VERIFY FEATURES
    ###########################################################################

    - name: Get Smart Proxy enabled features locally
      ansible.builtin.command:
        cmd: >
          curl --silent --show-error
          --cacert {{ proxy_ssl_ca }}
          --cert {{ proxy_ssl_cert }}
          --key {{ proxy_ssl_key }}
          https://localhost:9090/v2/features
      register: proxy_features
      changed_when: false
      when: inventory_hostname == foreman_proxy

    - name: Display Smart Proxy features
      ansible.builtin.debug:
        var: proxy_features.stdout
      when: inventory_hostname == foreman_proxy

    - name: Check Foreman Proxy service
      ansible.builtin.command: systemctl is-active foreman-proxy
      register: proxy_service_status
      changed_when: false
      failed_when: false
      when: inventory_hostname == foreman_proxy

    - name: Check DHCP service
      ansible.builtin.command: systemctl is-active dhcpd
      register: dhcp_service_status
      changed_when: false
      failed_when: false
      when: inventory_hostname == foreman_proxy

    - name: Display DHCP port listener
      ansible.builtin.shell: ss -lunp | grep ':67 ' || true
      register: dhcp_port_status
      changed_when: false
      when: inventory_hostname == foreman_proxy

    - name: Display Smart Proxy HTTPS listener
      ansible.builtin.shell: ss -ltnp | grep ':9090 ' || true
      register: proxy_port_status
      changed_when: false
      when: inventory_hostname == foreman_proxy

    ###########################################################################
    # FINAL SUMMARY
    ###########################################################################

    - name: Display final Smart Proxy summary
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "Smart Proxy Configuration Summary"
          - "=============================================="
          - "Host: {{ inventory_hostname }}"
          - "Foreman Proxy: {{ proxy_service_status.stdout }}"
          - "DHCP Service: {{ dhcp_service_status.stdout }}"
          - "DHCP Listener: {{ dhcp_port_status.stdout }}"
          - "Proxy HTTPS Listener: {{ proxy_port_status.stdout }}"
          - "Enabled Features:"
          - "{{ proxy_features.stdout }}"
          - "=============================================="
      when: inventory_hostname == foreman_proxy
