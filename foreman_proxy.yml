# ==============================================================================
# FOREMAN / KATELLO SMART PROXY INSTALLATION
#
# RUN FROM ANSIBLE CONTROLLER:
#
# ansible-playbook -i centos-07-servers_inventory.yml foreman_proxy.yml \
#   -e ansible_python_interpreter=/usr/bin/python3 \
#   -u admin
#
# FLOW:
#
#   1. NetBox inventory discovers all servers
#   2. Play 1 runs only on cent-07-01.vgs.com
#   3. Certificate is generated on cent-07-01:
#        /root/cent-07-02.vgs.com-certs.tar
#   4. Certificate is fetched to the Ansible controller
#   5. Play 2 runs only on cent-07-02.vgs.com
#   6. Smart Proxy FQDN and /etc/hosts are corrected
#   7. Certificate is copied to cent-07-02
#   8. Smart Proxy is installed and registered
#   9. Temporary controller certificate is removed
#
# ==============================================================================


# ==============================================================================
# PLAY 1 - GENERATE SMART PROXY CERTIFICATE ON FOREMAN SERVER
# ==============================================================================

- name: Generate Smart Proxy certificate on Foreman server
  hosts: all
  become: true
  gather_facts: true

  vars:
    foreman_server_name: "cent-07-01.vgs.com"
    foreman_proxy_name: "cent-07-02.vgs.com"

    # Generated on Foreman server
    foreman_proxy_certs_tar: "/root/cent-07-02.vgs.com-certs.tar"

    # Temporary file on Ansible controller
    local_proxy_certs_tar: "/tmp/cent-07-02.vgs.com-certs.tar"

  tasks:

    # --------------------------------------------------------------------------
    # RUN ONLY ON FOREMAN SERVER
    # --------------------------------------------------------------------------

    - name: Skip hosts that are not the Foreman server
      ansible.builtin.meta: end_host
      when:
        - inventory_hostname != foreman_server_name
        - ansible_fqdn != foreman_server_name

    - name: Display Foreman server information
      ansible.builtin.debug:
        msg:
          - "Running on Foreman server: {{ inventory_hostname }}"
          - "Detected FQDN: {{ ansible_fqdn }}"
          - "Generating certificate for: {{ foreman_proxy_name }}"
          - "Certificate path: {{ foreman_proxy_certs_tar }}"

    # --------------------------------------------------------------------------
    # VERIFY CERTIFICATE GENERATION COMMAND
    # --------------------------------------------------------------------------

    - name: Check foreman-proxy-certs-generate command
      ansible.builtin.command:
        cmd: command -v foreman-proxy-certs-generate
      register: proxy_certs_command
      changed_when: false

    - name: Fail when foreman-proxy-certs-generate is unavailable
      ansible.builtin.fail:
        msg: |
          foreman-proxy-certs-generate command was not found on
          {{ inventory_hostname }}.
      when: proxy_certs_command.rc != 0

    # --------------------------------------------------------------------------
    # CHECK EXISTING CERTIFICATE
    # --------------------------------------------------------------------------

    - name: Check whether Smart Proxy certificate already exists
      ansible.builtin.stat:
        path: "{{ foreman_proxy_certs_tar }}"
      register: existing_proxy_certificate

    - name: Remove existing Smart Proxy certificate
      ansible.builtin.file:
        path: "{{ foreman_proxy_certs_tar }}"
        state: absent
      when: existing_proxy_certificate.stat.exists

    # --------------------------------------------------------------------------
    # GENERATE CERTIFICATE
    # --------------------------------------------------------------------------

    - name: Generate Smart Proxy certificate archive
      ansible.builtin.command:
        argv:
          - foreman-proxy-certs-generate
          - --foreman-proxy-fqdn
          - "{{ foreman_proxy_name }}"
          - --certs-tar
          - "{{ foreman_proxy_certs_tar }}"
      register: proxy_certificate_generation
      changed_when: true

    - name: Display certificate generation output
      ansible.builtin.debug:
        var: proxy_certificate_generation.stdout_lines

    - name: Display certificate generation errors
      ansible.builtin.debug:
        var: proxy_certificate_generation.stderr_lines
      when: proxy_certificate_generation.stderr | length > 0

    # --------------------------------------------------------------------------
    # VERIFY CERTIFICATE ON FOREMAN
    # --------------------------------------------------------------------------

    - name: Verify Smart Proxy certificate archive on Foreman
      ansible.builtin.stat:
        path: "{{ foreman_proxy_certs_tar }}"
      register: generated_proxy_certificate

    - name: Fail when Smart Proxy certificate was not created
      ansible.builtin.fail:
        msg: |
          Smart Proxy certificate was not created.

          Expected:
          {{ foreman_proxy_certs_tar }}
      when: not generated_proxy_certificate.stat.exists

    - name: Display generated certificate information
      ansible.builtin.debug:
        msg:
          - "Certificate successfully generated on Foreman."
          - "Foreman server: {{ inventory_hostname }}"
          - "Certificate: {{ foreman_proxy_certs_tar }}"
          - "Size: {{ generated_proxy_certificate.stat.size }} bytes"

    # --------------------------------------------------------------------------
    # REMOVE OLD CONTROLLER COPY
    # --------------------------------------------------------------------------

    - name: Remove old temporary certificate from Ansible controller
      ansible.builtin.file:
        path: "{{ local_proxy_certs_tar }}"
        state: absent
      delegate_to: localhost
      become: false

    # --------------------------------------------------------------------------
    # FETCH CERTIFICATE TO ANSIBLE CONTROLLER
    # --------------------------------------------------------------------------

    - name: Fetch Smart Proxy certificate to Ansible controller
      ansible.builtin.fetch:
        src: "{{ foreman_proxy_certs_tar }}"
        dest: "{{ local_proxy_certs_tar }}"
        flat: true

    # --------------------------------------------------------------------------
    # VERIFY CONTROLLER COPY
    # --------------------------------------------------------------------------

    - name: Check certificate on Ansible controller
      ansible.builtin.stat:
        path: "{{ local_proxy_certs_tar }}"
      delegate_to: localhost
      become: false
      register: controller_certificate_check

    - name: Fail when certificate was not fetched to controller
      ansible.builtin.fail:
        msg: |
          Certificate was generated on Foreman but could not be fetched.

          Expected on controller:
          {{ local_proxy_certs_tar }}
      when: not controller_certificate_check.stat.exists

    - name: Display certificate transfer completion
      ansible.builtin.debug:
        msg:
          - "Certificate generated successfully."
          - "Foreman certificate: {{ foreman_proxy_certs_tar }}"
          - "Controller certificate: {{ local_proxy_certs_tar }}"


# ==============================================================================
# PLAY 2 - INSTALL AND CONFIGURE SMART PROXY ON cent-07-02
# ==============================================================================

- name: Install and configure Foreman Smart Proxy
  hosts: all
  become: true
  gather_facts: true

  vars:
    foreman_server_name: "cent-07-01.vgs.com"
    foreman_proxy_name: "cent-07-02.vgs.com"

    foreman_base_url: "https://cent-07-01.vgs.com"

    local_proxy_certs_tar: "/tmp/cent-07-02.vgs.com-certs.tar"
    proxy_certs_tar: "/root/cent-07-02.vgs.com-certs.tar"

    tftp_root: "/var/lib/tftpboot"

    domain: "vgs.com"

  tasks:

    # --------------------------------------------------------------------------
    # RUN ONLY ON SMART PROXY SERVER
    # --------------------------------------------------------------------------

    - name: Skip hosts that are not the Smart Proxy server
      ansible.builtin.meta: end_host
      when:
        - inventory_hostname != foreman_proxy_name
        - ansible_fqdn != foreman_proxy_name

    - name: Display Smart Proxy information
      ansible.builtin.debug:
        msg:
          - "Running on Smart Proxy server: {{ inventory_hostname }}"
          - "Detected FQDN: {{ ansible_fqdn }}"
          - "Expected Smart Proxy: {{ foreman_proxy_name }}"
          - "Foreman server: {{ foreman_server_name }}"

    # --------------------------------------------------------------------------
    # FIX HOSTNAME / FQDN / REVERSE LOOKUP
    #
    # This fixes the error:
    #
    # Reverse DNS failed. Looking up 192.168.253.132 gave cent-07-02,
    # expected to match cent-07-02.vgs.com
    # --------------------------------------------------------------------------

    - name: Detect Smart Proxy primary IPv4 address
      ansible.builtin.set_fact:
        proxy_primary_ip: >-
          {{
            ansible_default_ipv4.address
            | default(ansible_all_ipv4_addresses[0])
          }}

    - name: Set expected Smart Proxy hostname values
      ansible.builtin.set_fact:
        proxy_short_name: "{{ foreman_proxy_name.split('.')[0] }}"
        proxy_fqdn: "{{ foreman_proxy_name }}"

    - name: Display Smart Proxy network information
      ansible.builtin.debug:
        msg:
          - "Smart Proxy IP: {{ proxy_primary_ip }}"
          - "Short hostname: {{ proxy_short_name }}"
          - "Expected FQDN: {{ proxy_fqdn }}"

    - name: Set Smart Proxy system hostname
      ansible.builtin.hostname:
        name: "{{ proxy_fqdn }}"

    - name: Remove old Smart Proxy hostname entry from hosts file
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^{{ proxy_primary_ip | regex_escape }}\s+.*$'
        state: absent

    - name: Add Smart Proxy FQDN entry to hosts file
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ proxy_primary_ip }} {{ proxy_fqdn }} {{ proxy_short_name }}"
        state: present

    - name: Verify system hostname
      ansible.builtin.command:
        cmd: hostname -f
      register: proxy_hostname_fqdn
      changed_when: false

    - name: Display hostname verification
      ansible.builtin.debug:
        msg:
          - "hostname -f result: {{ proxy_hostname_fqdn.stdout }}"
          - "Expected result: {{ proxy_fqdn }}"

    - name: Fail when hostname is not configured as expected
      ansible.builtin.fail:
        msg: |
          Smart Proxy hostname is incorrect.

          Current:
          {{ proxy_hostname_fqdn.stdout }}

          Expected:
          {{ proxy_fqdn }}
      when: proxy_hostname_fqdn.stdout != proxy_fqdn

    - name: Verify local reverse lookup for Smart Proxy IP
      ansible.builtin.command:
        cmd: "getent hosts {{ proxy_primary_ip }}"
      register: proxy_reverse_lookup
      changed_when: false
      failed_when: false

    - name: Display Smart Proxy reverse lookup
      ansible.builtin.debug:
        msg:
          - "Reverse lookup result: {{ proxy_reverse_lookup.stdout }}"
          - "Expected FQDN: {{ proxy_fqdn }}"

    - name: Fail when Smart Proxy IP does not resolve to expected FQDN
      ansible.builtin.fail:
        msg: |
          Smart Proxy reverse lookup validation failed.

          IP:
          {{ proxy_primary_ip }}

          Expected FQDN:
          {{ proxy_fqdn }}

          Actual result:
          {{ proxy_reverse_lookup.stdout | default('No result') }}

          Check DNS PTR configuration or /etc/hosts.
      when:
        - proxy_reverse_lookup.rc != 0 or proxy_fqdn not in proxy_reverse_lookup.stdout

    # --------------------------------------------------------------------------
    # VERIFY FOREMAN CONNECTIVITY
    # --------------------------------------------------------------------------

    - name: Verify Foreman hostname resolution
      ansible.builtin.command:
        cmd: "getent hosts {{ foreman_server_name }}"
      register: foreman_name_resolution
      changed_when: false
      failed_when: false

    - name: Fail when Foreman hostname cannot be resolved
      ansible.builtin.fail:
        msg: |
          Cannot resolve Foreman server.

          Foreman:
          {{ foreman_server_name }}

          Configure DNS or /etc/hosts before continuing.
      when: foreman_name_resolution.rc != 0

    # --------------------------------------------------------------------------
    # VERIFY CERTIFICATE ON CONTROLLER
    # --------------------------------------------------------------------------

    - name: Check certificate on Ansible controller
      ansible.builtin.stat:
        path: "{{ local_proxy_certs_tar }}"
      delegate_to: localhost
      become: false
      register: controller_certificate_check

    - name: Fail when certificate is missing from controller
      ansible.builtin.fail:
        msg: |
          Certificate does not exist on the Ansible controller.

          Expected:
          {{ local_proxy_certs_tar }}
      when: not controller_certificate_check.stat.exists

    # --------------------------------------------------------------------------
    # COPY CERTIFICATE TO SMART PROXY
    # --------------------------------------------------------------------------

    - name: Copy Smart Proxy certificate to Smart Proxy server
      ansible.builtin.copy:
        src: "{{ local_proxy_certs_tar }}"
        dest: "{{ proxy_certs_tar }}"
        owner: root
        group: root
        mode: "0600"

    - name: Verify certificate on Smart Proxy
      ansible.builtin.stat:
        path: "{{ proxy_certs_tar }}"
      register: proxy_certificate_check

    - name: Fail when certificate was not copied
      ansible.builtin.fail:
        msg: |
          Certificate was not copied to Smart Proxy.

          Expected:
          {{ proxy_certs_tar }}
      when: not proxy_certificate_check.stat.exists

    # --------------------------------------------------------------------------
    # INSTALL KATELLO CA CONSUMER
    # --------------------------------------------------------------------------

    - name: Check Katello CA consumer
      ansible.builtin.command:
        cmd: rpm -q katello-ca-consumer
      register: katello_ca_check
      changed_when: false
      failed_when: false

    - name: Install Katello CA consumer
      ansible.builtin.yum:
        name: "http://cent-07-01.vgs.com/pub/katello-ca-consumer-latest.noarch.rpm"
        state: present
        disable_gpg_check: true
      when: katello_ca_check.rc != 0

    # --------------------------------------------------------------------------
    # INSTALL REQUIRED PACKAGES
    # --------------------------------------------------------------------------

    - name: Install Foreman Smart Proxy installer packages
      ansible.builtin.yum:
        name:
          - foreman-installer
          - foreman-installer-katello
        state: present
        disable_gpg_check: true

    # --------------------------------------------------------------------------
    # CHECK CURRENT PROXY STATUS
    # --------------------------------------------------------------------------

    - name: Check whether Foreman Proxy is already active
      ansible.builtin.command:
        cmd: systemctl is-active foreman-proxy
      register: foreman_proxy_status
      changed_when: false
      failed_when: false

    - name: Display current Foreman Proxy status
      ansible.builtin.debug:
        msg: "Current Foreman Proxy status: {{ foreman_proxy_status.stdout | default('not installed') }}"

    # --------------------------------------------------------------------------
    # INSTALL SMART PROXY
    # --------------------------------------------------------------------------

    - name: Install Foreman Smart Proxy Content
      ansible.builtin.command:
        argv:
          - foreman-installer
          - --scenario
          - foreman-proxy-content
          - --certs-tar-file
          - "{{ proxy_certs_tar }}"
          - --foreman-proxy-register-in-foreman
          - "true"
          - --foreman-proxy-foreman-base-url
          - "{{ foreman_base_url }}"
          - --foreman-proxy-trusted-hosts
          - "{{ foreman_server_name }}"
          - --foreman-proxy-trusted-hosts
          - "{{ proxy_fqdn }}"
      register: smart_proxy_install
      changed_when: true
      when: foreman_proxy_status.stdout != "active"

    - name: Display Smart Proxy installation output
      ansible.builtin.debug:
        var: smart_proxy_install.stdout_lines
      when:
        - smart_proxy_install is defined
        - smart_proxy_install.stdout is defined

    # --------------------------------------------------------------------------
    # CONFIGURE TFTP
    # --------------------------------------------------------------------------

    - name: Ensure TFTP root exists
      ansible.builtin.file:
        path: "{{ tftp_root }}"
        state: directory
        owner: foreman-proxy
        group: foreman-proxy
        mode: "0755"

    - name: Check Foreman Proxy TFTP configuration file
      ansible.builtin.stat:
        path: /etc/foreman-proxy/settings.d/tftp.yml
      register: tftp_config_file

    - name: Configure Foreman Proxy TFTP root
      ansible.builtin.lineinfile:
        path: /etc/foreman-proxy/settings.d/tftp.yml
        regexp: '^:tftproot:'
        line: ":tftproot: {{ tftp_root }}"
        create: true
        owner: root
        group: root
        mode: "0644"
      notify: Restart Foreman Proxy

    # --------------------------------------------------------------------------
    # ENABLE AND START SERVICE
    # --------------------------------------------------------------------------

    - name: Enable Foreman Smart Proxy service
      ansible.builtin.systemd:
        name: foreman-proxy
        enabled: true

    - name: Start Foreman Smart Proxy service
      ansible.builtin.systemd:
        name: foreman-proxy
        state: started

    - name: Apply Smart Proxy restart
      ansible.builtin.meta: flush_handlers

    # --------------------------------------------------------------------------
    # FINAL CHECK
    # --------------------------------------------------------------------------

    - name: Verify Foreman Smart Proxy service
      ansible.builtin.command:
        cmd: systemctl is-active foreman-proxy
      register: final_proxy_status
      changed_when: false
      failed_when: false

    - name: Fail when Smart Proxy is not active
      ansible.builtin.fail:
        msg: |
          Foreman Smart Proxy is not active.

          Check:
          systemctl status foreman-proxy
          journalctl -u foreman-proxy -n 100 --no-pager
      when: final_proxy_status.stdout != "active"

    - name: Display Smart Proxy installation completion
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SMART PROXY INSTALLATION COMPLETED"
          - "============================================================"
          - "Foreman Server : {{ foreman_server_name }}"
          - "Smart Proxy    : {{ proxy_fqdn }}"
          - "Proxy IP       : {{ proxy_primary_ip }}"
          - "Proxy Status   : {{ final_proxy_status.stdout }}"
          - "Certificate    : {{ proxy_certs_tar }}"
          - "TFTP Root      : {{ tftp_root }}"
          - "============================================================"

  handlers:

    - name: Restart Foreman Proxy
      ansible.builtin.systemd:
        name: foreman-proxy
        enabled: true
        state: restarted


# ==============================================================================
# PLAY 3 - CLEAN TEMPORARY CERTIFICATE FROM ANSIBLE CONTROLLER
# ==============================================================================

- name: Clean temporary certificate from Ansible controller
  hosts: all
  gather_facts: false

  vars:
    foreman_server_name: "cent-07-01.vgs.com"
    local_proxy_certs_tar: "/tmp/cent-07-02.vgs.com-certs.tar"

  tasks:

    - name: Skip hosts except Foreman server for cleanup
      ansible.builtin.meta: end_host
      when: inventory_hostname != foreman_server_name

    - name: Remove temporary certificate from Ansible controller
      ansible.builtin.file:
        path: "{{ local_proxy_certs_tar }}"
        state: absent
      delegate_to: localhost
      become: false

    - name: Display cleanup completion
      ansible.builtin.debug:
        msg: |
          Temporary Smart Proxy certificate removed from Ansible controller:
          {{ local_proxy_certs_tar }}
