---
# ==============================================================================
# FOREMAN / KATELLO SMART PROXY CONTENT INSTALLATION
#
# RUN FROM ANSIBLE CONTROLLER:
#
# ansible-playbook -i centos-07-servers_inventory.yml foreman_proxy.yml \
#   -e ansible_python_interpreter=/usr/bin/python3 \
#   -u admin
#
# FLOW:
#
#   1. NetBox inventory discovers all servers
#   2. Certificate is generated only on cent-07-01.vgs.com
#   3. Certificate archive is fetched to the Ansible controller
#   4. Smart Proxy installation runs only on cent-07-02.vgs.com
#   5. GTK and Mesa repositories are configured
#   6. Required Container Gateway Ruby package is verified
#   7. Smart Proxy Content is installed and registered in Foreman
#   8. TFTP is configured
#   9. foreman-proxy service is verified
#  10. Temporary certificate is removed from Ansible controller
#
# ==============================================================================


# ==============================================================================
# PLAY 1
# GENERATE SMART PROXY CERTIFICATE ON FOREMAN SERVER
# ==============================================================================

- name: Generate Smart Proxy certificate on Foreman server
  hosts: all
  become: true
  gather_facts: true

  vars:
    foreman_server_name: "cent-07-01.vgs.com"
    foreman_proxy_name: "cent-07-02.vgs.com"

    foreman_proxy_certs_tar: "/root/cent-07-02.vgs.com-certs.tar"
    local_proxy_certs_tar: "/tmp/cent-07-02.vgs.com-certs.tar"

  tasks:

    # --------------------------------------------------------------------------
    # RUN ONLY ON FOREMAN SERVER
    # --------------------------------------------------------------------------

    - name: Skip hosts that are not the Foreman server
      ansible.builtin.meta: end_host
      when:
        - inventory_hostname != foreman_server_name
        - ansible_fqdn != foreman_server_name

    - name: Display Foreman server information
      ansible.builtin.debug:
        msg:
          - "Foreman server: {{ inventory_hostname }}"
          - "Detected FQDN: {{ ansible_fqdn }}"
          - "Generating certificate for: {{ foreman_proxy_name }}"
          - "Certificate archive: {{ foreman_proxy_certs_tar }}"

    # --------------------------------------------------------------------------
    # VERIFY COMMAND
    # --------------------------------------------------------------------------

    - name: Check foreman-proxy-certs-generate command
      ansible.builtin.command:
        cmd: which foreman-proxy-certs-generate
      register: proxy_certs_command
      changed_when: false

    - name: Display certificate generation command
      ansible.builtin.debug:
        msg: "{{ proxy_certs_command.stdout }}"

    # --------------------------------------------------------------------------
    # REMOVE OLD CERTIFICATE
    # This ensures a newly generated certificate is used.
    # --------------------------------------------------------------------------

    - name: Remove old Smart Proxy certificate archive
      ansible.builtin.file:
        path: "{{ foreman_proxy_certs_tar }}"
        state: absent

    # --------------------------------------------------------------------------
    # GENERATE CERTIFICATE
    # --------------------------------------------------------------------------

    - name: Generate Smart Proxy certificate archive
      ansible.builtin.command:
        argv:
          - foreman-proxy-certs-generate
          - --foreman-proxy-fqdn
          - "{{ foreman_proxy_name }}"
          - --certs-tar
          - "{{ foreman_proxy_certs_tar }}"
      register: proxy_certificate_generation
      changed_when: true

    - name: Display certificate generation output
      ansible.builtin.debug:
        var: proxy_certificate_generation.stdout_lines

    # --------------------------------------------------------------------------
    # VERIFY CERTIFICATE ON FOREMAN
    # --------------------------------------------------------------------------

    - name: Verify Smart Proxy certificate archive on Foreman
      ansible.builtin.stat:
        path: "{{ foreman_proxy_certs_tar }}"
      register: generated_proxy_certificate

    - name: Fail when Smart Proxy certificate was not created
      ansible.builtin.fail:
        msg: |
          Smart Proxy certificate archive was not created.

          Expected:
          {{ foreman_proxy_certs_tar }}
      when: not generated_proxy_certificate.stat.exists

    - name: Display generated certificate information
      ansible.builtin.debug:
        msg:
          - "Certificate generated successfully."
          - "Path: {{ foreman_proxy_certs_tar }}"
          - "Size: {{ generated_proxy_certificate.stat.size }} bytes"

    # --------------------------------------------------------------------------
    # FETCH CERTIFICATE TO ANSIBLE CONTROLLER
    # --------------------------------------------------------------------------

    - name: Remove old temporary certificate from Ansible controller
      ansible.builtin.file:
        path: "{{ local_proxy_certs_tar }}"
        state: absent
      delegate_to: localhost
      become: false

    - name: Fetch Smart Proxy certificate to Ansible controller
      ansible.builtin.fetch:
        src: "{{ foreman_proxy_certs_tar }}"
        dest: "{{ local_proxy_certs_tar }}"
        flat: true

    # --------------------------------------------------------------------------
    # VERIFY CONTROLLER COPY
    # --------------------------------------------------------------------------

    - name: Check certificate on Ansible controller
      ansible.builtin.stat:
        path: "{{ local_proxy_certs_tar }}"
      delegate_to: localhost
      become: false
      register: controller_certificate_check

    - name: Fail when certificate was not fetched to controller
      ansible.builtin.fail:
        msg: |
          Certificate was generated on Foreman but was not fetched to
          the Ansible controller.

          Expected:
          {{ local_proxy_certs_tar }}
      when: not controller_certificate_check.stat.exists

    - name: Display certificate transfer completion
      ansible.builtin.debug:
        msg: |
          ============================================================
          CERTIFICATE GENERATION COMPLETED
          ============================================================

          Foreman Server:
          {{ foreman_server_name }}

          Certificate on Foreman:
          {{ foreman_proxy_certs_tar }}

          Temporary Certificate on Controller:
          {{ local_proxy_certs_tar }}

          ============================================================


# ==============================================================================
# PLAY 2
# INSTALL AND CONFIGURE FOREMAN SMART PROXY CONTENT
# ==============================================================================

- name: Install and configure Foreman Smart Proxy Content
  hosts: all
  become: true
  gather_facts: true

  vars:
    # --------------------------------------------------------------------------
    # HOST CONFIGURATION
    # --------------------------------------------------------------------------

    foreman_server_name: "cent-07-01.vgs.com"
    foreman_server_ip: "192.168.253.131"

    foreman_proxy_name: "cent-07-02.vgs.com"
    foreman_proxy_ip: "192.168.253.132"

    foreman_base_url: "https://cent-07-01.vgs.com"

    # --------------------------------------------------------------------------
    # CERTIFICATE CONFIGURATION
    # --------------------------------------------------------------------------

    local_proxy_certs_tar: "/tmp/cent-07-02.vgs.com-certs.tar"
    proxy_certs_tar: "/root/cent-07-02.vgs.com-certs.tar"

    # --------------------------------------------------------------------------
    # KATELLO CONFIGURATION
    # --------------------------------------------------------------------------

    katello_ca_consumer_rpm: >-
      http://cent-07-01.vgs.com/pub/katello-ca-consumer-latest.noarch.rpm

    # --------------------------------------------------------------------------
    # GTK / FOREMAN REPOSITORY
    #
    # CHANGE THESE URLs IF YOUR REPOSITORY PATH IS DIFFERENT
    # --------------------------------------------------------------------------

    gtk_repo_baseurl: "http://http-server-01.vgs.com/repo/gtk/"
    mesa_repo_baseurl: "http://http-server-01.vgs.com/repo/mesa/"

    # --------------------------------------------------------------------------
    # TFTP
    # --------------------------------------------------------------------------

    tftp_root: "/var/lib/tftpboot"

  tasks:

    # --------------------------------------------------------------------------
    # RUN ONLY ON SMART PROXY SERVER
    # --------------------------------------------------------------------------

    - name: Skip hosts that are not the Smart Proxy server
      ansible.builtin.meta: end_host
      when:
        - inventory_hostname != foreman_proxy_name
        - ansible_fqdn != foreman_proxy_name

    - name: Display Smart Proxy information
      ansible.builtin.debug:
        msg:
          - "Smart Proxy server: {{ inventory_hostname }}"
          - "Detected FQDN: {{ ansible_fqdn }}"
          - "Expected FQDN: {{ foreman_proxy_name }}"
          - "Foreman Server: {{ foreman_server_name }}"
          - "Foreman URL: {{ foreman_base_url }}"

    # --------------------------------------------------------------------------
    # FIX FQDN / HOST RESOLUTION
    # --------------------------------------------------------------------------

    - name: Configure Foreman server in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^{{ foreman_server_ip | regex_escape }}\\s+.*$"
        line: "{{ foreman_server_ip }} {{ foreman_server_name }} cent-07-01"
        state: present

    - name: Configure Smart Proxy server FQDN in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^{{ foreman_proxy_ip | regex_escape }}\\s+.*$"
        line: "{{ foreman_proxy_ip }} {{ foreman_proxy_name }} cent-07-02"
        state: present

    - name: Set Smart Proxy hostname to FQDN
      ansible.builtin.hostname:
        name: "{{ foreman_proxy_name }}"

    - name: Verify Smart Proxy hostname
      ansible.builtin.command:
        cmd: hostname -f
      register: proxy_hostname_fqdn
      changed_when: false

    - name: Fail when Smart Proxy FQDN is incorrect
      ansible.builtin.fail:
        msg: |
          Smart Proxy hostname/FQDN is incorrect.

          Expected:
          {{ foreman_proxy_name }}

          Detected:
          {{ proxy_hostname_fqdn.stdout }}

          Check DNS or /etc/hosts.
      when: proxy_hostname_fqdn.stdout != foreman_proxy_name

    - name: Verify Foreman hostname resolution
      ansible.builtin.command:
        cmd: getent hosts {{ foreman_server_name }}
      register: foreman_host_resolution
      changed_when: false

    - name: Verify Smart Proxy hostname resolution
      ansible.builtin.command:
        cmd: getent hosts {{ foreman_proxy_name }}
      register: proxy_host_resolution
      changed_when: false

    - name: Display hostname resolution
      ansible.builtin.debug:
        msg:
          - "{{ foreman_host_resolution.stdout }}"
          - "{{ proxy_host_resolution.stdout }}"

    # --------------------------------------------------------------------------
    # VERIFY CERTIFICATE ON CONTROLLER
    # --------------------------------------------------------------------------

    - name: Check certificate on Ansible controller
      ansible.builtin.stat:
        path: "{{ local_proxy_certs_tar }}"
      delegate_to: localhost
      become: false
      register: controller_certificate_check

    - name: Fail when certificate is missing from controller
      ansible.builtin.fail:
        msg: |
          Smart Proxy certificate does not exist on the Ansible controller.

          Expected:
          {{ local_proxy_certs_tar }}
      when: not controller_certificate_check.stat.exists

    # --------------------------------------------------------------------------
    # COPY CERTIFICATE TO SMART PROXY
    # --------------------------------------------------------------------------

    - name: Copy Smart Proxy certificate to Smart Proxy server
      ansible.builtin.copy:
        src: "{{ local_proxy_certs_tar }}"
        dest: "{{ proxy_certs_tar }}"
        owner: root
        group: root
        mode: "0600"

    - name: Verify certificate on Smart Proxy
      ansible.builtin.stat:
        path: "{{ proxy_certs_tar }}"
      register: proxy_certificate_check

    - name: Fail when certificate was not copied
      ansible.builtin.fail:
        msg: |
          Smart Proxy certificate was not copied successfully.

          Expected:
          {{ proxy_certs_tar }}
      when: not proxy_certificate_check.stat.exists

    # --------------------------------------------------------------------------
    # INSTALL KATELLO CA CONSUMER
    # --------------------------------------------------------------------------

    - name: Check Katello CA consumer package
      ansible.builtin.command:
        cmd: rpm -q katello-ca-consumer
      register: katello_ca_check
      changed_when: false
      failed_when: false

    - name: Install Katello CA consumer
      ansible.builtin.yum:
        name: "{{ katello_ca_consumer_rpm }}"
        state: present
        disable_gpg_check: true
      when: katello_ca_check.rc != 0

    # --------------------------------------------------------------------------
    # INSTALL REPOSITORY PREREQUISITES
    # --------------------------------------------------------------------------

    - name: Install Yum repository prerequisites
      ansible.builtin.yum:
        name:
          - yum-utils
          - epel-release
        state: present
        disable_gpg_check: true

    # --------------------------------------------------------------------------
    # CONFIGURE GTK REPOSITORY
    # --------------------------------------------------------------------------

    - name: Configure GTK repository
      ansible.builtin.yum_repository:
        name: gtk
        description: GTK / Foreman Ruby Repository
        baseurl: "{{ gtk_repo_baseurl }}"
        enabled: true
        gpgcheck: false

    # --------------------------------------------------------------------------
    # CONFIGURE MESA REPOSITORY
    # --------------------------------------------------------------------------

    - name: Configure Mesa repository
      ansible.builtin.yum_repository:
        name: mesa
        description: Mesa Dependency Repository
        baseurl: "{{ mesa_repo_baseurl }}"
        enabled: true
        gpgcheck: false

    # --------------------------------------------------------------------------
    # CLEAN AND REFRESH YUM
    # --------------------------------------------------------------------------

    - name: Clean Yum metadata
      ansible.builtin.command:
        cmd: yum clean all
      changed_when: false

    - name: Rebuild Yum metadata cache
      ansible.builtin.command:
        cmd: yum makecache
      changed_when: false

    - name: Display enabled repositories
      ansible.builtin.command:
        cmd: yum repolist enabled
      register: enabled_repositories
      changed_when: false

    - name: Display enabled repositories
      ansible.builtin.debug:
        var: enabled_repositories.stdout_lines

    # --------------------------------------------------------------------------
    # VERIFY CONTAINER GATEWAY PACKAGE
    # --------------------------------------------------------------------------

    - name: Check whether Container Gateway package is installed
      ansible.builtin.command:
        cmd: rpm -q tfm-rubygem-smart_proxy_container_gateway
      register: container_gateway_installed
      changed_when: false
      failed_when: false

    - name: Check whether Container Gateway package is available
      ansible.builtin.command:
        cmd: yum list available tfm-rubygem-smart_proxy_container_gateway
      register: container_gateway_available
      changed_when: false
      failed_when: false
      when: container_gateway_installed.rc != 0

    - name: Fail when Container Gateway package cannot be found
      ansible.builtin.fail:
        msg: |
          Required package is not installed and cannot be found in the
          enabled repositories:

          tfm-rubygem-smart_proxy_container_gateway

          GTK repository:
          {{ gtk_repo_baseurl }}

          Mesa repository:
          {{ mesa_repo_baseurl }}

          Check the repository URLs and confirm the RPM exists.
      when:
        - container_gateway_installed.rc != 0
        - container_gateway_available.rc != 0

    - name: Install Smart Proxy Container Gateway package
      ansible.builtin.yum:
        name: tfm-rubygem-smart_proxy_container_gateway
        state: present
        disable_gpg_check: true
      when: container_gateway_installed.rc != 0

    # --------------------------------------------------------------------------
    # VERIFY PACKAGE INSTALLATION
    # --------------------------------------------------------------------------

    - name: Verify Smart Proxy Container Gateway package
      ansible.builtin.command:
        cmd: rpm -q tfm-rubygem-smart_proxy_container_gateway
      register: container_gateway_final
      changed_when: false

    - name: Display installed Container Gateway package
      ansible.builtin.debug:
        msg: "{{ container_gateway_final.stdout }}"

    # --------------------------------------------------------------------------
    # INSTALL REQUIRED FOREMAN PACKAGES
    # --------------------------------------------------------------------------

    - name: Install Foreman Smart Proxy installer packages
      ansible.builtin.yum:
        name:
          - foreman-installer
          - foreman-installer-katello
        state: present
        disable_gpg_check: true

    # --------------------------------------------------------------------------
    # CHECK CURRENT FOREMAN PROXY STATUS
    # --------------------------------------------------------------------------

    - name: Check whether Foreman Proxy service is already active
      ansible.builtin.command:
        cmd: systemctl is-active foreman-proxy
      register: foreman_proxy_status
      changed_when: false
      failed_when: false

    - name: Display current Foreman Proxy status
      ansible.builtin.debug:
        msg: "Current foreman-proxy status: {{ foreman_proxy_status.stdout | default('not installed') }}"

    # --------------------------------------------------------------------------
    # INSTALL SMART PROXY CONTENT
    # --------------------------------------------------------------------------

    - name: Install Foreman Smart Proxy Content
      ansible.builtin.command:
        argv:
          - foreman-installer
          - --scenario
          - foreman-proxy-content
          - --certs-tar-file
          - "{{ proxy_certs_tar }}"
          - --foreman-proxy-register-in-foreman
          - "true"
          - --foreman-proxy-foreman-base-url
          - "{{ foreman_base_url }}"
          - --foreman-proxy-trusted-hosts
          - "{{ foreman_server_name }}"
          - --foreman-proxy-trusted-hosts
          - "{{ foreman_proxy_name }}"
      register: smart_proxy_install
      changed_when: true
      when: foreman_proxy_status.stdout != "active"

    - name: Display Smart Proxy installer output
      ansible.builtin.debug:
        var: smart_proxy_install.stdout_lines
      when:
        - smart_proxy_install is defined
        - foreman_proxy_status.stdout != "active"

    # --------------------------------------------------------------------------
    # VERIFY TFTP CONFIGURATION DIRECTORY
    # --------------------------------------------------------------------------

    - name: Ensure TFTP root exists
      ansible.builtin.file:
        path: "{{ tftp_root }}"
        state: directory
        owner: foreman-proxy
        group: foreman-proxy
        mode: "0755"

    - name: Configure Foreman Proxy TFTP root
      ansible.builtin.lineinfile:
        path: /etc/foreman-proxy/settings.d/tftp.yml
        regexp: '^:tftproot:'
        line: ":tftproot: {{ tftp_root }}"
        create: true
        owner: root
        group: root
        mode: "0644"
      notify: Restart Foreman Proxy

    # --------------------------------------------------------------------------
    # ENABLE FOREMAN PROXY
    # --------------------------------------------------------------------------

    - name: Enable and start Foreman Smart Proxy
      ansible.builtin.systemd:
        name: foreman-proxy
        enabled: true
        state: started

    - name: Apply Smart Proxy configuration changes
      ansible.builtin.meta: flush_handlers

    # --------------------------------------------------------------------------
    # FINAL VALIDATION
    # --------------------------------------------------------------------------

    - name: Verify Foreman Smart Proxy service
      ansible.builtin.command:
        cmd: systemctl is-active foreman-proxy
      register: final_proxy_status
      changed_when: false
      failed_when: false

    - name: Fail when Foreman Smart Proxy is not active
      ansible.builtin.fail:
        msg: |
          Foreman Smart Proxy installation did not complete successfully.

          Service status:
          {{ final_proxy_status.stdout }}

          Check:
          systemctl status foreman-proxy
          journalctl -u foreman-proxy -n 100 --no-pager
          tail -100 /var/log/foreman-installer/foreman-proxy-content.log
      when: final_proxy_status.stdout != "active"

    - name: Display Smart Proxy installation completion
      ansible.builtin.debug:
        msg: |
          ============================================================
          SMART PROXY INSTALLATION COMPLETED SUCCESSFULLY
          ============================================================

          Foreman Server : {{ foreman_server_name }}
          Smart Proxy    : {{ foreman_proxy_name }}
          Foreman URL    : {{ foreman_base_url }}

          Certificate:
          {{ proxy_certs_tar }}

          TFTP Root:
          {{ tftp_root }}

          Proxy Status:
          {{ final_proxy_status.stdout }}

          ============================================================

  handlers:

    - name: Restart Foreman Proxy
      ansible.builtin.systemd:
        name: foreman-proxy
        enabled: true
        state: restarted


# ==============================================================================
# PLAY 3
# CLEAN TEMPORARY CERTIFICATE FROM ANSIBLE CONTROLLER
# ==============================================================================

- name: Clean temporary certificate from Ansible controller
  hosts: all
  gather_facts: false

  vars:
    foreman_server_name: "cent-07-01.vgs.com"
    local_proxy_certs_tar: "/tmp/cent-07-02.vgs.com-certs.tar"

  tasks:

    - name: Skip hosts except Foreman server for cleanup
      ansible.builtin.meta: end_host
      when: inventory_hostname != foreman_server_name

    - name: Remove temporary Smart Proxy certificate from Ansible controller
      ansible.builtin.file:
        path: "{{ local_proxy_certs_tar }}"
        state: absent
      delegate_to: localhost
      become: false

    - name: Display cleanup completion
      ansible.builtin.debug:
        msg: |
          Temporary Smart Proxy certificate removed from Ansible controller:
          {{ local_proxy_certs_tar }}
