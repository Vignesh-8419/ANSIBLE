---
# ==============================================================================
# FOREMAN / KATELLO SMART PROXY COMPLETE INSTALLATION
#
# FLOW:
#
#   Ansible Controller
#          |
#          | SSH / Ansible
#          v
#   cent-07-01.vgs.com
#   FOREMAN + KATELLO
#          |
#          | 1. Generate Smart Proxy certificates
#          | 2. /root/cent-07-02.vgs.com-certs.tar
#          |
#          v
#   Ansible Controller
#          |
#          | 3. Fetch certificate archive temporarily
#          |
#          v
#   cent-07-02.vgs.com
#   SMART PROXY
#          |
#          | 4. Copy certificate archive
#          | 5. Install foreman-proxy-content
#          | 6. Register automatically in Foreman
#          v
#       COMPLETED
#
# RUN:
#
# ansible-playbook -i centos-07-servers_inventory.yml foreman_proxy.yml \
#   -e ansible_python_interpreter=/usr/bin/python3 \
#   -u admin
#
# ==============================================================================


# ==============================================================================
# PLAY 1
# GENERATE SMART PROXY CERTIFICATE ON FOREMAN/KATELLO SERVER
# ==============================================================================

- name: Generate Smart Proxy certificate on Foreman server
  hosts: foreman
  become: true
  gather_facts: true

  vars:

    # --------------------------------------------------------------------------
    # FOREMAN SERVER
    # --------------------------------------------------------------------------

    foreman_server_name: "cent-07-01.vgs.com"


    # --------------------------------------------------------------------------
    # SMART PROXY SERVER
    # --------------------------------------------------------------------------

    foreman_proxy_name: "cent-07-02.vgs.com"


    # --------------------------------------------------------------------------
    # CERTIFICATE PATH
    #
    # This is created ON cent-07-01.vgs.com
    # --------------------------------------------------------------------------

    foreman_proxy_certs_tar: "/root/cent-07-02.vgs.com-certs.tar"


    # --------------------------------------------------------------------------
    # TEMPORARY LOCAL CONTROLLER PATH
    #
    # This is created temporarily on the Ansible controller.
    # --------------------------------------------------------------------------

    local_proxy_certs_tar: "/tmp/cent-07-02.vgs.com-certs.tar"


  tasks:

    # ==========================================================================
    # VERIFY THIS IS THE CORRECT FOREMAN SERVER
    # ==========================================================================

    - name: Display Foreman server
      ansible.builtin.debug:
        msg:
          - "Foreman server: {{ inventory_hostname }}"
          - "Expected Foreman server: {{ foreman_server_name }}"
          - "Smart Proxy: {{ foreman_proxy_name }}"


    # ==========================================================================
    # CHECK REQUIRED COMMAND
    # ==========================================================================

    - name: Check foreman-proxy-certs-generate command
      ansible.builtin.command:
        cmd: which foreman-proxy-certs-generate
      register: proxy_certs_command
      changed_when: false


    - name: Display certificate generation command
      ansible.builtin.debug:
        msg: "{{ proxy_certs_command.stdout }}"


    # ==========================================================================
    # CHECK EXISTING CERTIFICATE
    # ==========================================================================

    - name: Check whether Smart Proxy certificate already exists
      ansible.builtin.stat:
        path: "{{ foreman_proxy_certs_tar }}"
      register: existing_proxy_certificate


    - name: Display existing certificate status
      ansible.builtin.debug:
        msg: >
          Certificate exists: {{ existing_proxy_certificate.stat.exists }}


    # ==========================================================================
    # GENERATE CERTIFICATE
    # ==========================================================================

    - name: Generate Smart Proxy certificate archive
      ansible.builtin.command:
        argv:
          - foreman-proxy-certs-generate
          - --foreman-proxy-fqdn
          - "{{ foreman_proxy_name }}"
          - --certs-tar
          - "{{ foreman_proxy_certs_tar }}"
      register: proxy_certificate_generation
      changed_when: true
      when: not existing_proxy_certificate.stat.exists


    # ==========================================================================
    # DISPLAY CERTIFICATE GENERATION OUTPUT
    # ==========================================================================

    - name: Display certificate generation output
      ansible.builtin.debug:
        var: proxy_certificate_generation.stdout_lines
      when:
        - not existing_proxy_certificate.stat.exists
        - proxy_certificate_generation is defined


    # ==========================================================================
    # VERIFY CERTIFICATE AFTER GENERATION
    # ==========================================================================

    - name: Verify Smart Proxy certificate archive
      ansible.builtin.stat:
        path: "{{ foreman_proxy_certs_tar }}"
      register: generated_proxy_certificate


    - name: Fail when Smart Proxy certificate was not created
      ansible.builtin.fail:
        msg: |
          Smart Proxy certificate archive was not created.

          Expected location on Foreman server:

          {{ foreman_proxy_certs_tar }}

          Check:

          cat /tmp/cent-07-02-certs-generate.out
      when: not generated_proxy_certificate.stat.exists


    - name: Display Smart Proxy certificate information
      ansible.builtin.debug:
        msg:
          - "SUCCESS: Smart Proxy certificate archive exists"
          - "Foreman server: {{ inventory_hostname }}"
          - "Certificate: {{ foreman_proxy_certs_tar }}"
          - "Size: {{ generated_proxy_certificate.stat.size }} bytes"


    # ==========================================================================
    # FETCH CERTIFICATE FROM FOREMAN TO ANSIBLE CONTROLLER
    #
    # IMPORTANT:
    # This task runs against cent-07-01.
    # The file is transferred to the controller.
    # ==========================================================================

    - name: Fetch Smart Proxy certificate to Ansible controller
      ansible.builtin.fetch:
        src: "{{ foreman_proxy_certs_tar }}"
        dest: "{{ local_proxy_certs_tar }}"
        flat: true


    # ==========================================================================
    # VERIFY CONTROLLER COPY
    # ==========================================================================

    - name: Check fetched certificate on Ansible controller
      ansible.builtin.stat:
        path: "{{ local_proxy_certs_tar }}"
      delegate_to: localhost
      become: false
      register: controller_proxy_certificate


    - name: Fail when certificate was not fetched to controller
      ansible.builtin.fail:
        msg: |
          Certificate archive was generated on Foreman but was not fetched
          successfully to the Ansible controller.

          Expected controller path:

          {{ local_proxy_certs_tar }}
      when: not controller_proxy_certificate.stat.exists


    - name: Display certificate transfer success
      ansible.builtin.debug:
        msg:
          - "Certificate generated on: {{ foreman_server_name }}"
          - "Certificate source: {{ foreman_proxy_certs_tar }}"
          - "Certificate successfully fetched to Ansible controller"
          - "Controller temporary path: {{ local_proxy_certs_tar }}"


# ==============================================================================
# PLAY 2
# INSTALL AND CONFIGURE SMART PROXY ON cent-07-02
# ==============================================================================

- name: Install and configure Foreman Smart Proxy
  hosts: foreman_proxy
  become: true
  gather_facts: true

  vars:

    # --------------------------------------------------------------------------
    # FOREMAN SERVER
    # --------------------------------------------------------------------------

    foreman_server_name: "cent-07-01.vgs.com"
    foreman_base_url: "https://cent-07-01.vgs.com"


    # --------------------------------------------------------------------------
    # SMART PROXY
    # --------------------------------------------------------------------------

    foreman_proxy_name: "cent-07-02.vgs.com"


    # --------------------------------------------------------------------------
    # DOMAIN
    # --------------------------------------------------------------------------

    domain: "vgs.com"


    # --------------------------------------------------------------------------
    # NETWORK
    # --------------------------------------------------------------------------

    dns_server: "192.168.253.1"
    dhcp_gateway: "192.168.253.2"


    # --------------------------------------------------------------------------
    # REPOSITORY
    # --------------------------------------------------------------------------

    repo_root: "http://http-server-01.vgs.com/repo"


    # --------------------------------------------------------------------------
    # CERTIFICATE
    # --------------------------------------------------------------------------

    local_proxy_certs_tar: "/tmp/cent-07-02.vgs.com-certs.tar"

    proxy_certs_tar: "/root/cent-07-02.vgs.com-certs.tar"


    # --------------------------------------------------------------------------
    # TFTP
    # --------------------------------------------------------------------------

    tftp_root: "/var/lib/tftpboot"


  tasks:

    # ==========================================================================
    # DISPLAY PROXY INFORMATION
    # ==========================================================================

    - name: Display Smart Proxy configuration
      ansible.builtin.debug:
        msg:
          - "Smart Proxy server: {{ inventory_hostname }}"
          - "Expected Smart Proxy: {{ foreman_proxy_name }}"
          - "Foreman server: {{ foreman_server_name }}"
          - "Certificate source on controller: {{ local_proxy_certs_tar }}"
          - "Certificate destination: {{ proxy_certs_tar }}"


    # ==========================================================================
    # VERIFY CERTIFICATE ON CONTROLLER
    # ==========================================================================

    - name: Check certificate on Ansible controller
      ansible.builtin.stat:
        path: "{{ local_proxy_certs_tar }}"
      delegate_to: localhost
      become: false
      register: controller_certificate_check


    - name: Fail when certificate does not exist on controller
      ansible.builtin.fail:
        msg: |
          Smart Proxy certificate does not exist on the Ansible controller.

          Expected:

          {{ local_proxy_certs_tar }}

          Certificate generation on {{ foreman_server_name }}
          must complete before installing the Smart Proxy.
      when: not controller_certificate_check.stat.exists


    # ==========================================================================
    # DETECT NETWORK INTERFACE
    # ==========================================================================

    - name: Detect default network interface
      ansible.builtin.set_fact:
        detected_interface: "{{ ansible_default_ipv4.interface | default('') }}"


    - name: Detect fallback network interface
      ansible.builtin.set_fact:
        detected_interface: "{{ ansible_interfaces | reject('match', '^lo$') | reject('match', '^docker.*') | reject('match', '^virbr.*') | list | first }}"
      when: detected_interface | length == 0


    - name: Set Smart Proxy network interface
      ansible.builtin.set_fact:
        smart_proxy_interface: "{{ detected_interface }}"


    - name: Fail when interface cannot be detected
      ansible.builtin.fail:
        msg: "Unable to detect a usable network interface."
      when: smart_proxy_interface | length == 0


    - name: Display detected interface
      ansible.builtin.debug:
        msg: "Detected Smart Proxy interface: {{ smart_proxy_interface }}"


    # ==========================================================================
    # COPY CERTIFICATE
    # ==========================================================================

    - name: Copy Smart Proxy certificate from controller to proxy
      ansible.builtin.copy:
        src: "{{ local_proxy_certs_tar }}"
        dest: "{{ proxy_certs_tar }}"
        owner: root
        group: root
        mode: "0600"


    - name: Verify Smart Proxy certificate on proxy server
      ansible.builtin.stat:
        path: "{{ proxy_certs_tar }}"
      register: proxy_certificate_check


    - name: Fail when certificate was not copied to Smart Proxy
      ansible.builtin.fail:
        msg: |
          Certificate was not copied successfully.

          Expected:

          {{ proxy_certs_tar }}
      when: not proxy_certificate_check.stat.exists


    - name: Display copied certificate information
      ansible.builtin.debug:
        msg:
          - "Certificate copied successfully"
          - "Proxy server: {{ inventory_hostname }}"
          - "Certificate: {{ proxy_certs_tar }}"
          - "Size: {{ proxy_certificate_check.stat.size }} bytes"


    # ==========================================================================
    # INSTALL KATELLO CA CONSUMER
    # ==========================================================================

    - name: Check Katello CA consumer package
      ansible.builtin.command:
        cmd: rpm -q katello-ca-consumer
      register: katello_ca_check
      changed_when: false
      failed_when: false


    - name: Install Katello CA consumer
      ansible.builtin.yum:
        name: "{{ foreman_base_url }}/pub/katello-ca-consumer-latest.noarch.rpm"
        state: present
        disable_gpg_check: true
      when: katello_ca_check.rc != 0


    # ==========================================================================
    # INSTALL REQUIRED PROXY PACKAGES
    # ==========================================================================

    - name: Install Foreman installer Katello packages
      ansible.builtin.yum:
        name:
          - foreman-installer
          - foreman-installer-katello
        state: present
        disable_gpg_check: true


    - name: Install Smart Proxy related packages
      ansible.builtin.yum:
        name:
          - bind
          - bind-utils
          - dhcp
          - tftp-server
        state: present
        disable_gpg_check: true


    # ==========================================================================
    # CHECK SMART PROXY INSTALLATION STATUS
    # ==========================================================================

    - name: Check whether Foreman Proxy is already installed
      ansible.builtin.command:
        cmd: systemctl is-active foreman-proxy
      register: foreman_proxy_status
      changed_when: false
      failed_when: false


    # ==========================================================================
    # INSTALL SMART PROXY
    #
    # The certificate archive contains the OAuth credentials generated by
    # foreman-proxy-certs-generate.
    #
    # ==========================================================================

    - name: Install Foreman Smart Proxy Content
      ansible.builtin.command:
        argv:
          - foreman-installer
          - --scenario
          - foreman-proxy-content
          - --certs-tar-file
          - "{{ proxy_certs_tar }}"
          - --foreman-proxy-register-in-foreman
          - "true"
          - --foreman-proxy-foreman-base-url
          - "{{ foreman_base_url }}"
          - --foreman-proxy-trusted-hosts
          - "{{ foreman_server_name }}"
          - --foreman-proxy-trusted-hosts
          - "{{ foreman_proxy_name }}"
      register: smart_proxy_install
      changed_when: true
      when: foreman_proxy_status.rc != 0


    - name: Display Smart Proxy installation output
      ansible.builtin.debug:
        var: smart_proxy_install.stdout_lines
      when:
        - smart_proxy_status.rc != 0
        - smart_proxy_install is defined


    # ==========================================================================
    # CONFIGURE TFTP
    # ==========================================================================

    - name: Ensure TFTP root exists
      ansible.builtin.file:
        path: "{{ tftp_root }}"
        state: directory
        owner: foreman-proxy
        group: foreman-proxy
        mode: "0755"


    - name: Configure Foreman Proxy TFTP root
      ansible.builtin.lineinfile:
        path: /etc/foreman-proxy/settings.d/tftp.yml
        regexp: '^\:tftproot:'
        line: ":tftproot: {{ tftp_root }}"
        create: true
        owner: root
        group: root
        mode: "0644"
      notify: Restart Foreman Proxy


    # ==========================================================================
    # CONFIGURE FIREWALL
    # ==========================================================================

    - name: Open DHCP firewall service
      ansible.posix.firewalld:
        service: dhcp
        permanent: true
        immediate: true
        state: enabled


    - name: Open TFTP firewall service
      ansible.posix.firewalld:
        service: tftp
        permanent: true
        immediate: true
        state: enabled


    - name: Open HTTP firewall service
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled


    - name: Open HTTPS firewall service
      ansible.posix.firewalld:
        service: https
        permanent: true
        immediate: true
        state: enabled


    - name: Open Puppet firewall port
      ansible.posix.firewalld:
        port: 8140/tcp
        permanent: true
        immediate: true
        state: enabled


    - name: Open Smart Proxy firewall port
      ansible.posix.firewalld:
        port: 9090/tcp
        permanent: true
        immediate: true
        state: enabled


    # ==========================================================================
    # ENABLE AND START SMART PROXY
    # ==========================================================================

    - name: Enable and start Foreman Smart Proxy
      ansible.builtin.systemd:
        name: foreman-proxy
        enabled: true
        state: started


    - name: Restart Foreman Smart Proxy after configuration
      ansible.builtin.meta: flush_handlers


    # ==========================================================================
    # VERIFY SMART PROXY
    # ==========================================================================

    - name: Check Foreman Smart Proxy service
      ansible.builtin.command:
        cmd: systemctl is-active foreman-proxy
      register: final_proxy_status
      changed_when: false


    - name: Get Foreman Smart Proxy service status
      ansible.builtin.command:
        cmd: systemctl --no-pager --full status foreman-proxy
      register: final_proxy_service_status
      changed_when: false
      failed_when: false


    - name: Display final Smart Proxy service status
      ansible.builtin.debug:
        var: final_proxy_service_status.stdout_lines


    - name: Fail when Foreman Smart Proxy is not running
      ansible.builtin.fail:
        msg: |
          Foreman Smart Proxy installation completed but the service is not active.

          Run on {{ inventory_hostname }}:

          systemctl status foreman-proxy
          journalctl -u foreman-proxy -n 100 --no-pager
      when: final_proxy_status.stdout != "active"


    - name: Smart Proxy installation completed
      ansible.builtin.debug:
        msg: |
          ============================================================
          FOREMAN SMART PROXY INSTALLATION COMPLETED
          ============================================================

          Foreman Server : {{ foreman_server_name }}
          Smart Proxy    : {{ foreman_proxy_name }}

          Certificate Flow:

          {{ foreman_server_name }}
              /root/cent-07-02.vgs.com-certs.tar
                         |
                         v
                 Ansible Controller
                         |
                         v
          {{ foreman_proxy_name }}
              {{ proxy_certs_tar }}

          Foreman Proxy Service: {{ final_proxy_status.stdout }}

          TFTP Root: {{ tftp_root }}

          ============================================================


# ==============================================================================
# PLAY 3
# CLEAN UP TEMPORARY CERTIFICATE FROM CONTROLLER
# ==============================================================================

- name: Clean temporary Smart Proxy certificate from controller
  hosts: foreman
  gather_facts: false

  vars:
    local_proxy_certs_tar: "/tmp/cent-07-02.vgs.com-certs.tar"

  tasks:

    - name: Remove temporary certificate from Ansible controller
      ansible.builtin.file:
        path: "{{ local_proxy_certs_tar }}"
        state: absent
      delegate_to: localhost
      become: false


    - name: Display cleanup result
      ansible.builtin.debug:
        msg: "Temporary certificate removed from Ansible controller."


  handlers:

    - name: Restart Foreman Proxy
      ansible.builtin.systemd:
        name: foreman-proxy
        state: restarted
        enabled: true
