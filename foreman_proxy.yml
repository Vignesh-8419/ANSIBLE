---
# ==============================================================================
# Foreman Smart Proxy
# DHCP + DNS + TFTP + Connectivity + Verification + Registration
#
# Run:
# ansible-playbook -i inventory.ini foreman_smart_proxy.yml
#
# Hosts:
#   cent-07-01.vgs.com = Foreman Server
#   cent-07-02.vgs.com = Smart Proxy
# ==============================================================================


# ==============================================================================
# PLAY 1 - CONFIGURE AND VERIFY SMART PROXY SERVICES
# ==============================================================================

- name: Configure and verify Foreman Smart Proxy services
  hosts: all
  become: true
  gather_facts: true

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"
    smart_proxy_port: 9090

    dhcp_interface: "ens33"
    dhcp_subnet: "192.168.253.0"
    dhcp_netmask: "255.255.255.0"
    dhcp_range_start: "192.168.253.150"
    dhcp_range_end: "192.168.253.200"
    dhcp_gateway: "192.168.253.2"

    dns_server: "192.168.253.132"
    dns_domain: "vgs.com"

    tftp_root: "/var/lib/tftpboot"

  tasks:

    # ==========================================================================
    # HOST INFORMATION
    # ==========================================================================

    - name: Display current host
      ansible.builtin.debug:
        msg: "Processing host: {{ inventory_hostname }}"

    - name: Display skipped host message
      ansible.builtin.debug:
        msg: "No Smart Proxy service configuration required on this host."
      when: inventory_hostname != smart_proxy_server


    # ==========================================================================
    # VERIFY SMART PROXY SERVICE
    # ==========================================================================

    - name: Gather service facts
      ansible.builtin.service_facts:
      when: inventory_hostname == smart_proxy_server

    - name: Verify foreman-proxy package service exists
      ansible.builtin.assert:
        that:
          - "'foreman-proxy.service' in ansible_facts.services"
        fail_msg: "foreman-proxy.service is not installed on {{ smart_proxy_server }}"
        success_msg: "foreman-proxy.service is installed."
      when: inventory_hostname == smart_proxy_server

    - name: Enable and start Foreman Proxy
      ansible.builtin.systemd:
        name: foreman-proxy
        enabled: true
        state: started
      when: inventory_hostname == smart_proxy_server

    - name: Wait for Foreman Proxy to become active
      ansible.builtin.command:
        cmd: systemctl is-active foreman-proxy
      register: foreman_proxy_service
      changed_when: false
      retries: 12
      delay: 5
      until: foreman_proxy_service.stdout == "active"
      when: inventory_hostname == smart_proxy_server

    - name: Verify Foreman Proxy is active
      ansible.builtin.assert:
        that:
          - foreman_proxy_service.stdout == "active"
        fail_msg: "foreman-proxy is not active."
        success_msg: "foreman-proxy is active."
      when: inventory_hostname == smart_proxy_server


    # ==========================================================================
    # DHCP PACKAGE AND CONFIGURATION
    # ==========================================================================

    - name: Check DHCP server package
      ansible.builtin.command:
        cmd: rpm -q dhcp
      register: dhcp_package
      changed_when: false
      failed_when: false
      when: inventory_hostname == smart_proxy_server

    - name: Install DHCP server package when missing
      ansible.builtin.yum:
        name: dhcp
        state: present
      when:
        - inventory_hostname == smart_proxy_server
        - dhcp_package.rc != 0

    - name: Check DHCP configuration file
      ansible.builtin.stat:
        path: /etc/dhcp/dhcpd.conf
      register: dhcp_conf_file
      when: inventory_hostname == smart_proxy_server

    - name: Create DHCP configuration when missing
      ansible.builtin.copy:
        dest: /etc/dhcp/dhcpd.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          authoritative;
          default-lease-time 600;
          max-lease-time 7200;

          option domain-name "{{ dns_domain }}";
          option domain-name-servers {{ dns_server }};

          subnet {{ dhcp_subnet }} netmask {{ dhcp_netmask }} {
            range {{ dhcp_range_start }} {{ dhcp_range_end }};
            option subnet-mask {{ dhcp_netmask }};
            option routers {{ dhcp_gateway }};
            option broadcast-address 192.168.253.255;
          }
      when:
        - inventory_hostname == smart_proxy_server
        - not dhcp_conf_file.stat.exists

    - name: Read current DHCP configuration
      ansible.builtin.slurp:
        src: /etc/dhcp/dhcpd.conf
      register: dhcp_conf_current
      when: inventory_hostname == smart_proxy_server

    - name: Set DHCP configuration content
      ansible.builtin.set_fact:
        dhcp_conf_text: "{{ dhcp_conf_current.content | b64decode }}"
      when: inventory_hostname == smart_proxy_server

    # --------------------------------------------------------------------------
    # IMPORTANT FIX
    # Automatically add subnet if missing instead of failing
    # --------------------------------------------------------------------------

    - name: Add DHCP subnet when missing
      ansible.builtin.blockinfile:
        path: /etc/dhcp/dhcpd.conf
        marker: "# {mark} ANSIBLE MANAGED FOREMAN DHCP SUBNET"
        block: |
          subnet {{ dhcp_subnet }} netmask {{ dhcp_netmask }} {
            range {{ dhcp_range_start }} {{ dhcp_range_end }};
            option subnet-mask {{ dhcp_netmask }};
            option routers {{ dhcp_gateway }};
            option broadcast-address 192.168.253.255;
          }
      when:
        - inventory_hostname == smart_proxy_server
        - dhcp_conf_text is not search('subnet ' ~ dhcp_subnet ~ ' netmask ' ~ dhcp_netmask)

    - name: Ensure DHCP server is authoritative
      ansible.builtin.lineinfile:
        path: /etc/dhcp/dhcpd.conf
        regexp: '^authoritative;'
        line: 'authoritative;'
        insertafter: BOF
      when: inventory_hostname == smart_proxy_server

    - name: Ensure DHCP domain name exists
      ansible.builtin.lineinfile:
        path: /etc/dhcp/dhcpd.conf
        regexp: '^option domain-name '
        line: 'option domain-name "{{ dns_domain }}";'
      when: inventory_hostname == smart_proxy_server

    - name: Ensure DHCP DNS server exists
      ansible.builtin.lineinfile:
        path: /etc/dhcp/dhcpd.conf
        regexp: '^option domain-name-servers '
        line: 'option domain-name-servers {{ dns_server }};'
      when: inventory_hostname == smart_proxy_server


    # ==========================================================================
    # VERIFY DHCP CONFIGURATION BEFORE STARTING SERVICE
    # ==========================================================================

    - name: Validate DHCP configuration syntax
      ansible.builtin.command:
        cmd: dhcpd -t -cf /etc/dhcp/dhcpd.conf
      register: dhcp_syntax_check
      changed_when: false
      when: inventory_hostname == smart_proxy_server

    - name: Display DHCP syntax result
      ansible.builtin.debug:
        msg: "{{ dhcp_syntax_check.stderr_lines | default(['DHCP configuration is valid']) }}"
      when: inventory_hostname == smart_proxy_server

    - name: Fail when DHCP configuration syntax is invalid
      ansible.builtin.assert:
        that:
          - dhcp_syntax_check.rc == 0
        fail_msg: |
          DHCP configuration is invalid.

          Check:
          /etc/dhcp/dhcpd.conf

          DHCP test output:
          {{ dhcp_syntax_check.stderr | default('No error output available') }}
        success_msg: "DHCP configuration syntax is valid."
      when: inventory_hostname == smart_proxy_server

    - name: Display final DHCP configuration
      ansible.builtin.command:
        cmd: cat /etc/dhcp/dhcpd.conf
      register: final_dhcp_config
      changed_when: false
      when: inventory_hostname == smart_proxy_server

    - name: Show final DHCP configuration
      ansible.builtin.debug:
        var: final_dhcp_config.stdout_lines
      when: inventory_hostname == smart_proxy_server


    # ==========================================================================
    # CONFIGURE DHCP SERVICE INTERFACE
    # ==========================================================================

    - name: Check DHCP service default configuration
      ansible.builtin.stat:
        path: /etc/sysconfig/dhcpd
      register: dhcp_sysconfig
      when: inventory_hostname == smart_proxy_server

    - name: Configure DHCP service to listen on Smart Proxy interface
      ansible.builtin.copy:
        dest: /etc/sysconfig/dhcpd
        owner: root
        group: root
        mode: "0644"
        content: |
          DHCPDARGS={{ dhcp_interface }}
      when: inventory_hostname == smart_proxy_server


    # ==========================================================================
    # START DHCP
    # ==========================================================================

    - name: Enable and start DHCP service
      ansible.builtin.systemd:
        name: dhcpd
        enabled: true
        state: restarted
      register: dhcpd_start_result
      when: inventory_hostname == smart_proxy_server

    - name: Wait for DHCP service
      ansible.builtin.command:
        cmd: systemctl is-active dhcpd
      register: dhcp_service_status
      changed_when: false
      retries: 6
      delay: 3
      until: dhcp_service_status.stdout == "active"
      when: inventory_hostname == smart_proxy_server

    - name: Verify DHCP service is active
      ansible.builtin.assert:
        that:
          - dhcp_service_status.stdout == "active"
        fail_msg: |
          DHCP service failed to start.

          Run on {{ smart_proxy_server }}:
            systemctl status dhcpd
            journalctl -u dhcpd -n 100 --no-pager

          DHCP configuration:
            /etc/dhcp/dhcpd.conf
        success_msg: "DHCP service is active."
      when: inventory_hostname == smart_proxy_server


    # ==========================================================================
    # VERIFY DHCP IS LISTENING
    # ==========================================================================

    - name: Check DHCP UDP port 67
      ansible.builtin.command:
        cmd: ss -lunp
      register: dhcp_listening_ports
      changed_when: false
      when: inventory_hostname == smart_proxy_server

    - name: Display DHCP port listener
      ansible.builtin.debug:
        msg: "{{ dhcp_listening_ports.stdout_lines | select('search', ':67') | list }}"
      when: inventory_hostname == smart_proxy_server


    # ==========================================================================
    # DNS SERVICE
    # ==========================================================================

    - name: Check named service status
      ansible.builtin.systemd:
        name: named
      register: named_service_check
      failed_when: false
      changed_when: false
      when: inventory_hostname == smart_proxy_server

    - name: Enable and start DNS service when installed
      ansible.builtin.systemd:
        name: named
        enabled: true
        state: started
      when:
        - inventory_hostname == smart_proxy_server
        - named_service_check.status.LoadState | default('not-found') == 'loaded'

    - name: Display DNS service status
      ansible.builtin.command:
        cmd: systemctl is-active named
      register: dns_service_status
      changed_when: false
      failed_when: false
      when: inventory_hostname == smart_proxy_server

    - name: Display DNS status
      ansible.builtin.debug:
        msg: "DNS service status: {{ dns_service_status.stdout | default('not installed') }}"
      when: inventory_hostname == smart_proxy_server


    # ==========================================================================
    # TFTP
    # ==========================================================================

    - name: Check TFTP root directory
      ansible.builtin.file:
        path: "{{ tftp_root }}"
        state: directory
        owner: foreman-proxy
        group: root
        mode: "0755"
      when: inventory_hostname == smart_proxy_server

    - name: Check TFTP service status
      ansible.builtin.command:
        cmd: systemctl is-active foreman-proxy
      register: tftp_proxy_status
      changed_when: false
      when: inventory_hostname == smart_proxy_server

    - name: Verify TFTP through Foreman Proxy
      ansible.builtin.assert:
        that:
          - tftp_proxy_status.stdout == "active"
        fail_msg: "foreman-proxy is not active, therefore TFTP cannot be served."
        success_msg: "Foreman Proxy is active for TFTP provisioning."
      when: inventory_hostname == smart_proxy_server


    # ==========================================================================
    # FIREWALL
    # ==========================================================================

    - name: Gather firewalld service facts
      ansible.builtin.service_facts:
      when: inventory_hostname == smart_proxy_server

    - name: Enable and start firewalld
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started
      when:
        - inventory_hostname == smart_proxy_server
        - "'firewalld.service' in ansible_facts.services"

    - name: Allow DHCP service
      ansible.posix.firewalld:
        service: dhcp
        permanent: true
        immediate: true
        state: enabled
      when:
        - inventory_hostname == smart_proxy_server
        - "'firewalld.service' in ansible_facts.services"

    - name: Allow TFTP service
      ansible.posix.firewalld:
        service: tftp
        permanent: true
        immediate: true
        state: enabled
      when:
        - inventory_hostname == smart_proxy_server
        - "'firewalld.service' in ansible_facts.services"

    - name: Allow DNS service
      ansible.posix.firewalld:
        service: dns
        permanent: true
        immediate: true
        state: enabled
      when:
        - inventory_hostname == smart_proxy_server
        - "'firewalld.service' in ansible_facts.services"

    - name: Allow HTTP service
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled
      when:
        - inventory_hostname == smart_proxy_server
        - "'firewalld.service' in ansible_facts.services"

    - name: Allow HTTPS service
      ansible.posix.firewalld:
        service: https
        permanent: true
        immediate: true
        state: enabled
      when:
        - inventory_hostname == smart_proxy_server
        - "'firewalld.service' in ansible_facts.services"

    - name: Allow Foreman Smart Proxy API
      ansible.posix.firewalld:
        port: "{{ smart_proxy_port }}/tcp"
        permanent: true
        immediate: true
        state: enabled
      when:
        - inventory_hostname == smart_proxy_server
        - "'firewalld.service' in ansible_facts.services"


    # ==========================================================================
    # SMART PROXY API
    # ==========================================================================

    - name: Test Smart Proxy API locally
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ smart_proxy_port }}/features"
        method: GET
        validate_certs: false
        return_content: true
        status_code: 200
      register: smart_proxy_local_api
      changed_when: false
      when: inventory_hostname == smart_proxy_server

    - name: Display Smart Proxy features
      ansible.builtin.debug:
        var: smart_proxy_local_api.content
      when: inventory_hostname == smart_proxy_server


# ==============================================================================
# PLAY 2 - VERIFY FOREMAN TO SMART PROXY CONNECTIVITY
# ==============================================================================

- name: Verify Foreman connectivity to Smart Proxy
  hosts: all
  become: true
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"
    smart_proxy_port: 9090

  tasks:

    - name: Resolve Smart Proxy hostname
      ansible.builtin.command:
        cmd: "getent hosts {{ smart_proxy_server }}"
      register: smart_proxy_dns
      changed_when: false
      when: inventory_hostname == foreman_server

    - name: Verify Smart Proxy DNS resolution
      ansible.builtin.assert:
        that:
          - smart_proxy_dns.rc == 0
        fail_msg: "Foreman cannot resolve {{ smart_proxy_server }}"
        success_msg: "Foreman resolves Smart Proxy successfully."
      when: inventory_hostname == foreman_server

    - name: Test Smart Proxy TCP port
      ansible.builtin.wait_for:
        host: "{{ smart_proxy_server }}"
        port: "{{ smart_proxy_port }}"
        state: started
        timeout: 20
      when: inventory_hostname == foreman_server

    - name: Test Smart Proxy HTTPS API
      ansible.builtin.uri:
        url: "https://{{ smart_proxy_server }}:{{ smart_proxy_port }}/features"
        method: GET
        validate_certs: false
        return_content: true
        status_code: 200
      register: smart_proxy_remote_api
      changed_when: false
      when: inventory_hostname == foreman_server

    - name: Verify Foreman to Smart Proxy API
      ansible.builtin.assert:
        that:
          - smart_proxy_remote_api.status == 200
        fail_msg: "Foreman cannot communicate with Smart Proxy API."
        success_msg: "Foreman can communicate with Smart Proxy API."
      when: inventory_hostname == foreman_server


# ==============================================================================
# PLAY 3 - REGISTER SMART PROXY
# ==============================================================================

- name: Verify Smart Proxy registration in Foreman
  hosts: all
  become: true
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"
    smart_proxy_port: 9090

    hammer_username: "admin"
    hammer_password: "zqs977dXzqfEvTML"

  tasks:

    - name: Check Smart Proxy registration
      ansible.builtin.command:
        argv:
          - hammer
          - --username
          - "{{ hammer_username }}"
          - --password
          - "{{ hammer_password }}"
          - proxy
          - info
          - --name
          - "{{ smart_proxy_server }}"
      register: hammer_proxy_check
      changed_when: false
      failed_when: false
      no_log: true
      when: inventory_hostname == foreman_server

    - name: Register Smart Proxy when missing
      ansible.builtin.command:
        argv:
          - hammer
          - --username
          - "{{ hammer_username }}"
          - --password
          - "{{ hammer_password }}"
          - proxy
          - create
          - --name
          - "{{ smart_proxy_server }}"
          - --url
          - "https://{{ smart_proxy_server }}:{{ smart_proxy_port }}"
      when:
        - inventory_hostname == foreman_server
        - hammer_proxy_check.rc != 0
      no_log: true


# ==============================================================================
# PLAY 4 - FINAL SUMMARY
# ==============================================================================

- name: Display final Smart Proxy summary
  hosts: all
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"

  tasks:

    - name: Foreman summary
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "FOREMAN SMART PROXY CONFIGURATION COMPLETE"
          - "=================================================="
          - "Foreman Server : {{ foreman_server }}"
          - "Smart Proxy    : {{ smart_proxy_server }}"
          - "=================================================="
      when: inventory_hostname == foreman_server

    - name: Smart Proxy summary
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "SMART PROXY SERVICES"
          - "=================================================="
          - "DHCP Network   : 192.168.253.0/24"
          - "DHCP Range     : 192.168.253.150 - 192.168.253.200"
          - "DHCP Gateway   : 192.168.253.2"
          - "DHCP Interface : ens33"
          - "DNS            : Enabled through Smart Proxy configuration"
          - "TFTP Root      : /var/lib/tftpboot"
          - "Proxy API      : TCP/9090"
          - "=================================================="
      when: inventory_hostname == smart_proxy_server
