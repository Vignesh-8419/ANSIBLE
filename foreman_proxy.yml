---
- name: Configure Foreman Smart Proxy Features
  hosts: all
  become: true
  gather_facts: true

  vars:
    foreman_server: "cent-07-01.vgs.com"
    foreman_proxy: "cent-07-02.vgs.com"

    proxy_ssl_ca: "/etc/foreman-proxy/foreman_ssl_ca.pem"
    proxy_ssl_cert: "/etc/foreman-proxy/foreman_ssl_cert.pem"
    proxy_ssl_key: "/etc/foreman-proxy/foreman_ssl_key.pem"

    omapi_key_name: "omapi_key"
    omapi_key_file: "/etc/foreman-proxy/omapi.key"
    dns_server: "192.168.253.1"
    foreman_api_user: "admin"
    foreman_api_password: "1WXlOStnuoKR81ICzEyDzw"

  handlers:

    - name: Restart Foreman Proxy
      ansible.builtin.service:
        name: foreman-proxy
        state: restarted
        enabled: true

    - name: Restart DHCP
      ansible.builtin.service:
        name: dhcpd
        state: restarted
        enabled: true

  tasks:

    ###########################################################################
    # HOST INFORMATION
    ###########################################################################

    - name: Display Foreman infrastructure information
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "Host: {{ inventory_hostname }}"
          - "Foreman Server: {{ foreman_server }}"
          - "Smart Proxy: {{ foreman_proxy }}"
          - "=================================================="

    ###########################################################################
    # FOREMAN SERVER CERTIFICATES
    ###########################################################################

    - name: Check Foreman client certificates
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/foreman/client_cert.pem
        - /etc/foreman/client_key.pem
        - /etc/foreman/proxy_ca.pem
      register: foreman_cert_files
      when: inventory_hostname == foreman_server

    - name: Display Foreman certificate status
      ansible.builtin.debug:
        msg: "{{ item.item }} exists = {{ item.stat.exists }}"
      loop: "{{ foreman_cert_files.results }}"
      when:
        - inventory_hostname == foreman_server
        - foreman_cert_files is defined

    ###########################################################################
    # SMART PROXY CERTIFICATES
    ###########################################################################

    - name: Check Smart Proxy SSL certificates
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ proxy_ssl_ca }}"
        - "{{ proxy_ssl_cert }}"
        - "{{ proxy_ssl_key }}"
      register: proxy_cert_files
      when: inventory_hostname == foreman_proxy

    - name: Fail when Smart Proxy SSL certificate is missing
      ansible.builtin.fail:
        msg: "Required Smart Proxy SSL certificate is missing: {{ item.item }}"
      loop: "{{ proxy_cert_files.results }}"
      when:
        - inventory_hostname == foreman_proxy
        - not item.stat.exists

    - name: Display Smart Proxy certificate status
      ansible.builtin.debug:
        msg: "{{ item.item }} exists = {{ item.stat.exists }}"
      loop: "{{ proxy_cert_files.results }}"
      when:
        - inventory_hostname == foreman_proxy
        - proxy_cert_files is defined

    ###########################################################################
    # OMAPI KEY CONFIGURATION
    ###########################################################################

    - name: Check existing OMAPI key file
      ansible.builtin.stat:
        path: "{{ omapi_key_file }}"
      register: omapi_key_stat
      when: inventory_hostname == foreman_proxy

    - name: Find existing generated OMAPI private files
      ansible.builtin.find:
        paths: /tmp
        patterns: "Komapi_key.+*.private"
        file_type: file
      register: existing_omapi_private_files
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_stat.stat.exists

    - name: Generate OMAPI key when no generated private file exists
      ansible.builtin.command:
        cmd: dnssec-keygen -a HMAC-MD5 -b 128 -n HOST "{{ omapi_key_name }}"
        chdir: /tmp
      register: omapi_generate
      changed_when: true
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_stat.stat.exists
        - existing_omapi_private_files.matched | int == 0

    - name: Find generated OMAPI private files
      ansible.builtin.find:
        paths: /tmp
        patterns: "Komapi_key.+*.private"
        file_type: file
      register: generated_omapi_private_files
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_stat.stat.exists

    - name: Select OMAPI private key file
      ansible.builtin.set_fact:
        omapi_generated_private_file: >-
          {{
            (
              existing_omapi_private_files.files
              if (existing_omapi_private_files.matched | int > 0)
              else generated_omapi_private_files.files
            )
            | sort(attribute='mtime', reverse=true)
            | map(attribute='path')
            | first
          }}
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_stat.stat.exists

    - name: Fail when OMAPI private file was not found
      ansible.builtin.fail:
        msg: |
          No OMAPI private key file was found.

          Existing files:
          {{ existing_omapi_private_files.files | default([]) | map(attribute='path') | list }}

          Generated files:
          {{ generated_omapi_private_files.files | default([]) | map(attribute='path') | list }}
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_stat.stat.exists
        - omapi_generated_private_file | default('') | length == 0

    - name: Read generated OMAPI private key
      ansible.builtin.slurp:
        src: "{{ omapi_generated_private_file }}"
      register: omapi_key_content
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_stat.stat.exists

    - name: Extract OMAPI secret from generated private key
      ansible.builtin.shell: |
        printf '%s\n' '{{ omapi_key_content.content | b64decode }}' | \
        awk '/^Key:[[:space:]]*/ {sub(/^Key:[[:space:]]*/, ""); print; exit}'
      args:
        executable: /bin/bash
      register: omapi_secret_result
      changed_when: false
      no_log: true
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_stat.stat.exists

    - name: Set OMAPI secret fact
      ansible.builtin.set_fact:
        omapi_secret: "{{ omapi_secret_result.stdout | trim }}"
      no_log: true
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_stat.stat.exists

    - name: Fail when OMAPI secret could not be extracted
      ansible.builtin.fail:
        msg: |
          OMAPI secret extraction failed.

          Private key file:
          {{ omapi_generated_private_file }}

          Expected a line similar to:
          Key: <OMAPI_SECRET>
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_stat.stat.exists
        - omapi_secret | default('') | length == 0

    - name: Display OMAPI secret extraction status
      ansible.builtin.debug:
        msg: "OMAPI secret successfully extracted from {{ omapi_generated_private_file }}"
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_stat.stat.exists
        - omapi_secret | default('') | length > 0

    - name: Create OMAPI key file
      ansible.builtin.copy:
        dest: "{{ omapi_key_file }}"
        owner: root
        group: foreman-proxy
        mode: "0640"
        content: |
          key "{{ omapi_key_name }}" {
            algorithm hmac-md5;
            secret "{{ omapi_secret }}";
          };
      no_log: true
      notify:
        - Restart DHCP
        - Restart Foreman Proxy
      when:
        - inventory_hostname == foreman_proxy
        - not omapi_key_stat.stat.exists
        - omapi_secret | default('') | length > 0

    - name: Ensure OMAPI key file has correct permissions
      ansible.builtin.file:
        path: "{{ omapi_key_file }}"
        owner: root
        group: foreman-proxy
        mode: "0640"
      when: inventory_hostname == foreman_proxy

    ###########################################################################
    # DHCP CONFIGURATION
    ###########################################################################

    - name: Enable DHCP feature in Foreman Smart Proxy
      ansible.builtin.copy:
        dest: /etc/foreman-proxy/settings.d/dhcp.yml
        owner: root
        group: foreman-proxy
        mode: "0640"
        content: |
          ---
          :enabled: true
          :use_provider: dhcp_isc
          :server: 127.0.0.1
          :ping_free_ip: true
      notify: Restart Foreman Proxy
      when: inventory_hostname == foreman_proxy

    - name: Configure ISC DHCP provider
      ansible.builtin.copy:
        dest: /etc/foreman-proxy/settings.d/dhcp_isc.yml
        owner: root
        group: foreman-proxy
        mode: "0640"
        content: |
          ---
          :config: /etc/dhcp/dhcpd.conf
          :leases: /var/lib/dhcpd/dhcpd.leases
          :key_name: {{ omapi_key_name }}
          :key_secret: "{{ omapi_secret }}"
          :omapi_port: 7911
      notify: Restart Foreman Proxy
      when:
        - inventory_hostname == foreman_proxy
        - omapi_secret | default('') | length > 0

    - name: Ensure DHCP leases directory exists
      ansible.builtin.file:
        path: /var/lib/dhcpd
        state: directory
        owner: root
        group: foreman-proxy
        mode: "0750"
      when: inventory_hostname == foreman_proxy

    - name: Ensure DHCP leases file exists
      ansible.builtin.file:
        path: /var/lib/dhcpd/dhcpd.leases
        state: touch
        owner: root
        group: foreman-proxy
        mode: "0640"
      when: inventory_hostname == foreman_proxy

    ###########################################################################
    # DNS CONFIGURATION
    ###########################################################################

    - name: Check whether DNS key exists
      ansible.builtin.stat:
        path: /etc/foreman-proxy/dns.key
      register: dns_key_stat
      when: inventory_hostname == foreman_proxy

    - name: Configure DNS feature only when DNS TSIG key exists
      ansible.builtin.copy:
        dest: /etc/foreman-proxy/settings.d/dns.yml
        owner: root
        group: foreman-proxy
        mode: "0640"
        content: |
          ---
          :enabled: true
          :use_provider: dns_nsupdate
          :dns_ttl: 86400
      notify: Restart Foreman Proxy
      when:
        - inventory_hostname == foreman_proxy
        - dns_key_stat.stat.exists

    - name: Configure DNS nsupdate provider only when DNS key exists
      ansible.builtin.copy:
        dest: /etc/foreman-proxy/settings.d/dns_nsupdate.yml
        owner: root
        group: foreman-proxy
        mode: "0640"
        content: |
          ---
          :dns_key: /etc/foreman-proxy/dns.key
          :dns_server: "{{ dns_server }}"
      notify: Restart Foreman Proxy
      when:
        - inventory_hostname == foreman_proxy
        - dns_key_stat.stat.exists

    - name: Disable DNS feature when DNS key does not exist
      ansible.builtin.copy:
        dest: /etc/foreman-proxy/settings.d/dns.yml
        owner: root
        group: foreman-proxy
        mode: "0640"
        content: |
          ---
          :enabled: false
          :use_provider: dns_nsupdate
          :dns_ttl: 86400
      notify: Restart Foreman Proxy
      when:
        - inventory_hostname == foreman_proxy
        - not dns_key_stat.stat.exists

    - name: Remove DNS nsupdate provider configuration when DNS key does not exist
      ansible.builtin.file:
        path: /etc/foreman-proxy/settings.d/dns_nsupdate.yml
        state: absent
      notify: Restart Foreman Proxy
      when:
        - inventory_hostname == foreman_proxy
        - not dns_key_stat.stat.exists

    - name: Display DNS configuration status
      ansible.builtin.debug:
        msg: >-
          DNS feature is
          {{ 'enabled using dns_nsupdate' if dns_key_stat.stat.exists else
             'disabled because /etc/foreman-proxy/dns.key does not exist' }}
      when: inventory_hostname == foreman_proxy

    ###########################################################################
    # TFTP CONFIGURATION
    ###########################################################################

    - name: Create TFTP root directory
      ansible.builtin.file:
        path: /var/lib/tftpboot
        state: directory
        owner: foreman-proxy
        group: foreman-proxy
        mode: "0755"
      when: inventory_hostname == foreman_proxy

    - name: Enable TFTP feature in Foreman Smart Proxy
      ansible.builtin.copy:
        dest: /etc/foreman-proxy/settings.d/tftp.yml
        owner: root
        group: foreman-proxy
        mode: "0640"
        content: |
          ---
          :enabled: true
          :tftproot: /var/lib/tftpboot
      notify: Restart Foreman Proxy
      when: inventory_hostname == foreman_proxy

    ###########################################################################
    # DHCP AND PROXY PERMISSIONS
    ###########################################################################

    - name: Ensure foreman-proxy can read DHCP configuration
      ansible.builtin.file:
        path: /etc/dhcp/dhcpd.conf
        owner: root
        group: foreman-proxy
        mode: "0640"
      when: inventory_hostname == foreman_proxy

    - name: Ensure foreman-proxy can read DHCP leases
      ansible.builtin.file:
        path: /var/lib/dhcpd/dhcpd.leases
        owner: root
        group: foreman-proxy
        mode: "0640"
      when: inventory_hostname == foreman_proxy

    ###########################################################################
    # RESTART SERVICES
    ###########################################################################

    - name: Flush handlers before verification
      ansible.builtin.meta: flush_handlers

    - name: Enable and restart Foreman Proxy
      ansible.builtin.service:
        name: foreman-proxy
        state: restarted
        enabled: true
      when: inventory_hostname == foreman_proxy

    - name: Enable and restart DHCP service
      ansible.builtin.service:
        name: dhcpd
        state: restarted
        enabled: true
      when: inventory_hostname == foreman_proxy

    ###########################################################################
    # VERIFY SMART PROXY FEATURES
    ###########################################################################

    - name: Wait for Smart Proxy HTTPS port
      ansible.builtin.wait_for:
        host: "{{ foreman_proxy }}"
        port: 9090
        delay: 2
        timeout: 60
        state: started
      when: inventory_hostname == foreman_proxy

    - name: Get Smart Proxy enabled features locally
      ansible.builtin.command:
        cmd: >
          curl --silent --show-error
          --fail
          --cacert {{ proxy_ssl_ca }}
          --cert {{ proxy_ssl_cert }}
          --key {{ proxy_ssl_key }}
          https://{{ foreman_proxy }}:9090/v2/features
      register: proxy_features
      changed_when: false
      when: inventory_hostname == foreman_proxy

    - name: Display Smart Proxy features
      ansible.builtin.debug:
        var: proxy_features.stdout
      when: inventory_hostname == foreman_proxy

    - name: Check Foreman Proxy service
      ansible.builtin.command: systemctl is-active foreman-proxy
      register: proxy_service_status
      changed_when: false
      failed_when: false
      when: inventory_hostname == foreman_proxy

    - name: Check DHCP service
      ansible.builtin.command: systemctl is-active dhcpd
      register: dhcp_service_status
      changed_when: false
      failed_when: false
      when: inventory_hostname == foreman_proxy

    - name: Display DHCP port listener
      ansible.builtin.shell: "ss -lunp | grep ':67 ' || true"
      register: dhcp_port_status
      changed_when: false
      when: inventory_hostname == foreman_proxy

    - name: Display Smart Proxy HTTPS listener
      ansible.builtin.shell: "ss -ltnp | grep ':9090 ' || true"
      register: proxy_port_status
      changed_when: false
      when: inventory_hostname == foreman_proxy

    ###########################################################################
    # REFRESH SMART PROXY FEATURES IN FOREMAN
    ###########################################################################

    - name: Get Smart Proxy ID from Foreman
      ansible.builtin.uri:
        url: "https://{{ foreman_server }}/api/smart_proxies?search=name={{ foreman_proxy }}"
        method: GET
        user: "{{ foreman_api_user }}"
        password: "{{ foreman_api_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        headers:
          Accept: "application/json"
      register: foreman_proxy_lookup
      when: inventory_hostname == foreman_server

    - name: Fail when Smart Proxy was not found in Foreman
      ansible.builtin.fail:
        msg: |
          Smart Proxy was not found in Foreman.

          Expected proxy:
          {{ foreman_proxy }}

          Foreman response:
          {{ foreman_proxy_lookup.json }}
      when:
        - inventory_hostname == foreman_server
        - foreman_proxy_lookup.json.total | int == 0

    - name: Set Smart Proxy ID
      ansible.builtin.set_fact:
        foreman_proxy_id: "{{ foreman_proxy_lookup.json.results[0].id }}"
      when:
        - inventory_hostname == foreman_server
        - foreman_proxy_lookup.json.total | int > 0

    - name: Display Smart Proxy ID
      ansible.builtin.debug:
        msg: "Smart Proxy {{ foreman_proxy }} has ID {{ foreman_proxy_id }}"
      when: inventory_hostname == foreman_server

    - name: Refresh Smart Proxy features in Foreman
      ansible.builtin.uri:
        url: "https://{{ foreman_server }}/api/smart_proxies/{{ foreman_proxy_id }}/refresh"
        method: PUT
        user: "{{ foreman_api_user }}"
        password: "{{ foreman_api_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code:
          - 200
          - 201
        return_content: true
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
        body_format: json
        body: {}
      register: foreman_proxy_refresh
      when: inventory_hostname == foreman_server

    - name: Display refreshed Smart Proxy features
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "Foreman Smart Proxy Features Refreshed"
          - "=================================================="
          - "Proxy: {{ foreman_proxy }}"
          - "Proxy ID: {{ foreman_proxy_id }}"
          - "Features: {{ foreman_proxy_refresh.json.features | map(attribute='name') | list }}"
          - "=================================================="
      when: inventory_hostname == foreman_server

    ###########################################################################
    # FINAL SUMMARY
    ###########################################################################

    - name: Display final Smart Proxy summary
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "Smart Proxy Configuration Summary"
          - "=================================================="
          - "Host: {{ inventory_hostname }}"
          - "Foreman Proxy: {{ proxy_service_status.stdout }}"
          - "DHCP Service: {{ dhcp_service_status.stdout }}"
          - "DHCP Listener: {{ dhcp_port_status.stdout }}"
          - "Proxy HTTPS Listener: {{ proxy_port_status.stdout }}"
          - "Enabled Features:"
          - "{{ proxy_features.stdout }}"
          - "=================================================="
      when: inventory_hostname == foreman_proxy
