---
# ==============================================================================
# FOREMAN SMART PROXY CONTENT INSTALLATION
#
# Run:
#
# ansible-playbook -i centos-07-servers_inventory.yml foreman_proxy.yml \
#   -e ansible_python_interpreter=/usr/bin/python3 \
#   -u admin
# ==============================================================================


# ==============================================================================
# PLAY 1 - GENERATE SMART PROXY CERTIFICATE ON FOREMAN SERVER
# ==============================================================================

- name: Generate Smart Proxy certificate on Foreman Server
  hosts: cent-07-01.vgs.com
  become: true
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    foreman_proxy: "cent-07-02.vgs.com"

    cert_file: "/root/cent-07-02.vgs.com-certs.tar"
    cert_output: "/tmp/cent-07-02.vgs.com-certs-output.txt"

  tasks:

    - name: Remove old Smart Proxy certificate archive
      ansible.builtin.file:
        path: "{{ cert_file }}"
        state: absent

    - name: Remove old certificate generation output
      ansible.builtin.file:
        path: "{{ cert_output }}"
        state: absent

    - name: Generate fresh Smart Proxy certificates
      ansible.builtin.shell: |
        set -o pipefail

        foreman-proxy-certs-generate \
          --foreman-proxy-fqdn "{{ foreman_proxy }}" \
          --certs-tar "{{ cert_file }}" \
          2>&1 | tee "{{ cert_output }}"
      args:
        executable: /bin/bash

    - name: Verify Smart Proxy certificate archive exists
      ansible.builtin.stat:
        path: "{{ cert_file }}"
      register: proxy_cert_stat

    - name: Fail if Smart Proxy certificate archive was not created
      ansible.builtin.assert:
        that:
          - proxy_cert_stat.stat.exists
          - proxy_cert_stat.stat.size | int > 0
        fail_msg: |
          Smart Proxy certificate archive was not created:
          {{ cert_file }}

    # --------------------------------------------------------------------------
    # DISPLAY THE OUTPUT FOR TROUBLESHOOTING
    # --------------------------------------------------------------------------

    - name: Read certificate generation output
      ansible.builtin.slurp:
        src: "{{ cert_output }}"
      register: cert_generation_output

    - name: Store certificate generation output as text
      ansible.builtin.set_fact:
        cert_generation_text: "{{ cert_generation_output.content | b64decode }}"

    - name: Display certificate generation output
      ansible.builtin.debug:
        var: cert_generation_text

    # --------------------------------------------------------------------------
    # EXTRACT OAUTH KEY
    #
    # Handles:
    #
    # --foreman-proxy-oauth-consumer-key "VALUE"
    # --foreman-proxy-oauth-consumer-key 'VALUE'
    # --foreman-proxy-oauth-consumer-key VALUE
    # --------------------------------------------------------------------------

    - name: Extract OAuth consumer key
      ansible.builtin.set_fact:
        proxy_oauth_key: >-
          {{
            cert_generation_text
            | regex_search(
                '--foreman-proxy-oauth-consumer-key[=[:space:]]+["'']?([^"''[:space:]\\\\]+)',
                '\1'
              )
            | default([], true)
            | first
            | default('')
          }}
      no_log: true

    - name: Extract OAuth consumer secret
      ansible.builtin.set_fact:
        proxy_oauth_secret: >-
          {{
            cert_generation_text
            | regex_search(
                '--foreman-proxy-oauth-consumer-secret[=[:space:]]+["'']?([^"''[:space:]\\\\]+)',
                '\1'
              )
            | default([], true)
            | first
            | default('')
          }}
      no_log: true

    - name: Verify OAuth consumer key was extracted
      ansible.builtin.assert:
        that:
          - proxy_oauth_key | length > 0
        fail_msg: |
          OAuth consumer key could not be extracted from:

          {{ cert_output }}

          Check the "Display certificate generation output" task above.

    - name: Verify OAuth consumer secret was extracted
      ansible.builtin.assert:
        that:
          - proxy_oauth_secret | length > 0
        fail_msg: |
          OAuth consumer secret could not be extracted from:

          {{ cert_output }}

          Check the "Display certificate generation output" task above.

    - name: Display OAuth extraction status
      ansible.builtin.debug:
        msg:
          - "Smart Proxy certificate generated successfully"
          - "OAuth consumer key extracted successfully"
          - "OAuth consumer secret extracted successfully"
          - "Certificate file: {{ cert_file }}"


# ==============================================================================
# PLAY 2 - COPY CERTIFICATE TO SMART PROXY
# ==============================================================================

- name: Copy Smart Proxy certificate to Smart Proxy server
  hosts: cent-07-02.vgs.com
  become: true
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    foreman_proxy: "cent-07-02.vgs.com"

    cert_file: "/root/cent-07-02.vgs.com-certs.tar"
    cert_output: "/tmp/cent-07-02.vgs.com-certs-output.txt"

  tasks:

    - name: Copy Smart Proxy certificate archive from Foreman
      ansible.builtin.fetch:
        src: "{{ cert_file }}"
        dest: "/tmp/"
        flat: true
      delegate_to: "{{ foreman_server }}"
      become: true

    - name: Copy certificate archive to Smart Proxy
      ansible.builtin.copy:
        src: "/tmp/cent-07-02.vgs.com-certs.tar"
        dest: "/root/cent-07-02.vgs.com-certs.tar"
        owner: root
        group: root
        mode: "0600"

    - name: Verify certificate archive exists on Smart Proxy
      ansible.builtin.stat:
        path: "/root/cent-07-02.vgs.com-certs.tar"
      register: proxy_cert_remote

    - name: Fail if certificate archive is missing on Smart Proxy
      ansible.builtin.assert:
        that:
          - proxy_cert_remote.stat.exists
          - proxy_cert_remote.stat.size | int > 0
        fail_msg: |
          Certificate archive was not copied successfully to Smart Proxy.


# ==============================================================================
# PLAY 3 - CONFIGURE REPOSITORIES AND INSTALL REQUIRED PACKAGES
# ==============================================================================

- name: Prepare Smart Proxy repositories and packages
  hosts: cent-07-02.vgs.com
  become: true
  gather_facts: false

  vars:
    foreman_proxy: "cent-07-02.vgs.com"

  tasks:

    - name: Create local patch repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/patch.repo
        mode: "0644"
        content: |
          [local-patch]
          name=Local CentOS Patch Repo
          baseurl=http://http-server-01.vgs.com/repo/installed_rhel7
          enabled=1
          gpgcheck=0

    - name: Create local Mesa repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/mesa.repo
        mode: "0644"
        content: |
          [mesa]
          name=Local Mesa Repo
          baseurl=http://http-server-01.vgs.com/repo/mesa
          enabled=1
          gpgcheck=0
          priority=1

    - name: Create local GTK repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/gtk.repo
        mode: "0644"
        content: |
          [gtk]
          name=Local GTK Repo
          baseurl=http://http-server-01.vgs.com/repo/gtk
          enabled=1
          gpgcheck=0
          priority=1

    - name: Create Puppet repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/puppet.repo
        mode: "0644"
        content: |
          [puppet7]
          name=Puppet 7 Repository EL7
          baseurl=https://yum.puppet.com/puppet7/el/7/x86_64/
          enabled=1
          gpgcheck=0

    - name: Create Foreman repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/foreman-online.repo
        mode: "0644"
        content: |
          [foreman]
          name=Foreman 3.2 EL7
          baseurl=https://yum-backend.repo-rpm01.osuosl.theforeman.org/releases/3.2/el7/x86_64/
          enabled=1
          gpgcheck=0

          [foreman-plugins]
          name=Foreman Plugins 3.2 EL7
          baseurl=https://yum.theforeman.org/plugins/3.2/el7/x86_64/
          enabled=1
          gpgcheck=0

    - name: Clean YUM cache
      ansible.builtin.command: yum clean all
      changed_when: false

    - name: Rebuild YUM cache
      ansible.builtin.command: yum makecache
      changed_when: false

    - name: Install base required packages
      ansible.builtin.yum:
        name:
          - sshpass
          - foreman
          - foreman-proxy
          - foreman-installer
          - puppetserver
        state: present

    - name: Install Mesa packages
      ansible.builtin.shell: |
        yum install -y 'mesa-libEGL*'
      changed_when: false

    - name: Install GTK packages
      ansible.builtin.shell: |
        yum install -y 'gtk*'
      changed_when: false

    - name: Verify foreman-proxy package
      ansible.builtin.command: rpm -q foreman-proxy
      changed_when: false


# ==============================================================================
# PLAY 4 - INSTALL AND REGISTER FOREMAN SMART PROXY CONTENT
# ==============================================================================

- name: Install Foreman Smart Proxy Content
  hosts: cent-07-02.vgs.com
  become: true
  gather_facts: true

  vars:
    foreman_server: "cent-07-01.vgs.com"
    foreman_proxy: "cent-07-02.vgs.com"

  tasks:

    - name: Get OAuth credentials from Foreman host
      ansible.builtin.set_fact:
        proxy_oauth_key: "{{ hostvars[foreman_server]['proxy_oauth_key'] }}"
        proxy_oauth_secret: "{{ hostvars[foreman_server]['proxy_oauth_secret'] }}"
      no_log: true

    - name: Verify OAuth credentials are available
      ansible.builtin.assert:
        that:
          - proxy_oauth_key | length > 0
          - proxy_oauth_secret | length > 0
        fail_msg: "OAuth credentials are missing."

    - name: Detect active network interface
      ansible.builtin.shell: |
        ip -o route show default | awk '{print $5; exit}'
      register: detected_interface
      changed_when: false

    - name: Use detected network interface
      ansible.builtin.set_fact:
        proxy_interface: "{{ detected_interface.stdout | trim }}"

    - name: Fail if network interface cannot be detected
      ansible.builtin.assert:
        that:
          - proxy_interface | length > 0
        fail_msg: "Unable to detect the active network interface."

    - name: Display network interface
      ansible.builtin.debug:
        msg: "Using Smart Proxy interface: {{ proxy_interface }}"

    - name: Ensure certificate archive exists
      ansible.builtin.stat:
        path: "/root/cent-07-02.vgs.com-certs.tar"
      register: cert_check

    - name: Fail if certificate archive is missing
      ansible.builtin.assert:
        that:
          - cert_check.stat.exists
        fail_msg: "Certificate archive does not exist on Smart Proxy."

    - name: Install Foreman Smart Proxy Content
      ansible.builtin.command:
        argv:
          - foreman-installer
          - --scenario
          - foreman-proxy-content
          - --certs-tar-file
          - /root/cent-07-02.vgs.com-certs.tar
          - --foreman-proxy-register-in-foreman
          - "true"
          - --foreman-proxy-foreman-base-url
          - "https://cent-07-01.vgs.com"
          - --foreman-proxy-trusted-hosts
          - "cent-07-01.vgs.com"
          - --foreman-proxy-trusted-hosts
          - "cent-07-02.vgs.com"
          - --foreman-proxy-oauth-consumer-key
          - "{{ proxy_oauth_key }}"
          - --foreman-proxy-oauth-consumer-secret
          - "{{ proxy_oauth_secret }}"
          - --foreman-proxy-dhcp
          - "true"
          - --foreman-proxy-dhcp-interface
          - "{{ proxy_interface }}"
          - --foreman-proxy-dns
          - "true"
          - --foreman-proxy-dns-interface
          - "{{ proxy_interface }}"
          - --foreman-proxy-tftp
          - "true"
          - --foreman-proxy-tftp-servername
          - "cent-07-02.vgs.com"
      register: foreman_proxy_install
      no_log: true

    - name: Display installation completion
      ansible.builtin.debug:
        msg:
          - "Foreman Smart Proxy Content installation completed."
          - "Smart Proxy: cent-07-02.vgs.com"
          - "Foreman: cent-07-01.vgs.com"
          - "Interface: {{ proxy_interface }}"


# ==============================================================================
# PLAY 5 - CLEAN TEMPORARY CERTIFICATE FROM ANSIBLE CONTROLLER
# ==============================================================================

- name: Clean temporary certificate from Ansible controller
  hosts: cent-07-01.vgs.com
  gather_facts: false

  tasks:

    - name: Remove temporary Smart Proxy certificate from Ansible controller
      ansible.builtin.file:
        path: "/tmp/cent-07-02.vgs.com-certs.tar"
        state: absent
      delegate_to: localhost

    - name: Display cleanup completion
      ansible.builtin.debug:
        msg: |
          Temporary Smart Proxy certificate removed from Ansible controller:
          /tmp/cent-07-02.vgs.com-certs.tar
