---
- name: Configure and Fix Foreman Smart Proxy Services
  hosts: all
  become: true
  gather_facts: true

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy: "cent-07-02.vgs.com"

    foreman_proxy_port: 9090

    dhcp_config: "/etc/dhcp/dhcpd.conf"
    dhcp_leases: "/var/lib/dhcpd/dhcpd.leases"
    omapi_key_file: "/etc/dhcp/omapi.key"

    proxy_ca: "/etc/foreman-proxy/foreman_ssl_ca.pem"
    proxy_cert: "/etc/foreman-proxy/foreman_ssl_cert.pem"
    proxy_key: "/etc/foreman-proxy/foreman_ssl_key.pem"

    foreman_client_cert: "/etc/foreman/client_cert.pem"
    foreman_client_key: "/etc/foreman/client_key.pem"
    foreman_proxy_ca: "/etc/foreman/proxy_ca.pem"

  handlers:

    - name: Restart Foreman Proxy
      ansible.builtin.systemd:
        name: foreman-proxy
        state: restarted
        enabled: true

    - name: Restart DHCPD
      ansible.builtin.systemd:
        name: dhcpd
        state: restarted
        enabled: true

    - name: Restart TFTP
      ansible.builtin.systemd:
        name: tftp
        state: restarted
        enabled: true
      failed_when: false

  tasks:

    ###########################################################################
    # DISPLAY HOST INFORMATION
    ###########################################################################

    - name: Display host information
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ inventory_hostname }}"
          - "Role: {{ 'Foreman Server' if inventory_hostname == foreman_server else 'Smart Proxy' if inventory_hostname == smart_proxy else 'Other Host' }}"

    ###########################################################################
    # FOREMAN SERVER
    ###########################################################################

    - name: Check Foreman client certificate
      ansible.builtin.stat:
        path: "{{ foreman_client_cert }}"
      register: foreman_client_cert_stat
      when: inventory_hostname == foreman_server

    - name: Check Foreman client key
      ansible.builtin.stat:
        path: "{{ foreman_client_key }}"
      register: foreman_client_key_stat
      when: inventory_hostname == foreman_server

    - name: Check Foreman proxy CA
      ansible.builtin.stat:
        path: "{{ foreman_proxy_ca }}"
      register: foreman_proxy_ca_stat
      when: inventory_hostname == foreman_server

    - name: Display Foreman certificate status
      ansible.builtin.debug:
        msg:
          - "Client certificate: {{ foreman_client_cert_stat.stat.exists | default(false) }}"
          - "Client key: {{ foreman_client_key_stat.stat.exists | default(false) }}"
          - "Proxy CA: {{ foreman_proxy_ca_stat.stat.exists | default(false) }}"
      when: inventory_hostname == foreman_server

    ###########################################################################
    # SMART PROXY CERTIFICATES
    ###########################################################################

    - name: Check Smart Proxy CA certificate
      ansible.builtin.stat:
        path: "{{ proxy_ca }}"
      register: proxy_ca_stat
      when: inventory_hostname == smart_proxy

    - name: Check Smart Proxy SSL certificate
      ansible.builtin.stat:
        path: "{{ proxy_cert }}"
      register: proxy_cert_stat
      when: inventory_hostname == smart_proxy

    - name: Check Smart Proxy SSL key
      ansible.builtin.stat:
        path: "{{ proxy_key }}"
      register: proxy_key_stat
      when: inventory_hostname == smart_proxy

    - name: Fail when Smart Proxy certificates are missing
      ansible.builtin.fail:
        msg: |
          Smart Proxy SSL certificates are missing.

          Required files:
          {{ proxy_ca }}
          {{ proxy_cert }}
          {{ proxy_key }}

          Certificate status:
          CA: {{ proxy_ca_stat.stat.exists | default(false) }}
          CERT: {{ proxy_cert_stat.stat.exists | default(false) }}
          KEY: {{ proxy_key_stat.stat.exists | default(false) }}
      when:
        - inventory_hostname == smart_proxy
        - not (
            proxy_ca_stat.stat.exists | default(false)
            and proxy_cert_stat.stat.exists | default(false)
            and proxy_key_stat.stat.exists | default(false)
          )

    - name: Display Smart Proxy certificate status
      ansible.builtin.debug:
        msg:
          - "CA certificate: {{ proxy_ca_stat.stat.exists }}"
          - "SSL certificate: {{ proxy_cert_stat.stat.exists }}"
          - "SSL key: {{ proxy_key_stat.stat.exists }}"
      when: inventory_hostname == smart_proxy

    ###########################################################################
    # SMART PROXY PACKAGES
    ###########################################################################

    - name: Install required Smart Proxy packages
      ansible.builtin.yum:
        name:
          - dhcp
          - bind-utils
          - tftp-server
          - foreman-proxy
        state: present
      when: inventory_hostname == smart_proxy

    ###########################################################################
    # DHCP CONFIGURATION
    ###########################################################################

    - name: Generate OMAPI key
      ansible.builtin.command:
        cmd: dnssec-keygen -a HMAC-MD5 -b 256 -n HOST omapi_key
        chdir: /tmp
      register: omapi_key_generate
      changed_when: false
      when: inventory_hostname == smart_proxy

    - name: Read generated OMAPI private key filename
      ansible.builtin.shell: |
        set -o pipefail
        ls -1t /tmp/Komapi_key.+*.private 2>/dev/null | head -1
      args:
        executable: /bin/bash
      register: omapi_private_key_file
      changed_when: false
      when: inventory_hostname == smart_proxy

    - name: Read generated OMAPI private key
      ansible.builtin.slurp:
        src: "{{ omapi_private_key_file.stdout }}"
      register: omapi_private_key_content
      when:
        - inventory_hostname == smart_proxy
        - omapi_private_key_file.stdout | length > 0

    - name: Extract OMAPI secret safely
      ansible.builtin.set_fact:
        omapi_secret: >-
          {{
            (
              omapi_private_key_content.content
              | b64decode
              | regex_findall('Key:\\s*(.+)')
              | first
              | default('')
            )
          }}
      when:
        - inventory_hostname == smart_proxy
        - omapi_private_key_file.stdout | length > 0

    - name: Fail when OMAPI secret could not be extracted
      ansible.builtin.fail:
        msg: |
          OMAPI key generation completed but no secret could be extracted.

          Private key file:
          {{ omapi_private_key_file.stdout }}

          Generated command output:
          {{ omapi_key_generate.stdout | default('No stdout') }}
      when:
        - inventory_hostname == smart_proxy
        - omapi_secret | default('') | length == 0

    - name: Display OMAPI secret extraction status
      ansible.builtin.debug:
        msg: "OMAPI secret successfully extracted."
      when:
        - inventory_hostname == smart_proxy
        - omapi_secret | length > 0

    - name: Create OMAPI key file
      ansible.builtin.copy:
        dest: "{{ omapi_key_file }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          key "omapi_key" {
            algorithm hmac-md5;
            secret "{{ omapi_secret }}";
          };
      notify: Restart DHCPD
      when:
        - inventory_hostname == smart_proxy
        - omapi_secret | length > 0

    - name: Enable DHCP feature in Foreman Smart Proxy
      ansible.builtin.copy:
        dest: /etc/foreman-proxy/settings.d/dhcp.yml
        owner: root
        group: foreman-proxy
        mode: "0640"
        content: |
          ---
          :enabled: true
          :use_provider: dhcp_isc
          :server: 127.0.0.1
          :ping_free_ip: true
      notify: Restart Foreman Proxy
      when: inventory_hostname == smart_proxy

    - name: Configure ISC DHCP provider
      ansible.builtin.copy:
        dest: /etc/foreman-proxy/settings.d/dhcp_isc.yml
        owner: root
        group: foreman-proxy
        mode: "0640"
        content: |
          ---
          :config: {{ dhcp_config }}
          :leases: {{ dhcp_leases }}
          :key_name: omapi_key
          :key_secret: "{{ omapi_secret }}"
          :omapi_port: 7911
      notify: Restart Foreman Proxy
      when:
        - inventory_hostname == smart_proxy
        - omapi_secret | length > 0

    - name: Ensure DHCP leases file exists
      ansible.builtin.file:
        path: "{{ dhcp_leases }}"
        state: touch
        owner: dhcpd
        group: dhcpd
        mode: "0644"
      when: inventory_hostname == smart_proxy

    ###########################################################################
    # DNS CONFIGURATION
    ###########################################################################

    - name: Enable DNS feature in Foreman Smart Proxy
      ansible.builtin.copy:
        dest: /etc/foreman-proxy/settings.d/dns.yml
        owner: root
        group: foreman-proxy
        mode: "0640"
        content: |
          ---
          :enabled: true
          :use_provider: dns_nsupdate
          :dns_ttl: 86400
      notify: Restart Foreman Proxy
      when: inventory_hostname == smart_proxy

    ###########################################################################
    # TFTP CONFIGURATION
    ###########################################################################

    - name: Create TFTP root directory
      ansible.builtin.file:
        path: /var/lib/tftpboot
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: inventory_hostname == smart_proxy

    - name: Enable TFTP feature in Foreman Smart Proxy
      ansible.builtin.copy:
        dest: /etc/foreman-proxy/settings.d/tftp.yml
        owner: root
        group: foreman-proxy
        mode: "0640"
        content: |
          ---
          :enabled: true
          :tftproot: /var/lib/tftpboot
      notify: Restart Foreman Proxy
      when: inventory_hostname == smart_proxy

    ###########################################################################
    # PERMISSIONS
    ###########################################################################

    - name: Ensure foreman-proxy can read DHCP configuration
      ansible.builtin.file:
        path: "{{ dhcp_config }}"
        owner: root
        group: foreman-proxy
        mode: "0640"
      failed_when: false
      when: inventory_hostname == smart_proxy

    - name: Ensure foreman-proxy can read DHCP leases
      ansible.builtin.file:
        path: "{{ dhcp_leases }}"
        owner: dhcpd
        group: foreman-proxy
        mode: "0640"
      failed_when: false
      when: inventory_hostname == smart_proxy

    ###########################################################################
    # RESTART SERVICES
    ###########################################################################

    - name: Flush handlers before verification
      ansible.builtin.meta: flush_handlers

    - name: Enable and restart Foreman Proxy
      ansible.builtin.systemd:
        name: foreman-proxy
        state: restarted
        enabled: true
      when: inventory_hostname == smart_proxy

    - name: Enable and restart DHCP service
      ansible.builtin.systemd:
        name: dhcpd
        state: restarted
        enabled: true
      failed_when: false
      when: inventory_hostname == smart_proxy

    ###########################################################################
    # VERIFY SERVICES
    ###########################################################################

    - name: Get Smart Proxy enabled features
      ansible.builtin.command:
        cmd: foreman-proxy --features
      register: proxy_features
      changed_when: false
      failed_when: false
      when: inventory_hostname == smart_proxy

    - name: Display Smart Proxy features
      ansible.builtin.debug:
        var: proxy_features.stdout_lines
      when: inventory_hostname == smart_proxy

    - name: Check Foreman Proxy service
      ansible.builtin.command:
        cmd: systemctl is-active foreman-proxy
      register: foreman_proxy_status
      changed_when: false
      failed_when: false
      when: inventory_hostname == smart_proxy

    - name: Check DHCP service
      ansible.builtin.command:
        cmd: systemctl is-active dhcpd
      register: dhcp_status
      changed_when: false
      failed_when: false
      when: inventory_hostname == smart_proxy

    - name: Display DHCP port listener
      ansible.builtin.shell: |
        ss -lunp | grep ':67 ' || true
      register: dhcp_listener
      changed_when: false
      when: inventory_hostname == smart_proxy

    - name: Display Smart Proxy HTTPS listener
      ansible.builtin.shell: |
        ss -ltnp | grep ':9090 ' || true
      register: proxy_listener
      changed_when: false
      when: inventory_hostname == smart_proxy

    - name: Display final Smart Proxy summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "FOREMAN SMART PROXY CONFIGURATION SUMMARY"
          - "=========================================="
          - "Host: {{ inventory_hostname }}"
          - "Foreman Proxy: {{ foreman_proxy_status.stdout | default('UNKNOWN') }}"
          - "DHCPD: {{ dhcp_status.stdout | default('UNKNOWN') }}"
          - "DHCP listener:"
          - "{{ dhcp_listener.stdout | default('Not listening') }}"
          - "Proxy HTTPS listener:"
          - "{{ proxy_listener.stdout | default('Not listening') }}"
          - ""
          - "Configured Smart Proxy features:"
          - "{{ proxy_features.stdout | default('Unable to retrieve features') }}"
          - ""
          - "DHCP: ENABLED"
          - "DNS: ENABLED"
          - "TFTP: ENABLED"
          - "=========================================="
      when: inventory_hostname == smart_proxy
