---
###############################################################################
# FOREMAN/KATELLO SMART PROXY INSTALLATION
#
# This playbook is intended to be RUN FROM THE FOREMAN SERVER:
#   cent-07-01.vgs.com
#
# It follows the supplied working bash workflow:
#   1. Generate Smart Proxy certificates on Foreman
#   2. Extract OAuth credentials
#   3. Prepare cent-07-02
#   4. Replace old YUM repos
#   5. Install Foreman/Katello Smart Proxy packages
#   6. Copy/extract certificates
#   7. Fix hostname + /etc/hosts
#   8. Detect active network interface dynamically
#   9. Temporarily mount EFI partitions
#  10. Run foreman-installer foreman-proxy-content
#  11. Configure DHCP
#  12. Copy EFI / Rocky PXE files
#  13. Verify foreman-proxy and registration
#
# Run from cent-07-01:
#
#   ansible-playbook -i ~/inventory.ini foreman_proxy_from_foreman.yml \
#     --limit FOREMAN,FOREMAN_PROXY -u admin --ask-pass
#
###############################################################################

- name: "Generate Smart Proxy certificate on Foreman"
  hosts: all
  become: true
  gather_facts: true

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"

    cert_generator: "/usr/sbin/foreman-proxy-certs-generate"
    cert_tar: "/root/cent-07-02.vgs.com-certs.tar"
    cert_output: "/tmp/proxy_installer_output.txt"

  tasks:

    - name: Verify certificate generator exists
      ansible.builtin.stat:
        path: "{{ cert_generator }}"
      register: cert_generator_stat

    - name: Fallback locate certificate generator
      ansible.builtin.command:
        cmd: "sh -c 'command -v foreman-proxy-certs-generate || true'"
      register: cert_generator_fallback
      changed_when: false
      when: not cert_generator_stat.stat.exists

    - name: Set certificate generator path
      ansible.builtin.set_fact:
        cert_generator_path: >-
          {{
            cert_generator
            if cert_generator_stat.stat.exists
            else (cert_generator_fallback.stdout | trim)
          }}

    - name: Fail if certificate generator is unavailable
      ansible.builtin.fail:
        msg: "foreman-proxy-certs-generate was not found on {{ inventory_hostname }}"
      when: cert_generator_path | length == 0

    - name: Remove previous certificate archive
      ansible.builtin.file:
        path: "{{ cert_tar }}"
        state: absent

    - name: Remove previous installer output
      ansible.builtin.file:
        path: "{{ cert_output }}"
        state: absent

    - name: Generate Smart Proxy certificate archive
      ansible.builtin.shell: |
        set -o pipefail
        "{{ cert_generator_path }}" \
          --foreman-proxy-fqdn "{{ smart_proxy_server }}" \
          --certs-tar "{{ cert_tar }}" \
          | tee "{{ cert_output }}"
      args:
        executable: /bin/bash
      register: cert_generation
      changed_when: true

    - name: Verify certificate archive
      ansible.builtin.stat:
        path: "{{ cert_tar }}"
      register: cert_tar_stat

    - name: Fail if certificate archive was not generated
      ansible.builtin.assert:
        that:
          - cert_tar_stat.stat.exists
          - cert_tar_stat.stat.size | int > 0
        fail_msg: "Certificate archive was not generated: {{ cert_tar }}"

    - name: Read certificate generator output
      ansible.builtin.slurp:
        src: "{{ cert_output }}"
      register: cert_output_slurp

    - name: Store certificate output
      ansible.builtin.set_fact:
        cert_output_text: "{{ cert_output_slurp.content | b64decode }}"

    - name: Extract OAuth consumer key
      ansible.builtin.set_fact:
        oauth_key: >-
          {{
            (
              cert_output_text
              | regex_findall('--foreman-proxy-oauth-consumer-key\\s+"([^"]+)"')
            )[0] | default('')
          }}

    - name: Extract OAuth consumer secret
      ansible.builtin.set_fact:
        oauth_secret: >-
          {{
            (
              cert_output_text
              | regex_findall('--foreman-proxy-oauth-consumer-secret\\s+"([^"]+)"')
            )[0] | default('')
          }}
      no_log: true

    - name: Verify OAuth credentials
      ansible.builtin.assert:
        that:
          - oauth_key | length > 0
          - oauth_secret | length > 0
        fail_msg: "OAuth consumer key/secret could not be extracted from {{ cert_output }}"

    - name: Display certificate generation result
      ansible.builtin.debug:
        msg:
          - "Certificate archive : {{ cert_tar }}"
          - "OAuth credentials   : extracted successfully"
          - "Target Smart Proxy  : {{ smart_proxy_server }}"

    # Make values available to the next play on the Smart Proxy.
    - name: Publish OAuth values for next play
      ansible.builtin.set_fact:
        proxy_oauth_key: "{{ oauth_key }}"
        proxy_oauth_secret: "{{ oauth_secret }}"
      no_log: true


###############################################################################
# PREPARE + INSTALL SMART PROXY
###############################################################################

- name: "Prepare and install Smart Proxy"
  hosts: FOREMAN_PROXY
  become: true
  gather_facts: true

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"

    cert_tar_foreman: "/root/cent-07-02.vgs.com-certs.tar"
    cert_tar_proxy: "/root/cent-07-02.vgs.com-certs.tar"

    repo_server: "http-server-01.vgs.com"

    proxy_ip: "192.168.253.132"
    dhcp_gateway: "192.168.253.2"

    # These are the same repository locations used by the working bash.
    local_patch_repo: "http://http-server-01.vgs.com/repo/installed_rhel7"
    mesa_repo: "http://http-server-01.vgs.com/repo/mesa"
    gtk_repo: "http://http-server-01.vgs.com/repo/gtk"

    rocky8_vmlinuz: "http://http-server-01/repo/rocky8/isolinux/vmlinuz"
    rocky8_initrd: "http://http-server-01/repo/rocky8/isolinux/initrd.img"

    rocky9_vmlinuz: "http://http-server-01/repo/rocky9/images/pxeboot/vmlinuz"
    rocky9_initrd: "http://http-server-01/repo/rocky9/images/pxeboot/initrd.img"

    rocky92_vmlinuz: "http://http-server-01/repo/rocky9.2/images/pxeboot/vmlinuz"
    rocky92_initrd: "http://http-server-01/repo/rocky9.2/images/pxeboot/initrd.img"

    netbox_host: "netbox.vgs.com"
    netbox_user: "admin"
    netbox_password: "Vigneshv12$"

  tasks:

    - name: Verify target hostname
      ansible.builtin.hostname:
        name: "{{ smart_proxy_server }}"

    - name: Verify Foreman resolves
      ansible.builtin.command:
        cmd: "getent hosts {{ foreman_server }}"
      changed_when: false

    - name: Remove old YUM repository files
      ansible.builtin.shell: |
        rm -f /etc/yum.repos.d/*.repo
      args:
        executable: /bin/bash
      changed_when: true

    - name: Create local patch / Mesa / GTK repositories
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/patch.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [local-patch]
          name=Local CentOS Patch Repo
          baseurl={{ local_patch_repo }}
          enabled=1
          gpgcheck=0

          [mesa]
          name=Local Mesa Repo
          baseurl={{ mesa_repo }}
          enabled=1
          gpgcheck=0
          priority=1

          [gtk]
          name=Local GTK Repo
          baseurl={{ gtk_repo }}
          enabled=1
          gpgcheck=0
      register: patch_repo_file

    - name: Create Puppet 7 repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/puppet.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [puppet7]
          name=Puppet 7 Repository EL7
          baseurl=https://yum.puppet.com/puppet7/el/7/x86_64/
          enabled=1
          gpgcheck=0

    - name: Create Foreman repositories
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/foreman-online.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [foreman-new-repo]
          name=Foreman New Repo
          baseurl=https://yum-backend.repo-rpm01.osuosl.theforeman.org/releases/3.0/el7/x86_64/
          enabled=1
          gpgcheck=0

          [foreman-add-repo]
          name=Foreman Add Repo
          baseurl=https://yum.theforeman.org/plugins/3.2/el7/x86_64/
          enabled=1
          gpgcheck=0

    - name: Create CentOS Vault repositories
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/vault.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [vaultbase]
          name=CentOS Vault Base
          baseurl=http://vault.centos.org/7.9.2009/os/x86_64/
          enabled=1
          gpgcheck=0

          [updates]
          name=CentOS Vault Updates
          baseurl=http://vault.centos.org/7.9.2009/updates/x86_64/
          enabled=1
          gpgcheck=0

          [extras]
          name=CentOS Vault Extras
          baseurl=http://vault.centos.org/7.9.2009/extras/x86_64/
          enabled=1
          gpgcheck=0

    - name: Clean YUM metadata
      ansible.builtin.command:
        cmd: yum clean all
      changed_when: false
      failed_when: false

    - name: Install base packages from working bash workflow
      ansible.builtin.shell: |
        yum install -y sshpass mesa-libEGL* gtk*
      args:
        executable: /bin/bash

    - name: Install Foreman, Proxy and Puppet packages
      ansible.builtin.shell: |
        yum install -y foreman foreman-proxy puppetserver --skip-broken
      args:
        executable: /bin/bash

    - name: Install Foreman installer packages
      ansible.builtin.shell: |
        yum install -y foreman-installer*
      args:
        executable: /bin/bash

    - name: Verify Foreman installer exists
      ansible.builtin.command:
        cmd: which foreman-installer
      changed_when: false

    - name: Verify Foreman Proxy package
      ansible.builtin.command:
        cmd: rpm -q foreman-proxy
      changed_when: false

    ###########################################################################
    # CERTIFICATE INSTALL
    ###########################################################################

    - name: Copy Smart Proxy certificate archive from Foreman
      ansible.builtin.copy:
        src: "{{ cert_tar_foreman }}"
        dest: "{{ cert_tar_proxy }}"
        owner: root
        group: root
        mode: "0600"
      delegate_to: "{{ groups['FOREMAN'][0] }}"
      remote_src: true

    - name: Actually copy archive from Foreman to Smart Proxy
      ansible.builtin.fetch:
        src: "{{ cert_tar_foreman }}"
        dest: "{{ playbook_dir }}/.smart_proxy_cert/"
        flat: true
      delegate_to: "{{ groups['FOREMAN'][0] }}"

    - name: Copy fetched certificate archive to Smart Proxy
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/.smart_proxy_cert/cent-07-02.vgs.com-certs.tar"
        dest: "{{ cert_tar_proxy }}"
        owner: root
        group: root
        mode: "0600"

    - name: Create Foreman Proxy certificate directory
      ansible.builtin.file:
        path: /etc/foreman-proxy
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Extract Smart Proxy certificates
      ansible.builtin.unarchive:
        src: "{{ cert_tar_proxy }}"
        dest: /etc/foreman-proxy
        remote_src: true

    ###########################################################################
    # HOSTNAME + HOSTS
    ###########################################################################

    - name: Write exact hostname mapping
      ansible.builtin.copy:
        dest: /etc/hosts
        owner: root
        group: root
        mode: "0644"
        content: |
          127.0.0.1 localhost localhost.localdomain localhost4 localhost4.localdomain4
          ::1 localhost localhost.localdomain localhost6 localhost6.localdomain6

          {{ proxy_ip }} {{ smart_proxy_server }} {{ smart_proxy_server.split('.')[0] }}

    - name: Verify full hostname
      ansible.builtin.command:
        cmd: hostname -f
      changed_when: false

    - name: Verify forward lookup
      ansible.builtin.command:
        cmd: "getent hosts {{ smart_proxy_server }}"
      changed_when: false

    - name: Verify reverse lookup
      ansible.builtin.command:
        cmd: "getent hosts {{ proxy_ip }}"
      register: reverse_lookup
      changed_when: false
      failed_when: false

    - name: Display DNS values
      ansible.builtin.debug:
        msg:
          - "hostname -f should be {{ smart_proxy_server }}"
          - "Forward lookup: {{ smart_proxy_server }}"
          - "Reverse lookup: {{ reverse_lookup.stdout | default('') }}"
          - "NOTE: the Foreman installer requires reverse DNS for {{ proxy_ip }} to resolve to {{ smart_proxy_server }}."

    ###########################################################################
    # NETWORK INTERFACE
    ###########################################################################

    - name: Detect active network interface
      ansible.builtin.shell: |
        ip -o route show default | awk '{print $5; exit}'
      args:
        executable: /bin/bash
      register: default_interface
      changed_when: false

    - name: Fallback to first non-loopback interface
      ansible.builtin.shell: |
        ip -o -4 addr show | awk '$2 != "lo" {print $2; exit}'
      args:
        executable: /bin/bash
      register: fallback_interface
      changed_when: false
      when: default_interface.stdout | trim == ""

    - name: Set active interface
      ansible.builtin.set_fact:
        active_interface: >-
          {{
            default_interface.stdout | trim
            if (default_interface.stdout | trim) != ''
            else (fallback_interface.stdout | trim)
          }}

    - name: Verify active interface
      ansible.builtin.command:
        cmd: "ip link show {{ active_interface }}"
      changed_when: false

    - name: Display network information
      ansible.builtin.shell: |
        echo "===== NETWORK INFO ====="
        ip route
        ip -o -4 addr show
        echo "Detected interface: {{ active_interface }}"
        echo "========================"
      args:
        executable: /bin/bash
      changed_when: false

    ###########################################################################
    # FIREWALL
    ###########################################################################

    - name: Open DHCP firewall
      ansible.posix.firewalld:
        service: dhcp
        permanent: true
        immediate: true
        state: enabled

    - name: Open TFTP firewall
      ansible.posix.firewalld:
        service: tftp
        permanent: true
        immediate: true
        state: enabled

    - name: Open HTTPS firewall
      ansible.posix.firewalld:
        service: https
        permanent: true
        immediate: true
        state: enabled

    - name: Open HTTP firewall
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled

    - name: Open Smart Proxy 9090
      ansible.posix.firewalld:
        port: 9090/tcp
        permanent: true
        immediate: true
        state: enabled

    ###########################################################################
    # EFI MOUNTS
    ###########################################################################

    - name: Create EFI mountpoints
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /boot/efi
        - /boot/efi2

    - name: Mount first EFI partition
      ansible.posix.mount:
        path: /boot/efi
        src: /dev/sda1
        fstype: vfat
        opts: defaults
        state: mounted

    - name: Mount second EFI partition
      ansible.posix.mount:
        path: /boot/efi2
        src: /dev/sdb1
        fstype: vfat
        opts: defaults
        state: mounted

    - name: Verify first CentOS shim
      ansible.builtin.stat:
        path: /boot/efi/EFI/centos/shimx64.efi
      register: efi1_shim

    - name: Verify second CentOS shim
      ansible.builtin.stat:
        path: /boot/efi2/EFI/centos/shimx64.efi
      register: efi2_shim

    - name: Fail if first EFI shim is missing
      ansible.builtin.assert:
        that:
          - efi1_shim.stat.exists
        fail_msg: "/boot/efi/EFI/centos/shimx64.efi not found"

    - name: Fail if second EFI shim is missing
      ansible.builtin.assert:
        that:
          - efi2_shim.stat.exists
        fail_msg: "/boot/efi2/EFI/centos/shimx64.efi not found"

    ###########################################################################
    # FOREMAN PROXY INSTALLER
    ###########################################################################

    - name: Get OAuth key from Foreman host
      ansible.builtin.set_fact:
        proxy_oauth_key: "{{ hostvars[groups['FOREMAN'][0]].proxy_oauth_key | default('') }}"
        proxy_oauth_secret: "{{ hostvars[groups['FOREMAN'][0]].proxy_oauth_secret | default('') }}"
      no_log: true

    - name: Fail if OAuth values are unavailable
      ansible.builtin.assert:
        that:
          - proxy_oauth_key | length > 0
          - proxy_oauth_secret | length > 0
        fail_msg: "OAuth values generated on Foreman were not available to the Smart Proxy play."
      no_log: true

    - name: Run Foreman Smart Proxy content installer
      ansible.builtin.command:
        argv:
          - foreman-installer
          - --force
          - --scenario
          - foreman-proxy-content
          - --certs-tar-file
          - "{{ cert_tar_proxy }}"
          - --foreman-proxy-register-in-foreman
          - "true"
          - --foreman-proxy-foreman-base-url
          - "https://{{ foreman_server }}"
          - --foreman-proxy-trusted-hosts
          - "{{ foreman_server }}"
          - --foreman-proxy-trusted-hosts
          - "{{ smart_proxy_server }}"
          - --foreman-proxy-oauth-consumer-key
          - "{{ proxy_oauth_key }}"
          - --foreman-proxy-oauth-consumer-secret
          - "{{ proxy_oauth_secret }}"
          - --foreman-proxy-dhcp
          - "true"
          - --foreman-proxy-dhcp-interface
          - "{{ active_interface }}"
          - --foreman-proxy-dns
          - "true"
          - --foreman-proxy-dns-interface
          - "{{ active_interface }}"
          - --foreman-proxy-tftp
          - "true"
          - --foreman-proxy-tftp-servername
          - "{{ smart_proxy_server }}"
      register: proxy_installer
      no_log: false

    - name: Display Foreman installer stdout
      ansible.builtin.debug:
        var: proxy_installer.stdout_lines

    - name: Display Foreman installer stderr
      ansible.builtin.debug:
        var: proxy_installer.stderr_lines
      when: proxy_installer.stderr_lines | length > 0

    - name: Fail when Foreman Proxy installer failed
      ansible.builtin.fail:
        msg: |
          Foreman Smart Proxy installer failed.

          RC: {{ proxy_installer.rc }}

          STDERR:
          {{ proxy_installer.stderr | default('') }}

          STDOUT:
          {{ proxy_installer.stdout | default('') }}
      when: proxy_installer.rc != 0

    ###########################################################################
    # UNMOUNT TEMPORARY EFI
    ###########################################################################

    - name: Flush filesystem buffers
      ansible.builtin.command:
        cmd: sync
      changed_when: false

    - name: Unmount EFI2
      ansible.posix.mount:
        path: /boot/efi2
        state: unmounted

    - name: Unmount EFI1
      ansible.posix.mount:
        path: /boot/efi
        state: unmounted

    - name: Remove temporary EFI directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /boot/efi2
        - /boot/efi

    ###########################################################################
    # DHCP
    ###########################################################################

    - name: Add DHCP gateway option if missing
      ansible.builtin.lineinfile:
        path: /etc/dhcp/dhcpd.conf
        insertafter: 'option subnet-mask'
        line: "  option routers {{ dhcp_gateway }};"
        state: present
      when: ansible_facts.os_family == "RedHat"

    - name: Make DHCP authoritative
      ansible.builtin.replace:
        path: /etc/dhcp/dhcpd.conf
        regexp: '^not authoritative;$'
        replace: 'authoritative;'
      when: ansible_facts.os_family == "RedHat"

    - name: Validate DHCP configuration
      ansible.builtin.command:
        cmd: dhcpd -t -cf /etc/dhcp/dhcpd.conf
      changed_when: false

    - name: Enable and restart DHCP
      ansible.builtin.systemd:
        name: dhcpd
        enabled: true
        state: restarted

    ###########################################################################
    # COPY ROCKY EFI FILES FROM NETBOX
    ###########################################################################

    - name: Verify NetBox host resolves
      ansible.builtin.command:
        cmd: "getent hosts {{ netbox_host }}"
      changed_when: false

    - name: Install sshpass if missing
      ansible.builtin.yum:
        name: sshpass
        state: present

    - name: Mount EFI partitions on NetBox
      ansible.builtin.shell: |
        sshpass -p '{{ netbox_password }}' ssh \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          {{ netbox_user }}@{{ netbox_host }} \
          "echo '{{ netbox_password }}' | sudo -S bash -c 'mkdir -p /boot/efi /boot/efi2; mountpoint -q /boot/efi || mount /dev/sda1 /boot/efi; mountpoint -q /boot/efi2 || mount /dev/sdb1 /boot/efi2'"
      args:
        executable: /bin/bash
      no_log: true
      changed_when: true

    - name: Create TFTP grub2 directory
      ansible.builtin.file:
        path: /var/lib/tftpboot/grub2
        state: directory
        owner: foreman-proxy
        group: root
        mode: "0755"

    - name: Copy Rocky shim from NetBox
      ansible.builtin.shell: |
        sshpass -p '{{ netbox_password }}' scp \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          {{ netbox_user }}@{{ netbox_host }}:/boot/efi/EFI/rocky/shimx64.efi \
          /var/lib/tftpboot/grub2/shimx64.efi
      args:
        executable: /bin/bash
      no_log: true
      changed_when: true

    - name: Copy Rocky grub.cfg from NetBox
      ansible.builtin.shell: |
        sshpass -p '{{ netbox_password }}' scp \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          {{ netbox_user }}@{{ netbox_host }}:/boot/efi/EFI/rocky/grub.cfg \
          /var/lib/tftpboot/grub2/grub.cfg
      args:
        executable: /bin/bash
      no_log: true
      changed_when: true

    - name: Unmount NetBox EFI partitions
      ansible.builtin.shell: |
        sshpass -p '{{ netbox_password }}' ssh \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          {{ netbox_user }}@{{ netbox_host }} \
          "echo '{{ netbox_password }}' | sudo -S bash -c 'sync; mountpoint -q /boot/efi2 && umount /boot/efi2 || true; mountpoint -q /boot/efi && umount /boot/efi || true; rmdir /boot/efi2 2>/dev/null || true; rmdir /boot/efi 2>/dev/null || true'"
      args:
        executable: /bin/bash
      no_log: true
      changed_when: true

    - name: Set Rocky EFI file ownership
      ansible.builtin.file:
        path: "{{ item }}"
        owner: foreman-proxy
        group: root
        mode: "0644"
      loop:
        - /var/lib/tftpboot/grub2/shimx64.efi
        - /var/lib/tftpboot/grub2/grub.cfg

    ###########################################################################
    # PXE FILES
    ###########################################################################

    - name: Create Rocky 8 TFTP directory
      ansible.builtin.file:
        path: /var/lib/tftpboot/rocky8
        state: directory
        owner: foreman-proxy
        group: root
        mode: "0755"

    - name: Download Rocky 8 vmlinuz
      ansible.builtin.get_url:
        url: "{{ rocky8_vmlinuz }}"
        dest: /var/lib/tftpboot/rocky8/vmlinuz
        owner: foreman-proxy
        group: root
        mode: "0644"

    - name: Download Rocky 8 initrd
      ansible.builtin.get_url:
        url: "{{ rocky8_initrd }}"
        dest: /var/lib/tftpboot/rocky8/initrd.img
        owner: foreman-proxy
        group: root
        mode: "0644"

    - name: Create Rocky 9 TFTP directory
      ansible.builtin.file:
        path: /var/lib/tftpboot/rocky9
        state: directory
        owner: foreman-proxy
        group: root
        mode: "0755"

    - name: Create Rocky 9.2 TFTP directory
      ansible.builtin.file:
        path: /var/lib/tftpboot/rocky92
        state: directory
        owner: foreman-proxy
        group: root
        mode: "0755"

    - name: Download Rocky 9 vmlinuz
      ansible.builtin.get_url:
        url: "{{ rocky9_vmlinuz }}"
        dest: /var/lib/tftpboot/rocky9/vmlinuz
        owner: foreman-proxy
        group: root
        mode: "0644"

    - name: Download Rocky 9 initrd
      ansible.builtin.get_url:
        url: "{{ rocky9_initrd }}"
        dest: /var/lib/tftpboot/rocky9/initrd.img
        owner: foreman-proxy
        group: root
        mode: "0644"

    - name: Download Rocky 9.2 vmlinuz
      ansible.builtin.get_url:
        url: "{{ rocky92_vmlinuz }}"
        dest: /var/lib/tftpboot/rocky92/vmlinuz
        owner: foreman-proxy
        group: root
        mode: "0644"

    - name: Download Rocky 9.2 initrd
      ansible.builtin.get_url:
        url: "{{ rocky92_initrd }}"
        dest: /var/lib/tftpboot/rocky92/initrd.img
        owner: foreman-proxy
        group: root
        mode: "0644"

    ###########################################################################
    # SERVICES + VERIFICATION
    ###########################################################################

    - name: Enable and start Foreman Proxy
      ansible.builtin.systemd:
        name: foreman-proxy
        enabled: true
        state: started

    - name: Check Foreman Proxy service
      ansible.builtin.command:
        cmd: systemctl is-active foreman-proxy
      register: foreman_proxy_status
      changed_when: false

    - name: Wait for port 9090
      ansible.builtin.wait_for:
        host: "{{ smart_proxy_server }}"
        port: 9090
        timeout: 120
        state: started

    - name: Display Smart Proxy status
      ansible.builtin.debug:
        msg:
          - "Foreman Proxy service: {{ foreman_proxy_status.stdout }}"
          - "Smart Proxy URL: https://{{ smart_proxy_server }}:9090"

    - name: Display installed PXE files
      ansible.builtin.shell: |
        find /var/lib/tftpboot -maxdepth 2 -type f \
          \( -name 'vmlinuz' -o -name 'initrd.img' -o -name 'shimx64.efi' -o -name 'grub.cfg' \) \
          -printf '%p\n' | sort
      args:
        executable: /bin/bash
      register: pxe_files
      changed_when: false

    - name: Show PXE files
      ansible.builtin.debug:
        var: pxe_files.stdout_lines


###############################################################################
# FINAL VERIFICATION FROM FOREMAN
###############################################################################

- name: "Verify Smart Proxy registration from Foreman"
  hosts: FOREMAN
  become: true
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"

  tasks:

    - name: Get all Smart Proxies from Foreman API
      ansible.builtin.uri:
        url: "https://{{ foreman_server }}/api/smart_proxies?per_page=100"
        method: GET
        user: "{{ foreman_api_user | default('admin') }}"
        password: "{{ foreman_api_password | default(omit) }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        headers:
          Accept: "application/json"
      register: smart_proxy_api
      when: foreman_api_password is defined

    - name: Display all registered Smart Proxies
      ansible.builtin.debug:
        msg: "{{ smart_proxy_api.json.results | default([]) | map(attribute='name') | list }}"
      when: foreman_api_password is defined

    - name: Check Smart Proxy using hammer
      ansible.builtin.shell: |
        set -o pipefail
        hammer proxy list --per-page 999 2>/dev/null | grep -F "{{ smart_proxy_server }}"
      args:
        executable: /bin/bash
      register: hammer_proxy_check
      changed_when: false
      failed_when: false

    - name: Fail if Smart Proxy was not registered
      ansible.builtin.fail:
        msg: |
          Smart Proxy {{ smart_proxy_server }} is not registered in Foreman.

          hammer output:
          {{ hammer_proxy_check.stdout | default('') }}

          API output:
          {{
            smart_proxy_api.json | default({})
            | to_nice_json
            if foreman_api_password is defined
            else 'API check skipped because foreman_api_password was not supplied.'
          }}
      when: hammer_proxy_check.rc != 0

    - name: Display final success
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SMART PROXY INSTALLATION COMPLETED"
          - "============================================================"
          - "Foreman Server : {{ foreman_server }}"
          - "Smart Proxy    : {{ smart_proxy_server }}"
          - "Certificate    : /root/{{ smart_proxy_server }}-certs.tar"
          - "Scenario       : foreman-proxy-content"
          - "DHCP           : configured"
          - "DNS            : configured"
          - "TFTP           : configured"
          - "PXE            : Rocky 8 / Rocky 9 / Rocky 9.2"
          - "Registration   : verified"
          - "============================================================"
