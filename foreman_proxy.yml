---
###############################################################################
# FOREMAN / KATELLO SMART PROXY INSTALLATION
#
# Foreman/Katello Server : cent-07-01.vgs.com
# Smart Proxy Server     : cent-07-02.vgs.com
#
# Workflow:
#   1. Generate Smart Proxy certificates on Foreman
#   2. Extract OAuth credentials
#   3. Fetch certificate to Ansible controller
#   4. Copy certificate to Smart Proxy
#   5. Install Katello CA consumer on Smart Proxy
#   6. Install foreman-installer-katello
#   7. Run foreman-proxy-content installer
#   8. Register Smart Proxy in Foreman
#   9. Verify services and registration
###############################################################################

###############################################################################
# VARIABLES
###############################################################################

- name: Define Smart Proxy deployment variables
  hosts: localhost
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"
    organization: "Default_Organization"

  tasks:

    - name: Set deployment variables
      set_fact:
        foreman_server_name: "{{ foreman_server }}"
        smart_proxy_server_name: "{{ smart_proxy_server }}"
        foreman_organization: "{{ organization }}"


###############################################################################
# PLAY 1 - GENERATE SMART PROXY CERTIFICATE ON FOREMAN
###############################################################################

- name: Generate Smart Proxy certificate on Foreman Server
  hosts: foreman
  become: true
  gather_facts: false

  vars:
    smart_proxy_fqdn: "cent-07-02.vgs.com"
    cert_tar_file: "/root/cent-07-02.vgs.com-certs.tar"
    cert_output_file: "/root/cent-07-02.vgs.com-certs-generation.out"

  tasks:

    - name: Verify foreman-proxy-certs-generate exists
      stat:
        path: /usr/bin/foreman-proxy-certs-generate
      register: cert_generator

    - name: Fail if certificate generator is missing
      assert:
        that:
          - cert_generator.stat.exists
        fail_msg: >-
          /usr/bin/foreman-proxy-certs-generate does not exist.
          Ensure Katello/Foreman Proxy certificate tools are installed.

    - name: Remove old Smart Proxy certificate archive
      file:
        path: "{{ cert_tar_file }}"
        state: absent

    - name: Remove old certificate generation output
      file:
        path: "{{ cert_output_file }}"
        state: absent

    - name: Generate fresh Smart Proxy certificates
      shell: |
        set -o pipefail

        /usr/bin/foreman-proxy-certs-generate \
          --foreman-proxy-fqdn "{{ smart_proxy_fqdn }}" \
          --certs-tar "{{ cert_tar_file }}" \
          > "{{ cert_output_file }}" 2>&1

      args:
        executable: /bin/bash
      register: cert_generation
      changed_when: cert_generation.rc == 0
      failed_when: cert_generation.rc != 0

    - name: Verify Smart Proxy certificate archive exists
      stat:
        path: "{{ cert_tar_file }}"
      register: generated_cert_file

    - name: Fail if Smart Proxy certificate archive was not created
      assert:
        that:
          - generated_cert_file.stat.exists
          - generated_cert_file.stat.size | int > 0
        fail_msg: >-
          Smart Proxy certificate archive was not generated:
          {{ cert_tar_file }}

    - name: Read certificate generation output
      slurp:
        src: "{{ cert_output_file }}"
      register: cert_generation_output

    - name: Store certificate generation output as text
      set_fact:
        cert_generation_text: >-
          {{ cert_generation_output.content | b64decode }}

    - name: Display certificate generation output
      debug:
        var: cert_generation_text

    ###########################################################################
    # EXTRACT OAUTH CONSUMER KEY
    ###########################################################################

    - name: Extract OAuth consumer key
      set_fact:
        smart_proxy_oauth_key: >-
          {{
            cert_generation_text
            | regex_search(
                '--foreman-proxy-oauth-consumer-key\s+"([^"]+)"',
                '\1'
              )
            | first
          }}

    ###########################################################################
    # EXTRACT OAUTH CONSUMER SECRET
    ###########################################################################

    - name: Extract OAuth consumer secret
      set_fact:
        smart_proxy_oauth_secret: >-
          {{
            cert_generation_text
            | regex_search(
                '--foreman-proxy-oauth-consumer-secret\s+"([^"]+)"',
                '\1'
              )
            | first
          }}

    - name: Verify OAuth consumer key was extracted
      assert:
        that:
          - smart_proxy_oauth_key is defined
          - smart_proxy_oauth_key | length > 0
        fail_msg: "Unable to extract Smart Proxy OAuth consumer key."

    - name: Verify OAuth consumer secret was extracted
      assert:
        that:
          - smart_proxy_oauth_secret is defined
          - smart_proxy_oauth_secret | length > 0
        fail_msg: "Unable to extract Smart Proxy OAuth consumer secret."

    ###########################################################################
    # STORE FACTS FOR OTHER PLAYS
    ###########################################################################

    - name: Store Smart Proxy variables for later plays
      set_fact:
        smart_proxy_certificate: "{{ cert_tar_file }}"
        generated_smart_proxy_fqdn: "{{ smart_proxy_fqdn }}"
        generated_oauth_key: "{{ smart_proxy_oauth_key }}"
        generated_oauth_secret: "{{ smart_proxy_oauth_secret }}"

    - name: Display certificate generation status
      debug:
        msg:
          - "Smart Proxy certificate generated successfully"
          - "Certificate: {{ smart_proxy_certificate }}"
          - "OAuth consumer key extracted successfully"
          - "OAuth consumer secret extracted successfully"


###############################################################################
# PLAY 2 - FETCH CERTIFICATE TO ANSIBLE CONTROLLER
###############################################################################

- name: Fetch Smart Proxy certificate to Ansible controller
  hosts: foreman
  become: true
  gather_facts: false

  vars:
    smart_proxy_fqdn: "cent-07-02.vgs.com"
    cert_tar_file: "/root/cent-07-02.vgs.com-certs.tar"
    controller_cert_dir: "{{ playbook_dir }}/smart-proxy-certs"

  tasks:

    - name: Create certificate directory on Ansible controller
      delegate_to: localhost
      become: false
      file:
        path: "{{ controller_cert_dir }}"
        state: directory
        mode: '0700'

    - name: Fetch certificate archive from Foreman server
      fetch:
        src: "{{ cert_tar_file }}"
        dest: "{{ controller_cert_dir }}/"
        flat: true


###############################################################################
# PLAY 3 - COPY CERTIFICATE TO SMART PROXY
###############################################################################

- name: Copy Smart Proxy certificate to Smart Proxy server
  hosts: foreman_proxy
  become: true
  gather_facts: false

  vars:
    smart_proxy_fqdn: "cent-07-02.vgs.com"
    cert_tar_file: "/root/cent-07-02.vgs.com-certs.tar"
    controller_cert_file: "{{ playbook_dir }}/smart-proxy-certs/cent-07-02.vgs.com-certs.tar"

  tasks:

    - name: Verify certificate exists on Ansible controller
      delegate_to: localhost
      become: false
      stat:
        path: "{{ controller_cert_file }}"
      register: controller_cert_check

    - name: Fail if certificate is missing on Ansible controller
      assert:
        that:
          - controller_cert_check.stat.exists
          - controller_cert_check.stat.size | int > 0
        fail_msg: >-
          Certificate does not exist on the Ansible controller:
          {{ controller_cert_file }}

    - name: Copy certificate archive to Smart Proxy
      copy:
        src: "{{ controller_cert_file }}"
        dest: "{{ cert_tar_file }}"
        owner: root
        group: root
        mode: '0600'

    - name: Verify certificate archive exists on Smart Proxy
      stat:
        path: "{{ cert_tar_file }}"
      register: proxy_cert_check

    - name: Fail if certificate archive is missing on Smart Proxy
      assert:
        that:
          - proxy_cert_check.stat.exists
          - proxy_cert_check.stat.size | int > 0
        fail_msg: >-
          Certificate archive is missing on Smart Proxy:
          {{ cert_tar_file }}


###############################################################################
# PLAY 4 - PREPARE SMART PROXY SERVER
###############################################################################

- name: Prepare Smart Proxy server
  hosts: foreman_proxy
  become: true
  gather_facts: true

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_fqdn: "cent-07-02.vgs.com"

  tasks:

    - name: Display Smart Proxy target
      debug:
        msg:
          - "Preparing Smart Proxy: {{ inventory_hostname }}"
          - "Foreman Server: {{ foreman_server }}"
          - "Smart Proxy FQDN: {{ smart_proxy_fqdn }}"

    - name: Ensure hostname is configured
      hostname:
        name: "{{ smart_proxy_fqdn }}"

    - name: Verify Foreman server resolves
      command: getent hosts "{{ foreman_server }}"
      changed_when: false

    - name: Verify Smart Proxy hostname resolves
      command: getent hosts "{{ smart_proxy_fqdn }}"
      changed_when: false

    - name: Install required base packages
      yum:
        name:
          - curl
          - wget
          - ca-certificates
          - yum-utils
          - chrony
        state: present

    - name: Enable chronyd
      service:
        name: chronyd
        state: started
        enabled: true

    ###########################################################################
    # INSTALL KATELLO CA CONSUMER
    ###########################################################################

    - name: Check whether Katello CA consumer is installed
      command: rpm -q katello-ca-consumer
      register: katello_ca_check
      changed_when: false
      failed_when: false

    - name: Install Katello CA consumer from Foreman server
      yum:
        name: >-
          http://{{ foreman_server }}/pub/katello-ca-consumer-latest.noarch.rpm
        state: present
      when: katello_ca_check.rc != 0

    - name: Verify Katello CA consumer installation
      command: rpm -q katello-ca-consumer
      changed_when: false


###############################################################################
# PLAY 5 - REGISTER SMART PROXY TO KATELLO
#
# Registration is interactive when only --org is supplied. The playbook therefore
# checks registration status but does not automatically register unless a
# username/password or activation key is supplied.
###############################################################################

- name: Check Smart Proxy Katello registration
  hosts: foreman_proxy
  become: true
  gather_facts: false

  tasks:

    - name: Check subscription-manager identity
      command: subscription-manager identity
      register: subscription_identity
      changed_when: false
      failed_when: false

    - name: Display Katello registration status
      debug:
        msg: >-
          {{
            'Smart Proxy is already registered to Katello.'
            if subscription_identity.rc == 0
            else
            'Smart Proxy is not currently registered. Configure registration credentials/activation key before enabling content-managed installation.'
          }}


###############################################################################
# PLAY 6 - INSTALL FOREMAN INSTALLER KATELLO PACKAGE
###############################################################################

- name: Install Smart Proxy content installer packages
  hosts: foreman_proxy
  become: true
  gather_facts: false

  tasks:

    - name: Install foreman-installer-katello
      yum:
        name: foreman-installer-katello
        state: present

    - name: Verify foreman-installer-katello is installed
      command: rpm -q foreman-installer-katello
      changed_when: false
      register: installer_package_check

    - name: Verify foreman-installer command exists
      command: which foreman-installer
      changed_when: false


###############################################################################
# PLAY 7 - INSTALL SMART PROXY
###############################################################################

- name: Install and configure Smart Proxy
  hosts: foreman_proxy
  become: true
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_fqdn: "cent-07-02.vgs.com"
    cert_tar_file: "/root/cent-07-02.vgs.com-certs.tar"

    # Retrieve credentials generated during Play 1.
    oauth_consumer_key: >-
      {{ hostvars[groups['foreman'][0]].generated_oauth_key }}

    oauth_consumer_secret: >-
      {{ hostvars[groups['foreman'][0]].generated_oauth_secret }}

  tasks:

    - name: Verify certificate archive before installation
      stat:
        path: "{{ cert_tar_file }}"
      register: installer_cert_check

    - name: Fail if installer certificate archive is missing
      assert:
        that:
          - installer_cert_check.stat.exists
          - installer_cert_check.stat.size | int > 0
        fail_msg: >-
          Cannot start Smart Proxy installation because certificate archive
          is missing: {{ cert_tar_file }}

    - name: Run Smart Proxy content installer
      command:
        argv:
          - foreman-installer
          - "--scenario"
          - "foreman-proxy-content"
          - "--certs-tar-file"
          - "{{ cert_tar_file }}"
          - "--foreman-proxy-register-in-foreman"
          - "true"
          - "--foreman-proxy-foreman-base-url"
          - "https://{{ foreman_server }}"
          - "--foreman-proxy-trusted-hosts"
          - "{{ foreman_server }}"
          - "--foreman-proxy-trusted-hosts"
          - "{{ smart_proxy_fqdn }}"
          - "--foreman-proxy-oauth-consumer-key"
          - "{{ oauth_consumer_key }}"
          - "--foreman-proxy-oauth-consumer-secret"
          - "{{ oauth_consumer_secret }}"
      register: smart_proxy_installer
      no_log: true

    - name: Display Smart Proxy installer completion
      debug:
        msg:
          - "Smart Proxy installer completed"
          - "Scenario: foreman-proxy-content"
          - "Proxy: {{ smart_proxy_fqdn }}"
          - "Foreman: {{ foreman_server }}"


###############################################################################
# PLAY 8 - START AND VERIFY SERVICES
###############################################################################

- name: Start and verify Smart Proxy services
  hosts: foreman_proxy
  become: true
  gather_facts: false

  tasks:

    - name: Enable and start Foreman Proxy
      service:
        name: foreman-proxy
        state: started
        enabled: true

    - name: Check Foreman Proxy service status
      command: systemctl is-active foreman-proxy
      register: foreman_proxy_service
      changed_when: false

    - name: Verify Foreman Proxy service is active
      assert:
        that:
          - foreman_proxy_service.stdout == "active"
        fail_msg: "Foreman Proxy service is not active."

    - name: Check Smart Proxy HTTPS API
      uri:
        url: "https://{{ inventory_hostname }}:8443/features"
        validate_certs: false
        return_content: true
        status_code: 200
      register: proxy_features
      retries: 5
      delay: 10
      until: proxy_features.status == 200

    - name: Display Smart Proxy features
      debug:
        var: proxy_features.json


###############################################################################
# PLAY 9 - VERIFY SMART PROXY FROM FOREMAN SERVER
###############################################################################

- name: Verify Smart Proxy registration from Foreman server
  hosts: foreman
  become: true
  gather_facts: false

  vars:
    smart_proxy_fqdn: "cent-07-02.vgs.com"

  tasks:

    - name: Verify Smart Proxy exists in Foreman using Hammer
      shell: |
        hammer proxy list --per-page 999 | grep -F "{{ smart_proxy_fqdn }}"
      register: hammer_proxy_check
      changed_when: false
      failed_when: false

    - name: Display Smart Proxy registration result
      debug:
        msg: >-
          {{
            'SUCCESS: Smart Proxy ' ~ smart_proxy_fqdn ~
            ' is registered in Foreman.'
            if hammer_proxy_check.rc == 0
            else
            'WARNING: Smart Proxy was installed but was not found by hammer proxy list.'
          }}

    - name: Fail if Smart Proxy is not registered in Foreman
      assert:
        that:
          - hammer_proxy_check.rc == 0
        fail_msg: >-
          Smart Proxy {{ smart_proxy_fqdn }} was not found in Foreman.
          Review /var/log/foreman-proxy/proxy.log and installer logs.


###############################################################################
# PLAY 10 - FINAL SUMMARY
###############################################################################

- name: Display final Smart Proxy installation summary
  hosts: foreman_proxy
  become: false
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_fqdn: "cent-07-02.vgs.com"

  tasks:

    - name: Display completion summary
      debug:
        msg:
          - "============================================================"
          - "SMART PROXY INSTALLATION COMPLETED"
          - "============================================================"
          - "Foreman/Katello Server : {{ foreman_server }}"
          - "Smart Proxy            : {{ smart_proxy_fqdn }}"
          - "Certificate            : /root/{{ smart_proxy_fqdn }}-certs.tar"
          - "Scenario               : foreman-proxy-content"
          - "Foreman Proxy Service  : active"
          - "Smart Proxy API        : https://{{ smart_proxy_fqdn }}:8443"
          - "============================================================"
