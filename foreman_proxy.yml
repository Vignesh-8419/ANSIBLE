---
###############################################################################
# FOREMAN / KATELLO SMART PROXY INSTALLATION
#
# Run:
#
# ansible-playbook -i centos-07-servers_inventory.yml foreman_proxy.yml \
#   -e ansible_python_interpreter=/usr/bin/python3 -u admin
#
# Inventory groups are NOT required.
# All plays use: hosts: all
#
# Foreman/Katello Server : cent-07-01.vgs.com
# Smart Proxy Server     : cent-07-02.vgs.com
#
###############################################################################

###############################################################################
# GLOBAL VARIABLES
###############################################################################

- name: Define Smart Proxy deployment variables
  hosts: all
  become: false
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"
    smart_proxy_fqdn: "cent-07-02.vgs.com"
    organization: "Default_Organization"

  tasks:

    - name: Display deployment targets
      debug:
        msg:
          - "Foreman/Katello Server: {{ foreman_server }}"
          - "Smart Proxy Server: {{ smart_proxy_server }}"
          - "Organization: {{ organization }}"

###############################################################################
# PLAY 1 - GENERATE SMART PROXY CERTIFICATE ON FOREMAN
###############################################################################

- name: Generate Smart Proxy certificate on Foreman Server
  hosts: all
  become: true
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_fqdn: "cent-07-02.vgs.com"
    cert_tar_file: "/root/cent-07-02.vgs.com-certs.tar"
    cert_output_file: "/root/cent-07-02.vgs.com-certs-generation.out"

  tasks:

    - name: Skip non-Foreman hosts
      meta: end_host
      when: inventory_hostname != foreman_server

    - name: Locate foreman-proxy-certs-generate command
      shell: |
        command -v foreman-proxy-certs-generate || \
        find /usr /opt -type f -name foreman-proxy-certs-generate 2>/dev/null | head -n 1
      args:
        executable: /bin/bash
      register: cert_generator_path
      changed_when: false

    - name: Display certificate generator path
      debug:
        msg: "Certificate generator found at: {{ cert_generator_path.stdout | trim }}"

    - name: Fail if certificate generator is missing
      assert:
        that:
          - cert_generator_path.stdout | trim | length > 0
        fail_msg: >-
          foreman-proxy-certs-generate was not found on
          {{ foreman_server }}.

    - name: Remove old Smart Proxy certificate archive
      file:
        path: "{{ cert_tar_file }}"
        state: absent

    - name: Remove old certificate generation output
      file:
        path: "{{ cert_output_file }}"
        state: absent

    - name: Generate fresh Smart Proxy certificates
      shell: |
        set -o pipefail

        "{{ cert_generator_path.stdout | trim }}" \
          --foreman-proxy-fqdn "{{ smart_proxy_fqdn }}" \
          --certs-tar "{{ cert_tar_file }}" \
          > "{{ cert_output_file }}" 2>&1
      args:
        executable: /bin/bash
      register: cert_generation
      changed_when: cert_generation.rc == 0
      failed_when: cert_generation.rc != 0

    - name: Verify Smart Proxy certificate archive exists
      stat:
        path: "{{ cert_tar_file }}"
      register: generated_cert_file

    - name: Fail if certificate archive was not created
      assert:
        that:
          - generated_cert_file.stat.exists
          - generated_cert_file.stat.size | int > 0
        fail_msg: "Certificate archive was not generated."

    - name: Read certificate generation output
      slurp:
        src: "{{ cert_output_file }}"
      register: cert_generation_output

    - name: Store certificate generation output as text
      set_fact:
        cert_generation_text: "{{ cert_generation_output.content | b64decode }}"

    - name: Display certificate generation output
      debug:
        var: cert_generation_text

    - name: Extract OAuth consumer key
      set_fact:
        generated_oauth_key: >-
          {{
            cert_generation_text
            | regex_search(
                '--foreman-proxy-oauth-consumer-key\s+"([^"]+)"',
                '\1'
              )
            | first
          }}
      no_log: true

    - name: Extract OAuth consumer secret
      set_fact:
        generated_oauth_secret: >-
          {{
            cert_generation_text
            | regex_search(
                '--foreman-proxy-oauth-consumer-secret\s+"([^"]+)"',
                '\1'
              )
            | first
          }}
      no_log: true

    - name: Verify OAuth consumer key
      assert:
        that:
          - generated_oauth_key | default('') | length > 0
        fail_msg: "Unable to extract OAuth consumer key."

    - name: Verify OAuth consumer secret
      assert:
        that:
          - generated_oauth_secret | default('') | length > 0
        fail_msg: "Unable to extract OAuth consumer secret."

    - name: Store generated certificate path
      set_fact:
        generated_certificate_file: "{{ cert_tar_file }}"

    - name: Display certificate generation success
      debug:
        msg:
          - "SUCCESS: Smart Proxy certificate generated"
          - "Certificate: {{ cert_tar_file }}"
          - "OAuth credentials extracted successfully"

###############################################################################
# PLAY 2 - FETCH CERTIFICATE TO ANSIBLE CONTROLLER
###############################################################################

- name: Fetch Smart Proxy certificate to Ansible controller
  hosts: all
  become: true
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    cert_tar_file: "/root/cent-07-02.vgs.com-certs.tar"
    controller_cert_dir: "{{ playbook_dir }}/smart-proxy-certs"

  tasks:

    - name: Skip non-Foreman hosts
      meta: end_host
      when: inventory_hostname != foreman_server

    - name: Create certificate directory on Ansible controller
      delegate_to: localhost
      become: false
      file:
        path: "{{ controller_cert_dir }}"
        state: directory
        mode: "0700"

    - name: Fetch certificate archive from Foreman server
      fetch:
        src: "{{ cert_tar_file }}"
        dest: "{{ controller_cert_dir }}/"
        flat: true

###############################################################################
# PLAY 3 - COPY CERTIFICATE TO SMART PROXY
###############################################################################

- name: Copy Smart Proxy certificate to Smart Proxy server
  hosts: all
  become: true
  gather_facts: false

  vars:
    smart_proxy_server: "cent-07-02.vgs.com"
    cert_tar_file: "/root/cent-07-02.vgs.com-certs.tar"
    controller_cert_file: "{{ playbook_dir }}/smart-proxy-certs/cent-07-02.vgs.com-certs.tar"

  tasks:

    - name: Skip non-Smart-Proxy hosts
      meta: end_host
      when: inventory_hostname != smart_proxy_server

    - name: Verify certificate exists on Ansible controller
      delegate_to: localhost
      become: false
      stat:
        path: "{{ controller_cert_file }}"
      register: controller_cert_check

    - name: Fail if certificate is missing on controller
      assert:
        that:
          - controller_cert_check.stat.exists
          - controller_cert_check.stat.size | int > 0
        fail_msg: "Certificate file is missing on the Ansible controller."

    - name: Copy certificate archive to Smart Proxy
      copy:
        src: "{{ controller_cert_file }}"
        dest: "{{ cert_tar_file }}"
        owner: root
        group: root
        mode: "0600"

    - name: Verify certificate archive on Smart Proxy
      stat:
        path: "{{ cert_tar_file }}"
      register: proxy_cert_check

    - name: Fail if certificate is missing on Smart Proxy
      assert:
        that:
          - proxy_cert_check.stat.exists
          - proxy_cert_check.stat.size | int > 0
        fail_msg: "Certificate archive is missing on Smart Proxy."

###############################################################################
# PLAY 4 - PREPARE SMART PROXY
###############################################################################

- name: Prepare Smart Proxy server
  hosts: all
  become: true
  gather_facts: true

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"

  tasks:

    - name: Skip non-Smart-Proxy hosts
      meta: end_host
      when: inventory_hostname != smart_proxy_server

    - name: Configure Smart Proxy hostname
      hostname:
        name: "{{ smart_proxy_server }}"

    - name: Verify Foreman server resolves
      command: getent hosts "{{ foreman_server }}"
      changed_when: false

    - name: Verify Smart Proxy hostname resolves
      command: getent hosts "{{ smart_proxy_server }}"
      changed_when: false

    - name: Install required packages
      yum:
        name:
          - curl
          - wget
          - ca-certificates
          - yum-utils
          - chrony
        state: present

    - name: Enable chronyd
      service:
        name: chronyd
        state: started
        enabled: true

    - name: Check Katello CA consumer
      command: rpm -q katello-ca-consumer
      register: katello_ca_check
      changed_when: false
      failed_when: false

    - name: Install Katello CA consumer
      yum:
        name: "http://{{ foreman_server }}/pub/katello-ca-consumer-latest.noarch.rpm"
        state: present
      when: katello_ca_check.rc != 0

    - name: Verify Katello CA consumer
      command: rpm -q katello-ca-consumer
      changed_when: false

###############################################################################
# PLAY 5 - CHECK KATELLO REGISTRATION
###############################################################################

- name: Check Smart Proxy Katello registration
  hosts: all
  become: true
  gather_facts: false

  vars:
    smart_proxy_server: "cent-07-02.vgs.com"

  tasks:

    - name: Skip non-Smart-Proxy hosts
      meta: end_host
      when: inventory_hostname != smart_proxy_server

    - name: Check subscription-manager identity
      command: subscription-manager identity
      register: subscription_identity
      changed_when: false
      failed_when: false

    - name: Display registration status
      debug:
        msg: >-
          {{
            'Smart Proxy is already registered to Katello.'
            if subscription_identity.rc == 0
            else
            'WARNING: Smart Proxy is not registered to Katello.'
          }}

###############################################################################
# PLAY 6 - INSTALL FOREMAN INSTALLER PACKAGE
###############################################################################

- name: Install Smart Proxy content installer packages
  hosts: all
  become: true
  gather_facts: false

  vars:
    smart_proxy_server: "cent-07-02.vgs.com"

  tasks:

    - name: Skip non-Smart-Proxy hosts
      meta: end_host
      when: inventory_hostname != smart_proxy_server

    - name: Install foreman-installer-katello
      yum:
        name: foreman-installer-katello
        state: present

    - name: Verify installer package
      command: rpm -q foreman-installer-katello
      changed_when: false

    - name: Verify foreman-installer command
      command: which foreman-installer
      changed_when: false

###############################################################################
# PLAY 7 - INSTALL AND CONFIGURE SMART PROXY
###############################################################################

- name: Install and configure Smart Proxy
  hosts: all
  become: true
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"
    cert_tar_file: "/root/cent-07-02.vgs.com-certs.tar"

  tasks:

    - name: Skip non-Smart-Proxy hosts
      meta: end_host
      when: inventory_hostname != smart_proxy_server

    - name: Verify certificate archive
      stat:
        path: "{{ cert_tar_file }}"
      register: installer_cert_check

    - name: Fail if certificate archive is missing
      assert:
        that:
          - installer_cert_check.stat.exists
          - installer_cert_check.stat.size | int > 0
        fail_msg: "Cannot install Smart Proxy because certificate is missing."

    - name: Verify Foreman host exists in play
      assert:
        that:
          - groups['all'] | select('equalto', foreman_server) | list | length > 0
        fail_msg: "Foreman server {{ foreman_server }} is not present in inventory."

    - name: Run Smart Proxy content installer
      command:
        argv:
          - foreman-installer
          - "--scenario"
          - "foreman-proxy-content"
          - "--certs-tar-file"
          - "{{ cert_tar_file }}"
          - "--foreman-proxy-register-in-foreman"
          - "true"
          - "--foreman-proxy-foreman-base-url"
          - "https://{{ foreman_server }}"
          - "--foreman-proxy-trusted-hosts"
          - "{{ foreman_server }}"
          - "--foreman-proxy-trusted-hosts"
          - "{{ smart_proxy_server }}"
          - "--foreman-proxy-oauth-consumer-key"
          - "{{ hostvars[foreman_server].generated_oauth_key }}"
          - "--foreman-proxy-oauth-consumer-secret"
          - "{{ hostvars[foreman_server].generated_oauth_secret }}"
      register: smart_proxy_installer
      no_log: true

    - name: Display installer completion
      debug:
        msg:
          - "Smart Proxy installer completed successfully"
          - "Scenario: foreman-proxy-content"
          - "Proxy: {{ smart_proxy_server }}"
          - "Foreman: {{ foreman_server }}"

###############################################################################
# PLAY 8 - START AND VERIFY SMART PROXY
###############################################################################

- name: Start and verify Smart Proxy services
  hosts: all
  become: true
  gather_facts: false

  vars:
    smart_proxy_server: "cent-07-02.vgs.com"

  tasks:

    - name: Skip non-Smart-Proxy hosts
      meta: end_host
      when: inventory_hostname != smart_proxy_server

    - name: Enable and start Foreman Proxy
      service:
        name: foreman-proxy
        state: started
        enabled: true

    - name: Check Foreman Proxy service status
      command: systemctl is-active foreman-proxy
      register: foreman_proxy_service
      changed_when: false

    - name: Verify Foreman Proxy is active
      assert:
        that:
          - foreman_proxy_service.stdout | trim == "active"
        fail_msg: "Foreman Proxy service is not active."

    - name: Check Smart Proxy HTTPS API
      uri:
        url: "https://{{ smart_proxy_server }}:8443/features"
        validate_certs: false
        return_content: true
        status_code: 200
      register: proxy_features
      retries: 5
      delay: 10
      until: proxy_features.status == 200

    - name: Display Smart Proxy features
      debug:
        var: proxy_features.json

###############################################################################
# PLAY 9 - VERIFY SMART PROXY REGISTRATION FROM FOREMAN
###############################################################################

- name: Verify Smart Proxy registration from Foreman server
  hosts: all
  become: true
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"

  tasks:

    - name: Skip non-Foreman hosts
      meta: end_host
      when: inventory_hostname != foreman_server

    - name: Verify Smart Proxy exists in Foreman
      shell: |
        hammer proxy list --per-page 999 | grep -F "{{ smart_proxy_server }}"
      register: hammer_proxy_check
      changed_when: false
      failed_when: false

    - name: Display Smart Proxy registration result
      debug:
        msg: >-
          {{
            'SUCCESS: Smart Proxy ' ~ smart_proxy_server ~
            ' is registered in Foreman.'
            if hammer_proxy_check.rc == 0
            else
            'WARNING: Smart Proxy was not found by hammer proxy list.'
          }}

    - name: Fail if Smart Proxy is not registered
      assert:
        that:
          - hammer_proxy_check.rc == 0
        fail_msg: >-
          Smart Proxy {{ smart_proxy_server }} was not found in Foreman.

###############################################################################
# PLAY 10 - FINAL SUMMARY
###############################################################################

- name: Display final Smart Proxy installation summary
  hosts: all
  become: false
  gather_facts: false

  vars:
    smart_proxy_server: "cent-07-02.vgs.com"
    foreman_server: "cent-07-01.vgs.com"

  tasks:

    - name: Display summary only on Smart Proxy
      debug:
        msg:
          - "============================================================"
          - "SMART PROXY INSTALLATION COMPLETED"
          - "============================================================"
          - "Foreman/Katello Server : {{ foreman_server }}"
          - "Smart Proxy            : {{ smart_proxy_server }}"
          - "Certificate            : /root/{{ smart_proxy_server }}-certs.tar"
          - "Scenario               : foreman-proxy-content"
          - "Smart Proxy API        : https://{{ smart_proxy_server }}:8443"
          - "============================================================"
      when: inventory_hostname == smart_proxy_server
