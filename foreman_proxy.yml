---
# ==============================================================================
# FILE: foreman_proxy.yml
#
# RUN:
# ansible-playbook -i centos-07-servers_inventory.yml foreman_proxy.yml \
#   -e ansible_python_interpreter=/usr/bin/python3 \
#   -u admin
#
# FOREMAN SERVER : cent-07-01.vgs.com
# SMART PROXY    : cent-07-02.vgs.com
# ==============================================================================


# ==============================================================================
# PLAY 1 - Generate Smart Proxy certificate on Foreman Server
# ==============================================================================

- name: Generate Smart Proxy certificate on Foreman Server
  hosts: cent-07-01.vgs.com
  become: true
  gather_facts: false

  vars:
    foreman_server: cent-07-01.vgs.com
    foreman_proxy: cent-07-02.vgs.com

    remote_cert_file: "/root/{{ foreman_proxy }}-certs.tar"
    cert_output_file: "/tmp/{{ foreman_proxy }}-certs-output.txt"

    local_cert_file: "/tmp/{{ foreman_proxy }}-certs.tar"

  tasks:

    - name: Remove old Smart Proxy certificate archive
      ansible.builtin.file:
        path: "{{ remote_cert_file }}"
        state: absent

    - name: Remove old certificate generation output
      ansible.builtin.file:
        path: "{{ cert_output_file }}"
        state: absent

    - name: Generate fresh Smart Proxy certificates
      ansible.builtin.shell: |
        set -o pipefail

        foreman-proxy-certs-generate \
          --foreman-proxy-fqdn "{{ foreman_proxy }}" \
          --certs-tar "{{ remote_cert_file }}" \
          2>&1 | tee "{{ cert_output_file }}"
      args:
        executable: /bin/bash
      register: certificate_generation

    - name: Verify Smart Proxy certificate archive exists
      ansible.builtin.stat:
        path: "{{ remote_cert_file }}"
      register: certificate_archive

    - name: Fail if Smart Proxy certificate archive was not created
      ansible.builtin.fail:
        msg: |
          Smart Proxy certificate archive was not created.

          Expected:
          {{ remote_cert_file }}
      when: not certificate_archive.stat.exists

    - name: Extract OAuth consumer key
      ansible.builtin.shell: |
        grep -- '--foreman-proxy-oauth-consumer-key' "{{ cert_output_file }}" \
        | tail -1 \
        | sed -n 's/.*--foreman-proxy-oauth-consumer-key "\([^"]*\)".*/\1/p'
      args:
        executable: /bin/bash
      register: oauth_key_result
      changed_when: false

    - name: Extract OAuth consumer secret
      ansible.builtin.shell: |
        grep -- '--foreman-proxy-oauth-consumer-secret' "{{ cert_output_file }}" \
        | tail -1 \
        | sed -n 's/.*--foreman-proxy-oauth-consumer-secret "\([^"]*\)".*/\1/p'
      args:
        executable: /bin/bash
      register: oauth_secret_result
      changed_when: false
      no_log: true

    - name: Store OAuth credentials
      ansible.builtin.set_fact:
        proxy_oauth_key: "{{ oauth_key_result.stdout | trim }}"
        proxy_oauth_secret: "{{ oauth_secret_result.stdout | trim }}"
      no_log: true

    - name: Verify OAuth consumer key was extracted
      ansible.builtin.assert:
        that:
          - proxy_oauth_key is defined
          - proxy_oauth_key | length > 0
        fail_msg: |
          OAuth consumer key could not be extracted from:

          {{ cert_output_file }}

    - name: Verify OAuth consumer secret was extracted
      ansible.builtin.assert:
        that:
          - proxy_oauth_secret is defined
          - proxy_oauth_secret | length > 0
        fail_msg: |
          OAuth consumer secret could not be extracted from:

          {{ cert_output_file }}
      no_log: true

    - name: Display certificate generation status
      ansible.builtin.debug:
        msg:
          - "Smart Proxy certificate generated successfully"
          - "Certificate: {{ remote_cert_file }}"
          - "OAuth consumer key extracted successfully"
          - "OAuth consumer secret extracted successfully"

    - name: Fetch Smart Proxy certificate to Ansible controller
      ansible.builtin.fetch:
        src: "{{ remote_cert_file }}"
        dest: "{{ local_cert_file }}"
        flat: true


# ==============================================================================
# PLAY 2 - Install and Configure Foreman Smart Proxy Content
# ==============================================================================

- name: Install and configure Foreman Smart Proxy Content
  hosts: cent-07-02.vgs.com
  become: true
  gather_facts: false

  vars:
    foreman_server: cent-07-01.vgs.com
    foreman_proxy: cent-07-02.vgs.com

    proxy_ip: "192.168.253.132"

    local_cert_file: "/tmp/{{ foreman_proxy }}-certs.tar"
    proxy_cert_file: "/root/{{ foreman_proxy }}-certs.tar"

    foreman_oauth_key: "{{ hostvars['cent-07-01.vgs.com']['proxy_oauth_key'] }}"
    foreman_oauth_secret: "{{ hostvars['cent-07-01.vgs.com']['proxy_oauth_secret'] }}"

  tasks:

    # ==========================================================================
    # COPY CERTIFICATE
    # ==========================================================================

    - name: Copy Smart Proxy certificate archive to Proxy server
      ansible.builtin.copy:
        src: "{{ local_cert_file }}"
        dest: "{{ proxy_cert_file }}"
        owner: root
        group: root
        mode: "0600"

    - name: Verify OAuth key is available
      ansible.builtin.assert:
        that:
          - foreman_oauth_key is defined
          - foreman_oauth_key | length > 0
        fail_msg: |
          OAuth consumer key is empty.

          Certificate generation did not return a valid OAuth key.

    - name: Verify OAuth secret is available
      ansible.builtin.assert:
        that:
          - foreman_oauth_secret is defined
          - foreman_oauth_secret | length > 0
        fail_msg: |
          OAuth consumer secret is empty.

          Certificate generation did not return a valid OAuth secret.
      no_log: true


    # ==========================================================================
    # NETWORK INTERFACE
    # ==========================================================================

    - name: Detect default route network interface
      ansible.builtin.shell: |
        ip -o route show default | awk '{print $5; exit}'
      args:
        executable: /bin/bash
      register: default_interface
      changed_when: false

    - name: Detect fallback network interface
      ansible.builtin.shell: |
        ip -o -4 addr show | awk '$2 != "lo" {print $2; exit}'
      args:
        executable: /bin/bash
      register: fallback_interface
      changed_when: false
      when: default_interface.stdout | trim == ""

    - name: Set Smart Proxy network interface
      ansible.builtin.set_fact:
        proxy_interface: >-
          {{
            default_interface.stdout | trim
            if default_interface.stdout | trim != ''
            else fallback_interface.stdout | trim
          }}

    - name: Fail if network interface cannot be detected
      ansible.builtin.fail:
        msg: |
          Unable to detect an active network interface.

          Default route:
          {{ default_interface.stdout }}
      when: proxy_interface | length == 0

    - name: Display detected network interface
      ansible.builtin.debug:
        msg: "Detected Smart Proxy interface: {{ proxy_interface }}"


    # ==========================================================================
    # CLEAN OLD DUPLICATE REPOSITORIES
    # ==========================================================================

    - name: Remove old GTK repository file
      ansible.builtin.file:
        path: /etc/yum.repos.d/gtk.repo
        state: absent

    - name: Remove old Mesa repository file
      ansible.builtin.file:
        path: /etc/yum.repos.d/mesa.repo
        state: absent

    - name: Remove old Foreman Proxy repository file
      ansible.builtin.file:
        path: /etc/yum.repos.d/foreman-proxy.repo
        state: absent


    # ==========================================================================
    # CONFIGURE REPOSITORIES
    # ==========================================================================

    - name: Configure local patch repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/patch.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [local-patch]
          name=Local CentOS Patch Repo
          baseurl=http://http-server-01.vgs.com/repo/installed_rhel7
          enabled=1
          gpgcheck=0

    - name: Configure Mesa repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/mesa.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [mesa]
          name=Local Mesa Repo
          baseurl=http://http-server-01.vgs.com/repo/mesa
          enabled=1
          gpgcheck=0
          priority=1

    - name: Configure GTK repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/gtk.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [gtk]
          name=Local GTK Repo
          baseurl=http://http-server-01.vgs.com/repo/gtk
          enabled=1
          gpgcheck=0
          priority=1

    - name: Configure Puppet 7 repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/puppet7.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [puppet7]
          name=Puppet 7 Repository EL7
          baseurl=https://yum.puppet.com/puppet7/el/7/x86_64/
          enabled=1
          gpgcheck=0

    - name: Configure Foreman repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/foreman.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [foreman]
          name=Foreman 3.2 EL7 Repository
          baseurl=https://yum-backend.repo-rpm01.osuosl.theforeman.org/releases/3.2/el7/x86_64/
          enabled=1
          gpgcheck=0

    - name: Configure Foreman plugins repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/foreman-plugins.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [foreman-plugins]
          name=Foreman Plugins 3.2 EL7 Repository
          baseurl=https://yum.theforeman.org/plugins/3.2/el7/x86_64/
          enabled=1
          gpgcheck=0

    - name: Configure CentOS 7 Vault repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/vault.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [vaultbase]
          name=CentOS Vault Base
          baseurl=http://vault.centos.org/7.9.2009/os/x86_64/
          enabled=1
          gpgcheck=0

          [updates]
          name=CentOS Vault Updates
          baseurl=http://vault.centos.org/7.9.2009/updates/x86_64/
          enabled=1
          gpgcheck=0

          [extras]
          name=CentOS Vault Extras
          baseurl=http://vault.centos.org/7.9.2009/extras/x86_64/
          enabled=1
          gpgcheck=0


    # ==========================================================================
    # YUM CACHE
    # ==========================================================================

    - name: Clean YUM metadata
      ansible.builtin.command: yum clean all
      changed_when: false

    - name: Remove old YUM cache
      ansible.builtin.file:
        path: /var/cache/yum
        state: absent

    - name: Recreate YUM cache directory
      ansible.builtin.file:
        path: /var/cache/yum
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Build YUM cache
      ansible.builtin.command: yum makecache
      changed_when: false


    # ==========================================================================
    # INSTALL REQUIRED PACKAGES
    # ==========================================================================

    - name: Install base dependencies
      ansible.builtin.yum:
        name:
          - sshpass
          - mesa-libEGL
          - gtk3
        state: present

    - name: Install Foreman packages
      ansible.builtin.yum:
        name:
          - foreman
          - foreman-proxy
          - puppetserver
          - foreman-installer
        state: present


    # ==========================================================================
    # CONTAINER GATEWAY PACKAGE
    # ==========================================================================

    - name: Check Container Gateway package
      ansible.builtin.command:
        argv:
          - rpm
          - -q
          - tfm-rubygem-smart_proxy_container_gateway
      register: container_gateway_installed
      changed_when: false
      failed_when: false

    - name: Download Container Gateway package
      ansible.builtin.get_url:
        url: >-
          https://yum.theforeman.org/plugins/3.2/el7/x86_64/
          tfm-rubygem-smart_proxy_container_gateway-1.0.6-1.fm3_1.el7.noarch.rpm
        dest: /tmp/tfm-rubygem-smart_proxy_container_gateway-1.0.6-1.fm3_1.el7.noarch.rpm
        mode: "0644"
      when: container_gateway_installed.rc != 0

    - name: Install Container Gateway package
      ansible.builtin.yum:
        name: /tmp/tfm-rubygem-smart_proxy_container_gateway-1.0.6-1.fm3_1.el7.noarch.rpm
        state: present
      when: container_gateway_installed.rc != 0


    # ==========================================================================
    # FIREWALL
    # ==========================================================================

    - name: Enable DHCP firewall service
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --add-service=dhcp
          - --permanent
      changed_when: false

    - name: Enable TFTP firewall service
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --add-service=tftp
          - --permanent
      changed_when: false

    - name: Enable HTTP firewall service
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --add-service=http
          - --permanent
      changed_when: false

    - name: Enable HTTPS firewall service
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --add-service=https
          - --permanent
      changed_when: false

    - name: Enable Smart Proxy port 9090
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --add-port=9090/tcp
          - --permanent
      changed_when: false

    - name: Reload firewall
      ansible.builtin.command: firewall-cmd --reload
      changed_when: false


    # ==========================================================================
    # HOSTNAME
    # ==========================================================================

    - name: Set Smart Proxy hostname
      ansible.builtin.command:
        argv:
          - hostnamectl
          - set-hostname
          - "{{ foreman_proxy }}"

    - name: Configure Smart Proxy hostname in hosts file
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^192\.168\.253\.132\s+'
        line: "{{ proxy_ip }} {{ foreman_proxy }} cent-07-02"
        state: present


    # ==========================================================================
    # INSTALL FOREMAN SMART PROXY
    #
    # OAuth key and secret are explicitly passed here.
    # This fixes the 401 Unauthorized error from the previous installation.
    # ==========================================================================

    - name: Install Foreman Smart Proxy Content
      ansible.builtin.command:
        argv:
          - foreman-installer
          - --force
          - --scenario
          - foreman-proxy-content
          - --certs-tar-file
          - "{{ proxy_cert_file }}"
          - --foreman-proxy-register-in-foreman
          - "true"
          - --foreman-proxy-foreman-base-url
          - "https://{{ foreman_server }}"
          - --foreman-proxy-trusted-hosts
          - "{{ foreman_server }}"
          - --foreman-proxy-trusted-hosts
          - "{{ foreman_proxy }}"
          - --foreman-proxy-oauth-consumer-key
          - "{{ foreman_oauth_key }}"
          - --foreman-proxy-oauth-consumer-secret
          - "{{ foreman_oauth_secret }}"
          - --foreman-proxy-dhcp
          - "true"
          - --foreman-proxy-dhcp-interface
          - "{{ proxy_interface }}"
          - --foreman-proxy-dns
          - "true"
          - --foreman-proxy-dns-interface
          - "{{ proxy_interface }}"
          - --foreman-proxy-tftp
          - "true"
          - --foreman-proxy-tftp-servername
          - "{{ foreman_proxy }}"
      register: installer_result
      no_log: true


    # ==========================================================================
    # VERIFY SMART PROXY
    # ==========================================================================

    - name: Ensure Foreman Proxy service is enabled
      ansible.builtin.systemd:
        name: foreman-proxy
        enabled: true
        state: started

    - name: Check Foreman Proxy service
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - foreman-proxy
      register: proxy_service_status
      changed_when: false

    - name: Verify Smart Proxy API
      ansible.builtin.uri:
        url: "https://{{ foreman_proxy }}:9090/features"
        validate_certs: false
        status_code: 200
      register: proxy_api
      retries: 10
      delay: 5
      until: proxy_api.status == 200

    - name: Display successful installation
      ansible.builtin.debug:
        msg:
          - "========================================================"
          - "FOREMAN SMART PROXY INSTALLATION COMPLETED"
          - "========================================================"
          - "Foreman Server : {{ foreman_server }}"
          - "Smart Proxy    : {{ foreman_proxy }}"
          - "Proxy IP       : {{ proxy_ip }}"
          - "Interface      : {{ proxy_interface }}"
          - "Service Status : {{ proxy_service_status.stdout }}"
          - "Proxy API      : https://{{ foreman_proxy }}:9090/features"
          - "========================================================"


# ==============================================================================
# PLAY 3 - CLEANUP TEMPORARY CERTIFICATE FROM ANSIBLE CONTROLLER
# ==============================================================================

- name: Clean temporary certificate from Ansible controller
  hosts: cent-07-01.vgs.com
  gather_facts: false

  vars:
    foreman_proxy: cent-07-02.vgs.com

  tasks:

    - name: Remove temporary Smart Proxy certificate from Ansible controller
      ansible.builtin.file:
        path: "/tmp/{{ foreman_proxy }}-certs.tar"
        state: absent
      delegate_to: localhost
      become: false

    - name: Display cleanup completion
      ansible.builtin.debug:
        msg: |
          Temporary Smart Proxy certificate removed from Ansible controller:
          /tmp/{{ foreman_proxy }}-certs.tar
