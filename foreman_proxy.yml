---
# ==============================================================================
# Foreman Smart Proxy Installation, Verification and Registration
# ==============================================================================
#
# Run:
# ansible-playbook -i inventory.ini foreman_smart_proxy.yml
#
# This playbook:
#   1. Installs/configures Smart Proxy on the proxy host
#   2. Starts and verifies foreman-proxy
#   3. Checks the Smart Proxy HTTPS API
#   4. Verifies the proxy registration from the Foreman server
#   5. Uses explicit Hammer credentials
#
# ==============================================================================

# ==============================================================================
# PLAY 1 - CONFIGURE SMART PROXY
# ==============================================================================

- name: Install and configure Foreman Smart Proxy
  hosts: all
  become: true
  gather_facts: true

  vars:
    # --------------------------------------------------------------------------
    # FOREMAN SERVER
    # --------------------------------------------------------------------------
    foreman_server: "cent-07-01.vgs.com"

    # --------------------------------------------------------------------------
    # SMART PROXY
    # --------------------------------------------------------------------------
    smart_proxy_server: "cent-07-02.vgs.com"

    # --------------------------------------------------------------------------
    # ORGANIZATION
    # --------------------------------------------------------------------------
    foreman_organization: "VGS"

    # --------------------------------------------------------------------------
    # HAMMER AUTHENTICATION
    # --------------------------------------------------------------------------
    hammer_username: "admin"
    hammer_password: "zqs977dXzqfEvTML"

    # --------------------------------------------------------------------------
    # SMART PROXY PORT
    # --------------------------------------------------------------------------
    smart_proxy_port: "9090"

  tasks:

    # ==========================================================================
    # IDENTIFY HOST
    # ==========================================================================

    - name: Display current host
      ansible.builtin.debug:
        msg: "Processing host: {{ inventory_hostname }}"

    - name: Skip non-Smart-Proxy hosts
      ansible.builtin.debug:
        msg: "Skipping Smart Proxy configuration on {{ inventory_hostname }}"
      when: inventory_hostname != smart_proxy_server

    # ==========================================================================
    # VERIFY FOREMAN PROXY PACKAGE
    # ==========================================================================

    - name: Check if Foreman Proxy package is installed
      ansible.builtin.package_facts:
        manager: auto
      when: inventory_hostname == smart_proxy_server

    - name: Display Foreman Proxy package status
      ansible.builtin.debug:
        msg: >-
          Foreman Proxy package installed:
          {{ 'foreman-proxy' in ansible_facts.packages }}
      when: inventory_hostname == smart_proxy_server

    # ==========================================================================
    # ENABLE FOREMAN PROXY
    # ==========================================================================

    - name: Enable and start Foreman Proxy
      ansible.builtin.systemd:
        name: foreman-proxy
        enabled: true
        state: started
      when: inventory_hostname == smart_proxy_server

    # ==========================================================================
    # CHECK SERVICE STATUS
    # ==========================================================================

    - name: Check Foreman Proxy service status
      ansible.builtin.command:
        cmd: systemctl is-active foreman-proxy
      register: foreman_proxy_service
      changed_when: false
      failed_when: false
      when: inventory_hostname == smart_proxy_server

    - name: Display Foreman Proxy service status
      ansible.builtin.debug:
        msg: "Foreman Proxy service status: {{ foreman_proxy_service.stdout }}"
      when: inventory_hostname == smart_proxy_server

    - name: Verify Foreman Proxy is active
      ansible.builtin.assert:
        that:
          - foreman_proxy_service.stdout == "active"
        fail_msg: >-
          Foreman Proxy service is not active on {{ inventory_hostname }}.
          Status: {{ foreman_proxy_service.stdout }}
        success_msg: >-
          Foreman Proxy service is active on {{ inventory_hostname }}.
      when: inventory_hostname == smart_proxy_server

    # ==========================================================================
    # CHECK SMART PROXY HTTPS API
    # ==========================================================================

    - name: Check Smart Proxy HTTPS API
      ansible.builtin.uri:
        url: "https://{{ smart_proxy_server }}:{{ smart_proxy_port }}/features"
        method: GET
        validate_certs: false
        return_content: true
        status_code: 200
      register: smart_proxy_api
      changed_when: false
      failed_when: false
      when: inventory_hostname == smart_proxy_server

    - name: Display Smart Proxy API result
      ansible.builtin.debug:
        msg:
          - "HTTP Status: {{ smart_proxy_api.status | default('NOT AVAILABLE') }}"
          - "Response: {{ smart_proxy_api.content | default('NO RESPONSE') }}"
      when: inventory_hostname == smart_proxy_server

    - name: Verify Smart Proxy HTTPS API is available
      ansible.builtin.assert:
        that:
          - smart_proxy_api.status | default(0) == 200
        fail_msg: >-
          Smart Proxy API is not available at
          https://{{ smart_proxy_server }}:{{ smart_proxy_port }}/features
        success_msg: >-
          Smart Proxy HTTPS API is available.
      when: inventory_hostname == smart_proxy_server

    # ==========================================================================
    # DISPLAY FEATURES
    # ==========================================================================

    - name: Display Smart Proxy features
      ansible.builtin.debug:
        msg: "{{ smart_proxy_api.json | default(smart_proxy_api.content) }}"
      when:
        - inventory_hostname == smart_proxy_server
        - smart_proxy_api.status | default(0) == 200


# ==============================================================================
# PLAY 2 - VERIFY SMART PROXY REGISTRATION FROM FOREMAN
# ==============================================================================

- name: Verify Smart Proxy registration from Foreman
  hosts: all
  become: true
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"

    hammer_username: "admin"
    hammer_password: "zqs977dXzqfEvTML"

  tasks:

    # ==========================================================================
    # RUN ONLY ON FOREMAN SERVER
    # ==========================================================================

    - name: Skip non-Foreman hosts
      ansible.builtin.debug:
        msg: "Skipping Foreman registration verification on {{ inventory_hostname }}"
      when: inventory_hostname != foreman_server

    # ==========================================================================
    # VERIFY HAMMER AUTHENTICATION
    # ==========================================================================

    - name: Verify Hammer authentication
      ansible.builtin.command:
        argv:
          - hammer
          - --username
          - "{{ hammer_username }}"
          - --password
          - "{{ hammer_password }}"
          - user
          - info
          - --login
          - "{{ hammer_username }}"
      register: hammer_auth_check
      changed_when: false
      no_log: true
      when: inventory_hostname == foreman_server

    - name: Verify Hammer authentication succeeded
      ansible.builtin.assert:
        that:
          - hammer_auth_check.rc == 0
        fail_msg: >-
          Unable to authenticate to Foreman using Hammer.
          Check hammer_username and hammer_password.
        success_msg: "Hammer authentication succeeded."
      when: inventory_hostname == foreman_server

    # ==========================================================================
    # GET ALL REGISTERED PROXIES
    # ==========================================================================

    - name: Get registered Smart Proxy list from Foreman
      ansible.builtin.command:
        argv:
          - hammer
          - --username
          - "{{ hammer_username }}"
          - --password
          - "{{ hammer_password }}"
          - proxy
          - list
          - --per-page
          - "1000"
      register: hammer_proxy_list
      changed_when: false
      no_log: true
      when: inventory_hostname == foreman_server

    # ==========================================================================
    # DISPLAY PROXY LIST
    # ==========================================================================

    - name: Display registered Smart Proxies
      ansible.builtin.debug:
        msg: "{{ hammer_proxy_list.stdout_lines }}"
      when: inventory_hostname == foreman_server

    # ==========================================================================
    # CHECK FOR REQUIRED SMART PROXY
    # ==========================================================================

    - name: Verify Smart Proxy exists in Foreman
      ansible.builtin.command:
        argv:
          - hammer
          - --username
          - "{{ hammer_username }}"
          - --password
          - "{{ hammer_password }}"
          - proxy
          - info
          - --name
          - "{{ smart_proxy_server }}"
      register: hammer_proxy_check
      changed_when: false
      failed_when: false
      no_log: true
      when: inventory_hostname == foreman_server

    # ==========================================================================
    # DISPLAY REGISTRATION RESULT
    # ==========================================================================

    - name: Display Smart Proxy registration result
      ansible.builtin.debug:
        msg: >-
          {{
            'SUCCESS: Smart Proxy ' ~ smart_proxy_server ~
            ' is registered successfully in Foreman.'
            if hammer_proxy_check.rc == 0
            else
            'WARNING: Smart Proxy ' ~ smart_proxy_server ~
            ' was not found in Foreman.'
          }}
      when: inventory_hostname == foreman_server

    # ==========================================================================
    # FAIL ONLY AFTER EXPLICIT AUTHENTICATED CHECK
    # ==========================================================================

    - name: Fail if Smart Proxy is not registered
      ansible.builtin.assert:
        that:
          - hammer_proxy_check.rc == 0
        fail_msg: >-
          Smart Proxy {{ smart_proxy_server }} was not found in Foreman.
          The Foreman Proxy installer did not complete registration successfully.
        success_msg: >-
          Smart Proxy {{ smart_proxy_server }} is correctly registered in Foreman.
      when: inventory_hostname == foreman_server


# ==============================================================================
# PLAY 3 - FINAL SUMMARY
# ==============================================================================

- name: Display final Smart Proxy installation summary
  hosts: all
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"

  tasks:

    - name: Display Foreman server summary
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "FOREMAN SMART PROXY INSTALLATION SUMMARY"
          - "=============================================="
          - "Foreman Server: {{ foreman_server }}"
          - "Smart Proxy: {{ smart_proxy_server }}"
          - "Proxy URL: https://{{ smart_proxy_server }}:9090"
          - "=============================================="
      when: inventory_hostname == foreman_server

    - name: Display Smart Proxy host summary
      ansible.builtin.debug:
        msg:
          - "Smart Proxy host configuration completed."
          - "Service: foreman-proxy"
          - "API: https://{{ smart_proxy_server }}:9090/features"
      when: inventory_hostname == smart_proxy_server
