---
###############################################################################
# FOREMAN / KATELLO SMART PROXY INSTALLATION
#
# Run from:
#   cent-07-01.vgs.com
#
# Inventory:
#   FOREMAN       -> cent-07-01.vgs.com
#   FOREMAN_PROXY -> cent-07-02.vgs.com
#
# EFI CONFIGURATION:
#   COMPLETELY REMOVED
#
# Workflow:
#   1. Generate Smart Proxy certificate on Foreman
#   2. Extract OAuth credentials
#   3. Prepare Smart Proxy
#   4. Replace old YUM repositories
#   5. Install Smart Proxy packages
#   6. Transfer certificates
#   7. Configure hostname
#   8. Detect active network interface
#   9. Run foreman-proxy-content installer
#  10. Configure DHCP
#  11. Configure DNS/TFTP
#  12. Download Rocky PXE kernel/initrd files
#  13. Start and verify Smart Proxy
#  14. Verify Foreman registration
###############################################################################


###############################################################################
# PLAY 1 - GENERATE SMART PROXY CERTIFICATE ON FOREMAN
###############################################################################

- name: Generate Smart Proxy certificate on Foreman
  hosts: FOREMAN
  become: true
  gather_facts: true

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"

    cert_generator: "/usr/sbin/foreman-proxy-certs-generate"
    cert_tar: "/root/cent-07-02.vgs.com-certs.tar"
    cert_output: "/tmp/proxy_installer_output.txt"

  tasks:

    ###########################################################################
    # CERTIFICATE GENERATOR
    ###########################################################################

    - name: Verify certificate generator exists
      ansible.builtin.stat:
        path: "{{ cert_generator }}"
      register: cert_generator_stat

    - name: Fallback locate certificate generator
      ansible.builtin.command:
        cmd: "sh -c 'command -v foreman-proxy-certs-generate || true'"
      register: cert_generator_fallback
      changed_when: false
      when: not cert_generator_stat.stat.exists

    - name: Set certificate generator path
      ansible.builtin.set_fact:
        cert_generator_path: >-
          {{
            cert_generator
            if cert_generator_stat.stat.exists
            else (cert_generator_fallback.stdout | trim)
          }}

    - name: Fail if certificate generator is unavailable
      ansible.builtin.fail:
        msg: >
          foreman-proxy-certs-generate was not found on
          {{ inventory_hostname }}
      when: cert_generator_path | length == 0

    - name: Remove previous certificate archive
      ansible.builtin.file:
        path: "{{ cert_tar }}"
        state: absent

    - name: Remove previous installer output
      ansible.builtin.file:
        path: "{{ cert_output }}"
        state: absent

    ###########################################################################
    # CAPTURE STDOUT + STDERR
    ###########################################################################

    - name: Generate Smart Proxy certificate archive and capture all output
      ansible.builtin.shell: |
        set -o pipefail
        "{{ cert_generator_path }}" \
          --foreman-proxy-fqdn "{{ smart_proxy_server }}" \
          --certs-tar "{{ cert_tar }}" \
          2>&1 | tee "{{ cert_output }}"
      args:
        executable: /bin/bash
      register: cert_generation
      changed_when: true

    - name: Verify certificate archive
      ansible.builtin.stat:
        path: "{{ cert_tar }}"
      register: cert_tar_stat

    - name: Fail if certificate archive was not generated
      ansible.builtin.assert:
        that:
          - cert_tar_stat.stat.exists
          - cert_tar_stat.stat.size | int > 0
        fail_msg: >
          Certificate archive was not generated:
          {{ cert_tar }}

    - name: Verify certificate generator output
      ansible.builtin.stat:
        path: "{{ cert_output }}"
      register: cert_output_stat

    - name: Fail if certificate generator output is empty
      ansible.builtin.assert:
        that:
          - cert_output_stat.stat.exists
          - cert_output_stat.stat.size | int > 0
        fail_msg: >
          Certificate generator output is missing or empty:
          {{ cert_output }}

    ###########################################################################
    # DISPLAY OAUTH LINES
    ###########################################################################

    - name: Display OAuth lines generated by Foreman
      ansible.builtin.shell: |
        grep -nE -- \
          '--foreman-proxy-oauth-consumer-(key|secret)' \
          "{{ cert_output }}" || true
      args:
        executable: /bin/bash
      register: oauth_debug_lines
      changed_when: false

    - name: Display OAuth generator output lines
      ansible.builtin.debug:
        var: oauth_debug_lines.stdout_lines

    ###########################################################################
    # EXTRACT OAUTH KEY
    ###########################################################################

    - name: Extract OAuth consumer key
      ansible.builtin.shell: |
        set -o pipefail
        grep -- '--foreman-proxy-oauth-consumer-key' "{{ cert_output }}" \
          | awk -F'"' '{print $2; exit}'
      args:
        executable: /bin/bash
      register: oauth_key_result
      changed_when: false
      failed_when: false
      no_log: true

    ###########################################################################
    # EXTRACT OAUTH SECRET
    ###########################################################################

    - name: Extract OAuth consumer secret
      ansible.builtin.shell: |
        set -o pipefail
        grep -- '--foreman-proxy-oauth-consumer-secret' "{{ cert_output }}" \
          | awk -F'"' '{print $2; exit}'
      args:
        executable: /bin/bash
      register: oauth_secret_result
      changed_when: false
      failed_when: false
      no_log: true

    - name: Set OAuth credential facts
      ansible.builtin.set_fact:
        oauth_key: "{{ oauth_key_result.stdout | trim }}"
        oauth_secret: "{{ oauth_secret_result.stdout | trim }}"
      no_log: true

    - name: Display OAuth extraction status
      ansible.builtin.debug:
        msg:
          - "OAuth consumer key extracted    : {{ oauth_key | length > 0 }}"
          - "OAuth consumer secret extracted : {{ oauth_secret | length > 0 }}"

    - name: Fail when OAuth credentials could not be extracted
      ansible.builtin.fail:
        msg: |
          OAuth consumer key/secret could not be extracted.

          Certificate generator output:
          {{ cert_output }}

          Run on Foreman:

          grep -nE -- \
          '--foreman-proxy-oauth-consumer-(key|secret)' \
          {{ cert_output }}
      when:
        - oauth_key | length == 0 or oauth_secret | length == 0

    - name: Display certificate generation result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "Smart Proxy certificate generated"
          - "============================================================"
          - "Foreman Server : {{ foreman_server }}"
          - "Smart Proxy    : {{ smart_proxy_server }}"
          - "Certificate    : {{ cert_tar }}"
          - "OAuth Key      : extracted"
          - "OAuth Secret   : extracted"
          - "EFI            : COMPLETELY SKIPPED"
          - "============================================================"

    - name: Publish OAuth values for next play
      ansible.builtin.set_fact:
        proxy_oauth_key: "{{ oauth_key }}"
        proxy_oauth_secret: "{{ oauth_secret }}"
      no_log: true


###############################################################################
# PLAY 2 - PREPARE AND INSTALL SMART PROXY
###############################################################################

- name: Prepare and install Smart Proxy
  hosts: FOREMAN_PROXY
  become: true
  gather_facts: true

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"

    cert_tar_foreman: "/root/cent-07-02.vgs.com-certs.tar"
    cert_tar_proxy: "/root/cent-07-02.vgs.com-certs.tar"

    proxy_ip: "192.168.253.132"
    dhcp_gateway: "192.168.253.2"
    dhcp_dns_server: "192.168.253.1"
    dhcp_domain: "vgs.com"

    local_patch_repo: "http://http-server-01.vgs.com/repo/installed_rhel7"
    mesa_repo: "http://http-server-01.vgs.com/repo/mesa"
    gtk_repo: "http://http-server-01.vgs.com/repo/gtk"

    rocky8_vmlinuz: "http://http-server-01/repo/rocky8/isolinux/vmlinuz"
    rocky8_initrd: "http://http-server-01/repo/rocky8/isolinux/initrd.img"

    rocky9_vmlinuz: "http://http-server-01/repo/rocky9/images/pxeboot/vmlinuz"
    rocky9_initrd: "http://http-server-01/repo/rocky9/images/pxeboot/initrd.img"

    rocky92_vmlinuz: "http://http-server-01/repo/rocky9.2/images/pxeboot/vmlinuz"
    rocky92_initrd: "http://http-server-01/repo/rocky9.2/images/pxeboot/initrd.img"

  tasks:

    ###########################################################################
    # HOSTNAME
    ###########################################################################

    - name: Set Smart Proxy hostname
      ansible.builtin.hostname:
        name: "{{ smart_proxy_server }}"

    - name: Verify Foreman resolves
      ansible.builtin.command:
        cmd: "getent hosts {{ foreman_server }}"
      changed_when: false

    ###########################################################################
    # REPOSITORIES
    ###########################################################################

    - name: Remove old YUM repository files
      ansible.builtin.shell: |
        rm -f /etc/yum.repos.d/*.repo
      args:
        executable: /bin/bash
      changed_when: true

    - name: Create local patch repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/patch.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [local-patch]
          name=Local CentOS Patch Repo
          baseurl={{ local_patch_repo }}
          enabled=1
          gpgcheck=0

          [mesa]
          name=Local Mesa Repo
          baseurl={{ mesa_repo }}
          enabled=1
          gpgcheck=0
          priority=1

          [gtk]
          name=Local GTK Repo
          baseurl={{ gtk_repo }}
          enabled=1
          gpgcheck=0
          priority=1

    - name: Create Puppet 7 repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/puppet.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [puppet7]
          name=Puppet 7 Repository EL7
          baseurl=https://yum.puppet.com/puppet7/el/7/x86_64/
          enabled=1
          gpgcheck=0

    - name: Create Foreman repositories
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/foreman-online.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [foreman-new-repo]
          name=Foreman New Repo
          baseurl=https://yum-backend.repo-rpm01.osuosl.theforeman.org/releases/3.0/el7/x86_64/
          enabled=1
          gpgcheck=0

          [foreman-add-repo]
          name=Foreman Add Repo
          baseurl=https://yum.theforeman.org/plugins/3.2/el7/x86_64/
          enabled=1
          gpgcheck=0

    - name: Create CentOS Vault repositories
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/vault.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [vaultbase]
          name=CentOS Vault Base
          baseurl=http://vault.centos.org/7.9.2009/os/x86_64/
          enabled=1
          gpgcheck=0

          [updates]
          name=CentOS Vault Updates
          baseurl=http://vault.centos.org/7.9.2009/updates/x86_64/
          enabled=1
          gpgcheck=0

          [extras]
          name=CentOS Vault Extras
          baseurl=http://vault.centos.org/7.9.2009/extras/x86_64/
          enabled=1
          gpgcheck=0

    - name: Clean YUM metadata
      ansible.builtin.command:
        cmd: yum clean all
      changed_when: false
      failed_when: false

    ###########################################################################
    # PACKAGES
    ###########################################################################

    - name: Install base packages
      ansible.builtin.shell: |
        yum install -y sshpass mesa-libEGL\* gtk\*
      args:
        executable: /bin/bash

    - name: Install Foreman Proxy packages
      ansible.builtin.shell: |
        yum install -y foreman foreman-proxy puppetserver --skip-broken
      args:
        executable: /bin/bash

    - name: Install Foreman installer packages
      ansible.builtin.shell: |
        yum install -y foreman-installer\*
      args:
        executable: /bin/bash

    - name: Verify foreman-installer exists
      ansible.builtin.command:
        cmd: which foreman-installer
      changed_when: false

    - name: Verify foreman-proxy package
      ansible.builtin.command:
        cmd: rpm -q foreman-proxy
      changed_when: false

    ###########################################################################
    # CERTIFICATE TRANSFER
    ###########################################################################

    - name: Create local certificate staging directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/.smart_proxy_cert"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Fetch Smart Proxy certificate archive from Foreman
      ansible.builtin.fetch:
        src: "{{ cert_tar_foreman }}"
        dest: "{{ playbook_dir }}/.smart_proxy_cert/"
        flat: true
      delegate_to: "{{ groups['FOREMAN'][0] }}"

    - name: Verify certificate archive on controller
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/.smart_proxy_cert/cent-07-02.vgs.com-certs.tar"
      register: controller_cert_stat
      delegate_to: localhost
      become: false

    - name: Fail if certificate archive is missing on controller
      ansible.builtin.assert:
        that:
          - controller_cert_stat.stat.exists
          - controller_cert_stat.stat.size | int > 0
        fail_msg: "Certificate archive was not fetched to controller."

    - name: Copy certificate archive to Smart Proxy
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/.smart_proxy_cert/cent-07-02.vgs.com-certs.tar"
        dest: "{{ cert_tar_proxy }}"
        owner: root
        group: root
        mode: "0600"

    - name: Remove local certificate staging directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/.smart_proxy_cert"
        state: absent
      delegate_to: localhost
      become: false

    - name: Create Foreman Proxy certificate directory
      ansible.builtin.file:
        path: /etc/foreman-proxy
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Extract Smart Proxy certificates
      ansible.builtin.unarchive:
        src: "{{ cert_tar_proxy }}"
        dest: /etc/foreman-proxy
        remote_src: true

    ###########################################################################
    # HOSTS / DNS
    ###########################################################################

    - name: Configure /etc/hosts
      ansible.builtin.copy:
        dest: /etc/hosts
        owner: root
        group: root
        mode: "0644"
        content: |
          127.0.0.1 localhost localhost.localdomain localhost4 localhost4.localdomain4
          ::1 localhost localhost.localdomain localhost6 localhost6.localdomain6

          {{ proxy_ip }} {{ smart_proxy_server }} {{ smart_proxy_server.split('.')[0] }}

    - name: Verify full hostname
      ansible.builtin.command:
        cmd: hostname -f
      changed_when: false

    - name: Verify Smart Proxy forward lookup
      ansible.builtin.command:
        cmd: "getent hosts {{ smart_proxy_server }}"
      changed_when: false

    - name: Verify Smart Proxy reverse lookup
      ansible.builtin.command:
        cmd: "getent hosts {{ proxy_ip }}"
      register: reverse_lookup
      changed_when: false
      failed_when: false

    - name: Display DNS information
      ansible.builtin.debug:
        msg:
          - "Expected hostname : {{ smart_proxy_server }}"
          - "Proxy IP          : {{ proxy_ip }}"
          - "Reverse lookup    : {{ reverse_lookup.stdout | default('FAILED') }}"

    ###########################################################################
    # NETWORK
    ###########################################################################

    - name: Detect active network interface
      ansible.builtin.shell: |
        ip -o route show default | awk '{print $5; exit}'
      args:
        executable: /bin/bash
      register: default_interface
      changed_when: false

    - name: Fallback to first non-loopback interface
      ansible.builtin.shell: |
        ip -o -4 addr show | awk '$2 != "lo" {print $2; exit}'
      args:
        executable: /bin/bash
      register: fallback_interface
      changed_when: false
      when: default_interface.stdout | trim == ""

    - name: Set active interface
      ansible.builtin.set_fact:
        active_interface: >-
          {{
            default_interface.stdout | trim
            if (default_interface.stdout | trim) != ''
            else (fallback_interface.stdout | trim)
          }}

    - name: Verify active interface
      ansible.builtin.command:
        cmd: "ip link show {{ active_interface }}"
      changed_when: false

    - name: Display network information
      ansible.builtin.shell: |
        echo "===== NETWORK INFO ====="
        ip route
        ip -o -4 addr show
        echo "Detected interface: {{ active_interface }}"
        echo "========================"
      args:
        executable: /bin/bash
      changed_when: false

    ###########################################################################
    # FIREWALL
    ###########################################################################

    - name: Open DHCP firewall
      ansible.posix.firewalld:
        service: dhcp
        permanent: true
        immediate: true
        state: enabled

    - name: Open TFTP firewall
      ansible.posix.firewalld:
        service: tftp
        permanent: true
        immediate: true
        state: enabled

    - name: Open HTTP firewall
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled

    - name: Open HTTPS firewall
      ansible.posix.firewalld:
        service: https
        permanent: true
        immediate: true
        state: enabled

    - name: Open Smart Proxy port 9090
      ansible.posix.firewalld:
        port: 9090/tcp
        permanent: true
        immediate: true
        state: enabled

    ###########################################################################
    # OAUTH
    ###########################################################################

    - name: Get OAuth values from Foreman host
      ansible.builtin.set_fact:
        proxy_oauth_key: >-
          {{ hostvars[groups['FOREMAN'][0]].proxy_oauth_key | default('') }}
        proxy_oauth_secret: >-
          {{ hostvars[groups['FOREMAN'][0]].proxy_oauth_secret | default('') }}
      no_log: true

    - name: Fail if OAuth values are unavailable
      ansible.builtin.assert:
        that:
          - proxy_oauth_key | length > 0
          - proxy_oauth_secret | length > 0
        fail_msg: >
          OAuth values generated on Foreman are unavailable.
      no_log: true

    ###########################################################################
    # FOREMAN PROXY CONTENT INSTALLER
    ###########################################################################

    - name: Run Foreman Smart Proxy content installer
      ansible.builtin.command:
        argv:
          - foreman-installer
          - --force
          - --scenario
          - foreman-proxy-content
          - --certs-tar-file
          - "{{ cert_tar_proxy }}"
          - --foreman-proxy-register-in-foreman
          - "true"
          - --foreman-proxy-foreman-base-url
          - "https://{{ foreman_server }}"
          - --foreman-proxy-trusted-hosts
          - "{{ foreman_server }}"
          - --foreman-proxy-trusted-hosts
          - "{{ smart_proxy_server }}"
          - --foreman-proxy-oauth-consumer-key
          - "{{ proxy_oauth_key }}"
          - --foreman-proxy-oauth-consumer-secret
          - "{{ proxy_oauth_secret }}"
          - --foreman-proxy-dhcp
          - "true"
          - --foreman-proxy-dhcp-interface
          - "{{ active_interface }}"
          - --foreman-proxy-dns
          - "true"
          - --foreman-proxy-dns-interface
          - "{{ active_interface }}"
          - --foreman-proxy-tftp
          - "true"
          - --foreman-proxy-tftp-servername
          - "{{ smart_proxy_server }}"
      register: proxy_installer

    - name: Display Foreman installer stdout
      ansible.builtin.debug:
        var: proxy_installer.stdout_lines

    - name: Display Foreman installer stderr
      ansible.builtin.debug:
        var: proxy_installer.stderr_lines
      when: proxy_installer.stderr_lines | length > 0

    - name: Fail when Foreman Proxy installer failed
      ansible.builtin.fail:
        msg: |
          Foreman Smart Proxy installer failed.

          Return code:
          {{ proxy_installer.rc }}

          STDERR:
          {{ proxy_installer.stderr | default('') }}

          STDOUT:
          {{ proxy_installer.stdout | default('') }}
      when: proxy_installer.rc != 0


    ###########################################################################
    # DHCP
    ###########################################################################

    - name: Configure DHCP DNS server
      ansible.builtin.replace:
        path: /etc/dhcp/dhcpd.conf
        regexp: '^[[:space:]]*option[[:space:]]+domain-name-servers[[:space:]]+[^;]+;'
        replace: '  option domain-name-servers {{ dhcp_dns_server }};'

    - name: Configure DHCP domain name
      ansible.builtin.replace:
        path: /etc/dhcp/dhcpd.conf
        regexp: '^[[:space:]]*option[[:space:]]+domain-name[[:space:]]+[^;]+;'
        replace: '  option domain-name "{{ dhcp_domain }}";'

    - name: Add DHCP gateway option if missing
      ansible.builtin.lineinfile:
        path: /etc/dhcp/dhcpd.conf
        insertafter: 'option subnet-mask'
        line: "  option routers {{ dhcp_gateway }};"
        state: present

    - name: Make DHCP authoritative
      ansible.builtin.replace:
        path: /etc/dhcp/dhcpd.conf
        regexp: '^not authoritative;$'
        replace: 'authoritative;'

    - name: Validate DHCP configuration
      ansible.builtin.command:
        cmd: dhcpd -t -cf /etc/dhcp/dhcpd.conf
      changed_when: false

    - name: Enable and restart DHCP
      ansible.builtin.systemd:
        name: dhcpd
        enabled: true
        state: restarted

    ###########################################################################
    # ROCKY PXE KERNEL / INITRD
    #
    # NO EFI TASKS HERE.
    ###########################################################################

    - name: Create Rocky 8 TFTP directory
      ansible.builtin.file:
        path: /var/lib/tftpboot/rocky8
        state: directory
        owner: foreman-proxy
        group: root
        mode: "0755"

    - name: Download Rocky 8 vmlinuz
      ansible.builtin.get_url:
        url: "{{ rocky8_vmlinuz }}"
        dest: /var/lib/tftpboot/rocky8/vmlinuz
        owner: foreman-proxy
        group: root
        mode: "0644"

    - name: Download Rocky 8 initrd
      ansible.builtin.get_url:
        url: "{{ rocky8_initrd }}"
        dest: /var/lib/tftpboot/rocky8/initrd.img
        owner: foreman-proxy
        group: root
        mode: "0644"

    - name: Create Rocky 9 TFTP directory
      ansible.builtin.file:
        path: /var/lib/tftpboot/rocky9
        state: directory
        owner: foreman-proxy
        group: root
        mode: "0755"

    - name: Download Rocky 9 vmlinuz
      ansible.builtin.get_url:
        url: "{{ rocky9_vmlinuz }}"
        dest: /var/lib/tftpboot/rocky9/vmlinuz
        owner: foreman-proxy
        group: root
        mode: "0644"

    - name: Download Rocky 9 initrd
      ansible.builtin.get_url:
        url: "{{ rocky9_initrd }}"
        dest: /var/lib/tftpboot/rocky9/initrd.img
        owner: foreman-proxy
        group: root
        mode: "0644"

    - name: Create Rocky 9.2 TFTP directory
      ansible.builtin.file:
        path: /var/lib/tftpboot/rocky92
        state: directory
        owner: foreman-proxy
        group: root
        mode: "0755"

    - name: Download Rocky 9.2 vmlinuz
      ansible.builtin.get_url:
        url: "{{ rocky92_vmlinuz }}"
        dest: /var/lib/tftpboot/rocky92/vmlinuz
        owner: foreman-proxy
        group: root
        mode: "0644"

    - name: Download Rocky 9.2 initrd
      ansible.builtin.get_url:
        url: "{{ rocky92_initrd }}"
        dest: /var/lib/tftpboot/rocky92/initrd.img
        owner: foreman-proxy
        group: root
        mode: "0644"

    ###########################################################################
    # SERVICES
    ###########################################################################

    - name: Enable and start Foreman Proxy
      ansible.builtin.systemd:
        name: foreman-proxy
        enabled: true
        state: started

    - name: Check Foreman Proxy service
      ansible.builtin.command:
        cmd: systemctl is-active foreman-proxy
      register: foreman_proxy_status
      changed_when: false

    - name: Wait for port 9090
      ansible.builtin.wait_for:
        host: "{{ smart_proxy_server }}"
        port: 9090
        timeout: 120
        state: started

    - name: Display Smart Proxy status
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "Smart Proxy service verification"
          - "============================================================"
          - "Service : {{ foreman_proxy_status.stdout }}"
          - "URL     : https://{{ smart_proxy_server }}:9090"
          - "EFI     : COMPLETELY SKIPPED"
          - "============================================================"

    ###########################################################################
    # PXE FILE VERIFICATION
    ###########################################################################

    - name: Display installed PXE kernel/initrd files
      ansible.builtin.shell: |
        find /var/lib/tftpboot -maxdepth 3 -type f \
          \( -name 'vmlinuz' -o -name 'initrd.img' \) \
          -printf '%p\n' | sort
      args:
        executable: /bin/bash
      register: pxe_files
      changed_when: false

    - name: Show PXE files
      ansible.builtin.debug:
        var: pxe_files.stdout_lines


###############################################################################
# PLAY 3 - VERIFY SMART PROXY REGISTRATION
###############################################################################

- name: Verify Smart Proxy registration from Foreman
  hosts: FOREMAN
  become: true
  gather_facts: false

  vars:
    foreman_server: "cent-07-01.vgs.com"
    smart_proxy_server: "cent-07-02.vgs.com"

  tasks:

    ###########################################################################
    # API CHECK
    #
    # Pass:
    #   -e "foreman_api_password=PASSWORD"
    ###########################################################################

    - name: Get Smart Proxies from Foreman API
      ansible.builtin.uri:
        url: "https://{{ foreman_server }}/api/smart_proxies?per_page=100"
        method: GET
        user: "{{ foreman_api_user | default('admin') }}"
        password: "{{ foreman_api_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        headers:
          Accept: "application/json"
      register: smart_proxy_api
      when: foreman_api_password is defined

    - name: Display registered Smart Proxies
      ansible.builtin.debug:
        msg: >-
          {{
            smart_proxy_api.json.results
            | default([])
            | map(attribute='name')
            | list
          }}
      when: foreman_api_password is defined

    - name: Get Smart Proxy by name from Foreman
      ansible.builtin.uri:
        url: >-
          https://{{ foreman_server }}/api/smart_proxies
          ?search=name={{ smart_proxy_server }}
        method: GET
        user: "{{ foreman_api_user | default('admin') }}"
        password: "{{ foreman_api_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        headers:
          Accept: "application/json"
      register: smart_proxy_lookup
      when: foreman_api_password is defined

    - name: Display Smart Proxy lookup
      ansible.builtin.debug:
        var: smart_proxy_lookup.json
      when: foreman_api_password is defined

    - name: Fail if Smart Proxy is not registered
      ansible.builtin.fail:
        msg: |
          Smart Proxy {{ smart_proxy_server }} is not registered.

          Foreman API response:
          {{ smart_proxy_lookup.json | to_nice_json }}
      when:
        - foreman_api_password is defined
        - smart_proxy_lookup.json.results | length == 0

    - name: Display final success
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SMART PROXY INSTALLATION COMPLETED"
          - "============================================================"
          - "Foreman Server : {{ foreman_server }}"
          - "Smart Proxy    : {{ smart_proxy_server }}"
          - "Scenario       : foreman-proxy-content"
          - "DHCP           : configured"
          - "DNS            : configured"
          - "TFTP           : configured"
          - "Rocky PXE      : 8 / 9 / 9.2 kernel + initrd"
          - "EFI            : NOT CONFIGURED"
          - "============================================================"
