#==============================================================================
# CentOS 7 Enterprise Golden Image
# UEFI + GPT + Software RAID1 + LVM
# 100% OFFLINE CDROM BASEOS PACKAGING LAYER (REPOS HARD-LINKED SECURE)
#==============================================================================
text
cdrom
lang en_US.UTF-8
keyboard us
timezone Asia/Kolkata --isUtc
rootpw --plaintext Root@123
network --bootproto=dhcp --device=link --activate
firewall --enabled --service=ssh
selinux --enforcing
services --enabled="NetworkManager,sshd,chronyd"
reboot

##############################################################################
# PRE INSTALL: HARDWARE STORAGE CLEANUP & HARD-CODED SECTOR MAPPING
##############################################################################
%pre --interpreter=/usr/bin/bash --log=/tmp/ks-pre.log
exec > /tmp/ks-pre.log 2>&1

echo "======================================================"
echo "CentOS 7 Enterprise RAID Pre-Orchestration Engine"
echo "======================================================"

udevadm settle
modprobe md_mod
modprobe raid1
sleep 2

# Stop and clear existing storage components safely
for md in $(cat /proc/mdstat | awk '/^md/{print $1}')
do
    mdadm --stop /dev/$md || true
done
vgchange -an || true
dmsetup remove_all || true

# Detect first two hard disks (Preserving Kernel Enumeration Order)
DISKS=()
while read -r NAME TYPE
do
    [ "$TYPE" != "disk" ] && continue
    case "$NAME" in
        sr*|loop*|fd*|ram*|zd*) continue ;;
    esac
    DISKS+=("$NAME")
done < <(lsblk -dn -o NAME,TYPE)

if [ ${#DISKS[@]} -ne 2 ]; then
    echo "ERROR: Exactly two installation disks are required."
    exit 1
fi

DISK1="/dev/${DISKS[0]}"
DISK2="/dev/${DISKS[1]}"

echo "Primary Disk  : $DISK1"
echo "Secondary Disk: $DISK2"

# Thorough Metadata Eradication
for D in "$DISK1" "$DISK2"
do
    mdadm --zero-superblock --force ${D}* 2>/dev/null || true
    wipefs -af "$D"
    dd if=/dev/zero of="$D" bs=1M count=20 conv=fsync status=none
    udevadm settle
done

D1_BASE=$(basename "$DISK1")
D2_BASE=$(basename "$DISK2")

if [[ "$D1_BASE" == nvme* || "$D1_BASE" == mmcblk* ]]; then
    P1="p1"; P2="p2"; P3="p3"
else
    P1="1";  P2="2";  P3="3"
fi

# Fixed: Removed all backslashes from variables to force runtime expansion into raw drive letters (sda/sdb)
cat > /tmp/partition.ks <<EOF
zerombr
clearpart --all --initlabel

bootloader --location=boot --boot-drive=$DISK1 --append="crashkernel=auto"

##############################################################################
# EFI System Partitions
##############################################################################

# Primary EFI System Partition (mounted)
part /boot/efi \
    --fstype=efi \
    --ondisk=$DISK1 \
    --size=600

# Secondary EFI System Partition (not mounted)
part none \
    --fstype=efi \
    --ondisk=$DISK2 \
    --size=600

# /boot RAID
part raid.boot1 --ondisk=$DISK1 --size=1024
part raid.boot2 --ondisk=$DISK2 --size=1024

# LVM RAID
part raid.pv1 --ondisk=$DISK1 --size=1024 --grow
part raid.pv2 --ondisk=$DISK2 --size=1024 --grow

raid /boot --device=md0 --fstype=xfs --level=1 raid.boot1 raid.boot2
raid pv.01 --device=md1 --fstype=lvmpv --level=1 raid.pv1 raid.pv2

volgroup vg_root pv.01

logvol /     --vgname=vg_root --name=root --fstype=xfs --size=20480
logvol /var  --vgname=vg_root --name=var  --fstype=xfs --size=15360
logvol swap  --vgname=vg_root --name=swap --size=4096
logvol /home --vgname=vg_root --name=home --fstype=xfs --grow --size=1024
EOF


echo "Pre-installation configuration layout processing completed successfully."
%end

%include /tmp/partition.ks

##############################################################################
# PACKAGES (Pure Line-by-Line Network & Storage Core Payload Mode)
##############################################################################
%packages
@^infrastructure-server-environment
grub2
grub2-common
grub2-efi-x64
grub2-tools
grub2-tools-extra
grub2-tools-minimal
shim-x64
efibootmgr
mdadm
lvm2
dosfstools
xfsprogs
open-vm-tools
vim
nano
wget
curl
net-tools
gdisk
rsync
%end

##############################################################################
# POST INSTALL
##############################################################################
%post --interpreter=/usr/bin/bash --log=/root/anaconda-post.log --erroronfail

set -euo pipefail
exec >>/root/anaconda-post.log 2>&1

echo "======================================================"
echo "Running CentOS 7 Post Installation Scripts"
echo "======================================================"

###############################################################################
# Repository Configuration
###############################################################################

cat >/etc/yum.repos.d/base.repo <<'BASE_REPO'
[base]
name=base-repo
baseurl=http://http-server-01/repo/centos/
enabled=1
gpgcheck=0
BASE_REPO

###############################################################################
# Base Configuration
###############################################################################

echo "Configuring SSH..."

if [ -f /etc/ssh/sshd_config ]; then
    sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config || true
    sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config || true
    sed -i 's/^#\?UseDNS.*/UseDNS no/' /etc/ssh/sshd_config || true
fi

echo "Configuring SELinux..."

if [ -f /etc/selinux/config ]; then
    sed -i 's/^SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config
fi

echo "Optimizing YUM..."

if [ -f /etc/yum.conf ]; then
    sed -i 's/installonly_limit=.*/installonly_limit=3/' /etc/yum.conf || true
    grep -q '^fastestmirror=' /etc/yum.conf || \
        echo "fastestmirror=1" >> /etc/yum.conf
fi

echo "Writing sysctl configuration..."

mkdir -p /etc/sysctl.d

#cat >/etc/sysctl.d/99-golden.conf <<'SYSCTL_CFG'
#vm.swappiness=10
#net.ipv4.ip_forward=0
#kernel.sysrq=0
#SYSCTL_CFG

cat >/etc/sysctl.d/99-golden.conf <<'SYSCTL_CFG'
##############################################################################
# Performance
##############################################################################
vm.swappiness=10

##############################################################################
# Networking
##############################################################################
net.ipv4.ip_forward=0

##############################################################################
# Kernel
##############################################################################
kernel.sysrq=0

##############################################################################
# Software RAID
##############################################################################
dev.raid.speed_limit_min=200000
dev.raid.speed_limit_max=500000
SYSCTL_CFG

# Apply immediately
sysctl --system

echo "Creating MOTD..."

cat >/etc/motd <<'MOTD_FILE'

==================================================
 CentOS 7 Enterprise Golden Image
 UEFI + GPT + RAID1 + LVM
==================================================

MOTD_FILE

echo "Creating shell profile..."

mkdir -p /etc/profile.d

cat >/etc/profile.d/history.sh <<'HISTORY_CFG'
export HISTSIZE=10000
export HISTFILESIZE=20000
export HISTCONTROL=ignoredups
HISTORY_CFG

chmod 644 /etc/profile.d/history.sh

echo "Creating Vim configuration..."

cat >/root/.vimrc <<'VIMRC_CFG'
set number
syntax on
set background=dark
VIMRC_CFG

echo "Installing mount-efi helper..."

mkdir -p /usr/local/sbin

cat >/usr/local/sbin/mount-efi <<'MOUNT_EFI'
#!/bin/bash
set -e

if ! mountpoint -q /boot; then
    mount /boot
fi

mkdir -p /boot/efi

mount | grep -q " /boot/efi " && exit 0

blkid -t TYPE=vfat -o device >/tmp/vfat.list

while read -r dev
do
    [ -z "$dev" ] && continue

    if mount "$dev" /boot/efi 2>/dev/null
    then
        if [ -f /boot/efi/EFI/centos/shimx64.efi ] || \
           [ -f /boot/efi/EFI/BOOT/BOOTX64.EFI ]
        then
            echo "Mounted EFI partition: $dev"
            rm -f /tmp/vfat.list
            exit 0
        fi

        umount /boot/efi
    fi

done </tmp/vfat.list

rm -f /tmp/vfat.list

echo "No valid EFI partition found."

exit 1
MOUNT_EFI

chmod 755 /usr/local/sbin/mount-efi

###############################################################################
# Create mount-efi Alias
###############################################################################

cat >/etc/profile.d/efi.sh <<'EOF'
alias mount-efi='/usr/local/sbin/mount-efi'
EOF

chmod 644 /etc/profile.d/efi.sh

sync

###############################################################################
# Download Remaining Scripts
###############################################################################

mkdir -p /root/scripts

BASEURL="http://192.168.253.136/repo/centos7-kickstarts"

echo "Downloading enable-verbose-postboot.sh..."
curl --retry 5 --retry-delay 2 -fsSL \
    -o /root/scripts/enable-verbose-postboot.sh \
    "https://raw.githubusercontent.com/Vignesh-8419/ANSIBLE/main/enable-verbose-postboot.sh?$(date +%s)"

chmod +x /root/scripts/enable-verbose-postboot.sh

curl -fsSL -o /root/scripts/50-grub.sh \
    "${BASEURL}/50-grub.sh"

curl -fsSL -o /root/scripts/99-cleanup.sh \
    "${BASEURL}/99-cleanup.sh"

chmod +x /root/scripts/50-grub.sh
chmod +x /root/scripts/99-cleanup.sh

cat >/usr/local/sbin/register-efi <<'EOF'
#!/bin/bash
set -e

/usr/local/sbin/mount-efi || true

PRIMARY=$(blkid -t TYPE=vfat -o device | head -1)
SECONDARY=$(blkid -t TYPE=vfat -o device | tail -1)

create_entry() {

    PART="$1"

    if [[ "$PART" == *nvme* || "$PART" == *mmcblk* ]]; then
        DISK="${PART%p*}"
        NUM="${PART##*p}"
    else
        DISK=$(echo "$PART" | sed 's/[0-9]*$//')
        NUM=$(echo "$PART" | sed 's/.*[^0-9]\([0-9][0-9]*\)$/\1/')
    fi

    LABEL="$2"

    if ! efibootmgr | grep -q "$LABEL"; then
        efibootmgr \
            -c \
            -d "$DISK" \
            -p "$NUM" \
            -L "$LABEL" \
            -l '\EFI\centos\shimx64.efi'
    fi
}

create_entry "$PRIMARY" "CentOS RAID1 Disk 1"
create_entry "$SECONDARY" "CentOS RAID1 Disk 2"

BOOT1=$(efibootmgr | awk '/CentOS RAID1 Disk 1/{gsub(/\*/,"",$1);gsub(/Boot/,"",$1);print $1}')
BOOT2=$(efibootmgr | awk '/CentOS RAID1 Disk 2/{gsub(/\*/,"",$1);gsub(/Boot/,"",$1);print $1}')

CURRENT=$(efibootmgr | awk -F'[: ]+' '/^BootOrder/ {print $2}')

NEW="$BOOT1,$BOOT2"

for ID in $(echo "$CURRENT" | tr ',' ' ')
do
    if [ "$ID" != "$BOOT1" ] && [ "$ID" != "$BOOT2" ]; then
        NEW="$NEW,$ID"
    fi
done

efibootmgr -o "$NEW"

systemctl disable register-efi.service || true

rm -f /etc/systemd/system/register-efi.service
rm -f /etc/systemd/system/multi-user.target.wants/register-efi.service
rm -f /usr/local/sbin/register-efi

systemctl daemon-reload
EOF

chmod +x /usr/local/sbin/register-efi

cat >/etc/systemd/system/register-efi.service <<'EOF'
[Unit]
Description=Register RAID EFI Boot Entries
After=local-fs.target
Before=multi-user.target

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/register-efi
RemainAfterExit=no

[Install]
WantedBy=multi-user.target
EOF

ln -sf \
/etc/systemd/system/register-efi.service \
/etc/systemd/system/multi-user.target.wants/register-efi.service

echo
echo "===== RUNNING 50 ====="
bash -x /root/scripts/50-grub.sh

echo
echo "===== RUNNING verbose ====="
/root/scripts/enable-verbose-postboot.sh

echo
echo "===== RUNNING 99 ====="
bash -x /root/scripts/99-cleanup.sh

echo
echo "======================================================"
echo "CentOS Golden Image Build Completed Successfully"
echo "======================================================"

%end
