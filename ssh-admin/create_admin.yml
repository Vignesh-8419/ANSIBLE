---
- name: Create Shared Admin User
  hosts: "{{ target_hosts.split(',') | map('trim') | map('regex_replace', '$', '*') | join(',') }}"
  gather_facts: yes
  become: yes

  vars:
    admin_user: admin

    # Password: Vigneshv12$
    admin_password: "$6$TDxrkjdWRZRu8eto$Qjtyu8XXyDsNB7jAjIiw9Yr17KT/m58VDLpi.CIXEPjKf9s8kq2oIciKUvq1dG935191IyRs5tHB9ClrnOl53/"

    shared_private_key: "files/id_rsa"
    master_public_key: "files/authorized_key.pub"

  tasks:

    # ============================================================
    # OS DETECTION
    # ============================================================

    - name: Detect CentOS 7
      set_fact:
        is_centos7: >-
          {{
            ansible_distribution == 'CentOS'
            and ansible_distribution_major_version == '7'
          }}

    - name: Display OS information
      debug:
        msg:
          - "===================================================="
          - "OS DETECTION"
          - "===================================================="
          - "Distribution       : {{ ansible_distribution }}"
          - "Version             : {{ ansible_distribution_version }}"
          - "Major Version      : {{ ansible_distribution_major_version }}"
          - "CentOS 7            : {{ is_centos7 }}"
          - "===================================================="

    # ============================================================
    # CENTOS 7 ONLY
    # ============================================================

    - name: Create YUM repository backup directory
      file:
        path: /etc/yum.repos.d/backup
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - is_centos7

    - name: Find existing YUM repository files
      find:
        paths: /etc/yum.repos.d
        patterns: "*.repo"
        file_type: file
      register: existing_yum_repo_files
      when:
        - is_centos7

    - name: Move old YUM repository files to backup
      command:
        cmd: "mv {{ item.path }} /etc/yum.repos.d/backup/"
      loop: "{{ existing_yum_repo_files.files | default([]) }}"
      when:
        - is_centos7
        - existing_yum_repo_files.matched | default(0) | int > 0

    # ============================================================
    # PATCH REPOSITORY
    # ============================================================

    - name: Create patch repository
      copy:
        dest: /etc/yum.repos.d/patch.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [patch]
          name=patch-repo
          baseurl=http://http-server-01/repo/installed_rhel7
          enabled=1
          gpgcheck=0
      when:
        - is_centos7

    # ============================================================
    # BASE REPOSITORY
    # ============================================================

    - name: Create base repository
      copy:
        dest: /etc/yum.repos.d/base.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [base]
          name=base-repo
          baseurl=http://http-server-01/repo/centos/
          enabled=1
          gpgcheck=0
      when:
        - is_centos7

    # ============================================================
    # YUM CACHE
    # ============================================================

    - name: Clean YUM metadata
      command:
        cmd: yum clean all
      when:
        - is_centos7

    - name: Rebuild YUM cache
      command:
        cmd: yum makecache
      when:
        - is_centos7

    # ============================================================
    # PYTHON 3
    # ============================================================

    - name: Install Python 3 on CentOS 7
      yum:
        name: python3
        state: present
      when:
        - is_centos7

    - name: Verify Python 3 on CentOS 7
      command:
        cmd: /usr/bin/python3 --version
      register: python3_version
      changed_when: false
      when:
        - is_centos7

    # ============================================================
    # IMPORTANT:
    # Make all following Ansible modules use Python 3 on
    # CentOS 7 instead of Python 2.7.
    # ============================================================

    - name: Set Ansible Python interpreter to Python 3 on CentOS 7
      set_fact:
        ansible_python_interpreter: /usr/bin/python3
      when:
        - is_centos7

    - name: Display Python 3 and Ansible interpreter
      debug:
        msg:
          - "===================================================="
          - "PYTHON CONFIGURATION"
          - "===================================================="
          - "Python 3          : {{ python3_version.stdout | default('SKIPPED') }}"
          - "Ansible interpreter: {{ ansible_python_interpreter | default('system default') }}"
          - "===================================================="

    # ============================================================
    # NON-CENTOS 7
    # ============================================================

    - name: Display non-CentOS 7 message
      debug:
        msg:
          - "===================================================="
          - "CENTOS 7 PREPARATION SKIPPED"
          - "===================================================="
          - "OS                 : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "CentOS 7           : {{ is_centos7 }}"
          - "Repository changes : SKIPPED"
          - "Python 3 install   : SKIPPED"
          - "Interpreter change : SKIPPED"
          - "===================================================="
      when:
        - not is_centos7

    # ============================================================
    # EXISTING PLAYBOOK TASKS
    # ============================================================

    - name: Ensure wheel group exists
      group:
        name: wheel
        state: present

    - name: Create admin user
      user:
        name: "{{ admin_user }}"
        comment: Shared Lab Administrator
        shell: /bin/bash
        create_home: yes
        groups: wheel
        append: yes
        password: "{{ admin_password }}"
        state: present

    - name: Create .ssh directory
      file:
        path: "/home/{{ admin_user }}/.ssh"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0700"

    - name: Copy shared private key
      copy:
        src: "{{ shared_private_key }}"
        dest: "/home/{{ admin_user }}/.ssh/id_rsa"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0600"

    - name: Copy master public key
      copy:
        src: "{{ master_public_key }}"
        dest: "/home/{{ admin_user }}/.ssh/id_rsa.pub"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0644"

    - name: Install master public key
      authorized_key:
        user: "{{ admin_user }}"
        state: present
        key: "{{ lookup('file', master_public_key) }}"

    - name: Configure SSH client
      copy:
        dest: "/home/{{ admin_user }}/.ssh/config"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0600"
        content: |
          Host *
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR

    - name: Enable passwordless sudo
      copy:
        dest: /etc/sudoers.d/admin
        owner: root
        group: root
        mode: "0440"
        content: |
          admin ALL=(ALL) NOPASSWD: ALL
        validate: "/usr/sbin/visudo -cf %s"

    - name: Restore SELinux context
      command: restorecon -Rv /home/{{ admin_user }}/.ssh
      changed_when: false
      failed_when: false

    - name: Ensure SSH ownership
      file:
        path: "/home/{{ admin_user }}/.ssh"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        recurse: yes

    - name: Verify admin user
      command: id {{ admin_user }}
      register: admin_result
      changed_when: false

    - name: Verify SSH private key
      stat:
        path: "/home/{{ admin_user }}/.ssh/id_rsa"
      register: private_key

    - name: Verify authorized_keys
      stat:
        path: "/home/{{ admin_user }}/.ssh/authorized_keys"
      register: auth

    - name: Verify sudo
      become: yes
      become_user: "{{ admin_user }}"
      command: sudo -n whoami
      register: sudo_result
      changed_when: false

    - name: Test localhost SSH
      become: yes
      become_user: "{{ admin_user }}"
      shell: ssh -o BatchMode=yes -o ConnectTimeout=5 localhost "hostname"
      register: ssh_test
      changed_when: false
      failed_when: false

    # ============================================================
    # FINAL SUMMARY
    # ============================================================

    - name: Display Summary
      debug:
        msg:
          - "===================================================="
          - "Admin User Configuration Completed"
          - "===================================================="
          - "Host              : {{ inventory_hostname }}"
          - "OS                : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "CentOS 7          : {{ is_centos7 }}"
          - "Ansible Python    : {{ ansible_python_interpreter | default('system default') }}"
          - "Admin User        : {{ admin_result.stdout }}"
          - "Sudo              : {{ sudo_result.stdout }}"
          - "Private Key       : {{ private_key.stat.exists }}"
          - "authorized_keys   : {{ auth.stat.exists }}"
          - "SSH Test          : {{ ssh_test.stdout | default('FAILED') }}"
          - "===================================================="
