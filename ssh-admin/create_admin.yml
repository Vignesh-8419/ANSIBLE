
---
- name: Create Shared Admin User - Linux
  hosts: "{{ target_hosts.split(',') | map('trim') | map('regex_replace', '$', '*') | join(',') }}"
  gather_facts: false
  become: yes

  vars:
    admin_user: admin

    # Store this variable securely using Ansible Vault
    admin_password: "{{ vault_admin_password }}"

    shared_private_key: "files/id_rsa"
    master_public_key: "files/authorized_key.pub"

  tasks:

    # ============================================================
    # OS DETECTION
    # ============================================================

    - name: Detect CentOS 7
      ansible.builtin.raw: |
        if [ -f /etc/redhat-release ]; then
          cat /etc/redhat-release
        else
          echo "Unknown Linux"
        fi
      register: os_detection
      changed_when: false

    - name: Set OS variables
      ansible.builtin.set_fact:
        is_centos7: "{{ 'CentOS Linux release 7' in os_detection.stdout }}"

    - name: Display OS information
      ansible.builtin.debug:
        msg:
          - "Detected OS: {{ os_detection.stdout | trim }}"
          - "CentOS 7: {{ is_centos7 }}"

    # ============================================================
    # CENTOS 7 - BACKUP OLD YUM REPOSITORIES
    # ============================================================

    - name: Create YUM repository backup directory
      ansible.builtin.file:
        path: /etc/yum.repos.d/backup
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: is_centos7

    - name: Find existing YUM repository files
      ansible.builtin.find:
        paths: /etc/yum.repos.d
        patterns: "*.repo"
        file_type: file
      register: existing_yum_repo_files
      when: is_centos7

    - name: Move old YUM repository files to backup
      ansible.builtin.command:
        cmd: "mv {{ item.path }} /etc/yum.repos.d/backup/"
      loop: "{{ existing_yum_repo_files.files | default([]) }}"
      when:
        - is_centos7
        - existing_yum_repo_files.matched | default(0) | int > 0

    # ============================================================
    # CENTOS 7 - PATCH REPOSITORY
    # ============================================================

    - name: Create patch repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/patch.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [patch]
          name=patch-repo
          baseurl=http://http-server-01/repo/installed_rhel7
          enabled=1
          gpgcheck=0
      when: is_centos7

    # ============================================================
    # CENTOS 7 - BASE REPOSITORY
    # ============================================================

    - name: Create base repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/base.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [base]
          name=base-repo
          baseurl=http://http-server-01/repo/centos/
          enabled=1
          gpgcheck=0
      when: is_centos7

    # ============================================================
    # CENTOS 7 - YUM CACHE
    # ============================================================

    - name: Clean YUM metadata
      ansible.builtin.command:
        cmd: yum clean all
      when: is_centos7

    - name: Rebuild YUM cache
      ansible.builtin.command:
        cmd: yum makecache
      when: is_centos7

    # ============================================================
    # PYTHON 3
    # ============================================================

    - name: Install Python 3
      ansible.builtin.package:
        name: python3
        state: present

    - name: Verify Python 3 executable
      ansible.builtin.command:
        cmd: /usr/bin/python3 --version
      register: python3_version
      changed_when: false

    - name: Set Ansible Python interpreter
      ansible.builtin.set_fact:
        ansible_python_interpreter: /usr/bin/python3

    - name: Gather Linux facts
      ansible.builtin.setup:

    - name: Display Python configuration
      ansible.builtin.debug:
        msg:
          - "===================================================="
          - "PYTHON CONFIGURATION"
          - "===================================================="
          - "Python 3 version      : {{ python3_version.stdout }}"
          - "Ansible interpreter  : {{ ansible_python_interpreter }}"
          - "===================================================="

    # ============================================================
    # VERIFY ANSIBLE PYTHON 3
    # ============================================================

    - name: Verify Ansible interpreter
      ansible.builtin.command:
        cmd: "{{ ansible_python_interpreter }} --version"
      register: ansible_python_version
      changed_when: false

    - name: Display active Ansible Python
      ansible.builtin.debug:
        msg:
          - "Ansible Python executable : {{ ansible_python_interpreter }}"
          - "Ansible Python version    : {{ ansible_python_version.stdout }}"

    # ============================================================
    # CENTOS 7 PREPARATION STATUS
    # ============================================================

    - name: Display repository preparation status
      ansible.builtin.debug:
        msg:
          - "===================================================="
          - "CENTOS 7 REPOSITORY PREPARATION"
          - "===================================================="
          - "OS                  : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "CentOS 7            : {{ is_centos7 }}"
          - "Repository changes  : {{ 'APPLIED' if is_centos7 else 'SKIPPED' }}"
          - "Python 3            : {{ python3_version.stdout }}"
          - "Ansible interpreter : {{ ansible_python_interpreter }}"
          - "===================================================="

    # ============================================================
    # ADMIN GROUP
    # ============================================================

    - name: Ensure wheel group exists
      ansible.builtin.group:
        name: wheel
        state: present

    # ============================================================
    # ADMIN USER
    # ============================================================

    - name: Create admin user
      ansible.builtin.user:
        name: "{{ admin_user }}"
        comment: Shared Lab Administrator
        shell: /bin/bash
        create_home: yes
        groups: wheel
        append: yes
        password: "{{ admin_password }}"
        state: present

    # ============================================================
    # SSH DIRECTORY
    # ============================================================

    - name: Create .ssh directory
      ansible.builtin.file:
        path: "/home/{{ admin_user }}/.ssh"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0700"

    # ============================================================
    # SSH PRIVATE KEY
    # ============================================================

    - name: Copy shared private key
      ansible.builtin.copy:
        src: "{{ shared_private_key }}"
        dest: "/home/{{ admin_user }}/.ssh/id_rsa"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0600"

    # ============================================================
    # SSH PUBLIC KEY
    # ============================================================

    - name: Copy master public key
      ansible.builtin.copy:
        src: "{{ master_public_key }}"
        dest: "/home/{{ admin_user }}/.ssh/id_rsa.pub"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0644"

    # ============================================================
    # AUTHORIZED KEY
    # ============================================================

    - name: Install master public key
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        state: present
        key: "{{ lookup('ansible.builtin.file', master_public_key) }}"

    # ============================================================
    # SSH CLIENT CONFIG
    # ============================================================

    - name: Configure SSH client
      ansible.builtin.copy:
        dest: "/home/{{ admin_user }}/.ssh/config"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0600"
        content: |
          Host *
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR

    # ============================================================
    # PASSWORDLESS SUDO
    # ============================================================

    - name: Enable passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/admin
        owner: root
        group: root
        mode: "0440"
        content: |
          admin ALL=(ALL) NOPASSWD: ALL
        validate: "/usr/sbin/visudo -cf %s"

    # ============================================================
    # SELINUX
    # ============================================================

    - name: Restore SELinux context
      ansible.builtin.command:
        cmd: "restorecon -Rv /home/{{ admin_user }}/.ssh"
      changed_when: false
      failed_when: false

    # ============================================================
    # SSH OWNERSHIP
    # ============================================================

    - name: Ensure SSH ownership
      ansible.builtin.file:
        path: "/home/{{ admin_user }}/.ssh"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        recurse: yes

    # ============================================================
    # VERIFY ADMIN USER
    # ============================================================

    - name: Verify admin user
      ansible.builtin.command:
        cmd: "id {{ admin_user }}"
      register: admin_result
      changed_when: false

    # ============================================================
    # VERIFY PRIVATE KEY
    # ============================================================

    - name: Verify SSH private key
      ansible.builtin.stat:
        path: "/home/{{ admin_user }}/.ssh/id_rsa"
      register: private_key

    # ============================================================
    # VERIFY AUTHORIZED KEYS
    # ============================================================

    - name: Verify authorized_keys
      ansible.builtin.stat:
        path: "/home/{{ admin_user }}/.ssh/authorized_keys"
      register: auth

    # ============================================================
    # VERIFY SUDO
    # ============================================================

    - name: Verify sudo
      become: yes
      become_user: "{{ admin_user }}"
      ansible.builtin.command:
        cmd: sudo -n whoami
      register: sudo_result
      changed_when: false

    # ============================================================
    # TEST LOCAL SSH
    # ============================================================

    - name: Test localhost SSH
      become: yes
      become_user: "{{ admin_user }}"
      ansible.builtin.shell: |
        ssh -o BatchMode=yes \
            -o ConnectTimeout=5 \
            localhost hostname
      register: ssh_test
      changed_when: false
      failed_when: false

    # ============================================================
    # FINAL SUMMARY
    # ============================================================

    - name: Display Summary
      ansible.builtin.debug:
        msg:
          - "===================================================="
          - "Admin User Configuration Completed"
          - "===================================================="
          - "Host               : {{ inventory_hostname }}"
          - "OS                 : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "CentOS 7           : {{ is_centos7 }}"
          - "Python 3           : {{ python3_version.stdout }}"
          - "Ansible Python     : {{ ansible_python_interpreter }}"
          - "Admin User         : {{ admin_result.stdout }}"
          - "Sudo               : {{ sudo_result.stdout }}"
          - "Private Key        : {{ private_key.stat.exists }}"
          - "authorized_keys    : {{ auth.stat.exists }}"
          - "SSH Test           : {{ ssh_test.stdout | default('FAILED') }}"
          - "===================================================="
