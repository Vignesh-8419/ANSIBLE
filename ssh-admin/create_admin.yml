---
- name: Create Shared Admin User
  hosts: "{{ target_hosts.split(',') | map('trim') | map('regex_replace', '$', '*') | join(',') }}"
  gather_facts: yes
  become: yes

  vars:
    admin_user: admin

    # Password: Vigneshv12$
    admin_password: "$6$TDxrkjdWRZRu8eto$Qjtyu8XXyDsNB7jAjIiw9Yr17KT/m58VDLpi.CIXEPjKf9s8kq2oIciKUvq1dG935191IyRs5tHB9ClrnOl53/"

    shared_private_key: "files/id_rsa"
    master_public_key: "files/authorized_key.pub"

  tasks:

    # ============================================================
    # OS DETECTION
    # ============================================================

    - name: Detect CentOS 7
      set_fact:
        is_centos7: >-
          {{
            ansible_distribution == 'CentOS'
            and ansible_distribution_major_version == '7'
          }}

    - name: Display OS information
      debug:
        msg:
          - "===================================================="
          - "OS DETECTION"
          - "===================================================="
          - "Distribution        : {{ ansible_distribution }}"
          - "Version             : {{ ansible_distribution_version }}"
          - "Major Version       : {{ ansible_distribution_major_version }}"
          - "CentOS 7            : {{ is_centos7 }}"
          - "===================================================="

    # ============================================================
    # CENTOS 7 ONLY - BACKUP OLD YUM REPOSITORIES
    # ============================================================

    - name: Create YUM repository backup directory
      file:
        path: /etc/yum.repos.d/backup
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - is_centos7

    - name: Find existing YUM repository files
      find:
        paths: /etc/yum.repos.d
        patterns: "*.repo"
        file_type: file
      register: existing_yum_repo_files
      when:
        - is_centos7

    - name: Move old YUM repository files to backup
      command:
        cmd: "mv {{ item.path }} /etc/yum.repos.d/backup/"
      loop: "{{ existing_yum_repo_files.files | default([]) }}"
      when:
        - is_centos7
        - existing_yum_repo_files.matched | default(0) | int > 0

    # ============================================================
    # CENTOS 7 ONLY - PATCH REPOSITORY
    # ============================================================

    - name: Create patch repository
      copy:
        dest: /etc/yum.repos.d/patch.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [patch]
          name=patch-repo
          baseurl=http://http-server-01/repo/installed_rhel7
          enabled=1
          gpgcheck=0
      when:
        - is_centos7

    # ============================================================
    # CENTOS 7 ONLY - BASE REPOSITORY
    # ============================================================

    - name: Create base repository
      copy:
        dest: /etc/yum.repos.d/base.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [base]
          name=base-repo
          baseurl=http://http-server-01/repo/centos/
          enabled=1
          gpgcheck=0
      when:
        - is_centos7

    # ============================================================
    # CENTOS 7 ONLY - YUM CACHE
    # ============================================================

    - name: Clean YUM metadata
      command:
        cmd: yum clean all
      when:
        - is_centos7

    - name: Rebuild YUM cache
      command:
        cmd: yum makecache
      when:
        - is_centos7

    # ============================================================
    # PYTHON 3 - MANDATORY FOR ALL OS
    # ============================================================

    - name: Install Python 3
      package:
        name: python3
        state: present

    - name: Verify Python 3 executable
      command:
        cmd: /usr/bin/python3 --version
      register: python3_version
      changed_when: false

    - name: Verify Python 3 SELinux libraries when available
      package:
        name:
          - python3-libselinux
          - python3-policycoreutils
        state: present
      when:
        - ansible_os_family == "RedHat"

    # ============================================================
    # SWITCH ANSIBLE TO PYTHON 3
    # ============================================================

    - name: Set Ansible Python interpreter to Python 3
      set_fact:
        ansible_python_interpreter: /usr/bin/python3

    - name: Display Python configuration
      debug:
        msg:
          - "===================================================="
          - "PYTHON CONFIGURATION"
          - "===================================================="
          - "Python 3 version      : {{ python3_version.stdout }}"
          - "Ansible interpreter   : {{ ansible_python_interpreter }}"
          - "===================================================="

    # ============================================================
    # VERIFY ANSIBLE PYTHON 3
    # ============================================================

    - name: Verify Ansible interpreter is Python 3
      command:
        cmd: "{{ ansible_python_interpreter }} --version"
      register: ansible_python_version
      changed_when: false

    - name: Display active Ansible Python
      debug:
        msg:
          - "Ansible Python executable : {{ ansible_python_interpreter }}"
          - "Ansible Python version    : {{ ansible_python_version.stdout }}"

    # ============================================================
    # NON-CENTOS 7 MESSAGE
    # ============================================================

    - name: Display non-CentOS 7 preparation status
      debug:
        msg:
          - "===================================================="
          - "CENTOS 7 REPOSITORY PREPARATION"
          - "===================================================="
          - "OS                  : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "CentOS 7            : {{ is_centos7 }}"
          - "Repository changes  : {{ 'APPLIED' if is_centos7 else 'SKIPPED' }}"
          - "Python 3            : INSTALLED"
          - "Ansible interpreter : /usr/bin/python3"
          - "===================================================="

    # ============================================================
    # ADMIN USER
    # ============================================================

    - name: Ensure wheel group exists
      group:
        name: wheel
        state: present

    - name: Create admin user
      user:
        name: "{{ admin_user }}"
        comment: Shared Lab Administrator
        shell: /bin/bash
        create_home: yes
        groups: wheel
        append: yes
        password: "{{ admin_password }}"
        state: present

    # ============================================================
    # SSH DIRECTORY
    # ============================================================

    - name: Create .ssh directory
      file:
        path: "/home/{{ admin_user }}/.ssh"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0700"

    # ============================================================
    # SSH PRIVATE KEY
    # ============================================================

    - name: Copy shared private key
      copy:
        src: "{{ shared_private_key }}"
        dest: "/home/{{ admin_user }}/.ssh/id_rsa"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0600"

    # ============================================================
    # SSH PUBLIC KEY
    # ============================================================

    - name: Copy master public key
      copy:
        src: "{{ master_public_key }}"
        dest: "/home/{{ admin_user }}/.ssh/id_rsa.pub"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0644"

    # ============================================================
    # AUTHORIZED KEY
    # ============================================================

    - name: Install master public key
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        state: present
        key: "{{ lookup('file', master_public_key) }}"

    # ============================================================
    # SSH CLIENT CONFIG
    # ============================================================

    - name: Configure SSH client
      copy:
        dest: "/home/{{ admin_user }}/.ssh/config"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0600"
        content: |
          Host *
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR

    # ============================================================
    # PASSWORDLESS SUDO
    # ============================================================

    - name: Enable passwordless sudo
      copy:
        dest: /etc/sudoers.d/admin
        owner: root
        group: root
        mode: "0440"
        content: |
          admin ALL=(ALL) NOPASSWD: ALL
        validate: "/usr/sbin/visudo -cf %s"

    # ============================================================
    # SELINUX
    # ============================================================

    - name: Restore SELinux context
      command:
        cmd: "restorecon -Rv /home/{{ admin_user }}/.ssh"
      changed_when: false
      failed_when: false

    # ============================================================
    # SSH OWNERSHIP
    # ============================================================

    - name: Ensure SSH ownership
      file:
        path: "/home/{{ admin_user }}/.ssh"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        recurse: yes

    # ============================================================
    # VERIFY ADMIN USER
    # ============================================================

    - name: Verify admin user
      command:
        cmd: "id {{ admin_user }}"
      register: admin_result
      changed_when: false

    # ============================================================
    # VERIFY PRIVATE KEY
    # ============================================================

    - name: Verify SSH private key
      stat:
        path: "/home/{{ admin_user }}/.ssh/id_rsa"
      register: private_key

    # ============================================================
    # VERIFY AUTHORIZED KEYS
    # ============================================================

    - name: Verify authorized_keys
      stat:
        path: "/home/{{ admin_user }}/.ssh/authorized_keys"
      register: auth

    # ============================================================
    # VERIFY SUDO
    # ============================================================

    - name: Verify sudo
      become: yes
      become_user: "{{ admin_user }}"
      command:
        cmd: sudo -n whoami
      register: sudo_result
      changed_when: false

    # ============================================================
    # TEST LOCAL SSH
    # ============================================================

    - name: Test localhost SSH
      become: yes
      become_user: "{{ admin_user }}"
      shell: >
        ssh
        -o BatchMode=yes
        -o ConnectTimeout=5
        localhost
        "hostname"
      register: ssh_test
      changed_when: false
      failed_when: false

    # ============================================================
    # FINAL SUMMARY
    # ============================================================

    - name: Display Summary
      debug:
        msg:
          - "===================================================="
          - "Admin User Configuration Completed"
          - "===================================================="
          - "Host               : {{ inventory_hostname }}"
          - "OS                 : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "CentOS 7           : {{ is_centos7 }}"
          - "Python 3           : {{ python3_version.stdout }}"
          - "Ansible Python     : {{ ansible_python_interpreter }}"
          - "Admin User         : {{ admin_result.stdout }}"
          - "Sudo               : {{ sudo_result.stdout }}"
          - "Private Key        : {{ private_key.stat.exists }}"
          - "authorized_keys    : {{ auth.stat.exists }}"
          - "SSH Test           : {{ ssh_test.stdout | default('FAILED') }}"
          - "===================================================="
