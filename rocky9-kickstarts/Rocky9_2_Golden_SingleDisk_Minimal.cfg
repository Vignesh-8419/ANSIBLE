#==============================================================================
# Rocky Linux 9.2 Enterprise Golden Image
# UEFI + GPT + Single Disk + LVM
#==============================================================================

text

url --url="http://http-server-01.vgs.com/repo/rocky9.2"

#==============================================================================
# LANGUAGE / KEYBOARD / TIMEZONE
#==============================================================================

lang en_US.UTF-8
keyboard us
timezone Asia/Kolkata --isUtc

#==============================================================================
# ROOT PASSWORD
#==============================================================================

rootpw --plaintext Root@123

#==============================================================================
# NETWORK
#==============================================================================

network --bootproto=dhcp --device=link --activate

#==============================================================================
# SECURITY / SERVICES
#==============================================================================

firewall --enabled --service=ssh
selinux --enforcing
services --enabled="NetworkManager,sshd,chronyd"

reboot

#==============================================================================
# STORAGE
# UEFI + GPT + SINGLE DISK
# NO RAID
# NO LVM
#==============================================================================

zerombr
clearpart --all --initlabel

bootloader --location=boot --append="crashkernel=auto"

part /boot/efi --fstype=efi --size=600
part /boot --fstype=xfs --size=1024
part swap --fstype=swap --size=4096
part / --fstype=xfs --grow --size=1024

#==============================================================================
# PACKAGES
#==============================================================================

%packages

@^server

dosfstools
xfsprogs
grub2-efi-x64
grub2-tools
shim-x64
efibootmgr

open-vm-tools

vim
nano
wget
curl
bash-completion
net-tools
lsof
perl
tcpdump
rsync
tar
unzip
zip
gdisk

%end

#==============================================================================
# POST INSTALLATION CONFIGURATION
#==============================================================================

%post --interpreter=/usr/bin/bash --log=/root/anaconda-post.log --erroronfail

# Log all output
exec >/root/anaconda-post.log 2>&1

set -euxo pipefail

echo "======================================================"
echo "Starting Rocky Linux 9.2 Golden Image post-installation"
echo "======================================================"


#==============================================================================
# CREATE ADMIN USER
#==============================================================================

if ! id admin >/dev/null 2>&1; then
    useradd -m -s /bin/bash admin
fi

echo 'admin:Vigneshv12$' | chpasswd

usermod -aG wheel admin


#==============================================================================
# CONFIGURE PASSWORDLESS SUDO FOR ADMIN
#==============================================================================

cat >/etc/sudoers.d/admin <<'EOF'
admin ALL=(ALL) NOPASSWD: ALL
EOF

chmod 0440 /etc/sudoers.d/admin


#==============================================================================
# ENSURE ROOT PASSWORD IS SET
#==============================================================================

echo 'root:Root@123' | chpasswd


#==============================================================================
# ENABLE ROOT SSH PASSWORD LOGIN
#==============================================================================

# Ensure SSH configuration directory exists
mkdir -p /etc/ssh/sshd_config.d

# Remove old custom configuration if it exists
rm -f /etc/ssh/sshd_config.d/99-root-password.conf

# Explicitly enable root login and password authentication
cat >/etc/ssh/sshd_config.d/99-root-password.conf <<'EOF'
PermitRootLogin yes
PasswordAuthentication yes
KbdInteractiveAuthentication yes
UsePAM yes
EOF

chmod 0644 /etc/ssh/sshd_config.d/99-root-password.conf


#==============================================================================
# GENERATE SSH HOST KEYS
#
# Without this, "sshd -t" can fail during %post with:
# sshd: no hostkeys available -- exiting.
#==============================================================================

ssh-keygen -A


#==============================================================================
# VALIDATE SSH CONFIGURATION
#==============================================================================

/usr/sbin/sshd -t


#==============================================================================
# ENABLE SSH SERVICE
#==============================================================================

systemctl enable sshd.service


#==============================================================================
# ENABLE REQUIRED SERVICES
#==============================================================================

systemctl enable NetworkManager.service

systemctl enable chronyd.service


#==============================================================================
# ENABLE VMWARE TOOLS
#==============================================================================

systemctl enable vmtoolsd.service 2>/dev/null || true


#==============================================================================
# MOTD
#==============================================================================

cat >/etc/motd <<'EOF'
==================================================
 Rocky Linux 9.2 Enterprise Golden Image
 UEFI + GPT + Single Disk
 No RAID / No LVM

 Root SSH Password Authentication Enabled
==================================================
EOF


#==============================================================================
# FINAL STATUS
#==============================================================================

echo
echo "======================================================"
echo "Rocky Linux 9.2 Golden Image Build Completed Successfully"
echo "======================================================"
echo "Admin User : admin"
echo "Root SSH   : Enabled"
echo "======================================================"

%end