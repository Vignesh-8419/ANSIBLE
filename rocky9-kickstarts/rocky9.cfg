#==============================================================================
# Rocky Linux 9 Enterprise Golden Image
# UEFI + GPT + Software RAID1 + LVM
# 100% ENFORCED PHYSICAL BLOCK PARITY LAYOUT ORCHESTRATION
#==============================================================================
text
cdrom
lang en_US.UTF-8
keyboard us
timezone Asia/Kolkata --isUtc
rootpw --plaintext Root@123
network --bootproto=dhcp --device=link --activate
firewall --enabled --service=ssh
selinux --enforcing
services --enabled="NetworkManager,sshd,chronyd"
reboot

##############################################################################
# PRE INSTALL: HARDWARE SECTOR ENFORCEMENT & PURE PARITY PARTITIONING
##############################################################################
%pre --interpreter=/usr/bin/bash --log=/tmp/ks-pre.log
exec > /tmp/ks-pre.log 2>&1

echo "======================================================"
echo "Rocky Linux 9 Enterprise RAID Pre-Orchestration Engine"
echo "======================================================"

udevadm settle
modprobe md_mod
modprobe raid1
sleep 2

# Stop and clear existing storage components safely
for md in $(cat /proc/mdstat | awk '/^md/{print $1}')
do
    mdadm --stop /dev/$md || true
done
vgchange -an || true
dmsetup remove_all || true

udevadm trigger
udevadm settle
sleep 5

echo "===== BLOCK DEVICES ====="
lsblk
echo "========================="

##############################################################################
# Detect Installation Disks
##############################################################################

udevadm trigger
udevadm settle
sleep 5

echo "===== BLOCK DEVICES ====="
lsblk
echo "========================="

DISKS=()

while read -r NAME TYPE SIZE
do
    echo "Detected: $NAME $TYPE $SIZE"

    [ "$TYPE" != "disk" ] && continue

    case "$NAME" in
        loop*|ram*|fd*|sr*|zd*)
            continue
            ;;
    esac

    DISKS+=("$NAME")

done < <(lsblk -dn -o NAME,TYPE,SIZE)

echo "Detected disks : ${DISKS[*]}"
echo "Disk count     : ${#DISKS[@]}"

if [ ${#DISKS[@]} -lt 2 ]; then
    echo "ERROR: Less than two installation disks detected."
    lsblk
    exit 1
fi

DISK1="/dev/${DISKS[0]}"
DISK2="/dev/${DISKS[1]}"

echo "Primary Disk   : $DISK1"
echo "Secondary Disk : $DISK2"

##############################################################################
# Create GPT layout on both disks
##############################################################################

for D in "$DISK1" "$DISK2"
do
    wipefs -af "$D"
    sgdisk --zap-all "$D"

    sgdisk \
        -n1:1MiB:+600MiB   -t1:EF00 \
        -n2:0:+1024MiB     -t2:FD00 \
        -n3:0:0            -t3:FD00 \
        "$D"

done

partprobe "$DISK1"
partprobe "$DISK2"

udevadm trigger
udevadm settle

# Wait until all partition devices exist
for p in \
    "${DISK1}1" "${DISK1}2" "${DISK1}3" \
    "${DISK2}1" "${DISK2}2" "${DISK2}3"
do
    timeout=30
    while [ ! -b "$p" ] && [ $timeout -gt 0 ]
    do
        sleep 1
        udevadm settle
        timeout=$((timeout-1))
    done

    if [ ! -b "$p" ]; then
        echo "ERROR: $p not created"
        lsblk
        exit 1
    fi
done

# Format both EFI partitions
mkfs.vfat -F32 "${DISK1}1"
mkfs.vfat -F32 "${DISK2}1"

echo "Partition layout created successfully."

lsblk
blkid

echo "Pre-install checks completed."

%end


##############################################################################
# STORAGE CONFIGURATION
##############################################################################

zerombr
clearpart --none

bootloader --location=boot --boot-drive=sda

# Existing EFI partitions created in %pre
part /boot/efi --onpart=sda1 --fstype=efi --noformat

# Existing RAID members created in %pre
part raid.boot.01 --onpart=sda2
part raid.boot.02 --onpart=sdb2

part raid.pv.01 --onpart=sda3
part raid.pv.02 --onpart=sdb3

# RAID
raid /boot --device=md0 --level=1 --fstype=xfs raid.boot.01 raid.boot.02
raid pv.01 --device=md1 --level=1 raid.pv.01 raid.pv.02

# LVM
volgroup vg_sys pv.01

logvol /     --vgname=vg_sys --name=lv_root --fstype=xfs --size=20480
logvol /var  --vgname=vg_sys --name=lv_var  --fstype=xfs --size=15360
logvol swap  --vgname=vg_sys --name=lv_swap --size=4096
logvol /home --vgname=vg_sys --name=lv_home --grow --size=1024

##############################################################################
# PACKAGES
##############################################################################
%packages
@^server
mdadm
lvm2
dosfstools
xfsprogs
grub2-efi-x64
grub2-tools
shim-x64
efibootmgr
open-vm-tools
vim
nano
wget
curl
bash-completion
net-tools
lsof
tcpdump
rsync
tar
unzip
zip
gdisk
%end

##############################################################################
# POST INSTALL: DOWNSTREAM EXECUTION AND EFI BACKUP SYNCHRONIZATION
##############################################################################
%post --interpreter=/usr/bin/bash

exec > /root/anaconda-post.log 2>&1

set -euxo pipefail

echo "======================================================"
echo "Running Rocky Linux 9 Post Installation Scripts"
echo "======================================================"

mkdir -p /root/scripts
BASEURL="http://192.168.253.136/repo/rocky9-kickstarts"

curl --retry 5 --retry-delay 2 -fsSL -o /root/scripts/30-postinstall.sh "${BASEURL}/30-postinstall.sh"
curl --retry 5 --retry-delay 2 -fsSL -o /root/scripts/50-grub.sh        "${BASEURL}/50-grub.sh"
curl --retry 5 --retry-delay 2 -fsSL -o /root/scripts/99-cleanup.sh     "${BASEURL}/99-cleanup.sh"

echo "Downloading enable-verbose-boot.sh..."
curl --retry 5 --retry-delay 2 -fsSL \
    -o /root/scripts/enable-verbose-boot.sh \
    "https://raw.githubusercontent.com/Vignesh-8419/ANSIBLE/main/enable-verbose-boot.sh?$(date +%s)"

chmod +x /root/scripts/enable-verbose-boot.sh

echo "Executing enable-verbose-boot.sh..."
/root/scripts/enable-verbose-boot.sh

chmod +x /root/scripts/*.sh

/root/scripts/30-postinstall.sh
echo "30-postinstall.sh completed"

/root/scripts/50-grub.sh
echo "50-grub.sh completed"

/root/scripts/99-cleanup.sh
echo "99-cleanup.sh completed"

echo "=== POST-INSTALL FINAL LAYOUT VERIFICATION ==="

lsblk -o NAME,SIZE,FSTYPE,LABEL,MOUNTPOINT || true
cat /proc/mdstat || true
pvs || true
vgs || true
lvs || true
efibootmgr -v || true

echo "POST_INSTALL_COMPLETE"
%end
