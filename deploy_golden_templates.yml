---
- name: Deploy CentOS 7 Rocky Linux 8 Rocky Linux 9 Golden Templates
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - community.vmware

  vars:

    # ========================================================================
    # ESXi CONNECTION
    # ========================================================================

    esxi_api_host: "192.168.253.128"
    esxi_hostname: "esxi-host-01.vgs.com"

    esxi_username: "root"
    esxi_password: "Root@123"

    esxi_datacenter: "ha-datacenter"

    validate_certs: false

    # ========================================================================
    # STORAGE / NETWORK
    # ========================================================================

    target_datastore: "datastore1"
    target_network: "VM Network"

    # ========================================================================
    # HOT ADD
    # ========================================================================

    enable_cpu_hotadd: true
    enable_memory_hotadd: true

    # ========================================================================
    # POWER
    # ========================================================================

    # OVF is initially deployed powered off.
    power_on_after_deploy: false

    # Power on after Hot Add has been configured and verified.
    power_on_after_hotadd: true

    # ========================================================================
    # OVF DEPLOYMENT
    # ========================================================================

    allow_duplicates: false
    fail_on_spec_warnings: false
    deployment_wait: true

    # ========================================================================
    # TEMPLATE ROOT
    # ========================================================================

    template_root: "/cygdrive/e/repo"

    # ========================================================================
    # SELECT TEMPLATES
    #
    # Default = all three.
    #
    # CentOS:
    #   -e 'deploy_templates=["CENTOS_07"]'
    #
    # Rocky 8:
    #   -e 'deploy_templates=["ROCKYOS_08"]'
    #
    # Rocky 9:
    #   -e 'deploy_templates=["ROCKYOS_09"]'
    # ========================================================================

    deploy_templates:
      - "CENTOS_07"
      - "ROCKYOS_08"
      - "ROCKYOS_09"

    # ========================================================================
    # GOLDEN TEMPLATE DEFINITIONS
    # ========================================================================

    golden_templates:

      - id: "CENTOS_07"

        vm_name: "GOLDENTEMPLATE_CENTOS_07"

        template_dir: "{{ template_root }}/GOLDENTEMPLATE_CENTOS_07"

        ovf_file: "{{ template_root }}/GOLDENTEMPLATE_CENTOS_07/GOLDENTEMPLATE_CENTOS_07.ovf"

        expected_files:
          - "GOLDENTEMPLATE_CENTOS_07.ovf"
          - "GOLDENTEMPLATE_CENTOS_07-1.vmdk"
          - "GOLDENTEMPLATE_CENTOS_07-2.iso"
          - "GOLDENTEMPLATE_CENTOS_07-3.nvram"
          - "GOLDENTEMPLATE_CENTOS_07.mf"

      - id: "ROCKYOS_08"

        vm_name: "GOLDENTEMPLATE_ROCKYOS_08"

        template_dir: "{{ template_root }}/GOLDENTEMPLATE_ROCKYOS_08"

        ovf_file: "{{ template_root }}/GOLDENTEMPLATE_ROCKYOS_08/GOLDENTEMPLATE_ROCKYOS_08.ovf"

        expected_files:
          - "GOLDENTEMPLATE_ROCKYOS_08.ovf"
          - "GOLDENTEMPLATE_ROCKYOS_08-1.vmdk"
          - "GOLDENTEMPLATE_ROCKYOS_08-2.nvram"
          - "GOLDENTEMPLATE_ROCKYOS_08.mf"

      - id: "ROCKYOS_09"

        vm_name: "GOLDENTEMPLATE_ROCKYOS_09"

        template_dir: "{{ template_root }}/GOLDENTEMPLATE_ROCKYOS_09"

        ovf_file: "{{ template_root }}/GOLDENTEMPLATE_ROCKYOS_09/GOLDENTEMPLATE_ROCKYOS_09.ovf"

        expected_files:
          - "GOLDENTEMPLATE_ROCKYOS_09.ovf"
          - "GOLDENTEMPLATE_ROCKYOS_09-1.vmdk"
          - "GOLDENTEMPLATE_ROCKYOS_09-2.nvram"
          - "GOLDENTEMPLATE_ROCKYOS_09.mf"

  tasks:

    # ========================================================================
    # DISPLAY CONFIGURATION
    # ========================================================================

    - name: Display deployment configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "GOLDEN TEMPLATE DEPLOYMENT"
          - "============================================================"
          - "ESXi API Host   : {{ esxi_api_host }}"
          - "ESXi Hostname   : {{ esxi_hostname }}"
          - "Datacenter      : {{ esxi_datacenter }}"
          - "Datastore       : {{ target_datastore }}"
          - "Network         : {{ target_network }}"
          - "CPU Hot Add     : {{ enable_cpu_hotadd }}"
          - "Memory Hot Add  : {{ enable_memory_hotadd }}"
          - "Power On        : {{ power_on_after_hotadd }}"
          - "Validate Certs  : {{ validate_certs }}"
          - "============================================================"
          - "Requested IDs:"
          - "{{ deploy_templates }}"
          - "============================================================"

    # ========================================================================
    # ESXi PASSWORD
    # ========================================================================

    - name: Fail if ESXi password is not supplied
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXI_PASSWORD IS NOT SET
          ============================================================

          Run:

          export ESXI_PASSWORD='Root@123'

          Then:

          ansible-playbook deploy_golden_templates.yml

          ============================================================
      when: esxi_password | length == 0

    # ========================================================================
    # COMMUNITY.VMWARE
    # ========================================================================

    - name: Check community.vmware collection
      ansible.builtin.command:
        argv:
          - ansible-galaxy
          - collection
          - list
      register: vmware_collection_list
      changed_when: false

    - name: Display community.vmware collection
      ansible.builtin.debug:
        msg: "{{ vmware_collection_list.stdout }}"

    # ========================================================================
    # VALIDATE TEMPLATE IDS
    # ========================================================================

    - name: Validate requested template IDs
      ansible.builtin.assert:
        that:
          - item in ['CENTOS_07', 'ROCKYOS_08', 'ROCKYOS_09']
        fail_msg: |
          ============================================================
          INVALID TEMPLATE ID
          ============================================================

          Invalid:
          {{ item }}

          Valid IDs:

          CENTOS_07
          ROCKYOS_08
          ROCKYOS_09

          ============================================================
      loop: "{{ deploy_templates }}"

    # ========================================================================
    # INITIALIZE SELECTED LIST
    # ========================================================================

    - name: Initialize selected template list
      ansible.builtin.set_fact:
        selected_templates: []

    # ========================================================================
    # SELECT CENTOS 7
    # ========================================================================

    - name: Select CentOS 7 template
      ansible.builtin.set_fact:
        selected_templates: "{{ selected_templates + [item] }}"
      loop: "{{ golden_templates }}"
      loop_control:
        label: "{{ item.vm_name }}"
      when:
        - "'CENTOS_07' in deploy_templates"
        - item.id == "CENTOS_07"

    # ========================================================================
    # SELECT ROCKY 8
    # ========================================================================

    - name: Select Rocky Linux 8 template
      ansible.builtin.set_fact:
        selected_templates: "{{ selected_templates + [item] }}"
      loop: "{{ golden_templates }}"
      loop_control:
        label: "{{ item.vm_name }}"
      when:
        - "'ROCKYOS_08' in deploy_templates"
        - item.id == "ROCKYOS_08"

    # ========================================================================
    # SELECT ROCKY 9
    # ========================================================================

    - name: Select Rocky Linux 9 template
      ansible.builtin.set_fact:
        selected_templates: "{{ selected_templates + [item] }}"
      loop: "{{ golden_templates }}"
      loop_control:
        label: "{{ item.vm_name }}"
      when:
        - "'ROCKYOS_09' in deploy_templates"
        - item.id == "ROCKYOS_09"

    # ========================================================================
    # DISPLAY SELECTED
    # ========================================================================

    - name: Display selected templates
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SELECTED TEMPLATES"
          - "============================================================"
          - "{{ selected_templates | map(attribute='vm_name') | list }}"
          - "============================================================"

    - name: Fail if no templates were selected
      ansible.builtin.fail:
        msg: |
          ============================================================
          NO VALID TEMPLATES SELECTED
          ============================================================

          Requested:
          {{ deploy_templates }}

          ============================================================
      when: selected_templates | length == 0

    # ========================================================================
    # TEMPLATE DIRECTORIES
    # ========================================================================

    - name: Check selected template directories
      ansible.builtin.stat:
        path: "{{ item.template_dir }}"
      loop: "{{ selected_templates }}"
      loop_control:
        label: "{{ item.vm_name }}"
      register: template_directory_results

    - name: Fail if template directory is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          TEMPLATE DIRECTORY NOT FOUND
          ============================================================

          VM:
          {{ item.item.vm_name }}

          Directory:
          {{ item.item.template_dir }}

          ============================================================
      loop: "{{ template_directory_results.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"
      when: not item.stat.exists

    # ========================================================================
    # OVF FILES
    # ========================================================================

    - name: Check selected OVF files
      ansible.builtin.stat:
        path: "{{ item.ovf_file }}"
      loop: "{{ selected_templates }}"
      loop_control:
        label: "{{ item.vm_name }}"
      register: ovf_file_results

    - name: Fail if OVF file is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          OVF FILE NOT FOUND
          ============================================================

          VM:
          {{ item.item.vm_name }}

          OVF:
          {{ item.item.ovf_file }}

          ============================================================
      loop: "{{ ovf_file_results.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"
      when: not item.stat.exists

    # ========================================================================
    # OVF PACKAGE FILES
    # ========================================================================

    - name: Check required template package files
      ansible.builtin.stat:
        path: "{{ item.0.template_dir }}/{{ item.1 }}"
      loop: "{{ selected_templates | subelements('expected_files') }}"
      loop_control:
        label: "{{ item.0.vm_name }} -> {{ item.1 }}"
      register: package_file_results

    - name: Fail if package file is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          TEMPLATE PACKAGE FILE NOT FOUND
          ============================================================

          VM:
          {{ item.item.0.vm_name }}

          File:
          {{ item.item.1 }}

          Expected:
          {{ item.item.0.template_dir }}/{{ item.item.1 }}

          ============================================================
      loop: "{{ package_file_results.results }}"
      loop_control:
        label: "{{ item.item.0.vm_name }} -> {{ item.item.1 }}"
      when: not item.stat.exists

    # ========================================================================
    # DATASTORE
    # ========================================================================

    - name: Query ESXi datastores
      community.vmware.vmware_datastore_info:
        hostname: "{{ esxi_api_host }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        datacenter_name: "{{ esxi_datacenter }}"
        validate_certs: "{{ validate_certs }}"
      delegate_to: localhost
      register: esxi_datastore_info

    - name: Display available datastores
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AVAILABLE DATASTORES"
          - "============================================================"
          - >-
            {{
              esxi_datastore_info.datastores
              | default([])
              | map(attribute='name')
              | list
            }}
          - "============================================================"

    - name: Validate target datastore
      ansible.builtin.assert:
        that:
          - >-
            target_datastore in
            (
              esxi_datastore_info.datastores
              | default([])
              | map(attribute='name')
              | list
            )
        fail_msg: |
          ============================================================
          TARGET DATASTORE NOT FOUND
          ============================================================

          Requested:
          {{ target_datastore }}

          Available:

          {{
            esxi_datastore_info.datastores
            | default([])
            | map(attribute='name')
            | list
          }}

          ============================================================

    # ========================================================================
    # DEPLOY OVF
    # ========================================================================

    - name: Deploy selected golden template
      community.vmware.vmware_deploy_ovf:
        hostname: "{{ esxi_api_host }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"

        datacenter: "{{ esxi_datacenter }}"
        esxi_hostname: "{{ esxi_hostname }}"

        datastore: "{{ target_datastore }}"

        folder: "/{{ esxi_datacenter }}/vm"

        name: "{{ item.vm_name }}"

        ovf: "{{ item.ovf_file }}"

        networks:
          "VM Network": "{{ target_network }}"

        power_on: "{{ power_on_after_deploy }}"

        wait: "{{ deployment_wait }}"
        wait_for_ip_address: false

        allow_duplicates: "{{ allow_duplicates }}"

        fail_on_spec_warnings: "{{ fail_on_spec_warnings }}"

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      loop: "{{ selected_templates }}"

      loop_control:
        label: "{{ item.vm_name }}"

      register: deployment_results

    # ========================================================================
    # DEPLOYMENT RESULTS
    # ========================================================================

    - name: Display deployment results
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "OVF DEPLOYMENT RESULT"
          - "============================================================"
          - "VM       : {{ item.item.vm_name }}"
          - "Changed  : {{ item.changed | default(false) }}"
          - "Failed   : {{ item.failed | default(false) }}"
          - "Message  : {{ item.msg | default('Deployment completed') }}"
          - "============================================================"
      loop: "{{ deployment_results.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"

    # ========================================================================
    # ENABLE CPU + MEMORY HOT ADD
    # ========================================================================

    - name: Enable CPU and Memory Hot Add
      community.vmware.vmware_guest:
        hostname: "{{ esxi_api_host }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"

        datacenter: "{{ esxi_datacenter }}"

        folder: "/{{ esxi_datacenter }}/vm"

        name: "{{ item.vm_name }}"

        state: present

        hardware:
          hotadd_cpu: "{{ enable_cpu_hotadd }}"
          hotadd_memory: "{{ enable_memory_hotadd }}"

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      loop: "{{ selected_templates }}"

      loop_control:
        label: "{{ item.vm_name }}"

      register: hotadd_results

    # ========================================================================
    # HOT ADD RESULTS
    # ========================================================================

    - name: Display Hot Add results
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "HOT ADD CONFIGURATION"
          - "============================================================"
          - "VM       : {{ item.item.vm_name }}"
          - "Changed  : {{ item.changed | default(false) }}"
          - "Failed   : {{ item.failed | default(false) }}"
          - "Message  : {{ item.msg | default('Hot Add configured') }}"
          - "============================================================"
      loop: "{{ hotadd_results.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"

    # ========================================================================
    # VERIFY HOT ADD
    #
    # IMPORTANT:
    # cpuHotAddEnabled and memoryHotAddEnabled are directly under config.
    # ========================================================================

    - name: Gather hot add configuration
      community.vmware.vmware_guest_info:
        hostname: "{{ esxi_api_host }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"

        datacenter: "{{ esxi_datacenter }}"

        folder: "/{{ esxi_datacenter }}/vm"

        name: "{{ item.vm_name }}"

        schema: vsphere

        properties:
          - config.name
          - config.cpuHotAddEnabled
          - config.memoryHotAddEnabled
          - config.hardware.numCPU
          - config.hardware.memoryMB
          - runtime.powerState

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      loop: "{{ selected_templates }}"

      loop_control:
        label: "{{ item.vm_name }}"

      register: hotadd_verification

    # ========================================================================
    # DISPLAY HOT ADD VERIFICATION
    # ========================================================================

    - name: Display Hot Add verification
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "{{ item.item.vm_name }}"
          - "============================================================"
          - "CPU Hot Add    : {{ item.instance.config.cpuHotAddEnabled | default('UNKNOWN') }}"
          - "Memory Hot Add : {{ item.instance.config.memoryHotAddEnabled | default('UNKNOWN') }}"
          - "vCPU           : {{ item.instance.config.hardware.numCPU | default('UNKNOWN') }}"
          - "Memory MB      : {{ item.instance.config.hardware.memoryMB | default('UNKNOWN') }}"
          - "Power State    : {{ item.instance.runtime.powerState | default('UNKNOWN') }}"
          - "============================================================"
      loop: "{{ hotadd_verification.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"

    # ========================================================================
    # ASSERT CPU HOT ADD
    # ========================================================================

    - name: Assert CPU Hot Add
      ansible.builtin.assert:
        that:
          - item.instance.config.cpuHotAddEnabled | default(false) | bool
        fail_msg: |
          ============================================================
          CPU HOT ADD VALIDATION FAILED
          ============================================================

          VM:
          {{ item.item.vm_name }}

          CPU Hot Add:
          {{ item.instance.config.cpuHotAddEnabled | default('UNKNOWN') }}

          ============================================================
      loop: "{{ hotadd_verification.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"

    # ========================================================================
    # ASSERT MEMORY HOT ADD
    # ========================================================================

    - name: Assert Memory Hot Add
      ansible.builtin.assert:
        that:
          - item.instance.config.memoryHotAddEnabled | default(false) | bool
        fail_msg: |
          ============================================================
          MEMORY HOT ADD VALIDATION FAILED
          ============================================================

          VM:
          {{ item.item.vm_name }}

          Memory Hot Add:
          {{ item.instance.config.memoryHotAddEnabled | default('UNKNOWN') }}

          ============================================================
      loop: "{{ hotadd_verification.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"

    # ========================================================================
    # POWER ON
    # ========================================================================

    - name: Power on golden templates
      community.vmware.vmware_guest:
        hostname: "{{ esxi_api_host }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"

        datacenter: "{{ esxi_datacenter }}"

        folder: "/{{ esxi_datacenter }}/vm"

        name: "{{ item.vm_name }}"

        state: poweredon

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      loop: "{{ selected_templates }}"

      loop_control:
        label: "{{ item.vm_name }}"

      when: power_on_after_hotadd | bool

      register: poweron_results

    # ========================================================================
    # FINAL VM INFORMATION
    # ========================================================================

    - name: Gather final VM information
      community.vmware.vmware_guest_info:
        hostname: "{{ esxi_api_host }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"

        datacenter: "{{ esxi_datacenter }}"

        folder: "/{{ esxi_datacenter }}/vm"

        name: "{{ item.vm_name }}"

        schema: vsphere

        properties:
          - config.name
          - config.cpuHotAddEnabled
          - config.memoryHotAddEnabled
          - config.hardware.numCPU
          - config.hardware.memoryMB
          - runtime.powerState

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      loop: "{{ selected_templates }}"

      loop_control:
        label: "{{ item.vm_name }}"

      register: final_vm_info

    # ========================================================================
    # FINAL SUMMARY PER VM
    # ========================================================================

    - name: Display final golden template summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "GOLDEN TEMPLATE"
          - "============================================================"
          - "VM              : {{ item.item.vm_name }}"
          - "CPU Hot Add     : {{ item.instance.config.cpuHotAddEnabled | default('UNKNOWN') }}"
          - "Memory Hot Add  : {{ item.instance.config.memoryHotAddEnabled | default('UNKNOWN') }}"
          - "vCPU            : {{ item.instance.config.hardware.numCPU | default('UNKNOWN') }}"
          - "Memory MB       : {{ item.instance.config.hardware.memoryMB | default('UNKNOWN') }}"
          - "Power State     : {{ item.instance.runtime.powerState | default('UNKNOWN') }}"
          - "ESXi API        : {{ esxi_api_host }}"
          - "ESXi Host       : {{ esxi_hostname }}"
          - "Datastore       : {{ target_datastore }}"
          - "Network         : {{ target_network }}"
          - "============================================================"
      loop: "{{ final_vm_info.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"

    # ========================================================================
    # OVERALL SUCCESS
    # ========================================================================

    - name: Display overall success
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS - GOLDEN TEMPLATE DEPLOYMENT COMPLETE"
          - "============================================================"
          - "ESXi API        : {{ esxi_api_host }}"
          - "ESXi Host       : {{ esxi_hostname }}"
          - "Datastore       : {{ target_datastore }}"
          - "Network         : {{ target_network }}"
          - "CPU Hot Add     : ENABLED"
          - "Memory Hot Add  : ENABLED"
          - "Power On        : {{ power_on_after_hotadd }}"
          - "============================================================"
          - "Deployed VMs:"
          - "{{ selected_templates | map(attribute='vm_name') | list }}"
          - "============================================================"
