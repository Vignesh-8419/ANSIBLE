---
- name: Deploy CentOS 7 Rocky 8 Rocky 9 Golden Templates
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - community.vmware

  vars:

    # ========================================================================
    # ESXi
    # ========================================================================

    esxi_hostname: "192.168.253.128"
    esxi_username: "root"
    esxi_password: "{{ lookup('env', 'ESXI_PASSWORD') }}"

    esxi_datacenter: "ha-datacenter"

    validate_certs: false

    # ========================================================================
    # ESXi STORAGE / NETWORK
    # ========================================================================

    target_datastore: "datastore1"

    target_network: "VM Network"

    # ========================================================================
    # HOT ADD
    # ========================================================================

    enable_cpu_hotadd: true
    enable_memory_hotadd: true

    # ========================================================================
    # POWER
    #
    # Deployment is intentionally done powered off.
    # Hot-add settings are applied while powered off.
    # Then VMs can optionally be powered on.
    # ========================================================================

    power_on_after_hotadd: true

    # ========================================================================
    # OVF DEPLOYMENT
    # ========================================================================

    power_on_after_deploy: false

    allow_duplicates: false

    fail_on_spec_warnings: false

    deployment_wait: true

    # ========================================================================
    # TEMPLATE ROOT
    # ========================================================================

    template_root: "/cygdrive/e/repo"

    # ========================================================================
    # SELECT TEMPLATES
    #
    # Default:
    #   all three
    #
    # Examples:
    #
    #   -e 'deploy_templates=["CENTOS_07"]'
    #
    #   -e 'deploy_templates=["ROCKYOS_08"]'
    #
    #   -e 'deploy_templates=["ROCKYOS_09"]'
    #
    #   -e 'deploy_templates=["CENTOS_07","ROCKYOS_08"]'
    # ========================================================================

    deploy_templates:
      - "CENTOS_07"
      - "ROCKYOS_08"
      - "ROCKYOS_09"

    # ========================================================================
    # GOLDEN TEMPLATE DEFINITIONS
    # ========================================================================

    golden_templates:

      - id: "CENTOS_07"

        vm_name: "GOLDENTEMPLATE_CENTOS_07"

        template_dir: >-
          {{ template_root }}/GOLDENTEMPLATE_CENTOS_07

        ovf_file: >-
          {{ template_root }}/GOLDENTEMPLATE_CENTOS_07/GOLDENTEMPLATE_CENTOS_07.ovf

        expected_files:
          - "GOLDENTEMPLATE_CENTOS_07.ovf"
          - "GOLDENTEMPLATE_CENTOS_07-1.vmdk"
          - "GOLDENTEMPLATE_CENTOS_07-2.iso"
          - "GOLDENTEMPLATE_CENTOS_07-3.nvram"
          - "GOLDENTEMPLATE_CENTOS_07.mf"

      - id: "ROCKYOS_08"

        vm_name: "GOLDENTEMPLATE_ROCKYOS_08"

        template_dir: >-
          {{ template_root }}/GOLDENTEMPLATE_ROCKYOS_08

        ovf_file: >-
          {{ template_root }}/GOLDENTEMPLATE_ROCKYOS_08/GOLDENTEMPLATE_ROCKYOS_08.ovf

        expected_files:
          - "GOLDENTEMPLATE_ROCKYOS_08.ovf"
          - "GOLDENTEMPLATE_ROCKYOS_08-1.vmdk"
          - "GOLDENTEMPLATE_ROCKYOS_08-2.nvram"
          - "GOLDENTEMPLATE_ROCKYOS_08.mf"

      - id: "ROCKYOS_09"

        vm_name: "GOLDENTEMPLATE_ROCKYOS_09"

        template_dir: >-
          {{ template_root }}/GOLDENTEMPLATE_ROCKYOS_09

        ovf_file: >-
          {{ template_root }}/GOLDENTEMPLATE_ROCKYOS_09/GOLDENTEMPLATE_ROCKYOS_09.ovf

        expected_files:
          - "GOLDENTEMPLATE_ROCKYOS_09.ovf"
          - "GOLDENTEMPLATE_ROCKYOS_09-1.vmdk"
          - "GOLDENTEMPLATE_ROCKYOS_09-2.nvram"
          - "GOLDENTEMPLATE_ROCKYOS_09.mf"

  tasks:

    # ========================================================================
    # DISPLAY CONFIGURATION
    # ========================================================================

    - name: Display deployment configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "GOLDEN TEMPLATE DEPLOYMENT"
          - "============================================================"
          - "ESXi Host       : {{ esxi_hostname }}"
          - "Datacenter      : {{ esxi_datacenter }}"
          - "Datastore       : {{ target_datastore }}"
          - "Network         : {{ target_network }}"
          - "CPU Hot Add     : {{ enable_cpu_hotadd }}"
          - "Memory Hot Add  : {{ enable_memory_hotadd }}"
          - "Power On        : {{ power_on_after_hotadd }}"
          - "Validate Certs  : {{ validate_certs }}"
          - "============================================================"
          - "Selected:"
          - >-
            {{
              golden_templates
              | selectattr('id', 'in', deploy_templates)
              | map(attribute='vm_name')
              | list
            }}
          - "============================================================"

    # ========================================================================
    # CHECK ESXi PASSWORD
    # ========================================================================

    - name: Fail if ESXi password is not supplied
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXI_PASSWORD IS NOT SET
          ============================================================

          Run:

          export ESXI_PASSWORD='YOUR_ESXI_ROOT_PASSWORD'

          Then:

          ansible-playbook deploy_golden_templates.yml

          ============================================================
      when: esxi_password | length == 0

    # ========================================================================
    # CHECK COMMUNITY.VMWARE
    # ========================================================================

    - name: Check community.vmware collection
      ansible.builtin.command:
        argv:
          - ansible-galaxy
          - collection
          - list
      register: vmware_collection_list
      changed_when: false

    - name: Display community.vmware collection
      ansible.builtin.debug:
        msg: "{{ vmware_collection_list.stdout }}"

    # ========================================================================
    # SELECT TEMPLATES
    # ========================================================================

    - name: Build selected template list
      ansible.builtin.set_fact:
        selected_templates: >-
          {{
            golden_templates
            | selectattr('id', 'in', deploy_templates)
            | list
          }}

    - name: Fail if no templates were selected
      ansible.builtin.fail:
        msg: |
          ============================================================
          NO VALID TEMPLATES SELECTED
          ============================================================

          Valid IDs:

          CENTOS_07
          ROCKYOS_08
          ROCKYOS_09

          ============================================================
      when: selected_templates | length == 0

    # ========================================================================
    # CHECK TEMPLATE DIRECTORIES
    # ========================================================================

    - name: Check template directories
      ansible.builtin.stat:
        path: "{{ item.template_dir }}"
      loop: "{{ selected_templates }}"
      loop_control:
        label: "{{ item.vm_name }}"
      register: template_directory_results

    - name: Fail if template directory is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          TEMPLATE DIRECTORY NOT FOUND
          ============================================================

          VM:
          {{ item.item.vm_name }}

          Directory:
          {{ item.item.template_dir }}

          ============================================================
      loop: "{{ template_directory_results.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"
      when: not item.stat.exists

    # ========================================================================
    # CHECK ALL TEMPLATE FILES
    # ========================================================================

    - name: Check required OVF template files
      ansible.builtin.stat:
        path: "{{ item.0.template_dir }}/{{ item.1 }}"
      loop: >-
        {{
          selected_templates
          | subelements('expected_files')
        }}
      loop_control:
        label: "{{ item.0.vm_name }} -> {{ item.1 }}"
      register: template_file_results

    - name: Fail if a template file is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          TEMPLATE FILE NOT FOUND
          ============================================================

          VM:
          {{ item.item.0.vm_name }}

          File:
          {{ item.item.1 }}

          Expected:
          {{ item.item.0.template_dir }}/{{ item.item.1 }}

          ============================================================
      loop: "{{ template_file_results.results }}"
      loop_control:
        label: "{{ item.item.0.vm_name }} -> {{ item.item.1 }}"
      when: not item.stat.exists

    # ========================================================================
    # CHECK DATASTORE
    # ========================================================================

    - name: Query ESXi datastores
      community.vmware.vmware_datastore_info:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        datacenter_name: "{{ esxi_datacenter }}"
        validate_certs: "{{ validate_certs }}"
      delegate_to: localhost
      register: esxi_datastore_info

    - name: Display available datastores
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AVAILABLE DATASTORES"
          - "============================================================"
          - >-
            {{
              esxi_datastore_info.datastores
              | default([])
              | map(attribute='name')
              | list
            }}
          - "============================================================"

    - name: Validate target datastore
      ansible.builtin.assert:
        that:
          - >-
            target_datastore in
            (
              esxi_datastore_info.datastores
              | default([])
              | map(attribute='name')
              | list
            )
        fail_msg: |
          ============================================================
          TARGET DATASTORE NOT FOUND
          ============================================================

          Requested:
          {{ target_datastore }}

          Available:

          {{
            esxi_datastore_info.datastores
            | default([])
            | map(attribute='name')
            | list
          }}

          ============================================================

    # ========================================================================
    # DEPLOY OVF TEMPLATES
    # ========================================================================

    - name: Deploy selected golden template
      community.vmware.vmware_deploy_ovf:

        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"

        datacenter: "{{ esxi_datacenter }}"

        esxi_hostname: "{{ esxi_hostname }}"

        datastore: "{{ target_datastore }}"

        folder: "/{{ esxi_datacenter }}/vm"

        name: "{{ item.vm_name }}"

        ovf: "{{ item.ovf_file }}"

        networks:
          "VM Network": "{{ target_network }}"

        power_on: "{{ power_on_after_deploy }}"

        wait: "{{ deployment_wait }}"

        wait_for_ip_address: false

        allow_duplicates: "{{ allow_duplicates }}"

        fail_on_spec_warnings: "{{ fail_on_spec_warnings }}"

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      loop: "{{ selected_templates }}"

      loop_control:
        label: "{{ item.vm_name }}"

      register: deployment_results

    # ========================================================================
    # DISPLAY DEPLOYMENT RESULTS
    # ========================================================================

    - name: Display deployment results
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "OVF DEPLOYMENT RESULTS"
          - "============================================================"
          - "VM              : {{ item.item.vm_name }}"
          - "Changed         : {{ item.changed | default(false) }}"
          - "Failed          : {{ item.failed | default(false) }}"
          - "Result          : {{ item.msg | default('Deployment completed') }}"
          - "============================================================"
      loop: "{{ deployment_results.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"

    # ========================================================================
    # ENABLE CPU + MEMORY HOT ADD
    #
    # VM is powered off at this point.
    #
    # community.vmware.vmware_guest supports hotadd_cpu and hotadd_memory.
    # ========================================================================

    - name: Enable CPU and Memory Hot Add
      community.vmware.vmware_guest:

        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"

        datacenter: "{{ esxi_datacenter }}"

        folder: "/{{ esxi_datacenter }}/vm"

        name: "{{ item.vm_name }}"

        state: present

        hardware:
          hotadd_cpu: "{{ enable_cpu_hotadd }}"
          hotadd_memory: "{{ enable_memory_hotadd }}"

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      loop: "{{ selected_templates }}"

      loop_control:
        label: "{{ item.vm_name }}"

      register: hotadd_results

    # ========================================================================
    # DISPLAY HOT ADD RESULTS
    # ========================================================================

    - name: Display Hot Add results
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "HOT ADD CONFIGURATION"
          - "============================================================"
          - "VM              : {{ item.item.vm_name }}"
          - "Changed         : {{ item.changed | default(false) }}"
          - "Failed          : {{ item.failed | default(false) }}"
          - "Message         : {{ item.msg | default('Hot Add configured') }}"
          - "============================================================"
      loop: "{{ hotadd_results.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"

    # ========================================================================
    # VERIFY HOT ADD
    # ========================================================================

    - name: Gather deployed VM information
      community.vmware.vmware_guest_info:

        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"

        datacenter: "{{ esxi_datacenter }}"

        folder: "/{{ esxi_datacenter }}/vm"

        name: "{{ item.vm_name }}"

        schema: vsphere

        properties:
          - config.name
          - config.runtime.powerState
          - config.hardware.cpuHotAddEnabled
          - config.hardware.memoryHotAddEnabled
          - config.hardware.numCPU
          - config.hardware.memoryMB

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      loop: "{{ selected_templates }}"

      loop_control:
        label: "{{ item.vm_name }}"

      register: hotadd_verification

    # ========================================================================
    # DISPLAY HOT ADD VERIFICATION
    # ========================================================================

    - name: Display Hot Add verification
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "{{ item.item.vm_name }}"
          - "============================================================"
          - "CPU Hot Add    : {{ item.instance.config.hardware.cpuHotAddEnabled | default('UNKNOWN') }}"
          - "Memory Hot Add : {{ item.instance.config.hardware.memoryHotAddEnabled | default('UNKNOWN') }}"
          - "vCPU           : {{ item.instance.config.hardware.numCPU | default('UNKNOWN') }}"
          - "Memory MB      : {{ item.instance.config.hardware.memoryMB | default('UNKNOWN') }}"
          - "Power State    : {{ item.instance.runtime.powerState | default('UNKNOWN') }}"
          - "============================================================"
      loop: "{{ hotadd_verification.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"

    # ========================================================================
    # ASSERT HOT ADD
    # ========================================================================

    - name: Assert CPU and Memory Hot Add
      ansible.builtin.assert:
        that:
          - item.instance.config.hardware.cpuHotAddEnabled | default(false) | bool
          - item.instance.config.hardware.memoryHotAddEnabled | default(false) | bool
        fail_msg: |
          ============================================================
          HOT ADD VALIDATION FAILED
          ============================================================

          VM:
          {{ item.item.vm_name }}

          CPU Hot Add:
          {{ item.instance.config.hardware.cpuHotAddEnabled | default('UNKNOWN') }}

          Memory Hot Add:
          {{ item.instance.config.hardware.memoryHotAddEnabled | default('UNKNOWN') }}

          ============================================================
      loop: "{{ hotadd_verification.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"

    # ========================================================================
    # POWER ON
    # ========================================================================

    - name: Power on golden templates
      community.vmware.vmware_guest:

        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"

        datacenter: "{{ esxi_datacenter }}"

        folder: "/{{ esxi_datacenter }}/vm"

        name: "{{ item.vm_name }}"

        state: poweredon

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      loop: "{{ selected_templates }}"

      loop_control:
        label: "{{ item.vm_name }}"

      when: power_on_after_hotadd | bool

      register: poweron_results

    # ========================================================================
    # FINAL VM INFO
    # ========================================================================

    - name: Gather final VM information
      community.vmware.vmware_guest_info:

        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"

        datacenter: "{{ esxi_datacenter }}"

        folder: "/{{ esxi_datacenter }}/vm"

        name: "{{ item.vm_name }}"

        schema: vsphere

        properties:
          - config.name
          - config.hardware.cpuHotAddEnabled
          - config.hardware.memoryHotAddEnabled
          - config.hardware.numCPU
          - config.hardware.memoryMB
          - config.runtime.powerState
          - runtime.powerState

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      loop: "{{ selected_templates }}"

      loop_control:
        label: "{{ item.vm_name }}"

      register: final_vm_info

    # ========================================================================
    # FINAL SUMMARY
    # ========================================================================

    - name: Display final golden template summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "GOLDEN TEMPLATE DEPLOYMENT COMPLETE"
          - "============================================================"
          - "VM              : {{ item.item.vm_name }}"
          - "CPU Hot Add     : {{ item.instance.config.hardware.cpuHotAddEnabled | default('UNKNOWN') }}"
          - "Memory Hot Add  : {{ item.instance.config.hardware.memoryHotAddEnabled | default('UNKNOWN') }}"
          - "vCPU            : {{ item.instance.config.hardware.numCPU | default('UNKNOWN') }}"
          - "Memory MB       : {{ item.instance.config.hardware.memoryMB | default('UNKNOWN') }}"
          - "Power State     : {{ item.instance.runtime.powerState | default('UNKNOWN') }}"
          - "ESXi            : {{ esxi_hostname }}"
          - "Datastore       : {{ target_datastore }}"
          - "Network         : {{ target_network }}"
          - "============================================================"
      loop: "{{ final_vm_info.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"

    - name: Display overall success
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS"
          - "============================================================"
          - "CentOS 7      : GOLDENTEMPLATE_CENTOS_07"
          - "Rocky Linux 8 : GOLDENTEMPLATE_ROCKYOS_08"
          - "Rocky Linux 9 : GOLDENTEMPLATE_ROCKYOS_09"
          - "CPU Hot Add   : ENABLED"
          - "Memory Hot Add: ENABLED"
          - "ESXi          : {{ esxi_hostname }}"
          - "Datastore     : {{ target_datastore }}"
          - "Network       : {{ target_network }}"
          - "Power On      : {{ power_on_after_hotadd }}"
          - "============================================================"
