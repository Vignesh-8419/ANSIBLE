---
- name: Automated Nested ESXi 8.0U1 Installation - VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ========================================================================
    # VM
    # ========================================================================

    vm_name: "ESXI-01"

    vm_dir_cygwin: "/cygdrive/d/ESXI/ESXI-01"
    vmx_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmx"
    vmdk_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmdk"
    vmware_log_cygwin: "/cygdrive/d/ESXI/ESXI-01/vmware.log"

    vmx_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmx'
    vmdk_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmdk'

    # ========================================================================
    # ESXi ISO
    # ========================================================================

    esxi_iso_cygwin: "/cygdrive/e/vmware/ESXi-8.0.1-auto.iso"
    esxi_iso_windows: 'E:\vmware\ESXi-8.0.1-auto.iso'

    # ========================================================================
    # HTTP KICKSTART
    # ========================================================================

    ks_url: "http://192.168.253.136/repo/ks.cfg"

    # ========================================================================
    # VMware Workstation
    # ========================================================================

    vmrun_cygwin: "/cygdrive/d/VM workstation/vmrun.exe"
    vmware_cygwin: "/cygdrive/d/VM workstation/vmware.exe"
    vdiskmanager_cygwin: "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"

    vmware_windows: 'D:\VM workstation\vmware.exe'

    # ========================================================================
    # HARDWARE
    # ========================================================================

    vm_memory_mb: 24568
    vm_vcpu: 12
    vm_disk_gb: 2000

    virtual_hw_version: "19"
    guest_os: "vmkernel7"

    # ========================================================================
    # NETWORK
    # ========================================================================

    vm_network_name: "VMnet0"

    esxi_ip: "192.168.253.128"
    esxi_netmask: "255.255.255.0"
    esxi_gateway: "192.168.253.2"
    esxi_dns: "192.168.253.1"
    esxi_hostname: "esxi-host-01.vgs.com"

    http_server_ip: "192.168.253.136"

    # ========================================================================
    # TIMING
    # ========================================================================

    startup_wait_seconds: 20
    installation_wait_seconds: 480
    shutdown_wait_seconds: 20
    final_boot_wait_seconds: 30
    https_timeout_seconds: 300

  tasks:

    # ========================================================================
    # DISPLAY
    # ========================================================================

    - name: Display configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AUTOMATED NESTED ESXi 8.0U1 INSTALLATION"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "VMX           : {{ vmx_file_windows }}"
          - "VMDK          : {{ vmdk_file_windows }}"
          - "ISO           : {{ esxi_iso_windows }}"
          - "KS URL        : {{ ks_url }}"
          - "RAM           : {{ vm_memory_mb }} MB"
          - "CPU           : {{ vm_vcpu }} vCPU"
          - "Disk          : {{ vm_disk_gb }} GB"
          - "Hardware      : {{ virtual_hw_version }}"
          - "Firmware      : EFI"
          - "Nested VT     : ENABLED"
          - "Network       : CUSTOM / {{ vm_network_name }}"
          - "ESXi IP       : {{ esxi_ip }}"
          - "Netmask       : {{ esxi_netmask }}"
          - "Gateway       : {{ esxi_gateway }}"
          - "DNS           : {{ esxi_dns }}"
          - "Hostname      : {{ esxi_hostname }}"
          - "HTTP Server   : {{ http_server_ip }}"
          - "============================================================"

    # ========================================================================
    # CHECK ISO
    # ========================================================================

    - name: Check customized ESXi ISO
      ansible.builtin.stat:
        path: "{{ esxi_iso_cygwin }}"
      register: iso_stat

    - name: Fail if ESXi ISO is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi CUSTOMIZED ISO NOT FOUND
          ============================================================

          {{ esxi_iso_windows }}

          ============================================================
      when: not iso_stat.stat.exists

    # ========================================================================
    # CHECK VMware tools
    # ========================================================================

    - name: Check vmrun.exe
      ansible.builtin.stat:
        path: "{{ vmrun_cygwin }}"
      register: vmrun_stat

    - name: Fail if vmrun.exe is missing
      ansible.builtin.fail:
        msg: |
          vmrun.exe not found:

          {{ vmrun_cygwin }}
      when: not vmrun_stat.stat.exists

    - name: Check VMware Workstation executable
      ansible.builtin.stat:
        path: "{{ vmware_cygwin }}"
      register: vmware_stat

    - name: Fail if VMware Workstation is missing
      ansible.builtin.fail:
        msg: |
          VMware Workstation executable not found:

          {{ vmware_cygwin }}
      when: not vmware_stat.stat.exists

    - name: Check vmware-vdiskmanager.exe
      ansible.builtin.stat:
        path: "{{ vdiskmanager_cygwin }}"
      register: vdiskmanager_stat

    - name: Fail if vdiskmanager is missing
      ansible.builtin.fail:
        msg: |
          vmware-vdiskmanager.exe not found:

          {{ vdiskmanager_cygwin }}
      when: not vdiskmanager_stat.stat.exists

    # ========================================================================
    # HTTP KICKSTART
    # ========================================================================

    - name: Download HTTP kickstart
      ansible.builtin.command:
        argv:
          - curl
          - -fsS
          - "{{ ks_url }}"
      register: ks_http_result
      changed_when: false
      failed_when: false

    - name: Fail if HTTP KS.CFG is unavailable
      ansible.builtin.fail:
        msg: |
          ============================================================
          HTTP KS.CFG NOT AVAILABLE
          ============================================================

          URL:

          {{ ks_url }}

          Return code:
          {{ ks_http_result.rc }}

          STDOUT:
          {{ ks_http_result.stdout }}

          STDERR:
          {{ ks_http_result.stderr }}

          ============================================================
      when: ks_http_result.rc != 0

    - name: Validate HTTP KS.CFG
      ansible.builtin.set_fact:
        ks_valid:
          vmaccepteula: "{{ 'vmaccepteula' in ks_http_result.stdout }}"
          rootpw: "{{ 'rootpw ' in ks_http_result.stdout }}"
          network: "{{ 'network --bootproto=static' in ks_http_result.stdout }}"
          ip: "{{ '192.168.253.128' in ks_http_result.stdout }}"
          netmask: "{{ '255.255.255.0' in ks_http_result.stdout }}"
          gateway: "{{ '192.168.253.2' in ks_http_result.stdout }}"
          dns: "{{ '192.168.253.1' in ks_http_result.stdout }}"
          hostname: "{{ 'esxi-host-01.vgs.com' in ks_http_result.stdout }}"
          vmnic: "{{ 'vmnic0' in ks_http_result.stdout }}"
          install: "{{ 'install --firstdisk --overwritevmfs' in ks_http_result.stdout }}"
          reboot: "{{ 'reboot' in ks_http_result.stdout }}"

    - name: Assert HTTP KS.CFG
      ansible.builtin.assert:
        that:
          - ks_valid.vmaccepteula | bool
          - ks_valid.rootpw | bool
          - ks_valid.network | bool
          - ks_valid.ip | bool
          - ks_valid.netmask | bool
          - ks_valid.gateway | bool
          - ks_valid.dns | bool
          - ks_valid.hostname | bool
          - ks_valid.vmnic | bool
          - ks_valid.install | bool
          - ks_valid.reboot | bool
        fail_msg: |
          ============================================================
          HTTP KS.CFG VALIDATION FAILED
          ============================================================

          vmaccepteula : {{ ks_valid.vmaccepteula }}
          rootpw       : {{ ks_valid.rootpw }}
          network      : {{ ks_valid.network }}
          IP            : {{ ks_valid.ip }}
          netmask       : {{ ks_valid.netmask }}
          gateway       : {{ ks_valid.gateway }}
          DNS            : {{ ks_valid.dns }}
          hostname      : {{ ks_valid.hostname }}
          vmnic0        : {{ ks_valid.vmnic }}
          install       : {{ ks_valid.install }}
          reboot        : {{ ks_valid.reboot }}

          ============================================================
        success_msg: "HTTP KS.CFG validated successfully."

    # ========================================================================
    # VERIFY ISO BOOT.CFG
    # ========================================================================

    - name: Extract ISO BOOT.CFG
      ansible.builtin.command:
        argv:
          - 7z
          - e
          - -so
          - "{{ esxi_iso_cygwin }}"
          - BOOT.CFG
      register: iso_boot_cfg
      changed_when: false
      failed_when: iso_boot_cfg.rc != 0

    - name: Find kernelopt line
      ansible.builtin.shell: |
        printf '%s\n' '{{ iso_boot_cfg.stdout }}' |
        grep '^kernelopt='
      args:
        executable: /bin/bash
      register: iso_kernelopt
      changed_when: false
      failed_when: false

    - name: Validate ISO kernelopt
      ansible.builtin.set_fact:
        expected_kernelopt: >-
          kernelopt=runweasel cdromBoot
          ip=192.168.253.128
          netmask=255.255.255.0
          gateway=192.168.253.2
          nameserver=192.168.253.1
          netdevice=vmnic0
          ks=http://192.168.253.136/repo/ks.cfg

    - name: Normalize expected kernelopt
      ansible.builtin.set_fact:
        expected_kernelopt_normalized: >-
          {{ expected_kernelopt | regex_replace('\s+', ' ') | trim }}

    - name: Calculate ISO kernelopt validity
      ansible.builtin.set_fact:
        iso_kernelopt_valid: >-
          {{
            (iso_kernelopt.stdout | trim)
            ==
            expected_kernelopt_normalized
          }}

    - name: Assert ISO kernelopt
      ansible.builtin.assert:
        that:
          - iso_kernelopt_valid | bool
        fail_msg: |
          ============================================================
          ISO BOOT.CFG IS INCORRECT
          ============================================================

          Expected:

          {{ expected_kernelopt_normalized }}

          Found:

          {{ iso_kernelopt.stdout }}

          ============================================================
        success_msg: "ISO BOOT.CFG validated successfully."

    # ========================================================================
    # CREATE VM DIRECTORY
    # ========================================================================

    - name: Create ESXi VM directory
      ansible.builtin.file:
        path: "{{ vm_dir_cygwin }}"
        state: directory
        mode: "0755"

    # ========================================================================
    # CHECK VM STATE
    # ========================================================================

    - name: Get running VMware VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_before
      changed_when: false
      failed_when: false

    - name: Determine current ESXI-01 state
      ansible.builtin.set_fact:
        esxi_running_before: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_before.stdout | default('') | lower)
          }}

    - name: Display current ESXI-01 state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "CURRENT VM STATE"
          - "============================================================"
          - "Running : {{ esxi_running_before }}"
          - "============================================================"

    # ========================================================================
    # STOP RUNNING VM
    # ========================================================================

    - name: Stop existing ESXI-01
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      register: existing_stop
      changed_when: existing_stop.rc == 0
      failed_when: false
      when: esxi_running_before

    - name: Wait after stopping existing VM
      ansible.builtin.pause:
        seconds: "{{ shutdown_wait_seconds }}"
      when: esxi_running_before

    - name: Recheck running VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_after_stop
      changed_when: false
      failed_when: false

    - name: Determine post-stop state
      ansible.builtin.set_fact:
        esxi_running_after_stop: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_after_stop.stdout | default('') | lower)
          }}

    - name: Fail if ESXI-01 remains running
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXI-01 IS STILL RUNNING
          ============================================================

          {{ vmrun_after_stop.stdout }}

          ============================================================
      when:
        - esxi_running_before
        - esxi_running_after_stop

    # ========================================================================
    # REMOVE LOCKS ONLY WHEN VM IS OFF
    # ========================================================================

    - name: Remove stale VMware lock directories
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 2 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Remove stale VMware runtime state
      ansible.builtin.shell: |
        rm -f "{{ vm_dir_cygwin }}"/*.vmem 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmss 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmsn 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.scoreboard 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmpl 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # VMDK
    # ========================================================================

    - name: Check existing VMDK
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_stat

    - name: Display VMDK status
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMDK STATUS"
          - "============================================================"
          - "Path   : {{ vmdk_file_windows }}"
          - "Exists : {{ vmdk_stat.stat.exists }}"
          - "============================================================"

    # ========================================================================
    # CREATE VMDK
    #
    # IMPORTANT:
    # vmware-vdiskmanager.exe is a Windows executable.
    # Therefore the path MUST be a Windows path.
    # ========================================================================

    - name: Create 2TB ESXi VMDK
      ansible.builtin.command:
        argv:
          - "{{ vdiskmanager_cygwin }}"
          - "-c"
          - "-s"
          - "{{ vm_disk_gb }}GB"
          - "-a"
          - "lsilogic"
          - "-t"
          - "0"
          - "{{ vmdk_file_windows }}"
      register: vmdk_create
      changed_when: vmdk_create.rc == 0
      failed_when: vmdk_create.rc != 0
      when: not vmdk_stat.stat.exists

    - name: Verify VMDK exists
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_after

    - name: Fail if VMDK does not exist
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMDK NOT FOUND
          ============================================================

          Windows:
          {{ vmdk_file_windows }}

          Cygwin:
          {{ vmdk_file_cygwin }}

          ============================================================
      when: not vmdk_after.stat.exists

    # ========================================================================
    # BACKUP EXISTING VMX
    # ========================================================================

    - name: Check existing VMX
      ansible.builtin.stat:
        path: "{{ vmx_file_cygwin }}"
      register: existing_vmx

    - name: Backup existing VMX
      ansible.builtin.copy:
        src: "{{ vmx_file_cygwin }}"
        dest: "{{ vmx_file_cygwin }}.ansible-backup"
        remote_src: true
        mode: "0644"
      when: existing_vmx.stat.exists

    # ========================================================================
    # INSTALLATION VMX
    # ========================================================================

    - name: Create installation VMX
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "UTF-8"

          config.version = "8"
          virtualHW.version = "19"
          virtualHW.productCompatibility = "hosted"

          displayName = "ESXI-01"
          guestOS = "vmkernel7"

          # ==========================================================
          # CPU / MEMORY
          # ==========================================================

          memsize = "24568"
          numvcpus = "12"
          cpuid.coresPerSocket = "1"

          # ==========================================================
          # EFI
          # ==========================================================

          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"

          # ==========================================================
          # NESTED ESXi
          # ==========================================================

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # ==========================================================
          # SCSI
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "D:\ESXI\ESXI-01\ESXI-01.vmdk"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ==========================================================
          # INSTALLATION ISO
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "E:\vmware\ESXi-8.0.1-auto.iso"
          ide1:0.startConnected = "TRUE"

          # ==========================================================
          # NETWORK
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "VMnet0"
          ethernet0.virtualDev = "e1000e"
          ethernet0.addressType = "generated"
          ethernet0.startConnected = "TRUE"

          # ==========================================================
          # DISABLE USB
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"
          ehci.present = "FALSE"

          # ==========================================================
          # DISABLE OTHER DEVICES
          # ==========================================================

          sound.present = "FALSE"
          floppy0.present = "FALSE"
          serial0.present = "FALSE"
          parallel0.present = "FALSE"
          printer0.present = "FALSE"

          # ==========================================================
          # DISPLAY
          # ==========================================================

          svga.present = "TRUE"
          svga.autodetect = "TRUE"

          # ==========================================================
          # INSTALLATION BOOT
          # ==========================================================

          efi.bootOrder = "cdrom,hdd"
          efi.hddOrder = "scsi0:0"

          # ==========================================================
          # POWER
          # ==========================================================

          powerType.powerOff = "soft"
          powerType.powerOn = "soft"
          powerType.suspend = "soft"
          powerType.reset = "soft"

          tools.upgrade.policy = "manual"
          tools.syncTime = "FALSE"

    # ========================================================================
    # READ INSTALLATION VMX
    # ========================================================================

    - name: Read installation VMX
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: installation_vmx_slurp

    - name: Decode installation VMX
      ansible.builtin.set_fact:
        installation_vmx_text: "{{ installation_vmx_slurp.content | b64decode }}"

    - name: Calculate installation VMX validation flags
      ansible.builtin.set_fact:
        install_hw_ok: "{{ 'virtualHW.version = "19"' in installation_vmx_text }}"
        install_firmware_ok: "{{ 'firmware = "efi"' in installation_vmx_text }}"
        install_nested_ok: "{{ 'vhv.enable = "TRUE"' in installation_vmx_text }}"
        install_disk_ok: "{{ 'scsi0:0.present = "TRUE"' in installation_vmx_text }}"
        install_disk_path_ok: "{{ 'scsi0:0.fileName = "D:\ESXI\ESXI-01\ESXI-01.vmdk"' in installation_vmx_text }}"
        install_cd_ok: "{{ 'ide1:0.present = "TRUE"' in installation_vmx_text }}"
        install_iso_ok: "{{ 'ide1:0.fileName = "E:\vmware\ESXi-8.0.1-auto.iso"' in installation_vmx_text }}"
        install_cd_connected_ok: "{{ 'ide1:0.startConnected = "TRUE"' in installation_vmx_text }}"
        install_network_type_ok: "{{ 'ethernet0.connectionType = "custom"' in installation_vmx_text }}"
        install_network_name_ok: "{{ 'ethernet0.vnet = "VMnet0"' in installation_vmx_text }}"
        install_network_connected_ok: "{{ 'ethernet0.startConnected = "TRUE"' in installation_vmx_text }}"
        install_boot_ok: "{{ 'efi.bootOrder = "cdrom,hdd"' in installation_vmx_text }}"
        install_hdd_order_ok: "{{ 'efi.hddOrder = "scsi0:0"' in installation_vmx_text }}"

    - name: Assert installation VMX
      ansible.builtin.assert:
        that:
          - install_hw_ok | bool
          - install_firmware_ok | bool
          - install_nested_ok | bool
          - install_disk_ok | bool
          - install_disk_path_ok | bool
          - install_cd_ok | bool
          - install_iso_ok | bool
          - install_cd_connected_ok | bool
          - install_network_type_ok | bool
          - install_network_name_ok | bool
          - install_network_connected_ok | bool
          - install_boot_ok | bool
          - install_hdd_order_ok | bool
        fail_msg: |
          ============================================================
          INSTALLATION VMX VALIDATION FAILED
          ============================================================

          Hardware      : {{ install_hw_ok }}
          Firmware      : {{ install_firmware_ok }}
          Nested VT     : {{ install_nested_ok }}
          Disk          : {{ install_disk_ok }}
          Disk Path     : {{ install_disk_path_ok }}
          CD            : {{ install_cd_ok }}
          ISO Path      : {{ install_iso_ok }}
          CD Connected  : {{ install_cd_connected_ok }}
          Network Type  : {{ install_network_type_ok }}
          VMnet         : {{ install_network_name_ok }}
          Network Up    : {{ install_network_connected_ok }}
          Boot Order    : {{ install_boot_ok }}
          HDD Order     : {{ install_hdd_order_ok }}

          ============================================================
        success_msg: "Installation VMX validated successfully."

    # ========================================================================
    # LAUNCH INSTALLER THROUGH VMWARE WORKSTATION
    #
    # IMPORTANT:
    # Do NOT use:
    #
    #   vmrun start ... nogui
    #
    # because that is the operation returning:
    #
    #   Error: The operation was canceled
    #
    # Instead launch VMware Workstation with:
    #
    #   vmware.exe -x <vmx>
    #
    # which asks Workstation itself to open and power on the VM.
    # ========================================================================

    - name: Launch VMware Workstation and power on ESXi installer
      ansible.builtin.command:
        argv:
          - powershell.exe
          - "-NoProfile"
          - "-NonInteractive"
          - "-Command"
          - >-
            $vmx = "{{ vmx_file_windows }}";
            $proc = Start-Process
            -FilePath "{{ vmware_windows }}"
            -ArgumentList @("-x", $vmx)
            -PassThru;
            Write-Output ("VMware Workstation PID: " + $proc.Id)
      register: workstation_install_start
      changed_when: true
      failed_when: false

    - name: Display Workstation installer launch
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMWARE WORKSTATION INSTALLER LAUNCH"
          - "============================================================"
          - "Return Code : {{ workstation_install_start.rc }}"
          - "STDOUT      : {{ workstation_install_start.stdout }}"
          - "STDERR      : {{ workstation_install_start.stderr }}"
          - "============================================================"

    - name: Wait for VMware Workstation startup
      ansible.builtin.pause:
        seconds: "{{ startup_wait_seconds }}"

    # ========================================================================
    # VERIFY VM IS RUNNING
    # ========================================================================

    - name: Check VMware running VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: installation_vm_list
      changed_when: false
      failed_when: false

    - name: Determine installation VM state
      ansible.builtin.set_fact:
        installation_vm_running: >-
          {{
            vmx_file_windows | lower
            in
            (installation_vm_list.stdout | default('') | lower)
          }}

    - name: Display installation VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "INSTALLATION VM STATE"
          - "============================================================"
          - "Running : {{ installation_vm_running }}"
          - "============================================================"

    - name: Fail if installation VM did not start
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi INSTALLATION VM DID NOT START
          ============================================================

          vmrun list:

          {{ installation_vm_list.stdout }}

          VMware log:

          {{ vmware_log_cygwin }}

          ============================================================
      when: not installation_vm_running

    # ========================================================================
    # WAIT FOR UNATTENDED INSTALLATION
    # ========================================================================

    - name: Wait for unattended ESXi installation
      ansible.builtin.pause:
        seconds: "{{ installation_wait_seconds }}"

    # ========================================================================
    # COLLECT LOG BEFORE STOPPING
    # ========================================================================

    - name: Check VMware log
      ansible.builtin.stat:
        path: "{{ vmware_log_cygwin }}"
      register: installation_log_stat

    - name: Read VMware log
      ansible.builtin.shell: |
        tail -200 "{{ vmware_log_cygwin }}"
      args:
        executable: /bin/bash
      register: installation_log
      changed_when: false
      failed_when: false
      when: installation_log_stat.stat.exists

    # ========================================================================
    # STOP INSTALLATION VM
    #
    # vmrun is used only here for shutdown.
    # ========================================================================

    - name: Stop installation VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      register: installation_stop
      changed_when: installation_stop.rc == 0
      failed_when: false

    - name: Display installation stop result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "INSTALLATION VM STOP"
          - "============================================================"
          - "Return Code : {{ installation_stop.rc }}"
          - "STDOUT      : {{ installation_stop.stdout }}"
          - "STDERR      : {{ installation_stop.stderr }}"
          - "============================================================"

    - name: Wait for installation shutdown
      ansible.builtin.pause:
        seconds: "{{ shutdown_wait_seconds }}"

    # ========================================================================
    # VERIFY STOPPED
    # ========================================================================

    - name: Check VMs after installation stop
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_after_install
      changed_when: false
      failed_when: false

    - name: Determine whether installation VM is stopped
      ansible.builtin.set_fact:
        installation_vm_stopped: >-
          {{
            vmx_file_windows | lower
            not in
            (vmrun_after_install.stdout | default('') | lower)
          }}

    - name: Fail if installation VM is still running
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXI-01 IS STILL RUNNING
          ============================================================

          vmrun list:

          {{ vmrun_after_install.stdout }}

          ============================================================
      when: not installation_vm_stopped

    # ========================================================================
    # REMOVE LOCKS
    # ========================================================================

    - name: Remove post-install VMware locks
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 2 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Remove post-install runtime state
      ansible.builtin.shell: |
        rm -f "{{ vm_dir_cygwin }}"/*.vmem 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmss 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmsn 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.scoreboard 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmpl 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # BACKUP INSTALLATION VMX
    # ========================================================================

    - name: Backup installation VMX
      ansible.builtin.copy:
        src: "{{ vmx_file_cygwin }}"
        dest: "{{ vmx_file_cygwin }}.installation-backup"
        remote_src: true
        mode: "0644"

    # ========================================================================
    # CREATE FINAL VMX
    # ========================================================================

    - name: Create final ESXi VMX
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "UTF-8"

          config.version = "8"
          virtualHW.version = "19"
          virtualHW.productCompatibility = "hosted"

          displayName = "ESXI-01"
          guestOS = "vmkernel7"

          # ==========================================================
          # CPU / MEMORY
          # ==========================================================

          memsize = "24568"
          numvcpus = "12"
          cpuid.coresPerSocket = "1"

          # ==========================================================
          # EFI
          # ==========================================================

          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"

          # ==========================================================
          # NESTED ESXi
          # ==========================================================

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # ==========================================================
          # SCSI
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "D:\ESXI\ESXI-01\ESXI-01.vmdk"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ==========================================================
          # CD/DVD - DISCONNECTED
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "E:\vmware\ESXi-8.0.1-auto.iso"
          ide1:0.startConnected = "FALSE"

          # ==========================================================
          # NETWORK
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "VMnet0"
          ethernet0.virtualDev = "e1000e"
          ethernet0.addressType = "generated"
          ethernet0.startConnected = "TRUE"

          # ==========================================================
          # DISABLE DEVICES
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"
          ehci.present = "FALSE"

          sound.present = "FALSE"
          floppy0.present = "FALSE"
          serial0.present = "FALSE"
          parallel0.present = "FALSE"
          printer0.present = "FALSE"

          # ==========================================================
          # DISPLAY
          # ==========================================================

          svga.present = "TRUE"
          svga.autodetect = "TRUE"

          # ==========================================================
          # FINAL BOOT
          # ==========================================================

          efi.bootOrder = "hdd"
          efi.hddOrder = "scsi0:0"

          # ==========================================================
          # POWER
          # ==========================================================

          powerType.powerOff = "soft"
          powerType.powerOn = "soft"
          powerType.suspend = "soft"
          powerType.reset = "soft"

          tools.upgrade.policy = "manual"
          tools.syncTime = "FALSE"

    # ========================================================================
    # READ FINAL VMX
    # ========================================================================

    - name: Read final VMX
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: final_vmx_slurp

    - name: Decode final VMX
      ansible.builtin.set_fact:
        final_vmx_text: "{{ final_vmx_slurp.content | b64decode }}"

    - name: Calculate final VMX validation flags
      ansible.builtin.set_fact:
        final_hw_ok: "{{ 'virtualHW.version = "19"' in final_vmx_text }}"
        final_firmware_ok: "{{ 'firmware = "efi"' in final_vmx_text }}"
        final_nested_ok: "{{ 'vhv.enable = "TRUE"' in final_vmx_text }}"
        final_disk_ok: "{{ 'scsi0:0.present = "TRUE"' in final_vmx_text }}"
        final_disk_path_ok: "{{ 'scsi0:0.fileName = "D:\ESXI\ESXI-01\ESXI-01.vmdk"' in final_vmx_text }}"
        final_cd_ok: "{{ 'ide1:0.present = "TRUE"' in final_vmx_text }}"
        final_iso_ok: "{{ 'ide1:0.fileName = "E:\vmware\ESXi-8.0.1-auto.iso"' in final_vmx_text }}"
        final_cd_disconnected_ok: "{{ 'ide1:0.startConnected = "FALSE"' in final_vmx_text }}"
        final_network_type_ok: "{{ 'ethernet0.connectionType = "custom"' in final_vmx_text }}"
        final_network_name_ok: "{{ 'ethernet0.vnet = "VMnet0"' in final_vmx_text }}"
        final_network_connected_ok: "{{ 'ethernet0.startConnected = "TRUE"' in final_vmx_text }}"
        final_boot_ok: "{{ 'efi.bootOrder = "hdd"' in final_vmx_text }}"
        final_hdd_order_ok: "{{ 'efi.hddOrder = "scsi0:0"' in final_vmx_text }}"

    - name: Assert final VMX
      ansible.builtin.assert:
        that:
          - final_hw_ok | bool
          - final_firmware_ok | bool
          - final_nested_ok | bool
          - final_disk_ok | bool
          - final_disk_path_ok | bool
          - final_cd_ok | bool
          - final_iso_ok | bool
          - final_cd_disconnected_ok | bool
          - final_network_type_ok | bool
          - final_network_name_ok | bool
          - final_network_connected_ok | bool
          - final_boot_ok | bool
          - final_hdd_order_ok | bool
        fail_msg: |
          ============================================================
          FINAL VMX VALIDATION FAILED
          ============================================================

          Hardware       : {{ final_hw_ok }}
          Firmware       : {{ final_firmware_ok }}
          Nested VT      : {{ final_nested_ok }}
          Disk           : {{ final_disk_ok }}
          Disk Path      : {{ final_disk_path_ok }}
          CD             : {{ final_cd_ok }}
          ISO Path       : {{ final_iso_ok }}
          CD Disconnected: {{ final_cd_disconnected_ok }}
          Network Type   : {{ final_network_type_ok }}
          VMnet          : {{ final_network_name_ok }}
          Network Online : {{ final_network_connected_ok }}
          Boot Order     : {{ final_boot_ok }}
          HDD Order      : {{ final_hdd_order_ok }}

          ============================================================
        success_msg: "Final VMX validated successfully."

    # ========================================================================
    # FINAL POWER-ON THROUGH VMWARE WORKSTATION
    # ========================================================================

    - name: Launch VMware Workstation and power on final ESXi
      ansible.builtin.command:
        argv:
          - powershell.exe
          - "-NoProfile"
          - "-NonInteractive"
          - "-Command"
          - >-
            $vmx = "{{ vmx_file_windows }}";
            $proc = Start-Process
            -FilePath "{{ vmware_windows }}"
            -ArgumentList @("-x", $vmx)
            -PassThru;
            Write-Output ("VMware Workstation PID: " + $proc.Id)
      register: final_workstation_start
      changed_when: true
      failed_when: false

    - name: Display final Workstation launch
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi POWER ON"
          - "============================================================"
          - "Return Code : {{ final_workstation_start.rc }}"
          - "STDOUT      : {{ final_workstation_start.stdout }}"
          - "STDERR      : {{ final_workstation_start.stderr }}"
          - "============================================================"

    - name: Wait for final ESXi boot
      ansible.builtin.pause:
        seconds: "{{ final_boot_wait_seconds }}"

    # ========================================================================
    # FINAL VM STATE
    # ========================================================================

    - name: Check final VMware VM list
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: final_vmrun_list
      changed_when: false
      failed_when: false

    - name: Determine final VM running state
      ansible.builtin.set_fact:
        final_vm_running: >-
          {{
            vmx_file_windows | lower
            in
            (final_vmrun_list.stdout | default('') | lower)
          }}

    - name: Display final VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi VM STATE"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "Running       : {{ final_vm_running }}"
          - "Boot          : HDD / scsi0:0"
          - "ISO Connected : FALSE"
          - "Network       : VMnet0"
          - "============================================================"

    - name: Fail if final ESXi VM is not running
      ansible.builtin.fail:
        msg: |
          ============================================================
          FINAL ESXi VM IS NOT RUNNING
          ============================================================

          vmrun list:

          {{ final_vmrun_list.stdout }}

          VMware log:

          {{ vmware_log_cygwin }}

          ============================================================
      when: not final_vm_running

    # ========================================================================
    # WAIT FOR ESXi HTTPS
    # ========================================================================

    - name: Wait for ESXi HTTPS
      ansible.builtin.wait_for:
        host: "{{ esxi_ip }}"
        port: 443
        state: started
        timeout: "{{ https_timeout_seconds }}"
        msg: |
          ESXi HTTPS management interface did not become available:

          https://{{ esxi_ip }}

    # ========================================================================
    # PING
    # ========================================================================

    - name: Ping ESXi
      ansible.builtin.command:
        argv:
          - ping
          - "-n"
          - "2"
          - "{{ esxi_ip }}"
      register: esxi_ping
      changed_when: false
      failed_when: false

    # ========================================================================
    # SUCCESS
    # ========================================================================

    - name: Display successful installation
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS - ESXi INSTALLATION COMPLETE"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "VMX           : {{ vmx_file_windows }}"
          - "VMDK          : {{ vmdk_file_windows }}"
          - "Running       : {{ final_vm_running }}"
          - "Firmware      : EFI"
          - "Nested VT     : ENABLED"
          - "Boot          : HDD / scsi0:0"
          - "ISO Connected : FALSE"
          - "Network       : CUSTOM / VMnet0"
          - "IP            : {{ esxi_ip }}"
          - "Netmask       : {{ esxi_netmask }}"
          - "Gateway       : {{ esxi_gateway }}"
          - "DNS           : {{ esxi_dns }}"
          - "Hostname      : {{ esxi_hostname }}"
          - "ESXi URL      : https://{{ esxi_ip }}"
          - "============================================================"
