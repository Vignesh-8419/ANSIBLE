---
- name: Create and Start Nested ESXi VM in VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # ============================================================
    # ESXi VM CONFIGURATION
    # ============================================================

    vm_name: "ESXI-01"

    esxi_iso: "/cygdrive/e/vmware/VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso"

    vm_directory: "/cygdrive/d/ESXI"

    # VMware Workstation installation
    vmrun_path: "/cygdrive/d/VM workstation/vmrun.exe"
    vdiskmanager_path: "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"

    # VM files
    vm_path: "{{ vm_directory }}/{{ vm_name }}"
    vmx_file: "{{ vm_path }}/{{ vm_name }}.vmx"
    vm_disk: "{{ vm_path }}/{{ vm_name }}.vmdk"

    # Hardware
    memory_mb: 24568
    num_cpus: 12
    disk_size_gb: 2000

    # Network
    network_type: "bridged"
    network_name: "VMnet0"

    # Firmware
    firmware: "efi"

  tasks:

    # ============================================================
    # DISPLAY CONFIGURATION
    # ============================================================

    - name: Display ESXi configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM CONFIGURATION"
          - "============================================================"
          - "VM Name      : {{ vm_name }}"
          - "ESXi ISO     : {{ esxi_iso }}"
          - "VM Directory : {{ vm_directory }}"
          - "VMRUN Path   : {{ vmrun_path }}"
          - "VDisk Path   : {{ vdiskmanager_path }}"
          - "RAM          : {{ memory_mb }} MB"
          - "CPU          : {{ num_cpus }} vCPU"
          - "Disk         : {{ disk_size_gb }} GB"
          - "Network      : {{ network_name }}"
          - "Firmware     : {{ firmware }}"
          - "Nested VT    : ENABLED"
          - "============================================================"

    # ============================================================
    # VALIDATE ESXi ISO
    # ============================================================

    - name: Check ESXi ISO exists
      ansible.builtin.stat:
        path: "{{ esxi_iso }}"
      register: esxi_iso_check

    - name: Fail when ESXi ISO does not exist
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi ISO NOT FOUND
          ============================================================

          Expected:
          {{ esxi_iso }}

          ============================================================
      when: not esxi_iso_check.stat.exists

    # ============================================================
    # VALIDATE VMWARE EXECUTABLES
    # ============================================================

    - name: Check VMware vmrun.exe exists
      ansible.builtin.stat:
        path: "{{ vmrun_path }}"
      register: vmrun_check

    - name: Fail when vmrun.exe is not found
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMWARE WORKSTATION vmrun.exe NOT FOUND
          ============================================================

          Expected:
          {{ vmrun_path }}

          ============================================================
      when: not vmrun_check.stat.exists

    - name: Display detected VMware vmrun path
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMWARE WORKSTATION DETECTED"
          - "============================================================"
          - "vmrun.exe: {{ vmrun_path }}"
          - "============================================================"

    - name: Check VMware vmware-vdiskmanager.exe exists
      ansible.builtin.stat:
        path: "{{ vdiskmanager_path }}"
      register: vdiskmanager_check

    - name: Fail when vmware-vdiskmanager.exe is not found
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMWARE VIRTUAL DISK MANAGER NOT FOUND
          ============================================================

          Expected:
          {{ vdiskmanager_path }}

          ============================================================
      when: not vdiskmanager_check.stat.exists

    - name: Display vmware-vdiskmanager path
      ansible.builtin.debug:
        msg: "vmware-vdiskmanager.exe: {{ vdiskmanager_path }}"

    # ============================================================
    # CREATE VM DIRECTORY
    # ============================================================

    - name: Create ESXi VM directory
      ansible.builtin.file:
        path: "{{ vm_path }}"
        state: directory
        mode: "0755"

    # ============================================================
    # CHECK EXISTING VM FILES
    # ============================================================

    - name: Check whether VMX file already exists
      ansible.builtin.stat:
        path: "{{ vmx_file }}"
      register: vmx_check

    - name: Check whether virtual disk already exists
      ansible.builtin.stat:
        path: "{{ vm_disk }}"
      register: virtual_disk_check

    # ============================================================
    # CONVERT PATHS FOR WINDOWS VMWARE EXECUTABLES
    # ============================================================

    - name: Convert VM directory path to Windows format
      ansible.builtin.command:
        argv:
          - cygpath
          - -w
          - "{{ vm_path }}"
      register: vm_path_windows
      changed_when: false

    - name: Convert VMX path to Windows format
      ansible.builtin.command:
        argv:
          - cygpath
          - -w
          - "{{ vmx_file }}"
      register: vmx_file_windows
      changed_when: false

    - name: Convert VMDK path to Windows format
      ansible.builtin.command:
        argv:
          - cygpath
          - -w
          - "{{ vm_disk }}"
      register: vm_disk_windows
      changed_when: false

    - name: Convert ESXi ISO path to Windows format
      ansible.builtin.command:
        argv:
          - cygpath
          - -w
          - "{{ esxi_iso }}"
      register: esxi_iso_windows
      changed_when: false

    - name: Display converted Windows paths
      ansible.builtin.debug:
        msg:
          - "VM Directory: {{ vm_path_windows.stdout }}"
          - "VMX File: {{ vmx_file_windows.stdout }}"
          - "VMDK File: {{ vm_disk_windows.stdout }}"
          - "ESXi ISO: {{ esxi_iso_windows.stdout }}"

    # ============================================================
    # CREATE VIRTUAL DISK
    # ============================================================

    - name: Create ESXi virtual disk
      ansible.builtin.command:
        argv:
          - "{{ vdiskmanager_path }}"
          - -c
          - -s
          - "{{ disk_size_gb }}GB"
          - -a
          - lsilogic
          - -t
          - "0"
          - "{{ vm_disk_windows.stdout }}"
      register: disk_create_result
      when: not virtual_disk_check.stat.exists

    - name: Display virtual disk creation result
      ansible.builtin.debug:
        msg:
          - "Virtual disk creation completed"
          - "{{ disk_create_result.stdout_lines | default([]) }}"
      when:
        - not virtual_disk_check.stat.exists
        - disk_create_result is defined

    - name: Display existing virtual disk status
      ansible.builtin.debug:
        msg: "Virtual disk already exists: {{ vm_disk }}"
      when: virtual_disk_check.stat.exists

    # ============================================================
    # CREATE VMX CONFIGURATION
    # ============================================================

    - name: Create ESXi VMX configuration
      ansible.builtin.copy:
        dest: "{{ vmx_file }}"
        mode: "0644"
        content: |
          .encoding = "windows-1252"
          config.version = "8"
          virtualHW.version = "20"

          displayName = "{{ vm_name }}"

          guestOS = "otherlinux-64"

          memsize = "{{ memory_mb }}"
          numvcpus = "{{ num_cpus }}"
          cpuid.coresPerSocket = "{{ num_cpus }}"

          firmware = "{{ firmware }}"

          vhv.enable = "TRUE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          hypervisor.cpuid.v0 = "FALSE"

          mks.enable3d = "FALSE"

          nvram = "{{ vm_name }}.nvram"

          usb.present = "TRUE"
          usb.generic.autoconnect = "FALSE"

          tools.syncTime = "TRUE"

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "{{ vm_name }}.vmdk"
          scsi0:0.deviceType = "scsi-hardDisk"

          sata0.present = "TRUE"

          sata0:0.present = "TRUE"
          sata0:0.fileName = "{{ esxi_iso_windows.stdout | replace('\\', '/') }}"
          sata0:0.deviceType = "cdrom-image"
          sata0:0.startConnected = "TRUE"

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "{{ network_type }}"
          ethernet0.vnet = "{{ network_name }}"
          ethernet0.virtualDev = "vmxnet3"
          ethernet0.startConnected = "TRUE"

          pciBridge0.present = "TRUE"
          pciBridge4.present = "TRUE"
          pciBridge4.virtualDev = "pcieRootPort"
          pciBridge4.functions = "8"

          pciBridge5.present = "TRUE"
          pciBridge5.virtualDev = "pcieRootPort"
          pciBridge5.functions = "8"

          pciBridge6.present = "TRUE"
          pciBridge6.virtualDev = "pcieRootPort"
          pciBridge6.functions = "8"

          pciBridge7.present = "TRUE"
          pciBridge7.virtualDev = "pcieRootPort"
          pciBridge7.functions = "8"

          uuid.action = "create"
      register: vmx_create_result

    # ============================================================
    # VERIFY VMX FILE
    # ============================================================

    - name: Check VMX file after creation
      ansible.builtin.stat:
        path: "{{ vmx_file }}"
      register: vmx_final_check

    - name: Fail when VMX file was not created
      ansible.builtin.fail:
        msg: |
          VMX file was not created successfully:

          {{ vmx_file }}
      when: not vmx_final_check.stat.exists

    # ============================================================
    # CHECK VM STATE
    # ============================================================

    - name: List running VMware Workstation VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - list
      register: running_vms
      changed_when: false
      failed_when: false

    - name: Display currently running VMs
      ansible.builtin.debug:
        var: running_vms.stdout_lines

    - name: Set ESXi VM running status
      ansible.builtin.set_fact:
        esxi_vm_running: >-
          {{
            vmx_file_windows.stdout
            in running_vms.stdout
          }}

    # ============================================================
    # START VM
    # ============================================================

    - name: Start Nested ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - start
          - "{{ vmx_file_windows.stdout }}"
          - nogui
      register: vm_start_result
      when: not esxi_vm_running

    - name: Display VM start result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM STARTED"
          - "============================================================"
          - "VM Name: {{ vm_name }}"
          - "VMX: {{ vmx_file }}"
          - "{{ vm_start_result.stdout | default('') }}"
          - "============================================================"
      when:
        - not esxi_vm_running
        - vm_start_result is defined

    - name: Display already running status
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM ALREADY RUNNING"
          - "============================================================"
          - "VM Name: {{ vm_name }}"
          - "VMX: {{ vmx_file }}"
          - "============================================================"
      when: esxi_vm_running

    # ============================================================
    # FINAL VERIFY
    # ============================================================

    - name: Get final running VMware VM list
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - list
      register: final_running_vms
      changed_when: false
      failed_when: false

    - name: Verify ESXi VM is running
      ansible.builtin.assert:
        that:
          - vmx_file_windows.stdout in final_running_vms.stdout
        fail_msg: |
          ============================================================
          ESXi VM FAILED TO START
          ============================================================

          Expected VM:
          {{ vmx_file_windows.stdout }}

          Running VMs:
          {{ final_running_vms.stdout }}

          ============================================================
        success_msg: |
          ============================================================
          ESXi VM SUCCESSFULLY STARTED
          ============================================================

          VM Name: {{ vm_name }}
          VMX: {{ vmx_file_windows.stdout }}

          ============================================================

    # ============================================================
    # FINAL SUMMARY
    # ============================================================

    - name: Display final ESXi VM summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM DEPLOYMENT COMPLETE"
          - "============================================================"
          - "VM Name         : {{ vm_name }}"
          - "VM Directory    : {{ vm_path }}"
          - "VMX File        : {{ vmx_file }}"
          - "Virtual Disk    : {{ vm_disk }}"
          - "ESXi ISO        : {{ esxi_iso }}"
          - "RAM             : {{ memory_mb }} MB"
          - "CPU             : {{ num_cpus }} vCPU"
          - "Disk            : {{ disk_size_gb }} GB"
          - "Firmware        : {{ firmware }}"
          - "Nested VT       : ENABLED"
          - "VM State        : RUNNING"
          - "============================================================"
