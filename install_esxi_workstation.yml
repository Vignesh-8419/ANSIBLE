---
- name: Automated Nested ESXi 8.0U1 Installation - VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ========================================================================
    # VM
    # ========================================================================

    vm_name: "ESXI-01"

    vm_dir_cygwin: "/cygdrive/d/ESXI/ESXI-01"
    vmx_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmx"
    vmdk_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmdk"
    vmware_log_cygwin: "/cygdrive/d/ESXI/ESXI-01/vmware.log"

    vmx_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmx'
    vmdk_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmdk'

    # ========================================================================
    # ISO
    # ========================================================================

    esxi_iso_cygwin: "/cygdrive/e/vmware/ESXi-8.0.1-auto.iso"
    esxi_iso_windows: 'E:\vmware\ESXi-8.0.1-auto.iso'

    # ========================================================================
    # HTTP KICKSTART
    # ========================================================================

    ks_url: "http://192.168.253.136/repo/ks.cfg"

    # ========================================================================
    # VMWARE
    # ========================================================================

    vmrun_cygwin: "/cygdrive/d/VM workstation/vmrun.exe"
    vmware_cygwin: "/cygdrive/d/VM workstation/vmware.exe"
    vdiskmanager_cygwin: "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"

    vmware_windows: 'D:\VM workstation\vmware.exe'

    # ========================================================================
    # HARDWARE
    # ========================================================================

    vm_memory_mb: 24568
    vm_vcpu: 12
    vm_disk_gb: 2000

    virtual_hw_version: "19"
    guest_os: "vmkernel7"

    # ========================================================================
    # NETWORK
    # ========================================================================

    vm_network_type: "custom"
    vm_network_name: "VMnet0"

    esxi_ip: "192.168.253.128"
    esxi_netmask: "255.255.255.0"
    esxi_gateway: "192.168.253.2"
    esxi_dns: "192.168.253.1"
    esxi_hostname: "esxi-host-01.vgs.com"

    http_server_ip: "192.168.253.136"

    # ========================================================================
    # TIMING
    # ========================================================================

    startup_wait_seconds: 20
    installation_wait_seconds: 480
    shutdown_wait_seconds: 15
    final_boot_wait_seconds: 30
    https_timeout_seconds: 300

  tasks:

    # ========================================================================
    # DISPLAY
    # ========================================================================

    - name: Display ESXi configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AUTOMATED NESTED ESXi 8.0U1 INSTALLATION"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "VMX           : {{ vmx_file_windows }}"
          - "VMDK          : {{ vmdk_file_windows }}"
          - "ISO           : {{ esxi_iso_windows }}"
          - "KS URL        : {{ ks_url }}"
          - "RAM           : {{ vm_memory_mb }} MB"
          - "CPU           : {{ vm_vcpu }} vCPU"
          - "Disk          : {{ vm_disk_gb }} GB"
          - "Hardware      : {{ virtual_hw_version }}"
          - "Firmware      : EFI"
          - "Nested VT     : ENABLED"
          - "Network       : CUSTOM / {{ vm_network_name }}"
          - "ESXi IP       : {{ esxi_ip }}"
          - "Netmask       : {{ esxi_netmask }}"
          - "Gateway       : {{ esxi_gateway }}"
          - "DNS           : {{ esxi_dns }}"
          - "Hostname      : {{ esxi_hostname }}"
          - "HTTP Server   : {{ http_server_ip }}"
          - "============================================================"

    # ========================================================================
    # CHECK ISO
    # ========================================================================

    - name: Check customized ESXi ISO
      ansible.builtin.stat:
        path: "{{ esxi_iso_cygwin }}"
      register: iso_stat

    - name: Fail if customized ESXi ISO is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi CUSTOMIZED ISO NOT FOUND
          ============================================================

          Expected:

          {{ esxi_iso_windows }}

          ============================================================
      when: not iso_stat.stat.exists

    # ========================================================================
    # CHECK VMRUN
    # ========================================================================

    - name: Check vmrun.exe
      ansible.builtin.stat:
        path: "{{ vmrun_cygwin }}"
      register: vmrun_stat

    - name: Fail if vmrun.exe is missing
      ansible.builtin.fail:
        msg: |
          vmrun.exe not found:

          {{ vmrun_cygwin }}
      when: not vmrun_stat.stat.exists

    # ========================================================================
    # CHECK VMWARE
    # ========================================================================

    - name: Check VMware Workstation executable
      ansible.builtin.stat:
        path: "{{ vmware_cygwin }}"
      register: vmware_stat

    - name: Fail if VMware Workstation is missing
      ansible.builtin.fail:
        msg: |
          VMware Workstation executable not found:

          {{ vmware_cygwin }}
      when: not vmware_stat.stat.exists

    # ========================================================================
    # CHECK VDISKMANAGER
    # ========================================================================

    - name: Check vmware-vdiskmanager.exe
      ansible.builtin.stat:
        path: "{{ vdiskmanager_cygwin }}"
      register: vdiskmanager_stat

    - name: Fail if vdiskmanager is missing
      ansible.builtin.fail:
        msg: |
          vmware-vdiskmanager.exe not found:

          {{ vdiskmanager_cygwin }}
      when: not vdiskmanager_stat.stat.exists

    # ========================================================================
    # CHECK HTTP KS.CFG
    # ========================================================================

    - name: Download HTTP kickstart for validation
      ansible.builtin.command:
        argv:
          - curl
          - -fsS
          - "{{ ks_url }}"
      register: ks_http_result
      changed_when: false
      failed_when: false

    - name: Fail if HTTP kickstart is unavailable
      ansible.builtin.fail:
        msg: |
          ============================================================
          HTTP KS.CFG NOT AVAILABLE
          ============================================================

          URL:

          {{ ks_url }}

          Return code:

          {{ ks_http_result.rc }}

          STDOUT:

          {{ ks_http_result.stdout }}

          STDERR:

          {{ ks_http_result.stderr }}

          ============================================================
      when: ks_http_result.rc != 0

    # ========================================================================
    # VALIDATE KS CONTENT
    # ========================================================================

    - name: Validate HTTP kickstart content
      ansible.builtin.assert:
        that:
          - "'vmaccepteula' in ks_http_result.stdout"
          - "'rootpw ' in ks_http_result.stdout"
          - "'network --bootproto=static' in ks_http_result.stdout"
          - "'192.168.253.128' in ks_http_result.stdout"
          - "'255.255.255.0' in ks_http_result.stdout"
          - "'192.168.253.2' in ks_http_result.stdout"
          - "'192.168.253.1' in ks_http_result.stdout"
          - "'esxi-host-01.vgs.com' in ks_http_result.stdout"
          - "'vmnic0' in ks_http_result.stdout"
          - "'install --firstdisk --overwritevmfs' in ks_http_result.stdout"
          - "'reboot' in ks_http_result.stdout"
        fail_msg: |
          HTTP KS.CFG content is not what is expected.
        success_msg: |
          HTTP KS.CFG validated successfully.

    # ========================================================================
    # VERIFY ISO BOOT.CFG
    # ========================================================================

    - name: Extract BOOT.CFG from ISO
      ansible.builtin.command:
        argv:
          - 7z
          - e
          - -so
          - "{{ esxi_iso_cygwin }}"
          - BOOT.CFG
      register: iso_boot_cfg
      changed_when: false
      failed_when: iso_boot_cfg.rc != 0

    - name: Extract kernelopt line
      ansible.builtin.shell: |
        printf '%s\n' '{{ iso_boot_cfg.stdout }}' |
        grep '^kernelopt='
      args:
        executable: /bin/bash
      register: iso_kernelopt
      changed_when: false
      failed_when: false

    - name: Fail if ISO BOOT.CFG is incorrect
      ansible.builtin.fail:
        msg: |
          ============================================================
          ISO BOOT.CFG IS INCORRECT
          ============================================================

          Expected:

          kernelopt=runweasel cdromBoot ip=192.168.253.128 netmask=255.255.255.0 gateway=192.168.253.2 nameserver=192.168.253.1 netdevice=vmnic0 ks=http://192.168.253.136/repo/ks.cfg

          Found:

          {{ iso_kernelopt.stdout }}

          ============================================================
      when:
        - iso_kernelopt.stdout | trim != 'kernelopt=runweasel cdromBoot ip=192.168.253.128 netmask=255.255.255.0 gateway=192.168.253.2 nameserver=192.168.253.1 netdevice=vmnic0 ks=http://192.168.253.136/repo/ks.cfg'

    - name: Display ISO boot configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ISO BOOT CONFIGURATION"
          - "============================================================"
          - "{{ iso_kernelopt.stdout }}"
          - "============================================================"

    # ========================================================================
    # CREATE VM DIRECTORY
    # ========================================================================

    - name: Create ESXi VM directory
      ansible.builtin.file:
        path: "{{ vm_dir_cygwin }}"
        state: directory
        mode: "0755"

    # ========================================================================
    # CHECK RUNNING VMS
    # ========================================================================

    - name: Get running VMware virtual machines
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - list
      register: vmrun_before
      changed_when: false
      failed_when: false

    - name: Determine whether ESXI-01 is running
      ansible.builtin.set_fact:
        esxi_running_before: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_before.stdout | default('') | lower)
          }}

    - name: Display current VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "CURRENT VM STATE"
          - "============================================================"
          - "ESXI-01 running : {{ esxi_running_before }}"
          - "============================================================"

    # ========================================================================
    # STOP EXISTING VM
    # ========================================================================

    - name: Stop ESXI-01 if running
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      register: stop_existing
      changed_when: stop_existing.rc == 0
      failed_when: false
      when: esxi_running_before

    - name: Display stop result
      ansible.builtin.debug:
        msg:
          - "Return code : {{ stop_existing.rc | default('not executed') }}"
          - "STDOUT      : {{ stop_existing.stdout | default('') }}"
          - "STDERR      : {{ stop_existing.stderr | default('') }}"
      when: esxi_running_before

    - name: Wait for VM shutdown
      ansible.builtin.pause:
        seconds: "{{ shutdown_wait_seconds }}"
      when: esxi_running_before

    # ========================================================================
    # VERIFY STOP
    # ========================================================================

    - name: Check VMware VMs after stop
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_after_stop
      changed_when: false
      failed_when: false

    - name: Determine stopped state
      ansible.builtin.set_fact:
        esxi_running_after_stop: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_after_stop.stdout | default('') | lower)
          }}

    - name: Fail if ESXI-01 is still running
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXI-01 IS STILL RUNNING
          ============================================================

          vmrun list:

          {{ vmrun_after_stop.stdout }}

          ============================================================
      when:
        - esxi_running_before
        - esxi_running_after_stop

    # ========================================================================
    # REMOVE STALE LOCKS
    # ========================================================================

    - name: Remove stale VMware lock directories
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 2 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # REMOVE RUNTIME STATE
    # ========================================================================

    - name: Remove stale VMware runtime state
      ansible.builtin.shell: |
        rm -f "{{ vm_dir_cygwin }}"/*.vmem 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmss 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmsn 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.scoreboard 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmpl 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # CHECK VMDK
    # ========================================================================

    - name: Check existing VMDK
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_stat

    # ========================================================================
    # CREATE VMDK IF MISSING
    # ========================================================================

    - name: Create 2TB ESXi VMDK
      ansible.builtin.command:
        argv:
          - "{{ vdiskmanager_cygwin }}"
          - "-c"
          - "-s"
          - "{{ vm_disk_gb }}GB"
          - "-a"
          - "lsilogic"
          - "-t"
          - "0"
          - "{{ vmdk_file_cygwin }}"
      register: vmdk_create
      changed_when: vmdk_create.rc == 0
      failed_when: vmdk_create.rc != 0
      when: not vmdk_stat.stat.exists

    - name: Verify VMDK exists
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_after

    - name: Fail if VMDK is missing
      ansible.builtin.fail:
        msg: |
          VMDK not found:

          {{ vmdk_file_windows }}
      when: not vmdk_after.stat.exists

    # ========================================================================
    # BACKUP EXISTING VMX
    # ========================================================================

    - name: Check existing VMX
      ansible.builtin.stat:
        path: "{{ vmx_file_cygwin }}"
      register: vmx_stat

    - name: Backup existing VMX
      ansible.builtin.copy:
        src: "{{ vmx_file_cygwin }}"
        dest: "{{ vmx_file_cygwin }}.ansible-backup"
        remote_src: true
        mode: "0644"
      when: vmx_stat.stat.exists

    # ========================================================================
    # CREATE INSTALLATION VMX
    # ========================================================================

    - name: Create installation VMX
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "UTF-8"

          config.version = "8"
          virtualHW.version = "19"
          virtualHW.productCompatibility = "hosted"

          displayName = "ESXI-01"
          guestOS = "vmkernel7"

          # ==========================================================
          # CPU / MEMORY
          # ==========================================================

          memsize = "24568"
          numvcpus = "12"
          cpuid.coresPerSocket = "1"

          # ==========================================================
          # EFI
          # ==========================================================

          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"

          # ==========================================================
          # NESTED VIRTUALIZATION
          # ==========================================================

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # ==========================================================
          # SCSI
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "D:\ESXI\ESXI-01\ESXI-01.vmdk"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ==========================================================
          # ESXi INSTALLATION ISO
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "E:\vmware\ESXi-8.0.1-auto.iso"
          ide1:0.startConnected = "TRUE"

          # ==========================================================
          # NETWORK
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "VMnet0"
          ethernet0.virtualDev = "e1000e"
          ethernet0.addressType = "generated"
          ethernet0.startConnected = "TRUE"

          # ==========================================================
          # DISABLE USB
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"
          ehci.present = "FALSE"

          # ==========================================================
          # DISABLE OTHER DEVICES
          # ==========================================================

          sound.present = "FALSE"
          floppy0.present = "FALSE"
          serial0.present = "FALSE"
          parallel0.present = "FALSE"
          printer0.present = "FALSE"

          # ==========================================================
          # DISPLAY
          # ==========================================================

          svga.present = "TRUE"
          svga.autodetect = "TRUE"

          # ==========================================================
          # INSTALLATION BOOT
          # CD FIRST
          # HDD SECOND
          # ==========================================================

          efi.bootOrder = "cdrom,hdd"
          efi.hddOrder = "scsi0:0"

          # ==========================================================
          # POWER
          # ==========================================================

          powerType.powerOff = "soft"
          powerType.powerOn = "soft"
          powerType.suspend = "soft"
          powerType.reset = "soft"

          tools.upgrade.policy = "manual"
          tools.syncTime = "FALSE"

    # ========================================================================
    # READ INSTALLATION VMX
    # ========================================================================

    - name: Read installation VMX
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: install_vmx_slurp

    - name: Decode installation VMX
      ansible.builtin.set_fact:
        install_vmx_text: "{{ install_vmx_slurp.content | b64decode }}"

    # ========================================================================
    # VALIDATION FLAGS
    #
    # Using Jinja expressions inside set_fact avoids the YAML parser
    # conflict that occurred with:
    #
    # - 'text' in install_vmx_text
    # ========================================================================

    - name: Calculate installation VMX validation flags
      ansible.builtin.set_fact:
        install_vmx_hardware_ok: >-
          {{ 'virtualHW.version = "19"' in install_vmx_text }}
        install_vmx_firmware_ok: >-
          {{ 'firmware = "efi"' in install_vmx_text }}
        install_vmx_nested_ok: >-
          {{ 'vhv.enable = "TRUE"' in install_vmx_text }}
        install_vmx_disk_ok: >-
          {{ 'scsi0:0.present = "TRUE"' in install_vmx_text }}
        install_vmx_disk_path_ok: >-
          {{ 'scsi0:0.fileName = "D:\ESXI\ESXI-01\ESXI-01.vmdk"' in install_vmx_text }}
        install_vmx_cd_ok: >-
          {{ 'ide1:0.present = "TRUE"' in install_vmx_text }}
        install_vmx_iso_ok: >-
          {{ 'ide1:0.fileName = "E:\vmware\ESXi-8.0.1-auto.iso"' in install_vmx_text }}
        install_vmx_cd_connected_ok: >-
          {{ 'ide1:0.startConnected = "TRUE"' in install_vmx_text }}
        install_vmx_network_type_ok: >-
          {{ 'ethernet0.connectionType = "custom"' in install_vmx_text }}
        install_vmx_network_name_ok: >-
          {{ 'ethernet0.vnet = "VMnet0"' in install_vmx_text }}
        install_vmx_network_connected_ok: >-
          {{ 'ethernet0.startConnected = "TRUE"' in install_vmx_text }}
        install_vmx_boot_ok: >-
          {{ 'efi.bootOrder = "cdrom,hdd"' in install_vmx_text }}
        install_vmx_hdd_order_ok: >-
          {{ 'efi.hddOrder = "scsi0:0"' in install_vmx_text }}

    - name: Assert installation VMX
      ansible.builtin.assert:
        that:
          - install_vmx_hardware_ok | bool
          - install_vmx_firmware_ok | bool
          - install_vmx_nested_ok | bool
          - install_vmx_disk_ok | bool
          - install_vmx_disk_path_ok | bool
          - install_vmx_cd_ok | bool
          - install_vmx_iso_ok | bool
          - install_vmx_cd_connected_ok | bool
          - install_vmx_network_type_ok | bool
          - install_vmx_network_name_ok | bool
          - install_vmx_network_connected_ok | bool
          - install_vmx_boot_ok | bool
          - install_vmx_hdd_order_ok | bool
        fail_msg: |
          ============================================================
          INSTALLATION VMX VALIDATION FAILED
          ============================================================

          Hardware       : {{ install_vmx_hardware_ok }}
          Firmware       : {{ install_vmx_firmware_ok }}
          Nested VT      : {{ install_vmx_nested_ok }}
          Disk            : {{ install_vmx_disk_ok }}
          Disk Path       : {{ install_vmx_disk_path_ok }}
          CD              : {{ install_vmx_cd_ok }}
          ISO Path        : {{ install_vmx_iso_ok }}
          CD Connected    : {{ install_vmx_cd_connected_ok }}
          Network Type    : {{ install_vmx_network_type_ok }}
          VMnet           : {{ install_vmx_network_name_ok }}
          Network Online  : {{ install_vmx_network_connected_ok }}
          Boot Order      : {{ install_vmx_boot_ok }}
          HDD Order       : {{ install_vmx_hdd_order_ok }}

          ============================================================
        success_msg: "Installation VMX validated successfully."

    # ========================================================================
    # DISPLAY INSTALLATION VMX
    # ========================================================================

    - name: Display installation VMX summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "INSTALLATION VMX"
          - "============================================================"
          - "ISO Connected : TRUE"
          - "ISO           : {{ esxi_iso_windows }}"
          - "Boot          : CDROM -> HDD"
          - "HDD           : scsi0:0"
          - "Network       : CUSTOM / VMnet0"
          - "Firmware      : EFI"
          - "Nested VT     : TRUE"
          - "============================================================"

    # ========================================================================
    # START INSTALLATION VM WITH VMRUN
    # ========================================================================

    - name: Start ESXi installation VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ vmx_file_windows }}"
          - "nogui"
      register: install_start
      changed_when: install_start.rc == 0
      failed_when: false

    - name: Display installation start result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ESXi INSTALLATION START"
          - "============================================================"
          - "Return Code : {{ install_start.rc }}"
          - "STDOUT      : {{ install_start.stdout }}"
          - "STDERR      : {{ install_start.stderr }}"
          - "============================================================"

    - name: Fail if installation VM failed to start
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi INSTALLATION VM FAILED TO START
          ============================================================

          VMX:

          {{ vmx_file_windows }}

          Return code:

          {{ install_start.rc }}

          STDOUT:

          {{ install_start.stdout }}

          STDERR:

          {{ install_start.stderr }}

          ============================================================
      when: install_start.rc != 0

    # ========================================================================
    # OPEN VM IN WORKSTATION
    # ========================================================================

    - name: Open ESXI-01 in VMware Workstation
      ansible.builtin.command:
        argv:
          - powershell.exe
          - "-NoProfile"
          - "-NonInteractive"
          - "-Command"
          - >-
            Start-Process
            -FilePath "{{ vmware_windows }}"
            -ArgumentList @("{{ vmx_file_windows }}")
      register: workstation_open
      changed_when: true
      failed_when: false

    - name: Wait for VMware Workstation
      ansible.builtin.pause:
        seconds: 8

    # ========================================================================
    # CHECK VM
    # ========================================================================

    - name: Check installation VM state
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: install_vm_list
      changed_when: false
      failed_when: false

    - name: Determine installation VM running state
      ansible.builtin.set_fact:
        installation_vm_running: >-
          {{
            vmx_file_windows | lower
            in
            (install_vm_list.stdout | default('') | lower)
          }}

    - name: Display installation VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "INSTALLATION VM STATE"
          - "============================================================"
          - "Running : {{ installation_vm_running }}"
          - "============================================================"

    - name: Fail if installation VM is not running
      ansible.builtin.fail:
        msg: |
          ESXI-01 did not start.

          vmrun output:

          {{ install_vm_list.stdout }}
      when: not installation_vm_running

    # ========================================================================
    # WAIT FOR UNATTENDED INSTALLATION
    # ========================================================================

    - name: Wait for unattended ESXi installation
      ansible.builtin.pause:
        seconds: "{{ installation_wait_seconds }}"

    # ========================================================================
    # READ LOG FOR DIAGNOSTICS
    # ========================================================================

    - name: Check VMware log
      ansible.builtin.stat:
        path: "{{ vmware_log_cygwin }}"
      register: vmware_log_stat

    - name: Read current VMware log
      ansible.builtin.shell: |
        tail -200 "{{ vmware_log_cygwin }}"
      args:
        executable: /bin/bash
      register: vmware_log_tail
      changed_when: false
      failed_when: false
      when: vmware_log_stat.stat.exists

    # ========================================================================
    # STOP INSTALLATION VM
    # ========================================================================

    - name: Stop installation VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      register: install_stop
      changed_when: install_stop.rc == 0
      failed_when: false

    - name: Display installation stop result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "INSTALLATION VM STOP"
          - "============================================================"
          - "Return Code : {{ install_stop.rc }}"
          - "STDOUT      : {{ install_stop.stdout }}"
          - "STDERR      : {{ install_stop.stderr }}"
          - "============================================================"

    - name: Wait for installation VM shutdown
      ansible.builtin.pause:
        seconds: "{{ shutdown_wait_seconds }}"

    # ========================================================================
    # VERIFY VM STOPPED
    # ========================================================================

    - name: Check VMware VMs after installation stop
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: after_install_stop
      changed_when: false
      failed_when: false

    - name: Determine whether installation VM is stopped
      ansible.builtin.set_fact:
        installation_vm_stopped: >-
          {{
            vmx_file_windows | lower
            not in
            (after_install_stop.stdout | default('') | lower)
          }}

    - name: Fail if installation VM is still running
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXI-01 IS STILL RUNNING
          ============================================================

          vmrun list:

          {{ after_install_stop.stdout }}

          ============================================================
      when: not installation_vm_stopped

    # ========================================================================
    # REMOVE LOCKS NOW THAT VM IS OFF
    # ========================================================================

    - name: Remove VMware lock directories
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 2 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # BACKUP INSTALLATION VMX
    # ========================================================================

    - name: Backup installation VMX
      ansible.builtin.copy:
        src: "{{ vmx_file_cygwin }}"
        dest: "{{ vmx_file_cygwin }}.installation-backup"
        remote_src: true
        mode: "0644"

    # ========================================================================
    # FINAL VMX
    # ========================================================================

    - name: Create final installed ESXi VMX
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "UTF-8"

          config.version = "8"
          virtualHW.version = "19"
          virtualHW.productCompatibility = "hosted"

          displayName = "ESXI-01"
          guestOS = "vmkernel7"

          # ==========================================================
          # CPU / MEMORY
          # ==========================================================

          memsize = "24568"
          numvcpus = "12"
          cpuid.coresPerSocket = "1"

          # ==========================================================
          # EFI
          # ==========================================================

          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"

          # ==========================================================
          # NESTED VIRTUALIZATION
          # ==========================================================

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # ==========================================================
          # SCSI
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "D:\ESXI\ESXI-01\ESXI-01.vmdk"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ==========================================================
          # CD/DVD
          # Keep present, but disconnected.
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "E:\vmware\ESXi-8.0.1-auto.iso"
          ide1:0.startConnected = "FALSE"

          # ==========================================================
          # NETWORK
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "VMnet0"
          ethernet0.virtualDev = "e1000e"
          ethernet0.addressType = "generated"
          ethernet0.startConnected = "TRUE"

          # ==========================================================
          # DISABLE USB
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"
          ehci.present = "FALSE"

          # ==========================================================
          # DISABLE OTHER DEVICES
          # ==========================================================

          sound.present = "FALSE"
          floppy0.present = "FALSE"
          serial0.present = "FALSE"
          parallel0.present = "FALSE"
          printer0.present = "FALSE"

          # ==========================================================
          # DISPLAY
          # ==========================================================

          svga.present = "TRUE"
          svga.autodetect = "TRUE"

          # ==========================================================
          # FINAL BOOT
          # ==========================================================

          efi.bootOrder = "hdd"
          efi.hddOrder = "scsi0:0"

          # ==========================================================
          # POWER
          # ==========================================================

          powerType.powerOff = "soft"
          powerType.powerOn = "soft"
          powerType.suspend = "soft"
          powerType.reset = "soft"

          tools.upgrade.policy = "manual"
          tools.syncTime = "FALSE"

    # ========================================================================
    # READ FINAL VMX
    # ========================================================================

    - name: Read final VMX
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: final_vmx_slurp

    - name: Decode final VMX
      ansible.builtin.set_fact:
        final_vmx_text: "{{ final_vmx_slurp.content | b64decode }}"

    # ========================================================================
    # FINAL VMX VALIDATION FLAGS
    # ========================================================================

    - name: Calculate final VMX validation flags
      ansible.builtin.set_fact:
        final_vmx_hardware_ok: >-
          {{ 'virtualHW.version = "19"' in final_vmx_text }}
        final_vmx_firmware_ok: >-
          {{ 'firmware = "efi"' in final_vmx_text }}
        final_vmx_nested_ok: >-
          {{ 'vhv.enable = "TRUE"' in final_vmx_text }}
        final_vmx_disk_ok: >-
          {{ 'scsi0:0.present = "TRUE"' in final_vmx_text }}
        final_vmx_disk_path_ok: >-
          {{ 'scsi0:0.fileName = "D:\ESXI\ESXI-01\ESXI-01.vmdk"' in final_vmx_text }}
        final_vmx_cd_ok: >-
          {{ 'ide1:0.present = "TRUE"' in final_vmx_text }}
        final_vmx_iso_ok: >-
          {{ 'ide1:0.fileName = "E:\vmware\ESXi-8.0.1-auto.iso"' in final_vmx_text }}
        final_vmx_cd_disconnected_ok: >-
          {{ 'ide1:0.startConnected = "FALSE"' in final_vmx_text }}
        final_vmx_network_type_ok: >-
          {{ 'ethernet0.connectionType = "custom"' in final_vmx_text }}
        final_vmx_network_name_ok: >-
          {{ 'ethernet0.vnet = "VMnet0"' in final_vmx_text }}
        final_vmx_network_connected_ok: >-
          {{ 'ethernet0.startConnected = "TRUE"' in final_vmx_text }}
        final_vmx_boot_ok: >-
          {{ 'efi.bootOrder = "hdd"' in final_vmx_text }}
        final_vmx_hdd_order_ok: >-
          {{ 'efi.hddOrder = "scsi0:0"' in final_vmx_text }}

    - name: Assert final VMX
      ansible.builtin.assert:
        that:
          - final_vmx_hardware_ok | bool
          - final_vmx_firmware_ok | bool
          - final_vmx_nested_ok | bool
          - final_vmx_disk_ok | bool
          - final_vmx_disk_path_ok | bool
          - final_vmx_cd_ok | bool
          - final_vmx_iso_ok | bool
          - final_vmx_cd_disconnected_ok | bool
          - final_vmx_network_type_ok | bool
          - final_vmx_network_name_ok | bool
          - final_vmx_network_connected_ok | bool
          - final_vmx_boot_ok | bool
          - final_vmx_hdd_order_ok | bool
        fail_msg: |
          ============================================================
          FINAL VMX VALIDATION FAILED
          ============================================================

          Hardware       : {{ final_vmx_hardware_ok }}
          Firmware       : {{ final_vmx_firmware_ok }}
          Nested VT      : {{ final_vmx_nested_ok }}
          Disk            : {{ final_vmx_disk_ok }}
          Disk Path       : {{ final_vmx_disk_path_ok }}
          CD              : {{ final_vmx_cd_ok }}
          ISO Path        : {{ final_vmx_iso_ok }}
          CD Disconnected : {{ final_vmx_cd_disconnected_ok }}
          Network Type    : {{ final_vmx_network_type_ok }}
          VMnet           : {{ final_vmx_network_name_ok }}
          Network Online  : {{ final_vmx_network_connected_ok }}
          Boot Order      : {{ final_vmx_boot_ok }}
          HDD Order       : {{ final_vmx_hdd_order_ok }}

          ============================================================
        success_msg: "Final VMX validated successfully."

    # ========================================================================
    # DISPLAY FINAL VMX
    # ========================================================================

    - name: Display final VMX summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL INSTALLED ESXi VMX"
          - "============================================================"
          - "Firmware      : EFI"
          - "Nested VT     : ENABLED"
          - "Disk          : scsi0:0"
          - "ISO Connected : FALSE"
          - "Boot          : HDD"
          - "HDD           : scsi0:0"
          - "Network       : CUSTOM / VMnet0"
          - "============================================================"

    # ========================================================================
    # START FINAL ESXi
    # ========================================================================

    - name: Start final installed ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ vmx_file_windows }}"
          - "nogui"
      register: final_start
      changed_when: final_start.rc == 0
      failed_when: false

    - name: Display final ESXi start result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi START"
          - "============================================================"
          - "Return Code : {{ final_start.rc }}"
          - "STDOUT      : {{ final_start.stdout }}"
          - "STDERR      : {{ final_start.stderr }}"
          - "============================================================"

    - name: Fail if final ESXi did not start
      ansible.builtin.fail:
        msg: |
          ============================================================
          FINAL ESXi VM FAILED TO START
          ============================================================

          Return code:

          {{ final_start.rc }}

          STDOUT:

          {{ final_start.stdout }}

          STDERR:

          {{ final_start.stderr }}

          ============================================================
      when: final_start.rc != 0

    # ========================================================================
    # OPEN FINAL VM IN WORKSTATION
    # ========================================================================

    - name: Open final ESXI-01 in VMware Workstation
      ansible.builtin.command:
        argv:
          - powershell.exe
          - "-NoProfile"
          - "-NonInteractive"
          - "-Command"
          - >-
            Start-Process
            -FilePath "{{ vmware_windows }}"
            -ArgumentList @("{{ vmx_file_windows }}")
      register: final_workstation_open
      changed_when: true
      failed_when: false

    # ========================================================================
    # WAIT FOR FINAL ESXi
    # ========================================================================

    - name: Wait for final ESXi boot
      ansible.builtin.pause:
        seconds: "{{ final_boot_wait_seconds }}"

    # ========================================================================
    # CHECK FINAL VM
    # ========================================================================

    - name: Get final VMware VM list
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: final_vmrun_list
      changed_when: false
      failed_when: false

    - name: Determine final VM running state
      ansible.builtin.set_fact:
        final_vm_running: >-
          {{
            vmx_file_windows | lower
            in
            (final_vmrun_list.stdout | default('') | lower)
          }}

    - name: Display final VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL VM STATE"
          - "============================================================"
          - "VM Name : {{ vm_name }}"
          - "Running : {{ final_vm_running }}"
          - "Boot    : INSTALLED HDD"
          - "Disk    : scsi0:0"
          - "ISO     : DISCONNECTED"
          - "Network : VMnet0"
          - "============================================================"

    - name: Fail if final VM is not running
      ansible.builtin.fail:
        msg: |
          ============================================================
          FINAL ESXi VM IS NOT RUNNING
          ============================================================

          vmrun list:

          {{ final_vmrun_list.stdout }}

          ============================================================
      when: not final_vm_running

    # ========================================================================
    # WAIT FOR ESXi HTTPS
    # ========================================================================

    - name: Wait for ESXi HTTPS management port
      ansible.builtin.wait_for:
        host: "{{ esxi_ip }}"
        port: 443
        state: started
        timeout: "{{ https_timeout_seconds }}"
        msg: |
          ESXi HTTPS did not become available on:

          https://{{ esxi_ip }}

    # ========================================================================
    # PING
    # ========================================================================

    - name: Test ESXi management IP
      ansible.builtin.command:
        argv:
          - ping
          - "-n"
          - "2"
          - "{{ esxi_ip }}"
      register: esxi_ping
      changed_when: false
      failed_when: false

    # ========================================================================
    # SUCCESS
    # ========================================================================

    - name: Display successful installation
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS - ESXi INSTALLATION COMPLETE"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "VMX           : {{ vmx_file_windows }}"
          - "VMDK          : {{ vmdk_file_windows }}"
          - "Running       : {{ final_vm_running }}"
          - "Firmware      : EFI"
          - "Nested VT     : ENABLED"
          - "Boot          : HDD / scsi0:0"
          - "ISO Connected : FALSE"
          - "Network       : CUSTOM / VMnet0"
          - "IP            : {{ esxi_ip }}"
          - "Netmask       : {{ esxi_netmask }}"
          - "Gateway       : {{ esxi_gateway }}"
          - "DNS           : {{ esxi_dns }}"
          - "Hostname      : {{ esxi_hostname }}"
          - "ESXi URL      : https://{{ esxi_ip }}"
          - "============================================================"
