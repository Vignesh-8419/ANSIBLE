---
- name: Create and Start Nested ESXi VM in VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vm_name: "ESXI-01"

    esxi_iso: "/cygdrive/e/vmware/VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso"

    vm_base_dir: "/cygdrive/d/ESXI"
    vm_dir: "/cygdrive/d/ESXI/ESXI-01"

    vmx_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmx"
    vmx_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmx'

    vmdk_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmdk"
    vmdk_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmdk'

    vmrun_path: "/cygdrive/d/VM workstation/vmrun.exe"
    vdiskmanager_path: "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"

    vm_ram_mb: 24568
    vm_cpu_count: 12
    vm_disk_size: "2000GB"

    vm_network: "VMnet0"

  tasks:

    ##########################################################################
    # DISPLAY CONFIGURATION
    ##########################################################################

    - name: Display ESXi configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM CONFIGURATION"
          - "============================================================"
          - "VM Name      : {{ vm_name }}"
          - "ESXi ISO     : {{ esxi_iso }}"
          - "VM Directory : {{ vm_dir }}"
          - "VMRUN Path   : {{ vmrun_path }}"
          - "RAM          : {{ vm_ram_mb }} MB"
          - "CPU          : {{ vm_cpu_count }} vCPU"
          - "Disk         : {{ vm_disk_size }}"
          - "Network      : {{ vm_network }}"
          - "Firmware     : EFI"
          - "Nested VT    : ENABLED"
          - "============================================================"

    ##########################################################################
    # CHECK REQUIRED FILES
    ##########################################################################

    - name: Check ESXi ISO exists
      ansible.builtin.stat:
        path: "{{ esxi_iso }}"
      register: esxi_iso_stat

    - name: Fail when ESXi ISO does not exist
      ansible.builtin.fail:
        msg: |
          ESXi ISO was not found:

          {{ esxi_iso }}
      when: not esxi_iso_stat.stat.exists

    - name: Check VMware vmrun.exe exists
      ansible.builtin.stat:
        path: "{{ vmrun_path }}"
      register: vmrun_stat

    - name: Fail when vmrun.exe is not found
      ansible.builtin.fail:
        msg: |
          VMware Workstation vmrun.exe was not found:

          {{ vmrun_path }}
      when: not vmrun_stat.stat.exists

    - name: Check VMware vdiskmanager exists
      ansible.builtin.stat:
        path: "{{ vdiskmanager_path }}"
      register: vdiskmanager_stat

    - name: Fail when vmware-vdiskmanager.exe is not found
      ansible.builtin.fail:
        msg: |
          VMware Virtual Disk Manager was not found:

          {{ vdiskmanager_path }}
      when: not vdiskmanager_stat.stat.exists

    ##########################################################################
    # CREATE VM DIRECTORY
    ##########################################################################

    - name: Create ESXi VM directory
      ansible.builtin.file:
        path: "{{ vm_dir }}"
        state: directory

    ##########################################################################
    # CHECK VM FILES
    ##########################################################################

    - name: Check whether VMX file already exists
      ansible.builtin.stat:
        path: "{{ vmx_file_cygwin }}"
      register: vmx_stat

    - name: Check whether virtual disk already exists
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_stat

    ##########################################################################
    # CREATE VMDK
    ##########################################################################

    - name: Create ESXi virtual disk
      ansible.builtin.command:
        argv:
          - "{{ vdiskmanager_path }}"
          - "-c"
          - "-s"
          - "{{ vm_disk_size }}"
          - "-a"
          - "lsilogic"
          - "-t"
          - "0"
          - "{{ vmdk_file_windows }}"
      when: not vmdk_stat.stat.exists

    - name: Recheck ESXi virtual disk
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_created_stat

    - name: Fail when ESXi virtual disk was not created
      ansible.builtin.fail:
        msg: |
          Failed to create ESXi virtual disk.

          Expected:
          {{ vmdk_file_cygwin }}
      when: not vmdk_created_stat.stat.exists

    ##########################################################################
    # CREATE VMX FILE
    ##########################################################################

    - name: Create ESXi VMX configuration
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        content: |
          .encoding = "windows-1252"

          config.version = "8"
          virtualHW.version = "20"

          displayName = "{{ vm_name }}"

          guestOS = "vmkernel7"

          firmware = "efi"

          memsize = "{{ vm_ram_mb }}"
          numvcpus = "{{ vm_cpu_count }}"
          cpuid.coresPerSocket = "1"

          smc.present = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          vhv.enable = "TRUE"

          hypervisor.cpuid.v0 = "FALSE"

          mainMem.useNamedFile = "FALSE"

          sched.mem.pshare.enable = "FALSE"

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "{{ vmdk_file_windows }}"
          scsi0:0.deviceType = "scsi-hardDisk"

          sata0.present = "TRUE"

          sata0:0.present = "TRUE"
          sata0:0.deviceType = "cdrom-image"
          sata0:0.fileName = "{{ esxi_iso | regex_replace('^/cygdrive/([a-zA-Z])/(.*)$', '\\1:\\\\\2') }}"

          sata0:0.startConnected = "TRUE"

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "{{ vm_network }}"
          ethernet0.virtualDev = "vmxnet3"
          ethernet0.startConnected = "TRUE"

          usb.present = "TRUE"

          sound.present = "FALSE"

          floppy0.present = "FALSE"

          tools.syncTime = "FALSE"

          powerType.powerOff = "soft"
          powerType.powerOn = "soft"
          powerType.reset = "soft"
          powerType.suspend = "soft"

          msg.autoAnswer = "TRUE"

          isolation.tools.copy.disable = "FALSE"
          isolation.tools.paste.disable = "FALSE"

          uuid.action = "create"

          nvram = "{{ vm_name }}.nvram"
      when: not vmx_stat.stat.exists

    ##########################################################################
    # VERIFY VMX
    ##########################################################################

    - name: Check VMX file after creation
      ansible.builtin.stat:
        path: "{{ vmx_file_cygwin }}"
      register: final_vmx_stat

    - name: Fail when VMX file does not exist
      ansible.builtin.fail:
        msg: |
          VMX file does not exist:

          {{ vmx_file_cygwin }}
      when: not final_vmx_stat.stat.exists

    - name: Display VMX file
      ansible.builtin.command:
        cmd: cat "{{ vmx_file_cygwin }}"
      register: vmx_content
      changed_when: false

    - name: Show VMX configuration
      ansible.builtin.debug:
        var: vmx_content.stdout_lines

    ##########################################################################
    # CHECK CURRENT VM STATE
    ##########################################################################

    - name: Get running VMware virtual machines
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "list"
      register: vmrun_list
      changed_when: false
      failed_when: false

    - name: Display running VMs
      ansible.builtin.debug:
        var: vmrun_list.stdout_lines

    - name: Set ESXi VM running status
      ansible.builtin.set_fact:
        esxi_vm_running: >-
          {{
            vmx_file_windows | lower
            in
            vmrun_list.stdout | lower
          }}

    - name: Display ESXi VM status
      ansible.builtin.debug:
        msg: >-
          ESXi VM is
          {{ 'already running' if esxi_vm_running else 'currently stopped' }}

    ##########################################################################
    # START VM
    ##########################################################################

    - name: Start Nested ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "start"
          - "{{ vmx_file_windows }}"
          - "nogui"
      register: vm_start
      when: not esxi_vm_running
      changed_when: vm_start.rc == 0
      failed_when: false

    - name: Display VMware start result
      ansible.builtin.debug:
        msg:
          - "Return Code: {{ vm_start.rc | default('VM already running') }}"
          - "STDOUT: {{ vm_start.stdout | default('') }}"
          - "STDERR: {{ vm_start.stderr | default('') }}"
      when: not esxi_vm_running

    - name: Fail with VMware troubleshooting information
      ansible.builtin.fail:
        msg: |
          ============================================================
          FAILED TO START NESTED ESXi VM
          ============================================================

          VMX:
          {{ vmx_file_windows }}

          vmrun return code:
          {{ vm_start.rc }}

          VMware output:
          {{ vm_start.stdout }}

          {{ vm_start.stderr }}

          IMPORTANT:
          "The operation was canceled" usually means VMware Workstation
          itself rejected or canceled the power-on operation.

          Try opening this VM manually in VMware Workstation:

          {{ vmx_file_windows }}

          Then check for any popup/error message.

          Also verify:

          1. VMware Workstation is running normally.
          2. Nested virtualization is enabled:
             vhv.enable = "TRUE"
          3. Intel VT-x / AMD-V is enabled in BIOS.
          4. Hyper-V is disabled if it conflicts with VMware.
          5. Windows Memory Integrity / VBS is not blocking nested VT.
          6. The VM is not already locked by another VMware process.
          7. VMnet0 exists in VMware Virtual Network Editor.

          ============================================================
      when:
        - not esxi_vm_running
        - vm_start.rc != 0

    ##########################################################################
    # VERIFY VM STARTED
    ##########################################################################

    - name: Wait for VMware startup
      ansible.builtin.pause:
        seconds: 5
      when:
        - not esxi_vm_running
        - vm_start.rc == 0

    - name: Check running VMware virtual machines again
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "list"
      register: final_vmrun_list
      changed_when: false

    - name: Display final running VMs
      ansible.builtin.debug:
        var: final_vmrun_list.stdout_lines

    - name: Verify ESXi VM started
      ansible.builtin.fail:
        msg: |
          VMware reported successful startup, but ESXi VM is not listed.

          Expected VM:
          {{ vmx_file_windows }}

          Running VMs:
          {{ final_vmrun_list.stdout }}
      when: vmx_file_windows | lower not in final_vmrun_list.stdout | lower

    ##########################################################################
    # FINAL SUMMARY
    ##########################################################################

    - name: Display final summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM STARTED SUCCESSFULLY"
          - "============================================================"
          - "VM Name : {{ vm_name }}"
          - "VMX     : {{ vmx_file_windows }}"
          - "RAM     : {{ vm_ram_mb }} MB"
          - "CPU     : {{ vm_cpu_count }}"
          - "Disk    : {{ vm_disk_size }}"
          - "Network : {{ vm_network }}"
          - "Firmware: EFI"
          - "Nested VT: ENABLED"
          - "============================================================"
