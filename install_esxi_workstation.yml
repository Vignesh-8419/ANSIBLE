---
- name: Create and Start Nested ESXi VM in VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ============================================================
    # ESXi VM CONFIGURATION
    # ============================================================

    vm_name: "ESXI-01"

    # ESXi root credentials
    # These are for the ESXi installation.
    # Note: The standard ISO installer will still ask for the password
    # unless you use an automated ESXi kickstart installation.
    esxi_username: "root"
    esxi_password: "Root@123"

    # ============================================================
    # ESXi 8 ISO LOCATION
    # E:\vmware
    # ============================================================

    esxi_iso: "/cygdrive/e/vmware/VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso"

    # ============================================================
    # ESXi VM INSTALLATION LOCATION
    # D:\ESXI
    # ============================================================

    vm_path: "/cygdrive/d/ESXI"

    vmx_file: "/cygdrive/d/ESXI/ESXI-01.vmx"

    vmdk_file: "/cygdrive/d/ESXI/ESXI-01.vmdk"

    # ============================================================
    # VM HARDWARE
    # ============================================================

    vm_memory_mb: 24568

    vm_cpu_count: 12

    # 2 TB virtual disk
    disk_size_gb: 2000

    # ============================================================
    # NETWORK
    # ============================================================

    # VMware custom network
    vmnet: "VMnet0"

    # ============================================================
    # VMWARE WORKSTATION EXECUTABLE LOCATIONS
    # ============================================================

    vmrun_candidates:
      - "/cygdrive/c/Program Files/VMware/VMware Workstation/vmrun.exe"
      - "/cygdrive/c/Program Files (x86)/VMware/VMware Workstation/vmrun.exe"

    vdiskmanager_candidates:
      - "/cygdrive/c/Program Files/VMware/VMware Workstation/vmware-vdiskmanager.exe"
      - "/cygdrive/c/Program Files (x86)/VMware/VMware Workstation/vmware-vdiskmanager.exe"

  tasks:

    # ============================================================
    # STEP 1 - DISPLAY CONFIGURATION
    # ============================================================

    - name: Display ESXi configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM CONFIGURATION"
          - "============================================================"
          - "VM Name      : {{ vm_name }}"
          - "ESXi ISO     : {{ esxi_iso }}"
          - "VM Directory : {{ vm_path }}"
          - "RAM          : {{ vm_memory_mb }} MB"
          - "CPU          : {{ vm_cpu_count }} vCPU"
          - "Disk         : {{ disk_size_gb }} GB"
          - "Network      : {{ vmnet }}"
          - "Firmware     : EFI"
          - "Nested VT    : ENABLED"
          - "============================================================"

    # ============================================================
    # STEP 2 - CHECK ESXi ISO
    # ============================================================

    - name: Check ESXi ISO exists
      ansible.builtin.stat:
        path: "{{ esxi_iso }}"
      register: esxi_iso_stat

    - name: Fail when ESXi ISO does not exist
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi ISO NOT FOUND
          ============================================================

          Expected:

          {{ esxi_iso }}

          ============================================================
      when: not esxi_iso_stat.stat.exists

    # ============================================================
    # STEP 3 - CHECK D DRIVE
    # ============================================================

    - name: Check D drive exists
      ansible.builtin.stat:
        path: "/cygdrive/d"
      register: d_drive_stat

    - name: Fail when D drive does not exist
      ansible.builtin.fail:
        msg: |
          ============================================================
          D DRIVE NOT FOUND
          ============================================================

          Expected installation location:

          {{ vm_path }}

          ============================================================
      when: not d_drive_stat.stat.exists

    # ============================================================
    # STEP 4 - FIND VMWARE vmrun.exe
    # ============================================================

    - name: Check VMware vmrun.exe locations
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ vmrun_candidates }}"
      register: vmrun_checks

    - name: Set vmrun executable path
      ansible.builtin.set_fact:
        vmrun_exe: >-
          {{
            (
              vmrun_checks.results
              | selectattr('stat.exists', 'equalto', true)
              | map(attribute='item')
              | list
              | first
            ) | default('')
          }}

    - name: Fail when vmrun.exe is not found
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMWARE WORKSTATION vmrun.exe NOT FOUND
          ============================================================

          Checked:

          /cygdrive/c/Program Files/VMware/VMware Workstation/vmrun.exe

          /cygdrive/c/Program Files (x86)/VMware/VMware Workstation/vmrun.exe

          Run:

          find /cygdrive/c -iname "vmrun.exe" 2>/dev/null

          ============================================================
      when: vmrun_exe | length == 0

    # ============================================================
    # STEP 5 - FIND vmware-vdiskmanager.exe
    # ============================================================

    - name: Check VMware disk manager locations
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ vdiskmanager_candidates }}"
      register: vdisk_checks

    - name: Set VMware disk manager executable path
      ansible.builtin.set_fact:
        vmware_vdiskmanager_exe: >-
          {{
            (
              vdisk_checks.results
              | selectattr('stat.exists', 'equalto', true)
              | map(attribute='item')
              | list
              | first
            ) | default('')
          }}

    - name: Fail when VMware disk manager is not found
      ansible.builtin.fail:
        msg: |
          ============================================================
          vmware-vdiskmanager.exe NOT FOUND
          ============================================================

          Run:

          find /cygdrive/c -iname "vmware-vdiskmanager.exe" 2>/dev/null

          ============================================================
      when: vmware_vdiskmanager_exe | length == 0

    - name: Display VMware executable paths
      ansible.builtin.debug:
        msg:
          - "VMware vmrun.exe       : {{ vmrun_exe }}"
          - "VMware disk manager    : {{ vmware_vdiskmanager_exe }}"

    # ============================================================
    # STEP 6 - CREATE D:\ESXI
    # ============================================================

    - name: Create ESXi VM installation directory
      ansible.builtin.file:
        path: "{{ vm_path }}"
        state: directory
        mode: "0755"

    # ============================================================
    # STEP 7 - CHECK EXISTING VM FILES
    # ============================================================

    - name: Check whether VMX already exists
      ansible.builtin.stat:
        path: "{{ vmx_file }}"
      register: vmx_stat

    - name: Check whether VMDK already exists
      ansible.builtin.stat:
        path: "{{ vmdk_file }}"
      register: vmdk_stat

    # ============================================================
    # STEP 8 - CREATE 2 TB VIRTUAL DISK
    # ============================================================

    - name: Create ESXi virtual disk
      ansible.builtin.command:
        argv:
          - "{{ vmware_vdiskmanager_exe }}"
          - "-c"
          - "-s"
          - "{{ disk_size_gb }}GB"
          - "-a"
          - "lsilogic"
          - "-t"
          - "1"
          - "{{ vmdk_file }}"
      register: disk_create
      when: not vmdk_stat.stat.exists

    - name: Display existing disk message
      ansible.builtin.debug:
        msg: "Virtual disk already exists. Skipping disk creation."
      when: vmdk_stat.stat.exists

    # ============================================================
    # STEP 9 - CREATE VMX FILE
    # ============================================================

    - name: Create ESXi VMware VMX configuration
      ansible.builtin.copy:
        dest: "{{ vmx_file }}"
        mode: "0644"
        content: |
          .encoding = "windows-1252"
          config.version = "8"

          # VMware hardware version
          virtualHW.version = "21"

          # VM Name
          displayName = "{{ vm_name }}"

          # Guest OS
          guestOS = "vmkernel8"

          # ====================================================
          # CPU
          # ====================================================

          numvcpus = "{{ vm_cpu_count }}"
          cpuid.coresPerSocket = "{{ vm_cpu_count }}"

          # ====================================================
          # MEMORY
          # ====================================================

          memsize = "{{ vm_memory_mb }}"

          # ====================================================
          # NESTED VIRTUALIZATION
          # Required for running VMs inside ESXi
          # ====================================================

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          # ====================================================
          # EFI FIRMWARE
          # ====================================================

          firmware = "efi"

          # ====================================================
          # ESXi INSTALLER ISO
          # ====================================================

          sata0.present = "TRUE"

          sata0:0.present = "TRUE"
          sata0:0.deviceType = "cdrom-image"
          sata0:0.fileName = "{{ esxi_iso }}"
          sata0:0.startConnected = "TRUE"

          # ====================================================
          # ESXi INSTALLATION DISK
          # ====================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "{{ vm_name }}.vmdk"

          # ====================================================
          # NETWORK
          # Custom VMware Network: VMnet0
          # ====================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "{{ vmnet }}"
          ethernet0.startConnected = "TRUE"
          ethernet0.virtualDev = "e1000e"

          # ====================================================
          # USB
          # ====================================================

          usb.present = "TRUE"

          # ====================================================
          # LOGGING
          # ====================================================

          logging = "TRUE"
          tools.syncTime = "FALSE"

          # Generate VM UUID automatically
          uuid.action = "create"
      when: not vmx_stat.stat.exists

    - name: Display existing VMX message
      ansible.builtin.debug:
        msg: "VMX configuration already exists. Skipping VMX creation."
      when: vmx_stat.stat.exists

    # ============================================================
    # STEP 10 - CHECK RUNNING VM
    # ============================================================

    - name: Get currently running VMware VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_exe }}"
          - "list"
      register: running_vms
      changed_when: false

    - name: Display running VMware VMs
      ansible.builtin.debug:
        var: running_vms.stdout_lines

    # ============================================================
    # STEP 11 - START ESXi VM
    # ============================================================

    - name: Start ESXi VM in VMware Workstation
      ansible.builtin.command:
        argv:
          - "{{ vmrun_exe }}"
          - "start"
          - "{{ vmx_file }}"
          - "gui"
      when: vmx_file not in running_vms.stdout

    - name: ESXi VM already running
      ansible.builtin.debug:
        msg: "ESXi VM is already running: {{ vm_name }}"
      when: vmx_file in running_vms.stdout

    # ============================================================
    # COMPLETED
    # ============================================================

    - name: Display final result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM CREATED AND STARTED"
          - "============================================================"
          - ""
          - "VM Name       : {{ vm_name }}"
          - "ESXi ISO      : E:\\vmware\\VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso"
          - "VM Location   : D:\\ESXI"
          - "VMX File      : D:\\ESXI\\ESXI-01.vmx"
          - "VMDK File     : D:\\ESXI\\ESXI-01.vmdk"
          - ""
          - "RAM           : {{ vm_memory_mb }} MB"
          - "CPU           : {{ vm_cpu_count }} vCPU"
          - "Disk          : {{ disk_size_gb }} GB"
          - "Network       : Custom {{ vmnet }}"
          - "Firmware      : EFI"
          - "Nested VT     : ENABLED"
          - ""
          - "============================================================"
          - "VMware Workstation has been instructed to start the VM."
          - "Complete the ESXi installation in the VMware console."
          - "============================================================"
