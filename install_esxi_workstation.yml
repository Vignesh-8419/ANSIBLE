---
- name: Create and Start Nested ESXi VM in VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # ============================================================
    # ESXi VM CONFIGURATION
    # ============================================================

    vm_name: "ESXI-01"

    esxi_iso: "/cygdrive/e/vmware/VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso"

    vm_directory: "/cygdrive/d/ESXI"

    vmx_file: "{{ vm_directory }}/{{ vm_name }}.vmx"

    vm_disk_file: "{{ vm_directory }}/{{ vm_name }}.vmdk"

    vmrun_path: "/cygdrive/d/VM workstation/vmrun.exe"

    vmware_vdiskmanager_path: ""

    memory_mb: 24568
    num_vcpus: 12
    disk_size_gb: 2000

    network_type: "bridged"
    network_vnet: "VMnet0"

    firmware_type: "efi"

    # Nested virtualization
    enable_nested_vt: true

  tasks:

    # ============================================================
    # DISPLAY CONFIGURATION
    # ============================================================

    - name: Display ESXi configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM CONFIGURATION"
          - "============================================================"
          - "VM Name      : {{ vm_name }}"
          - "ESXi ISO     : {{ esxi_iso }}"
          - "VM Directory : {{ vm_directory }}"
          - "VMRUN Path   : {{ vmrun_path }}"
          - "RAM          : {{ memory_mb }} MB"
          - "CPU          : {{ num_vcpus }} vCPU"
          - "Disk         : {{ disk_size_gb }} GB"
          - "Network      : {{ network_vnet }}"
          - "Firmware     : {{ firmware_type | upper }}"
          - "Nested VT    : {{ 'ENABLED' if enable_nested_vt else 'DISABLED' }}"
          - "============================================================"

    # ============================================================
    # VALIDATE PATHS
    # ============================================================

    - name: Check ESXi ISO exists
      ansible.builtin.stat:
        path: "{{ esxi_iso }}"
      register: esxi_iso_stat

    - name: Fail when ESXi ISO does not exist
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi ISO NOT FOUND
          ============================================================

          Expected:
          {{ esxi_iso }}

          ============================================================
      when: not esxi_iso_stat.stat.exists

    - name: Check VMware vmrun.exe exists
      ansible.builtin.stat:
        path: "{{ vmrun_path }}"
      register: vmrun_stat

    - name: Fail when vmrun.exe is not found
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMWARE WORKSTATION vmrun.exe NOT FOUND
          ============================================================

          Expected:
          {{ vmrun_path }}

          ============================================================
      when: not vmrun_stat.stat.exists

    - name: Display detected VMware vmrun path
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMWARE WORKSTATION DETECTED"
          - "============================================================"
          - "vmrun.exe: {{ vmrun_path }}"
          - "============================================================"

    # ============================================================
    # CREATE VM DIRECTORY
    # ============================================================

    - name: Create ESXi VM directory
      ansible.builtin.file:
        path: "{{ vm_directory }}"
        state: directory
        mode: "0755"

    # ============================================================
    # CHECK EXISTING VM
    # ============================================================

    - name: Check whether VMX file already exists
      ansible.builtin.stat:
        path: "{{ vmx_file }}"
      register: vmx_stat

    - name: Check whether virtual disk already exists
      ansible.builtin.stat:
        path: "{{ vm_disk_file }}"
      register: disk_stat

    # ============================================================
    # FIND vmware-vdiskmanager.exe
    # ============================================================

    - name: Check common vmware-vdiskmanager.exe locations
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"
        - "/cygdrive/c/Program Files/VMware/VMware Workstation/vmware-vdiskmanager.exe"
        - "/cygdrive/c/Program Files (x86)/VMware/VMware Workstation/vmware-vdiskmanager.exe"
      register: vdiskmanager_check
      when: not disk_stat.stat.exists

    - name: Set vmware-vdiskmanager path
      ansible.builtin.set_fact:
        vmware_vdiskmanager_path: >-
          {{
            (
              vdiskmanager_check.results
              | selectattr('stat.exists', 'equalto', true)
              | map(attribute='item')
              | list
              | first
            )
            | default('')
          }}
      when: not disk_stat.stat.exists

    - name: Display vmware-vdiskmanager path
      ansible.builtin.debug:
        msg: "vmware-vdiskmanager.exe: {{ vmware_vdiskmanager_path | default('NOT FOUND') }}"
      when: not disk_stat.stat.exists

    # ============================================================
    # CREATE VIRTUAL DISK
    # ============================================================

    - name: Create ESXi virtual disk
      ansible.builtin.command:
        argv:
          - "{{ vmware_vdiskmanager_path }}"
          - "-c"
          - "-s"
          - "{{ disk_size_gb }}GB"
          - "-a"
          - "lsilogic"
          - "-t"
          - "0"
          - "{{ vm_disk_file }}"
      when:
        - not disk_stat.stat.exists
        - vmware_vdiskmanager_path | length > 0

    - name: Fail when vmware-vdiskmanager.exe is not found and disk does not exist
      ansible.builtin.fail:
        msg: |
          ============================================================
          VIRTUAL DISK CANNOT BE CREATED
          ============================================================

          vmware-vdiskmanager.exe was not found.

          Checked:
          /cygdrive/d/VM workstation/vmware-vdiskmanager.exe
          /cygdrive/c/Program Files/VMware/VMware Workstation/vmware-vdiskmanager.exe
          /cygdrive/c/Program Files (x86)/VMware/VMware Workstation/vmware-vdiskmanager.exe

          Run:

          find /cygdrive/d -iname "vmware-vdiskmanager.exe" 2>/dev/null

          ============================================================
      when:
        - not disk_stat.stat.exists
        - vmware_vdiskmanager_path | length == 0

    # ============================================================
    # CREATE VMX CONFIGURATION
    # ============================================================

    - name: Create ESXi VMware VMX configuration
      ansible.builtin.copy:
        dest: "{{ vmx_file }}"
        mode: "0644"
        content: |
          .encoding = "windows-1252"
          config.version = "8"
          virtualHW.version = "20"

          displayName = "{{ vm_name }}"
          guestOS = "vmkernel7"

          firmware = "{{ firmware_type }}"

          memsize = "{{ memory_mb }}"
          numvcpus = "{{ num_vcpus }}"

          cpuid.coresPerSocket = "1"

          vhv.enable = "{{ 'TRUE' if enable_nested_vt else 'FALSE' }}"
          hypervisor.cpuid.v0 = "FALSE"

          hpet0.present = "TRUE"

          tools.syncTime = "FALSE"

          # ========================================================
          # STORAGE
          # ========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "{{ vm_disk_file }}"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ========================================================
          # ESXi ISO
          # ========================================================

          sata0.present = "TRUE"

          sata0:0.present = "TRUE"
          sata0:0.deviceType = "cdrom-image"
          sata0:0.fileName = "{{ esxi_iso }}"
          sata0:0.startConnected = "TRUE"

          # ========================================================
          # NETWORK
          # ========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "{{ network_type }}"
          ethernet0.virtualDev = "vmxnet3"
          ethernet0.startConnected = "TRUE"

          # ========================================================
          # BOOT
          # ========================================================

          bios.bootOrder = "cdrom,hdd"

          # ========================================================
          # USB
          # ========================================================

          usb.present = "TRUE"
          usb.generic.autoconnect = "FALSE"

          # ========================================================
          # MISC
          # ========================================================

          uuid.action = "create"
      register: vmx_create

    - name: Display VMX status
      ansible.builtin.debug:
        msg:
          - "VMX File: {{ vmx_file }}"
          - "VMX Status: {{ 'Created/Updated' if vmx_create.changed else 'Already current' }}"

    # ============================================================
    # VERIFY VM FILES
    # ============================================================

    - name: Check VMX file after creation
      ansible.builtin.stat:
        path: "{{ vmx_file }}"
      register: final_vmx_stat

    - name: Check virtual disk after creation
      ansible.builtin.stat:
        path: "{{ vm_disk_file }}"
      register: final_disk_stat

    - name: Fail when VMX file was not created
      ansible.builtin.fail:
        msg: "VMX file was not created: {{ vmx_file }}"
      when: not final_vmx_stat.stat.exists

    - name: Fail when virtual disk was not created
      ansible.builtin.fail:
        msg: "Virtual disk was not created: {{ vm_disk_file }}"
      when: not final_disk_stat.stat.exists

    # ============================================================
    # CHECK VM POWER STATE
    # ============================================================

    - name: Get ESXi VM power state
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_list
      changed_when: false

    - name: Display currently running VMware VMs
      ansible.builtin.debug:
        var: vmrun_list.stdout_lines

    # ============================================================
    # START ESXi VM
    # ============================================================

    - name: Start ESXi VM when not already running
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ vmx_file }}"
          - "nogui"
      when: vmx_file not in vmrun_list.stdout
      register: vm_start

    - name: Display VM start result
      ansible.builtin.debug:
        msg: "{{ vm_start.stdout | default('ESXi VM is already running') }}"

    - name: Wait for ESXi VM startup
      ansible.builtin.pause:
        seconds: 10

    # ============================================================
    # VERIFY FINAL POWER STATE
    # ============================================================

    - name: Get final VMware VM list
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "list"
      register: final_vmrun_list
      changed_when: false

    - name: Fail when ESXi VM did not start
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi VM FAILED TO START
          ============================================================

          Expected VMX:
          {{ vmx_file }}

          Running VMs:
          {{ final_vmrun_list.stdout }}

          ============================================================
      when: vmx_file not in final_vmrun_list.stdout

    # ============================================================
    # FINAL SUMMARY
    # ============================================================

    - name: Display final ESXi VM summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM SUCCESSFULLY STARTED"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "VMX File      : {{ vmx_file }}"
          - "Virtual Disk  : {{ vm_disk_file }}"
          - "ESXi ISO      : {{ esxi_iso }}"
          - "VMRUN         : {{ vmrun_path }}"
          - "RAM           : {{ memory_mb }} MB"
          - "CPU           : {{ num_vcpus }} vCPU"
          - "Disk          : {{ disk_size_gb }} GB"
          - "Firmware      : {{ firmware_type | upper }}"
          - "Nested VT     : {{ 'ENABLED' if enable_nested_vt else 'DISABLED' }}"
          - "Power State   : RUNNING"
          - "============================================================"
