---
- name: Automated Nested ESXi 8.0U1 Installation - VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ========================================================================
    # VM
    # ========================================================================

    vm_name: "ESXI-01"

    vm_dir_cygwin: "/cygdrive/d/ESXI/ESXI-01"
    vmx_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmx"
    vmdk_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmdk"
    vmware_log_cygwin: "/cygdrive/d/ESXI/ESXI-01/vmware.log"

    vmx_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmx'
    vmdk_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmdk'

    # ========================================================================
    # ESXi ISO
    # ========================================================================

    esxi_iso_cygwin: "/cygdrive/e/vmware/ESXi-8.0.1-auto.iso"
    esxi_iso_windows: 'E:\vmware\ESXi-8.0.1-auto.iso'

    # ========================================================================
    # HTTP KICKSTART
    # ========================================================================

    ks_url: "http://192.168.253.136/repo/ks.cfg"

    # ========================================================================
    # VMware Workstation
    # ========================================================================

    vmrun_cygwin: "/cygdrive/d/VM workstation/vmrun.exe"
    vmware_cygwin: "/cygdrive/d/VM workstation/vmware.exe"
    vdiskmanager_cygwin: "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"

    vmware_windows: 'D:\VM workstation\vmware.exe'

    # ========================================================================
    # HARDWARE
    # ========================================================================

    vm_memory_mb: 24568
    vm_vcpu: 12
    vm_disk_gb: 2000

    # ========================================================================
    # NETWORK
    # ========================================================================

    vm_network_name: "VMnet0"
    vm_network_adapter: "vmxnet3"

    esxi_ip: "192.168.253.128"
    esxi_netmask: "255.255.255.0"
    esxi_gateway: "192.168.253.2"
    esxi_dns: "192.168.253.1"
    esxi_hostname: "esxi-host-01.vgs.com"

    http_server_ip: "192.168.253.136"

    # ========================================================================
    # TIMING
    # ========================================================================

    startup_wait_seconds: 20
    installation_wait_seconds: 480
    shutdown_wait_seconds: 20
    final_boot_wait_seconds: 30
    https_timeout_seconds: 300

    # ========================================================================
    # VMX VALIDATION STRINGS
    # ========================================================================

    vmx_hw_line: 'virtualHW.version = "19"'
    vmx_firmware_line: 'firmware = "efi"'
    vmx_nested_line: 'vhv.enable = "TRUE"'

    vmx_disk_present_line: 'scsi0:0.present = "TRUE"'
    vmx_disk_file_line: 'scsi0:0.fileName = "D:\ESXI\ESXI-01\ESXI-01.vmdk"'

    vmx_cd_present_line: 'ide1:0.present = "TRUE"'
    vmx_iso_file_line: 'ide1:0.fileName = "E:\vmware\ESXi-8.0.1-auto.iso"'
    vmx_cd_connected_line: 'ide1:0.startConnected = "TRUE"'
    vmx_cd_disconnected_line: 'ide1:0.startConnected = "FALSE"'

    vmx_network_present_line: 'ethernet0.present = "TRUE"'
    vmx_network_type_line: 'ethernet0.connectionType = "custom"'
    vmx_network_name_line: 'ethernet0.vnet = "VMnet0"'
    vmx_network_device_line: 'ethernet0.virtualDev = "vmxnet3"'
    vmx_network_connected_line: 'ethernet0.startConnected = "TRUE"'

    vmx_pci_bridge0_present: 'pciBridge0.present = "TRUE"'
    vmx_pci_bridge4_present: 'pciBridge4.present = "TRUE"'
    vmx_pci_bridge4_type: 'pciBridge4.virtualDev = "pcieRootPort"'
    vmx_pci_bridge4_slot: 'pciBridge4.pciSlotNumber = "21"'

    vmx_pci_bridge5_present: 'pciBridge5.present = "TRUE"'
    vmx_pci_bridge5_type: 'pciBridge5.virtualDev = "pcieRootPort"'
    vmx_pci_bridge5_slot: 'pciBridge5.pciSlotNumber = "22"'

    vmx_pci_bridge6_present: 'pciBridge6.present = "TRUE"'
    vmx_pci_bridge6_type: 'pciBridge6.virtualDev = "pcieRootPort"'
    vmx_pci_bridge6_slot: 'pciBridge6.pciSlotNumber = "23"'

    vmx_pci_bridge7_present: 'pciBridge7.present = "TRUE"'
    vmx_pci_bridge7_type: 'pciBridge7.virtualDev = "pcieRootPort"'
    vmx_pci_bridge7_slot: 'pciBridge7.pciSlotNumber = "24"'

    vmx_scsi_slot: 'scsi0.pciSlotNumber = "16"'
    vmx_ethernet_slot: 'ethernet0.pciSlotNumber = "192"'

    vmx_hdd_order_line: 'efi.hddOrder = "scsi0:0"'

    # ========================================================================
    # UEFI BOOT.CFG EXPECTED CONTENT
    # ========================================================================

    expected_kernelopt: 'kernelopt=runweasel cdromBoot ip=192.168.253.128 netmask=255.255.255.0 gateway=192.168.253.2 nameserver=192.168.253.1 netdevice=vmnic0 ks=http://192.168.253.136/repo/ks.cfg'

  tasks:

    # ========================================================================
    # DISPLAY
    # ========================================================================

    - name: Display configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AUTOMATED NESTED ESXi 8.0U1 INSTALLATION"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - 'VMX           : D:\ESXI\ESXI-01\ESXI-01.vmx'
          - 'VMDK          : D:\ESXI\ESXI-01\ESXI-01.vmdk'
          - 'ISO           : E:\vmware\ESXi-8.0.1-auto.iso'
          - "KS URL        : {{ ks_url }}"
          - "RAM           : {{ vm_memory_mb }} MB"
          - "CPU           : {{ vm_vcpu }} vCPU"
          - "Disk          : {{ vm_disk_gb }} GB"
          - "Firmware      : EFI"
          - "Nested VT     : ENABLED"
          - "Network       : {{ vm_network_name }}"
          - "Adapter       : {{ vm_network_adapter }}"
          - "ESXi IP       : {{ esxi_ip }}"
          - "Netmask       : {{ esxi_netmask }}"
          - "Gateway       : {{ esxi_gateway }}"
          - "DNS           : {{ esxi_dns }}"
          - "Hostname      : {{ esxi_hostname }}"
          - "HTTP Server   : {{ http_server_ip }}"
          - "============================================================"

    # ========================================================================
    # CHECK ISO
    # ========================================================================

    - name: Check customized ESXi ISO
      ansible.builtin.stat:
        path: "{{ esxi_iso_cygwin }}"
      register: iso_stat

    - name: Fail if ESXi ISO is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi CUSTOMIZED ISO NOT FOUND
          ============================================================

          {{ esxi_iso_windows }}

          ============================================================
      when: not iso_stat.stat.exists

    # ========================================================================
    # CHECK VMWARE UTILITIES
    # ========================================================================

    - name: Check vmrun.exe
      ansible.builtin.stat:
        path: "{{ vmrun_cygwin }}"
      register: vmrun_stat

    - name: Fail if vmrun.exe is missing
      ansible.builtin.fail:
        msg: |
          vmrun.exe not found:

          {{ vmrun_cygwin }}
      when: not vmrun_stat.stat.exists

    - name: Check VMware Workstation executable
      ansible.builtin.stat:
        path: "{{ vmware_cygwin }}"
      register: vmware_stat

    - name: Fail if VMware Workstation is missing
      ansible.builtin.fail:
        msg: |
          VMware Workstation not found:

          {{ vmware_cygwin }}
      when: not vmware_stat.stat.exists

    - name: Check vmware-vdiskmanager.exe
      ansible.builtin.stat:
        path: "{{ vdiskmanager_cygwin }}"
      register: vdiskmanager_stat

    - name: Fail if vmware-vdiskmanager.exe is missing
      ansible.builtin.fail:
        msg: |
          vmware-vdiskmanager.exe not found:

          {{ vdiskmanager_cygwin }}
      when: not vdiskmanager_stat.stat.exists

    # ========================================================================
    # CHECK HTTP KICKSTART
    # ========================================================================

    - name: Download HTTP KS.CFG
      ansible.builtin.command:
        argv:
          - curl
          - -fsS
          - "{{ ks_url }}"
      register: ks_http_result
      changed_when: false
      failed_when: false

    - name: Fail if HTTP KS.CFG is unavailable
      ansible.builtin.fail:
        msg: |
          ============================================================
          HTTP KS.CFG NOT AVAILABLE
          ============================================================

          URL:
          {{ ks_url }}

          Return code:
          {{ ks_http_result.rc }}

          STDOUT:
          {{ ks_http_result.stdout }}

          STDERR:
          {{ ks_http_result.stderr }}

          ============================================================
      when: ks_http_result.rc != 0

    - name: Calculate HTTP KS validation flags
      ansible.builtin.set_fact:
        ks_vmaccepteula_ok: "{{ 'vmaccepteula' in ks_http_result.stdout }}"
        ks_rootpw_ok: "{{ 'rootpw ' in ks_http_result.stdout }}"
        ks_network_ok: "{{ 'network --bootproto=static' in ks_http_result.stdout }}"
        ks_ip_ok: "{{ '192.168.253.128' in ks_http_result.stdout }}"
        ks_netmask_ok: "{{ '255.255.255.0' in ks_http_result.stdout }}"
        ks_gateway_ok: "{{ '192.168.253.2' in ks_http_result.stdout }}"
        ks_dns_ok: "{{ '192.168.253.1' in ks_http_result.stdout }}"
        ks_hostname_ok: "{{ 'esxi-host-01.vgs.com' in ks_http_result.stdout }}"
        ks_vmnic_ok: "{{ 'vmnic0' in ks_http_result.stdout }}"
        ks_install_ok: "{{ 'install --firstdisk --overwritevmfs' in ks_http_result.stdout }}"
        ks_reboot_ok: "{{ 'reboot' in ks_http_result.stdout }}"
        ks_firstboot_ok: "{{ '%firstboot' in ks_http_result.stdout }}"

    - name: Assert HTTP KS.CFG
      ansible.builtin.assert:
        that:
          - ks_vmaccepteula_ok | bool
          - ks_rootpw_ok | bool
          - ks_network_ok | bool
          - ks_ip_ok | bool
          - ks_netmask_ok | bool
          - ks_gateway_ok | bool
          - ks_dns_ok | bool
          - ks_hostname_ok | bool
          - ks_vmnic_ok | bool
          - ks_install_ok | bool
          - ks_reboot_ok | bool
          - ks_firstboot_ok | bool
        fail_msg: |
          ============================================================
          HTTP KS.CFG VALIDATION FAILED
          ============================================================

          vmaccepteula : {{ ks_vmaccepteula_ok }}
          rootpw       : {{ ks_rootpw_ok }}
          network      : {{ ks_network_ok }}
          IP            : {{ ks_ip_ok }}
          netmask       : {{ ks_netmask_ok }}
          gateway       : {{ ks_gateway_ok }}
          DNS           : {{ ks_dns_ok }}
          hostname     : {{ ks_hostname_ok }}
          vmnic0        : {{ ks_vmnic_ok }}
          install       : {{ ks_install_ok }}
          reboot        : {{ ks_reboot_ok }}
          firstboot     : {{ ks_firstboot_ok }}

          ============================================================
        success_msg: "HTTP KS.CFG validated successfully."

    # ========================================================================
    # VERIFY THE ACTUAL UEFI BOOT.CFG INSIDE THE ISO
    # ========================================================================

    - name: Extract UEFI BOOT.CFG from ISO
      ansible.builtin.command:
        argv:
          - 7z
          - e
          - -so
          - "{{ esxi_iso_cygwin }}"
          - "EFI/BOOT/BOOT.CFG"
      register: uefi_boot_cfg
      changed_when: false
      failed_when: uefi_boot_cfg.rc != 0

    - name: Extract UEFI kernelopt
      ansible.builtin.shell: |
        printf '%s\n' '{{ uefi_boot_cfg.stdout }}' |
        grep '^kernelopt='
      args:
        executable: /bin/bash
      register: uefi_kernelopt
      changed_when: false
      failed_when: false

    - name: Validate UEFI kernelopt
      ansible.builtin.assert:
        that:
          - "(uefi_kernelopt.stdout | trim) == expected_kernelopt"
        fail_msg: |
          ============================================================
          UEFI BOOT.CFG IS NOT AUTOMATED
          ============================================================

          Expected:

          {{ expected_kernelopt }}

          Found:

          {{ uefi_kernelopt.stdout }}

          The ISO must contain the kickstart URL in:

          EFI/BOOT/BOOT.CFG

          ============================================================
        success_msg: "UEFI BOOT.CFG contains the correct unattended kernelopt."

    # ========================================================================
    # CREATE VM DIRECTORY
    # ========================================================================

    - name: Create ESXi VM directory
      ansible.builtin.file:
        path: "{{ vm_dir_cygwin }}"
        state: directory
        mode: "0755"

    # ========================================================================
    # CHECK CURRENT VM STATE
    # ========================================================================

    - name: Get running VMware VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_before
      changed_when: false
      failed_when: false

    - name: Determine current ESXI-01 state
      ansible.builtin.set_fact:
        esxi_running_before: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_before.stdout | default('') | lower)
          }}

    - name: Display current VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "CURRENT VM STATE"
          - "============================================================"
          - "Running : {{ esxi_running_before }}"
          - "============================================================"

    # ========================================================================
    # STOP EXISTING VM
    # ========================================================================

    - name: Stop existing ESXI-01
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      register: existing_stop
      changed_when: existing_stop.rc == 0
      failed_when: false
      when: esxi_running_before

    - name: Wait for existing VM shutdown
      ansible.builtin.pause:
        seconds: "{{ shutdown_wait_seconds }}"
      when: esxi_running_before

    - name: Verify ESXI-01 stopped
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_after_stop
      changed_when: false
      failed_when: false

    - name: Determine ESXI-01 post-stop state
      ansible.builtin.set_fact:
        esxi_running_after_stop: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_after_stop.stdout | default('') | lower)
          }}

    - name: Fail if ESXI-01 remains running
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXI-01 IS STILL RUNNING
          ============================================================

          {{ vmrun_after_stop.stdout }}

          ============================================================
      when:
        - esxi_running_before
        - esxi_running_after_stop

    # ========================================================================
    # REMOVE STALE LOCKS
    #
    # VMDK IS NOT DELETED.
    # ========================================================================

    - name: Remove stale VMware lock directories
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 2 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Remove stale VMware runtime files
      ansible.builtin.shell: |
        rm -f "{{ vm_dir_cygwin }}"/*.vmem 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmss 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmsn 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.scoreboard 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmpl 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # VMDK
    # ========================================================================

    - name: Check existing VMDK
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_stat

    - name: Display VMDK state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMDK STATE"
          - "============================================================"
          - 'Windows path : D:\ESXI\ESXI-01\ESXI-01.vmdk'
          - "Exists       : {{ vmdk_stat.stat.exists }}"
          - "============================================================"

    - name: Create 2TB VMDK if missing
      ansible.builtin.command:
        argv:
          - "{{ vdiskmanager_cygwin }}"
          - "-c"
          - "-s"
          - "{{ vm_disk_gb }}GB"
          - "-a"
          - "lsilogic"
          - "-t"
          - "0"
          - "{{ vmdk_file_windows }}"
      register: vmdk_create
      changed_when: vmdk_create.rc == 0
      failed_when: vmdk_create.rc != 0
      when: not vmdk_stat.stat.exists

    - name: Verify VMDK exists
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_after

    - name: Fail if VMDK is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMDK NOT FOUND
          ============================================================

          Windows:

          {{ vmdk_file_windows }}

          Cygwin:

          {{ vmdk_file_cygwin }}

          ============================================================
      when: not vmdk_after.stat.exists

    # ========================================================================
    # BACKUP EXISTING VMX
    # ========================================================================

    - name: Check existing VMX
      ansible.builtin.stat:
        path: "{{ vmx_file_cygwin }}"
      register: existing_vmx

    - name: Backup existing VMX
      ansible.builtin.copy:
        src: "{{ vmx_file_cygwin }}"
        dest: "{{ vmx_file_cygwin }}.ansible-backup"
        remote_src: true
        mode: "0644"
      when: existing_vmx.stat.exists

    # ========================================================================
    # CREATE INSTALLATION VMX
    #
    # This matches the VMX that successfully booted your ESXi installer.
    #
    # IMPORTANT:
    # No efi.bootOrder line.
    # ========================================================================

    - name: Create installation VMX
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "UTF-8"

          config.version = "8"
          virtualHW.version = "19"

          displayName = "ESXI-01"
          guestOS = "vmkernel7"

          memsize = "24568"
          numvcpus = "12"
          cpuid.coresPerSocket = "1"

          # ==========================================================
          # EFI
          # ==========================================================

          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"

          # ==========================================================
          # NESTED ESXi
          # ==========================================================

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # ==========================================================
          # PCI TOPOLOGY - MATCH CURRENT WORKING VMX
          # ==========================================================

          pciBridge0.present = "TRUE"
          pciBridge0.pciSlotNumber = "17"

          pciBridge4.present = "TRUE"
          pciBridge4.virtualDev = "pcieRootPort"
          pciBridge4.functions = "8"
          pciBridge4.pciSlotNumber = "21"

          pciBridge5.present = "TRUE"
          pciBridge5.virtualDev = "pcieRootPort"
          pciBridge5.functions = "8"
          pciBridge5.pciSlotNumber = "22"

          pciBridge6.present = "TRUE"
          pciBridge6.virtualDev = "pcieRootPort"
          pciBridge6.functions = "8"
          pciBridge6.pciSlotNumber = "23"

          pciBridge7.present = "TRUE"
          pciBridge7.virtualDev = "pcieRootPort"
          pciBridge7.functions = "8"
          pciBridge7.pciSlotNumber = "24"

          # ==========================================================
          # SCSI
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"
          scsi0.pciSlotNumber = "16"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "D:\ESXI\ESXI-01\ESXI-01.vmdk"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ==========================================================
          # INSTALLATION ISO
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "E:\vmware\ESXi-8.0.1-auto.iso"
          ide1:0.startConnected = "TRUE"

          # ==========================================================
          # NETWORK
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "VMnet0"
          ethernet0.virtualDev = "vmxnet3"
          ethernet0.addressType = "generated"
          ethernet0.startConnected = "TRUE"
          ethernet0.pciSlotNumber = "192"

          # ==========================================================
          # DEVICES
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"
          ehci.present = "FALSE"

          sound.present = "FALSE"
          floppy0.present = "FALSE"
          serial0.present = "FALSE"
          parallel0.present = "FALSE"
          printer0.present = "FALSE"

          svga.present = "TRUE"
          svga.autodetect = "TRUE"

          # ==========================================================
          # EFI HDD ORDER
          #
          # Do NOT use efi.bootOrder here.
          # ==========================================================

          efi.hddOrder = "scsi0:0"

          # ==========================================================
          # POWER
          # ==========================================================

          powerType.powerOff = "soft"
          powerType.powerOn = "soft"
          powerType.suspend = "soft"
          powerType.reset = "soft"

          tools.upgrade.policy = "manual"
          tools.syncTime = "FALSE"

    # ========================================================================
    # READ INSTALLATION VMX
    # ========================================================================

    - name: Read installation VMX
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: installation_vmx_slurp

    - name: Decode installation VMX
      ansible.builtin.set_fact:
        installation_vmx_text: "{{ installation_vmx_slurp.content | b64decode }}"

    # ========================================================================
    # INSTALLATION VMX VALIDATION
    # ========================================================================

    - name: Calculate installation VMX validation flags
      ansible.builtin.set_fact:
        install_hw_ok: "{{ vmx_hw_line in installation_vmx_text }}"
        install_firmware_ok: "{{ vmx_firmware_line in installation_vmx_text }}"
        install_nested_ok: "{{ vmx_nested_line in installation_vmx_text }}"
        install_disk_ok: "{{ vmx_disk_present_line in installation_vmx_text }}"
        install_disk_path_ok: "{{ vmx_disk_file_line in installation_vmx_text }}"
        install_cd_ok: "{{ vmx_cd_present_line in installation_vmx_text }}"
        install_iso_ok: "{{ vmx_iso_file_line in installation_vmx_text }}"
        install_cd_connected_ok: "{{ vmx_cd_connected_line in installation_vmx_text }}"
        install_network_present_ok: "{{ vmx_network_present_line in installation_vmx_text }}"
        install_network_type_ok: "{{ vmx_network_type_line in installation_vmx_text }}"
        install_network_name_ok: "{{ vmx_network_name_line in installation_vmx_text }}"
        install_network_device_ok: "{{ vmx_network_device_line in installation_vmx_text }}"
        install_network_connected_ok: "{{ vmx_network_connected_line in installation_vmx_text }}"
        install_pci0_ok: "{{ vmx_pci_bridge0_present in installation_vmx_text }}"
        install_pci4_ok: "{{ vmx_pci_bridge4_present in installation_vmx_text }}"
        install_pci4_type_ok: "{{ vmx_pci_bridge4_type in installation_vmx_text }}"
        install_pci4_slot_ok: "{{ vmx_pci_bridge4_slot in installation_vmx_text }}"
        install_pci5_ok: "{{ vmx_pci_bridge5_present in installation_vmx_text }}"
        install_pci5_type_ok: "{{ vmx_pci_bridge5_type in installation_vmx_text }}"
        install_pci5_slot_ok: "{{ vmx_pci_bridge5_slot in installation_vmx_text }}"
        install_pci6_ok: "{{ vmx_pci_bridge6_present in installation_vmx_text }}"
        install_pci6_type_ok: "{{ vmx_pci_bridge6_type in installation_vmx_text }}"
        install_pci6_slot_ok: "{{ vmx_pci_bridge6_slot in installation_vmx_text }}"
        install_pci7_ok: "{{ vmx_pci_bridge7_present in installation_vmx_text }}"
        install_pci7_type_ok: "{{ vmx_pci_bridge7_type in installation_vmx_text }}"
        install_pci7_slot_ok: "{{ vmx_pci_bridge7_slot in installation_vmx_text }}"
        install_scsi_slot_ok: "{{ vmx_scsi_slot in installation_vmx_text }}"
        install_ethernet_slot_ok: "{{ vmx_ethernet_slot in installation_vmx_text }}"

    - name: Assert installation VMX
      ansible.builtin.assert:
        that:
          - install_hw_ok | bool
          - install_firmware_ok | bool
          - install_nested_ok | bool
          - install_disk_ok | bool
          - install_disk_path_ok | bool
          - install_cd_ok | bool
          - install_iso_ok | bool
          - install_cd_connected_ok | bool
          - install_network_present_ok | bool
          - install_network_type_ok | bool
          - install_network_name_ok | bool
          - install_network_device_ok | bool
          - install_network_connected_ok | bool
          - install_pci0_ok | bool
          - install_pci4_ok | bool
          - install_pci4_type_ok | bool
          - install_pci4_slot_ok | bool
          - install_pci5_ok | bool
          - install_pci5_type_ok | bool
          - install_pci5_slot_ok | bool
          - install_pci6_ok | bool
          - install_pci6_type_ok | bool
          - install_pci6_slot_ok | bool
          - install_pci7_ok | bool
          - install_pci7_type_ok | bool
          - install_pci7_slot_ok | bool
          - install_scsi_slot_ok | bool
          - install_ethernet_slot_ok | bool
        fail_msg: |
          ============================================================
          INSTALLATION VMX VALIDATION FAILED
          ============================================================

          Hardware          : {{ install_hw_ok }}
          Firmware          : {{ install_firmware_ok }}
          Nested VT         : {{ install_nested_ok }}
          Disk              : {{ install_disk_ok }}
          Disk Path         : {{ install_disk_path_ok }}
          CD                : {{ install_cd_ok }}
          ISO Path          : {{ install_iso_ok }}
          CD Connected      : {{ install_cd_connected_ok }}
          Network Present   : {{ install_network_present_ok }}
          Network Type      : {{ install_network_type_ok }}
          VMnet             : {{ install_network_name_ok }}
          Adapter           : {{ install_network_device_ok }}
          Network Connected : {{ install_network_connected_ok }}

          PCI Bridge 0      : {{ install_pci0_ok }}
          PCI Bridge 4      : {{ install_pci4_ok }}
          PCI Bridge 4 Type : {{ install_pci4_type_ok }}
          PCI Bridge 4 Slot : {{ install_pci4_slot_ok }}
          PCI Bridge 5      : {{ install_pci5_ok }}
          PCI Bridge 5 Type : {{ install_pci5_type_ok }}
          PCI Bridge 5 Slot : {{ install_pci5_slot_ok }}
          PCI Bridge 6      : {{ install_pci6_ok }}
          PCI Bridge 6 Type : {{ install_pci6_type_ok }}
          PCI Bridge 6 Slot : {{ install_pci6_slot_ok }}
          PCI Bridge 7      : {{ install_pci7_ok }}
          PCI Bridge 7 Type : {{ install_pci7_type_ok }}
          PCI Bridge 7 Slot : {{ install_pci7_slot_ok }}

          SCSI Slot         : {{ install_scsi_slot_ok }}
          Ethernet Slot     : {{ install_ethernet_slot_ok }}

          ============================================================
        success_msg: "Installation VMX validated successfully."

    # ========================================================================
    # REMOVE OLD VMX GENERATED RUNTIME ARTIFACTS
    # ========================================================================

    - name: Remove stale VMX lock directories
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 2 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # START INSTALLATION VM
    #
    # Start through VMware Workstation.
    # Do not use vmrun start nogui.
    # ========================================================================

    - name: Launch VMware Workstation with ESXi installer VM
      ansible.builtin.command:
        argv:
          - powershell.exe
          - "-NoProfile"
          - "-NonInteractive"
          - "-Command"
          - >-
            $vmx = "{{ vmx_file_windows }}";
            $proc = Start-Process
            -FilePath "{{ vmware_windows }}"
            -ArgumentList @("-x", $vmx)
            -PassThru;
            Write-Output ("VMware Workstation PID: " + $proc.Id)
      register: workstation_install_start
      changed_when: true
      failed_when: false

    - name: Display Workstation start result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ESXi INSTALLATION START"
          - "============================================================"
          - "Return Code : {{ workstation_install_start.rc }}"
          - "STDOUT      : {{ workstation_install_start.stdout }}"
          - "STDERR      : {{ workstation_install_start.stderr }}"
          - "============================================================"

    - name: Wait for VMware Workstation startup
      ansible.builtin.pause:
        seconds: "{{ startup_wait_seconds }}"

    # ========================================================================
    # VERIFY VM IS RUNNING
    # ========================================================================

    - name: Check running VMware VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: installation_vm_list
      changed_when: false
      failed_when: false

    - name: Determine installation VM running state
      ansible.builtin.set_fact:
        installation_vm_running: >-
          {{
            vmx_file_windows | lower
            in
            (installation_vm_list.stdout | default('') | lower)
          }}

    - name: Display installation VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "INSTALLATION VM STATE"
          - "============================================================"
          - "Running : {{ installation_vm_running }}"
          - "============================================================"

    - name: Fail if installation VM did not start
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi INSTALLATION VM DID NOT START
          ============================================================

          vmrun list:

          {{ installation_vm_list.stdout }}

          VMware log:

          {{ vmware_log_cygwin }}

          ============================================================
      when: not installation_vm_running

    # ========================================================================
    # WAIT FOR UNATTENDED INSTALLATION
    #
    # The ESXi installer gets the KS from EFI/BOOT/BOOT.CFG.
    # ========================================================================

    - name: Wait for unattended ESXi installation
      ansible.builtin.pause:
        seconds: "{{ installation_wait_seconds }}"

    # ========================================================================
    # COLLECT LOG
    # ========================================================================

    - name: Check VMware log
      ansible.builtin.stat:
        path: "{{ vmware_log_cygwin }}"
      register: installation_log_stat

    - name: Read VMware log after installation wait
      ansible.builtin.shell: |
        tail -250 "{{ vmware_log_cygwin }}"
      args:
        executable: /bin/bash
      register: installation_log
      changed_when: false
      failed_when: false
      when: installation_log_stat.stat.exists

    # ========================================================================
    # STOP INSTALLATION VM
    # ========================================================================

    - name: Stop installation VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      register: installation_stop
      changed_when: installation_stop.rc == 0
      failed_when: false

    - name: Display installation stop result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "INSTALLATION VM STOP"
          - "============================================================"
          - "Return Code : {{ installation_stop.rc }}"
          - "STDOUT      : {{ installation_stop.stdout }}"
          - "STDERR      : {{ installation_stop.stderr }}"
          - "============================================================"

    - name: Wait for installation shutdown
      ansible.builtin.pause:
        seconds: "{{ shutdown_wait_seconds }}"

    # ========================================================================
    # VERIFY VM IS STOPPED
    # ========================================================================

    - name: Check VMware VMs after installation
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: post_install_vmrun
      changed_when: false
      failed_when: false

    - name: Determine installation VM stopped state
      ansible.builtin.set_fact:
        installation_vm_stopped: >-
          {{
            vmx_file_windows | lower
            not in
            (post_install_vmrun.stdout | default('') | lower)
          }}

    - name: Fail if installation VM is still running
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXI-01 IS STILL RUNNING
          ============================================================

          {{ post_install_vmrun.stdout }}

          ============================================================
      when: not installation_vm_stopped

    # ========================================================================
    # REMOVE LOCKS / RUNTIME STATE
    # ========================================================================

    - name: Remove post-install VMware lock directories
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 2 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Remove post-install runtime state
      ansible.builtin.shell: |
        rm -f "{{ vm_dir_cygwin }}"/*.vmem 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmss 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmsn 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.scoreboard 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmpl 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # BACKUP INSTALLATION VMX
    # ========================================================================

    - name: Backup installation VMX
      ansible.builtin.copy:
        src: "{{ vmx_file_cygwin }}"
        dest: "{{ vmx_file_cygwin }}.installation-backup"
        remote_src: true
        mode: "0644"

    # ========================================================================
    # FINAL VMX
    #
    # After installation:
    #   - ISO disconnected
    #   - HDD first by EFI default/entry
    #   - VMXNET3 preserved
    #   - PCI topology preserved
    # ========================================================================

    - name: Create final installed ESXi VMX
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "UTF-8"

          config.version = "8"
          virtualHW.version = "19"

          displayName = "ESXI-01"
          guestOS = "vmkernel7"

          memsize = "24568"
          numvcpus = "12"
          cpuid.coresPerSocket = "1"

          # ==========================================================
          # EFI
          # ==========================================================

          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"

          # ==========================================================
          # NESTED ESXi
          # ==========================================================

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # ==========================================================
          # PCI TOPOLOGY
          # ==========================================================

          pciBridge0.present = "TRUE"
          pciBridge0.pciSlotNumber = "17"

          pciBridge4.present = "TRUE"
          pciBridge4.virtualDev = "pcieRootPort"
          pciBridge4.functions = "8"
          pciBridge4.pciSlotNumber = "21"

          pciBridge5.present = "TRUE"
          pciBridge5.virtualDev = "pcieRootPort"
          pciBridge5.functions = "8"
          pciBridge5.pciSlotNumber = "22"

          pciBridge6.present = "TRUE"
          pciBridge6.virtualDev = "pcieRootPort"
          pciBridge6.functions = "8"
          pciBridge6.pciSlotNumber = "23"

          pciBridge7.present = "TRUE"
          pciBridge7.virtualDev = "pcieRootPort"
          pciBridge7.functions = "8"
          pciBridge7.pciSlotNumber = "24"

          # ==========================================================
          # SCSI
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"
          scsi0.pciSlotNumber = "16"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "D:\ESXI\ESXI-01\ESXI-01.vmdk"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ==========================================================
          # CD/DVD DISCONNECTED
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "E:\vmware\ESXi-8.0.1-auto.iso"
          ide1:0.startConnected = "FALSE"

          # ==========================================================
          # NETWORK
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "VMnet0"
          ethernet0.virtualDev = "vmxnet3"
          ethernet0.addressType = "generated"
          ethernet0.startConnected = "TRUE"
          ethernet0.pciSlotNumber = "192"

          # ==========================================================
          # DEVICES
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"
          ehci.present = "FALSE"

          sound.present = "FALSE"
          floppy0.present = "FALSE"
          serial0.present = "FALSE"
          parallel0.present = "FALSE"
          printer0.present = "FALSE"

          svga.present = "TRUE"
          svga.autodetect = "TRUE"

          # ==========================================================
          # HDD ORDER
          # ==========================================================

          efi.hddOrder = "scsi0:0"

          # ==========================================================
          # POWER
          # ==========================================================

          powerType.powerOff = "soft"
          powerType.powerOn = "soft"
          powerType.suspend = "soft"
          powerType.reset = "soft"

          tools.upgrade.policy = "manual"
          tools.syncTime = "FALSE"

    # ========================================================================
    # READ FINAL VMX
    # ========================================================================

    - name: Read final VMX
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: final_vmx_slurp

    - name: Decode final VMX
      ansible.builtin.set_fact:
        final_vmx_text: "{{ final_vmx_slurp.content | b64decode }}"

    # ========================================================================
    # FINAL VMX VALIDATION
    # ========================================================================

    - name: Calculate final VMX validation flags
      ansible.builtin.set_fact:
        final_hw_ok: "{{ vmx_hw_line in final_vmx_text }}"
        final_firmware_ok: "{{ vmx_firmware_line in final_vmx_text }}"
        final_nested_ok: "{{ vmx_nested_line in final_vmx_text }}"
        final_disk_ok: "{{ vmx_disk_present_line in final_vmx_text }}"
        final_disk_path_ok: "{{ vmx_disk_file_line in final_vmx_text }}"
        final_cd_ok: "{{ vmx_cd_present_line in final_vmx_text }}"
        final_iso_ok: "{{ vmx_iso_file_line in final_vmx_text }}"
        final_cd_disconnected_ok: "{{ vmx_cd_disconnected_line in final_vmx_text }}"
        final_network_present_ok: "{{ vmx_network_present_line in final_vmx_text }}"
        final_network_type_ok: "{{ vmx_network_type_line in final_vmx_text }}"
        final_network_name_ok: "{{ vmx_network_name_line in final_vmx_text }}"
        final_network_device_ok: "{{ vmx_network_device_line in final_vmx_text }}"
        final_network_connected_ok: "{{ vmx_network_connected_line in final_vmx_text }}"
        final_pci0_ok: "{{ vmx_pci_bridge0_present in final_vmx_text }}"
        final_pci4_ok: "{{ vmx_pci_bridge4_present in final_vmx_text }}"
        final_pci4_type_ok: "{{ vmx_pci_bridge4_type in final_vmx_text }}"
        final_pci4_slot_ok: "{{ vmx_pci_bridge4_slot in final_vmx_text }}"
        final_pci5_ok: "{{ vmx_pci_bridge5_present in final_vmx_text }}"
        final_pci5_type_ok: "{{ vmx_pci_bridge5_type in final_vmx_text }}"
        final_pci5_slot_ok: "{{ vmx_pci_bridge5_slot in final_vmx_text }}"
        final_pci6_ok: "{{ vmx_pci_bridge6_present in final_vmx_text }}"
        final_pci6_type_ok: "{{ vmx_pci_bridge6_type in final_vmx_text }}"
        final_pci6_slot_ok: "{{ vmx_pci_bridge6_slot in final_vmx_text }}"
        final_pci7_ok: "{{ vmx_pci_bridge7_present in final_vmx_text }}"
        final_pci7_type_ok: "{{ vmx_pci_bridge7_type in final_vmx_text }}"
        final_pci7_slot_ok: "{{ vmx_pci_bridge7_slot in final_vmx_text }}"
        final_scsi_slot_ok: "{{ vmx_scsi_slot in final_vmx_text }}"
        final_ethernet_slot_ok: "{{ vmx_ethernet_slot in final_vmx_text }}"

    - name: Assert final VMX
      ansible.builtin.assert:
        that:
          - final_hw_ok | bool
          - final_firmware_ok | bool
          - final_nested_ok | bool
          - final_disk_ok | bool
          - final_disk_path_ok | bool
          - final_cd_ok | bool
          - final_iso_ok | bool
          - final_cd_disconnected_ok | bool
          - final_network_present_ok | bool
          - final_network_type_ok | bool
          - final_network_name_ok | bool
          - final_network_device_ok | bool
          - final_network_connected_ok | bool
          - final_pci0_ok | bool
          - final_pci4_ok | bool
          - final_pci4_type_ok | bool
          - final_pci4_slot_ok | bool
          - final_pci5_ok | bool
          - final_pci5_type_ok | bool
          - final_pci5_slot_ok | bool
          - final_pci6_ok | bool
          - final_pci6_type_ok | bool
          - final_pci6_slot_ok | bool
          - final_pci7_ok | bool
          - final_pci7_type_ok | bool
          - final_pci7_slot_ok | bool
          - final_scsi_slot_ok | bool
          - final_ethernet_slot_ok | bool
          - "'efi.bootOrder' not in final_vmx_text"
        fail_msg: |
          ============================================================
          FINAL VMX VALIDATION FAILED
          ============================================================

          Hardware        : {{ final_hw_ok }}
          Firmware        : {{ final_firmware_ok }}
          Nested VT       : {{ final_nested_ok }}
          Disk            : {{ final_disk_ok }}
          Disk Path       : {{ final_disk_path_ok }}
          CD              : {{ final_cd_ok }}
          ISO Path        : {{ final_iso_ok }}
          CD Disconnected : {{ final_cd_disconnected_ok }}
          Network Present : {{ final_network_present_ok }}
          Network Type    : {{ final_network_type_ok }}
          VMnet           : {{ final_network_name_ok }}
          Adapter         : {{ final_network_device_ok }}
          Network Online  : {{ final_network_connected_ok }}

          ============================================================
        success_msg: "Final VMX validated successfully."

    # ========================================================================
    # FINAL POWER ON
    # ========================================================================

    - name: Launch final ESXi VM through VMware Workstation
      ansible.builtin.command:
        argv:
          - powershell.exe
          - "-NoProfile"
          - "-NonInteractive"
          - "-Command"
          - >-
            $vmx = "{{ vmx_file_windows }}";
            $proc = Start-Process
            -FilePath "{{ vmware_windows }}"
            -ArgumentList @("-x", $vmx)
            -PassThru;
            Write-Output ("VMware Workstation PID: " + $proc.Id)
      register: final_workstation_start
      changed_when: true
      failed_when: false

    - name: Display final Workstation start
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi POWER ON"
          - "============================================================"
          - "Return Code : {{ final_workstation_start.rc }}"
          - "STDOUT      : {{ final_workstation_start.stdout }}"
          - "STDERR      : {{ final_workstation_start.stderr }}"
          - "============================================================"

    - name: Wait for final ESXi boot
      ansible.builtin.pause:
        seconds: "{{ final_boot_wait_seconds }}"

    # ========================================================================
    # FINAL STATE
    # ========================================================================

    - name: Get final VMware VM list
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: final_vm_list
      changed_when: false
      failed_when: false

    - name: Determine final VM running state
      ansible.builtin.set_fact:
        final_vm_running: >-
          {{
            vmx_file_windows | lower
            in
            (final_vm_list.stdout | default('') | lower)
          }}

    - name: Display final VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi VM STATE"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "Running       : {{ final_vm_running }}"
          - "Boot          : HDD"
          - "ISO Connected : FALSE"
          - "Network       : VMnet0"
          - "Adapter       : vmxnet3"
          - "IP            : {{ esxi_ip }}"
          - 'VMX           : D:\ESXI\ESXI-01\ESXI-01.vmx'
          - 'VMDK          : D:\ESXI\ESXI-01\ESXI-01.vmdk'
          - 'ISO           : E:\vmware\ESXi-8.0.1-auto.iso'
          - "============================================================"

    - name: Fail if final ESXi VM is not running
      ansible.builtin.fail:
        msg: |
          ============================================================
          FINAL ESXi VM IS NOT RUNNING
          ============================================================

          vmrun list:

          {{ final_vm_list.stdout }}

          VMware log:

          {{ vmware_log_cygwin }}

          ============================================================
      when: not final_vm_running

    # ========================================================================
    # WAIT FOR ESXi HTTPS
    # ========================================================================

    - name: Wait for ESXi HTTPS management interface
      ansible.builtin.wait_for:
        host: "{{ esxi_ip }}"
        port: 443
        state: started
        timeout: "{{ https_timeout_seconds }}"
        msg: |
          ESXi HTTPS management interface did not become available:

          https://{{ esxi_ip }}

    # ========================================================================
    # PING
    # ========================================================================

    - name: Ping ESXi management IP
      ansible.builtin.command:
        argv:
          - ping
          - "-n"
          - "2"
          - "{{ esxi_ip }}"
      register: esxi_ping
      changed_when: false
      failed_when: false

    # ========================================================================
    # SUCCESS
    # ========================================================================

    - name: Display successful ESXi installation
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS - ESXi INSTALLATION COMPLETE"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - 'VMX           : D:\ESXI\ESXI-01\ESXI-01.vmx'
          - 'VMDK          : D:\ESXI\ESXI-01\ESXI-01.vmdk'
          - 'ISO           : E:\vmware\ESXi-8.0.1-auto.iso'
          - "Running       : {{ final_vm_running }}"
          - "Firmware      : EFI"
          - "Nested VT     : ENABLED"
          - "Boot          : HDD"
          - "ISO Connected : FALSE"
          - "Network       : VMnet0"
          - "Adapter       : vmxnet3"
          - "IP            : {{ esxi_ip }}"
          - "Netmask       : {{ esxi_netmask }}"
          - "Gateway       : {{ esxi_gateway }}"
          - "DNS           : {{ esxi_dns }}"
          - "Hostname      : {{ esxi_hostname }}"
          - "ESXi URL      : https://{{ esxi_ip }}"
          - "============================================================"
