---
- name: Create and Start Nested ESXi VM in VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ============================================================
    # ESXi VM SETTINGS
    # ============================================================

    vm_name: "ESXI-01"

    # ============================================================
    # CHANGE THIS TO YOUR EXACT ESXi ISO FILE
    # D: DRIVE
    #
    # Example:
    # D:\VMware-VMvisor-Installer-8.0U3-xxxx.x86_64.iso
    # ============================================================

    esxi_iso: "/cygdrive/d/VMware-VMvisor-Installer-8.0.iso"

    # ============================================================
    # ESXi VM DIRECTORY
    # E:\ESXI
    # ============================================================

    vm_path: "/cygdrive/e/ESXI"

    vmx_file: "/cygdrive/e/ESXI/ESXI-01.vmx"
    vmdk_file: "/cygdrive/e/ESXI/ESXI-01.vmdk"

    # ============================================================
    # VM HARDWARE
    # ============================================================

    vm_memory_mb: 24568
    vm_cpu_count: 12

    # 2 TB = 2000 GB
    disk_size_gb: 2000

    # ============================================================
    # NETWORK
    # ============================================================

    vmnet: "VMnet0"

    # ============================================================
    # VMWARE WORKSTATION
    # Script automatically searches common locations
    # ============================================================

    vmrun_candidates:
      - "/cygdrive/c/Program Files/VMware/VMware Workstation/vmrun.exe"
      - "/cygdrive/c/Program Files (x86)/VMware/VMware Workstation/vmrun.exe"

    vdiskmanager_candidates:
      - "/cygdrive/c/Program Files/VMware/VMware Workstation/vmware-vdiskmanager.exe"
      - "/cygdrive/c/Program Files (x86)/VMware/VMware Workstation/vmware-vdiskmanager.exe"

  tasks:

    # ============================================================
    # STEP 1 - DISPLAY CONFIGURATION
    # ============================================================

    - name: Display ESXi configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM CONFIGURATION"
          - "============================================================"
          - "VM Name      : {{ vm_name }}"
          - "ESXi ISO     : {{ esxi_iso }}"
          - "VM Directory : {{ vm_path }}"
          - "RAM          : {{ vm_memory_mb }} MB"
          - "CPU          : {{ vm_cpu_count }} vCPU"
          - "Disk         : {{ disk_size_gb }} GB"
          - "Network      : {{ vmnet }}"
          - "Firmware     : EFI"
          - "============================================================"

    # ============================================================
    # STEP 2 - CHECK ESXi ISO
    # ============================================================

    - name: Check ESXi ISO exists
      ansible.builtin.stat:
        path: "{{ esxi_iso }}"
      register: esxi_iso_stat

    - name: Stop when ESXi ISO is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi ISO NOT FOUND
          ============================================================

          Expected:

          {{ esxi_iso }}

          Check the exact filename on D: drive.

          Run:

          ls -lh /cygdrive/d/*.iso
          ============================================================
      when: not esxi_iso_stat.stat.exists

    # ============================================================
    # STEP 3 - CHECK E DRIVE
    # ============================================================

    - name: Check E drive exists
      ansible.builtin.stat:
        path: "/cygdrive/e"
      register: e_drive_stat

    - name: Stop when E drive is missing
      ansible.builtin.fail:
        msg: "E: drive was not found at /cygdrive/e"
      when: not e_drive_stat.stat.exists

    # ============================================================
    # STEP 4 - FIND vmrun.exe
    # ============================================================

    - name: Check VMware vmrun.exe locations
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ vmrun_candidates }}"
      register: vmrun_checks

    - name: Set vmrun executable
      ansible.builtin.set_fact:
        vmrun_exe: >-
          {{
            (
              vmrun_checks.results
              | selectattr('stat.exists', 'equalto', true)
              | map(attribute='item')
              | list
              | first
            ) | default('')
          }}

    - name: Fail when vmrun.exe is not found
      ansible.builtin.fail:
        msg: |
          vmrun.exe was not found.

          Checked:

          /cygdrive/c/Program Files/VMware/VMware Workstation/vmrun.exe

          /cygdrive/c/Program Files (x86)/VMware/VMware Workstation/vmrun.exe

          Find it using:

          find /cygdrive/c -iname "vmrun.exe" 2>/dev/null
      when: vmrun_exe | length == 0

    # ============================================================
    # STEP 5 - FIND vmware-vdiskmanager.exe
    # ============================================================

    - name: Check VMware disk manager locations
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ vdiskmanager_candidates }}"
      register: vdisk_checks

    - name: Set VMware disk manager executable
      ansible.builtin.set_fact:
        vmware_vdiskmanager_exe: >-
          {{
            (
              vdisk_checks.results
              | selectattr('stat.exists', 'equalto', true)
              | map(attribute='item')
              | list
              | first
            ) | default('')
          }}

    - name: Fail when vmware-vdiskmanager.exe is not found
      ansible.builtin.fail:
        msg: |
          vmware-vdiskmanager.exe was not found.

          Find it using:

          find /cygdrive/c -iname "vmware-vdiskmanager.exe" 2>/dev/null
      when: vmware_vdiskmanager_exe | length == 0

    - name: Display VMware executable paths
      ansible.builtin.debug:
        msg:
          - "vmrun.exe = {{ vmrun_exe }}"
          - "vmware-vdiskmanager.exe = {{ vmware_vdiskmanager_exe }}"

    # ============================================================
    # STEP 6 - CREATE E:\ESXI DIRECTORY
    # ============================================================

    - name: Create ESXi VM directory
      ansible.builtin.file:
        path: "{{ vm_path }}"
        state: directory
        mode: "0755"

    # ============================================================
    # STEP 7 - CHECK EXISTING VM FILES
    # ============================================================

    - name: Check VMX file
      ansible.builtin.stat:
        path: "{{ vmx_file }}"
      register: vmx_stat

    - name: Check VMDK file
      ansible.builtin.stat:
        path: "{{ vmdk_file }}"
      register: vmdk_stat

    # ============================================================
    # STEP 8 - CREATE 2 TB VIRTUAL DISK
    # ============================================================

    - name: Create 2000 GB ESXi virtual disk
      ansible.builtin.command:
        argv:
          - "{{ vmware_vdiskmanager_exe }}"
          - "-c"
          - "-s"
          - "{{ disk_size_gb }}GB"
          - "-a"
          - "lsilogic"
          - "-t"
          - "1"
          - "{{ vmdk_file }}"
      when: not vmdk_stat.stat.exists

    # ============================================================
    # STEP 9 - CREATE VMX CONFIGURATION
    # ============================================================

    - name: Create ESXi VMX file
      ansible.builtin.copy:
        dest: "{{ vmx_file }}"
        content: |
          .encoding = "windows-1252"
          config.version = "8"
          virtualHW.version = "21"

          displayName = "{{ vm_name }}"
          guestOS = "vmkernel8"

          # ====================================================
          # CPU
          # ====================================================

          numvcpus = "{{ vm_cpu_count }}"
          cpuid.coresPerSocket = "{{ vm_cpu_count }}"

          # ====================================================
          # MEMORY
          # ====================================================

          memsize = "{{ vm_memory_mb }}"

          # ====================================================
          # NESTED VIRTUALIZATION
          # ====================================================

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          # ====================================================
          # EFI
          # ====================================================

          firmware = "efi"

          # ====================================================
          # ESXi INSTALLER ISO
          # ====================================================

          sata0.present = "TRUE"

          sata0:0.present = "TRUE"
          sata0:0.deviceType = "cdrom-image"
          sata0:0.fileName = "{{ esxi_iso }}"
          sata0:0.startConnected = "TRUE"

          # ====================================================
          # ESXi DISK
          # ====================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "ESXI-01.vmdk"

          # ====================================================
          # NETWORK
          # Custom VMnet0
          # ====================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "{{ vmnet }}"
          ethernet0.startConnected = "TRUE"
          ethernet0.virtualDev = "e1000e"

          # ====================================================
          # USB
          # ====================================================

          usb.present = "TRUE"

          # ====================================================
          # LOGGING
          # ====================================================

          logging = "TRUE"
          tools.syncTime = "FALSE"

          uuid.action = "create"
      when: not vmx_stat.stat.exists

    # ============================================================
    # STEP 10 - CHECK RUNNING VMS
    # ============================================================

    - name: Get running VMware VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_exe }}"
          - "list"
      register: running_vms
      changed_when: false

    # ============================================================
    # STEP 11 - START ESXi VM
    # ============================================================

    - name: Start ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_exe }}"
          - "start"
          - "{{ vmx_file }}"
          - "gui"
      when: vmx_file not in running_vms.stdout

    # ============================================================
    # COMPLETED
    # ============================================================

    - name: Display completion result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ESXi VM CREATED SUCCESSFULLY"
          - "============================================================"
          - "VM Name      : {{ vm_name }}"
          - "VM Location  : E:\\ESXI"
          - "VMX File     : E:\\ESXI\\ESXI-01.vmx"
          - "Disk         : {{ disk_size_gb }} GB"
          - "RAM          : {{ vm_memory_mb }} MB"
          - "CPU          : {{ vm_cpu_count }} vCPU"
          - "Network      : {{ vmnet }}"
          - "Firmware     : EFI"
          - "============================================================"
          - "VMware Workstation should now boot the ESXi ISO."
          - "Complete ESXi installation in the VMware console."
          - "============================================================"
