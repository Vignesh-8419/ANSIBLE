cat > ~/ANSIBLE/install_esxi_workstation.yml <<'YAML'
---
- name: Automated Nested ESXi 8.0U1 Installation - VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ========================================================================
    # VM
    # ========================================================================

    vm_name: "ESXI-01"

    vm_dir_cygwin: "/cygdrive/d/ESXI/ESXI-01"
    vmx_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmx"
    vmdk_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmdk"
    vmware_log_cygwin: "/cygdrive/d/ESXI/ESXI-01/vmware.log"

    vmx_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmx'
    vmdk_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmdk'

    # ========================================================================
    # ISO
    # ========================================================================

    esxi_iso_cygwin: "/cygdrive/e/vmware/ESXi-8.0.1-auto.iso"
    esxi_iso_windows: 'E:\vmware\ESXi-8.0.1-auto.iso'

    # ========================================================================
    # HTTP KICKSTART
    # ========================================================================

    ks_url: "http://192.168.253.136/repo/ks.cfg"

    # ========================================================================
    # VMWARE WORKSTATION
    # ========================================================================

    vmrun_cygwin: "/cygdrive/d/VM workstation/vmrun.exe"
    vmware_cygwin: "/cygdrive/d/VM workstation/vmware.exe"
    vdiskmanager_cygwin: "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"

    vmware_windows: 'D:\VM workstation\vmware.exe'

    # ========================================================================
    # HARDWARE
    # ========================================================================

    vm_memory_mb: 24568
    vm_vcpu: 12
    vm_disk_gb: 2000

    # ========================================================================
    # NETWORK
    # ========================================================================

    vm_network_name: "VMnet0"
    vm_network_adapter: "vmxnet3"

    esxi_ip: "192.168.253.128"
    esxi_netmask: "255.255.255.0"
    esxi_gateway: "192.168.253.2"
    esxi_dns: "192.168.253.1"
    esxi_hostname: "esxi-host-01.vgs.com"

    http_server_ip: "192.168.253.136"

    # ========================================================================
    # TIMEOUTS
    # ========================================================================

    startup_wait_seconds: 20
    shutdown_wait_seconds: 20
    installation_timeout_seconds: 900
    final_boot_wait_seconds: 30
    https_timeout_seconds: 900

    # ========================================================================
    # EXPECTED UEFI BOOT.CFG
    # ========================================================================

    expected_kernelopt: 'kernelopt=runweasel cdromBoot ip=192.168.253.128 netmask=255.255.255.0 gateway=192.168.253.2 nameserver=192.168.253.1 netdevice=vmnic0 ks=http://192.168.253.136/repo/ks.cfg'

    # ========================================================================
    # EXPECTED KS DISK DIRECTIVE
    # ========================================================================

    expected_install_disk: 'install --disk=mpx.vmhba0:C0:T0:L0 --overwritevmfs'

  tasks:

    # ========================================================================
    # DISPLAY
    # ========================================================================

    - name: Display configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AUTOMATED NESTED ESXi 8.0U1 INSTALLATION"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - 'VMX           : D:\ESXI\ESXI-01\ESXI-01.vmx'
          - 'VMDK          : D:\ESXI\ESXI-01\ESXI-01.vmdk'
          - 'ISO           : E:\vmware\ESXi-8.0.1-auto.iso'
          - "KS URL        : {{ ks_url }}"
          - "RAM           : {{ vm_memory_mb }} MB"
          - "CPU           : {{ vm_vcpu }} vCPU"
          - "Disk          : {{ vm_disk_gb }} GB"
          - "Firmware      : EFI"
          - "Nested VT     : ENABLED"
          - "Network       : {{ vm_network_name }}"
          - "Adapter       : {{ vm_network_adapter }}"
          - "ESXi IP       : {{ esxi_ip }}"
          - "Netmask       : {{ esxi_netmask }}"
          - "Gateway       : {{ esxi_gateway }}"
          - "DNS           : {{ esxi_dns }}"
          - "Hostname      : {{ esxi_hostname }}"
          - "HTTP Server   : {{ http_server_ip }}"
          - "Install Disk  : mpx.vmhba0:C0:T0:L0"
          - "============================================================"

    # ========================================================================
    # CHECK ISO
    # ========================================================================

    - name: Check customized ESXi ISO
      ansible.builtin.stat:
        path: "{{ esxi_iso_cygwin }}"
      register: iso_stat

    - name: Fail if ISO is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi ISO NOT FOUND
          ============================================================

          Cygwin:
          {{ esxi_iso_cygwin }}

          Windows:
          {{ esxi_iso_windows }}

          ============================================================
      when: not iso_stat.stat.exists

    # ========================================================================
    # CHECK VMWARE TOOLS
    # ========================================================================

    - name: Check vmrun.exe
      ansible.builtin.stat:
        path: "{{ vmrun_cygwin }}"
      register: vmrun_stat

    - name: Fail if vmrun.exe is missing
      ansible.builtin.fail:
        msg: |
          vmrun.exe not found:

          {{ vmrun_cygwin }}
      when: not vmrun_stat.stat.exists

    - name: Check VMware Workstation
      ansible.builtin.stat:
        path: "{{ vmware_cygwin }}"
      register: vmware_stat

    - name: Fail if VMware Workstation is missing
      ansible.builtin.fail:
        msg: |
          VMware Workstation not found:

          {{ vmware_cygwin }}
      when: not vmware_stat.stat.exists

    - name: Check vmware-vdiskmanager.exe
      ansible.builtin.stat:
        path: "{{ vdiskmanager_cygwin }}"
      register: vdiskmanager_stat

    - name: Fail if vmware-vdiskmanager.exe is missing
      ansible.builtin.fail:
        msg: |
          vmware-vdiskmanager.exe not found:

          {{ vdiskmanager_cygwin }}
      when: not vdiskmanager_stat.stat.exists

    # ========================================================================
    # HTTP KS CHECK
    # ========================================================================

    - name: Download HTTP KS.CFG
      ansible.builtin.command:
        argv:
          - curl
          - -fsS
          - "{{ ks_url }}"
      register: ks_http_result
      changed_when: false
      failed_when: false

    - name: Fail if HTTP KS.CFG is unavailable
      ansible.builtin.fail:
        msg: |
          ============================================================
          HTTP KS.CFG NOT AVAILABLE
          ============================================================

          URL:
          {{ ks_url }}

          Return code:
          {{ ks_http_result.rc }}

          STDOUT:
          {{ ks_http_result.stdout }}

          STDERR:
          {{ ks_http_result.stderr }}

          ============================================================
      when: ks_http_result.rc != 0

    # ========================================================================
    # KS VALIDATION
    # ========================================================================

    - name: Validate HTTP KS.CFG
      ansible.builtin.assert:
        that:
          - "'vmaccepteula' in ks_http_result.stdout"
          - "'rootpw ' in ks_http_result.stdout"
          - "'network --bootproto=static --device=vmnic0 --ip=192.168.253.128 --netmask=255.255.255.0 --gateway=192.168.253.2 --nameserver=192.168.253.1 --hostname=esxi-host-01.vgs.com' in ks_http_result.stdout"
          - "expected_install_disk in ks_http_result.stdout"
          - "'reboot' in ks_http_result.stdout"
          - "'%firstboot' in ks_http_result.stdout"
        fail_msg: |
          ============================================================
          HTTP KS.CFG VALIDATION FAILED
          ============================================================

          Current KS.CFG:

          {{ ks_http_result.stdout }}

          Expected install directive:

          {{ expected_install_disk }}

          ============================================================
        success_msg: "HTTP KS.CFG validated successfully."

    # ========================================================================
    # VERIFY UEFI BOOT.CFG INSIDE ISO
    # ========================================================================

    - name: Extract EFI BOOT.CFG
      ansible.builtin.command:
        argv:
          - 7z
          - e
          - -so
          - "{{ esxi_iso_cygwin }}"
          - "EFI/BOOT/BOOT.CFG"
      register: uefi_boot_cfg
      changed_when: false
      failed_when: uefi_boot_cfg.rc != 0

    - name: Extract UEFI kernelopt
      ansible.builtin.shell: |
        printf '%s\n' '{{ uefi_boot_cfg.stdout }}' |
        grep '^kernelopt='
      args:
        executable: /bin/bash
      register: uefi_kernelopt
      changed_when: false
      failed_when: false

    - name: Validate UEFI kernelopt
      ansible.builtin.assert:
        that:
          - "(uefi_kernelopt.stdout | trim) == expected_kernelopt"
        fail_msg: |
          ============================================================
          UEFI BOOT.CFG IS INCORRECT
          ============================================================

          Expected:
          {{ expected_kernelopt }}

          Found:
          {{ uefi_kernelopt.stdout }}

          ============================================================
        success_msg: "EFI/BOOT/BOOT.CFG validated successfully."

    # ========================================================================
    # VM DIRECTORY
    # ========================================================================

    - name: Create ESXi VM directory
      ansible.builtin.file:
        path: "{{ vm_dir_cygwin }}"
        state: directory
        mode: "0755"

    # ========================================================================
    # CURRENT VM STATE
    # ========================================================================

    - name: Get running VMware VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_before
      changed_when: false
      failed_when: false

    - name: Determine current ESXI-01 state
      ansible.builtin.set_fact:
        esxi_running_before: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_before.stdout | default('') | lower)
          }}

    - name: Display current VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "CURRENT VM STATE"
          - "============================================================"
          - "Running : {{ esxi_running_before }}"
          - "============================================================"

    # ========================================================================
    # STOP EXISTING VM IF REQUIRED
    # ========================================================================

    - name: Stop existing ESXI-01
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      register: existing_stop
      changed_when: existing_stop.rc == 0
      failed_when: false
      when: esxi_running_before

    - name: Wait for existing VM shutdown
      ansible.builtin.pause:
        seconds: "{{ shutdown_wait_seconds }}"
      when: esxi_running_before

    - name: Verify ESXI-01 stopped
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_after_stop
      changed_when: false
      failed_when: false

    - name: Determine ESXI-01 post-stop state
      ansible.builtin.set_fact:
        esxi_running_after_stop: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_after_stop.stdout | default('') | lower)
          }}

    - name: Fail if ESXI-01 remains running
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXI-01 IS STILL RUNNING
          ============================================================

          {{ vmrun_after_stop.stdout }}

          ============================================================
      when:
        - esxi_running_before
        - esxi_running_after_stop

    # ========================================================================
    # REMOVE STALE LOCKS / RUNTIME FILES
    # DOES NOT TOUCH VMDK
    # ========================================================================

    - name: Remove stale VMware lock directories
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 2 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Remove stale VMware runtime files
      ansible.builtin.shell: |
        rm -f "{{ vm_dir_cygwin }}"/*.vmem 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmss 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmsn 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.scoreboard 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmpl 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # VMDK
    # ========================================================================

    - name: Check existing VMDK
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_stat

    - name: Display VMDK state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMDK STATE"
          - "============================================================"
          - 'Windows path : D:\ESXI\ESXI-01\ESXI-01.vmdk'
          - "Exists       : {{ vmdk_stat.stat.exists }}"
          - "============================================================"

    - name: Create 2TB VMDK if missing
      ansible.builtin.command:
        argv:
          - "{{ vdiskmanager_cygwin }}"
          - "-c"
          - "-s"
          - "{{ vm_disk_gb }}GB"
          - "-a"
          - "lsilogic"
          - "-t"
          - "0"
          - "{{ vmdk_file_windows }}"
      register: vmdk_create
      changed_when: vmdk_create.rc == 0
      failed_when: vmdk_create.rc != 0
      when: not vmdk_stat.stat.exists

    - name: Verify VMDK exists
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_after

    - name: Fail if VMDK is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMDK NOT FOUND
          ============================================================

          {{ vmdk_file_windows }}

          ============================================================
      when: not vmdk_after.stat.exists

    # ========================================================================
    # BACKUP CURRENT VMX IF IT EXISTS
    # ========================================================================

    - name: Check existing VMX
      ansible.builtin.stat:
        path: "{{ vmx_file_cygwin }}"
      register: existing_vmx

    - name: Backup existing VMX
      ansible.builtin.copy:
        src: "{{ vmx_file_cygwin }}"
        dest: "{{ vmx_file_cygwin }}.ansible-backup"
        remote_src: true
        mode: "0644"
      when: existing_vmx.stat.exists

    # ========================================================================
    # INSTALLATION VMX
    #
    # This matches the VMX that successfully reached the ESXi installer.
    # ========================================================================

    - name: Create installation VMX
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "UTF-8"

          config.version = "8"
          virtualHW.version = "19"

          displayName = "ESXI-01"
          guestOS = "vmkernel7"

          memsize = "24568"
          numvcpus = "12"
          cpuid.coresPerSocket = "1"

          # EFI
          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"

          # Nested virtualization
          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # ==========================================================
          # PCI TOPOLOGY
          # ==========================================================

          pciBridge0.present = "TRUE"
          pciBridge0.pciSlotNumber = "17"

          pciBridge4.present = "TRUE"
          pciBridge4.virtualDev = "pcieRootPort"
          pciBridge4.functions = "8"
          pciBridge4.pciSlotNumber = "21"

          pciBridge5.present = "TRUE"
          pciBridge5.virtualDev = "pcieRootPort"
          pciBridge5.functions = "8"
          pciBridge5.pciSlotNumber = "22"

          pciBridge6.present = "TRUE"
          pciBridge6.virtualDev = "pcieRootPort"
          pciBridge6.functions = "8"
          pciBridge6.pciSlotNumber = "23"

          pciBridge7.present = "TRUE"
          pciBridge7.virtualDev = "pcieRootPort"
          pciBridge7.functions = "8"
          pciBridge7.pciSlotNumber = "24"

          # ==========================================================
          # SCSI DISK
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"
          scsi0.pciSlotNumber = "16"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "D:\ESXI\ESXI-01\ESXI-01.vmdk"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ==========================================================
          # INSTALLATION ISO
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "E:\vmware\ESXi-8.0.1-auto.iso"
          ide1:0.startConnected = "TRUE"

          # ==========================================================
          # NETWORK
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "VMnet0"
          ethernet0.virtualDev = "vmxnet3"
          ethernet0.addressType = "generated"
          ethernet0.startConnected = "TRUE"
          ethernet0.pciSlotNumber = "192"

          # ==========================================================
          # UNUSED DEVICES
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"
          ehci.present = "FALSE"
          sound.present = "FALSE"
          floppy0.present = "FALSE"
          serial0.present = "FALSE"
          parallel0.present = "FALSE"
          printer0.present = "FALSE"

          svga.present = "TRUE"
          svga.autodetect = "TRUE"

          # Do NOT use efi.bootOrder.
          efi.hddOrder = "scsi0:0"

          powerType.powerOff = "soft"
          powerType.powerOn = "soft"
          powerType.suspend = "soft"
          powerType.reset = "soft"

          tools.upgrade.policy = "manual"
          tools.syncTime = "FALSE"

    # ========================================================================
    # VMX VALIDATION
    # ========================================================================

    - name: Read installation VMX
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: installation_vmx_slurp

    - name: Decode installation VMX
      ansible.builtin.set_fact:
        installation_vmx_text: "{{ installation_vmx_slurp.content | b64decode }}"

    - name: Validate installation VMX
      ansible.builtin.assert:
        that:
          - "'virtualHW.version = \"19\"' in installation_vmx_text"
          - "'firmware = \"efi\"' in installation_vmx_text"
          - "'vhv.enable = \"TRUE\"' in installation_vmx_text"

          - "'scsi0.present = \"TRUE\"' in installation_vmx_text"
          - "'scsi0.virtualDev = \"lsilogic\"' in installation_vmx_text"
          - "'scsi0.pciSlotNumber = \"16\"' in installation_vmx_text"
          - "'scsi0:0.present = \"TRUE\"' in installation_vmx_text"
          - "'scsi0:0.fileName = \"D:\\ESXI\\ESXI-01\\ESXI-01.vmdk\"' in installation_vmx_text"

          - "'ide1:0.present = \"TRUE\"' in installation_vmx_text"
          - "'ide1:0.deviceType = \"cdrom-image\"' in installation_vmx_text"
          - "'ide1:0.fileName = \"E:\\vmware\\ESXi-8.0.1-auto.iso\"' in installation_vmx_text"
          - "'ide1:0.startConnected = \"TRUE\"' in installation_vmx_text"

          - "'ethernet0.present = \"TRUE\"' in installation_vmx_text"
          - "'ethernet0.connectionType = \"custom\"' in installation_vmx_text"
          - "'ethernet0.vnet = \"VMnet0\"' in installation_vmx_text"
          - "'ethernet0.virtualDev = \"vmxnet3\"' in installation_vmx_text"
          - "'ethernet0.startConnected = \"TRUE\"' in installation_vmx_text"
          - "'ethernet0.pciSlotNumber = \"192\"' in installation_vmx_text"

          - "'pciBridge0.present = \"TRUE\"' in installation_vmx_text"
          - "'pciBridge0.pciSlotNumber = \"17\"' in installation_vmx_text"

          - "'pciBridge4.present = \"TRUE\"' in installation_vmx_text"
          - "'pciBridge4.virtualDev = \"pcieRootPort\"' in installation_vmx_text"
          - "'pciBridge4.pciSlotNumber = \"21\"' in installation_vmx_text"

          - "'pciBridge5.present = \"TRUE\"' in installation_vmx_text"
          - "'pciBridge5.virtualDev = \"pcieRootPort\"' in installation_vmx_text"
          - "'pciBridge5.pciSlotNumber = \"22\"' in installation_vmx_text"

          - "'pciBridge6.present = \"TRUE\"' in installation_vmx_text"
          - "'pciBridge6.virtualDev = \"pcieRootPort\"' in installation_vmx_text"
          - "'pciBridge6.pciSlotNumber = \"23\"' in installation_vmx_text"

          - "'pciBridge7.present = \"TRUE\"' in installation_vmx_text"
          - "'pciBridge7.virtualDev = \"pcieRootPort\"' in installation_vmx_text"
          - "'pciBridge7.pciSlotNumber = \"24\"' in installation_vmx_text"

          - "'efi.hddOrder = \"scsi0:0\"' in installation_vmx_text"
        fail_msg: |
          ============================================================
          INSTALLATION VMX VALIDATION FAILED
          ============================================================
        success_msg: "Installation VMX validated successfully."

    - name: Ensure invalid efi.bootOrder is absent
      ansible.builtin.shell: |
        if grep -q '^efi\.bootOrder[[:space:]]*=' "{{ vmx_file_cygwin }}"; then
          echo "Invalid efi.bootOrder found:"
          grep -n '^efi\.bootOrder[[:space:]]*=' "{{ vmx_file_cygwin }}"
          exit 1
        fi

        echo "efi.bootOrder is absent."
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # START INSTALLATION VM
    # ========================================================================

    - name: Launch VMware Workstation
      ansible.builtin.command:
        argv:
          - powershell.exe
          - "-NoProfile"
          - "-NonInteractive"
          - "-Command"
          - >-
            $vmx = "{{ vmx_file_windows }}";
            $proc = Start-Process
            -FilePath "{{ vmware_windows }}"
            -ArgumentList @("-x", $vmx)
            -PassThru;
            Write-Output ("VMware Workstation PID: " + $proc.Id)
      register: workstation_start
      changed_when: true
      failed_when: false

    - name: Display VMware start
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ESXi INSTALLATION VM START"
          - "============================================================"
          - "Return Code : {{ workstation_start.rc }}"
          - "STDOUT      : {{ workstation_start.stdout }}"
          - "STDERR      : {{ workstation_start.stderr }}"
          - "============================================================"

    - name: Wait for VMware Workstation
      ansible.builtin.pause:
        seconds: "{{ startup_wait_seconds }}"

    # ========================================================================
    # VERIFY VM RUNNING
    # ========================================================================

    - name: Check running VMware VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: installation_vm_list
      changed_when: false
      failed_when: false

    - name: Determine installation VM running state
      ansible.builtin.set_fact:
        installation_vm_running: >-
          {{
            vmx_file_windows | lower
            in
            (installation_vm_list.stdout | default('') | lower)
          }}

    - name: Display installation VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "INSTALLATION VM STATE"
          - "============================================================"
          - "Running : {{ installation_vm_running }}"
          - "============================================================"

    - name: Fail if installation VM did not start
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi INSTALLATION VM DID NOT START
          ============================================================

          vmrun list:

          {{ installation_vm_list.stdout }}

          VMware log:

          {{ vmware_log_cygwin }}

          ============================================================
      when: not installation_vm_running

    # ========================================================================
    # WAIT FOR INSTALLATION TO COMPLETE
    #
    # We use ESXi port 443 as the completion signal.
    # ========================================================================

    - name: Wait for ESXi HTTPS
      ansible.builtin.wait_for:
        host: "{{ esxi_ip }}"
        port: 443
        state: started
        timeout: "{{ https_timeout_seconds }}"
        delay: 30
      register: esxi_https_wait
      failed_when: false

    # ========================================================================
    # COLLECT VM LOG
    # ========================================================================

    - name: Read VMware installation log
      ansible.builtin.shell: |
        if [ -f "{{ vmware_log_cygwin }}" ]; then
          tail -300 "{{ vmware_log_cygwin }}"
        else
          echo "VMware log not found."
        fi
      args:
        executable: /bin/bash
      register: installation_log
      changed_when: false
      failed_when: false

    # ========================================================================
    # FAIL IF ESXi DID NOT COME UP
    # ========================================================================

    - name: Fail if ESXi did not become available
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi SCRIPTED INSTALLATION DID NOT COMPLETE
          ============================================================

          ESXi HTTPS endpoint:

          https://{{ esxi_ip }}

          was not reachable within:

          {{ https_timeout_seconds }} seconds.

          VMware log:

          {{ installation_log.stdout }}

          ============================================================
      when: esxi_https_wait.failed | default(false)

    - name: Display installation completed
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ESXi SCRIPTED INSTALLATION COMPLETED"
          - "============================================================"
          - "ESXi IP : {{ esxi_ip }}"
          - "HTTPS   : https://{{ esxi_ip }}"
          - "============================================================"

    # ========================================================================
    # STOP INSTALLED VM
    # ========================================================================

    - name: Stop installed ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "soft"
      register: installed_vm_stop
      changed_when: installed_vm_stop.rc == 0
      failed_when: false

    - name: Wait for installed VM shutdown
      ansible.builtin.pause:
        seconds: "{{ shutdown_wait_seconds }}"

    - name: Verify installed VM stopped
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: installed_vm_stop_check
      changed_when: false
      failed_when: false

    # ========================================================================
    # REMOVE STALE LOCKS
    # ========================================================================

    - name: Remove post-install lock directories
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 2 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # BACKUP VMX
    # ========================================================================

    - name: Backup installed VMX
      ansible.builtin.copy:
        src: "{{ vmx_file_cygwin }}"
        dest: "{{ vmx_file_cygwin }}.installed-backup"
        remote_src: true
        mode: "0644"

    # ========================================================================
    # FINAL VMX
    # ========================================================================

    - name: Create final ESXi VMX
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "UTF-8"

          config.version = "8"
          virtualHW.version = "19"

          displayName = "ESXI-01"
          guestOS = "vmkernel7"

          memsize = "24568"
          numvcpus = "12"
          cpuid.coresPerSocket = "1"

          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # ==========================================================
          # PCI TOPOLOGY
          # ==========================================================

          pciBridge0.present = "TRUE"
          pciBridge0.pciSlotNumber = "17"

          pciBridge4.present = "TRUE"
          pciBridge4.virtualDev = "pcieRootPort"
          pciBridge4.functions = "8"
          pciBridge4.pciSlotNumber = "21"

          pciBridge5.present = "TRUE"
          pciBridge5.virtualDev = "pcieRootPort"
          pciBridge5.functions = "8"
          pciBridge5.pciSlotNumber = "22"

          pciBridge6.present = "TRUE"
          pciBridge6.virtualDev = "pcieRootPort"
          pciBridge6.functions = "8"
          pciBridge6.pciSlotNumber = "23"

          pciBridge7.present = "TRUE"
          pciBridge7.virtualDev = "pcieRootPort"
          pciBridge7.functions = "8"
          pciBridge7.pciSlotNumber = "24"

          # ==========================================================
          # SCSI / ESXi DISK
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"
          scsi0.pciSlotNumber = "16"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "D:\ESXI\ESXI-01\ESXI-01.vmdk"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ==========================================================
          # ISO DISCONNECTED
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "E:\vmware\ESXi-8.0.1-auto.iso"
          ide1:0.startConnected = "FALSE"

          # ==========================================================
          # VMXNET3
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "VMnet0"
          ethernet0.virtualDev = "vmxnet3"
          ethernet0.addressType = "generated"
          ethernet0.startConnected = "TRUE"
          ethernet0.pciSlotNumber = "192"

          # ==========================================================
          # UNUSED DEVICES
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"
          ehci.present = "FALSE"

          sound.present = "FALSE"
          floppy0.present = "FALSE"
          serial0.present = "FALSE"
          parallel0.present = "FALSE"
          printer0.present = "FALSE"

          svga.present = "TRUE"
          svga.autodetect = "TRUE"

          # No efi.bootOrder.
          efi.hddOrder = "scsi0:0"

          powerType.powerOff = "soft"
          powerType.powerOn = "soft"
          powerType.suspend = "soft"
          powerType.reset = "soft"

          tools.upgrade.policy = "manual"
          tools.syncTime = "FALSE"

    # ========================================================================
    # FINAL VMX VALIDATION
    # ========================================================================

    - name: Read final VMX
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: final_vmx_slurp

    - name: Decode final VMX
      ansible.builtin.set_fact:
        final_vmx_text: "{{ final_vmx_slurp.content | b64decode }}"

    - name: Validate final VMX
      ansible.builtin.assert:
        that:
          - "'virtualHW.version = \"19\"' in final_vmx_text"
          - "'firmware = \"efi\"' in final_vmx_text"
          - "'vhv.enable = \"TRUE\"' in final_vmx_text"

          - "'scsi0:0.present = \"TRUE\"' in final_vmx_text"
          - "'scsi0:0.fileName = \"D:\\ESXI\\ESXI-01\\ESXI-01.vmdk\"' in final_vmx_text"

          - "'ide1:0.present = \"TRUE\"' in final_vmx_text"
          - "'ide1:0.startConnected = \"FALSE\"' in final_vmx_text"

          - "'ethernet0.virtualDev = \"vmxnet3\"' in final_vmx_text"
          - "'ethernet0.vnet = \"VMnet0\"' in final_vmx_text"

          - "'efi.hddOrder = \"scsi0:0\"' in final_vmx_text"
        fail_msg: |
          ============================================================
          FINAL VMX VALIDATION FAILED
          ============================================================
        success_msg: "Final VMX validated successfully."

    - name: Ensure invalid efi.bootOrder is absent from final VMX
      ansible.builtin.shell: |
        if grep -q '^efi\.bootOrder[[:space:]]*=' "{{ vmx_file_cygwin }}"; then
          echo "Invalid efi.bootOrder found:"
          grep -n '^efi\.bootOrder[[:space:]]*=' "{{ vmx_file_cygwin }}"
          exit 1
        fi

        echo "efi.bootOrder is absent."
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # FINAL POWER ON
    # ========================================================================

    - name: Launch final ESXi VM
      ansible.builtin.command:
        argv:
          - powershell.exe
          - "-NoProfile"
          - "-NonInteractive"
          - "-Command"
          - >-
            $vmx = "{{ vmx_file_windows }}";
            $proc = Start-Process
            -FilePath "{{ vmware_windows }}"
            -ArgumentList @("-x", $vmx)
            -PassThru;
            Write-Output ("VMware Workstation PID: " + $proc.Id)
      register: final_vm_start
      changed_when: true
      failed_when: false

    - name: Display final VM start
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi VM START"
          - "============================================================"
          - "Return Code : {{ final_vm_start.rc }}"
          - "STDOUT      : {{ final_vm_start.stdout }}"
          - "STDERR      : {{ final_vm_start.stderr }}"
          - "============================================================"

    - name: Wait for final ESXi boot
      ansible.builtin.pause:
        seconds: "{{ final_boot_wait_seconds }}"

    # ========================================================================
    # FINAL VM STATE
    # ========================================================================

    - name: Get final VMware VM list
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: final_vm_list
      changed_when: false
      failed_when: false

    - name: Determine final VM running state
      ansible.builtin.set_fact:
        final_vm_running: >-
          {{
            vmx_file_windows | lower
            in
            (final_vm_list.stdout | default('') | lower)
          }}

    - name: Display final ESXi VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi VM STATE"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "Running       : {{ final_vm_running }}"
          - "Boot          : HDD"
          - "ISO Connected : FALSE"
          - "Network       : VMnet0"
          - "Adapter       : vmxnet3"
          - "IP            : {{ esxi_ip }}"
          - "Hostname      : {{ esxi_hostname }}"
          - "============================================================"

    - name: Fail if final ESXi VM is not running
      ansible.builtin.fail:
        msg: |
          ============================================================
          FINAL ESXi VM DID NOT START
          ============================================================

          vmrun list:

          {{ final_vm_list.stdout }}

          VMware log:

          {{ vmware_log_cygwin }}

          ============================================================
      when: not final_vm_running

    # ========================================================================
    # FINAL HTTPS CHECK
    # ========================================================================

    - name: Wait for final ESXi HTTPS
      ansible.builtin.wait_for:
        host: "{{ esxi_ip }}"
        port: 443
        state: started
        timeout: "{{ https_timeout_seconds }}"
        delay: 10
        msg: |
          Final ESXi management interface did not become available:

          https://{{ esxi_ip }}

    # ========================================================================
    # PING
    # ========================================================================

    - name: Ping final ESXi
      ansible.builtin.command:
        argv:
          - ping
          - "-n"
          - "2"
          - "{{ esxi_ip }}"
      register: final_ping
      changed_when: false
      failed_when: false

    # ========================================================================
    # SUCCESS
    # ========================================================================

    - name: Display successful ESXi installation
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS - ESXi INSTALLATION COMPLETE"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - 'VMX           : D:\ESXI\ESXI-01\ESXI-01.vmx'
          - 'VMDK          : D:\ESXI\ESXI-01\ESXI-01.vmdk'
          - 'ISO           : E:\vmware\ESXi-8.0.1-auto.iso'
          - "Running       : {{ final_vm_running }}"
          - "Firmware      : EFI"
          - "Nested VT     : ENABLED"
          - "RAM           : {{ vm_memory_mb }} MB"
          - "CPU           : {{ vm_vcpu }}"
          - "Disk          : {{ vm_disk_gb }} GB"
          - "Network       : VMnet0"
          - "Adapter       : vmxnet3"
          - "IP            : {{ esxi_ip }}"
          - "Netmask       : {{ esxi_netmask }}"
          - "Gateway       : {{ esxi_gateway }}"
          - "DNS           : {{ esxi_dns }}"
          - "Hostname      : {{ esxi_hostname }}"
          - "ESXi URL      : https://{{ esxi_ip }}"
          - "============================================================"
YAML
