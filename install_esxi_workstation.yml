---
- name: Create and Start Nested ESXi VM in VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # ============================================================
    # VM CONFIGURATION
    # ============================================================

    vm_name: "ESXI-01"

    vm_dir: "/cygdrive/d/ESXI/ESXI-01"
    vmx_file: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmx"
    vmdk_file: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmdk"
    vmware_log: "/cygdrive/d/ESXI/ESXI-01/vmware.log"

    # Windows paths required inside VMware commands/VMX
    vmx_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmx'
    vmdk_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmdk'

    # VMware Workstation paths
    vmrun_path: "/cygdrive/d/VM workstation/vmrun.exe"
    vdiskmanager_path: "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"

    vmrun_path_windows: 'D:\VM workstation\vmrun.exe'
    vdiskmanager_path_windows: 'D:\VM workstation\vmware-vdiskmanager.exe'

    # ESXi ISO
    esxi_iso: "/cygdrive/e/vmware/VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso"
    esxi_iso_windows: 'E:\vmware\VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso'

    # ============================================================
    # VM RESOURCES
    # ============================================================

    memory_mb: 24568
    num_cpus: 12

    # Disk size in GB
    disk_size_gb: 2000

    # VMware hardware version
    # Your installed VMware build:
    # vmrun 1.17.0 build-20089737
    #
    # Version 19 successfully passes the old HW-version error.
    virtual_hw_version: "19"

    # Network
    network_type: "bridged"
    network_vnet: "VMnet0"

  tasks:

    # ============================================================
    # DISPLAY CONFIGURATION
    # ============================================================

    - name: Display ESXi configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM CONFIGURATION"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "ESXi ISO      : {{ esxi_iso }}"
          - "VM Directory  : {{ vm_dir }}"
          - "VMX File      : {{ vmx_file }}"
          - "VMRUN Path    : {{ vmrun_path }}"
          - "VDISK Path    : {{ vdiskmanager_path }}"
          - "RAM           : {{ memory_mb }} MB"
          - "CPU           : {{ num_cpus }} vCPU"
          - "Disk          : {{ disk_size_gb }}GB"
          - "Network       : {{ network_vnet }}"
          - "Firmware      : EFI"
          - "Hardware Ver  : {{ virtual_hw_version }}"
          - "Nested VT     : ENABLED"
          - "USB xHCI      : DISABLED"
          - "Sound         : DISABLED"
          - "Printer       : DISABLED"
          - "Floppy        : DISABLED"
          - "============================================================"

    # ============================================================
    # CHECK REQUIRED FILES
    # ============================================================

    - name: Check ESXi ISO exists
      ansible.builtin.stat:
        path: "{{ esxi_iso }}"
      register: esxi_iso_stat

    - name: Fail when ESXi ISO does not exist
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi ISO NOT FOUND
          ============================================================

          Expected ISO:

          {{ esxi_iso }}

          Please correct esxi_iso in the playbook.
          ============================================================
      when: not esxi_iso_stat.stat.exists

    - name: Check VMware vmrun.exe exists
      ansible.builtin.stat:
        path: "{{ vmrun_path }}"
      register: vmrun_stat

    - name: Fail when vmrun.exe is not found
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMRUN.EXE NOT FOUND
          ============================================================

          Expected:

          {{ vmrun_path }}

          Please correct vmrun_path.
          ============================================================
      when: not vmrun_stat.stat.exists

    - name: Check VMware vmware-vdiskmanager.exe exists
      ansible.builtin.stat:
        path: "{{ vdiskmanager_path }}"
      register: vdiskmanager_stat

    - name: Fail when vmware-vdiskmanager.exe is not found
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMWARE-VDISKMANAGER.EXE NOT FOUND
          ============================================================

          Expected:

          {{ vdiskmanager_path }}

          Please correct vdiskmanager_path.
          ============================================================
      when: not vdiskmanager_stat.stat.exists

    - name: Display detected VMware paths
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMWARE WORKSTATION DETECTED"
          - "============================================================"
          - "vmrun.exe: {{ vmrun_path }}"
          - "vmware-vdiskmanager.exe: {{ vdiskmanager_path }}"
          - "============================================================"

    # ============================================================
    # CREATE VM DIRECTORY
    # ============================================================

    - name: Create ESXi VM directory
      ansible.builtin.file:
        path: "{{ vm_dir }}"
        state: directory
        mode: "0755"

    # ============================================================
    # CHECK EXISTING VM STATE
    # ============================================================

    - name: Check whether VMX file already exists
      ansible.builtin.stat:
        path: "{{ vmx_file }}"
      register: vmx_stat

    - name: Check whether virtual disk already exists
      ansible.builtin.stat:
        path: "{{ vmdk_file }}"
      register: vmdk_stat

    - name: Get running VMware virtual machines
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "list"
      register: vmrun_list_before
      changed_when: false
      failed_when: false

    - name: Set ESXi VM running status
      ansible.builtin.set_fact:
        esxi_vm_running: "{{ vmx_file_windows in vmrun_list_before.stdout }}"

    - name: Stop existing ESXi VM before configuration
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      when: esxi_vm_running | bool
      register: stop_vm
      failed_when: false
      changed_when: true

    - name: Wait after stopping ESXi VM
      ansible.builtin.pause:
        seconds: 3
      when: esxi_vm_running | bool

    # ============================================================
    # REMOVE STALE VMWARE LOCKS
    # ============================================================

    - name: Find stale VMware lock directories
      ansible.builtin.find:
        paths: "{{ vm_dir }}"
        patterns: "*.lck"
        file_type: directory
      register: stale_lock_dirs

    - name: Remove stale VMware lock directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ stale_lock_dirs.files }}"
      when: stale_lock_dirs.matched | int > 0

    - name: Find stale VMware state files
      ansible.builtin.find:
        paths: "{{ vm_dir }}"
        patterns:
          - "*.vmem"
          - "*.vmss"
          - "*.vmem.lck"
          - "*.vmss.lck"
      file_type: any
      recurse: false
      register: stale_state_files

    - name: Remove stale VMware state files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ stale_state_files.files }}"
      when: stale_state_files.matched | int > 0

    # ============================================================
    # CREATE VIRTUAL DISK
    # ============================================================

    - name: Create ESXi virtual disk
      ansible.builtin.command:
        argv:
          - "{{ vdiskmanager_path }}"
          - "-c"
          - "-s"
          - "{{ disk_size_gb }}GB"
          - "-a"
          - "lsilogic"
          - "-t"
          - "0"
          - "{{ vmdk_file_windows }}"
      when: not vmdk_stat.stat.exists
      register: create_disk

    - name: Display virtual disk creation result
      ansible.builtin.debug:
        var: create_disk.stdout_lines
      when:
        - create_disk is defined
        - create_disk.stdout_lines is defined

    # ============================================================
    # CREATE VMX CONFIGURATION
    # ============================================================

    - name: Create ESXi VMware VMX configuration
      ansible.builtin.copy:
        dest: "{{ vmx_file }}"
        mode: "0644"
        content: |
          # ==========================================================
          # VMware Workstation Nested ESXi
          # ==========================================================

          config.version = "8"
          virtualHW.version = "{{ virtual_hw_version }}"
          guestOS = "vmkernel7"

          displayName = "{{ vm_name }}"

          # ==========================================================
          # CPU / MEMORY
          # ==========================================================

          memsize = "{{ memory_mb }}"
          numvcpus = "{{ num_cpus }}"
          cpuid.coresPerSocket = "{{ num_cpus }}"

          # Enable nested virtualization
          vhv.enable = "TRUE"

          # Required for nested ESXi
          hypervisor.cpuid.v0 = "FALSE"

          # ==========================================================
          # FIRMWARE
          # ==========================================================

          firmware = "efi"
          efi.secureBoot.enabled = "FALSE"

          # ==========================================================
          # DISK
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "{{ vmdk_file_windows }}"
          scsi0:0.deviceType = "disk"

          # ==========================================================
          # ESXi INSTALLATION ISO
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "{{ esxi_iso_windows }}"
          ide1:0.startConnected = "TRUE"

          # ==========================================================
          # NETWORK
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "{{ network_type }}"
          ethernet0.vnet = "{{ network_vnet }}"
          ethernet0.virtualDev = "e1000e"
          ethernet0.startConnected = "TRUE"

          # ==========================================================
          # USB
          #
          # IMPORTANT:
          # Completely disabled because VMware log reported:
          #
          # No PCIe slot available for usb_xhci
          # PCIXHCI: Failed to register xHCI PCIe device
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"

          # ==========================================================
          # DISABLE UNNECESSARY DEVICES
          # ==========================================================

          sound.present = "FALSE"
          printer0.present = "FALSE"

          floppy0.present = "FALSE"
          floppy1.present = "FALSE"

          parallel0.present = "FALSE"
          serial0.present = "FALSE"

          # ==========================================================
          # DISPLAY
          # ==========================================================

          svga.present = "TRUE"
          svga.vramSize = "134217728"
          mks.enable3d = "FALSE"

          # ==========================================================
          # VMWARE OPTIONS
          # ==========================================================

          tools.upgrade.policy = "manual"

          # Avoid automatic suspend state
          checkpoint.vmState = ""

          # ==========================================================
          # PERFORMANCE
          # ==========================================================

          mainMem.useNamedFile = "FALSE"
          MemTrimRate = "0"

    # ============================================================
    # VERIFY VMX
    # ============================================================

    - name: Read VMX hardware version
      ansible.builtin.command:
        argv:
          - "grep"
          - "virtualHW.version"
          - "{{ vmx_file }}"
      register: vmx_hw_version
      changed_when: false

    - name: Read VMX guest OS
      ansible.builtin.command:
        argv:
          - "grep"
          - "guestOS"
          - "{{ vmx_file }}"
      register: vmx_guest_os
      changed_when: false

    - name: Read VMX USB configuration
      ansible.builtin.command:
        argv:
          - "grep"
          - "-E"
          - "^usb|^usb_xhci"
          - "{{ vmx_file }}"
      register: vmx_usb
      changed_when: false

    - name: Display verified VMX configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMX CONFIGURATION VERIFIED"
          - "============================================================"
          - "{{ vmx_hw_version.stdout }}"
          - "{{ vmx_guest_os.stdout }}"
          - "{{ vmx_usb.stdout_lines | join(' | ') }}"
          - "============================================================"

    - name: Fail if VMX hardware version is incorrect
      ansible.builtin.fail:
        msg: |
          VMX hardware version verification failed.

          Expected:

          virtualHW.version = "{{ virtual_hw_version }}"

          Actual:

          {{ vmx_hw_version.stdout }}
      when: ('"' ~ virtual_hw_version ~ '"') not in vmx_hw_version.stdout

    # ============================================================
    # DISPLAY VMWARE VERSION
    # ============================================================

    - name: Display VMware vmrun version information
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-h"
      register: vmrun_info
      changed_when: false
      failed_when: false

    - name: Display VMware information
      ansible.builtin.debug:
        msg: "{{ vmrun_info.stdout_lines + vmrun_info.stderr_lines }}"

    # ============================================================
    # START ESXi VM
    # ============================================================

    - name: Start Nested ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "start"
          - "{{ vmx_file_windows }}"
          - "nogui"
      register: start_vm
      changed_when: start_vm.rc == 0
      failed_when: false

    - name: Wait for VMware startup processing
      ansible.builtin.pause:
        seconds: 10
      when: start_vm.rc == 0

    # ============================================================
    # CHECK FINAL VM STATE
    # ============================================================

    - name: Get running VMware virtual machines after start
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "list"
      register: vmrun_list_after
      changed_when: false
      failed_when: false

    - name: Set final ESXi VM running status
      ansible.builtin.set_fact:
        esxi_vm_running_final: "{{ vmx_file_windows in vmrun_list_after.stdout }}"

    # ============================================================
    # READ VMWARE LOG
    # ============================================================

    - name: Check VMware log exists
      ansible.builtin.stat:
        path: "{{ vmware_log }}"
      register: vmware_log_stat

    - name: Read last 150 lines of VMware log
      ansible.builtin.command:
        argv:
          - "tail"
          - "-150"
          - "{{ vmware_log }}"
      register: vmware_log_tail
      changed_when: false
      failed_when: false
      when: vmware_log_stat.stat.exists

    - name: Extract important VMware errors
      ansible.builtin.command:
        argv:
          - "grep"
          - "-iE"
          - "No PCIe slot|usb_xhci|power on failed|Failed to start|Error|hardware version|VT-x|AMD-V|Hyper-V|virtualization"
          - "{{ vmware_log }}"
      register: vmware_log_errors
      changed_when: false
      failed_when: false
      when: vmware_log_stat.stat.exists

    # ============================================================
    # FAIL ONLY IF VM DID NOT START
    # ============================================================

    - name: Fail with VMware troubleshooting information
      ansible.builtin.fail:
        msg: |
          ============================================================
          FAILED TO START NESTED ESXi VM
          ============================================================

          VMX:

          {{ vmx_file_windows }}

          VMware hardware version:

          {{ vmx_hw_version.stdout }}

          USB configuration:

          {{ vmx_usb.stdout }}

          vmrun return code:

          {{ start_vm.rc }}

          vmrun output:

          {{ start_vm.stdout }}

          {{ start_vm.stderr }}

          ------------------------------------------------------------
          IMPORTANT VMWARE LOG ERRORS
          ------------------------------------------------------------

          {{ vmware_log_errors.stdout | default('No matching errors found.') }}

          ------------------------------------------------------------
          LAST VMWARE LOG ENTRIES
          ------------------------------------------------------------

          {{ vmware_log_tail.stdout | default('VMware log not found.') }}

          ============================================================
          ============================================================
      when: not (esxi_vm_running_final | bool)

    # ============================================================
    # SUCCESS
    # ============================================================

    - name: Display ESXi VM success information
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM STARTED SUCCESSFULLY"
          - "============================================================"
          - "VM Name : {{ vm_name }}"
          - "VMX     : {{ vmx_file_windows }}"
          - "RAM     : {{ memory_mb }} MB"
          - "CPU     : {{ num_cpus }} vCPU"
          - "Disk    : {{ disk_size_gb }}GB"
          - "Network : {{ network_vnet }}"
          - "Firmware: EFI"
          - "Nested VT: ENABLED"
          - "USB/xHCI: DISABLED"
          - "============================================================"
      when: esxi_vm_running_final | bool
