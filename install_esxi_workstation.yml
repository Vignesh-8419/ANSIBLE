---
- name: Create and Start Nested ESXi VM in VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ========================================================================
    # BASIC CONFIGURATION
    # ========================================================================

    vm_name: "ESXI-01"

    # Cygwin paths
    vm_dir_cygwin: "/cygdrive/d/ESXI/ESXI-01"
    vmx_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmx"
    vmdk_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmdk"
    vmware_log_cygwin: "/cygdrive/d/ESXI/ESXI-01/vmware.log"

    esxi_iso_cygwin: "/cygdrive/e/vmware/VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso"

    vmrun_cygwin: "/cygdrive/d/VM workstation/vmrun.exe"
    vdiskmanager_cygwin: "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"

    # Windows paths for VMware executables
    vmx_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmx'
    vmdk_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmdk'
    esxi_iso_windows: 'E:\vmware\VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso'

    vmrun_windows: 'D:\VM workstation\vmrun.exe'
    vdiskmanager_windows: 'D:\VM workstation\vmware-vdiskmanager.exe'

    # ========================================================================
    # VM HARDWARE
    # ========================================================================

    vm_memory_mb: 24568
    vm_vcpu: 12
    vm_disk_gb: 2000

    virtual_hw_version: "19"

    guest_os: "vmkernel7"

    # ========================================================================
    # NETWORK
    # ========================================================================

    network_type: "bridged"
    network_name: "VMnet0"

    # ========================================================================
    # STARTUP
    # ========================================================================

    startup_wait: 15


  tasks:

    # ========================================================================
    # HEADER
    # ========================================================================

    - name: Display ESXi configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM CONFIGURATION"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "VMX           : {{ vmx_file_windows }}"
          - "VMDK          : {{ vmdk_file_windows }}"
          - "ESXi ISO      : {{ esxi_iso_windows }}"
          - "VMRUN         : {{ vmrun_windows }}"
          - "VDISKMANAGER  : {{ vdiskmanager_windows }}"
          - "RAM           : {{ vm_memory_mb }} MB"
          - "CPU           : {{ vm_vcpu }} vCPU"
          - "Disk          : {{ vm_disk_gb }} GB"
          - "Hardware Ver  : {{ virtual_hw_version }}"
          - "Guest OS      : {{ guest_os }}"
          - "Network       : {{ network_name }}"
          - "Firmware      : EFI"
          - "Nested VT     : ENABLED"
          - "PCIe Bridges  : ENABLED"
          - "USB           : DISABLED"
          - "xHCI          : DISABLED"
          - "Sound         : DISABLED"
          - "============================================================"


    # ========================================================================
    # VALIDATE ESXi ISO
    # ========================================================================

    - name: Check ESXi ISO
      ansible.builtin.stat:
        path: "{{ esxi_iso_cygwin }}"
      register: esxi_iso_stat

    - name: Fail if ESXi ISO does not exist
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi ISO NOT FOUND
          ============================================================

          Cygwin:
          {{ esxi_iso_cygwin }}

          Windows:
          {{ esxi_iso_windows }}

          ============================================================
      when: not esxi_iso_stat.stat.exists


    # ========================================================================
    # VALIDATE VMWARE
    # ========================================================================

    - name: Check vmrun.exe
      ansible.builtin.stat:
        path: "{{ vmrun_cygwin }}"
      register: vmrun_stat

    - name: Fail if vmrun.exe is missing
      ansible.builtin.fail:
        msg: |
          VMware vmrun.exe not found:

          {{ vmrun_windows }}
      when: not vmrun_stat.stat.exists


    - name: Check vmware-vdiskmanager.exe
      ansible.builtin.stat:
        path: "{{ vdiskmanager_cygwin }}"
      register: vdiskmanager_stat

    - name: Fail if vdiskmanager.exe is missing
      ansible.builtin.fail:
        msg: |
          VMware vmware-vdiskmanager.exe not found:

          {{ vdiskmanager_windows }}
      when: not vdiskmanager_stat.stat.exists


    # ========================================================================
    # CREATE VM DIRECTORY
    # ========================================================================

    - name: Create VM directory
      ansible.builtin.file:
        path: "{{ vm_dir_cygwin }}"
        state: directory
        mode: "0755"


    # ========================================================================
    # CHECK CURRENT VM
    # ========================================================================

    - name: Get current VMware VM list
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: vm_list_before
      changed_when: false
      failed_when: false

    - name: Determine VM running state
      ansible.builtin.set_fact:
        vm_running_before: >-
          {{
            vmx_file_windows | lower
            in
            (vm_list_before.stdout | lower)
          }}

    - name: Display current VM state
      ansible.builtin.debug:
        msg:
          - "VM: {{ vm_name }}"
          - "Running before configuration: {{ vm_running_before }}"


    # ========================================================================
    # POWER OFF MODE
    # ========================================================================

    - name: Power off ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      register: poweroff_result
      failed_when: false
      changed_when: poweroff_result.rc == 0
      when:
        - power | default("on") | lower == "off"
        - vm_running_before | bool

    - name: Wait after power off
      ansible.builtin.pause:
        seconds: 5
      when:
        - power | default("on") | lower == "off"
        - vm_running_before | bool

    - name: Display power off result
      ansible.builtin.debug:
        msg:
          - "Power off return code: {{ poweroff_result.rc | default(0) }}"
          - "Output: {{ poweroff_result.stdout | default('VM already powered off') }}"
      when: power | default("on") | lower == "off"

    - name: End play after power off
      ansible.builtin.meta: end_play
      when: power | default("on") | lower == "off"


    # ========================================================================
    # STOP VM BEFORE REBUILD
    # ========================================================================

    - name: Stop VM before automatic VMX rebuild
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      register: stop_before_rebuild
      failed_when: false
      changed_when: stop_before_rebuild.rc == 0
      when: vm_running_before | bool

    - name: Wait for VMware shutdown
      ansible.builtin.pause:
        seconds: 5
      when: vm_running_before | bool


    # ========================================================================
    # BACKUP CURRENT VMX
    # ========================================================================

    - name: Check existing VMX
      ansible.builtin.stat:
        path: "{{ vmx_file_cygwin }}"
      register: vmx_existing_stat

    - name: Backup existing VMX
      ansible.builtin.copy:
        src: "{{ vmx_file_cygwin }}"
        dest: "{{ vmx_file_cygwin }}.ansible-backup"
        remote_src: true
        mode: "0644"
      when: vmx_existing_stat.stat.exists


    # ========================================================================
    # REMOVE STALE LOCKS
    # ========================================================================

    - name: Remove stale VMware lock directories
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 2 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false


    # ========================================================================
    # REMOVE OLD STATE FILES
    # ========================================================================

    - name: Remove stale VMware state files
      ansible.builtin.shell: |
        rm -f "{{ vm_dir_cygwin }}"/*.vmem 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmss 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmpl 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmsn 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.scoreboard 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.nvram 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false


    # ========================================================================
    # CHECK VMDK
    # ========================================================================

    - name: Check existing VMDK
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_stat


    # ========================================================================
    # CREATE VMDK
    #
    # IMPORTANT:
    # Windows VMware executable receives Windows path.
    # ========================================================================

    - name: Create ESXi virtual disk
      ansible.builtin.command:
        argv:
          - "{{ vdiskmanager_cygwin }}"
          - "-c"
          - "-s"
          - "{{ vm_disk_gb }}GB"
          - "-a"
          - "lsilogic"
          - "-t"
          - "0"
          - "{{ vmdk_file_windows }}"
      register: vmdk_create
      when: not vmdk_stat.stat.exists
      changed_when: vmdk_create.rc == 0
      failed_when: vmdk_create.rc != 0


    - name: Display VMDK result
      ansible.builtin.debug:
        msg:
          - "VMDK return code: {{ vmdk_create.rc | default(0) }}"
          - "{{ vmdk_create.stdout | default('Existing VMDK preserved.') }}"
          - "{{ vmdk_create.stderr | default('') }}"


    # ========================================================================
    # VERIFY VMDK
    # ========================================================================

    - name: Verify VMDK exists
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_after

    - name: Fail if VMDK is missing
      ansible.builtin.fail:
        msg: |
          ESXi virtual disk does not exist:

          {{ vmdk_file_windows }}
      when: not vmdk_after.stat.exists


    # ========================================================================
    # REMOVE OLD VMX
    # ========================================================================

    - name: Remove old VMX
      ansible.builtin.file:
        path: "{{ vmx_file_cygwin }}"
        state: absent


    # ========================================================================
    # CREATE CORRECT VMX
    #
    # IMPORTANT:
    #
    # PCI bridge configuration is intentionally included.
    #
    # VMware Workstation requires PCIe root ports for devices such
    # as e1000e/vmxnet3 and some SCSI controllers.
    # ========================================================================

    - name: Create clean ESXi VMX
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "UTF-8"

          config.version = "8"
          virtualHW.version = "{{ virtual_hw_version }}"

          virtualHW.productCompatibility = "hosted"

          displayName = "{{ vm_name }}"
          guestOS = "{{ guest_os }}"

          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"

          memsize = "{{ vm_memory_mb }}"
          numvcpus = "{{ vm_vcpu }}"
          cpuid.coresPerSocket = "1"

          # ==========================================================
          # NESTED VIRTUALIZATION
          # ==========================================================

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # ==========================================================
          # PCI ROOT COMPLEX
          #
          # These are REQUIRED for PCIe devices.
          # ==========================================================

          pciBridge0.present = "TRUE"
          pciBridge0.pciSlotNumber = "17"

          pciBridge1.present = "TRUE"
          pciBridge1.pciSlotNumber = "18"

          pciBridge2.present = "TRUE"
          pciBridge2.pciSlotNumber = "19"

          pciBridge3.present = "TRUE"
          pciBridge3.pciSlotNumber = "20"

          # PCIe root ports
          pciBridge4.present = "TRUE"
          pciBridge4.virtualDev = "pcieRootPort"
          pciBridge4.functions = "8"
          pciBridge4.pciSlotNumber = "21"

          pciBridge5.present = "TRUE"
          pciBridge5.virtualDev = "pcieRootPort"
          pciBridge5.functions = "8"
          pciBridge5.pciSlotNumber = "22"

          pciBridge6.present = "TRUE"
          pciBridge6.virtualDev = "pcieRootPort"
          pciBridge6.functions = "8"
          pciBridge6.pciSlotNumber = "23"

          pciBridge7.present = "TRUE"
          pciBridge7.virtualDev = "pcieRootPort"
          pciBridge7.functions = "8"
          pciBridge7.pciSlotNumber = "24"

          # ==========================================================
          # SCSI CONTROLLER
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsisas1068"

          # Put SCSI controller behind a PCIe root port
          scsi0.pciSlotNumber = "160"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "{{ vmdk_file_windows }}"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ==========================================================
          # CD/DVD
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "{{ esxi_iso_windows }}"
          ide1:0.startConnected = "TRUE"

          # ==========================================================
          # NETWORK
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "{{ network_type }}"
          ethernet0.vnet = "{{ network_name }}"
          ethernet0.virtualDev = "e1000e"
          ethernet0.addressType = "generated"
          ethernet0.startConnected = "TRUE"

          # Put Ethernet behind PCIe root port
          ethernet0.pciSlotNumber = "1184"

          # ==========================================================
          # USB
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"
          ehci.present = "FALSE"

          # ==========================================================
          # SOUND
          # ==========================================================

          sound.present = "FALSE"

          # ==========================================================
          # SERIAL / PARALLEL
          # ==========================================================

          serial0.present = "FALSE"
          parallel0.present = "FALSE"

          # ==========================================================
          # FLOPPY
          # ==========================================================

          floppy0.present = "FALSE"

          # ==========================================================
          # DISPLAY
          # ==========================================================

          svga.present = "TRUE"
          svga.autodetect = "TRUE"
          svga.vramSize = "134217728"

          # ==========================================================
          # POWER
          # ==========================================================

          powerType.powerOff = "soft"
          powerType.powerOn = "soft"
          powerType.suspend = "soft"
          powerType.reset = "soft"

          # ==========================================================
          # TOOLS
          # ==========================================================

          tools.upgrade.policy = "manual"
          tools.syncTime = "FALSE"

          # ==========================================================
          # MISC
          # ==========================================================

          isolation.tools.copy.disable = "FALSE"
          isolation.tools.paste.disable = "FALSE"


    # ========================================================================
    # VERIFY VMX
    # ========================================================================

    - name: Read generated VMX
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: vmx_slurp

    - name: Decode VMX
      ansible.builtin.set_fact:
        vmx_text: "{{ vmx_slurp.content | b64decode }}"


    - name: Verify PCI bridge configuration
      ansible.builtin.assert:
        that:
          - "'pciBridge0.present = \"TRUE\"' in vmx_text"
          - "'pciBridge4.present = \"TRUE\"' in vmx_text"
          - "'pciBridge4.virtualDev = \"pcieRootPort\"' in vmx_text"
          - "'pciBridge4.functions = \"8\"' in vmx_text"
          - "'pciBridge7.present = \"TRUE\"' in vmx_text"
        fail_msg: "PCIe root-port configuration is missing."
        success_msg: "PCIe root-port configuration verified."


    - name: Verify SCSI
      ansible.builtin.assert:
        that:
          - "'scsi0.present = \"TRUE\"' in vmx_text"
          - "'scsi0.virtualDev = \"lsisas1068\"' in vmx_text"
          - "'scsi0.pciSlotNumber = \"160\"' in vmx_text"
          - "'scsi0:0.present = \"TRUE\"' in vmx_text"
        fail_msg: "SCSI configuration is incorrect."
        success_msg: "SCSI configuration verified."


    - name: Verify network
      ansible.builtin.assert:
        that:
          - "'ethernet0.present = \"TRUE\"' in vmx_text"
          - "'ethernet0.virtualDev = \"e1000e\"' in vmx_text"
          - "'ethernet0.pciSlotNumber = \"1184\"' in vmx_text"
        fail_msg: "Ethernet configuration is incorrect."
        success_msg: "Ethernet PCIe configuration verified."


    - name: Verify nested virtualization
      ansible.builtin.assert:
        that:
          - "'vhv.enable = \"TRUE\"' in vmx_text"
        fail_msg: "Nested virtualization is disabled."
        success_msg: "Nested virtualization enabled."


    - name: Verify hardware version
      ansible.builtin.assert:
        that:
          - ('virtualHW.version = "' ~ virtual_hw_version ~ '"') in vmx_text
        fail_msg: "Hardware version is incorrect."
        success_msg: "Hardware version 19 verified."


    - name: Display VMX validation
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMX VALIDATION SUCCESSFUL"
          - "============================================================"
          - "Hardware Version : {{ virtual_hw_version }}"
          - "PCI Bridges      : CONFIGURED"
          - "PCIe Root Ports  : CONFIGURED"
          - "SCSI Slot        : 160"
          - "Ethernet Slot    : 1184"
          - "Nested VT        : ENABLED"
          - "============================================================"


    # ========================================================================
    # REMOVE OLD LOG
    # ========================================================================

    - name: Remove old VMware log
      ansible.builtin.file:
        path: "{{ vmware_log_cygwin }}"
        state: absent


    # ========================================================================
    # START VM
    # ========================================================================

    - name: Start Nested ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ vmx_file_windows }}"
          - "nogui"
      register: vm_start
      changed_when: vm_start.rc == 0
      failed_when: false


    - name: Display VMware start result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMWARE START RESULT"
          - "============================================================"
          - "Return code: {{ vm_start.rc }}"
          - "STDOUT:"
          - "{{ vm_start.stdout | default('') }}"
          - "STDERR:"
          - "{{ vm_start.stderr | default('') }}"
          - "============================================================"


    # ========================================================================
    # WAIT
    # ========================================================================

    - name: Wait for VMware startup
      ansible.builtin.pause:
        seconds: "{{ startup_wait }}"
      when: vm_start.rc == 0


    # ========================================================================
    # VERIFY RUNNING
    # ========================================================================

    - name: Get VMware VM list
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_after
      changed_when: false
      failed_when: false


    - name: Determine final VM state
      ansible.builtin.set_fact:
        vm_running_after: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_after.stdout | lower)
          }}


    - name: Display final VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi VM STATUS"
          - "============================================================"
          - "VM Name : {{ vm_name }}"
          - "VMX     : {{ vmx_file_windows }}"
          - "Running : {{ vm_running_after }}"
          - "============================================================"


    # ========================================================================
    # SUCCESS
    # ========================================================================

    - name: Display successful startup
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS - NESTED ESXi VM IS RUNNING"
          - "============================================================"
          - "VM Name : {{ vm_name }}"
          - "VMX     : {{ vmx_file_windows }}"
          - "RAM     : {{ vm_memory_mb }} MB"
          - "CPU     : {{ vm_vcpu }} vCPU"
          - "Disk    : {{ vm_disk_gb }} GB"
          - "Network : {{ network_name }}"
          - "============================================================"
      when: vm_running_after | bool


    # ========================================================================
    # FAILURE DIAGNOSTICS
    # ========================================================================

    - name: Check VMware log
      ansible.builtin.stat:
        path: "{{ vmware_log_cygwin }}"
      register: vmware_log_stat
      when: not vm_running_after | bool


    - name: Read current VMware log
      ansible.builtin.shell: |
        tail -150 "{{ vmware_log_cygwin }}"
      args:
        executable: /bin/bash
      register: vmware_log_tail
      changed_when: false
      failed_when: false
      when:
        - not vm_running_after | bool
        - vmware_log_stat.stat.exists


    - name: Extract important current VMware errors
      ansible.builtin.shell: |
        grep -iE \
        "error|failed|failure|no pcIe|pci|slot|ethernet|scsi|rootPort|power on failed|unable to allocate" \
        "{{ vmware_log_cygwin }}" |
        tail -80
      args:
        executable: /bin/bash
      register: vmware_errors
      changed_when: false
      failed_when: false
      when:
        - not vm_running_after | bool
        - vmware_log_stat.stat.exists


    - name: Fail with current VMware diagnostics
      ansible.builtin.fail:
        msg: |
          ============================================================
          FAILED TO START NESTED ESXi VM
          ============================================================

          VM:
          {{ vm_name }}

          VMX:
          {{ vmx_file_windows }}

          Hardware:
          virtualHW.version = "{{ virtual_hw_version }}"

          vmrun return code:
          {{ vm_start.rc }}

          vmrun stdout:
          {{ vm_start.stdout | default('') }}

          vmrun stderr:
          {{ vm_start.stderr | default('') }}

          ------------------------------------------------------------
          CURRENT VMWARE ERRORS
          ------------------------------------------------------------

          {{ vmware_errors.stdout | default('No filtered errors.') }}

          ------------------------------------------------------------
          LAST VMWARE LOG
          ------------------------------------------------------------

          {{ vmware_log_tail.stdout | default('VMware log not available.') }}

          ------------------------------------------------------------
          VMX BACKUP
          ------------------------------------------------------------

          {{ vmx_file_cygwin }}.ansible-backup

          ============================================================
      when: not vm_running_after | bool
