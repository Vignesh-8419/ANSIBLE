---
- name: Complete Foreman Katello Installation and Configuration
  hosts: all
  become: true
  become_method: sudo
  gather_facts: true

  vars:
    # ===============================================================
    # CONFIGURATION
    # ===============================================================

    mount_point: "http-server-01.vgs.com/repo"

    skip_patch: false
    run_only: ""

    domain: "vgs.com"
    dns_ip: "192.168.253.1"

    java_path: "/usr/lib/jvm/java-1.8.0-openjdk-1.8.0.412.b08-1.el7_9.x86_64/bin"
    module_path: "/etc/puppetlabs/code/environments/production/modules/java_ks"

    foreman_server_name: "cent-07-01.vgs.com"
    dns_server: "192.168.253.1"
    dhcp_gateway: "192.168.253.2"

    pulp_source: "/var/lib/pulp"
    pulp_destination: "/home/pulp"
    pulp_old: "/var/lib/pulp.old"

    tftp_root: "/var/lib/tftpboot"

  tasks:

    # ===============================================================
    # STEP 1: ISO SHARE
    # ===============================================================

    - name: STEP 1 - ISO share section is currently disabled
      ansible.builtin.debug:
        msg: "ISO share mount is disabled. Using HTTP repository at {{ mount_point }}."

    # ===============================================================
    # STEP 2: CLEAN AND CONFIGURE YUM REPOSITORIES
    # ===============================================================

    - name: STEP 2 - Find existing YUM repository files
      ansible.builtin.find:
        paths: /etc/yum.repos.d
        patterns: "*.repo"
        file_type: file
      register: existing_repo_files

    - name: STEP 2 - Clear existing YUM repository files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ existing_repo_files.files }}"

    - name: STEP 2 - Check yum-complete-transaction pending cleanup
      ansible.builtin.command:
        cmd: yum-complete-transaction --cleanup-only --quiet --skip-broken
      register: yum_cleanup
      changed_when: false
      failed_when: false

    - name: STEP 2 - Run yum-complete-transaction
      ansible.builtin.command:
        cmd: yum-complete-transaction -y
      register: yum_transaction
      changed_when: yum_transaction.rc == 0
      failed_when: false

    - name: STEP 2 - Create base.repo
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/base.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [baseos]
          name=CentOS Base Repo
          baseurl=http://{{ mount_point }}/centos
          enabled=1
          gpgcheck=0

          [mesa]
          name=Local Mesa Repo
          baseurl=http://{{ mount_point }}/mesa
          enabled=1
          gpgcheck=0
          priority=1

          [gtk]
          name=Local GTK Repo
          baseurl=http://{{ mount_point }}/gtk
          enabled=1
          gpgcheck=0
          priority=1

    - name: STEP 2 - Create patch.repo
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/patch.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [patch]
          name=CentOS Patch Repo
          baseurl=http://{{ mount_point }}/installed_rhel7
          enabled=1
          gpgcheck=0

    - name: STEP 2 - Create foreman.repo
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/foreman.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [foreman]
          name=CentOS Foreman Repo
          baseurl=http://{{ mount_point }}/installed_rhel7
          enabled=1
          gpgcheck=0

    - name: STEP 2 - Create puppet.repo
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/puppet.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [puppet7]
          name=Puppet 7 Repository EL7
          baseurl=https://yum.puppet.com/puppet7/el/7/x86_64/
          enabled=1
          gpgcheck=0

    - name: STEP 2 - Create vault.repo
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/vault.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [base]
          name=CentOS 7.9.2009 - Base
          baseurl=https://vault.centos.org/centos/7.9.2009/os/x86_64/
          enabled=1
          gpgcheck=0

          [updates]
          name=CentOS 7.9.2009 - Updates
          baseurl=https://vault.centos.org/centos/7.9.2009/updates/x86_64/
          enabled=1
          gpgcheck=0

          [extras]
          name=CentOS 7.9.2009 - Extras
          baseurl=https://vault.centos.org/centos/7.9.2009/extras/x86_64/
          enabled=1
          gpgcheck=0

    - name: STEP 2 - Clean yum metadata
      ansible.builtin.command:
        cmd: yum clean all
      changed_when: false
      failed_when: false

    - name: STEP 2 - Create yum cache
      ansible.builtin.command:
        cmd: yum makecache
      changed_when: false
      failed_when: false

    - name: STEP 2 - Install required packages
      ansible.builtin.yum:
        name:
          - gtk2
          - gtk3
          - "mesa-libEGL*"
          - "tomcat*"
          - "ruby*"
          - "apache*"
          - "rpm-build*"
          - jq-1.5-1.el7
          - "sshpass*"
        state: present
        disable_gpg_check: true

    # ===============================================================
    # STEP 3: CONFIGURE DNS
    # ===============================================================

    - name: STEP 3 - Check DNS resolution for current server FQDN
      ansible.builtin.command:
        cmd: "nslookup {{ ansible_hostname }}.{{ domain }}"
      register: hostname_dns_check
      changed_when: false
      failed_when: false

    - name: STEP 3 - DNS resolution working
      ansible.builtin.debug:
        msg: "DNS resolution is working."
      when: hostname_dns_check.rc == 0

    - name: STEP 3 - Configure DNS resolver when resolution fails
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          nameserver {{ dns_ip }}
      when: hostname_dns_check.rc != 0

    - name: STEP 3 - Test Google DNS resolution
      ansible.builtin.command:
        cmd: nslookup google.com
      register: google_dns_check
      changed_when: false
      failed_when: false
      when: hostname_dns_check.rc != 0

    - name: STEP 3 - Display DNS warning
      ansible.builtin.debug:
        msg: "DNS resolution failed."
      when:
        - hostname_dns_check.rc != 0
        - google_dns_check.rc != 0

    - name: STEP 3 - Install BIND packages
      ansible.builtin.yum:
        name: "bind*"
        state: present
        disable_gpg_check: true

    # ===============================================================
    # STEP 4: INSTALL JAVA AND FOREMAN STACK
    # ===============================================================

    - name: STEP 4 - Install Java
      ansible.builtin.yum:
        name:
          - java-1.8.0-openjdk
          - java-1.8.0-openjdk-devel
        state: present
        disable_gpg_check: true

    - name: STEP 4 - Install Puppet Server Katello and Foreman Installer
      ansible.builtin.yum:
        name:
          - puppetserver
          - katello
          - foreman-installer
        state: present
        disable_gpg_check: true

    - name: STEP 4 - Install Redis
      ansible.builtin.yum:
        name: rh-redis5-redis
        state: present
        disable_gpg_check: true

    - name: STEP 4 - Enable Redis service
      ansible.builtin.systemd:
        name: rh-redis5-redis
        enabled: true
        state: started

    - name: STEP 4 - Set Java environment path
      ansible.builtin.set_fact:
        java_environment_path: "{{ java_path }}:{{ ansible_env.PATH }}"

    # ===============================================================
    # STEP 5: PUPPET MODULE SETUP
    # ===============================================================

    - name: STEP 5 - Check puppetlabs-java_ks module directory
      ansible.builtin.stat:
        path: "{{ module_path }}"
      register: java_ks_module

    - name: STEP 5 - Remove existing java_ks module
      ansible.builtin.file:
        path: "{{ module_path }}"
        state: absent
      when: java_ks_module.stat.exists

    - name: STEP 5 - Install puppetlabs-java_ks module
      ansible.builtin.command:
        cmd: /opt/puppetlabs/bin/puppet module install puppetlabs-java_ks --force
      environment:
        PATH: "{{ java_environment_path }}"

    - name: STEP 5 - Create Foreman installer modules directory
      ansible.builtin.file:
        path: /usr/share/foreman-installer/modules
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: STEP 5 - Link java_ks module for Foreman installer
      ansible.builtin.file:
        src: "{{ module_path }}"
        dest: /usr/share/foreman-installer/modules/java_ks
        state: link
        force: true

    # ===============================================================
    # STEP 5.1: YUM HISTORY HEALTH CHECK
    # ===============================================================

    - name: STEP 5.1 - Check yum history
      ansible.builtin.command:
        cmd: yum history list
      register: yum_history_check
      changed_when: false
      failed_when: false

    - name: STEP 5.1 - Check yum history directory
      ansible.builtin.stat:
        path: /var/lib/yum/history
      register: yum_history_dir
      when: yum_history_check.rc != 0

    - name: STEP 5.1 - Backup corrupted yum history
      ansible.builtin.command:
        cmd: mv /var/lib/yum/history /var/lib/yum/history.bak
      when:
        - yum_history_check.rc != 0
        - yum_history_dir.stat.exists

    - name: STEP 5.1 - Clean yum after history reset
      ansible.builtin.command:
        cmd: yum clean all
      changed_when: false
      when: yum_history_check.rc != 0

    - name: STEP 5.1 - Rebuild RPM database
      ansible.builtin.command:
        cmd: rpm --rebuilddb
      when: yum_history_check.rc != 0

    # ===============================================================
    # STEP 5.2: FOREMAN INSTALLER PREPARATION
    # ===============================================================

    - name: STEP 5.2 - Get short hostname
      ansible.builtin.command:
        cmd: hostname -s
      register: short_hostname
      changed_when: false

    - name: STEP 5.2 - Get primary IP address
      ansible.builtin.command:
        cmd: hostname -I
      register: hostname_ips
      changed_when: false

    - name: STEP 5.2 - Set hostname facts
      ansible.builtin.set_fact:
        just_ip: "{{ hostname_ips.stdout.split()[0] }}"
        new_hostname: "{{ short_hostname.stdout }}"

    - name: STEP 5.2 - Remove old hostname entries from hosts file
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: ".*{{ new_hostname | regex_escape }}.*"
        state: absent

    - name: STEP 5.2 - Add hostname entry to hosts file
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ just_ip }} {{ new_hostname }}.{{ domain }} {{ new_hostname }}"
        state: present

    - name: STEP 5.2 - Verify hostname hosts entry
      ansible.builtin.command:
        cmd: "grep {{ new_hostname }}.{{ domain }} /etc/hosts"
      changed_when: false

    - name: STEP 5.2 - Clean yum
      ansible.builtin.command:
        cmd: yum clean all
      changed_when: false

    - name: STEP 5.2 - Remove yum cache
      ansible.builtin.file:
        path: /var/cache/yum
        state: absent

    - name: STEP 5.2 - Recreate yum cache
      ansible.builtin.command:
        cmd: yum makecache
      changed_when: false
      failed_when: false

    # ===============================================================
    # STEP 6: RUN FOREMAN INSTALLER
    # ===============================================================

    - name: STEP 6 - Check Foreman service status
      ansible.builtin.command:
        cmd: systemctl is-active foreman
      register: foreman_status
      changed_when: false
      failed_when: false

    - name: STEP 6 - Run Foreman installer with Katello scenario
      ansible.builtin.command:
        cmd: foreman-installer --scenario katello
      environment:
        PATH: "{{ java_environment_path }}"
      when: foreman_status.rc != 0

    - name: STEP 6 - Open HTTP firewall
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled

    - name: STEP 6 - Open HTTPS firewall
      ansible.posix.firewalld:
        service: https
        permanent: true
        immediate: true
        state: enabled

    # ===============================================================
    # STEP 6.1: RELOCATE PULP STORAGE
    # ===============================================================

    - name: STEP 6.1 - Check whether Pulp is already mounted
      ansible.builtin.command:
        cmd: mountpoint -q {{ pulp_source }}
      register: pulp_mount_check
      changed_when: false
      failed_when: false

    - name: STEP 6.1 - Check current Pulp mount source
      ansible.builtin.command:
        cmd: findmnt -n -o SOURCE --target {{ pulp_source }}
      register: pulp_current_source
      changed_when: false
      failed_when: false

    - name: STEP 6.1 - Pulp already using bind mount
      ansible.builtin.debug:
        msg: >
          Pulp is already mounted.
          Current source: {{ pulp_current_source.stdout | default('unknown') }}
          Skipping relocation.
      when: pulp_mount_check.rc == 0

    - name: STEP 6.1 - Stop Foreman services
      ansible.builtin.command:
        cmd: foreman-maintain service stop
      when: pulp_mount_check.rc != 0

    - name: STEP 6.1 - Check old Pulp backup directory
      ansible.builtin.stat:
        path: "{{ pulp_old }}"
      register: pulp_old_dir
      when: pulp_mount_check.rc != 0

    - name: STEP 6.1 - Fail if previous incomplete migration exists
      ansible.builtin.fail:
        msg: >
          {{ pulp_old }} already exists.
          Previous Pulp migration may be incomplete.
          Verify the data before rerunning.
      when:
        - pulp_mount_check.rc != 0
        - pulp_old_dir.stat.exists

    - name: STEP 6.1 - Install rsync
      ansible.builtin.yum:
        name: rsync
        state: present
        disable_gpg_check: true
      when: pulp_mount_check.rc != 0

    - name: STEP 6.1 - Create destination Pulp directory
      ansible.builtin.file:
        path: "{{ pulp_destination }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: pulp_mount_check.rc != 0

    - name: STEP 6.1 - Copy Pulp data
      ansible.builtin.command:
        cmd: >
          rsync -aHAX --numeric-ids
          {{ pulp_source }}/
          {{ pulp_destination }}/
      when: pulp_mount_check.rc != 0

    - name: STEP 6.1 - Rename original Pulp directory
      ansible.builtin.command:
        cmd: mv {{ pulp_source }} {{ pulp_old }}
      when: pulp_mount_check.rc != 0

    - name: STEP 6.1 - Create Pulp mountpoint
      ansible.builtin.file:
        path: "{{ pulp_source }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: pulp_mount_check.rc != 0

    - name: STEP 6.1 - Add Pulp bind mount to fstab
      ansible.posix.mount:
        path: "{{ pulp_source }}"
        src: "{{ pulp_destination }}"
        fstype: none
        opts: bind
        state: mounted
      when: pulp_mount_check.rc != 0

    - name: STEP 6.1 - Verify Pulp bind mount
      ansible.builtin.command:
        cmd: mountpoint -q {{ pulp_source }}
      register: pulp_mount_verify
      changed_when: false
      failed_when: false
      when: pulp_mount_check.rc != 0

    - name: STEP 6.1 - Fail when Pulp bind mount verification failed
      ansible.builtin.fail:
        msg: >
          Bind mount verification failed.
          {{ pulp_source }} is not mounted.
          Original data remains at {{ pulp_old }}.
      when:
        - pulp_mount_check.rc != 0
        - pulp_mount_verify.rc != 0

    - name: STEP 6.1 - Create Pulp migration test file
      ansible.builtin.file:
        path: "{{ pulp_source }}/.migration-test"
        state: touch
        mode: "0600"
      when: pulp_mount_check.rc != 0

    - name: STEP 6.1 - Check migration test on destination
      ansible.builtin.stat:
        path: "{{ pulp_destination }}/.migration-test"
      register: pulp_migration_test
      when: pulp_mount_check.rc != 0

    - name: STEP 6.1 - Fail when Pulp bind mount test failed
      ansible.builtin.fail:
        msg: "Pulp bind mount test failed."
      when:
        - pulp_mount_check.rc != 0
        - not pulp_migration_test.stat.exists

    - name: STEP 6.1 - Remove Pulp migration test file
      ansible.builtin.file:
        path: "{{ pulp_source }}/.migration-test"
        state: absent
      when: pulp_mount_check.rc != 0

    - name: STEP 6.1 - Restore SELinux context on Pulp destination
      ansible.builtin.command:
        cmd: restorecon -RF {{ pulp_destination }}
      changed_when: false
      failed_when: false
      when: pulp_mount_check.rc != 0

    - name: STEP 6.1 - Restore SELinux context on Pulp mount
      ansible.builtin.command:
        cmd: restorecon -RF {{ pulp_source }}
      changed_when: false
      failed_when: false
      when: pulp_mount_check.rc != 0

    - name: STEP 6.1 - Start Foreman services
      ansible.builtin.command:
        cmd: foreman-maintain service start
      when: pulp_mount_check.rc != 0

    - name: STEP 6.1 - Display Pulp relocation result
      ansible.builtin.debug:
        msg: >
          Pulp storage is available from {{ pulp_destination }}
          and mounted at {{ pulp_source }}.
          Original backup is retained at {{ pulp_old }}.
      when: pulp_mount_check.rc != 0

    # ===============================================================
    # STEP 7: CONFIGURE FOREMAN PROXIES
    # EFI STEPS COMPLETELY REMOVED
    # ===============================================================

    - name: STEP 7 - Install DHCP and TFTP services
      ansible.builtin.yum:
        name:
          - dhcp
          - tftp-server
        state: present
        disable_gpg_check: true

    # ---------------------------------------------------------------
    # CONFIGURE TFTP
    # ---------------------------------------------------------------

    - name: STEP 7 - Ensure TFTP root exists
      ansible.builtin.file:
        path: "{{ tftp_root }}"
        state: directory
        owner: foreman-proxy
        group: root
        mode: "0755"

    - name: STEP 7 - Configure Foreman TFTP proxy
      ansible.builtin.command:
        cmd: >
          foreman-installer --scenario katello
          --foreman-proxy-tftp true
          --foreman-proxy-tftp-managed true
          --foreman-proxy-tftp-root {{ tftp_root }}
          --foreman-proxy-tftp-servername {{ foreman_server_name }}
      environment:
        PATH: "{{ java_environment_path }}"

    # ---------------------------------------------------------------
    # CONFIGURE DNS
    # ---------------------------------------------------------------

    - name: STEP 7 - Check if Foreman proxy DNS key already exists
      ansible.builtin.stat:
        path: /etc/foreman-proxy/dns.key
      register: foreman_proxy_dns_key

    - name: STEP 7 - Generate DNSSEC key when missing
      ansible.builtin.command:
        cmd: dnssec-keygen -a HMAC-SHA512 -b 512 -n USER foreman-proxy
      args:
        chdir: /root
      when: not foreman_proxy_dns_key.stat.exists

    - name: STEP 7 - Find generated private DNSSEC key
      ansible.builtin.find:
        paths: /root
        patterns: "Kforeman-proxy*.private"
        file_type: file
      register: generated_dns_keys
      when: not foreman_proxy_dns_key.stat.exists

    - name: STEP 7 - Fail if DNSSEC key was not generated
      ansible.builtin.fail:
        msg: "DNSSEC private key was not generated."
      when:
        - not foreman_proxy_dns_key.stat.exists
        - generated_dns_keys.matched | int == 0

    - name: STEP 7 - Copy DNSSEC key to Foreman proxy
      ansible.builtin.copy:
        src: "{{ generated_dns_keys.files[0].path }}"
        dest: /etc/foreman-proxy/dns.key
        remote_src: true
        owner: foreman-proxy
        group: foreman-proxy
        mode: "0600"
      when: not foreman_proxy_dns_key.stat.exists

    - name: STEP 7 - Remove original generated DNSSEC key
      ansible.builtin.file:
        path: "{{ generated_dns_keys.files[0].path }}"
        state: absent
      when: not foreman_proxy_dns_key.stat.exists

    - name: STEP 7 - Ensure DNS key permissions
      ansible.builtin.file:
        path: /etc/foreman-proxy/dns.key
        owner: foreman-proxy
        group: foreman-proxy
        mode: "0600"

    - name: STEP 7 - Configure Foreman DNS proxy
      ansible.builtin.command:
        cmd: >
          foreman-installer --scenario katello
          --foreman-proxy-dns true
          --foreman-proxy-dns-managed false
          --foreman-proxy-dns-provider nsupdate
          --foreman-proxy-dns-server {{ dns_server }}
          --foreman-proxy-dns-forwarders=8.8.8.8,8.8.4.4
          --foreman-proxy-keyfile /etc/foreman-proxy/dns.key
      environment:
        PATH: "{{ java_environment_path }}"

    # ---------------------------------------------------------------
    # CONFIGURE DHCP
    # ---------------------------------------------------------------

    - name: STEP 7 - Configure Foreman DHCP proxy
      ansible.builtin.command:
        cmd: >
          foreman-installer --scenario katello
          --foreman-proxy-dhcp true
          --foreman-proxy-dhcp-managed true
          --foreman-proxy-dhcp-server {{ foreman_server_name }}
          --foreman-proxy-dhcp-gateway {{ dhcp_gateway }}
          --foreman-proxy-dhcp-nameservers {{ dns_server }}
          --foreman-proxy-dhcp-config /etc/dhcp/dhcpd.conf
          --foreman-proxy-dhcp-leases /var/lib/dhcpd/dhcpd.leases
      environment:
        PATH: "{{ java_environment_path }}"

    # ===============================================================
    # STEP 7: FIREWALL
    # ===============================================================

    - name: STEP 7 - Open DHCP firewall service
      ansible.posix.firewalld:
        service: dhcp
        permanent: true
        immediate: true
        state: enabled

    - name: STEP 7 - Open TFTP firewall service
      ansible.posix.firewalld:
        service: tftp
        permanent: true
        immediate: true
        state: enabled

    - name: STEP 7 - Open HTTP firewall service
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled

    - name: STEP 7 - Open HTTPS firewall service
      ansible.posix.firewalld:
        service: https
        permanent: true
        immediate: true
        state: enabled

    - name: STEP 7 - Open Puppet port 8140
      ansible.posix.firewalld:
        port: 8140/tcp
        permanent: true
        immediate: true
        state: enabled

    # ===============================================================
    # STEP 8: DOWNLOAD CENTOS PXE BOOT FILES
    # ===============================================================

    - name: STEP 8 - Create CentOS TFTP directory
      ansible.builtin.file:
        path: "{{ tftp_root }}/centos"
        state: directory
        owner: foreman-proxy
        group: root
        mode: "0755"

    - name: STEP 8 - Download CentOS initrd.img
      ansible.builtin.get_url:
        url: "http://http-server-01/repo/centos/isolinux/initrd.img"
        dest: "{{ tftp_root }}/centos/initrd.img"
        owner: foreman-proxy
        group: root
        mode: "0644"

    - name: STEP 8 - Download CentOS vmlinuz
      ansible.builtin.get_url:
        url: "http://http-server-01/repo/centos/isolinux/vmlinuz"
        dest: "{{ tftp_root }}/centos/vmlinuz"
        owner: foreman-proxy
        group: root
        mode: "0644"

    - name: STEP 8 - Ensure ownership of CentOS TFTP files
      ansible.builtin.file:
        path: "{{ tftp_root }}/centos"
        owner: foreman-proxy
        group: root
        recurse: true

    - name: STEP 8 - Set permissions on CentOS PXE files
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0644"
      loop:
        - "{{ tftp_root }}/centos/initrd.img"
        - "{{ tftp_root }}/centos/vmlinuz"

    # ===============================================================
    # COMPLETED
    # ===============================================================

    - name: Installation completed
      ansible.builtin.debug:
        msg: |
          ============================================================
          Foreman Katello installation completed successfully.
          ============================================================
          Foreman Server : {{ foreman_server_name }}
          Pulp Storage   : {{ pulp_destination }}
          Pulp Mount     : {{ pulp_source }}
          TFTP Root      : {{ tftp_root }}
