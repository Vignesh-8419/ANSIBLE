---
- name: Create and Start Nested ESXi VM in VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # ============================================================
    # VM CONFIGURATION
    # ============================================================

    vm_name: "ESXI-01"

    vm_dir: "/cygdrive/d/ESXI/{{ vm_name }}"
    vm_dir_windows: 'D:\ESXI\{{ vm_name }}'

    vmx_file: "{{ vm_dir }}/{{ vm_name }}.vmx"
    vmx_file_windows: 'D:\ESXI\{{ vm_name }}\{{ vm_name }}.vmx'

    vmdk_file: "{{ vm_dir }}/{{ vm_name }}.vmdk"
    vmdk_file_windows: 'D:\ESXI\{{ vm_name }}\{{ vm_name }}.vmdk'

    # ESXi ISO
    esxi_iso: "/cygdrive/e/vmware/VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso"
    esxi_iso_windows: 'E:\vmware\VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso'

    # VMware Workstation executables
    vmware_dir: "/cygdrive/d/VM workstation"

    vmrun_path: "/cygdrive/d/VM workstation/vmrun.exe"
    vdiskmanager_path: "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"

    # VM resources
    vm_memory_mb: 24568
    vm_cpu: 12
    vm_disk_size: "2000GB"

    # VMware virtual hardware compatibility
    #
    # Version 19 is used instead of 20 because the installed
    # VMware build previously reported:
    # "Unable to load future VM version"
    #
    virtual_hw_version: "19"

    # Networking
    vm_network: "VMnet0"

    # ============================================================
    # FILE LOCATIONS
    # ============================================================

    vmware_log: "{{ vm_dir }}/vmware.log"

  tasks:

    # ============================================================
    # DISPLAY CONFIGURATION
    # ============================================================

    - name: Display ESXi configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM CONFIGURATION"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "ESXi ISO      : {{ esxi_iso }}"
          - "VM Directory  : {{ vm_dir }}"
          - "VMX File      : {{ vmx_file }}"
          - "VMRUN Path    : {{ vmrun_path }}"
          - "VDISK Path    : {{ vdiskmanager_path }}"
          - "RAM           : {{ vm_memory_mb }} MB"
          - "CPU           : {{ vm_cpu }} vCPU"
          - "Disk          : {{ vm_disk_size }}"
          - "Network       : {{ vm_network }}"
          - "Firmware      : EFI"
          - "Hardware Ver  : {{ virtual_hw_version }}"
          - "Nested VT     : ENABLED"
          - "============================================================"

    # ============================================================
    # CHECK REQUIRED FILES
    # ============================================================

    - name: Check ESXi ISO exists
      ansible.builtin.stat:
        path: "{{ esxi_iso }}"
      register: esxi_iso_stat

    - name: Fail when ESXi ISO does not exist
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi ISO NOT FOUND
          ============================================================

          Expected:
          {{ esxi_iso }}

          Update esxi_iso in the playbook.
          ============================================================
      when: not esxi_iso_stat.stat.exists

    - name: Check VMware vmrun.exe exists
      ansible.builtin.stat:
        path: "{{ vmrun_path }}"
      register: vmrun_stat

    - name: Fail when vmrun.exe is not found
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMWARE WORKSTATION vmrun.exe NOT FOUND
          ============================================================

          Expected:
          {{ vmrun_path }}
          ============================================================
      when: not vmrun_stat.stat.exists

    - name: Check VMware vmware-vdiskmanager.exe exists
      ansible.builtin.stat:
        path: "{{ vdiskmanager_path }}"
      register: vdiskmanager_stat

    - name: Fail when vmware-vdiskmanager.exe is not found
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMWARE VDISKMANAGER NOT FOUND
          ============================================================

          Expected:
          {{ vdiskmanager_path }}
          ============================================================
      when: not vdiskmanager_stat.stat.exists

    - name: Display detected VMware paths
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMWARE WORKSTATION DETECTED"
          - "============================================================"
          - "vmrun.exe: {{ vmrun_path }}"
          - "vmware-vdiskmanager.exe: {{ vdiskmanager_path }}"
          - "============================================================"

    # ============================================================
    # CREATE VM DIRECTORY
    # ============================================================

    - name: Create ESXi VM directory
      ansible.builtin.file:
        path: "{{ vm_dir }}"
        state: directory
        mode: "0755"

    # ============================================================
    # CHECK EXISTING VM FILES
    # ============================================================

    - name: Check whether VMX file already exists
      ansible.builtin.stat:
        path: "{{ vmx_file }}"
      register: vmx_stat

    - name: Check whether virtual disk already exists
      ansible.builtin.stat:
        path: "{{ vmdk_file }}"
      register: vmdk_stat

    # ============================================================
    # STOP VM IF ALREADY RUNNING
    # ============================================================

    - name: Check whether VM is running
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "list"
      register: vmrun_list
      changed_when: false
      failed_when: false

    - name: Set ESXi VM running status
      ansible.builtin.set_fact:
        esxi_vm_running: "{{ vmx_file_windows in vmrun_list.stdout }}"

    - name: Stop existing ESXi VM before configuration
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "soft"
      when: esxi_vm_running | bool
      register: vm_stop
      failed_when: false
      changed_when: vm_stop.rc == 0

    - name: Wait after stopping ESXi VM
      ansible.builtin.pause:
        seconds: 5
      when: esxi_vm_running | bool

    # ============================================================
    # REMOVE OLD VMWARE STATE AND LOCK FILES
    # ============================================================

    - name: Find stale VMware lock directories
      ansible.builtin.find:
        paths: "{{ vm_dir }}"
        patterns: "*.lck"
        file_type: directory
      register: stale_lock_dirs

    - name: Remove stale VMware lock directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ stale_lock_dirs.files }}"

    - name: Find stale VMware state files
      ansible.builtin.find:
        paths: "{{ vm_dir }}"
        patterns:
          - "*.vmem"
          - "*.vmss"
          - "*.vmx.lck"
          - "*.vmdk.lck"
        file_type: file
      register: stale_state_files

    - name: Remove stale VMware state files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ stale_state_files.files }}"

    # ============================================================
    # CREATE VIRTUAL DISK
    # ============================================================

    - name: Create ESXi virtual disk
      ansible.builtin.command:
        argv:
          - "{{ vdiskmanager_path }}"
          - "-c"
          - "-s"
          - "{{ vm_disk_size }}"
          - "-a"
          - "lsilogic"
          - "-t"
          - "0"
          - "{{ vmdk_file_windows }}"
      when: not vmdk_stat.stat.exists
      register: create_disk

    - name: Display virtual disk creation result
      ansible.builtin.debug:
        msg: "{{ create_disk.stdout_lines | default(['Virtual disk already exists']) }}"

    # ============================================================
    # CREATE / UPDATE VMX
    # ============================================================

    - name: Create ESXi VMware VMX configuration
      ansible.builtin.copy:
        dest: "{{ vmx_file }}"
        mode: "0644"
        content: |
          .encoding = "windows-1252"

          config.version = "8"
          virtualHW.version = "{{ virtual_hw_version }}"

          displayName = "{{ vm_name }}"
          guestOS = "vmkernel7"

          firmware = "efi"

          memsize = "{{ vm_memory_mb }}"
          numvcpus = "{{ vm_cpu }}"
          cpuid.coresPerSocket = "{{ vm_cpu }}"

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "{{ vm_name }}.vmdk"
          scsi0:0.deviceType = "disk"

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "{{ esxi_iso_windows }}"
          ide1:0.startConnected = "TRUE"

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "{{ vm_network }}"
          ethernet0.startConnected = "TRUE"

          usb.present = "TRUE"
          usb_xhci.present = "TRUE"

          powerType.powerOn = "soft"
          powerType.powerOff = "soft"
          powerType.reset = "soft"

          nvram = "{{ vm_name }}.nvram"

          uuid.action = "create"

          tools.syncTime = "FALSE"

          isolation.tools.copy.disable = "FALSE"
          isolation.tools.paste.disable = "FALSE"
      register: vmx_write

    # ============================================================
    # VERIFY VMX CONFIGURATION
    # ============================================================

    - name: Read VMX hardware version
      ansible.builtin.command:
        argv:
          - "grep"
          - "virtualHW.version"
          - "{{ vmx_file }}"
      register: vmx_hw_version
      changed_when: false

    - name: Read VMX guest OS
      ansible.builtin.command:
        argv:
          - "grep"
          - "guestOS"
          - "{{ vmx_file }}"
      register: vmx_guest_os
      changed_when: false

    - name: Display verified VMX configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMX CONFIGURATION VERIFIED"
          - "============================================================"
          - "{{ vmx_hw_version.stdout }}"
          - "{{ vmx_guest_os.stdout }}"
          - "============================================================"

    - name: Fail if VMX hardware version is incorrect
      ansible.builtin.fail:
        msg: |
          VMX hardware version verification failed.

          Expected:
          virtualHW.version = "{{ virtual_hw_version }}"

          Found:
          {{ vmx_hw_version.stdout }}
      when: ('virtualHW.version = "' ~ virtual_hw_version ~ '"') not in vmx_hw_version.stdout

    # ============================================================
    # CHECK VMWARE COMPATIBILITY BEFORE STARTING
    # ============================================================

    - name: Display VMware vmrun version information
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-h"
      register: vmrun_help
      changed_when: false
      failed_when: false

    - name: Display VMware information
      ansible.builtin.debug:
        msg: "{{ vmrun_help.stdout_lines[0:10] | default([]) }}"

    # ============================================================
    # START NESTED ESXi VM
    # ============================================================

    - name: Start Nested ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "start"
          - "{{ vmx_file_windows }}"
          - "nogui"
      register: vm_start
      changed_when: vm_start.rc == 0
      failed_when: false

    # ============================================================
    # WAIT FOR VMWARE TO INITIALIZE
    # ============================================================

    - name: Wait for VMware startup processing
      ansible.builtin.pause:
        seconds: 10
      when: vm_start.rc == 0

    # ============================================================
    # VERIFY VM RUNNING STATUS
    # ============================================================

    - name: Get running VMware virtual machines
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "list"
      register: vmrun_list_after
      changed_when: false
      failed_when: false

    - name: Set final ESXi VM running status
      ansible.builtin.set_fact:
        esxi_vm_running_after: "{{ vmx_file_windows in vmrun_list_after.stdout }}"

    # ============================================================
    # GET VMWARE LOG ON FAILURE
    # ============================================================

    - name: Check VMware log exists
      ansible.builtin.stat:
        path: "{{ vmware_log }}"
      register: vmware_log_stat
      when: not esxi_vm_running_after | bool

    - name: Read last 100 lines of VMware log
      ansible.builtin.command:
        argv:
          - "tail"
          - "-100"
          - "{{ vmware_log }}"
      register: vmware_log_output
      changed_when: false
      failed_when: false
      when:
        - not esxi_vm_running_after | bool
        - vmware_log_stat.stat.exists

    - name: Extract important VMware errors
      ansible.builtin.shell: |
        grep -iE \
        "error|failed|fail|cancel|future VM version|hardware version|vt-x|amd-v|hyper-v|virtualization|module" \
        "{{ vmware_log }}" | tail -50
      args:
        executable: /bin/bash
      register: vmware_errors
      changed_when: false
      failed_when: false
      when:
        - not esxi_vm_running_after | bool
        - vmware_log_stat.stat.exists

    # ============================================================
    # FAIL WITH FULL TROUBLESHOOTING INFORMATION
    # ============================================================

    - name: Fail with VMware troubleshooting information
      ansible.builtin.fail:
        msg: |
          ============================================================
          FAILED TO START NESTED ESXi VM
          ============================================================

          VMX:
          {{ vmx_file_windows }}

          VMware hardware version:
          {{ vmx_hw_version.stdout }}

          vmrun return code:
          {{ vm_start.rc }}

          vmrun output:
          {{ vm_start.stdout | default('No stdout') }}

          {{ vm_start.stderr | default('No stderr') }}

          ------------------------------------------------------------
          IMPORTANT VMWARE LOG ERRORS
          ------------------------------------------------------------

          {{ vmware_errors.stdout | default('No matching errors found') }}

          ------------------------------------------------------------
          LAST VMWARE LOG ENTRIES
          ------------------------------------------------------------

          {{ vmware_log_output.stdout | default('VMware log was not available') }}

          ============================================================
          NEXT ACTION
          ============================================================

          If the log contains:

          "The virtual machine is using a hardware version that is not
          supported by this version of VMware Workstation"

          then change:

          virtual_hw_version

          in this playbook to a version supported by your installed
          VMware Workstation.

          Current configured version:
          {{ virtual_hw_version }}

          ============================================================
      when: not esxi_vm_running_after | bool

    # ============================================================
    # FINAL SUCCESS SUMMARY
    # ============================================================

    - name: Display successful Nested ESXi VM summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM STARTED SUCCESSFULLY"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "VMX           : {{ vmx_file_windows }}"
          - "Virtual Disk  : {{ vmdk_file_windows }}"
          - "ESXi ISO      : {{ esxi_iso_windows }}"
          - "Hardware Ver  : {{ virtual_hw_version }}"
          - "RAM           : {{ vm_memory_mb }} MB"
          - "CPU           : {{ vm_cpu }} vCPU"
          - "Disk          : {{ vm_disk_size }}"
          - "Network       : {{ vm_network }}"
          - "Firmware      : EFI"
          - "Nested VT     : ENABLED"
          - "Status        : RUNNING"
          - "============================================================"
      when: esxi_vm_running_after | bool
