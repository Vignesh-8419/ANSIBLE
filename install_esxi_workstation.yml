---
- name: Create and Start Nested ESXi VM in VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # ============================================================
    # VM CONFIGURATION
    # ============================================================
    vm_name: "ESXI-01"

    vm_dir: "/cygdrive/d/ESXI/ESXI-01"
    vmx_file: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmx"
    vmdk_file: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmdk"

    # Windows paths used inside VMware commands / VMX
    vm_dir_win: 'D:\ESXI\ESXI-01'
    vmx_file_win: 'D:\ESXI\ESXI-01\ESXI-01.vmx'
    vmdk_file_win: 'D:\ESXI\ESXI-01\ESXI-01.vmdk'

    # ESXi ISO
    esxi_iso: "/cygdrive/e/vmware/VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso"
    esxi_iso_win: 'E:\vmware\VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso'

    # VMware Workstation executables
    vmrun_path: "/cygdrive/d/VM workstation/vmrun.exe"
    vdiskmanager_path: "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"

    # ============================================================
    # VM HARDWARE
    # ============================================================
    vm_memory_mb: 24568
    vm_cpus: 12
    vm_disk_gb: 2000

    # VMware Workstation build 20089737 supports this configuration
    virtual_hw_version: "19"

    vm_guest_os: "vmkernel7"
    vm_network: "VMnet0"

    # ============================================================
    # VMX CONFIGURATION
    # ============================================================
    vmx_content: |
      .encoding = "windows-1252"
      config.version = "8"
      virtualHW.version = "{{ virtual_hw_version }}"

      displayName = "{{ vm_name }}"
      guestOS = "{{ vm_guest_os }}"

      memsize = "{{ vm_memory_mb }}"
      numvcpus = "{{ vm_cpus }}"

      firmware = "efi"

      # ------------------------------------------------------------
      # NESTED VIRTUALIZATION
      # ------------------------------------------------------------
      vhv.enable = "TRUE"
      hypervisor.cpuid.v0 = "FALSE"

      # ------------------------------------------------------------
      # VM SETTINGS
      # ------------------------------------------------------------
      powerType.powerOff = "soft"
      powerType.reset = "soft"
      powerType.suspend = "soft"

      tools.upgrade.policy = "manual"

      # ------------------------------------------------------------
      # SCSI CONTROLLER
      # ------------------------------------------------------------
      scsi0.present = "TRUE"
      scsi0.virtualDev = "lsisas1068"

      scsi0:0.present = "TRUE"
      scsi0:0.fileName = "{{ vmdk_file_win }}"
      scsi0:0.deviceType = "scsi-hardDisk"

      # ------------------------------------------------------------
      # ESXi ISO
      # ------------------------------------------------------------
      ide1:0.present = "TRUE"
      ide1:0.deviceType = "cdrom-image"
      ide1:0.fileName = "{{ esxi_iso_win }}"
      ide1:0.startConnected = "TRUE"

      # ------------------------------------------------------------
      # NETWORK
      # ------------------------------------------------------------
      ethernet0.present = "TRUE"
      ethernet0.connectionType = "bridged"
      ethernet0.vnet = "{{ vm_network }}"
      ethernet0.virtualDev = "e1000e"
      ethernet0.addressType = "generated"
      ethernet0.wakeOnPcktRcv = "FALSE"

      # ------------------------------------------------------------
      # USB DISABLED
      #
      # IMPORTANT:
      # VMware log previously showed:
      # No PCIe slot available for usb_xhci
      #
      # Therefore USB and USB xHCI are completely disabled.
      # ------------------------------------------------------------
      usb.present = "FALSE"
      usb_xhci.present = "FALSE"

      # ------------------------------------------------------------
      # SOUND DISABLED
      # ------------------------------------------------------------
      sound.present = "FALSE"

      # ------------------------------------------------------------
      # FLOPPY DISABLED
      # ------------------------------------------------------------
      floppy0.present = "FALSE"

      # ------------------------------------------------------------
      # SERIAL / PARALLEL DISABLED
      # ------------------------------------------------------------
      serial0.present = "FALSE"
      parallel0.present = "FALSE"

      # ------------------------------------------------------------
      # DISPLAY
      # ------------------------------------------------------------
      svga.present = "TRUE"
      svga.vramSize = "134217728"

      # ------------------------------------------------------------
      # VMWARE IDENTIFIERS
      # ------------------------------------------------------------
      uuid.action = "create"

  tasks:

    # ============================================================
    # DISPLAY CONFIGURATION
    # ============================================================

    - name: Display ESXi configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM CONFIGURATION"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "ESXi ISO      : {{ esxi_iso }}"
          - "VM Directory  : {{ vm_dir }}"
          - "VMX File      : {{ vmx_file }}"
          - "VMRUN Path    : {{ vmrun_path }}"
          - "VDISK Path    : {{ vdiskmanager_path }}"
          - "RAM           : {{ vm_memory_mb }} MB"
          - "CPU           : {{ vm_cpus }} vCPU"
          - "Disk          : {{ vm_disk_gb }} GB"
          - "Network       : {{ vm_network }}"
          - "Firmware      : EFI"
          - "Hardware Ver  : {{ virtual_hw_version }}"
          - "Nested VT     : ENABLED"
          - "USB           : DISABLED"
          - "USB xHCI      : DISABLED"
          - "============================================================"

    # ============================================================
    # VALIDATE FILES
    # ============================================================

    - name: Check ESXi ISO exists
      ansible.builtin.stat:
        path: "{{ esxi_iso }}"
      register: esxi_iso_stat

    - name: Fail when ESXi ISO does not exist
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi ISO NOT FOUND
          ============================================================

          Expected ISO:

          {{ esxi_iso }}

          ============================================================
      when: not esxi_iso_stat.stat.exists

    - name: Check VMware vmrun.exe exists
      ansible.builtin.stat:
        path: "{{ vmrun_path }}"
      register: vmrun_stat

    - name: Fail when vmrun.exe is not found
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMware vmrun.exe NOT FOUND
          ============================================================

          Expected:

          {{ vmrun_path }}

          ============================================================
      when: not vmrun_stat.stat.exists

    - name: Check VMware vmware-vdiskmanager.exe exists
      ansible.builtin.stat:
        path: "{{ vdiskmanager_path }}"
      register: vdiskmanager_stat

    - name: Fail when vmware-vdiskmanager.exe is not found
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMware vmware-vdiskmanager.exe NOT FOUND
          ============================================================

          Expected:

          {{ vdiskmanager_path }}

          ============================================================
      when: not vdiskmanager_stat.stat.exists

    - name: Display detected VMware paths
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMWARE WORKSTATION DETECTED"
          - "============================================================"
          - "vmrun.exe: {{ vmrun_path }}"
          - "vmware-vdiskmanager.exe: {{ vdiskmanager_path }}"
          - "============================================================"

    # ============================================================
    # CREATE VM DIRECTORY
    # ============================================================

    - name: Create ESXi VM directory
      ansible.builtin.file:
        path: "{{ vm_dir }}"
        state: directory
        mode: "0755"

    # ============================================================
    # CHECK EXISTING FILES
    # ============================================================

    - name: Check whether VMX file already exists
      ansible.builtin.stat:
        path: "{{ vmx_file }}"
      register: vmx_stat

    - name: Check whether virtual disk already exists
      ansible.builtin.stat:
        path: "{{ vmdk_file }}"
      register: vmdk_stat

    # ============================================================
    # CHECK WHETHER VM IS RUNNING
    # ============================================================

    - name: Check whether VM is running
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "list"
      register: vmrun_list_before
      changed_when: false
      failed_when: false

    - name: Set ESXi VM running status
      ansible.builtin.set_fact:
        vm_running: >-
          {{
            vmx_file_win | lower
            in
            (vmrun_list_before.stdout | lower)
          }}

    - name: Display existing VM status
      ansible.builtin.debug:
        msg: "VM {{ vm_name }} currently running: {{ vm_running }}"

    # ============================================================
    # STOP VM BEFORE CHANGING CONFIGURATION
    # ============================================================

    - name: Stop existing ESXi VM before configuration
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "stop"
          - "{{ vmx_file_win }}"
          - "hard"
      register: stop_vm_result
      when: vm_running
      changed_when: stop_vm_result.rc == 0
      failed_when: false

    - name: Wait after stopping ESXi VM
      ansible.builtin.pause:
        seconds: 5
      when: vm_running

    # ============================================================
    # REMOVE STALE VMWARE LOCK DIRECTORIES
    # ============================================================

    - name: Find stale VMware lock directories
      ansible.builtin.find:
        paths: "{{ vm_dir }}"
        file_type: directory
        patterns:
          - "*.lck"
      register: stale_lock_dirs
      failed_when: false

    - name: Remove stale VMware lock directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ stale_lock_dirs.files | default([]) }}"
      when: (stale_lock_dirs.matched | default(0) | int) > 0

    # ============================================================
    # REMOVE STALE VMWARE STATE FILES
    #
    # IMPORTANT:
    # file_type and patterns are inside ansible.builtin.find.
    # This fixes:
    # conflicting action statements: ansible.builtin.find, file_type
    # ============================================================

    - name: Find stale VMware state files
      ansible.builtin.find:
        paths: "{{ vm_dir }}"
        file_type: file
        patterns:
          - "*.vmss"
          - "*.vmem"
          - "*.vmx~"
          - "*.scoreboard"
      register: stale_state_files
      failed_when: false

    - name: Remove stale VMware state files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ stale_state_files.files | default([]) }}"
      when: (stale_state_files.matched | default(0) | int) > 0

    # ============================================================
    # CREATE VIRTUAL DISK
    # ============================================================

    - name: Create ESXi virtual disk
      ansible.builtin.command:
        argv:
          - "{{ vdiskmanager_path }}"
          - "-c"
          - "-s"
          - "{{ vm_disk_gb }}GB"
          - "-a"
          - "lsilogic"
          - "-t"
          - "1"
          - "{{ vmdk_file }}"
      register: create_disk_result
      when: not vmdk_stat.stat.exists
      changed_when: create_disk_result.rc == 0

    - name: Display virtual disk creation result
      ansible.builtin.debug:
        msg:
          - "{{ create_disk_result.stdout | default('Virtual disk already exists. Disk creation skipped.') }}"
      when: not vmdk_stat.stat.exists

    - name: Display existing virtual disk status
      ansible.builtin.debug:
        msg: "Virtual disk already exists: {{ vmdk_file }}"
      when: vmdk_stat.stat.exists

    # ============================================================
    # CREATE VMX CONFIGURATION
    # ============================================================

    - name: Create ESXi VMware VMX configuration
      ansible.builtin.copy:
        dest: "{{ vmx_file }}"
        content: "{{ vmx_content }}"
        mode: "0644"

    # ============================================================
    # VERIFY VMX CONFIGURATION
    # ============================================================

    - name: Read VMX hardware version
      ansible.builtin.command:
        argv:
          - "grep"
          - "virtualHW.version"
          - "{{ vmx_file }}"
      register: vmx_hw_check
      changed_when: false

    - name: Read VMX guest OS
      ansible.builtin.command:
        argv:
          - "grep"
          - "guestOS"
          - "{{ vmx_file }}"
      register: vmx_guest_check
      changed_when: false

    - name: Read VMX USB configuration
      ansible.builtin.command:
        argv:
          - "grep"
          - "-E"
          - "^usb\\.present|^usb_xhci\\.present"
          - "{{ vmx_file }}"
      register: vmx_usb_check
      changed_when: false
      failed_when: false

    - name: Display verified VMX configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMX CONFIGURATION VERIFIED"
          - "============================================================"
          - "{{ vmx_hw_check.stdout }}"
          - "{{ vmx_guest_check.stdout }}"
          - "{{ vmx_usb_check.stdout }}"
          - "============================================================"

    - name: Fail if VMX hardware version is incorrect
      ansible.builtin.fail:
        msg: |
          VMware hardware version verification failed.

          Expected:
          virtualHW.version = "{{ virtual_hw_version }}"

          Found:
          {{ vmx_hw_check.stdout }}
      when: >
        ('virtualHW.version = "' ~ virtual_hw_version ~ '"')
        not in vmx_hw_check.stdout

    # ============================================================
    # DISPLAY VMWARE VERSION
    # ============================================================

    - name: Display VMware vmrun version information
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-h"
      register: vmrun_version
      changed_when: false
      failed_when: false

    - name: Display VMware information
      ansible.builtin.debug:
        msg: "{{ vmrun_version.stdout_lines + vmrun_version.stderr_lines }}"

    # ============================================================
    # START NESTED ESXi
    # ============================================================

    - name: Start Nested ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "start"
          - "{{ vmx_file_win }}"
          - "nogui"
      register: start_vm_result
      changed_when: start_vm_result.rc == 0
      failed_when: false

    - name: Display VMware start command result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMWARE START RESULT"
          - "============================================================"
          - "Return code: {{ start_vm_result.rc }}"
          - "STDOUT:"
          - "{{ start_vm_result.stdout }}"
          - "STDERR:"
          - "{{ start_vm_result.stderr }}"
          - "============================================================"

    # ============================================================
    # WAIT FOR VMWARE STARTUP
    # ============================================================

    - name: Wait for VMware startup processing
      ansible.builtin.pause:
        seconds: 10
      when: start_vm_result.rc == 0

    # ============================================================
    # CHECK FINAL VM STATUS
    # ============================================================

    - name: Get running VMware virtual machines
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "list"
      register: vmrun_list_after
      changed_when: false
      failed_when: false

    - name: Set final ESXi VM running status
      ansible.builtin.set_fact:
        final_vm_running: >-
          {{
            vmx_file_win | lower
            in
            (vmrun_list_after.stdout | lower)
          }}

    - name: Display final VM status
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi VM STATUS"
          - "============================================================"
          - "VM Name  : {{ vm_name }}"
          - "VMX      : {{ vmx_file_win }}"
          - "Running  : {{ final_vm_running }}"
          - "============================================================"

    # ============================================================
    # READ VMWARE LOG
    # ============================================================

    - name: Check VMware log exists
      ansible.builtin.stat:
        path: "{{ vm_dir }}/vmware.log"
      register: vmware_log_stat

    - name: Read last 100 lines of VMware log
      ansible.builtin.shell: |
        tail -100 "{{ vm_dir }}/vmware.log"
      register: vmware_log_tail
      changed_when: false
      failed_when: false
      when: vmware_log_stat.stat.exists

    - name: Extract important VMware errors
      ansible.builtin.shell: |
        grep -iE "error|failed|failure|cancel|power on failed|unsupported|pci|xhci|slot|vt-x|amd-v|hyper-v|virtualization" \
        "{{ vm_dir }}/vmware.log" | tail -80
      register: vmware_log_errors
      changed_when: false
      failed_when: false
      when: vmware_log_stat.stat.exists

    # ============================================================
    # FAIL WITH DETAILED INFORMATION
    # ============================================================

    - name: Fail with VMware troubleshooting information
      ansible.builtin.fail:
        msg: |
          ============================================================
          FAILED TO START NESTED ESXi VM
          ============================================================

          VMX:

          {{ vmx_file_win }}

          VMware hardware version:

          {{ vmx_hw_check.stdout }}

          vmrun return code:

          {{ start_vm_result.rc }}

          vmrun output:

          {{ start_vm_result.stdout }}

          {{ start_vm_result.stderr }}

          ------------------------------------------------------------
          IMPORTANT VMWARE LOG ERRORS
          ------------------------------------------------------------

          {{ vmware_log_errors.stdout | default('No VMware errors found.') }}

          ------------------------------------------------------------
          LAST VMWARE LOG ENTRIES
          ------------------------------------------------------------

          {{ vmware_log_tail.stdout | default('VMware log not found.') }}

          ============================================================
          ============================================================

          IMPORTANT:

          This playbook uses:

          virtualHW.version = "{{ virtual_hw_version }}"

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"

          Nested virtualization:

          vhv.enable = "TRUE"

          If VMware still cannot start the VM, manually check:

          1. VMware Workstation opens normally.
          2. The ESXi ISO exists.
          3. The VMX file is not open in another VMware process.
          4. No *.lck directories remain.
          5. Intel VT-x / AMD-V is enabled in BIOS.
          6. Hyper-V/VBS/Memory Integrity is not conflicting.
          7. VMnet0 exists if bridged networking is required.

          ============================================================
      when: not final_vm_running

    # ============================================================
    # SUCCESS
    # ============================================================

    - name: Display successful ESXi startup
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS - NESTED ESXi VM IS RUNNING"
          - "============================================================"
          - "VM Name : {{ vm_name }}"
          - "VMX     : {{ vmx_file_win }}"
          - "RAM     : {{ vm_memory_mb }} MB"
          - "CPU     : {{ vm_cpus }} vCPU"
          - "Disk    : {{ vm_disk_gb }} GB"
          - "============================================================"
      when: final_vm_running
