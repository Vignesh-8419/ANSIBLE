---
- name: Automated Nested ESXi 8.0U1 Installation - VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ========================================================================
    # ANSIBLE LOCAL TEMP
    # ========================================================================

    ansible_remote_tmp: "{{ lookup('env', 'HOME') }}/.ansible/tmp"

    # ========================================================================
    # VM
    # ========================================================================

    vm_name: "ESXI-01"

    vm_dir_cygwin: "/cygdrive/d/ESXI/ESXI-01"

    vmx_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmx"

    vmdk_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmdk"

    vmware_log_cygwin: "/cygdrive/d/ESXI/ESXI-01/vmware.log"

    vmx_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmx'

    vmdk_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmdk'

    # ========================================================================
    # ESXi ISO
    # ========================================================================

    esxi_iso_cygwin: "/cygdrive/e/vmware/ESXi-8.0.1-auto.iso"

    esxi_iso_windows: 'E:\vmware\ESXi-8.0.1-auto.iso'

    # ========================================================================
    # HTTP KICKSTART
    # ========================================================================

    ks_url: "http://http-server-01.vgs.com/repo/ks.cfg"

    expected_kernelopt: >-
      kernelopt=runweasel
      cdromBoot
      ks=http://http-server-01.vgs.com/repo/ks.cfg

    # ========================================================================
    # VMWARE WORKSTATION
    # ========================================================================

    vmrun_cygwin: "/cygdrive/d/VM workstation/vmrun.exe"

    vmware_cygwin: "/cygdrive/d/VM workstation/vmware.exe"

    vdiskmanager_cygwin: "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"

    vmware_windows: 'D:\VM workstation\vmware.exe'

    # ========================================================================
    # VM HARDWARE
    # ========================================================================

    vm_memory_mb: 24568

    vm_vcpu: 12

    vm_disk_gb: 2000

    virtual_hw_version: "19"

    guest_os: "vmkernel7"

    # ========================================================================
    # NETWORK
    # ========================================================================

    vm_network_type: "custom"

    vm_network_name: "VMnet0"

    esxi_ip: "192.168.253.128"

    esxi_netmask: "255.255.255.0"

    esxi_gateway: "192.168.253.2"

    esxi_dns: "192.168.253.1"

    esxi_hostname: "esxi-host-01.vgs.com"

    # ========================================================================
    # WAIT TIMES
    # ========================================================================

    initial_vm_wait: 20

    installation_wait: 480

    final_boot_wait: 30

    vm_shutdown_wait: 15

    esxi_https_timeout: 300

  pre_tasks:

    # ========================================================================
    # CREATE ANSIBLE TEMP DIRECTORY
    # ========================================================================

    - name: Create Ansible temporary directory
      ansible.builtin.raw: |
        mkdir -p "$HOME/.ansible/tmp"
        chmod 700 "$HOME/.ansible/tmp"
      changed_when: false

    # ========================================================================
    # DISPLAY
    # ========================================================================

    - name: Display complete configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AUTOMATED NESTED ESXi INSTALLATION"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "VMX           : {{ vmx_file_windows }}"
          - "VMDK          : {{ vmdk_file_windows }}"
          - "ISO           : {{ esxi_iso_windows }}"
          - "KS URL        : {{ ks_url }}"
          - "RAM           : {{ vm_memory_mb }} MB"
          - "CPU           : {{ vm_vcpu }} vCPU"
          - "Disk          : {{ vm_disk_gb }} GB"
          - "Hardware      : {{ virtual_hw_version }}"
          - "Firmware      : EFI"
          - "Nested VT     : ENABLED"
          - "Network       : CUSTOM / {{ vm_network_name }}"
          - "ESXi IP       : {{ esxi_ip }}"
          - "Netmask       : {{ esxi_netmask }}"
          - "Gateway       : {{ esxi_gateway }}"
          - "DNS           : {{ esxi_dns }}"
          - "Hostname      : {{ esxi_hostname }}"
          - "============================================================"

  tasks:

    # ========================================================================
    # CHECK ISO
    # ========================================================================

    - name: Check ESXi customized ISO
      ansible.builtin.stat:
        path: "{{ esxi_iso_cygwin }}"
      register: iso_stat

    - name: Fail when ESXi customized ISO is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi CUSTOMIZED ISO NOT FOUND
          ============================================================

          Expected:

          {{ esxi_iso_windows }}

          ============================================================
      when: not iso_stat.stat.exists

    # ========================================================================
    # CHECK VMRUN
    # ========================================================================

    - name: Check vmrun.exe
      ansible.builtin.stat:
        path: "{{ vmrun_cygwin }}"
      register: vmrun_stat

    - name: Fail when vmrun.exe is missing
      ansible.builtin.fail:
        msg: |
          vmrun.exe not found:

          {{ vmrun_cygwin }}
      when: not vmrun_stat.stat.exists

    # ========================================================================
    # CHECK VMWARE.EXE
    # ========================================================================

    - name: Check VMware Workstation executable
      ansible.builtin.stat:
        path: "{{ vmware_cygwin }}"
      register: vmware_stat

    - name: Fail when VMware Workstation executable is missing
      ansible.builtin.fail:
        msg: |
          VMware Workstation executable not found:

          {{ vmware_windows }}
      when: not vmware_stat.stat.exists

    # ========================================================================
    # CHECK VDISKMANAGER
    # ========================================================================

    - name: Check VMware vdiskmanager
      ansible.builtin.stat:
        path: "{{ vdiskmanager_cygwin }}"
      register: vdiskmanager_stat

    - name: Fail when vdiskmanager is missing
      ansible.builtin.fail:
        msg: |
          vmware-vdiskmanager.exe not found:

          {{ vdiskmanager_cygwin }}
      when: not vdiskmanager_stat.stat.exists

    # ========================================================================
    # CHECK HTTP KS.CFG
    # ========================================================================

    - name: Check HTTP KS.CFG
      ansible.builtin.command:
        argv:
          - curl
          - -fsS
          - "{{ ks_url }}"
      register: ks_http_result
      changed_when: false
      failed_when: false

    - name: Fail when HTTP KS.CFG is unavailable
      ansible.builtin.fail:
        msg: |
          ============================================================
          HTTP KS.CFG NOT AVAILABLE
          ============================================================

          URL:

          {{ ks_url }}

          curl return code:

          {{ ks_http_result.rc }}

          curl output:

          {{ ks_http_result.stdout }}

          curl error:

          {{ ks_http_result.stderr }}

          ============================================================
      when: ks_http_result.rc != 0

    - name: Display HTTP KS.CFG validation
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "HTTP KS.CFG VALIDATION"
          - "============================================================"
          - "URL    : {{ ks_url }}"
          - "Status : HTTP ACCESS OK"
          - "============================================================"

    # ========================================================================
    # CHECK KS CONTENT
    # ========================================================================

    - name: Validate HTTP KS.CFG content
      ansible.builtin.assert:
        that:
          - "'vmaccepteula' in ks_http_result.stdout"
          - "'rootpw ' in ks_http_result.stdout"
          - "'network --bootproto=static' in ks_http_result.stdout"
          - "'192.168.253.128' in ks_http_result.stdout"
          - "'255.255.255.0' in ks_http_result.stdout"
          - "'192.168.253.2' in ks_http_result.stdout"
          - "'192.168.253.1' in ks_http_result.stdout"
          - "'esxi-host-01.vgs.com' in ks_http_result.stdout"
          - "'vmnic0' in ks_http_result.stdout"
          - "'install --firstdisk --overwritevmfs' in ks_http_result.stdout"
          - "'reboot' in ks_http_result.stdout"
        fail_msg: |
          HTTP KS.CFG does not contain the expected ESXi configuration.
        success_msg: "HTTP KS.CFG content validated successfully."

    # ========================================================================
    # VERIFY ACTUAL ISO BOOT.CFG
    # ========================================================================

    - name: Extract BOOT.CFG from actual ISO
      ansible.builtin.command:
        argv:
          - 7z
          - e
          - -so
          - "{{ esxi_iso_cygwin }}"
          - BOOT.CFG
      register: iso_boot_cfg
      changed_when: false
      failed_when: iso_boot_cfg.rc != 0

    - name: Extract kernelopt from ISO BOOT.CFG
      ansible.builtin.shell: |
        printf '%s\n' '{{ iso_boot_cfg.stdout }}' |
        grep '^kernelopt='
      args:
        executable: /bin/bash
      register: iso_kernelopt
      changed_when: false
      failed_when: false

    - name: Fail if ISO does not point to HTTP KS.CFG
      ansible.builtin.fail:
        msg: |
          ============================================================
          ISO BOOT.CFG IS INCORRECT
          ============================================================

          Expected:

          kernelopt=runweasel cdromBoot ks=http://http-server-01.vgs.com/repo/ks.cfg

          Found:

          {{ iso_kernelopt.stdout }}

          ============================================================
      when: >
        iso_kernelopt.stdout | trim
        !=
        'kernelopt=runweasel cdromBoot ks=http://http-server-01.vgs.com/repo/ks.cfg'

    - name: Display ISO BOOT.CFG validation
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ISO BOOT.CFG VALIDATION"
          - "============================================================"
          - "{{ iso_kernelopt.stdout }}"
          - "============================================================"

    # ========================================================================
    # CREATE VM DIRECTORY
    # ========================================================================

    - name: Create ESXi VM directory
      ansible.builtin.file:
        path: "{{ vm_dir_cygwin }}"
        state: directory
        mode: "0755"

    # ========================================================================
    # CHECK CURRENT VM STATE
    # ========================================================================

    - name: Get currently running VMware VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - -T
          - ws
          - list
      register: vmrun_before
      changed_when: false
      failed_when: false

    - name: Determine whether ESXI-01 is running
      ansible.builtin.set_fact:
        esxi_running_before: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_before.stdout | default('') | lower)
          }}

    - name: Display current ESXI-01 state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "CURRENT VM STATE"
          - "============================================================"
          - "ESXI-01 running : {{ esxi_running_before }}"
          - "============================================================"

    # ========================================================================
    # STOP EXISTING VM
    # ========================================================================

    - name: Stop ESXI-01 if already running
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - -T
          - ws
          - stop
          - "{{ vmx_file_windows }}"
          - hard
      register: stop_existing
      changed_when: stop_existing.rc == 0
      failed_when: false
      when: esxi_running_before

    - name: Wait for ESXI-01 shutdown
      ansible.builtin.pause:
        seconds: "{{ vm_shutdown_wait }}"
      when: esxi_running_before

    - name: Verify ESXI-01 stopped
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - -T
          - ws
          - list
      register: vmrun_after_stop
      changed_when: false
      failed_when: false

    - name: Set ESXI-01 stopped state
      ansible.builtin.set_fact:
        esxi_running_after_stop: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_after_stop.stdout | default('') | lower)
          }}

    - name: Fail if ESXI-01 cannot be stopped
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXI-01 IS STILL RUNNING
          ============================================================

          VM:

          {{ vmx_file_windows }}

          vmrun list:

          {{ vmrun_after_stop.stdout }}

          The playbook will not modify the VMX while the VM is active.

          ============================================================
      when:
        - esxi_running_before
        - esxi_running_after_stop

    # ========================================================================
    # REMOVE ONLY STALE LOCKS
    #
    # We do NOT remove the VM directory.
    # We do NOT remove the VMDK.
    # ========================================================================

    - name: Remove stale VMware lock directories
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 2 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # REMOVE STALE VM STATE
    # ========================================================================

    - name: Remove stale VMware runtime state
      ansible.builtin.shell: |
        rm -f "{{ vm_dir_cygwin }}"/*.vmem 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmss 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmsn 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.scoreboard 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmpl 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # CHECK VMDK
    # ========================================================================

    - name: Check existing VMDK
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_stat

    # ========================================================================
    # CREATE VMDK ONLY IF MISSING
    # ========================================================================

    - name: Create ESXi 2TB VMDK
      ansible.builtin.command:
        argv:
          - "{{ vdiskmanager_cygwin }}"
          - -c
          - -s
          - "{{ vm_disk_gb }}GB"
          - -a
          - lsilogic
          - -t
          - "0"
          - "{{ vmdk_file_cygwin }}"
      register: vmdk_create
      changed_when: vmdk_create.rc == 0
      failed_when: vmdk_create.rc != 0
      when: not vmdk_stat.stat.exists

    - name: Verify VMDK exists
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_after

    - name: Fail if VMDK does not exist
      ansible.builtin.fail:
        msg: |
          VMDK was not created/found:

          {{ vmdk_file_cygwin }}
      when: not vmdk_after.stat.exists

    # ========================================================================
    # BACKUP EXISTING VMX
    # ========================================================================

    - name: Check existing VMX
      ansible.builtin.stat:
        path: "{{ vmx_file_cygwin }}"
      register: existing_vmx_stat

    - name: Backup existing VMX
      ansible.builtin.copy:
        src: "{{ vmx_file_cygwin }}"
        dest: "{{ vmx_file_cygwin }}.ansible-backup"
        remote_src: true
        mode: "0644"
      when: existing_vmx_stat.stat.exists

    # ========================================================================
    # INSTALLATION VMX
    #
    # THIS IS THE IMPORTANT INSTALLATION STATE:
    #
    # ISO connected
    # CD/DVD first in EFI boot
    # VMDK second
    # VMnet0
    # ========================================================================

    - name: Create installation VMX
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "UTF-8"

          config.version = "8"
          virtualHW.version = "{{ virtual_hw_version }}"
          virtualHW.productCompatibility = "hosted"

          displayName = "{{ vm_name }}"
          guestOS = "{{ guest_os }}"

          # ==========================================================
          # MEMORY / CPU
          # ==========================================================

          memsize = "{{ vm_memory_mb }}"
          numvcpus = "{{ vm_vcpu }}"
          cpuid.coresPerSocket = "1"

          # ==========================================================
          # EFI
          # ==========================================================

          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"

          # ==========================================================
          # NESTED VIRTUALIZATION
          # ==========================================================

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # ==========================================================
          # SCSI CONTROLLER
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "{{ vmdk_file_windows }}"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ==========================================================
          # ESXi AUTO ISO
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "{{ esxi_iso_windows }}"
          ide1:0.startConnected = "TRUE"
          ide1:0.startConnectAtPowerOn = "TRUE"

          # ==========================================================
          # NETWORK - EXPLICIT VMnet0
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "VMnet0"
          ethernet0.virtualDev = "e1000e"
          ethernet0.addressType = "generated"
          ethernet0.startConnected = "TRUE"

          # ==========================================================
          # DISABLE USB
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"
          ehci.present = "FALSE"

          # ==========================================================
          # DISABLE OTHER DEVICES
          # ==========================================================

          sound.present = "FALSE"
          floppy0.present = "FALSE"
          serial0.present = "FALSE"
          parallel0.present = "FALSE"
          printer0.present = "FALSE"

          # ==========================================================
          # DISPLAY
          # ==========================================================

          svga.present = "TRUE"
          svga.autodetect = "TRUE"

          # ==========================================================
          # INSTALLATION BOOT
          #
          # IMPORTANT:
          # CD/DVD FIRST
          # HARD DISK SECOND
          # ==========================================================

          efi.bootOrder = "cdrom,hdd"
          efi.hddOrder = "scsi0:0"

          # ==========================================================
          # POWER
          # ==========================================================

          powerType.powerOff = "soft"
          powerType.powerOn = "soft"
          powerType.suspend = "soft"
          powerType.reset = "soft"

          tools.upgrade.policy = "manual"
          tools.syncTime = "FALSE"

    # ========================================================================
    # VERIFY INSTALLATION VMX
    # ========================================================================

    - name: Read installation VMX
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: install_vmx_slurp

    - name: Decode installation VMX
      ansible.builtin.set_fact:
        install_vmx_text: "{{ install_vmx_slurp.content | b64decode }}"

    - name: Validate installation VMX
      ansible.builtin.assert:
        that:
          - 'virtualHW.version = "19"' in install_vmx_text
          - 'firmware = "efi"' in install_vmx_text
          - 'vhv.enable = "TRUE"' in install_vmx_text
          - 'scsi0:0.present = "TRUE"' in install_vmx_text
          - 'scsi0:0.fileName = "D:\ESXI\ESXI-01\ESXI-01.vmdk"' in install_vmx_text
          - 'ide1:0.present = "TRUE"' in install_vmx_text
          - 'ide1:0.fileName = "E:\vmware\ESXi-8.0.1-auto.iso"' in install_vmx_text
          - 'ide1:0.startConnected = "TRUE"' in install_vmx_text
          - 'ethernet0.connectionType = "custom"' in install_vmx_text
          - 'ethernet0.vnet = "VMnet0"' in install_vmx_text
          - 'ethernet0.startConnected = "TRUE"' in install_vmx_text
          - 'efi.bootOrder = "cdrom,hdd"' in install_vmx_text
          - 'efi.hddOrder = "scsi0:0"' in install_vmx_text
        fail_msg: |
          Installation VMX validation failed.
        success_msg: |
          Installation VMX is correct.

    - name: Display installation VMX
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "INSTALLATION VMX VERIFIED"
          - "============================================================"
          - "ISO Connected : TRUE"
          - "ISO           : {{ esxi_iso_windows }}"
          - "Boot          : CDROM -> HDD"
          - "HDD           : scsi0:0"
          - "Network       : CUSTOM / VMnet0"
          - "Nested VT     : TRUE"
          - "Firmware      : EFI"
          - "============================================================"

    # ========================================================================
    # START INSTALLATION VM
    # ========================================================================

    - name: Start ESXi installation VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - -T
          - ws
          - start
          - "{{ vmx_file_windows }}"
          - nogui
      register: install_start
      changed_when: install_start.rc == 0
      failed_when: false

    - name: Display installation start result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ESXi INSTALLATION START"
          - "============================================================"
          - "Return Code : {{ install_start.rc }}"
          - "STDOUT      : {{ install_start.stdout }}"
          - "STDERR      : {{ install_start.stderr }}"
          - "============================================================"

    - name: Fail if installation VM did not start
      ansible.builtin.fail:
        msg: |
          ============================================================
          FAILED TO START ESXi INSTALLATION VM
          ============================================================

          vmrun return code:

          {{ install_start.rc }}

          STDOUT:

          {{ install_start.stdout }}

          STDERR:

          {{ install_start.stderr }}

          ============================================================
      when: install_start.rc != 0

    # ========================================================================
    # OPEN VM IN WORKSTATION GUI AFTER VMRUN START
    # ========================================================================

    - name: Open ESXI-01 in VMware Workstation GUI
      ansible.builtin.command:
        argv:
          - powershell.exe
          - -NoProfile
          - -NonInteractive
          - -Command
          - >-
            Start-Process
            -FilePath "{{ vmware_windows }}"
            -ArgumentList @("{{ vmx_file_windows }}")
      register: workstation_open
      changed_when: true
      failed_when: false

    - name: Wait for VMware Workstation
      ansible.builtin.pause:
        seconds: 8

    # ========================================================================
    # INITIAL VM RUNNING CHECK
    # ========================================================================

    - name: Check ESXI-01 running state
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - -T
          - ws
          - list
      register: install_vm_list
      changed_when: false
      failed_when: false

    - name: Determine installation VM running
      ansible.builtin.set_fact:
        installation_vm_running: >-
          {{
            vmx_file_windows | lower
            in
            (install_vm_list.stdout | default('') | lower)
          }}

    - name: Display installation VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "INSTALLATION VM STATE"
          - "============================================================"
          - "Running : {{ installation_vm_running }}"
          - "============================================================"

    - name: Fail if installation VM is not running
      ansible.builtin.fail:
        msg: |
          ESXI-01 did not start.

          vmrun output:

          {{ install_vm_list.stdout }}
      when: not installation_vm_running

    # ========================================================================
    # WAIT FOR ESXi INSTALLATION
    # ========================================================================

    - name: Wait for unattended ESXi installation
      ansible.builtin.pause:
        seconds: "{{ installation_wait }}"

    # ========================================================================
    # STOP INSTALLATION VM
    #
    # The unattended installer should have installed ESXi and rebooted.
    # We now stop the VM and switch it to final disk boot configuration.
    # ========================================================================

    - name: Stop installation VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - -T
          - ws
          - stop
          - "{{ vmx_file_windows }}"
          - hard
      register: install_stop
      changed_when: install_stop.rc == 0
      failed_when: false

    - name: Display installation VM stop result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "INSTALLATION VM STOP"
          - "============================================================"
          - "Return Code : {{ install_stop.rc }}"
          - "STDOUT      : {{ install_stop.stdout }}"
          - "STDERR      : {{ install_stop.stderr }}"
          - "============================================================"

    - name: Wait for installation VM shutdown
      ansible.builtin.pause:
        seconds: "{{ vm_shutdown_wait }}"

    # ========================================================================
    # VERIFY STOPPED
    # ========================================================================

    - name: Check VM list after installation stop
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - -T
          - ws
          - list
      register: post_install_vm_list
      changed_when: false
      failed_when: false

    - name: Determine VM stopped state
      ansible.builtin.set_fact:
        installation_vm_stopped: >-
          {{
            vmx_file_windows | lower
            not in
            (post_install_vm_list.stdout | default('') | lower)
          }}

    - name: Fail if installation VM is still running
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXI-01 IS STILL RUNNING
          ============================================================

          Current vmrun list:

          {{ post_install_vm_list.stdout }}

          ============================================================
      when: not installation_vm_stopped

    # ========================================================================
    # REMOVE LOCKS NOW THAT VM IS STOPPED
    # ========================================================================

    - name: Remove VMware lock directories after installation
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 2 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # BACKUP INSTALLATION VMX
    # ========================================================================

    - name: Backup installation VMX
      ansible.builtin.copy:
        src: "{{ vmx_file_cygwin }}"
        dest: "{{ vmx_file_cygwin }}.installation-backup"
        remote_src: true
        mode: "0644"

    # ========================================================================
    # FINAL VMX
    #
    # IMPORTANT:
    #
    # ISO DISCONNECTED
    # HDD FIRST
    # BOOT scsi0:0
    # VMnet0
    # ========================================================================

    - name: Create final installed ESXi VMX
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "UTF-8"

          config.version = "8"
          virtualHW.version = "{{ virtual_hw_version }}"
          virtualHW.productCompatibility = "hosted"

          displayName = "{{ vm_name }}"
          guestOS = "{{ guest_os }}"

          # ==========================================================
          # MEMORY / CPU
          # ==========================================================

          memsize = "{{ vm_memory_mb }}"
          numvcpus = "{{ vm_vcpu }}"
          cpuid.coresPerSocket = "1"

          # ==========================================================
          # EFI
          # ==========================================================

          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"

          # ==========================================================
          # NESTED VIRTUALIZATION
          # ==========================================================

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # ==========================================================
          # SCSI
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "{{ vmdk_file_windows }}"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ==========================================================
          # CD/DVD
          #
          # Keep device but disconnect the ISO.
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "{{ esxi_iso_windows }}"
          ide1:0.startConnected = "FALSE"
          ide1:0.startConnectAtPowerOn = "FALSE"

          # ==========================================================
          # NETWORK - EXPLICIT VMnet0
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "VMnet0"
          ethernet0.virtualDev = "e1000e"
          ethernet0.addressType = "generated"
          ethernet0.startConnected = "TRUE"

          # ==========================================================
          # DISABLE USB
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"
          ehci.present = "FALSE"

          # ==========================================================
          # DISABLE OTHER DEVICES
          # ==========================================================

          sound.present = "FALSE"
          floppy0.present = "FALSE"
          serial0.present = "FALSE"
          parallel0.present = "FALSE"
          printer0.present = "FALSE"

          # ==========================================================
          # DISPLAY
          # ==========================================================

          svga.present = "TRUE"
          svga.autodetect = "TRUE"

          # ==========================================================
          # FINAL ESXi BOOT
          #
          # HDD FIRST.
          # Installed ESXi is on scsi0:0.
          # ==========================================================

          efi.bootOrder = "hdd"
          efi.hddOrder = "scsi0:0"

          # ==========================================================
          # POWER
          # ==========================================================

          powerType.powerOff = "soft"
          powerType.powerOn = "soft"
          powerType.suspend = "soft"
          powerType.reset = "soft"

          tools.upgrade.policy = "manual"
          tools.syncTime = "FALSE"

    # ========================================================================
    # VERIFY FINAL VMX
    # ========================================================================

    - name: Read final VMX
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: final_vmx_slurp

    - name: Decode final VMX
      ansible.builtin.set_fact:
        final_vmx_text: "{{ final_vmx_slurp.content | b64decode }}"

    - name: Validate final VMX
      ansible.builtin.assert:
        that:
          - 'virtualHW.version = "19"' in final_vmx_text
          - 'firmware = "efi"' in final_vmx_text
          - 'vhv.enable = "TRUE"' in final_vmx_text
          - 'scsi0:0.present = "TRUE"' in final_vmx_text
          - 'scsi0:0.fileName = "D:\ESXI\ESXI-01\ESXI-01.vmdk"' in final_vmx_text
          - 'ide1:0.present = "TRUE"' in final_vmx_text
          - 'ide1:0.startConnected = "FALSE"' in final_vmx_text
          - 'ide1:0.fileName = "E:\vmware\ESXi-8.0.1-auto.iso"' in final_vmx_text
          - 'ethernet0.connectionType = "custom"' in final_vmx_text
          - 'ethernet0.vnet = "VMnet0"' in final_vmx_text
          - 'ethernet0.startConnected = "TRUE"' in final_vmx_text
          - 'efi.bootOrder = "hdd"' in final_vmx_text
          - 'efi.hddOrder = "scsi0:0"' in final_vmx_text
        fail_msg: |
          Final VMX validation failed.
        success_msg: |
          Final VMX validated successfully.

    - name: Display final VMX configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi VMX"
          - "============================================================"
          - "Firmware       : EFI"
          - "Nested VT      : TRUE"
          - "Disk           : scsi0:0"
          - "ISO Connected  : FALSE"
          - "Boot           : HDD"
          - "HDD            : scsi0:0"
          - "Network        : CUSTOM / VMnet0"
          - "============================================================"

    # ========================================================================
    # START FINAL INSTALLED ESXi
    # ========================================================================

    - name: Start final installed ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - -T
          - ws
          - start
          - "{{ vmx_file_windows }}"
          - nogui
      register: final_start
      changed_when: final_start.rc == 0
      failed_when: false

    - name: Display final start result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi START"
          - "============================================================"
          - "Return Code : {{ final_start.rc }}"
          - "STDOUT      : {{ final_start.stdout }}"
          - "STDERR      : {{ final_start.stderr }}"
          - "============================================================"

    - name: Fail when final ESXi VM does not start
      ansible.builtin.fail:
        msg: |
          ============================================================
          FINAL ESXi VM FAILED TO START
          ============================================================

          VMX:

          {{ vmx_file_windows }}

          vmrun return:

          {{ final_start.rc }}

          STDOUT:

          {{ final_start.stdout }}

          STDERR:

          {{ final_start.stderr }}

          ============================================================
      when: final_start.rc != 0

    # ========================================================================
    # OPEN FINAL VM IN WORKSTATION
    # ========================================================================

    - name: Open final ESXi VM in VMware Workstation
      ansible.builtin.command:
        argv:
          - powershell.exe
          - -NoProfile
          - -NonInteractive
          - -Command
          - >-
            Start-Process
            -FilePath "{{ vmware_windows }}"
            -ArgumentList @("{{ vmx_file_windows }}")
      register: final_workstation_open
      changed_when: true
      failed_when: false

    # ========================================================================
    # WAIT FOR ESXi BOOT
    # ========================================================================

    - name: Wait for ESXi to boot
      ansible.builtin.pause:
        seconds: "{{ final_boot_wait }}"

    # ========================================================================
    # CHECK FINAL VM STATE
    # ========================================================================

    - name: Check final VM running state
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - -T
          - ws
          - list
      register: final_vmrun_list
      changed_when: false
      failed_when: false

    - name: Determine final VM state
      ansible.builtin.set_fact:
        final_vm_running: >-
          {{
            vmx_file_windows | lower
            in
            (final_vmrun_list.stdout | default('') | lower)
          }}

    - name: Display final VM running state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL VM STATE"
          - "============================================================"
          - "Running : {{ final_vm_running }}"
          - "============================================================"

    - name: Fail if final VM is not running
      ansible.builtin.fail:
        msg: |
          ============================================================
          FINAL ESXi VM IS NOT RUNNING
          ============================================================

          vmrun list:

          {{ final_vmrun_list.stdout }}

          ============================================================
      when: not final_vm_running

    # ========================================================================
    # WAIT FOR ESXi HTTPS
    # ========================================================================

    - name: Wait for ESXi HTTPS management interface
      ansible.builtin.wait_for:
        host: "{{ esxi_ip }}"
        port: 443
        state: started
        timeout: "{{ esxi_https_timeout }}"
        msg: |
          ESXi did not open HTTPS management port 443 at:

          https://{{ esxi_ip }}

    # ========================================================================
    # OPTIONAL ICMP/PING CHECK
    # ========================================================================

    - name: Test ESXi management IP
      ansible.builtin.command:
        argv:
          - ping
          - -n
          - "2"
          - "{{ esxi_ip }}"
      register: esxi_ping
      changed_when: false
      failed_when: false

    # ========================================================================
    # FINAL SUCCESS
    # ========================================================================

    - name: Display successful ESXi installation
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS - NESTED ESXi INSTALLATION COMPLETE"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "VMX           : {{ vmx_file_windows }}"
          - "VMDK          : {{ vmdk_file_windows }}"
          - "Running       : {{ final_vm_running }}"
          - "Firmware      : EFI"
          - "Nested VT     : ENABLED"
          - "Boot          : INSTALLED HDD / scsi0:0"
          - "ISO Connected : FALSE"
          - "Network       : CUSTOM / VMnet0"
          - "IP            : {{ esxi_ip }}"
          - "Netmask       : {{ esxi_netmask }}"
          - "Gateway       : {{ esxi_gateway }}"
          - "DNS           : {{ esxi_dns }}"
          - "Hostname      : {{ esxi_hostname }}"
          - "ESXi URL      : https://{{ esxi_ip }}"
          - "Ping Result   : {{ esxi_ping.stdout | default('not available') }}"
          - "============================================================"
