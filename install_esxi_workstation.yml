---
- name: Automated Nested ESXi 8.0U1 Installation in VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ========================================================================
    # VM CONFIGURATION
    # ========================================================================

    vm_name: "ESXI-01"

    vm_dir_cygwin: "/cygdrive/d/ESXI/ESXI-01"
    vmx_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmx"
    vmdk_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmdk"
    vmware_log_cygwin: "/cygdrive/d/ESXI/ESXI-01/vmware.log"

    vmx_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmx'
    vmdk_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmdk'

    # ========================================================================
    # ISO CONFIGURATION
    # ========================================================================

    # Customized unattended ISO
    esxi_iso_cygwin: "/cygdrive/e/vmware/ESXi-8.0.1-auto.iso"
    esxi_iso_windows: 'E:\vmware\ESXi-8.0.1-auto.iso'

    # Original ISO - never modified by this playbook
    original_iso_cygwin: "/cygdrive/e/vmware/VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso"

    # ========================================================================
    # VMWARE WORKSTATION
    # ========================================================================

    vmrun_cygwin: "/cygdrive/d/VM workstation/vmrun.exe"
    vdiskmanager_cygwin: "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"

    vmrun_windows: 'D:\VM workstation\vmrun.exe'
    vdiskmanager_windows: 'D:\VM workstation\vmware-vdiskmanager.exe'

    # ========================================================================
    # VM HARDWARE
    # ========================================================================

    vm_memory_mb: 24568
    vm_vcpu: 12
    vm_disk_gb: 2000

    virtual_hw_version: "19"
    guest_os: "vmkernel7"

    # ========================================================================
    # NETWORK
    # ========================================================================

    network_type: "custom"
    network_name: "VMnet0"

    # ========================================================================
    # INSTALLATION TIMING
    # ========================================================================

    vm_start_wait_seconds: 20
    vm_shutdown_wait_seconds: 10

    # Allow ESXi unattended installer enough time.
    esxi_install_wait_seconds: 420

    # ========================================================================
    # VMX VALIDATION STRINGS
    # Keeping these in variables avoids YAML/Jinja quote problems.
    # ========================================================================

    installation_hw_line: 'virtualHW.version = "19"'
    installation_firmware_line: 'firmware = "efi"'
    installation_nested_line: 'vhv.enable = "TRUE"'
    installation_network_type_line: 'ethernet0.connectionType = "custom"'
    installation_network_name_line: 'ethernet0.vnet = "VMnet0"'
    installation_scsi_line: 'scsi0.present = "TRUE"'
    installation_cd_present_line: 'ide1:0.present = "TRUE"'
    installation_cd_connected_line: 'ide1:0.startConnected = "TRUE"'
    installation_boot_line: 'bios.bootDeviceClasses = "cd"'

    final_hw_line: 'virtualHW.version = "19"'
    final_firmware_line: 'firmware = "efi"'
    final_nested_line: 'vhv.enable = "TRUE"'
    final_network_type_line: 'ethernet0.connectionType = "custom"'
    final_network_name_line: 'ethernet0.vnet = "VMnet0"'
    final_scsi_disk_line: 'scsi0:0.present = "TRUE"'
    final_cd_present_line: 'ide1:0.present = "TRUE"'
    final_cd_disconnected_line: 'ide1:0.startConnected = "FALSE"'
    final_boot_line: 'bios.bootDeviceClasses = "allow:all"'

  tasks:

    # ========================================================================
    # DISPLAY CONFIGURATION
    # ========================================================================

    - name: Display ESXi configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AUTOMATED NESTED ESXi INSTALLATION"
          - "============================================================"
          - "VM Name          : {{ vm_name }}"
          - "VMX              : {{ vmx_file_windows }}"
          - "VMDK             : {{ vmdk_file_windows }}"
          - "CUSTOM ISO       : {{ esxi_iso_windows }}"
          - "ORIGINAL ISO     : {{ original_iso_cygwin }}"
          - "RAM              : {{ vm_memory_mb }} MB"
          - "CPU              : {{ vm_vcpu }} vCPU"
          - "Disk             : {{ vm_disk_gb }} GB"
          - "Hardware Version : {{ virtual_hw_version }}"
          - "Firmware         : EFI"
          - "Nested VT        : ENABLED"
          - "Network Type     : {{ network_type }}"
          - "Network          : {{ network_name }}"
          - "USB              : DISABLED"
          - "xHCI             : DISABLED"
          - "Sound            : DISABLED"
          - "Serial           : DISABLED"
          - "Parallel         : DISABLED"
          - "Floppy           : DISABLED"
          - "Install Wait     : {{ esxi_install_wait_seconds }} seconds"
          - "============================================================"

    # ========================================================================
    # VALIDATE ORIGINAL ISO
    # ========================================================================

    - name: Check original ESXi ISO exists
      ansible.builtin.stat:
        path: "{{ original_iso_cygwin }}"
      register: original_iso_stat

    - name: Fail when original ESXi ISO does not exist
      ansible.builtin.fail:
        msg: |
          ============================================================
          ORIGINAL ESXi ISO NOT FOUND
          ============================================================

          Expected:
          {{ original_iso_cygwin }}

          ============================================================
      when: not original_iso_stat.stat.exists

    # ========================================================================
    # VALIDATE CUSTOM ISO
    # ========================================================================

    - name: Check customized ESXi ISO exists
      ansible.builtin.stat:
        path: "{{ esxi_iso_cygwin }}"
      register: custom_iso_stat

    - name: Fail when customized ESXi ISO does not exist
      ansible.builtin.fail:
        msg: |
          ============================================================
          CUSTOMIZED ESXi ISO NOT FOUND
          ============================================================

          Expected:
          {{ esxi_iso_cygwin }}

          Windows path:
          {{ esxi_iso_windows }}

          Build the ISO first with:

          python build_esxi_auto_iso.py

          ============================================================
      when: not custom_iso_stat.stat.exists

    - name: Display ISO validation
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ISO VALIDATION"
          - "============================================================"
          - "Original ISO : FOUND"
          - "Custom ISO   : FOUND"
          - "Using        : {{ esxi_iso_windows }}"
          - "============================================================"

    # ========================================================================
    # VALIDATE VMWARE TOOLS
    # ========================================================================

    - name: Check vmrun.exe
      ansible.builtin.stat:
        path: "{{ vmrun_cygwin }}"
      register: vmrun_stat

    - name: Fail when vmrun.exe does not exist
      ansible.builtin.fail:
        msg: |
          VMware vmrun.exe not found:

          {{ vmrun_windows }}
      when: not vmrun_stat.stat.exists

    - name: Check vmware-vdiskmanager.exe
      ansible.builtin.stat:
        path: "{{ vdiskmanager_cygwin }}"
      register: vdiskmanager_stat

    - name: Fail when vmware-vdiskmanager.exe does not exist
      ansible.builtin.fail:
        msg: |
          VMware vmware-vdiskmanager.exe not found:

          {{ vdiskmanager_windows }}
      when: not vdiskmanager_stat.stat.exists

    # ========================================================================
    # CREATE VM DIRECTORY
    # ========================================================================

    - name: Create ESXi VM directory
      ansible.builtin.file:
        path: "{{ vm_dir_cygwin }}"
        state: directory
        mode: "0755"

    # ========================================================================
    # CHECK CURRENT VM STATE
    # ========================================================================

    - name: Get running VMware virtual machines
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_list_before
      changed_when: false
      failed_when: false

    - name: Determine whether ESXi VM is running
      ansible.builtin.set_fact:
        vm_running_before: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_list_before.stdout | lower)
          }}

    - name: Display current VM status
      ansible.builtin.debug:
        msg:
          - "VM Name : {{ vm_name }}"
          - "Running : {{ vm_running_before }}"

    # ========================================================================
    # STOP EXISTING VM
    # ========================================================================

    - name: Stop existing ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      register: stop_existing
      changed_when: stop_existing.rc == 0
      failed_when: false
      when: vm_running_before | bool

    - name: Wait after stopping existing ESXi VM
      ansible.builtin.pause:
        seconds: "{{ vm_shutdown_wait_seconds }}"
      when: vm_running_before | bool

    # ========================================================================
    # REMOVE STALE LOCKS
    # ========================================================================

    - name: Remove stale VMware lock directories
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 2 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # REMOVE STALE STATE FILES
    # ========================================================================

    - name: Remove stale VMware state files
      ansible.builtin.shell: |
        rm -f "{{ vm_dir_cygwin }}"/*.vmem 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmss 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmsn 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmpl 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.scoreboard 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # CHECK EXISTING VMX
    # ========================================================================

    - name: Check existing VMX
      ansible.builtin.stat:
        path: "{{ vmx_file_cygwin }}"
      register: vmx_existing_stat

    - name: Backup existing VMX
      ansible.builtin.copy:
        src: "{{ vmx_file_cygwin }}"
        dest: "{{ vmx_file_cygwin }}.pre-install-backup"
        remote_src: true
        mode: "0644"
      when: vmx_existing_stat.stat.exists

    # ========================================================================
    # CHECK EXISTING VMDK
    # ========================================================================

    - name: Check existing VMDK
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_stat

    # ========================================================================
    # CREATE VMDK ONLY IF IT DOES NOT EXIST
    # ========================================================================

    - name: Create ESXi virtual disk
      ansible.builtin.command:
        argv:
          - "{{ vdiskmanager_cygwin }}"
          - "-c"
          - "-s"
          - "{{ vm_disk_gb }}GB"
          - "-a"
          - "lsilogic"
          - "-t"
          - "0"
          - "{{ vmdk_file_windows }}"
      register: vmdk_create
      changed_when: vmdk_create.rc == 0
      failed_when: vmdk_create.rc != 0
      when: not vmdk_stat.stat.exists

    - name: Display VMDK status
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMDK STATUS"
          - "============================================================"
          - "Path : {{ vmdk_file_windows }}"
          - "Size : {{ vm_disk_gb }} GB"
          - "Status:"
          - "{{ vmdk_create.stdout | default('Existing VMDK preserved.') }}"
          - "============================================================"

    # ========================================================================
    # VERIFY VMDK
    # ========================================================================

    - name: Verify VMDK exists
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_after

    - name: Fail when VMDK does not exist
      ansible.builtin.fail:
        msg: |
          VMDK does not exist:

          {{ vmdk_file_windows }}
      when: not vmdk_after.stat.exists

    # ========================================================================
    # CREATE INSTALLATION VMX
    # ========================================================================

    - name: Remove old VMX before creating installation VMX
      ansible.builtin.file:
        path: "{{ vmx_file_cygwin }}"
        state: absent

    - name: Create installation VMX
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "UTF-8"

          config.version = "8"
          virtualHW.version = "{{ virtual_hw_version }}"
          virtualHW.productCompatibility = "hosted"

          displayName = "{{ vm_name }}"
          guestOS = "{{ guest_os }}"

          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"

          memsize = "{{ vm_memory_mb }}"
          numvcpus = "{{ vm_vcpu }}"
          cpuid.coresPerSocket = "1"

          # ==========================================================
          # NESTED VIRTUALIZATION
          # ==========================================================

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # ==========================================================
          # PCI BRIDGES
          # ==========================================================

          pciBridge0.present = "TRUE"
          pciBridge0.pciSlotNumber = "17"

          pciBridge1.present = "TRUE"
          pciBridge1.pciSlotNumber = "18"

          pciBridge2.present = "TRUE"
          pciBridge2.pciSlotNumber = "19"

          pciBridge3.present = "TRUE"
          pciBridge3.pciSlotNumber = "20"

          pciBridge4.present = "TRUE"
          pciBridge4.virtualDev = "pcieRootPort"
          pciBridge4.functions = "8"
          pciBridge4.pciSlotNumber = "21"

          pciBridge5.present = "TRUE"
          pciBridge5.virtualDev = "pcieRootPort"
          pciBridge5.functions = "8"
          pciBridge5.pciSlotNumber = "22"

          pciBridge6.present = "TRUE"
          pciBridge6.virtualDev = "pcieRootPort"
          pciBridge6.functions = "8"
          pciBridge6.pciSlotNumber = "23"

          pciBridge7.present = "TRUE"
          pciBridge7.virtualDev = "pcieRootPort"
          pciBridge7.functions = "8"
          pciBridge7.pciSlotNumber = "24"

          # ==========================================================
          # SCSI CONTROLLER
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"
          scsi0.pciSlotNumber = "160"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "{{ vmdk_file_windows }}"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ==========================================================
          # CUSTOMIZED ESXi ISO
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "{{ esxi_iso_windows }}"
          ide1:0.startConnected = "TRUE"

          # ==========================================================
          # NETWORK - CUSTOM VMnet0
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "VMnet0"
          ethernet0.virtualDev = "e1000e"
          ethernet0.addressType = "generated"
          ethernet0.startConnected = "TRUE"
          ethernet0.pciSlotNumber = "1184"

          # ==========================================================
          # DISABLE UNNECESSARY HARDWARE
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"
          ehci.present = "FALSE"

          sound.present = "FALSE"

          serial0.present = "FALSE"
          parallel0.present = "FALSE"
          floppy0.present = "FALSE"
          printer0.present = "FALSE"

          # ==========================================================
          # DISPLAY
          # ==========================================================

          svga.present = "TRUE"
          svga.autodetect = "TRUE"
          svga.vramSize = "134217728"

          # ==========================================================
          # FIRST BOOT - CUSTOMIZED ESXi ISO
          # ==========================================================

          bios.bootDeviceClasses = "cd"

          # ==========================================================
          # POWER
          # ==========================================================

          powerType.powerOff = "soft"
          powerType.powerOn = "soft"
          powerType.suspend = "soft"
          powerType.reset = "soft"

          # ==========================================================
          # TOOLS
          # ==========================================================

          tools.upgrade.policy = "manual"
          tools.syncTime = "FALSE"

    # ========================================================================
    # READ INSTALLATION VMX
    # ========================================================================

    - name: Read installation VMX
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: installation_vmx_slurp

    - name: Set installation VMX text
      ansible.builtin.set_fact:
        installation_vmx_text: >-
          {{
            installation_vmx_slurp.content | b64decode
          }}

    # ========================================================================
    # VALIDATE INSTALLATION VMX
    #
    # No nested quote parsing in YAML.
    # ========================================================================

    - name: Verify installation VMX
      ansible.builtin.assert:
        that:
          - installation_hw_line in installation_vmx_text
          - installation_firmware_line in installation_vmx_text
          - installation_nested_line in installation_vmx_text
          - installation_network_type_line in installation_vmx_text
          - installation_network_name_line in installation_vmx_text
          - installation_scsi_line in installation_vmx_text
          - installation_cd_present_line in installation_vmx_text
          - installation_cd_connected_line in installation_vmx_text
          - installation_boot_line in installation_vmx_text
        fail_msg: "Installation VMX validation failed."
        success_msg: "Installation VMX validated successfully."

    - name: Display installation VMX summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "INSTALLATION VMX READY"
          - "============================================================"
          - "Hardware Version : {{ virtual_hw_version }}"
          - "Firmware         : EFI"
          - "Nested VT        : TRUE"
          - "Network          : CUSTOM / VMnet0"
          - "CD               : CONNECTED"
          - "Boot Device      : CD"
          - "ISO              : {{ esxi_iso_windows }}"
          - "============================================================"

    # ========================================================================
    # REMOVE OLD LOG
    # ========================================================================

    - name: Remove old VMware log
      ansible.builtin.file:
        path: "{{ vmware_log_cygwin }}"
        state: absent

    # ========================================================================
    # START INSTALLER
    # ========================================================================

    - name: Start ESXi unattended installation
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ vmx_file_windows }}"
          - "nogui"
      register: installation_start
      changed_when: installation_start.rc == 0
      failed_when: false

    - name: Display installation start result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ESXi INSTALLATION START RESULT"
          - "============================================================"
          - "Return Code : {{ installation_start.rc }}"
          - "STDOUT      : {{ installation_start.stdout }}"
          - "STDERR      : {{ installation_start.stderr }}"
          - "============================================================"

    # ========================================================================
    # WAIT FOR INITIAL START
    # ========================================================================

    - name: Wait for ESXi installer to start
      ansible.builtin.pause:
        seconds: "{{ vm_start_wait_seconds }}"

    # ========================================================================
    # CHECK VM
    # ========================================================================

    - name: Check VM during installation
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: install_vm_list
      changed_when: false
      failed_when: false

    - name: Determine installation VM running state
      ansible.builtin.set_fact:
        installation_vm_running: >-
          {{
            vmx_file_windows | lower
            in
            (install_vm_list.stdout | lower)
          }}

    - name: Display installation VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "INSTALLATION VM STATE"
          - "============================================================"
          - "Running : {{ installation_vm_running }}"
          - "============================================================"

    # ========================================================================
    # WAIT FOR SCRIPTED INSTALLATION
    # ========================================================================

    - name: Wait for unattended ESXi installation
      ansible.builtin.pause:
        seconds: "{{ esxi_install_wait_seconds }}"

    # ========================================================================
    # CHECK VM AFTER INSTALL WAIT
    # ========================================================================

    - name: Check VM after installation wait
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: install_vm_list_after_wait
      changed_when: false
      failed_when: false

    - name: Determine VM state after installation wait
      ansible.builtin.set_fact:
        vm_running_after_install: >-
          {{
            vmx_file_windows | lower
            in
            (install_vm_list_after_wait.stdout | lower)
          }}

    - name: Display post-install state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "POST-INSTALLATION STATE"
          - "============================================================"
          - "VM Running : {{ vm_running_after_install }}"
          - "============================================================"

    # ========================================================================
    # STOP VM BEFORE FINAL VMX CHANGE
    # ========================================================================

    - name: Stop VM after installation
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      register: post_install_stop
      changed_when: post_install_stop.rc == 0
      failed_when: false
      when: vm_running_after_install | bool

    - name: Wait for post-install shutdown
      ansible.builtin.pause:
        seconds: "{{ vm_shutdown_wait_seconds }}"

    # ========================================================================
    # BACKUP INSTALLATION VMX
    # ========================================================================

    - name: Backup installation VMX
      ansible.builtin.copy:
        src: "{{ vmx_file_cygwin }}"
        dest: "{{ vmx_file_cygwin }}.installed-backup"
        remote_src: true
        mode: "0644"

    # ========================================================================
    # CREATE FINAL VMX
    #
    # CD remains defined but disconnected.
    # Boot returns to normal disk boot.
    # ========================================================================

    - name: Create final installed ESXi VMX
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "UTF-8"

          config.version = "8"
          virtualHW.version = "{{ virtual_hw_version }}"
          virtualHW.productCompatibility = "hosted"

          displayName = "{{ vm_name }}"
          guestOS = "{{ guest_os }}"

          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"

          memsize = "{{ vm_memory_mb }}"
          numvcpus = "{{ vm_vcpu }}"
          cpuid.coresPerSocket = "1"

          # ==========================================================
          # NESTED VIRTUALIZATION
          # ==========================================================

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # ==========================================================
          # PCI BRIDGES
          # ==========================================================

          pciBridge0.present = "TRUE"
          pciBridge0.pciSlotNumber = "17"

          pciBridge1.present = "TRUE"
          pciBridge1.pciSlotNumber = "18"

          pciBridge2.present = "TRUE"
          pciBridge2.pciSlotNumber = "19"

          pciBridge3.present = "TRUE"
          pciBridge3.pciSlotNumber = "20"

          pciBridge4.present = "TRUE"
          pciBridge4.virtualDev = "pcieRootPort"
          pciBridge4.functions = "8"
          pciBridge4.pciSlotNumber = "21"

          pciBridge5.present = "TRUE"
          pciBridge5.virtualDev = "pcieRootPort"
          pciBridge5.functions = "8"
          pciBridge5.pciSlotNumber = "22"

          pciBridge6.present = "TRUE"
          pciBridge6.virtualDev = "pcieRootPort"
          pciBridge6.functions = "8"
          pciBridge6.pciSlotNumber = "23"

          pciBridge7.present = "TRUE"
          pciBridge7.virtualDev = "pcieRootPort"
          pciBridge7.functions = "8"
          pciBridge7.pciSlotNumber = "24"

          # ==========================================================
          # INSTALLED ESXi DISK
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"
          scsi0.pciSlotNumber = "160"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "{{ vmdk_file_windows }}"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ==========================================================
          # CD/DVD
          # Defined but disconnected after installation
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "{{ esxi_iso_windows }}"
          ide1:0.startConnected = "FALSE"

          # ==========================================================
          # NETWORK
          # Explicit CUSTOM / VMnet0
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "VMnet0"
          ethernet0.virtualDev = "e1000e"
          ethernet0.addressType = "generated"
          ethernet0.startConnected = "TRUE"
          ethernet0.pciSlotNumber = "1184"

          # ==========================================================
          # DISABLE UNNECESSARY DEVICES
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"
          ehci.present = "FALSE"

          sound.present = "FALSE"

          serial0.present = "FALSE"
          parallel0.present = "FALSE"
          floppy0.present = "FALSE"
          printer0.present = "FALSE"

          # ==========================================================
          # DISPLAY
          # ==========================================================

          svga.present = "TRUE"
          svga.autodetect = "TRUE"
          svga.vramSize = "134217728"

          # ==========================================================
          # NORMAL DISK BOOT
          # ==========================================================

          bios.bootDeviceClasses = "allow:all"

          # ==========================================================
          # POWER
          # ==========================================================

          powerType.powerOff = "soft"
          powerType.powerOn = "soft"
          powerType.suspend = "soft"
          powerType.reset = "soft"

          # ==========================================================
          # TOOLS
          # ==========================================================

          tools.upgrade.policy = "manual"
          tools.syncTime = "FALSE"

    # ========================================================================
    # READ FINAL VMX
    # ========================================================================

    - name: Read final VMX
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: final_vmx_slurp

    - name: Set final VMX text
      ansible.builtin.set_fact:
        final_vmx_text: >-
          {{
            final_vmx_slurp.content | b64decode
          }}

    # ========================================================================
    # VALIDATE FINAL VMX
    # ========================================================================

    - name: Verify final VMX
      ansible.builtin.assert:
        that:
          - final_hw_line in final_vmx_text
          - final_firmware_line in final_vmx_text
          - final_nested_line in final_vmx_text
          - final_network_type_line in final_vmx_text
          - final_network_name_line in final_vmx_text
          - final_scsi_disk_line in final_vmx_text
          - final_cd_present_line in final_vmx_text
          - final_cd_disconnected_line in final_vmx_text
          - final_boot_line in final_vmx_text
        fail_msg: "Final installed ESXi VMX validation failed."
        success_msg: "Final installed ESXi VMX validated successfully."

    - name: Display final VMX configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL INSTALLED ESXi VMX"
          - "============================================================"
          - "Hardware Version : {{ virtual_hw_version }}"
          - "Firmware         : EFI"
          - "Disk             : {{ vmdk_file_windows }}"
          - "CD Connected     : FALSE"
          - "Network          : CUSTOM / VMnet0"
          - "Nested VT        : TRUE"
          - "Boot Mode        : NORMAL / DISK"
          - "============================================================"

    # ========================================================================
    # FINAL BOOT
    # ========================================================================

    - name: Remove VMware log before final boot
      ansible.builtin.file:
        path: "{{ vmware_log_cygwin }}"
        state: absent

    - name: Start installed ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ vmx_file_windows }}"
          - "nogui"
      register: final_start
      changed_when: final_start.rc == 0
      failed_when: false

    - name: Display final boot result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi BOOT"
          - "============================================================"
          - "VM Name : {{ vm_name }}"
          - "Boot    : INSTALLED VMDK"
          - "CD      : DISCONNECTED"
          - "Network : CUSTOM / VMnet0"
          - "Return  : {{ final_start.rc }}"
          - "STDOUT  : {{ final_start.stdout }}"
          - "STDERR  : {{ final_start.stderr }}"
          - "============================================================"

    - name: Wait for installed ESXi to boot
      ansible.builtin.pause:
        seconds: "{{ vm_start_wait_seconds }}"

    # ========================================================================
    # VERIFY FINAL VM
    # ========================================================================

    - name: Get final VMware VM list
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: final_vmrun_list
      changed_when: false
      failed_when: false

    - name: Determine final VM running state
      ansible.builtin.set_fact:
        final_vm_running: >-
          {{
            vmx_file_windows | lower
            in
            (final_vmrun_list.stdout | lower)
          }}

    - name: Display final VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi VM STATUS"
          - "============================================================"
          - "VM Name : {{ vm_name }}"
          - "Running : {{ final_vm_running }}"
          - "VMX     : {{ vmx_file_windows }}"
          - "Network : CUSTOM / VMnet0"
          - "Boot    : INSTALLED DISK"
          - "ISO     : DISCONNECTED"
          - "============================================================"

    # ========================================================================
    # DIAGNOSTIC LOGS
    # ========================================================================

    - name: Check VMware log
      ansible.builtin.stat:
        path: "{{ vmware_log_cygwin }}"
      register: final_log_stat
      when: not final_vm_running | bool

    - name: Read VMware log after final boot failure
      ansible.builtin.shell: |
        tail -200 "{{ vmware_log_cygwin }}"
      args:
        executable: /bin/bash
      register: final_log_tail
      changed_when: false
      failed_when: false
      when:
        - not final_vm_running | bool
        - final_log_stat.stat.exists

    - name: Extract VMware final boot errors
      ansible.builtin.shell: |
        grep -iE \
        "error|failed|failure|pci|slot|ethernet|scsi|power on failed|unable to allocate|cancel|unsupported" \
        "{{ vmware_log_cygwin }}" |
        tail -100
      args:
        executable: /bin/bash
      register: final_log_errors
      changed_when: false
      failed_when: false
      when:
        - not final_vm_running | bool
        - final_log_stat.stat.exists

    # ========================================================================
    # FAIL ON FINAL BOOT FAILURE
    # ========================================================================

    - name: Fail when installed ESXi VM is not running
      ansible.builtin.fail:
        msg: |
          ============================================================
          FINAL ESXi BOOT FAILED
          ============================================================

          VM:
          {{ vm_name }}

          VMX:
          {{ vmx_file_windows }}

          Running:
          {{ final_vm_running }}

          vmrun output:
          {{ final_vmrun_list.stdout | default('') }}

          ------------------------------------------------------------
          IMPORTANT VMWARE ERRORS
          ------------------------------------------------------------

          {{ final_log_errors.stdout | default('No filtered errors found.') }}

          ------------------------------------------------------------
          LAST VMWARE LOG
          ------------------------------------------------------------

          {{ final_log_tail.stdout | default('VMware log unavailable.') }}

          ============================================================
      when: not final_vm_running

    # ========================================================================
    # SUCCESS
    # ========================================================================

    - name: Display successful ESXi installation
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS - ESXi INSTALLATION COMPLETED"
          - "============================================================"
          - "VM Name        : {{ vm_name }}"
          - "VMX            : {{ vmx_file_windows }}"
          - "VMDK           : {{ vmdk_file_windows }}"
          - "Running        : YES"
          - "RAM            : {{ vm_memory_mb }} MB"
          - "CPU            : {{ vm_vcpu }} vCPU"
          - "Disk           : {{ vm_disk_gb }} GB"
          - "Firmware       : EFI"
          - "Nested VT      : ENABLED"
          - "Network        : CUSTOM / VMnet0"
          - "ISO            : E:\\vmware\\ESXi-8.0.1-auto.iso"
          - "ISO Connected  : NO"
          - "Boot           : INSTALLED ESXi DISK"
          - "============================================================"
      when: final_vm_running | bool
