---
- name: Create and Start Nested ESXi VM in VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  environment:
    HOME: "/home/vigne"
    TMPDIR: "/tmp"
    ANSIBLE_REMOTE_TEMP: "/tmp/.ansible-vigne/tmp"

  vars:

    # ============================================================
    # VM CONFIGURATION
    # ============================================================

    vm_name: "ESXI-01"

    # Cygwin paths
    vm_dir: "/cygdrive/d/ESXI/ESXI-01"
    vmx_file: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmx"
    vmdk_file: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmdk"

    # Windows paths used by VMware Workstation
    vm_dir_win: 'D:\ESXI\ESXI-01'
    vmx_file_win: 'D:\ESXI\ESXI-01\ESXI-01.vmx'
    vmdk_file_win: 'D:\ESXI\ESXI-01\ESXI-01.vmdk'

    # ESXi ISO
    esxi_iso: "/cygdrive/e/vmware/VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso"
    esxi_iso_win: 'E:\vmware\VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso'

    # VMware Workstation executables
    vmrun_path: "/cygdrive/d/VM workstation/vmrun.exe"
    vdiskmanager_path: "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"

    # ============================================================
    # VM HARDWARE
    # ============================================================

    vm_memory_mb: 24568
    vm_cpus: 12
    vm_disk_gb: 2000

    virtual_hw_version: "19"

    vm_guest_os: "vmkernel7"
    vm_network: "VMnet0"

    # ============================================================
    # VMX CONTENT
    # ============================================================

    vmx_content: |
      .encoding = "windows-1252"
      config.version = "8"
      virtualHW.version = "{{ virtual_hw_version }}"

      displayName = "{{ vm_name }}"
      guestOS = "{{ vm_guest_os }}"

      memsize = "{{ vm_memory_mb }}"
      numvcpus = "{{ vm_cpus }}"

      firmware = "efi"

      # ==========================================================
      # NESTED VIRTUALIZATION
      # ==========================================================

      vhv.enable = "TRUE"
      hypervisor.cpuid.v0 = "FALSE"

      # ==========================================================
      # POWER SETTINGS
      # ==========================================================

      powerType.powerOff = "hard"
      powerType.reset = "hard"
      powerType.suspend = "hard"

      tools.upgrade.policy = "manual"

      # ==========================================================
      # SCSI CONTROLLER
      # ==========================================================

      scsi0.present = "TRUE"
      scsi0.virtualDev = "lsisas1068"

      scsi0:0.present = "TRUE"
      scsi0:0.fileName = "{{ vmdk_file_win }}"
      scsi0:0.deviceType = "scsi-hardDisk"

      # ==========================================================
      # ESXi INSTALLATION ISO
      # ==========================================================

      ide1:0.present = "TRUE"
      ide1:0.deviceType = "cdrom-image"
      ide1:0.fileName = "{{ esxi_iso_win }}"
      ide1:0.startConnected = "TRUE"

      # ==========================================================
      # NETWORK
      # ==========================================================

      ethernet0.present = "TRUE"
      ethernet0.connectionType = "bridged"
      ethernet0.vnet = "{{ vm_network }}"
      ethernet0.virtualDev = "e1000e"
      ethernet0.addressType = "generated"
      ethernet0.wakeOnPcktRcv = "FALSE"

      # ==========================================================
      # USB COMPLETELY DISABLED
      # ==========================================================

      usb.present = "FALSE"
      usb_xhci.present = "FALSE"

      # ==========================================================
      # DISABLED DEVICES
      # ==========================================================

      sound.present = "FALSE"
      floppy0.present = "FALSE"
      serial0.present = "FALSE"
      parallel0.present = "FALSE"

      # ==========================================================
      # DISPLAY
      # ==========================================================

      svga.present = "TRUE"
      svga.vramSize = "134217728"

      # ==========================================================
      # VMWARE UUID
      # ==========================================================

      uuid.action = "create"

  # ==============================================================
  # PRE-TASKS
  # These use raw so Ansible does not need its normal Python
  # temporary module directory before it is created.
  # ==============================================================

  pre_tasks:

    - name: Create Ansible temporary directories
      ansible.builtin.raw: |
        mkdir -p /tmp/.ansible-vigne/tmp
        mkdir -p /tmp/.ansible-local/tmp
        chmod 700 /tmp/.ansible-vigne
        chmod 700 /tmp/.ansible-vigne/tmp
        chmod 700 /tmp/.ansible-local
        chmod 700 /tmp/.ansible-local/tmp
      changed_when: false

  tasks:

    # ============================================================
    # DISPLAY CONFIGURATION
    # ============================================================

    - name: Display ESXi configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM CONFIGURATION"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "ESXi ISO      : {{ esxi_iso }}"
          - "VM Directory  : {{ vm_dir }}"
          - "VMX File      : {{ vmx_file }}"
          - "VMRUN Path    : {{ vmrun_path }}"
          - "VDISK Path    : {{ vdiskmanager_path }}"
          - "RAM           : {{ vm_memory_mb }} MB"
          - "CPU           : {{ vm_cpus }} vCPU"
          - "Disk          : {{ vm_disk_gb }} GB"
          - "Network       : {{ vm_network }}"
          - "Firmware      : EFI"
          - "Hardware Ver  : {{ virtual_hw_version }}"
          - "Nested VT     : ENABLED"
          - "USB           : DISABLED"
          - "USB xHCI      : DISABLED"
          - "============================================================"

    # ============================================================
    # VALIDATE REQUIRED FILES
    # ============================================================

    - name: Check ESXi ISO exists
      ansible.builtin.command:
        argv:
          - test
          - -f
          - "{{ esxi_iso }}"
      register: esxi_iso_check
      changed_when: false
      failed_when: false

    - name: Fail when ESXi ISO does not exist
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi ISO NOT FOUND
          ============================================================

          Expected ISO:

          {{ esxi_iso }}

          ============================================================
      when: esxi_iso_check.rc != 0

    - name: Check VMware vmrun.exe exists
      ansible.builtin.command:
        argv:
          - test
          - -f
          - "{{ vmrun_path }}"
      register: vmrun_check
      changed_when: false
      failed_when: false

    - name: Fail when vmrun.exe is not found
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMware vmrun.exe NOT FOUND
          ============================================================

          Expected:

          {{ vmrun_path }}

          ============================================================
      when: vmrun_check.rc != 0

    - name: Check VMware vdiskmanager exists
      ansible.builtin.command:
        argv:
          - test
          - -f
          - "{{ vdiskmanager_path }}"
      register: vdiskmanager_check
      changed_when: false
      failed_when: false

    - name: Fail when vmware-vdiskmanager.exe is not found
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMware vmware-vdiskmanager.exe NOT FOUND
          ============================================================

          Expected:

          {{ vdiskmanager_path }}

          ============================================================
      when: vdiskmanager_check.rc != 0

    - name: Display detected VMware paths
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMWARE WORKSTATION DETECTED"
          - "============================================================"
          - "vmrun.exe: {{ vmrun_path }}"
          - "vmware-vdiskmanager.exe: {{ vdiskmanager_path }}"
          - "============================================================"

    # ============================================================
    # CREATE VM DIRECTORY
    # ============================================================

    - name: Create ESXi VM directory
      ansible.builtin.command:
        argv:
          - mkdir
          - -p
          - "{{ vm_dir }}"
      changed_when: false

    # ============================================================
    # CHECK EXISTING VM FILES
    # ============================================================

    - name: Check whether VMX file already exists
      ansible.builtin.command:
        argv:
          - test
          - -f
          - "{{ vmx_file }}"
      register: vmx_check
      changed_when: false
      failed_when: false

    - name: Check whether virtual disk already exists
      ansible.builtin.command:
        argv:
          - test
          - -f
          - "{{ vmdk_file }}"
      register: vmdk_check
      changed_when: false
      failed_when: false

    - name: Display existing VMX status
      ansible.builtin.debug:
        msg: "Existing VMX file found: {{ vmx_file }}"
      when: vmx_check.rc == 0

    - name: Display existing VMDK status
      ansible.builtin.debug:
        msg: "Existing VMDK file found: {{ vmdk_file }}"
      when: vmdk_check.rc == 0

    # ============================================================
    # CHECK WHETHER VM IS RUNNING
    # ============================================================

    - name: Check whether VMware VM is running
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - list
      register: vmrun_list_before
      changed_when: false
      failed_when: false

    - name: Set ESXi VM running status
      ansible.builtin.set_fact:
        vm_running: "{{ vmx_file_win | lower in vmrun_list_before.stdout | lower }}"

    - name: Display existing VM status
      ansible.builtin.debug:
        msg: "VM {{ vm_name }} currently running: {{ vm_running }}"

    # ============================================================
    # STOP EXISTING VM
    # ============================================================

    - name: Stop existing ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - stop
          - "{{ vmx_file_win }}"
          - hard
      register: stop_vm_result
      changed_when: stop_vm_result.rc == 0
      failed_when: false
      when: vm_running | bool

    - name: Wait after stopping ESXi VM
      ansible.builtin.pause:
        seconds: 5
      when: vm_running | bool

    # ============================================================
    # REMOVE STALE VMWARE LOCKS AND STATE FILES
    # ============================================================

    - name: Remove stale VMware lock directories
      ansible.builtin.shell: |
        find "{{ vm_dir }}" -type d -name "*.lck" -exec rm -rf {} + 2>/dev/null || true
      changed_when: false

    - name: Remove stale VMware state files
      ansible.builtin.shell: |
        find "{{ vm_dir }}" -type f \
          \( \
            -name "*.vmss" -o \
            -name "*.vmem" -o \
            -name "*.vmx~" -o \
            -name "*.scoreboard" \
          \) \
          -delete 2>/dev/null || true
      changed_when: false

    # ============================================================
    # CREATE VIRTUAL DISK
    # ============================================================

    - name: Create ESXi virtual disk
      ansible.builtin.command:
        argv:
          - "{{ vdiskmanager_path }}"
          - "-c"
          - "-s"
          - "{{ vm_disk_gb }}GB"
          - "-a"
          - "lsilogic"
          - "-t"
          - "1"
          - "{{ vmdk_file }}"
      register: create_disk_result
      when: vmdk_check.rc != 0
      changed_when: create_disk_result.rc == 0
      failed_when: create_disk_result.rc != 0

    - name: Display virtual disk creation result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VIRTUAL DISK CREATED"
          - "============================================================"
          - "{{ create_disk_result.stdout }}"
          - "{{ create_disk_result.stderr }}"
          - "============================================================"
      when: vmdk_check.rc != 0

    - name: Display existing virtual disk status
      ansible.builtin.debug:
        msg: "Virtual disk already exists. Creation skipped: {{ vmdk_file }}"
      when: vmdk_check.rc == 0

    # ============================================================
    # CREATE VMX CONFIGURATION
    # ============================================================

    - name: Create ESXi VMware VMX configuration
      ansible.builtin.shell: |
        cat > "{{ vmx_file }}" <<'VMXEOF'
        {{ vmx_content }}
        VMXEOF
      register: create_vmx_result
      changed_when: true

    # ============================================================
    # VERIFY VMX CONFIGURATION
    # ============================================================

    - name: Read VMX hardware version
      ansible.builtin.command:
        argv:
          - grep
          - "virtualHW.version"
          - "{{ vmx_file }}"
      register: vmx_hw_check
      changed_when: false
      failed_when: vmx_hw_check.rc != 0

    - name: Read VMX guest OS
      ansible.builtin.command:
        argv:
          - grep
          - "guestOS"
          - "{{ vmx_file }}"
      register: vmx_guest_check
      changed_when: false
      failed_when: vmx_guest_check.rc != 0

    - name: Read VMX USB configuration
      ansible.builtin.shell: |
        grep -E '^usb\.present|^usb_xhci\.present' "{{ vmx_file }}"
      register: vmx_usb_check
      changed_when: false
      failed_when: false

    - name: Display verified VMX configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMX CONFIGURATION VERIFIED"
          - "============================================================"
          - "{{ vmx_hw_check.stdout }}"
          - "{{ vmx_guest_check.stdout }}"
          - "{{ vmx_usb_check.stdout }}"
          - "============================================================"

    - name: Fail if VMX hardware version is incorrect
      ansible.builtin.fail:
        msg: |
          VMware hardware version verification failed.

          Expected:
          virtualHW.version = "{{ virtual_hw_version }}"

          Found:
          {{ vmx_hw_check.stdout }}
      when: ('virtualHW.version = "' ~ virtual_hw_version ~ '"') not in vmx_hw_check.stdout

    # ============================================================
    # DISPLAY VMWARE INFORMATION
    # ============================================================

    - name: Display VMware vmrun help
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-h"
      register: vmrun_version
      changed_when: false
      failed_when: false

    - name: Display VMware information
      ansible.builtin.debug:
        msg:
          - "{{ vmrun_version.stdout }}"
          - "{{ vmrun_version.stderr }}"

    # ============================================================
    # START NESTED ESXi VM
    # ============================================================

    - name: Start Nested ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - start
          - "{{ vmx_file_win }}"
          - nogui
      register: start_vm_result
      changed_when: start_vm_result.rc == 0
      failed_when: false

    - name: Display VMware start result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMWARE START RESULT"
          - "============================================================"
          - "Return code: {{ start_vm_result.rc }}"
          - "STDOUT:"
          - "{{ start_vm_result.stdout }}"
          - "STDERR:"
          - "{{ start_vm_result.stderr }}"
          - "============================================================"

    # ============================================================
    # WAIT FOR STARTUP
    # ============================================================

    - name: Wait for VMware startup processing
      ansible.builtin.pause:
        seconds: 10
      when: start_vm_result.rc == 0

    # ============================================================
    # CHECK FINAL VM STATUS
    # ============================================================

    - name: Get running VMware virtual machines
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - list
      register: vmrun_list_after
      changed_when: false
      failed_when: false

    - name: Set final ESXi VM running status
      ansible.builtin.set_fact:
        final_vm_running: "{{ vmx_file_win | lower in vmrun_list_after.stdout | lower }}"

    - name: Display final VM status
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi VM STATUS"
          - "============================================================"
          - "VM Name  : {{ vm_name }}"
          - "VMX      : {{ vmx_file_win }}"
          - "Running  : {{ final_vm_running }}"
          - "============================================================"

    # ============================================================
    # READ VMWARE LOG
    # ============================================================

    - name: Check VMware log exists
      ansible.builtin.command:
        argv:
          - test
          - -f
          - "{{ vm_dir }}/vmware.log"
      register: vmware_log_check
      changed_when: false
      failed_when: false

    - name: Read last 100 lines of VMware log
      ansible.builtin.shell: |
        tail -100 "{{ vm_dir }}/vmware.log"
      register: vmware_log_tail
      changed_when: false
      failed_when: false
      when: vmware_log_check.rc == 0

    - name: Extract important VMware errors
      ansible.builtin.shell: |
        grep -iE "error|failed|failure|cancel|power on failed|unsupported|pci|xhci|slot|vt-x|amd-v|hyper-v|virtualization" "{{ vm_dir }}/vmware.log" | tail -80
      register: vmware_log_errors
      changed_when: false
      failed_when: false
      when: vmware_log_check.rc == 0

    # ============================================================
    # FAIL WITH DETAILED TROUBLESHOOTING
    # ============================================================

    - name: Fail with VMware troubleshooting information
      ansible.builtin.fail:
        msg: |
          ============================================================
          FAILED TO START NESTED ESXi VM
          ============================================================

          VMX:
          {{ vmx_file_win }}

          VMware hardware version:
          {{ vmx_hw_check.stdout }}

          vmrun return code:
          {{ start_vm_result.rc }}

          vmrun output:
          {{ start_vm_result.stdout }}

          {{ start_vm_result.stderr }}

          ------------------------------------------------------------
          IMPORTANT VMWARE LOG ERRORS
          ------------------------------------------------------------

          {{ vmware_log_errors.stdout | default('No VMware errors found.') }}

          ------------------------------------------------------------
          LAST VMWARE LOG ENTRIES
          ------------------------------------------------------------

          {{ vmware_log_tail.stdout | default('VMware log not found.') }}

          ============================================================

          IMPORTANT:

          virtualHW.version = "{{ virtual_hw_version }}"

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"

          vhv.enable = "TRUE"

          Check:

          1. Intel VT-x / AMD-V enabled in BIOS.
          2. Hyper-V is not conflicting with VMware nested virtualization.
          3. Memory Integrity / VBS is not blocking VMware.
          4. No VMware process has the VMX file locked.
          5. No *.lck directories remain.
          6. ESXi ISO exists.
          7. VMnet0 is available.

          ============================================================
      when: not (final_vm_running | bool)

    # ============================================================
    # SUCCESS
    # ============================================================

    - name: Display successful ESXi startup
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS - NESTED ESXi VM IS RUNNING"
          - "============================================================"
          - "VM Name : {{ vm_name }}"
          - "VMX     : {{ vmx_file_win }}"
          - "RAM     : {{ vm_memory_mb }} MB"
          - "CPU     : {{ vm_cpus }} vCPU"
          - "Disk    : {{ vm_disk_gb }} GB"
          - "============================================================"
      when: final_vm_running | bool
