---
- name: Create and Start Nested ESXi VM in VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ============================================================
    # VM CONFIGURATION
    # ============================================================

    vm_name: "ESXI-01"

    esxi_iso_cygwin: "/cygdrive/e/vmware/VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso"
    esxi_iso_windows: 'E:\vmware\VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso'

    vm_dir_cygwin: "/cygdrive/d/ESXI/ESXI-01"
    vm_dir_windows: 'D:\ESXI\ESXI-01'

    vmx_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmx"
    vmx_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmx'

    vmdk_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmdk"
    vmdk_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmdk'

    vmware_log_cygwin: "/cygdrive/d/ESXI/ESXI-01/vmware.log"

    vmrun_cygwin: "/cygdrive/d/VM workstation/vmrun.exe"
    vmrun_windows: 'D:\VM workstation\vmrun.exe'

    vdiskmanager_cygwin: "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"
    vdiskmanager_windows: 'D:\VM workstation\vmware-vdiskmanager.exe'

    # ============================================================
    # ESXi HARDWARE
    # ============================================================

    vm_memory_mb: 24568
    vm_vcpu: 12
    vm_disk_size: "2000GB"

    vm_network_type: "bridged"
    vmnet_device: "VMnet0"

    vm_hardware_version: "19"

    # ============================================================
    # VM OPTIONS
    # ============================================================

    firmware: "efi"

    nested_virtualization: true

    usb_enabled: false
    sound_enabled: false
    printer_enabled: false
    parallel_enabled: false
    serial_enabled: false
    floppy_enabled: false

    # Remove old VM and recreate everything
    recreate_vm: false

  tasks:

    # ============================================================
    # DISPLAY CONFIGURATION
    # ============================================================

    - name: Display ESXi configuration
      debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM CONFIGURATION"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "ESXi ISO      : {{ esxi_iso_windows }}"
          - "VM Directory  : {{ vm_dir_windows }}"
          - "VMX File      : {{ vmx_file_windows }}"
          - "VMDK File     : {{ vmdk_file_windows }}"
          - "VMRUN Path    : {{ vmrun_windows }}"
          - "VDISK Path    : {{ vdiskmanager_windows }}"
          - "RAM           : {{ vm_memory_mb }} MB"
          - "CPU           : {{ vm_vcpu }} vCPU"
          - "Disk          : {{ vm_disk_size }}"
          - "Network       : {{ vm_network_type }}"
          - "VMnet         : {{ vmnet_device }}"
          - "Firmware      : {{ firmware }}"
          - "Hardware Ver  : {{ vm_hardware_version }}"
          - "Nested VT     : {{ nested_virtualization }}"
          - "USB           : {{ usb_enabled }}"
          - "Sound         : {{ sound_enabled }}"
          - "============================================================"

    # ============================================================
    # VALIDATE FILES
    # ============================================================

    - name: Check ESXi ISO exists
      ansible.builtin.stat:
        path: "{{ esxi_iso_cygwin }}"
      register: esxi_iso_stat

    - name: Fail when ESXi ISO does not exist
      ansible.builtin.fail:
        msg: |
          ESXi ISO was not found.

          Expected:
          {{ esxi_iso_cygwin }}

          Windows path:
          {{ esxi_iso_windows }}
      when: not esxi_iso_stat.stat.exists

    - name: Check VMware vmrun exists
      ansible.builtin.stat:
        path: "{{ vmrun_cygwin }}"
      register: vmrun_stat

    - name: Fail when vmrun is not found
      ansible.builtin.fail:
        msg: |
          vmrun.exe was not found:

          {{ vmrun_cygwin }}
      when: not vmrun_stat.stat.exists

    - name: Check VMware vdiskmanager exists
      ansible.builtin.stat:
        path: "{{ vdiskmanager_cygwin }}"
      register: vdiskmanager_stat

    - name: Fail when vmware-vdiskmanager is not found
      ansible.builtin.fail:
        msg: |
          vmware-vdiskmanager.exe was not found:

          {{ vdiskmanager_cygwin }}
      when: not vdiskmanager_stat.stat.exists

    - name: Display detected VMware paths
      debug:
        msg:
          - "============================================================"
          - "VMWARE WORKSTATION DETECTED"
          - "============================================================"
          - "vmrun.exe:"
          - "{{ vmrun_windows }}"
          - ""
          - "vmware-vdiskmanager.exe:"
          - "{{ vdiskmanager_windows }}"
          - "============================================================"

    # ============================================================
    # CREATE VM DIRECTORY
    # ============================================================

    - name: Create ESXi VM directory
      ansible.builtin.file:
        path: "{{ vm_dir_cygwin }}"
        state: directory

    # ============================================================
    # CHECK VM STATUS
    # ============================================================

    - name: Check whether VMX file exists
      ansible.builtin.stat:
        path: "{{ vmx_file_cygwin }}"
      register: vmx_stat

    - name: Check whether VMDK file exists
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_stat

    - name: Check whether VMware VM is running
      ansible.builtin.command:
        argv:
          - "{{ vmrun_windows }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_list_before
      changed_when: false
      failed_when: false

    - name: Set ESXi VM running status
      ansible.builtin.set_fact:
        esxi_vm_running_before: >-
          {{
            vmx_file_windows in vmrun_list_before.stdout
          }}

    - name: Display existing VM status
      debug:
        msg: "VM {{ vm_name }} currently running: {{ esxi_vm_running_before }}"

    # ============================================================
    # STOP VM IF RUNNING
    # ============================================================

    - name: Stop existing ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_windows }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      register: stop_vm
      failed_when: false
      changed_when: stop_vm.rc == 0
      when: esxi_vm_running_before | bool

    - name: Wait after stopping ESXi VM
      ansible.builtin.pause:
        seconds: 5
      when: esxi_vm_running_before | bool

    # ============================================================
    # OPTIONAL FULL RECREATE
    # ============================================================

    - name: Remove existing VMX when recreate is enabled
      ansible.builtin.file:
        path: "{{ vmx_file_cygwin }}"
        state: absent
      when: recreate_vm | bool

    - name: Remove existing VMDK when recreate is enabled
      ansible.builtin.file:
        path: "{{ vmdk_file_cygwin }}"
        state: absent
      when: recreate_vm | bool

    - name: Remove existing VMDK metadata when recreate is enabled
      ansible.builtin.shell: |
        rm -f "{{ vm_dir_cygwin }}"/*.vmdk
        rm -f "{{ vm_dir_cygwin }}"/*.vmsd
        rm -f "{{ vm_dir_cygwin }}"/*.vmsn
        rm -f "{{ vm_dir_cygwin }}"/*.vmxf
        rm -f "{{ vm_dir_cygwin }}"/*.nvram
      args:
        executable: /bin/bash
      when: recreate_vm | bool
      changed_when: false

    # ============================================================
    # REMOVE STALE LOCKS
    # ============================================================

    - name: Remove stale VMware lock directories
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 1 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} +
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Remove stale VMware state files
      ansible.builtin.shell: |
        rm -f "{{ vm_dir_cygwin }}"/*.vmem
        rm -f "{{ vm_dir_cygwin }}"/*.vmss
        rm -f "{{ vm_dir_cygwin }}"/*.vmpl
        rm -f "{{ vm_dir_cygwin }}"/*.lck
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    # ============================================================
    # RECHECK VMDK
    # ============================================================

    - name: Check whether virtual disk exists after cleanup
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_final_stat

    # ============================================================
    # CREATE VIRTUAL DISK
    #
    # IMPORTANT:
    # Use WINDOWS PATH here.
    # Do NOT pass /cygdrive/d/... to vmware-vdiskmanager.exe.
    # ============================================================

    - name: Create ESXi virtual disk
      ansible.builtin.command:
        argv:
          - "{{ vdiskmanager_windows }}"
          - "-c"
          - "-s"
          - "{{ vm_disk_size }}"
          - "-a"
          - "lsilogic"
          - "-t"
          - "0"
          - "{{ vmdk_file_windows }}"
      register: create_disk
      when: not vmdk_final_stat.stat.exists

    - name: Display virtual disk creation result
      debug:
        msg:
          - "============================================================"
          - "VIRTUAL DISK RESULT"
          - "============================================================"
          - "Return code: {{ create_disk.rc | default('already exists') }}"
          - "Disk: {{ vmdk_file_windows }}"
          - "============================================================"

    # ============================================================
    # CREATE CLEAN VMX FILE
    #
    # IMPORTANT:
    # NO pciSlotNumber entries.
    # This fixes:
    # No PCIe slot available for SCSI0
    # Too many PCI devices are already configured
    # ============================================================

    - name: Create clean VMware VMX configuration
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "windows-1252"

          config.version = "8"
          virtualHW.version = "{{ vm_hardware_version }}"

          displayName = "{{ vm_name }}"
          guestOS = "otherlinux-64"

          firmware = "{{ firmware }}"

          memsize = "{{ vm_memory_mb }}"
          numvcpus = "{{ vm_vcpu }}"
          cpuid.coresPerSocket = "{{ vm_vcpu }}"

          smc.present = "FALSE"

          # --------------------------------------------------------
          # NESTED VIRTUALIZATION
          # --------------------------------------------------------

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"
          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # --------------------------------------------------------
          # SCSI CONTROLLER
          # --------------------------------------------------------

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "{{ vmdk_file_windows }}"
          scsi0:0.deviceType = "scsi-hardDisk"

          # --------------------------------------------------------
          # CD/DVD - ESXi ISO
          # --------------------------------------------------------

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "{{ esxi_iso_windows }}"
          ide1:0.startConnected = "TRUE"

          # --------------------------------------------------------
          # NETWORK
          # --------------------------------------------------------

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "{{ vm_network_type }}"
          ethernet0.vnet = "{{ vmnet_device }}"
          ethernet0.virtualDev = "e1000e"
          ethernet0.startConnected = "TRUE"
          ethernet0.wakeOnPcktRcv = "FALSE"

          # --------------------------------------------------------
          # DISABLE UNNECESSARY DEVICES
          # --------------------------------------------------------

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"

          sound.present = "FALSE"
          printer0.present = "FALSE"

          parallel0.present = "FALSE"
          serial0.present = "FALSE"

          floppy0.present = "FALSE"

          # --------------------------------------------------------
          # DISPLAY
          # --------------------------------------------------------

          svga.present = "TRUE"
          svga.autodetect = "TRUE"
          svga.vramSize = "67108864"

          # --------------------------------------------------------
          # MISC
          # --------------------------------------------------------

          tools.syncTime = "FALSE"
          tools.upgrade.policy = "manual"

          powerType.powerOff = "hard"
          powerType.powerOn = "hard"
          powerType.suspend = "hard"
          powerType.reset = "hard"

          isolation.tools.copy.disable = "FALSE"
          isolation.tools.paste.disable = "FALSE"

          extendedConfigFile = "{{ vm_name }}.vmxf"

          uuid.action = "create"

    # ============================================================
    # VALIDATE VMX
    # ============================================================

    - name: Read generated VMX file
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: vmx_content

    - name: Decode VMX content
      ansible.builtin.set_fact:
        vmx_text: "{{ vmx_content.content | b64decode }}"

    - name: Fail if VMX contains manual PCI slot configuration
      ansible.builtin.fail:
        msg: |
          VMX contains pciSlotNumber entries.

          This can cause:

          No PCIe slot available for SCSI0
          Too many PCI devices are already configured

          Remove all pciSlotNumber entries.
      when: "'pciSlotNumber' in vmx_text"

    - name: Fail if VMX hardware version is incorrect
      ansible.builtin.fail:
        msg: |
          Incorrect VMware hardware version.

          Expected:
          virtualHW.version = "{{ vm_hardware_version }}"
      when: ('virtualHW.version = "' ~ vm_hardware_version ~ '"') not in vmx_text

    - name: Display VMX validation result
      debug:
        msg:
          - "============================================================"
          - "VMX VALIDATION SUCCESSFUL"
          - "============================================================"
          - "Hardware Version : {{ vm_hardware_version }}"
          - "Manual PCI Slots : NONE"
          - "SCSI Controller  : LSILogic"
          - "Disk             : {{ vmdk_file_windows }}"
          - "ISO              : {{ esxi_iso_windows }}"
          - "Network          : {{ vm_network_type }}"
          - "Nested VT        : ENABLED"
          - "============================================================"

    # ============================================================
    # START VM
    # ============================================================

    - name: Start Nested ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_windows }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ vmx_file_windows }}"
          - "nogui"
      register: start_vm
      changed_when: start_vm.rc == 0
      failed_when: false

    - name: Display VMware start result
      debug:
        msg:
          - "============================================================"
          - "VMWARE START RESULT"
          - "============================================================"
          - "Return code: {{ start_vm.rc }}"
          - "STDOUT:"
          - "{{ start_vm.stdout | default('') }}"
          - "STDERR:"
          - "{{ start_vm.stderr | default('') }}"
          - "============================================================"

    # ============================================================
    # WAIT
    # ============================================================

    - name: Wait for VMware startup
      ansible.builtin.pause:
        seconds: 10
      when: start_vm.rc == 0

    # ============================================================
    # FINAL STATUS CHECK
    # ============================================================

    - name: Get running VMware virtual machines
      ansible.builtin.command:
        argv:
          - "{{ vmrun_windows }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_list_after
      changed_when: false
      failed_when: false

    - name: Set final ESXi VM running status
      ansible.builtin.set_fact:
        esxi_vm_running_after: >-
          {{
            vmx_file_windows in vmrun_list_after.stdout
          }}

    - name: Display final VM status
      debug:
        msg:
          - "============================================================"
          - "FINAL ESXi VM STATUS"
          - "============================================================"
          - "VM Name  : {{ vm_name }}"
          - "VMX      : {{ vmx_file_windows }}"
          - "Running  : {{ esxi_vm_running_after }}"
          - "============================================================"

    # ============================================================
    # SUCCESS
    # ============================================================

    - name: Display success
      debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM STARTED SUCCESSFULLY"
          - "============================================================"
          - "VM Name : {{ vm_name }}"
          - "VMX     : {{ vmx_file_windows }}"
          - "============================================================"
      when: esxi_vm_running_after | bool

    # ============================================================
    # TROUBLESHOOTING
    # ============================================================

    - name: Check VMware log exists
      ansible.builtin.stat:
        path: "{{ vmware_log_cygwin }}"
      register: vmware_log_stat
      when: not esxi_vm_running_after | bool

    - name: Read last 100 lines of VMware log
      ansible.builtin.shell: |
        tail -100 "{{ vmware_log_cygwin }}"
      args:
        executable: /bin/bash
      register: vmware_log_tail
      changed_when: false
      failed_when: false
      when:
        - not esxi_vm_running_after | bool
        - vmware_log_stat.stat.exists

    - name: Extract important VMware errors
      ansible.builtin.shell: |
        grep -Ei \
        "Error|Failed|Cannot|No PCI|Too many|VT-x|AMD-V|DevicePowerOn|power on failed|Module" \
        "{{ vmware_log_cygwin }}" \
        | tail -50
      args:
        executable: /bin/bash
      register: vmware_important_errors
      changed_when: false
      failed_when: false
      when:
        - not esxi_vm_running_after | bool
        - vmware_log_stat.stat.exists

    - name: Fail with VMware troubleshooting information
      ansible.builtin.fail:
        msg: |
          ============================================================
          FAILED TO START NESTED ESXi VM
          ============================================================

          VMX:
          {{ vmx_file_windows }}

          VMware hardware version:
          virtualHW.version = "{{ vm_hardware_version }}"

          vmrun return code:
          {{ start_vm.rc }}

          vmrun stdout:
          {{ start_vm.stdout | default('') }}

          vmrun stderr:
          {{ start_vm.stderr | default('') }}

          ------------------------------------------------------------
          IMPORTANT VMWARE LOG ERRORS
          ------------------------------------------------------------

          {{ vmware_important_errors.stdout | default('No filtered errors found') }}

          ------------------------------------------------------------
          LAST VMWARE LOG ENTRIES
          ------------------------------------------------------------

          {{ vmware_log_tail.stdout | default('VMware log not available') }}

          ============================================================
      when: not esxi_vm_running_after | bool
