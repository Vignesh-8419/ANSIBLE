---
- name: Create and Start Nested ESXi VM in VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ========================================================================
    # BASIC CONFIGURATION
    # ========================================================================

    vm_name: "ESXI-01"

    # Cygwin paths - used by Ansible/Cygwin
    vm_dir_cygwin: "/cygdrive/d/ESXI/ESXI-01"
    vmx_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmx"
    vmdk_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmdk"
    vmware_log_cygwin: "/cygdrive/d/ESXI/ESXI-01/vmware.log"

    esxi_iso_cygwin: "/cygdrive/e/vmware/VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso"

    vmrun_cygwin: "/cygdrive/d/VM workstation/vmrun.exe"
    vdiskmanager_cygwin: "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"

    # Windows paths - MUST be passed to VMware Windows executables
    vm_dir_windows: 'D:\ESXI\ESXI-01'
    vmx_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmx'
    vmdk_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmdk'

    esxi_iso_windows: 'E:\vmware\VMware-VMvisor-Installer-8.0U1-21495797.x86_64.iso'

    vmrun_windows: 'D:\VM workstation\vmrun.exe'
    vdiskmanager_windows: 'D:\VM workstation\vmware-vdiskmanager.exe'

    # ========================================================================
    # VM HARDWARE
    # ========================================================================

    vm_memory_mb: 24568
    vm_vcpu: 12
    vm_disk_gb: 2000

    # Known-good version from your VMware installation
    virtual_hw_version: "19"

    guest_os: "vmkernel7"

    # VMnet0 = bridged networking
    network_type: "bridged"
    network_name: "VMnet0"

    startup_wait: 15


  tasks:

    # ========================================================================
    # CREATE/VERIFY ANSIBLE TEMP DIRECTORY
    # ========================================================================

    - name: Create Cygwin Ansible temporary directory
      ansible.builtin.raw: |
        mkdir -p /tmp/.ansible-vigne
        mkdir -p /tmp/.ansible-vigne/tmp
        chmod 700 /tmp/.ansible-vigne
        chmod 700 /tmp/.ansible-vigne/tmp
      changed_when: false


    # ========================================================================
    # DISPLAY CONFIGURATION
    # ========================================================================

    - name: Display ESXi configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NESTED ESXi VM CONFIGURATION"
          - "============================================================"
          - "VM Name       : {{ vm_name }}"
          - "VM Directory  : {{ vm_dir_windows }}"
          - "VMX           : {{ vmx_file_windows }}"
          - "VMDK          : {{ vmdk_file_windows }}"
          - "ESXi ISO      : {{ esxi_iso_windows }}"
          - "VMRUN         : {{ vmrun_windows }}"
          - "VDISKMANAGER  : {{ vdiskmanager_windows }}"
          - "RAM           : {{ vm_memory_mb }} MB"
          - "CPU           : {{ vm_vcpu }} vCPU"
          - "Disk          : {{ vm_disk_gb }} GB"
          - "Hardware Ver  : {{ virtual_hw_version }}"
          - "Guest OS      : {{ guest_os }}"
          - "Network       : {{ network_type }}"
          - "Network       : {{ network_name }}"
          - "Firmware      : EFI"
          - "Nested VT     : ENABLED"
          - "USB           : DISABLED"
          - "USB xHCI      : DISABLED"
          - "Sound         : DISABLED"
          - "Serial        : DISABLED"
          - "Parallel      : DISABLED"
          - "Floppy        : DISABLED"
          - "============================================================"


    # ========================================================================
    # VALIDATE ISO
    # ========================================================================

    - name: Check ESXi ISO exists
      ansible.builtin.stat:
        path: "{{ esxi_iso_cygwin }}"
      register: esxi_iso_stat

    - name: Fail when ESXi ISO does not exist
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi ISO NOT FOUND
          ============================================================

          Cygwin path:
          {{ esxi_iso_cygwin }}

          Windows path:
          {{ esxi_iso_windows }}

          ============================================================
      when: not esxi_iso_stat.stat.exists


    # ========================================================================
    # VALIDATE VMRUN
    # ========================================================================

    - name: Check VMware vmrun.exe
      ansible.builtin.stat:
        path: "{{ vmrun_cygwin }}"
      register: vmrun_stat

    - name: Fail when vmrun.exe is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMWARE VMRUN.EXE NOT FOUND
          ============================================================

          Expected:
          {{ vmrun_windows }}

          ============================================================
      when: not vmrun_stat.stat.exists


    # ========================================================================
    # VALIDATE VDISKMANAGER
    # ========================================================================

    - name: Check VMware vdiskmanager.exe
      ansible.builtin.stat:
        path: "{{ vdiskmanager_cygwin }}"
      register: vdiskmanager_stat

    - name: Fail when vdiskmanager.exe is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMWARE-VDISKMANAGER.EXE NOT FOUND
          ============================================================

          Expected:
          {{ vdiskmanager_windows }}

          ============================================================
      when: not vdiskmanager_stat.stat.exists


    # ========================================================================
    # CREATE VM DIRECTORY
    # ========================================================================

    - name: Create ESXi VM directory
      ansible.builtin.command:
        argv:
          - mkdir
          - -p
          - "{{ vm_dir_cygwin }}"
      changed_when: false


    # ========================================================================
    # CHECK CURRENT VM STATE
    # ========================================================================

    - name: Get VMware running VM list
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_before
      changed_when: false
      failed_when: false

    - name: Determine whether ESXi VM is running
      ansible.builtin.set_fact:
        vm_running_before: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_before.stdout | lower)
          }}

    - name: Display current ESXi VM state
      ansible.builtin.debug:
        msg:
          - "Current VM running state: {{ vm_running_before }}"
          - "Requested action: {{ power | default('on') }}"


    # ========================================================================
    # POWER OFF MODE
    # ========================================================================

    - name: Stop ESXi VM when power is off
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      register: vm_stop
      failed_when: false
      changed_when: vm_stop.rc == 0
      when:
        - power | default('on') | lower == "off"
        - vm_running_before | bool

    - name: Wait after power off
      ansible.builtin.pause:
        seconds: 5
      when:
        - power | default('on') | lower == "off"
        - vm_running_before | bool

    - name: Display power off result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VM POWER OFF RESULT"
          - "============================================================"
          - "Return code: {{ vm_stop.rc | default(0) }}"
          - "Output: {{ vm_stop.stdout | default('VM already powered off') }}"
          - "{{ vm_stop.stderr | default('') }}"
          - "============================================================"
      when: power | default('on') | lower == "off"

    - name: End after power off
      ansible.builtin.meta: end_play
      when: power | default('on') | lower == "off"


    # ========================================================================
    # POWER OFF BEFORE REBUILD
    # ========================================================================

    - name: Stop ESXi VM before automatic repair
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      register: vm_stop_repair
      failed_when: false
      changed_when: vm_stop_repair.rc == 0
      when: vm_running_before | bool

    - name: Wait for VM shutdown
      ansible.builtin.pause:
        seconds: 5
      when: vm_running_before | bool


    # ========================================================================
    # BACKUP EXISTING VMX
    # ========================================================================

    - name: Check existing VMX
      ansible.builtin.stat:
        path: "{{ vmx_file_cygwin }}"
      register: old_vmx_stat

    - name: Backup existing VMX
      ansible.builtin.copy:
        src: "{{ vmx_file_cygwin }}"
        dest: "{{ vmx_file_cygwin }}.ansible-backup"
        remote_src: true
        mode: "0644"
      when: old_vmx_stat.stat.exists


    # ========================================================================
    # REMOVE STALE VMWARE LOCKS AND STATE
    # ========================================================================

    - name: Remove stale VMware lock directories
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 2 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Remove stale VMware state files
      ansible.builtin.shell: |
        rm -f "{{ vm_dir_cygwin }}"/*.vmem 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmss 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmpl 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmsn 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.scoreboard 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false


    # ========================================================================
    # REMOVE OLD VMX
    #
    # We intentionally CREATE a clean VMX.
    # This eliminates stale pciBridge/pciSlotNumber configuration.
    # ========================================================================

    - name: Remove old VMX before rebuilding clean configuration
      ansible.builtin.file:
        path: "{{ vmx_file_cygwin }}"
        state: absent


    # ========================================================================
    # CREATE VIRTUAL DISK
    # ========================================================================

    - name: Check existing VMDK
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_stat


    - name: Create ESXi virtual disk
      ansible.builtin.command:
        argv:
          - "{{ vdiskmanager_cygwin }}"
          - "-c"
          - "-s"
          - "{{ vm_disk_gb }}GB"
          - "-a"
          - "lsilogic"
          - "-t"
          - "0"
          - "{{ vmdk_file_windows }}"
      register: vmdk_create
      changed_when: vmdk_create.rc == 0
      failed_when: vmdk_create.rc != 0
      when: not vmdk_stat.stat.exists


    - name: Display existing VMDK status
      ansible.builtin.debug:
        msg: "Existing VMDK preserved: {{ vmdk_file_windows }}"
      when: vmdk_stat.stat.exists


    - name: Verify VMDK exists
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_after


    - name: Fail when VMDK is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          VMDK CREATION FAILED
          ============================================================

          Expected:
          {{ vmdk_file_windows }}

          ============================================================
      when: not vmdk_after.stat.exists


    # ========================================================================
    # CREATE COMPLETELY CLEAN VMX
    #
    # IMPORTANT:
    # No pciSlotNumber.
    # No pciBridge configuration.
    # No stale devices.
    # ========================================================================

    - name: Create clean ESXi VMX
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "windows-1252"

          config.version = "8"
          virtualHW.version = "{{ virtual_hw_version }}"

          displayName = "{{ vm_name }}"
          guestOS = "{{ guest_os }}"

          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"

          memsize = "{{ vm_memory_mb }}"
          numvcpus = "{{ vm_vcpu }}"
          cpuid.coresPerSocket = "1"

          # ==========================================================
          # NESTED VIRTUALIZATION
          # ==========================================================

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # ==========================================================
          # SCSI CONTROLLER
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "{{ vmdk_file_windows }}"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ==========================================================
          # CD/DVD
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "{{ esxi_iso_windows }}"
          ide1:0.startConnected = "TRUE"

          # ==========================================================
          # NETWORK
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "{{ network_type }}"
          ethernet0.vnet = "{{ network_name }}"
          ethernet0.virtualDev = "e1000e"
          ethernet0.startConnected = "TRUE"
          ethernet0.addressType = "generated"

          # ==========================================================
          # DISABLE UNNECESSARY DEVICES
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"

          sound.present = "FALSE"

          serial0.present = "FALSE"
          parallel0.present = "FALSE"

          floppy0.present = "FALSE"

          printer0.present = "FALSE"

          # ==========================================================
          # DISPLAY
          # ==========================================================

          svga.present = "TRUE"
          svga.autodetect = "TRUE"
          svga.vramSize = "67108864"

          # ==========================================================
          # POWER
          # ==========================================================

          powerType.powerOff = "hard"
          powerType.powerOn = "hard"
          powerType.reset = "hard"
          powerType.suspend = "hard"

          # ==========================================================
          # TOOLS
          # ==========================================================

          tools.upgrade.policy = "manual"
          tools.syncTime = "FALSE"

          # ==========================================================
          # MISC
          # ==========================================================

          isolation.tools.copy.disable = "FALSE"
          isolation.tools.paste.disable = "FALSE"


    # ========================================================================
    # VERIFY CLEAN VMX
    # ========================================================================

    - name: Read newly created VMX
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: clean_vmx_slurp


    - name: Set VMX text
      ansible.builtin.set_fact:
        clean_vmx_text: "{{ clean_vmx_slurp.content | b64decode }}"


    - name: Fail if VMX contains manual PCI slot assignment
      ansible.builtin.fail:
        msg: |
          ============================================================
          MANUAL PCI SLOT DETECTED
          ============================================================

          The generated VMX unexpectedly contains pciSlotNumber.

          This playbook intentionally creates the VMX without
          manual PCI slot assignments.
          ============================================================
      when: "'pciSlotNumber' in clean_vmx_text"


    - name: Fail if VMX contains old PCI bridge configuration
      ansible.builtin.fail:
        msg: |
          ============================================================
          PCI BRIDGE CONFIGURATION DETECTED
          ============================================================

          The generated VMX contains pciBridge configuration.

          This indicates the clean VMX was not generated correctly.
          ============================================================
      when: "'pciBridge' in clean_vmx_text"


    - name: Verify SCSI controller
      ansible.builtin.assert:
        that:
          - "'scsi0.present = \"TRUE\"' in clean_vmx_text"
          - "'scsi0.virtualDev = \"lsilogic\"' in clean_vmx_text"
          - "'scsi0:0.present = \"TRUE\"' in clean_vmx_text"
        fail_msg: "Required SCSI configuration is missing."
        success_msg: "SCSI controller and disk configuration verified."


    - name: Verify nested virtualization
      ansible.builtin.assert:
        that:
          - "'vhv.enable = \"TRUE\"' in clean_vmx_text"
        fail_msg: "Nested virtualization is not enabled."
        success_msg: "Nested virtualization enabled."


    - name: Verify hardware version
      ansible.builtin.assert:
        that:
          - ('virtualHW.version = "' ~ virtual_hw_version ~ '"') in clean_vmx_text
        fail_msg: "Incorrect VM hardware version."
        success_msg: "VM hardware version 19 verified."


    - name: Display clean VMX summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "CLEAN VMX CREATED"
          - "============================================================"
          - "Hardware Version : {{ virtual_hw_version }}"
          - "Manual PCI Slots : NONE"
          - "PCI Bridges      : NONE"
          - "SCSI Controller  : LSILogic"
          - "Nested VT        : ENABLED"
          - "USB              : DISABLED"
          - "xHCI             : DISABLED"
          - "============================================================"


    # ========================================================================
    # REMOVE OLD VMWARE LOG
    # ========================================================================

    - name: Remove old VMware log
      ansible.builtin.file:
        path: "{{ vmware_log_cygwin }}"
        state: absent


    # ========================================================================
    # START VM
    # ========================================================================

    - name: Start Nested ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ vmx_file_windows }}"
          - "nogui"
      register: vm_start
      changed_when: vm_start.rc == 0
      failed_when: false


    - name: Display VMware start result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMWARE START RESULT"
          - "============================================================"
          - "Return code: {{ vm_start.rc }}"
          - "STDOUT:"
          - "{{ vm_start.stdout | default('') }}"
          - "STDERR:"
          - "{{ vm_start.stderr | default('') }}"
          - "============================================================"


    # ========================================================================
    # WAIT
    # ========================================================================

    - name: Wait for VMware startup
      ansible.builtin.pause:
        seconds: "{{ startup_wait }}"
      when: vm_start.rc == 0


    # ========================================================================
    # CHECK ACTUAL VM STATE
    # ========================================================================

    - name: Get VMware VM list after startup
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_after
      changed_when: false
      failed_when: false


    - name: Determine final VM status
      ansible.builtin.set_fact:
        vm_running_after: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_after.stdout | lower)
          }}


    - name: Display final VM status
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi VM STATUS"
          - "============================================================"
          - "VM Name : {{ vm_name }}"
          - "VMX     : {{ vmx_file_windows }}"
          - "Running : {{ vm_running_after }}"
          - "============================================================"


    # ========================================================================
    # SUCCESS
    # ========================================================================

    - name: Display successful startup
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS"
          - "============================================================"
          - "Nested ESXi VM is running."
          - "VM Name : {{ vm_name }}"
          - "VMX     : {{ vmx_file_windows }}"
          - "RAM     : {{ vm_memory_mb }} MB"
          - "CPU     : {{ vm_vcpu }} vCPU"
          - "Disk    : {{ vm_disk_gb }} GB"
          - "============================================================"
      when: vm_running_after | bool


    # ========================================================================
    # FAILURE DIAGNOSTICS
    # ========================================================================

    - name: Check VMware log after startup failure
      ansible.builtin.stat:
        path: "{{ vmware_log_cygwin }}"
      register: vmware_log_stat
      when: not vm_running_after | bool


    - name: Read current VMware log
      ansible.builtin.shell: |
        tail -150 "{{ vmware_log_cygwin }}"
      args:
        executable: /bin/bash
      register: vmware_log_tail
      changed_when: false
      failed_when: false
      when:
        - not vm_running_after | bool
        - vmware_log_stat.stat.exists


    - name: Extract current VMware errors
      ansible.builtin.shell: |
        grep -iE \
          "error|failed|failure|no pcIe slot|too many pci|power on failed|unable to allocate|scsi|xhci|usb|vt-x|amd-v|virtualization" \
          "{{ vmware_log_cygwin }}" |
        tail -80
      args:
        executable: /bin/bash
      register: vmware_errors
      changed_when: false
      failed_when: false
      when:
        - not vm_running_after | bool
        - vmware_log_stat.stat.exists


    - name: Fail with current VMware troubleshooting
      ansible.builtin.fail:
        msg: |
          ============================================================
          FAILED TO START NESTED ESXi VM
          ============================================================

          VM:
          {{ vm_name }}

          VMX:
          {{ vmx_file_windows }}

          Hardware:
          virtualHW.version = "{{ virtual_hw_version }}"

          vmrun return code:
          {{ vm_start.rc }}

          vmrun stdout:
          {{ vm_start.stdout | default('') }}

          vmrun stderr:
          {{ vm_start.stderr | default('') }}

          ------------------------------------------------------------
          CURRENT VMWARE ERRORS
          ------------------------------------------------------------

          {{ vmware_errors.stdout | default('No current filtered errors found.') }}

          ------------------------------------------------------------
          LAST 150 VMWARE LOG LINES
          ------------------------------------------------------------

          {{ vmware_log_tail.stdout | default('VMware log not available.') }}

          ------------------------------------------------------------
          VMX BACKUP
          ------------------------------------------------------------

          {{ vmx_file_cygwin }}.ansible-backup

          ============================================================
      when: not vm_running_after | bool
