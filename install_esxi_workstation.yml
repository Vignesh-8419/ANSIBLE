---
- name: Automated Nested ESXi 8.0U1 Installation in VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ========================================================================
    # VM CONFIGURATION
    # ========================================================================

    vm_name: "ESXI-01"

    vm_dir_cygwin: "/cygdrive/d/ESXI/ESXI-01"
    vmx_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmx"
    vmdk_file_cygwin: "/cygdrive/d/ESXI/ESXI-01/ESXI-01.vmdk"
    vmware_log_cygwin: "/cygdrive/d/ESXI/ESXI-01/vmware.log"

    vmx_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmx'
    vmdk_file_windows: 'D:\ESXI\ESXI-01\ESXI-01.vmdk'

    # ========================================================================
    # ESXi ISO
    # ========================================================================

    esxi_iso_cygwin: "/cygdrive/e/vmware/ESXi-8.0.1-auto.iso"
    esxi_iso_windows: 'E:\vmware\ESXi-8.0.1-auto.iso'

    # ========================================================================
    # VMware Workstation
    # ========================================================================

    vmrun_cygwin: "/cygdrive/d/VM workstation/vmrun.exe"
    vmware_cygwin: "/cygdrive/d/VM workstation/vmware.exe"
    vdiskmanager_cygwin: "/cygdrive/d/VM workstation/vmware-vdiskmanager.exe"

    vmrun_windows: 'D:\VM workstation\vmrun.exe'
    vmware_windows: 'D:\VM workstation\vmware.exe'
    vdiskmanager_windows: 'D:\VM workstation\vmware-vdiskmanager.exe'

    # ========================================================================
    # VM HARDWARE
    # ========================================================================

    vm_memory_mb: 24568
    vm_vcpu: 12
    vm_disk_gb: 2000

    virtual_hw_version: "19"
    guest_os: "vmkernel7"

    # ========================================================================
    # NETWORK
    # ========================================================================

    network_type: "custom"
    network_name: "VMnet0"

    # ========================================================================
    # TIMING
    # ========================================================================

    workstation_open_wait_seconds: 8
    vm_start_wait_seconds: 20
    vm_shutdown_wait_seconds: 15

    # ESXi scripted installation may take several minutes.
    esxi_install_wait_seconds: 420

    # ========================================================================
    # INSTALLATION VMX VALIDATION
    # ========================================================================

    installation_hw_line: 'virtualHW.version = "19"'
    installation_firmware_line: 'firmware = "efi"'
    installation_nested_line: 'vhv.enable = "TRUE"'
    installation_network_type_line: 'ethernet0.connectionType = "custom"'
    installation_network_name_line: 'ethernet0.vnet = "VMnet0"'
    installation_scsi_line: 'scsi0.present = "TRUE"'
    installation_disk_line: 'scsi0:0.present = "TRUE"'
    installation_cd_line: 'ide1:0.present = "TRUE"'
    installation_cd_connected_line: 'ide1:0.startConnected = "TRUE"'
    installation_boot_order_line: 'efi.bootOrder = "cdrom,hdd"'
    installation_hdd_order_line: 'efi.hddOrder = "scsi0:0"'

    # ========================================================================
    # FINAL VMX VALIDATION
    # ========================================================================

    final_hw_line: 'virtualHW.version = "19"'
    final_firmware_line: 'firmware = "efi"'
    final_nested_line: 'vhv.enable = "TRUE"'
    final_network_type_line: 'ethernet0.connectionType = "custom"'
    final_network_name_line: 'ethernet0.vnet = "VMnet0"'
    final_scsi_line: 'scsi0.present = "TRUE"'
    final_disk_line: 'scsi0:0.present = "TRUE"'
    final_cd_line: 'ide1:0.present = "TRUE"'
    final_cd_disconnected_line: 'ide1:0.startConnected = "FALSE"'
    final_boot_order_line: 'efi.bootOrder = "hdd"'
    final_hdd_order_line: 'efi.hddOrder = "scsi0:0"'

  tasks:

    # ========================================================================
    # DISPLAY
    # ========================================================================

    - name: Display ESXi configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AUTOMATED NESTED ESXi INSTALLATION"
          - "============================================================"
          - "VM Name          : {{ vm_name }}"
          - "VMX              : {{ vmx_file_windows }}"
          - "VMDK             : {{ vmdk_file_windows }}"
          - "ESXi ISO         : {{ esxi_iso_windows }}"
          - "RAM              : {{ vm_memory_mb }} MB"
          - "CPU              : {{ vm_vcpu }} vCPU"
          - "Disk             : {{ vm_disk_gb }} GB"
          - "Hardware Version : {{ virtual_hw_version }}"
          - "Firmware         : EFI"
          - "Nested VT        : ENABLED"
          - "Network          : CUSTOM / {{ network_name }}"
          - "USB              : DISABLED"
          - "xHCI             : DISABLED"
          - "Sound            : DISABLED"
          - "Serial           : DISABLED"
          - "Parallel         : DISABLED"
          - "Floppy           : DISABLED"
          - "============================================================"

    # ========================================================================
    # VALIDATE ESXi ISO
    # ========================================================================

    - name: Check customized ESXi ISO
      ansible.builtin.stat:
        path: "{{ esxi_iso_cygwin }}"
      register: esxi_iso_stat

    - name: Fail when customized ESXi ISO is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          CUSTOMIZED ESXi ISO NOT FOUND
          ============================================================

          Expected:

          Cygwin:
          {{ esxi_iso_cygwin }}

          Windows:
          {{ esxi_iso_windows }}

          ============================================================
      when: not esxi_iso_stat.stat.exists

    - name: Display ISO validation
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ISO VALIDATION"
          - "============================================================"
          - "ISO : {{ esxi_iso_windows }}"
          - "Status : FOUND"
          - "============================================================"

    # ========================================================================
    # VALIDATE vmrun.exe
    # ========================================================================

    - name: Check vmrun.exe
      ansible.builtin.stat:
        path: "{{ vmrun_cygwin }}"
      register: vmrun_stat

    - name: Fail when vmrun.exe is missing
      ansible.builtin.fail:
        msg: |
          VMware vmrun.exe not found:

          {{ vmrun_windows }}
      when: not vmrun_stat.stat.exists

    # ========================================================================
    # VALIDATE vmware.exe
    # ========================================================================

    - name: Check VMware Workstation executable
      ansible.builtin.stat:
        path: "{{ vmware_cygwin }}"
      register: vmware_stat

    - name: Fail when VMware Workstation executable is missing
      ansible.builtin.fail:
        msg: |
          VMware Workstation executable not found:

          {{ vmware_windows }}
      when: not vmware_stat.stat.exists

    # ========================================================================
    # VALIDATE vdiskmanager
    # ========================================================================

    - name: Check vmware-vdiskmanager.exe
      ansible.builtin.stat:
        path: "{{ vdiskmanager_cygwin }}"
      register: vdiskmanager_stat

    - name: Fail when vdiskmanager is missing
      ansible.builtin.fail:
        msg: |
          vmware-vdiskmanager.exe not found:

          {{ vdiskmanager_windows }}
      when: not vdiskmanager_stat.stat.exists

    # ========================================================================
    # CREATE VM DIRECTORY
    # ========================================================================

    - name: Create ESXi VM directory
      ansible.builtin.file:
        path: "{{ vm_dir_cygwin }}"
        state: directory
        mode: "0755"

    # ========================================================================
    # CHECK CURRENT VM STATE
    # ========================================================================

    - name: Get currently running VMware VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_list_before
      changed_when: false
      failed_when: false

    - name: Determine whether ESXi VM is currently running
      ansible.builtin.set_fact:
        vm_running_before: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_list_before.stdout | lower)
          }}

    - name: Display current ESXi state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "CURRENT ESXi STATE"
          - "============================================================"
          - "VM Name : {{ vm_name }}"
          - "Running : {{ vm_running_before }}"
          - "============================================================"

    # ========================================================================
    # STOP EXISTING VM
    #
    # The playbook starts this VM through vmrun, so vmrun stop should work
    # on subsequent runs.
    # ========================================================================

    - name: Stop existing ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      register: stop_existing
      changed_when: stop_existing.rc == 0
      failed_when: false
      when: vm_running_before | bool

    - name: Display existing VM stop result
      ansible.builtin.debug:
        msg:
          - "Return code : {{ stop_existing.rc | default('not executed') }}"
          - "STDOUT      : {{ stop_existing.stdout | default('') }}"
          - "STDERR      : {{ stop_existing.stderr | default('') }}"
      when: vm_running_before | bool

    - name: Recheck running VMs after stop attempt
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_list_after_stop
      changed_when: false
      failed_when: false
      when: vm_running_before | bool

    - name: Determine whether ESXi is still running
      ansible.builtin.set_fact:
        vm_still_running: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_list_after_stop.stdout | default('') | lower)
          }}
      when: vm_running_before | bool

    - name: Fail if existing ESXi VM cannot be stopped
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXI-01 IS STILL RUNNING
          ============================================================

          The playbook will NOT modify the VMX while the VM is running.

          VMX:

          {{ vmx_file_windows }}

          vmrun output:

          {{ vmrun_list_after_stop.stdout | default('') }}

          Stop ESXI-01 in VMware Workstation and rerun the playbook.

          ============================================================
      when:
        - vm_running_before | bool
        - vm_still_running | bool

    - name: Wait after VM shutdown
      ansible.builtin.pause:
        seconds: "{{ vm_shutdown_wait_seconds }}"
      when:
        - vm_running_before | bool
        - not vm_still_running | bool

    # ========================================================================
    # CLEAN STALE LOCKS
    # ========================================================================

    - name: Remove stale VMware lock directories
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 2 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # CLEAN STALE STATE FILES
    # ========================================================================

    - name: Remove stale VMware state files
      ansible.builtin.shell: |
        rm -f "{{ vm_dir_cygwin }}"/*.vmem 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmss 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmsn 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.vmpl 2>/dev/null || true
        rm -f "{{ vm_dir_cygwin }}"/*.scoreboard 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # CHECK EXISTING VMX
    # ========================================================================

    - name: Check existing VMX
      ansible.builtin.stat:
        path: "{{ vmx_file_cygwin }}"
      register: existing_vmx_stat

    - name: Backup existing VMX
      ansible.builtin.copy:
        src: "{{ vmx_file_cygwin }}"
        dest: "{{ vmx_file_cygwin }}.ansible-backup"
        remote_src: true
        mode: "0644"
      when: existing_vmx_stat.stat.exists

    # ========================================================================
    # CHECK EXISTING VMDK
    # ========================================================================

    - name: Check existing VMDK
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: existing_vmdk_stat

    # ========================================================================
    # CREATE VMDK
    # ========================================================================

    - name: Create ESXi virtual disk
      ansible.builtin.command:
        argv:
          - "{{ vdiskmanager_cygwin }}"
          - "-c"
          - "-s"
          - "{{ vm_disk_gb }}GB"
          - "-a"
          - "lsilogic"
          - "-t"
          - "0"
          - "{{ vmdk_file_windows }}"
      register: vmdk_create_result
      changed_when: vmdk_create_result.rc == 0
      failed_when: vmdk_create_result.rc != 0
      when: not existing_vmdk_stat.stat.exists

    - name: Display VMDK creation result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VIRTUAL DISK"
          - "============================================================"
          - "Path : {{ vmdk_file_windows }}"
          - "Size : {{ vm_disk_gb }} GB"
          - "Result:"
          - "{{ vmdk_create_result.stdout | default('Existing VMDK preserved.') }}"
          - "============================================================"

    # ========================================================================
    # VERIFY VMDK
    # ========================================================================

    - name: Verify VMDK exists
      ansible.builtin.stat:
        path: "{{ vmdk_file_cygwin }}"
      register: vmdk_after

    - name: Fail when VMDK is missing
      ansible.builtin.fail:
        msg: |
          VMDK was not found:

          {{ vmdk_file_windows }}
      when: not vmdk_after.stat.exists

    # ========================================================================
    # CREATE INSTALLATION VMX
    # ========================================================================

    - name: Create installation VMX
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "UTF-8"

          config.version = "8"
          virtualHW.version = "{{ virtual_hw_version }}"
          virtualHW.productCompatibility = "hosted"

          displayName = "{{ vm_name }}"
          guestOS = "{{ guest_os }}"

          # ==========================================================
          # EFI
          # ==========================================================

          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"

          # ==========================================================
          # HARDWARE
          # ==========================================================

          memsize = "{{ vm_memory_mb }}"
          numvcpus = "{{ vm_vcpu }}"
          cpuid.coresPerSocket = "1"

          # ==========================================================
          # NESTED VIRTUALIZATION
          # ==========================================================

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # ==========================================================
          # PCI BRIDGES
          # ==========================================================

          pciBridge0.present = "TRUE"
          pciBridge0.pciSlotNumber = "17"

          pciBridge1.present = "TRUE"
          pciBridge1.pciSlotNumber = "18"

          pciBridge2.present = "TRUE"
          pciBridge2.pciSlotNumber = "19"

          pciBridge3.present = "TRUE"
          pciBridge3.pciSlotNumber = "20"

          pciBridge4.present = "TRUE"
          pciBridge4.virtualDev = "pcieRootPort"
          pciBridge4.functions = "8"
          pciBridge4.pciSlotNumber = "21"

          pciBridge5.present = "TRUE"
          pciBridge5.virtualDev = "pcieRootPort"
          pciBridge5.functions = "8"
          pciBridge5.pciSlotNumber = "22"

          pciBridge6.present = "TRUE"
          pciBridge6.virtualDev = "pcieRootPort"
          pciBridge6.functions = "8"
          pciBridge6.pciSlotNumber = "23"

          pciBridge7.present = "TRUE"
          pciBridge7.virtualDev = "pcieRootPort"
          pciBridge7.functions = "8"
          pciBridge7.pciSlotNumber = "24"

          # ==========================================================
          # SCSI CONTROLLER
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"
          scsi0.pciSlotNumber = "160"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "{{ vmdk_file_windows }}"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ==========================================================
          # CUSTOMIZED ESXi ISO
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "{{ esxi_iso_windows }}"
          ide1:0.startConnected = "TRUE"

          # ==========================================================
          # NETWORK
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "VMnet0"
          ethernet0.virtualDev = "e1000e"
          ethernet0.addressType = "generated"
          ethernet0.startConnected = "TRUE"

          # ==========================================================
          # DISABLE UNNECESSARY DEVICES
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"
          ehci.present = "FALSE"

          sound.present = "FALSE"

          serial0.present = "FALSE"
          parallel0.present = "FALSE"
          floppy0.present = "FALSE"
          printer0.present = "FALSE"

          # ==========================================================
          # DISPLAY
          # ==========================================================

          svga.present = "TRUE"
          svga.autodetect = "TRUE"
          svga.vramSize = "134217728"

          # ==========================================================
          # INSTALLATION BOOT
          # ISO FIRST, DISK SECOND
          # ==========================================================

          efi.bootOrder = "cdrom,hdd"
          efi.hddOrder = "scsi0:0"

          # ==========================================================
          # POWER
          # ==========================================================

          powerType.powerOff = "soft"
          powerType.powerOn = "soft"
          powerType.suspend = "soft"
          powerType.reset = "soft"

          # ==========================================================
          # TOOLS
          # ==========================================================

          tools.upgrade.policy = "manual"
          tools.syncTime = "FALSE"

    # ========================================================================
    # READ INSTALLATION VMX
    # ========================================================================

    - name: Read installation VMX
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: installation_vmx_slurp

    - name: Set installation VMX text
      ansible.builtin.set_fact:
        installation_vmx_text: >-
          {{
            installation_vmx_slurp.content | b64decode
          }}

    # ========================================================================
    # VALIDATE INSTALLATION VMX
    # ========================================================================

    - name: Validate installation VMX
      ansible.builtin.assert:
        that:
          - installation_hw_line in installation_vmx_text
          - installation_firmware_line in installation_vmx_text
          - installation_nested_line in installation_vmx_text
          - installation_network_type_line in installation_vmx_text
          - installation_network_name_line in installation_vmx_text
          - installation_scsi_line in installation_vmx_text
          - installation_disk_line in installation_vmx_text
          - installation_cd_line in installation_vmx_text
          - installation_cd_connected_line in installation_vmx_text
          - installation_boot_order_line in installation_vmx_text
          - installation_hdd_order_line in installation_vmx_text
        fail_msg: "Installation VMX validation failed."
        success_msg: "Installation VMX validated successfully."

    - name: Display installation VMX summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "INSTALLATION VMX"
          - "============================================================"
          - "Hardware : {{ virtual_hw_version }}"
          - "Firmware : EFI"
          - "Nested VT : TRUE"
          - "Disk : scsi0:0"
          - "CD : CONNECTED"
          - "Boot : CDROM -> HDD"
          - "HDD : scsi0:0"
          - "Network : CUSTOM / VMnet0"
          - "ISO : {{ esxi_iso_windows }}"
          - "============================================================"

    # ========================================================================
    # START VM THROUGH VMRUN
    #
    # IMPORTANT:
    # We start with vmrun first so vmrun owns the power-control lifecycle.
    # ========================================================================

    - name: Start ESXi installation VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ vmx_file_windows }}"
          - "nogui"
      register: installation_start
      changed_when: installation_start.rc == 0
      failed_when: false

    - name: Display installation start result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ESXi INSTALLATION START"
          - "============================================================"
          - "Return Code : {{ installation_start.rc }}"
          - "STDOUT      : {{ installation_start.stdout }}"
          - "STDERR      : {{ installation_start.stderr }}"
          - "============================================================"

    # ========================================================================
    # OPEN ALREADY RUNNING VM IN WORKSTATION
    #
    # This makes ESXI-01 visible/open in Workstation without using the
    # unsupported vmrun register operation.
    # ========================================================================

    - name: Open running ESXi VM in VMware Workstation
      ansible.builtin.command:
        argv:
          - powershell.exe
          - "-NoProfile"
          - "-NonInteractive"
          - "-Command"
          - >-
            Start-Process
            -FilePath "{{ vmware_windows }}"
            -ArgumentList @("{{ vmx_file_windows }}")
      register: workstation_open
      changed_when: true
      failed_when: false

    - name: Display VMware Workstation open result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VMWARE WORKSTATION"
          - "============================================================"
          - "VM : {{ vm_name }}"
          - "VMX : {{ vmx_file_windows }}"
          - "Opened in VMware Workstation"
          - "============================================================"

    - name: Wait for Workstation UI
      ansible.builtin.pause:
        seconds: "{{ workstation_open_wait_seconds }}"

    # ========================================================================
    # WAIT FOR INSTALLER
    # ========================================================================

    - name: Wait for ESXi installer to start
      ansible.builtin.pause:
        seconds: "{{ vm_start_wait_seconds }}"

    # ========================================================================
    # VERIFY RUNNING
    # ========================================================================

    - name: Check VM during installation
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: install_vm_list
      changed_when: false
      failed_when: false

    - name: Determine installation VM state
      ansible.builtin.set_fact:
        installation_vm_running: >-
          {{
            vmx_file_windows | lower
            in
            (install_vm_list.stdout | lower)
          }}

    - name: Display installation VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "INSTALLATION VM STATE"
          - "============================================================"
          - "Running : {{ installation_vm_running }}"
          - "============================================================"

    - name: Fail when installation VM did not start
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi INSTALLATION VM DID NOT START
          ============================================================

          VMX:

          {{ vmx_file_windows }}

          vmrun output:

          {{ install_vm_list.stdout }}

          ============================================================
      when: not installation_vm_running

    # ========================================================================
    # WAIT FOR SCRIPTED INSTALLATION
    # ========================================================================

    - name: Wait for unattended ESXi installation
      ansible.builtin.pause:
        seconds: "{{ esxi_install_wait_seconds }}"

    # ========================================================================
    # CHECK INSTALLATION LOG
    # ========================================================================

    - name: Check VMware log after installation wait
      ansible.builtin.stat:
        path: "{{ vmware_log_cygwin }}"
      register: installation_log_stat

    - name: Read VMware log after installation wait
      ansible.builtin.shell: |
        tail -200 "{{ vmware_log_cygwin }}"
      args:
        executable: /bin/bash
      register: installation_log_tail
      changed_when: false
      failed_when: false
      when: installation_log_stat.stat.exists

    - name: Display installation completion diagnostics
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "INSTALLATION WAIT COMPLETED"
          - "============================================================"
          - "Waited : {{ esxi_install_wait_seconds }} seconds"
          - "VMware log available : {{ installation_log_stat.stat.exists }}"
          - "============================================================"

    # ========================================================================
    # STOP THE VM THROUGH VMRUN
    #
    # This should work because the VM was started with vmrun.
    # ========================================================================

    - name: Stop ESXi installation VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vmx_file_windows }}"
          - "hard"
      register: installation_stop
      changed_when: installation_stop.rc == 0
      failed_when: false

    - name: Display installation VM stop result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "STOP INSTALLATION VM"
          - "============================================================"
          - "Return Code : {{ installation_stop.rc }}"
          - "STDOUT      : {{ installation_stop.stdout }}"
          - "STDERR      : {{ installation_stop.stderr }}"
          - "============================================================"

    - name: Wait after installation VM shutdown
      ansible.builtin.pause:
        seconds: "{{ vm_shutdown_wait_seconds }}"

    # ========================================================================
    # VERIFY VM REALLY STOPPED
    # ========================================================================

    - name: Get VMware VMs after installation stop
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_after_install_stop
      changed_when: false
      failed_when: false

    - name: Determine if ESXi is still running
      ansible.builtin.set_fact:
        esxi_still_running: >-
          {{
            vmx_file_windows | lower
            in
            (vmrun_after_install_stop.stdout | lower)
          }}

    - name: Fail if ESXi is still running
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXI-01 IS STILL RUNNING
          ============================================================

          vmrun could not stop:

          {{ vmx_file_windows }}

          Current vmrun list:

          {{ vmrun_after_install_stop.stdout }}

          The VMX will NOT be modified while the VM is running.

          ============================================================
      when: esxi_still_running | bool

    # ========================================================================
    # REMOVE STALE LOCKS AFTER INSTALLATION
    # ========================================================================

    - name: Remove stale VMware locks after installation
      ansible.builtin.shell: |
        find "{{ vm_dir_cygwin }}" \
          -maxdepth 2 \
          -type d \
          -name "*.lck" \
          -exec rm -rf {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ========================================================================
    # BACKUP INSTALLATION VMX
    # ========================================================================

    - name: Backup installation VMX
      ansible.builtin.copy:
        src: "{{ vmx_file_cygwin }}"
        dest: "{{ vmx_file_cygwin }}.installed-backup"
        remote_src: true
        mode: "0644"

    # ========================================================================
    # CREATE FINAL VMX
    # ========================================================================

    - name: Create final installed ESXi VMX
      ansible.builtin.copy:
        dest: "{{ vmx_file_cygwin }}"
        mode: "0644"
        content: |
          .encoding = "UTF-8"

          config.version = "8"
          virtualHW.version = "{{ virtual_hw_version }}"
          virtualHW.productCompatibility = "hosted"

          displayName = "{{ vm_name }}"
          guestOS = "{{ guest_os }}"

          # ==========================================================
          # EFI
          # ==========================================================

          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"

          # ==========================================================
          # HARDWARE
          # ==========================================================

          memsize = "{{ vm_memory_mb }}"
          numvcpus = "{{ vm_vcpu }}"
          cpuid.coresPerSocket = "1"

          # ==========================================================
          # NESTED VIRTUALIZATION
          # ==========================================================

          vhv.enable = "TRUE"
          hypervisor.cpuid.v0 = "FALSE"

          monitor.virtual_exec = "hardware"
          monitor.virtual_mmu = "hardware"

          # ==========================================================
          # PCI BRIDGES
          # ==========================================================

          pciBridge0.present = "TRUE"
          pciBridge0.pciSlotNumber = "17"

          pciBridge1.present = "TRUE"
          pciBridge1.pciSlotNumber = "18"

          pciBridge2.present = "TRUE"
          pciBridge2.pciSlotNumber = "19"

          pciBridge3.present = "TRUE"
          pciBridge3.pciSlotNumber = "20"

          pciBridge4.present = "TRUE"
          pciBridge4.virtualDev = "pcieRootPort"
          pciBridge4.functions = "8"
          pciBridge4.pciSlotNumber = "21"

          pciBridge5.present = "TRUE"
          pciBridge5.virtualDev = "pcieRootPort"
          pciBridge5.functions = "8"
          pciBridge5.pciSlotNumber = "22"

          pciBridge6.present = "TRUE"
          pciBridge6.virtualDev = "pcieRootPort"
          pciBridge6.functions = "8"
          pciBridge6.pciSlotNumber = "23"

          pciBridge7.present = "TRUE"
          pciBridge7.virtualDev = "pcieRootPort"
          pciBridge7.functions = "8"
          pciBridge7.pciSlotNumber = "24"

          # ==========================================================
          # INSTALLED ESXi DISK
          # ==========================================================

          scsi0.present = "TRUE"
          scsi0.virtualDev = "lsilogic"
          scsi0.pciSlotNumber = "160"

          scsi0:0.present = "TRUE"
          scsi0:0.fileName = "{{ vmdk_file_windows }}"
          scsi0:0.deviceType = "scsi-hardDisk"

          # ==========================================================
          # CD/DVD
          #
          # Retained but disconnected.
          # ==========================================================

          ide1:0.present = "TRUE"
          ide1:0.deviceType = "cdrom-image"
          ide1:0.fileName = "{{ esxi_iso_windows }}"
          ide1:0.startConnected = "FALSE"

          # ==========================================================
          # NETWORK
          #
          # Explicit VMnet0.
          # ==========================================================

          ethernet0.present = "TRUE"
          ethernet0.connectionType = "custom"
          ethernet0.vnet = "VMnet0"
          ethernet0.virtualDev = "e1000e"
          ethernet0.addressType = "generated"
          ethernet0.startConnected = "TRUE"

          # ==========================================================
          # DISABLE UNNECESSARY DEVICES
          # ==========================================================

          usb.present = "FALSE"
          usb_xhci.present = "FALSE"
          ehci.present = "FALSE"

          sound.present = "FALSE"

          serial0.present = "FALSE"
          parallel0.present = "FALSE"
          floppy0.present = "FALSE"
          printer0.present = "FALSE"

          # ==========================================================
          # DISPLAY
          # ==========================================================

          svga.present = "TRUE"
          svga.autodetect = "TRUE"
          svga.vramSize = "134217728"

          # ==========================================================
          # FINAL DISK BOOT
          # ==========================================================

          efi.bootOrder = "hdd"
          efi.hddOrder = "scsi0:0"

          # ==========================================================
          # POWER
          # ==========================================================

          powerType.powerOff = "soft"
          powerType.powerOn = "soft"
          powerType.suspend = "soft"
          powerType.reset = "soft"

          tools.upgrade.policy = "manual"
          tools.syncTime = "FALSE"

    # ========================================================================
    # READ FINAL VMX
    # ========================================================================

    - name: Read final VMX
      ansible.builtin.slurp:
        src: "{{ vmx_file_cygwin }}"
      register: final_vmx_slurp

    - name: Set final VMX text
      ansible.builtin.set_fact:
        final_vmx_text: >-
          {{
            final_vmx_slurp.content | b64decode
          }}

    # ========================================================================
    # VALIDATE FINAL VMX
    # ========================================================================

    - name: Validate final VMX
      ansible.builtin.assert:
        that:
          - final_hw_line in final_vmx_text
          - final_firmware_line in final_vmx_text
          - final_nested_line in final_vmx_text
          - final_network_type_line in final_vmx_text
          - final_network_name_line in final_vmx_text
          - final_scsi_line in final_vmx_text
          - final_disk_line in final_vmx_text
          - final_cd_line in final_vmx_text
          - final_cd_disconnected_line in final_vmx_text
          - final_boot_order_line in final_vmx_text
          - final_hdd_order_line in final_vmx_text
        fail_msg: "Final VMX validation failed."
        success_msg: "Final VMX validated successfully."

    - name: Display final VMX summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL INSTALLED ESXi VMX"
          - "============================================================"
          - "Hardware : {{ virtual_hw_version }}"
          - "Firmware : EFI"
          - "Nested VT : TRUE"
          - "Disk : scsi0:0"
          - "CD : DISCONNECTED"
          - "Boot : HDD"
          - "HDD : scsi0:0"
          - "Network : CUSTOM / VMnet0"
          - "============================================================"

    # ========================================================================
    # OPEN FINAL VM IN WORKSTATION
    #
    # Workstation sees the VM in its UI.
    # ========================================================================

    - name: Open final ESXi VM in VMware Workstation
      ansible.builtin.command:
        argv:
          - powershell.exe
          - "-NoProfile"
          - "-NonInteractive"
          - "-Command"
          - >-
            Start-Process
            -FilePath "{{ vmware_windows }}"
            -ArgumentList @("{{ vmx_file_windows }}")
      register: final_workstation_open
      changed_when: true
      failed_when: false

    - name: Wait for final VM to open in Workstation
      ansible.builtin.pause:
        seconds: "{{ workstation_open_wait_seconds }}"

    # ========================================================================
    # FINAL BOOT FROM INSTALLED DISK
    # ========================================================================

    - name: Start installed ESXi VM
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ vmx_file_windows }}"
          - "nogui"
      register: final_start
      changed_when: final_start.rc == 0
      failed_when: false

    - name: Display final boot result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi BOOT"
          - "============================================================"
          - "VM Name : {{ vm_name }}"
          - "Boot    : INSTALLED HDD"
          - "HDD     : scsi0:0"
          - "CD      : DISCONNECTED"
          - "Network : CUSTOM / VMnet0"
          - "Return  : {{ final_start.rc }}"
          - "STDOUT  : {{ final_start.stdout }}"
          - "STDERR  : {{ final_start.stderr }}"
          - "============================================================"

    # ========================================================================
    # WAIT FOR ESXi
    # ========================================================================

    - name: Wait for installed ESXi to boot
      ansible.builtin.pause:
        seconds: "{{ vm_start_wait_seconds }}"

    # ========================================================================
    # FINAL VM STATE
    # ========================================================================

    - name: Get final VMware VM list
      ansible.builtin.command:
        argv:
          - "{{ vmrun_cygwin }}"
          - "-T"
          - "ws"
          - "list"
      register: final_vmrun_list
      changed_when: false
      failed_when: false

    - name: Determine final VM running state
      ansible.builtin.set_fact:
        final_vm_running: >-
          {{
            vmx_file_windows | lower
            in
            (final_vmrun_list.stdout | lower)
          }}

    - name: Display final VM state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi VM STATUS"
          - "============================================================"
          - "VM Name : {{ vm_name }}"
          - "Running : {{ final_vm_running }}"
          - "VMX     : {{ vmx_file_windows }}"
          - "VMDK    : {{ vmdk_file_windows }}"
          - "Network : CUSTOM / VMnet0"
          - "Boot    : INSTALLED HDD"
          - "ISO     : DISCONNECTED"
          - "============================================================"

    # ========================================================================
    # CHECK MANAGEMENT PORT
    #
    # We wait for port 443 on 192.168.253.128.
    # ========================================================================

    - name: Wait for ESXi HTTPS management port
      ansible.builtin.wait_for:
        host: "192.168.253.128"
        port: 443
        timeout: 300
        state: started
        msg: "ESXi management HTTPS port 443 did not become available."
      delegate_to: localhost
      when: final_vm_running | bool

    # ========================================================================
    # SUCCESS
    # ========================================================================

    - name: Display successful ESXi installation
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS - ESXi INSTALLATION COMPLETED"
          - "============================================================"
          - "VM Name        : {{ vm_name }}"
          - "VMX            : {{ vmx_file_windows }}"
          - "VMDK           : {{ vmdk_file_windows }}"
          - "Running        : {{ final_vm_running }}"
          - "RAM            : {{ vm_memory_mb }} MB"
          - "CPU            : {{ vm_vcpu }} vCPU"
          - "Disk           : {{ vm_disk_gb }} GB"
          - "Firmware       : EFI"
          - "Nested VT      : ENABLED"
          - "Network        : CUSTOM / VMnet0"
          - "IP             : 192.168.253.128"
          - "Netmask        : 255.255.255.0"
          - "Gateway        : 192.168.253.2"
          - "DNS            : 192.168.253.1"
          - "Hostname       : esxi-host-01.vgs.com"
          - "ISO            : E:\\vmware\\ESXi-8.0.1-auto.iso"
          - "ISO Connected  : NO"
          - "Boot           : HDD / scsi0:0"
          - "ESXi HTTPS     : https://192.168.253.128"
          - "============================================================"
      when: final_vm_running | bool

    # ========================================================================
    # FAILURE DIAGNOSTICS
    # ========================================================================

    - name: Check VMware log after final boot failure
      ansible.builtin.stat:
        path: "{{ vmware_log_cygwin }}"
      register: final_log_stat
      when: not final_vm_running | bool

    - name: Read VMware log after final boot failure
      ansible.builtin.shell: |
        tail -200 "{{ vmware_log_cygwin }}"
      args:
        executable: /bin/bash
      register: final_log_tail
      changed_when: false
      failed_when: false
      when:
        - not final_vm_running | bool
        - final_log_stat.stat.exists

    - name: Extract VMware errors after final boot failure
      ansible.builtin.shell: |
        grep -iE \
        "error|failed|failure|pci|slot|ethernet|scsi|power on failed|unable to allocate|cancel|unsupported|boot" \
        "{{ vmware_log_cygwin }}" |
        tail -100
      args:
        executable: /bin/bash
      register: final_log_errors
      changed_when: false
      failed_when: false
      when:
        - not final_vm_running | bool
        - final_log_stat.stat.exists

    - name: Fail when final ESXi VM is not running
      ansible.builtin.fail:
        msg: |
          ============================================================
          FINAL ESXi BOOT FAILED
          ============================================================

          VM:
          {{ vm_name }}

          VMX:
          {{ vmx_file_windows }}

          Running:
          {{ final_vm_running }}

          vmrun output:

          {{ final_vmrun_list.stdout | default('') }}

          ------------------------------------------------------------
          IMPORTANT VMware ERRORS
          ------------------------------------------------------------

          {{ final_log_errors.stdout | default('No filtered errors found.') }}

          ------------------------------------------------------------
          LAST VMware LOG
          ------------------------------------------------------------

          {{ final_log_tail.stdout | default('VMware log unavailable.') }}

          ============================================================
      when: not final_vm_running
