---
- name: Complete Foreman Katello Installation and Configuration
  hosts: FOREMAN
  become: true
  become_method: sudo
  gather_facts: true

  vars:
    # ===============================================================
    # CONFIGURATION
    # ===============================================================

    repo_server: "http-server-01.vgs.com"
    repo_root: "http://http-server-01.vgs.com/repo"

    skip_patch: false
    run_only: ""

    domain: "vgs.com"
    dns_ip: "192.168.253.1"

    java_path: "/usr/lib/jvm/java-1.8.0-openjdk-1.8.0.412.b08-1.el7_9.x86_64/bin"
    module_path: "/etc/puppetlabs/code/environments/production/modules/java_ks"

    foreman_server_name: "cent-07-01.vgs.com"
    dns_server: "192.168.253.1"
    dhcp_gateway: "192.168.253.2"

    pulp_source: "/var/lib/pulp"
    pulp_destination: "/home/pulp"
    pulp_old: "/var/lib/pulp.old"

    tftp_root: "/var/lib/tftpboot"

  tasks:

    # ===============================================================
    # STEP 1: REPOSITORY
    # ===============================================================

    - name: STEP 1 - Display repository configuration
      ansible.builtin.debug:
        msg: "Using HTTP repository at {{ repo_root }}."

    # ===============================================================
    # STEP 2: CLEAN AND CONFIGURE YUM REPOSITORIES
    # ===============================================================

    - name: STEP 2 - Find existing YUM repository files
      ansible.builtin.find:
        paths: /etc/yum.repos.d
        patterns: "*.repo"
        file_type: file
      register: existing_repo_files

    - name: STEP 2 - Clear existing YUM repository files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ existing_repo_files.files }}"

    - name: STEP 2 - Create base.repo
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/base.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [baseos]
          name=Local CentOS BaseOS Repository
          baseurl={{ repo_root }}/centos
          enabled=1
          gpgcheck=0
          priority=1

          [mesa]
          name=Local Mesa Repository
          baseurl={{ repo_root }}/mesa
          enabled=1
          gpgcheck=0
          priority=1

          [gtk]
          name=Local GTK Repository
          baseurl={{ repo_root }}/gtk
          enabled=1
          gpgcheck=0
          priority=1

    - name: STEP 2 - Create patch.repo
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/patch.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [patch]
          name=Local CentOS Patch Repository
          baseurl={{ repo_root }}/installed_rhel7
          enabled=1
          gpgcheck=0
          exclude=libX11* *.i686

    - name: STEP 2 - Create foreman.repo
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/foreman.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [foreman]
          name=Local Foreman Katello Repository
          baseurl={{ repo_root }}/installed_rhel7
          enabled=1
          gpgcheck=0
          exclude=libX11* *.i686

    - name: STEP 2 - Create puppet.repo
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/puppet.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [puppet7]
          name=Puppet 7 Repository EL7
          baseurl=https://yum.puppet.com/puppet/el/7/x86_64/
          enabled=1
          gpgcheck=0
          exclude=libX11* *.i686

    - name: STEP 2 - Clean yum metadata
      ansible.builtin.command:
        cmd: yum clean all
      changed_when: false
      failed_when: false

    - name: STEP 2 - Remove old yum cache
      ansible.builtin.file:
        path: /var/cache/yum
        state: absent

    - name: STEP 2 - Create yum cache
      ansible.builtin.command:
        cmd: yum makecache
      changed_when: false

    - name: STEP 2 - Check Puppet Server package availability
      ansible.builtin.shell: |
        yum --disablerepo='*' --enablerepo=puppet7 --showduplicates list available puppetserver
      args:
        executable: /bin/bash
      register: puppetserver_available
      changed_when: false
      failed_when: false

    - name: STEP 2 - Display Puppet Server availability
      ansible.builtin.debug:
        var: puppetserver_available.stdout_lines

    - name: STEP 2 - Fail if Puppet Server is unavailable
      ansible.builtin.fail:
        msg: |
          Puppet Server is not available from the Puppet 7 EL7 repository.

          Repository:
          https://yum.puppet.com/puppet/el/7/x86_64/

          Check network access and repository metadata.
      when: puppetserver_available.rc != 0

    - name: STEP 2 - Display enabled repositories
      ansible.builtin.command:
        cmd: yum repolist enabled
      register: yum_repolist
      changed_when: false

    - name: STEP 2 - Show enabled repositories
      ansible.builtin.debug:
        var: yum_repolist.stdout_lines

    - name: STEP 2 - Install yum utilities
      ansible.builtin.yum:
        name: yum-utils
        state: present
        disable_gpg_check: true

    - name: STEP 2 - Check yum-complete-transaction pending cleanup
      ansible.builtin.command:
        cmd: yum-complete-transaction --cleanup-only --quiet --skip-broken
      register: yum_cleanup
      changed_when: false
      failed_when: false

    - name: STEP 2 - Complete pending yum transactions
      ansible.builtin.command:
        cmd: yum-complete-transaction -y
      register: yum_transaction
      changed_when: yum_transaction.rc == 0
      failed_when: false

    - name: STEP 2 - Check available libX11 packages
      ansible.builtin.shell: |
        yum --showduplicates list available 'libX11*' 2>/dev/null || true
      register: libx11_packages
      changed_when: false

    - name: STEP 2 - Display libX11 packages
      ansible.builtin.debug:
        var: libx11_packages.stdout_lines

    - name: STEP 2 - Install required packages
      ansible.builtin.yum:
        name:
          - gtk2
          - gtk3
          - "mesa-libEGL*"
          - "tomcat*"
          - "ruby*"
          - "apache*"
          - "rpm-build*"
          - jq-1.5-1.el7
          - "sshpass*"
        state: present
        disable_gpg_check: true

    # ===============================================================
    # STEP 3: CONFIGURE DNS
    # ===============================================================

    - name: STEP 3 - Check DNS resolution for current server FQDN
      ansible.builtin.command:
        cmd: "nslookup {{ ansible_hostname }}.{{ domain }}"
      register: hostname_dns_check
      changed_when: false
      failed_when: false

    - name: STEP 3 - DNS resolution working
      ansible.builtin.debug:
        msg: "DNS resolution is working."
      when: hostname_dns_check.rc == 0

    - name: STEP 3 - Configure DNS resolver when resolution fails
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          search {{ domain }}
          nameserver {{ dns_ip }}
      when: hostname_dns_check.rc != 0

    - name: STEP 3 - Test Google DNS resolution
      ansible.builtin.command:
        cmd: nslookup google.com
      register: google_dns_check
      changed_when: false
      failed_when: false
      when: hostname_dns_check.rc != 0

    - name: STEP 3 - Display DNS warning
      ansible.builtin.debug:
        msg: "DNS resolution failed. Check {{ dns_ip }}."
      when:
        - hostname_dns_check.rc != 0
        - google_dns_check.rc != 0

    - name: STEP 3 - Install BIND packages
      ansible.builtin.yum:
        name:
          - bind
          - bind-utils
        state: present
        disable_gpg_check: true

    # ===============================================================
    # STEP 4: INSTALL JAVA AND FOREMAN STACK
    # ===============================================================

    - name: STEP 4 - Install Java
      ansible.builtin.yum:
        name:
          - java-1.8.0-openjdk
          - java-1.8.0-openjdk-devel
        state: present
        disable_gpg_check: true

    - name: STEP 4 - Install Puppet Server Katello and Foreman Installer
      ansible.builtin.yum:
        name:
          - puppetserver
          - katello
          - foreman-installer
        state: present
        disable_gpg_check: true

    - name: STEP 4 - Install Redis
      ansible.builtin.yum:
        name: rh-redis5-redis
        state: present
        disable_gpg_check: true

    - name: STEP 4 - Enable Redis service
      ansible.builtin.systemd:
        name: rh-redis5-redis
        enabled: true
        state: started
      failed_when: false

    - name: STEP 4 - Set Java environment path
      ansible.builtin.set_fact:
        java_environment_path: "{{ java_path }}:{{ ansible_env.PATH }}"

    # ===============================================================
    # STEP 5: PUPPET MODULE SETUP
    # ===============================================================

    - name: STEP 5 - Check puppetlabs-java_ks module directory
      ansible.builtin.stat:
        path: "{{ module_path }}"
      register: java_ks_module

    - name: STEP 5 - Remove existing java_ks module
      ansible.builtin.file:
        path: "{{ module_path }}"
        state: absent
      when: java_ks_module.stat.exists

    - name: STEP 5 - Install puppetlabs-java_ks module
      ansible.builtin.command:
        cmd: /opt/puppetlabs/bin/puppet module install puppetlabs-java_ks --force
      environment:
        PATH: "{{ java_environment_path }}"

    - name: STEP 5 - Create Foreman installer modules directory
      ansible.builtin.file:
        path: /usr/share/foreman-installer/modules
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: STEP 5 - Link java_ks module for Foreman installer
      ansible.builtin.file:
        src: "{{ module_path }}"
        dest: /usr/share/foreman-installer/modules/java_ks
        state: link
        force: true

    # ===============================================================
    # STEP 5.1: YUM HISTORY HEALTH CHECK
    # ===============================================================

    - name: STEP 5.1 - Check yum history
      ansible.builtin.command:
        cmd: yum history list
      register: yum_history_check
      changed_when: false
      failed_when: false

    - name: STEP 5.1 - Check yum history directory
      ansible.builtin.stat:
        path: /var/lib/yum/history
      register: yum_history_dir
      when: yum_history_check.rc != 0

    - name: STEP 5.1 - Backup corrupted yum history
      ansible.builtin.command:
        cmd: mv /var/lib/yum/history /var/lib/yum/history.bak
      when:
        - yum_history_check.rc != 0
        - yum_history_dir.stat.exists

    - name: STEP 5.1 - Clean yum after history reset
      ansible.builtin.command:
        cmd: yum clean all
      changed_when: false
      when: yum_history_check.rc != 0

    - name: STEP 5.1 - Rebuild RPM database
      ansible.builtin.command:
        cmd: rpm --rebuilddb
      when: yum_history_check.rc != 0

    # ===============================================================
    # STEP 5.2: FOREMAN INSTALLER PREPARATION
    # ===============================================================

    - name: STEP 5.2 - Get short hostname
      ansible.builtin.command:
        cmd: hostname -s
      register: short_hostname
      changed_when: false

    - name: STEP 5.2 - Get primary IP address
      ansible.builtin.command:
        cmd: hostname -I
      register: hostname_ips
      changed_when: false

    - name: STEP 5.2 - Set hostname facts
      ansible.builtin.set_fact:
        just_ip: "{{ hostname_ips.stdout.split()[0] }}"
        new_hostname: "{{ short_hostname.stdout }}"

    - name: STEP 5.2 - Remove old hostname entries from hosts file
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: ".*{{ new_hostname | regex_escape }}.*"
        state: absent

    - name: STEP 5.2 - Add hostname entry to hosts file
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ just_ip }} {{ new_hostname }}.{{ domain }} {{ new_hostname }}"
        state: present

    - name: STEP 5.2 - Verify hostname hosts entry
      ansible.builtin.command:
        cmd: "grep {{ new_hostname }}.{{ domain }} /etc/hosts"
      changed_when: false

    - name: STEP 5.2 - Clean yum
      ansible.builtin.command:
        cmd: yum clean all
      changed_when: false

    - name: STEP 5.2 - Remove yum cache
      ansible.builtin.file:
        path: /var/cache/yum
        state: absent

    - name: STEP 5.2 - Recreate yum cache
      ansible.builtin.command:
        cmd: yum makecache
      changed_when: false

    # ===============================================================
    # STEP 6: RUN FOREMAN INSTALLER
    # ===============================================================

    - name: STEP 6 - Check Foreman service status
      ansible.builtin.command:
        cmd: systemctl is-active foreman
      register: foreman_status
      changed_when: false
      failed_when: false

    - name: STEP 6 - Run Foreman installer with Katello scenario
      ansible.builtin.command:
        cmd: foreman-installer --scenario katello
      environment:
        PATH: "{{ java_environment_path }}"
      when: foreman_status.rc != 0

    - name: STEP 6 - Open HTTP firewall
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled

    - name: STEP 6 - Open HTTPS firewall
      ansible.posix.firewalld:
        service: https
        permanent: true
        immediate: true
        state: enabled

    # ===============================================================
    # STEP 6.1: MOVE PULP DATA TO SEPARATE STORAGE
    # ===============================================================

    - name: STEP 6.1 - Get current Pulp mount source
      ansible.builtin.command:
        cmd: findmnt -n -o SOURCE --target /var/lib/pulp
      register: pulp_mount_source
      changed_when: false
      failed_when: false

    - name: STEP 6.1 - Set Pulp mount status
      ansible.builtin.set_fact:
        pulp_is_mounted: >-
          {{ pulp_mount_source.rc == 0 and
             (pulp_mount_source.stdout | length > 0) }}

    - name: STEP 6.1 - Display Pulp storage status
      ansible.builtin.debug:
        msg:
          - "Pulp mounted separately: {{ pulp_is_mounted }}"
          - "Current source: {{ pulp_mount_source.stdout | default('Not mounted') }}"

    - name: STEP 6.1 - Stop Foreman and Katello services
      ansible.builtin.shell: |
        systemctl stop foreman 2>/dev/null || true
        systemctl stop httpd 2>/dev/null || true
        systemctl stop dynflow-sidekiq@orchestrator 2>/dev/null || true
        systemctl stop dynflow-sidekiq@worker 2>/dev/null || true
        systemctl stop pulpcore-api 2>/dev/null || true
        systemctl stop pulpcore-worker@1 2>/dev/null || true
        systemctl stop pulpcore-worker@2 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false
      when: not pulp_is_mounted | bool

    - name: STEP 6.1 - Check Pulp directory
      ansible.builtin.stat:
        path: /var/lib/pulp
      register: current_pulp_dir
      when: not pulp_is_mounted | bool

    - name: STEP 6.1 - Check old Pulp backup directory
      ansible.builtin.stat:
        path: "{{ pulp_old }}"
      register: pulp_old_dir
      when: not pulp_is_mounted | bool

    - name: STEP 6.1 - Preserve previous Pulp backup
      ansible.builtin.command:
        cmd: mv {{ pulp_old }} {{ pulp_old }}.previous
      when:
        - not pulp_is_mounted | bool
        - pulp_old_dir.stat.exists | default(false)

    - name: STEP 6.1 - Move existing Pulp data to backup
      ansible.builtin.command:
        cmd: mv /var/lib/pulp {{ pulp_old }}
      when:
        - not pulp_is_mounted | bool
        - current_pulp_dir.stat.exists | default(false)

    - name: STEP 6.1 - Create Pulp mountpoint
      ansible.builtin.file:
        path: /var/lib/pulp
        state: directory
        owner: pulp
        group: pulp
        mode: "0755"
      when: not pulp_is_mounted | bool

    - name: STEP 6.1 - Fail when Pulp storage device is undefined
      ansible.builtin.fail:
        msg: >
          Pulp storage is not mounted on /var/lib/pulp.
          Run with:
          -e "pulp_storage_device=/dev/mapper/vg_pulp-lv_pulp"
      when:
        - not pulp_is_mounted | bool
        - pulp_storage_device is not defined

    - name: STEP 6.1 - Mount separate storage for Pulp
      ansible.builtin.mount:
        path: /var/lib/pulp
        src: "{{ pulp_storage_device }}"
        fstype: "{{ pulp_storage_fstype | default('xfs') }}"
        opts: defaults
        state: mounted
      when:
        - not pulp_is_mounted | bool
        - pulp_storage_device is defined

    - name: STEP 6.1 - Restore Pulp data
      ansible.builtin.shell: |
        if [ -d "{{ pulp_old }}" ]; then
          shopt -s dotglob nullglob
          cp -a {{ pulp_old }}/* /var/lib/pulp/
        fi
      args:
        executable: /bin/bash
      when: not pulp_is_mounted | bool

    - name: STEP 6.1 - Set Pulp ownership
      ansible.builtin.file:
        path: /var/lib/pulp
        owner: pulp
        group: pulp
        recurse: true
      when: not pulp_is_mounted | bool

    - name: STEP 6.1 - Start Foreman and Katello services
      ansible.builtin.shell: |
        systemctl start pulpcore-api 2>/dev/null || true
        systemctl start pulpcore-worker@1 2>/dev/null || true
        systemctl start pulpcore-worker@2 2>/dev/null || true
        systemctl start dynflow-sidekiq@orchestrator 2>/dev/null || true
        systemctl start dynflow-sidekiq@worker 2>/dev/null || true
        systemctl start httpd 2>/dev/null || true
        systemctl start foreman 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    # ===============================================================
    # STEP 7: CONFIGURE FOREMAN PROXY
    # ===============================================================

    - name: STEP 7 - Install DHCP TFTP and BIND utilities
      ansible.builtin.yum:
        name:
          - dhcp
          - tftp-server
          - bind-utils
          - bind
        state: present
        disable_gpg_check: true

    # ===============================================================
    # DNSSEC-KEYGEN DETECTION
    # CentOS 7 may install it under /usr/sbin or /sbin
    # ===============================================================

    - name: STEP 7 - Check dnssec-keygen in /usr/sbin
      ansible.builtin.stat:
        path: /usr/sbin/dnssec-keygen
      register: dnssec_keygen_usr_sbin

    - name: STEP 7 - Check dnssec-keygen in /sbin
      ansible.builtin.stat:
        path: /sbin/dnssec-keygen
      register: dnssec_keygen_sbin

    - name: STEP 7 - Set dnssec-keygen executable path
      ansible.builtin.set_fact:
        dnssec_keygen_path: >-
          {{
            '/usr/sbin/dnssec-keygen'
            if dnssec_keygen_usr_sbin.stat.exists
            else (
              '/sbin/dnssec-keygen'
              if dnssec_keygen_sbin.stat.exists
              else ''
            )
          }}

    - name: STEP 7 - Display dnssec-keygen path
      ansible.builtin.debug:
        msg: "dnssec-keygen path: {{ dnssec_keygen_path }}"

    - name: STEP 7 - Fail when dnssec-keygen is unavailable
      ansible.builtin.fail:
        msg: >
          dnssec-keygen was not found in /usr/sbin or /sbin.
          bind and bind-utils are installed but the executable is unavailable.
      when: dnssec_keygen_path | length == 0

    - name: STEP 7 - Verify dnssec-keygen executable
      ansible.builtin.command:
        argv:
          - "{{ dnssec_keygen_path }}"
          - -h
      register: dnssec_keygen_check
      changed_when: false
      failed_when: false

    - name: STEP 7 - Display dnssec-keygen verification result
      ansible.builtin.debug:
        msg:
          - "dnssec-keygen executable: {{ dnssec_keygen_path }}"
          - "Verification return code: {{ dnssec_keygen_check.rc }}"

    # ===============================================================
    # TFTP CONFIGURATION
    # ===============================================================

    - name: STEP 7 - Ensure TFTP root exists
      ansible.builtin.file:
        path: "{{ tftp_root }}"
        state: directory
        owner: foreman-proxy
        group: foreman-proxy
        mode: "0755"


    # ===============================================================
    # CENTOS 7 VAULT REPOSITORY - REQUIRED FOR EFI MODULES
    # ===============================================================

    - name: STEP 7 - Configure CentOS 7 Vault repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/vault.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [vault-base]
          name=CentOS 7.9.2009 - Base
          baseurl=https://vault.centos.org/centos/7.9.2009/os/x86_64/
          enabled=1
          gpgcheck=0

          [vault-updates]
          name=CentOS 7.9.2009 - Updates
          baseurl=https://vault.centos.org/centos/7.9.2009/updates/x86_64/
          enabled=1
          gpgcheck=0

          [vault-extras]
          name=CentOS 7.9.2009 - Extras
          baseurl=https://vault.centos.org/centos/7.9.2009/extras/x86_64/
          enabled=1
          gpgcheck=0


    - name: STEP 7 - Clean YUM metadata before EFI package check
      ansible.builtin.command: yum clean all
      changed_when: false


    - name: STEP 7 - Rebuild YUM metadata
      ansible.builtin.command: yum makecache
      changed_when: false


    - name: STEP 7 - Check grub2 EFI modules package availability
      ansible.builtin.command:
        cmd: yum list available grub2-efi-x64-modules
      register: grub_efi_package_check
      changed_when: false
      failed_when: false


    - name: STEP 7 - Display grub2 EFI modules package check
      ansible.builtin.debug:
        var: grub_efi_package_check.stdout_lines


    - name: STEP 7 - Install grub2 EFI modules required by Foreman TFTP
      ansible.builtin.yum:
        name: grub2-efi-x64-modules
        state: present
        disable_gpg_check: true


    - name: STEP 7 - Configure and enable Foreman TFTP proxy
      ansible.builtin.command:
        argv:
          - foreman-installer
          - --scenario
          - katello
          - --foreman-proxy-tftp
          - "true"
          - --foreman-proxy-tftp-managed
          - "true"
          - --foreman-proxy-tftp-root
          - "{{ tftp_root }}"
          - --foreman-proxy-tftp-servername
          - "{{ foreman_server_name }}"
      environment:
        PATH: "{{ java_environment_path }}"
      notify: Restart Foreman Proxy

    # ===============================================================
    # DHCP CONFIGURATION
    # ===============================================================

    - name: STEP 7 - Configure and enable Foreman DHCP proxy
      ansible.builtin.command:
        argv:
          - foreman-installer
          - --scenario
          - katello
          - --foreman-proxy-dhcp
          - "true"
          - --foreman-proxy-dhcp-managed
          - "true"
          - --foreman-proxy-dhcp-server
          - "{{ foreman_server_name }}"
          - --foreman-proxy-dhcp-range
          - ""
          - --foreman-proxy-dhcp-gateway
          - "{{ dhcp_gateway }}"
          - --foreman-proxy-dhcp-nameservers
          - "{{ dns_server }}"
          - --foreman-proxy-dhcp-config
          - /etc/dhcp/dhcpd.conf
          - --foreman-proxy-dhcp-leases
          - /var/lib/dhcpd/dhcpd.leases
      environment:
        PATH: "{{ java_environment_path }}"
      notify: Restart Foreman Proxy

    # ===============================================================
    # DNSSEC KEY
    # ===============================================================

    - name: STEP 7 - Ensure Foreman Proxy directory exists
      ansible.builtin.file:
        path: /etc/foreman-proxy
        state: directory
        owner: root
        group: foreman-proxy
        mode: "0755"

    - name: STEP 7 - Check if Foreman proxy DNS key exists
      ansible.builtin.stat:
        path: /etc/foreman-proxy/dns.key
      register: foreman_dns_key

    - name: STEP 7 - Generate DNSSEC key when missing
      ansible.builtin.command:
        argv:
          - "{{ dnssec_keygen_path }}"
          - -a
          - HMAC-SHA512
          - -b
          - "512"
          - -n
          - USER
          - -K
          - /etc/foreman-proxy
          - foreman-proxy
      register: dnssec_generate_result
      changed_when: true
      no_log: true
      when: not foreman_dns_key.stat.exists

    - name: STEP 7 - Find generated private DNSSEC key
      ansible.builtin.find:
        paths: /etc/foreman-proxy
        patterns: "Kforeman-proxy.+\\.private"
        use_regex: true
        file_type: file
      register: generated_private_key
      when: not foreman_dns_key.stat.exists

    - name: STEP 7 - Fail when generated private key is missing
      ansible.builtin.fail:
        msg: "DNSSEC private key was not generated successfully."
      when:
        - not foreman_dns_key.stat.exists
        - generated_private_key.matched | int == 0

    - name: STEP 7 - Read DNS secret
      ansible.builtin.shell: |
        awk '/^Key:/ {print $2}' "{{ generated_private_key.files[0].path }}"
      args:
        executable: /bin/bash
      register: generated_dns_secret
      changed_when: false
      no_log: true
      when:
        - not foreman_dns_key.stat.exists
        - generated_private_key.matched | int > 0

    - name: STEP 7 - Fail when DNS secret cannot be extracted
      ansible.builtin.fail:
        msg: "Unable to extract the DNSSEC secret from the generated private key."
      when:
        - not foreman_dns_key.stat.exists
        - generated_dns_secret.stdout | default('') | length == 0

    - name: STEP 7 - Create Foreman proxy DNS key file
      ansible.builtin.copy:
        dest: /etc/foreman-proxy/dns.key
        content: |
          key "foreman-proxy" {
            algorithm hmac-sha512;
            secret "{{ generated_dns_secret.stdout }}";
          };
        owner: foreman-proxy
        group: foreman-proxy
        mode: "0600"
      no_log: true
      when:
        - not foreman_dns_key.stat.exists
        - generated_dns_secret.stdout | default('') | length > 0
      notify: Restart Foreman Proxy

    - name: STEP 7 - Ensure DNS key ownership
      ansible.builtin.file:
        path: /etc/foreman-proxy/dns.key
        owner: foreman-proxy
        group: foreman-proxy
        mode: "0600"
      notify: Restart Foreman Proxy

    # ===============================================================
    # DNS PROXY
    # ===============================================================

    - name: STEP 7 - Configure Foreman DNS proxy
      ansible.builtin.command:
        argv:
          - foreman-installer
          - --scenario
          - katello
          - --foreman-proxy-dns
          - "true"
          - --foreman-proxy-dns-managed
          - "false"
          - --foreman-proxy-dns-provider
          - nsupdate
          - --foreman-proxy-dns-server
          - "{{ dns_server }}"
          - --foreman-proxy-keyfile
          - /etc/foreman-proxy/dns.key
      environment:
        PATH: "{{ java_environment_path }}"
      notify: Restart Foreman Proxy

    - name: STEP 7 - Apply Foreman Proxy restart
      ansible.builtin.meta: flush_handlers

    # ===============================================================
    # FIREWALL
    # ===============================================================

    - name: STEP 7 - Open DHCP firewall service
      ansible.posix.firewalld:
        service: dhcp
        permanent: true
        immediate: true
        state: enabled

    - name: STEP 7 - Open TFTP firewall service
      ansible.posix.firewalld:
        service: tftp
        permanent: true
        immediate: true
        state: enabled

    - name: STEP 7 - Open HTTP firewall service
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled

    - name: STEP 7 - Open HTTPS firewall service
      ansible.posix.firewalld:
        service: https
        permanent: true
        immediate: true
        state: enabled

    - name: STEP 7 - Open Puppet port 8140
      ansible.posix.firewalld:
        port: 8140/tcp
        permanent: true
        immediate: true
        state: enabled

    # ===============================================================
    # STEP 8: DOWNLOAD CENTOS PXE BOOT FILES
    # ===============================================================

    - name: STEP 8 - Create CentOS TFTP directory
      ansible.builtin.file:
        path: "{{ tftp_root }}/centos"
        state: directory
        owner: foreman-proxy
        group: foreman-proxy
        mode: "0755"

    - name: STEP 8 - Download CentOS initrd.img
      ansible.builtin.get_url:
        url: "{{ repo_root }}/centos/isolinux/initrd.img"
        dest: "{{ tftp_root }}/centos/initrd.img"
        owner: foreman-proxy
        group: foreman-proxy
        mode: "0644"

    - name: STEP 8 - Download CentOS vmlinuz
      ansible.builtin.get_url:
        url: "{{ repo_root }}/centos/isolinux/vmlinuz"
        dest: "{{ tftp_root }}/centos/vmlinuz"
        owner: foreman-proxy
        group: foreman-proxy
        mode: "0644"

    - name: STEP 8 - Ensure ownership of CentOS TFTP files
      ansible.builtin.file:
        path: "{{ tftp_root }}/centos"
        owner: foreman-proxy
        group: foreman-proxy
        recurse: true

    - name: STEP 8 - Set permissions on CentOS PXE files
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0644"
      loop:
        - "{{ tftp_root }}/centos/initrd.img"
        - "{{ tftp_root }}/centos/vmlinuz"

    # ===============================================================
    # COMPLETED
    # ===============================================================

    - name: Installation completed
      ansible.builtin.debug:
        msg: |
          ============================================================
          Foreman Katello installation completed successfully.
          ============================================================
          Foreman Server : {{ foreman_server_name }}
          Repository     : {{ repo_root }}
          Pulp Path      : /var/lib/pulp
          Pulp Backup    : {{ pulp_old }}
          TFTP Root      : {{ tftp_root }}
          DNS Server     : {{ dns_server }}
          DHCP Gateway   : {{ dhcp_gateway }}
          EFI Steps      : COMPLETELY SKIPPED
          ============================================================

  handlers:

    - name: Restart Foreman Proxy
      ansible.builtin.systemd:
        name: foreman-proxy
        state: restarted
        enabled: true
      failed_when: false
