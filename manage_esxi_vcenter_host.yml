---
- name: Add or repair ESXi host in vCenter
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - community.vmware

  vars:

    # ========================================================================
    # vCENTER
    # ========================================================================

    vcenter_hostname: "vcenter-01.vgs.com"
    vcenter_username: "administrator@vsphere.local"
    vcenter_password: "Vigneshv12$"

    validate_certs: false

    # ========================================================================
    # vCENTER DATACENTER
    # ========================================================================

    vcenter_datacenter: "Datacenter"

    # ========================================================================
    # ESXi
    # ========================================================================

    esxi_hostname: "192.168.253.128"
    esxi_username: "root"
    esxi_password: "Root@123"

    # ========================================================================
    # TARGET LOCATION
    #
    # Empty cluster means add host directly to the datacenter host folder.
    # ========================================================================

    esxi_cluster: ""

    # ========================================================================
    # WAIT / RETRY
    # ========================================================================

    remove_wait_seconds: 10
    verify_wait_seconds: 15
    verify_retries: 10
    verify_delay: 15

  tasks:

    # ========================================================================
    # DISPLAY
    # ========================================================================

    - name: Display configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "vCENTER ESXi HOST MANAGEMENT"
          - "============================================================"
          - "vCenter        : {{ vcenter_hostname }}"
          - "Datacenter     : {{ vcenter_datacenter }}"
          - "ESXi Host      : {{ esxi_hostname }}"
          - "ESXi User      : {{ esxi_username }}"
          - "Cluster        : {{ esxi_cluster | default('DATACENTER ROOT') }}"
          - "Validate Certs : {{ validate_certs }}"
          - "============================================================"

    # ========================================================================
    # PASSWORD CHECKS
    # ========================================================================

    - name: Fail if VCENTER_PASSWORD is not set
      ansible.builtin.fail:
        msg: |
          ============================================================
          VCENTER_PASSWORD IS NOT SET
          ============================================================

          Run:

          export VCENTER_PASSWORD='Vigneshv12$'

          ============================================================
      when: vcenter_password | length == 0

    - name: Fail if ESXI_PASSWORD is not set
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXI_PASSWORD IS NOT SET
          ============================================================

          Run:

          export ESXI_PASSWORD='Root@123'

          ============================================================
      when: esxi_password | length == 0

    # ========================================================================
    # CHECK vCENTER API
    # ========================================================================

    - name: Create vCenter API session
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/session"
        method: POST
        user: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs }}"
        status_code: 201
        return_content: true
      register: vcenter_session

    - name: Save vCenter API session
      ansible.builtin.set_fact:
        vcenter_session_id: >-
          {{
            vcenter_session.headers['vmware-api-session-id']
            | default('')
          }}

    - name: Fail if vCenter API session was not created
      ansible.builtin.fail:
        msg: |
          ============================================================
          vCENTER API SESSION FAILED
          ============================================================

          vCenter:
          {{ vcenter_hostname }}

          Response:
          {{ vcenter_session.content | default('') }}

          ============================================================
      when: vcenter_session_id | length == 0

    # ========================================================================
    # QUERY HOST INVENTORY
    # ========================================================================

    - name: Query vCenter ESXi host inventory
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/vcenter/host"
        method: GET
        headers:
          vmware-api-session-id: "{{ vcenter_session_id }}"
        validate_certs: "{{ validate_certs }}"
        status_code: 200
        return_content: true
      register: vcenter_hosts_response

    - name: Decode vCenter host inventory
      ansible.builtin.set_fact:
        vcenter_hosts: "{{ vcenter_hosts_response.json | default([]) }}"

    # ========================================================================
    # DISPLAY HOST INVENTORY
    # ========================================================================

    - name: Display vCenter host inventory
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "vCENTER HOST INVENTORY"
          - "============================================================"
          - "{{ vcenter_hosts }}"
          - "============================================================"

    # ========================================================================
    # INITIALIZE TARGET STATE
    # ========================================================================

    - name: Initialize target ESXi host state
      ansible.builtin.set_fact:
        target_host_found: false
        target_host_connection_state: "NOT_FOUND"
        target_host_id: ""

    # ========================================================================
    # FIND TARGET HOST
    #
    # vCenter API returns records such as:
    #
    # {
    #   "host": "host-60014",
    #   "name": "192.168.253.128",
    #   "connection_state": "DISCONNECTED"
    # }
    #
    # ========================================================================

    - name: Find target ESXi host
      ansible.builtin.set_fact:
        target_host_found: true
        target_host_id: "{{ item.host }}"
        target_host_connection_state: "{{ item.connection_state | upper }}"
      loop: "{{ vcenter_hosts }}"
      loop_control:
        label: "{{ item.name | default(item.host) }}"
      when:
        - item.name is defined
        - item.name | lower == esxi_hostname | lower

    # ========================================================================
    # DISPLAY TARGET STATE
    # ========================================================================

    - name: Display target ESXi state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "TARGET ESXi STATE"
          - "============================================================"
          - "Requested Host   : {{ esxi_hostname }}"
          - "Found            : {{ target_host_found }}"
          - "Host ID          : {{ target_host_id }}"
          - "Connection State : {{ target_host_connection_state }}"
          - "============================================================"

    # ========================================================================
    # CASE 1 - HOST ABSENT
    # ========================================================================

    - name: Display add action for absent ESXi host
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ESXi HOST NOT FOUND"
          - "============================================================"
          - "Action: ADD HOST TO vCENTER"
          - "============================================================"
      when: not target_host_found

    # ========================================================================
    # CASE 2 - HOST CONNECTED
    # ========================================================================

    - name: Display skip action for connected ESXi host
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ESXi HOST ALREADY CONNECTED"
          - "============================================================"
          - "Action: SKIP"
          - "No inventory change required."
          - "============================================================"
      when:
        - target_host_found
        - target_host_connection_state == "CONNECTED"

    # ========================================================================
    # CASE 3 - HOST DISCONNECTED
    # ========================================================================

    - name: Display repair action for disconnected ESXi host
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ESXi HOST IS DISCONNECTED"
          - "============================================================"
          - "Action:"
          - "1. REMOVE FROM vCENTER"
          - "2. RE-ADD TO vCENTER"
          - "============================================================"
      when:
        - target_host_found
        - target_host_connection_state == "DISCONNECTED"

    # ========================================================================
    # REMOVE DISCONNECTED HOST
    # ========================================================================

    - name: Remove disconnected ESXi host from vCenter
      community.vmware.vmware_host:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"

        datacenter: "{{ vcenter_datacenter }}"

        esxi_hostname: "{{ esxi_hostname }}"

        state: absent

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      when:
        - target_host_found
        - target_host_connection_state == "DISCONNECTED"

      register: remove_host_result

    - name: Display host removal result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "REMOVE ESXi HOST"
          - "============================================================"
          - "Host:"
          - "{{ esxi_hostname }}"
          - "Changed:"
          - "{{ remove_host_result.changed | default(false) }}"
          - "Result:"
          - "{{ remove_host_result.result | default(remove_host_result.msg | default('')) }}"
          - "============================================================"
      when:
        - target_host_found
        - target_host_connection_state == "DISCONNECTED"

    # ========================================================================
    # WAIT AFTER REMOVAL
    # ========================================================================

    - name: Wait after removing disconnected host
      ansible.builtin.pause:
        seconds: "{{ remove_wait_seconds }}"
      when:
        - target_host_found
        - target_host_connection_state == "DISCONNECTED"

    # ========================================================================
    # DETERMINE WHETHER HOST MUST BE ADDED
    # ========================================================================

    - name: Determine whether ESXi host must be added
      ansible.builtin.set_fact:
        add_host_required: >-
          {{
            (not target_host_found)
            or
            (
              target_host_found
              and target_host_connection_state == "DISCONNECTED"
            )
          }}

    # ========================================================================
    # ADD / RE-ADD HOST
    #
    # For an empty cluster, use the datacenter host folder.
    # ========================================================================

    - name: Add or re-add ESXi host
      community.vmware.vmware_host:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"

        datacenter: "{{ vcenter_datacenter }}"

        folder: "/{{ vcenter_datacenter }}/host"

        esxi_hostname: "{{ esxi_hostname }}"

        esxi_username: "{{ esxi_username }}"
        esxi_password: "{{ esxi_password }}"

        state: present

        add_connected: true
        reconnect_disconnected: true

        fetch_ssl_thumbprint: true

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      when: add_host_required

      register: add_host_result

    - name: Display add result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ADD / RE-ADD ESXi HOST"
          - "============================================================"
          - "Host:"
          - "{{ esxi_hostname }}"
          - "Changed:"
          - "{{ add_host_result.changed | default(false) }}"
          - "Result:"
          - "{{ add_host_result.result | default(add_host_result.msg | default('')) }}"
          - "============================================================"
      when: add_host_required

    # ========================================================================
    # WAIT BEFORE VERIFICATION
    # ========================================================================

    - name: Wait before verifying vCenter host state
      ansible.builtin.pause:
        seconds: "{{ verify_wait_seconds }}"
      when: add_host_required

    # ========================================================================
    # CREATE NEW API SESSION FOR VERIFICATION
    # ========================================================================

    - name: Create verification vCenter API session
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/session"
        method: POST
        user: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs }}"
        status_code: 201
        return_content: true
      register: verify_vcenter_session

      when: add_host_required

    - name: Save verification API session
      ansible.builtin.set_fact:
        verify_session_id: >-
          {{
            verify_vcenter_session.headers['vmware-api-session-id']
            | default('')
          }}
      when: add_host_required

    # ========================================================================
    # VERIFY UNTIL CONNECTED
    # ========================================================================

    - name: Verify ESXi host becomes connected
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/vcenter/host"
        method: GET
        headers:
          vmware-api-session-id: "{{ verify_session_id }}"
        validate_certs: "{{ validate_certs }}"
        status_code: 200
        return_content: true
      register: verify_hosts_response
      retries: "{{ verify_retries }}"
      delay: "{{ verify_delay }}"

      until:
        - >-
          (
            verify_hosts_response.json | default([])
            | selectattr('name', 'defined')
            | selectattr('name', 'equalto', esxi_hostname)
            | selectattr('connection_state', 'equalto', 'CONNECTED')
            | list
            | length
          ) > 0

      when: add_host_required

    # ========================================================================
    # FINAL STATE
    # ========================================================================

    - name: Create final state
      ansible.builtin.set_fact:
        final_host_state: >-
          {{
            (
              verify_hosts_response.json | default([])
              | selectattr('name', 'equalto', esxi_hostname)
              | map(attribute='connection_state')
              | list
              | first
            )
            if add_host_required
            else target_host_connection_state
          }}

    - name: Display final state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi HOST STATE"
          - "============================================================"
          - "Host:"
          - "{{ esxi_hostname }}"
          - "Connection:"
          - "{{ final_host_state }}"
          - "============================================================"

    # ========================================================================
    # FINAL ASSERTION
    # ========================================================================

    - name: Assert ESXi host is connected
      ansible.builtin.assert:
        that:
          - final_host_state == "CONNECTED"

        fail_msg: |
          ============================================================
          ESXi HOST IS NOT CONNECTED
          ============================================================

          Host:
          {{ esxi_hostname }}

          Final state:
          {{ final_host_state }}

          ============================================================
        success_msg: "ESXi host is connected to vCenter."

    # ========================================================================
    # SUCCESS
    # ========================================================================

    - name: Display final success
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS - ESXi HOST MANAGEMENT COMPLETE"
          - "============================================================"
          - "vCenter       : {{ vcenter_hostname }}"
          - "Datacenter    : {{ vcenter_datacenter }}"
          - "ESXi Host     : {{ esxi_hostname }}"
          - "Connection    : {{ final_host_state }}"
          - "============================================================"
