---
- name: Add or repair ESXi host and assign vSphere license in vCenter
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - community.vmware

  vars:

    # ========================================================================
    # vCENTER
    # ========================================================================

    vcenter_hostname: "vcenter-01.vgs.com"
    vcenter_username: "administrator@vsphere.local"
    vcenter_password: "{{ lookup('env', 'VCENTER_PASSWORD') }}"

    validate_certs: false

    # ========================================================================
    # vCENTER DATACENTER
    # ========================================================================

    vcenter_datacenter: "Datacenter"

    # ========================================================================
    # ESXi HOST
    # ========================================================================

    esxi_hostname: "192.168.253.128"
    esxi_username: "root"
    esxi_password: "{{ lookup('env', 'ESXI_PASSWORD') }}"

    # ========================================================================
    # OPTIONAL CLUSTER
    #
    # Empty means add directly under the Datacenter host folder.
    # ========================================================================

    esxi_cluster: ""

    # ========================================================================
    # LICENSE
    # ========================================================================

    esxi_license_name: "License 2"
    esxi_license_product: "vSphere 8 Enterprise Plus"
    esxi_license_key: "{{ lookup('env', 'ESXI_LICENSE_KEY') }}"

    # ========================================================================
    # WAIT / RETRY
    # ========================================================================

    remove_wait_seconds: 10
    verify_wait_seconds: 15
    verify_retries: 10
    verify_delay: 15

  tasks:

    # ========================================================================
    # DISPLAY CONFIGURATION
    # ========================================================================

    - name: Display configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "vCENTER ESXi HOST MANAGEMENT"
          - "============================================================"
          - "vCenter        : {{ vcenter_hostname }}"
          - "Datacenter     : {{ vcenter_datacenter }}"
          - "ESXi Host      : {{ esxi_hostname }}"
          - "ESXi User      : {{ esxi_username }}"
          - "Cluster        : {{ esxi_cluster | default('') }}"
          - "License Name   : {{ esxi_license_name }}"
          - "License Product: {{ esxi_license_product }}"
          - "Validate Certs : {{ validate_certs }}"
          - "============================================================"

    # ========================================================================
    # PASSWORD / LICENSE CHECKS
    # ========================================================================

    - name: Fail if VCENTER_PASSWORD is not set
      ansible.builtin.fail:
        msg: |
          ============================================================
          VCENTER_PASSWORD IS NOT SET
          ============================================================

          Run:

          export VCENTER_PASSWORD='your_vcenter_password'

          ============================================================
      when: vcenter_password | default('') | length == 0

    - name: Fail if ESXI_PASSWORD is not set
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXI_PASSWORD IS NOT SET
          ============================================================

          Run:

          export ESXI_PASSWORD='your_esxi_password'

          ============================================================
      when: esxi_password | default('') | length == 0

    - name: Fail if ESXI_LICENSE_KEY is not set
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXI_LICENSE_KEY IS NOT SET
          ============================================================

          Run:

          export ESXI_LICENSE_KEY='your_esxi_license_key'

          ============================================================
      when: esxi_license_key | default('') | length == 0

    # ========================================================================
    # TEST ESXi MANAGEMENT ACCESS
    # ========================================================================

    - name: Test ESXi HTTPS endpoint
      ansible.builtin.uri:
        url: "https://{{ esxi_hostname }}"
        method: GET
        validate_certs: "{{ validate_certs }}"
        status_code:
          - 200
          - 301
          - 302
          - 401
          - 403
      register: esxi_https
      failed_when: false

    - name: Display ESXi reachability
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ESXi REACHABILITY"
          - "============================================================"
          - "Host        : {{ esxi_hostname }}"
          - "HTTP Status : {{ esxi_https.status | default('UNREACHABLE') }}"
          - "============================================================"

    - name: Fail if ESXi is unreachable
      ansible.builtin.fail:
        msg: |
          ============================================================
          ESXi HOST IS UNREACHABLE
          ============================================================

          ESXi:
          https://{{ esxi_hostname }}

          ============================================================
      when: esxi_https.status is not defined

    # ========================================================================
    # CREATE vCENTER API SESSION
    # ========================================================================

    - name: Create vCenter API session
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/session"
        method: POST
        user: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs }}"
        status_code: 201
        return_content: true
      register: vcenter_session

    - name: Extract vCenter API session ID
      ansible.builtin.set_fact:
        vcenter_session_id: >-
          {{
            (
              vcenter_session.json
              if vcenter_session.json is defined
              else
              (
                vcenter_session.content
                | default('')
                | trim
                | regex_replace('^"', '')
                | regex_replace('"$', '')
              )
            )
            | string
            | trim
          }}

    - name: Display vCenter session status
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "vCENTER API SESSION"
          - "============================================================"
          - "HTTP Status : {{ vcenter_session.status | default('UNKNOWN') }}"
          - "Session ID  : {{ vcenter_session_id }}"
          - "============================================================"

    - name: Fail if vCenter API session was not created
      ansible.builtin.fail:
        msg: |
          ============================================================
          vCENTER API SESSION FAILED
          ============================================================

          vCenter:
          {{ vcenter_hostname }}

          HTTP Status:
          {{ vcenter_session.status | default('UNKNOWN') }}

          Response:
          {{ vcenter_session.content | default('') }}

          ============================================================
      when: vcenter_session_id | default('') | length == 0

    # ========================================================================
    # QUERY ESXi HOST INVENTORY
    # ========================================================================

    - name: Query vCenter ESXi host inventory
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/vcenter/host"
        method: GET
        headers:
          vmware-api-session-id: "{{ vcenter_session_id }}"
        validate_certs: "{{ validate_certs }}"
        status_code: 200
        return_content: true
      register: vcenter_hosts_response

    - name: Save vCenter host inventory
      ansible.builtin.set_fact:
        vcenter_hosts: "{{ vcenter_hosts_response.json | default([]) }}"

    - name: Display vCenter host inventory
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "vCENTER HOST INVENTORY"
          - "============================================================"
          - "{{ vcenter_hosts }}"
          - "============================================================"

    # ========================================================================
    # INITIALIZE TARGET HOST STATE
    # ========================================================================

    - name: Initialize target host state
      ansible.builtin.set_fact:
        target_host_found: false
        target_host_connection_state: "NOT_FOUND"
        target_host_id: ""

    # ========================================================================
    # FIND TARGET ESXi HOST
    # ========================================================================

    - name: Find target ESXi host in vCenter
      ansible.builtin.set_fact:
        target_host_found: true
        target_host_id: "{{ item.host }}"
        target_host_connection_state: "{{ item.connection_state | upper }}"
      loop: "{{ vcenter_hosts }}"
      loop_control:
        label: "{{ item.name | default(item.host) }}"
      when:
        - item.name is defined
        - item.name | lower == esxi_hostname | lower

    # ========================================================================
    # DISPLAY TARGET STATE
    # ========================================================================

    - name: Display target ESXi state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "TARGET ESXi STATE"
          - "============================================================"
          - "Requested Host   : {{ esxi_hostname }}"
          - "Found in vCenter : {{ target_host_found }}"
          - "Host ID          : {{ target_host_id }}"
          - "Connection State : {{ target_host_connection_state }}"
          - "============================================================"

    # ========================================================================
    # CONNECTED -> NO HOST CHANGES
    # ========================================================================

    - name: Display connected host action
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ESXi HOST ALREADY CONNECTED"
          - "============================================================"
          - "Host:"
          - "{{ esxi_hostname }}"
          - "Action:"
          - "SKIP HOST INVENTORY CHANGES"
          - "CONTINUE WITH LICENSE ASSIGNMENT"
          - "============================================================"
      when:
        - target_host_found
        - target_host_connection_state == "CONNECTED"

    # ========================================================================
    # DISCONNECTED / NOT_RESPONDING -> REMOVE AND RE-ADD
    # ========================================================================

    - name: Display ESXi host repair action
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ESXi HOST REQUIRES REPAIR"
          - "============================================================"
          - "Host:"
          - "{{ esxi_hostname }}"
          - "Current State:"
          - "{{ target_host_connection_state }}"
          - "Action:"
          - "REMOVE FROM vCENTER"
          - "THEN RE-ADD"
          - "============================================================"
      when:
        - target_host_found
        - target_host_connection_state in ["DISCONNECTED", "NOT_RESPONDING"]

    - name: Remove disconnected or not responding ESXi host from vCenter
      community.vmware.vmware_host:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"

        datacenter: "{{ vcenter_datacenter }}"
        esxi_hostname: "{{ esxi_hostname }}"

        state: absent
        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      register: remove_host_result

      when:
        - target_host_found
        - target_host_connection_state in ["DISCONNECTED", "NOT_RESPONDING"]

    - name: Display host removal result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "REMOVE RESULT"
          - "============================================================"
          - "Host:"
          - "{{ esxi_hostname }}"
          - "Previous State:"
          - "{{ target_host_connection_state }}"
          - "Changed:"
          - "{{ remove_host_result.changed | default(false) }}"
          - "Message:"
          - "{{ remove_host_result.msg | default('Removal task completed') }}"
          - "============================================================"
      when:
        - target_host_found
        - target_host_connection_state in ["DISCONNECTED", "NOT_RESPONDING"]

    # ========================================================================
    # WAIT AFTER REMOVE
    # ========================================================================

    - name: Wait after removing ESXi host
      ansible.builtin.pause:
        seconds: "{{ remove_wait_seconds }}"
      when:
        - target_host_found
        - target_host_connection_state in ["DISCONNECTED", "NOT_RESPONDING"]

    # ========================================================================
    # DETERMINE WHETHER ADD IS REQUIRED
    #
    # Add if:
    #   1. Host does not exist
    #   2. Host was DISCONNECTED
    #   3. Host was NOT_RESPONDING
    # ========================================================================

    - name: Determine whether ESXi host must be added
      ansible.builtin.set_fact:
        add_host_required: >-
          {{
            (not target_host_found)
            or
            (
              target_host_found
              and target_host_connection_state in
              ["DISCONNECTED", "NOT_RESPONDING"]
            )
          }}

    - name: Display add decision
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ESXi ADD DECISION"
          - "============================================================"
          - "Host Found       : {{ target_host_found }}"
          - "Connection State : {{ target_host_connection_state }}"
          - "Add Required     : {{ add_host_required }}"
          - "============================================================"

    # ========================================================================
    # ADD / RE-ADD ESXi HOST
    # ========================================================================

    - name: Add or re-add ESXi host to vCenter
      community.vmware.vmware_host:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"

        datacenter: "{{ vcenter_datacenter }}"

        folder: "/{{ vcenter_datacenter }}/host"

        esxi_hostname: "{{ esxi_hostname }}"
        esxi_username: "{{ esxi_username }}"
        esxi_password: "{{ esxi_password }}"

        state: present

        add_connected: true
        reconnect_disconnected: true
        fetch_ssl_thumbprint: true

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      when: add_host_required

      register: add_host_result

    - name: Display add result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ADD / RE-ADD RESULT"
          - "============================================================"
          - "Host:"
          - "{{ esxi_hostname }}"
          - "Changed:"
          - "{{ add_host_result.changed | default(false) }}"
          - "Message:"
          - "{{ add_host_result.msg | default('Host add task completed') }}"
          - "============================================================"
      when: add_host_required

    # ========================================================================
    # WAIT BEFORE FINAL VERIFICATION
    # ========================================================================

    - name: Wait before final host verification
      ansible.builtin.pause:
        seconds: "{{ verify_wait_seconds }}"
      when: add_host_required

    # ========================================================================
    # CREATE NEW vCENTER API SESSION FOR VERIFICATION
    # ========================================================================

    - name: Create verification vCenter API session
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/session"
        method: POST
        user: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs }}"
        status_code: 201
        return_content: true
      register: verify_vcenter_session
      when: add_host_required

    - name: Extract verification session ID
      ansible.builtin.set_fact:
        verify_session_id: >-
          {{
            (
              verify_vcenter_session.json
              if verify_vcenter_session.json is defined
              else
              (
                verify_vcenter_session.content
                | default('')
                | trim
                | regex_replace('^"', '')
                | regex_replace('"$', '')
              )
            )
            | string
            | trim
          }}
      when: add_host_required

    - name: Fail if verification API session was not created
      ansible.builtin.fail:
        msg: |
          ============================================================
          VERIFICATION API SESSION FAILED
          ============================================================

          vCenter:
          {{ vcenter_hostname }}

          Response:
          {{ verify_vcenter_session.content | default('') }}

          ============================================================
      when:
        - add_host_required
        - verify_session_id | default('') | length == 0

    # ========================================================================
    # VERIFY HOST IS CONNECTED
    # ========================================================================

    - name: Verify ESXi host is connected in vCenter
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/vcenter/host"
        method: GET
        headers:
          vmware-api-session-id: "{{ verify_session_id }}"
        validate_certs: "{{ validate_certs }}"
        status_code: 200
        return_content: true
      register: final_hosts_response

      retries: "{{ verify_retries }}"
      delay: "{{ verify_delay }}"

      until:
        - >-
          (
            final_hosts_response.json
            | default([])
            | selectattr('name', 'defined')
            | selectattr('name', 'equalto', esxi_hostname)
            | selectattr('connection_state', 'equalto', 'CONNECTED')
            | list
            | length
          ) > 0

      when: add_host_required

    # ========================================================================
    # DETERMINE FINAL HOST STATE
    # ========================================================================

    - name: Set final ESXi host state
      ansible.builtin.set_fact:
        final_host_state: >-
          {{
            (
              final_hosts_response.json
              | default([])
              | selectattr('name', 'equalto', esxi_hostname)
              | map(attribute='connection_state')
              | list
              | first
              | default('NOT_FOUND')
            )
            if add_host_required
            else target_host_connection_state
          }}

    # ========================================================================
    # DISPLAY FINAL HOST STATE
    # ========================================================================

    - name: Display final ESXi host state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL ESXi HOST STATE"
          - "============================================================"
          - "Host       : {{ esxi_hostname }}"
          - "Connection : {{ final_host_state }}"
          - "============================================================"

    # ========================================================================
    # FINAL HOST ASSERTION
    # ========================================================================

    - name: Assert ESXi host is connected
      ansible.builtin.assert:
        that:
          - final_host_state == "CONNECTED"

        fail_msg: |
          ============================================================
          ESXi HOST IS NOT CONNECTED
          ============================================================

          Host:
          {{ esxi_hostname }}

          Final state:
          {{ final_host_state }}

          ============================================================

        success_msg: "ESXi host is connected to vCenter."

    # ========================================================================
    # LICENSE ASSIGNMENT
    # ========================================================================

    - name: Assign vSphere Enterprise Plus license to ESXi host
      community.vmware.vcenter_license:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"

        esxi_hostname: "{{ esxi_hostname }}"
        license: "{{ esxi_license_key }}"

        state: present

        validate_certs: "{{ validate_certs }}"

      delegate_to: localhost

      register: license_assignment

    # ========================================================================
    # DISPLAY LICENSE RESULT
    # ========================================================================

    - name: Display license assignment result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ESXi LICENSE"
          - "============================================================"
          - "License Name    : {{ esxi_license_name }}"
          - "Product         : {{ esxi_license_product }}"
          - "ESXi Host       : {{ esxi_hostname }}"
          - "Changed         : {{ license_assignment.changed | default(false) }}"
          - "Registered Keys : {{ license_assignment.licenses | default([]) }}"
          - "============================================================"

    # ========================================================================
    # VERIFY LICENSE TASK COMPLETED
    # ========================================================================

    - name: Assert license assignment task completed
      ansible.builtin.assert:
        that:
          - license_assignment.failed | default(false) | bool == false

        fail_msg: |
          ============================================================
          ESXi LICENSE ASSIGNMENT FAILED
          ============================================================

          Host:
          {{ esxi_hostname }}

          License:
          {{ esxi_license_name }}

          Product:
          {{ esxi_license_product }}

          Message:
          {{ license_assignment.msg | default('Unknown error') }}

          ============================================================

        success_msg: "vSphere Enterprise Plus license task completed."

    # ========================================================================
    # FINAL SUCCESS
    # ========================================================================

    - name: Display final success
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS - ESXi HOST MANAGEMENT COMPLETE"
          - "============================================================"
          - "vCenter        : {{ vcenter_hostname }}"
          - "Datacenter     : {{ vcenter_datacenter }}"
          - "ESXi Host      : {{ esxi_hostname }}"
          - "Connection     : CONNECTED"
          - "============================================================"
          - "LICENSE"
          - "============================================================"
          - "Name           : {{ esxi_license_name }}"
          - "Product        : {{ esxi_license_product }}"
          - "Assigned       : YES"
          - "============================================================"
