---
- name: CentOS 7 to Rocky Linux 8 - ELevate Migration
  hosts: "{{ target_hosts.split(',') | map('trim') | map('regex_replace', '$', '*') | join(',') }}"
  become: yes
  become_method: sudo
  become_user: root
  gather_facts: false

  vars:
    elevate_repo_file: /etc/yum.repos.d/elevate.repo
    rocky_repo_file: /etc/leapp/files/leapp_upgrade_repositories.repo

  pre_tasks:

    ####################################################################
    # Bootstrap Python
    ####################################################################

    - name: Ensure Python is installed
      raw: |
        if ! command -v python >/dev/null 2>&1 && ! command -v python3 >/dev/null 2>&1; then
          yum -y install python
        fi
      changed_when: false

    - meta: reset_connection

    - name: Gather facts
      setup:

    ####################################################################
    # Validate Source OS
    ####################################################################

    - name: Skip migration if already Rocky Linux 8
      debug:
        msg: "Host is already running Rocky Linux {{ ansible_distribution_version }}. Skipping migration."
      when:
        - ansible_distribution == "Rocky"
        - ansible_distribution_major_version == "8"

    - meta: end_play
      when:
        - ansible_distribution == "Rocky"
        - ansible_distribution_major_version == "8"

    - name: Validate source operating system
      fail:
        msg: This playbook supports only CentOS 7.
      when:
        - ansible_distribution != "CentOS"
          or ansible_distribution_major_version != "7"

  tasks:

    ####################################################################
    # Configure Repositories
    ####################################################################

    - name: Backup existing repository files
      shell: |
        mkdir -p /etc/yum.repos.d/backup
        mv /etc/yum.repos.d/*.repo /etc/yum.repos.d/backup/ 2>/dev/null || true

    - name: Create elevate repository
      copy:
        dest: "{{ elevate_repo_file }}"
        mode: "0644"
        content: |
          [elevate]
          name=ELevate Repository
          baseurl=http://192.168.253.136/repo/elevate/
          enabled=1
          gpgcheck=0

          [baseos]
          name=CentOS Base Repository
          baseurl=http://192.168.253.136/repo/centos/
          enabled=1
          gpgcheck=0

          [patch]
          name=Installed EL7 Repository
          baseurl=http://192.168.253.136/repo/installed_rhel7/
          enabled=1
          gpgcheck=0

    ####################################################################
    # Complete Pending Yum Transaction
    ####################################################################

    - name: Check yum-complete-transaction
      stat:
        path: /usr/bin/yum-complete-transaction
      register: yum_complete

    - name: Cleanup pending yum transaction
      shell: yum-complete-transaction --cleanup-only --quiet --skip-broken
      when: yum_complete.stat.exists
      ignore_errors: yes

    - name: Complete pending transaction
      command: yum-complete-transaction -y
      when: yum_complete.stat.exists
      ignore_errors: yes

    ####################################################################
    # Install deltarpm
    ####################################################################

    - name: Check deltarpm
      stat:
        path: /usr/bin/applydeltarpm
      register: deltarpm_bin

    - name: Download deltarpm
      get_url:
        url: http://vault.centos.org/7.9.2009/os/x86_64/Packages/deltarpm-3.6-3.el7.x86_64.rpm
        dest: /tmp/deltarpm.rpm
      when: not deltarpm_bin.stat.exists

    - name: Install deltarpm
      command: rpm -ivh /tmp/deltarpm.rpm
      when: not deltarpm_bin.stat.exists

    ####################################################################
    # Remove Previous Leapp Installation
    ####################################################################

    - name: Remove existing Leapp packages
      yum:
        name:
          - leapp
          - python2-leapp
          - leapp-upgrade-el7toel8
          - leapp-upgrade-el7toel8-deps
          - leapp-data-rocky
          - leapp-deps
        state: absent
      ignore_errors: yes

    - name: Remove previous Leapp directories
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/leapp
        - /usr/share/leapp
        - /usr/share/leapp-repository
        - /var/lib/leapp
        - /var/log/leapp

    - name: Remove temporary Leapp files
      shell: |
        rm -rf /var/tmp/leapp*
        rm -f /var/tmp/system-upgrade.state

    - name: Remove old Leapp repository
      file:
        path: /etc/yum.repos.d/leapp.repo
        state: absent

    - name: Clean yum cache
      command: yum clean all

    - name: Remove yum cache
      file:
        path: /var/cache/yum
        state: absent

    - name: Rebuild yum cache
      command: yum makecache

    ####################################################################
    # Install Fresh Leapp
    ####################################################################

    - name: Install Leapp packages
      yum:
        name:
          - leapp
          - python2-leapp
          - leapp-upgrade-el7toel8
          - leapp-upgrade-el7toel8-deps
          - leapp-data-rocky
          - leapp-deps
        state: present

    - name: Verify Leapp installation
      shell: |
        leapp --version
        rpm -q \
          leapp \
          python2-leapp \
          leapp-upgrade-el7toel8 \
          leapp-upgrade-el7toel8-deps \
          leapp-data-rocky \
          leapp-deps
      register: leapp_verify
      changed_when: false

    - debug:
        var: leapp_verify.stdout_lines

    ####################################################################
    # Configure Rocky repositories
    ####################################################################

    - name: Ensure Leapp repository directory exists
      file:
        path: /etc/leapp/files
        state: directory
        mode: "0755"

    - name: Check if Leapp repository file exists
      stat:
        path: "{{ rocky_repo_file }}"
      register: leapp_repo

    - name: Backup existing Leapp repository
      copy:
        src: "{{ rocky_repo_file }}"
        dest: "{{ rocky_repo_file }}.bak"
        remote_src: yes
        backup: yes
      when: leapp_repo.stat.exists

    - name: Configure Rocky upgrade repositories
      copy:
        dest: "{{ rocky_repo_file }}"
        mode: "0644"
        content: |
          [rocky8-baseos]
          name=Rocky Linux 8 BaseOS
          baseurl=http://192.168.253.136/repo/rocky8/BaseOS/
          enabled=1
          gpgcheck=0

          [rocky8-appstream]
          name=Rocky Linux 8 AppStream
          baseurl=http://192.168.253.136/repo/rocky8/AppStream/
          enabled=1
          gpgcheck=0

    ####################################################################
    # Enable Root SSH Login
    ####################################################################

    - name: Enable PermitRootLogin
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^[#[:space:]]*PermitRootLogin'
        line: PermitRootLogin yes
        backup: yes

    - name: Restart SSH
      service:
        name: sshd
        state: restarted

    ####################################################################
    # Leapp Preupgrade Pass 1
    ####################################################################

    - name: Run first preupgrade
      command: leapp preupgrade
      register: preupgrade_pass1
      ignore_errors: yes

    - name: Display first preupgrade output
      debug:
        var: preupgrade_pass1.stdout_lines

    ####################################################################
    # Apply Preupgrade Fixes
    ####################################################################

    - name: Remove perl-libs
      yum:
        name: perl-libs
        state: absent
      ignore_errors: yes

    - name: Set SELinux permissive
      command: setenforce 0
      ignore_errors: yes

    - name: Remove floppy module
      command: modprobe -r floppy
      ignore_errors: yes

    - name: Remove pata_acpi module
      command: modprobe -r pata_acpi
      ignore_errors: yes

    - name: Answer authselect confirmation
      command: >
        leapp answer
        --section authselect_check.confirm=True
      ignore_errors: yes

    - name: Answer remove_pam_pkcs11 confirmation
      command: >
        leapp answer
        --section remove_pam_pkcs11_module_check.confirm=True
      ignore_errors: yes

    ####################################################################
    # Leapp Preupgrade Pass 2
    ####################################################################

    - name: Run second preupgrade
      command: leapp preupgrade
      register: preupgrade_pass2
      ignore_errors: yes

    - name: Display second preupgrade output
      debug:
        var: preupgrade_pass2.stdout_lines

    - name: Fail if second preupgrade still failed
      fail:
        msg: |
          Leapp preupgrade still failed.
          Review /var/log/leapp/leapp-report.txt before continuing.
      when: preupgrade_pass2.rc != 0

    ####################################################################
    # Detect Software RAID
    ####################################################################

    - name: Check if md0 exists
      stat:
        path: /dev/md0
      register: md0_device

    - name: Check if md1 exists
      stat:
        path: /dev/md1
      register: md1_device

    - name: Determine if software RAID is present
      set_fact:
        software_raid: "{{ md0_device.stat.exists or md1_device.stat.exists }}"

    - name: Display RAID detection
      debug:
        msg: >-
          {{
            'Software RAID detected. Preparing degraded RAID for Leapp.'
            if software_raid
            else
            'Software RAID not detected. Skipping RAID preparation.'
          }}

    ####################################################################
    # Prepare RAID for Upgrade (RAID hosts only)
    ####################################################################

    - block:

        - name: Ensure secondary EFI mount point exists
          file:
            path: /boot/efi2
            state: directory

        - name: Unmount secondary EFI
          mount:
            path: /boot/efi2
            state: unmounted
          ignore_errors: yes

        - name: Remove sdb2 from md0
          shell: |
            if mdadm --detail /dev/md0 | grep -q "/dev/sdb2"; then
              mdadm /dev/md0 --fail /dev/sdb2
              mdadm /dev/md0 --remove /dev/sdb2
            fi
          args:
            executable: /bin/bash

        - name: Remove sdb3 from md1
          shell: |
            if mdadm --detail /dev/md1 | grep -q "/dev/sdb3"; then
              mdadm /dev/md1 --fail /dev/sdb3
              mdadm /dev/md1 --remove /dev/sdb3
            fi
          args:
            executable: /bin/bash

        - name: Zero RAID superblocks
          shell: |
            mdadm --zero-superblock /dev/sdb1 || true
            mdadm --zero-superblock /dev/sdb2 || true
            mdadm --zero-superblock /dev/sdb3 || true
          args:
            executable: /bin/bash

        - name: Wipe secondary disk
          shell: |
            wipefs -a /dev/sdb || true
            sgdisk --zap-all /dev/sdb || true
            partprobe /dev/sdb || true
          args:
            executable: /bin/bash

        - name: Show RAID status
          command: cat /proc/mdstat
          register: mdstat_after
          changed_when: false

        - debug:
            var: mdstat_after.stdout_lines

      when: software_raid

    ####################################################################
    # Upgrade
    ####################################################################

    - name: Run Leapp upgrade
      command:
        argv:
          - leapp
          - upgrade
      register: upgrade_result

    - name: Display upgrade output
      debug:
        var: upgrade_result.stdout_lines
      when: upgrade_result is defined

    ####################################################################
    # Verify Upgrade Kernel
    ####################################################################

    - name: Verify upgrade kernel exists
      stat:
        path: /boot/vmlinuz-upgrade.x86_64
      register: upgrade_kernel

    - name: Verify upgrade initramfs exists
      stat:
        path: /boot/initramfs-upgrade.x86_64.img
      register: upgrade_initramfs

    - name: Fail if upgrade kernel is missing
      fail:
        msg: "Upgrade kernel (/boot/vmlinuz-upgrade.x86_64) was not created."
      when: not upgrade_kernel.stat.exists

    - name: Fail if upgrade initramfs is missing
      fail:
        msg: "Upgrade initramfs (/boot/initramfs-upgrade.x86_64.img) was not created."
      when: not upgrade_initramfs.stat.exists

    - name: Display upgrade kernel
      command: grubby --default-kernel
      register: default_kernel
      changed_when: false

    - debug:
        var: default_kernel.stdout

    ####################################################################
    # Reboot
    ####################################################################

    - name: Reboot into Rocky Linux upgrade environment
      reboot:
        reboot_timeout: 3600
        connect_timeout: 10
        post_reboot_delay: 60
      when:
        - upgrade_result is defined
        - upgrade_result.rc == 0

    ####################################################################
    # Reconnect After Upgrade
    ####################################################################

    - name: Wait for SSH to become available
      wait_for_connection:
        timeout: 1800
        sleep: 10

    ####################################################################
    # Bootstrap Python 3
    ####################################################################

    - name: Ensure Python 3 is installed
      raw: |
        if ! command -v python3 >/dev/null 2>&1; then
          dnf -y install python3
        fi
      changed_when: false

    - meta: reset_connection

    - name: Switch to Python 3
      set_fact:
        ansible_python_interpreter: /usr/bin/python3

    - name: Gather facts after reboot
      setup:

    ####################################################################
    # Verify Upgrade
    ####################################################################

    - name: Verify operating system
      command: cat /etc/os-release
      register: os_release
      changed_when: false

    - debug:
        var: os_release.stdout_lines

    - name: Verify running kernel
      command: uname -r
      register: kernel_version
      changed_when: false

    - debug:
        var: kernel_version.stdout


    ####################################################################
    # Rebuild RAID1 (Only for Software RAID Hosts)
    ####################################################################

    - block:

        - name: Clone partition table from sda to sdb
          command: sgdisk -R=/dev/sdb /dev/sda

        - name: Generate new GPT disk GUID
          command: sgdisk -G /dev/sdb

        - name: Reload partition table
          command: partprobe /dev/sdb

        - name: Wait for sdb1
          wait_for:
            path: /dev/sdb1
            timeout: 60

        - name: Wait for sdb2
          wait_for:
            path: /dev/sdb2
            timeout: 60

        - name: Wait for sdb3
          wait_for:
            path: /dev/sdb3
            timeout: 60

        ################################################################
        # Re-add RAID Members
        ################################################################

        - name: Add sdb2 back to md0
          command: mdadm --add /dev/md0 /dev/sdb2

        - name: Add sdb3 back to md1
          command: mdadm --add /dev/md1 /dev/sdb3

        ################################################################
        # Wait for RAID Rebuild
        ################################################################

        - name: Wait for RAID rebuild to complete
          shell: |
            while grep -qE 'recovery|resync' /proc/mdstat; do
              cat /proc/mdstat
              sleep 15
            done
          args:
            executable: /bin/bash
          changed_when: false

        - name: Verify RAID is healthy
          shell: |
            cat /proc/mdstat
            grep '\[UU\]' /proc/mdstat
          register: raid_verify
          changed_when: false

        - debug:
            var: raid_verify.stdout_lines

        ################################################################
        # Recreate Secondary EFI
        ################################################################

        - name: Create FAT32 filesystem on sdb1
          filesystem:
            dev: /dev/sdb1
            fstype: vfat

        - name: Create EFI2 mount point
          file:
            path: /boot/efi2
            state: directory

        - name: Mount secondary EFI
          mount:
            path: /boot/efi2
            src: /dev/sdb1
            fstype: vfat
            state: mounted

        ################################################################
        # Copy EFI Files
        ################################################################

        - name: Synchronize EFI contents
          shell: |
            rsync -aH --delete /boot/efi/ /boot/efi2/
            sync
          args:
            executable: /bin/bash

        - name: Verify copied EFI files
          command: find /boot/efi2/EFI -maxdepth 2 -type f
          register: efi_files
          changed_when: false

        - debug:
            var: efi_files.stdout_lines

        ################################################################
        # Recreate UEFI Boot Entries
        ################################################################

        - name: Get current EFI boot entries
          command: efibootmgr
          register: efi_boot_entries
          changed_when: false

        - name: Remove old CentOS EFI entry
          shell: |
            for id in $(efibootmgr | awk '/CentOS/{print $1}' | sed 's/Boot//;s/*//'); do
              efibootmgr -b $id -B
            done
          args:
            executable: /bin/bash
          when: "'CentOS' in efi_boot_entries.stdout"

        - name: Remove old Rocky Linux entry
          shell: |
            for id in $(efibootmgr | awk '/Rocky Linux/{print $1}' | sed 's/Boot//;s/*//'); do
              efibootmgr -b $id -B
            done
          args:
            executable: /bin/bash
          when: "'Rocky Linux' in efi_boot_entries.stdout"

        - name: Remove old Rocky RAID1 Disk 1 entry
          shell: |
            for id in $(efibootmgr | awk '/Rocky RAID1 Disk 1/{print $1}' | sed 's/Boot//;s/*//'); do
              efibootmgr -b $id -B
            done
          args:
            executable: /bin/bash
          when: "'Rocky RAID1 Disk 1' in efi_boot_entries.stdout"

        - name: Remove old Rocky RAID1 Disk 2 entry
          shell: |
            for id in $(efibootmgr | awk '/Rocky RAID1 Disk 2/{print $1}' | sed 's/Boot//;s/*//'); do
              efibootmgr -b $id -B
            done
          args:
            executable: /bin/bash
          when: "'Rocky RAID1 Disk 2' in efi_boot_entries.stdout"

        - name: Create Rocky RAID1 Disk 1 EFI entry
          command:
            argv:
              - efibootmgr
              - -c
              - -d
              - /dev/sda
              - -p
              - "1"
              - -L
              - "Rocky RAID1 Disk 1"
              - -l
              - '\EFI\rocky\shimx64.efi'

        - name: Create Rocky RAID1 Disk 2 EFI entry
          command:
            argv:
              - efibootmgr
              - -c
              - -d
              - /dev/sdb
              - -p
              - "1"
              - -L
              - "Rocky RAID1 Disk 2"
              - -l
              - '\EFI\rocky\shimx64.efi'

        - name: Get new EFI boot entries
          command: efibootmgr
          register: new_efi_entries
          changed_when: false

        - name: Extract Rocky boot numbers
          set_fact:
            rocky_boot_order: >-
              {{
                new_efi_entries.stdout_lines
                | select('search','Rocky RAID1 Disk')
                | map('regex_replace','Boot([0-9A-F]{4}).*','\\1')
                | list
              }}

        - name: Set Rocky boot order
          command:
            argv:
              - efibootmgr
              - -o
              - "{{ rocky_boot_order | join(',') }}"
          when: rocky_boot_order | length >= 2

        - name: Verify EFI boot entries
          command: efibootmgr -v
          register: final_efi
          changed_when: false

        - debug:
            var: final_efi.stdout_lines

        ################################################################
        # Update mdadm & Initramfs
        ################################################################

        - name: Regenerate mdadm configuration
          shell: |
            mdadm --detail --scan > /etc/mdadm.conf

        - name: Rebuild initramfs
          command: dracut -f

        - name: Regenerate GRUB configuration
          command: grub2-mkconfig -o /boot/grub2/grub.cfg

        ################################################################
        # Final RAID Status
        ################################################################

        - name: Display final RAID status
          command: cat /proc/mdstat
          register: final_mdstat
          changed_when: false

        - debug:
            var: final_mdstat.stdout_lines

      when: software_raid


    ####################################################################
    # Final System Verification
    ####################################################################

    - name: Verify Rocky Linux installation
      command: cat /etc/os-release
      register: os_release
      changed_when: false

    - name: Display operating system information
      debug:
        var: os_release.stdout_lines

    - name: Verify running kernel
      command: uname -r
      register: kernel_version
      changed_when: false

    - name: Display kernel version
      debug:
        var: kernel_version.stdout

    - name: Verify SELinux mode
      command: getenforce
      register: selinux_status
      changed_when: false

    - name: Display SELinux status
      debug:
        var: selinux_status.stdout

    ####################################################################
    # Verify Storage
    ####################################################################

    - name: Display block devices
      command: lsblk
      register: lsblk_output
      changed_when: false

    - name: Show block devices
      debug:
        var: lsblk_output.stdout_lines

    - name: Display mounted filesystems
      command: mount
      register: mount_output
      changed_when: false

    - name: Show mounted filesystems
      debug:
        var: mount_output.stdout_lines

    ####################################################################
    # Verify RAID
    ####################################################################

    - name: Display mdadm configuration
      command: cat /etc/mdadm.conf
      register: mdadm_conf
      changed_when: false
      when: software_raid

    - name: Show mdadm configuration
      debug:
        var: mdadm_conf.stdout_lines
      when: software_raid

    - name: Display RAID status
      command: cat /proc/mdstat
      register: mdstat
      changed_when: false
      when: software_raid

    - name: Show RAID status
      debug:
        var: mdstat.stdout_lines
      when: software_raid

    ####################################################################
    # Verify EFI
    ####################################################################

    - name: Display EFI boot entries
      command: efibootmgr -v
      register: efi_entries
      changed_when: false

    - name: Show EFI boot entries
      debug:
        var: efi_entries.stdout_lines

    - name: Display primary EFI contents
      command: find /boot/efi/EFI -maxdepth 2 -type f
      register: primary_efi
      changed_when: false

    - name: Show primary EFI contents
      debug:
        var: primary_efi.stdout_lines

    - name: Display secondary EFI contents
      command: find /boot/efi2/EFI -maxdepth 2 -type f
      register: secondary_efi
      changed_when: false
      when: software_raid

    - name: Show secondary EFI contents
      debug:
        var: secondary_efi.stdout_lines
      when: software_raid

    ####################################################################
    # Verify Default Kernel
    ####################################################################

    - name: Verify default kernel
      command: grubby --default-kernel
      register: default_kernel
      changed_when: false

    - name: Display default kernel
      debug:
        var: default_kernel.stdout

    ####################################################################
    # Final Status
    ####################################################################

    - name: Display migration summary
      debug:
        msg:
          - "============================================================"
          - " CentOS 7 -> Rocky Linux 8 Migration Completed Successfully"
          - "============================================================"
          - " Host            : {{ inventory_hostname }}"
          - " Distribution    : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - " Kernel          : {{ ansible_kernel }}"
          - " Python          : {{ ansible_python.version.major }}.{{ ansible_python.version.minor }}"
          - " Software RAID   : {{ software_raid }}"
          - "============================================================"

    - name: Display RAID summary
      debug:
        msg:
          - "RAID arrays rebuilt successfully."
          - "EFI synchronized to both disks."
          - "Secondary UEFI boot entry created."
      when: software_raid

    - name: Display non-RAID summary
      debug:
        msg:
          - "Single disk system detected."
          - "RAID rebuild steps were skipped."
      when: not software_raid
