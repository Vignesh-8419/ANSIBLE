#==============================================================================
# Rocky Linux 8.10 Enterprise Golden Image
# UEFI + GPT + Software RAID1 + LVM
# 100% ENFORCED PHYSICAL BLOCK PARITY LAYOUT ORCHESTRATION
#==============================================================================
text
cdrom
lang en_US.UTF-8
keyboard us
timezone Asia/Kolkata --isUtc
rootpw --plaintext Root@123
network --bootproto=dhcp --device=link --activate
firewall --enabled --service=ssh
selinux --enforcing
services --enabled="NetworkManager,sshd,chronyd"
reboot

##############################################################################
# PRE INSTALL: HARDWARE SECTOR ENFORCEMENT & PURE PARITY PARTITIONING
##############################################################################
%pre --interpreter=/usr/bin/bash --log=/tmp/ks-pre.log
exec > /tmp/ks-pre.log 2>&1

echo "======================================================"
echo "Rocky Linux 8 Enterprise RAID Pre-Orchestration Engine"
echo "======================================================"

udevadm settle
modprobe md_mod
modprobe raid1
sleep 2

# Stop and clear existing storage components safely
for md in $(cat /proc/mdstat | awk '/^md/{print $1}')
do
    mdadm --stop /dev/$md || true
done
vgchange -an || true
dmsetup remove_all || true

# Detect first two hard disks (Preserving Kernel Enumeration Order)
DISKS=()
while read -r NAME TYPE
do
    [ "$TYPE" != "disk" ] && continue
    case "$NAME" in
        sr*|loop*|fd*|ram*|zd*) continue ;;
    esac
    DISKS+=("$NAME")
done < <(lsblk -dn -o NAME,TYPE)

if [ ${#DISKS[@]} -ne 2 ]; then
    echo "ERROR: Exactly two installation disks are required."
    exit 1
fi

DISK1="/dev/${DISKS[0]}"
DISK2="/dev/${DISKS[1]}"

echo "Primary Disk  : $DISK1"
echo "Secondary Disk: $DISK2"

# Thorough Metadata Eradication
for D in "$DISK1" "$DISK2"
do
    mdadm --zero-superblock --force ${D}* 2>/dev/null || true
    wipefs -af "$D"
    dd if=/dev/zero of="$D" bs=1M count=20 conv=fsync status=none
    udevadm settle
done

# Resolve precise naming paths (SCSI vs NVMe)
D1_BASE=$(basename "$DISK1")
D2_BASE=$(basename "$DISK2")

if [[ "$D1_BASE" == nvme* || "$D1_BASE" == mmcblk* ]]; then
    P1="p1"; P2="p2"; P3="p3"
else
    P1="1";  P2="2";  P3="3"
fi

##############################################################################
# Direct Hardware Sector Level Provisioning Pass
##############################################################################
for TARGET_DISK in "$DISK1" "$DISK2"
do
    echo "Partitioning $TARGET_DISK..."

    sfdisk "$TARGET_DISK" <<EOF
label: gpt
type=C12A7328-F81F-11D2-BA4B-00A0C93EC93B,size=600MiB,name="EFI System"
type=0FC63DAF-8483-4772-8E79-3D69D8477DE4,size=1024MiB,name="Boot Member"
type=0FC63DAF-8483-4772-8E79-3D69D8477DE4,name="LVM Member"
EOF
done

sync
udevadm settle

##############################################################################
# Refresh Kernel Partition Table
##############################################################################
echo "Refreshing kernel partition tables..."

sync

partprobe "$DISK1"
partprobe "$DISK2"

blockdev --rereadpt "$DISK1" || true
blockdev --rereadpt "$DISK2" || true

partprobe "$DISK1"
partprobe "$DISK2"

udevadm settle

udevadm trigger
udevadm settle

for dev in \
    "${DISK1}${P1}" "${DISK1}${P2}" "${DISK1}${P3}" \
    "${DISK2}${P1}" "${DISK2}${P2}" "${DISK2}${P3}"
do
    echo "Waiting for $dev..."

    timeout=30
    while [ ! -b "$dev" ] && [ $timeout -gt 0 ]
    do
        sleep 1
        udevadm settle
        timeout=$((timeout-1))
    done

    if [ ! -b "$dev" ]; then
        echo "ERROR: $dev not found"
        lsblk
        fdisk -l
        exit 1
    fi
done

echo
echo "===================== lsblk ====================="
lsblk

echo
echo "===================== fdisk ====================="
fdisk -l "$DISK1"
fdisk -l "$DISK2"

echo "================================================="

echo "===== DEVICE CHECK ====="

ls -l /dev/${D1_BASE}${P1} || true
ls -l /dev/${D1_BASE}${P2} || true
ls -l /dev/${D1_BASE}${P3} || true

ls -l /dev/${D2_BASE}${P1} || true
ls -l /dev/${D2_BASE}${P2} || true
ls -l /dev/${D2_BASE}${P3} || true

echo "========================"

# Force Anaconda to execute instructions directly on top of the pre-built sectors
cat > /tmp/partition.ks <<EOF
zerombr
clearpart --none

bootloader --location=boot --append="crashkernel=auto"

part /boot/efi --onpart=${D1_BASE}${P1} --fstype=efi

part raid.boot1 --onpart=${D1_BASE}${P2}
part raid.boot2 --onpart=${D2_BASE}${P2}

part raid.root1 --onpart=${D1_BASE}${P3}
part raid.root2 --onpart=${D2_BASE}${P3}

raid /boot --device=md0 --level=1 --fstype=xfs raid.boot1 raid.boot2
raid pv.01 --device=md1 --level=1 --fstype=lvmpv raid.root1 raid.root2

volgroup vg_root pv.01

logvol /     --vgname=vg_root --name=root --fstype=xfs --size=20480
logvol /var  --vgname=vg_root --name=var  --fstype=xfs --size=15360
logvol swap  --vgname=vg_root --name=swap --size=4096
logvol /home --vgname=vg_root --name=home --fstype=xfs --size=1024 --grow
EOF

echo "Pre-installation configuration layout processing completed successfully."
echo "===== GENERATED partition.ks ====="
cat /tmp/partition.ks
echo "=================================="
%end

%include /tmp/partition.ks

##############################################################################
# PACKAGES
##############################################################################
%packages
@^server
mdadm
lvm2
dosfstools
xfsprogs
grub2-efi-x64
grub2-tools
shim-x64
efibootmgr
open-vm-tools
vim
nano
wget
curl
bash-completion
net-tools
lsof
tcpdump
rsync
tar
unzip
zip
%end

##############################################################################
# POST INSTALL: DOWNSTREAM EXECUTION AND EFI BACKUP SYNCHRONIZATION
##############################################################################
%post --interpreter=/usr/bin/bash --log=/root/anaconda-post.log --erroronfail
set -euxo pipefail

echo "======================================================"
echo "Running Post Installation Scripts"
echo "======================================================"

# Target downstream script repository with fully verified BASEURL string
mkdir -p /root/scripts
BASEURL="http://192.168.253.136/repo/rocky8-kickstarts"

echo "Downloading enable-verbose-boot.sh..."
curl --retry 5 --retry-delay 2 -fsSL \
    -o /root/scripts/enable-verbose-boot.sh \
    "https://raw.githubusercontent.com/Vignesh-8419/ANSIBLE/main/enable-verbose-boot.sh?$(date +%s)"

chmod +x /root/scripts/enable-verbose-boot.sh

# Robust curl downloads with transient network error recovery configurations
curl --retry 5 --retry-delay 2 -fsSL -o /root/scripts/30-postinstall.sh "${BASEURL}/30-postinstall.sh"
curl --retry 5 --retry-delay 2 -fsSL -o /root/scripts/50-grub.sh        "${BASEURL}/50-grub.sh"
curl --retry 5 --retry-delay 2 -fsSL -o /root/scripts/99-cleanup.sh     "${BASEURL}/99-cleanup.sh"

chmod +x /root/scripts/30-postinstall.sh /root/scripts/50-grub.sh /root/scripts/99-cleanup.sh

# Verify each script independently to completely eliminate the loop expansion crash
if [ ! -s /root/scripts/30-postinstall.sh ]; then echo "ERROR: 30-postinstall.sh is missing or empty."; exit 1; fi
if [ ! -s /root/scripts/50-grub.sh ];        then echo "ERROR: 50-grub.sh is missing or empty.";        exit 1; fi
if [ ! -s /root/scripts/99-cleanup.sh ];     then echo "ERROR: 99-cleanup.sh is missing or empty.";     exit 1; fi

# Sequential Deployment Pipeline Execution
/root/scripts/30-postinstall.sh
/root/scripts/50-grub.sh
/root/scripts/enable-verbose-boot.sh
/root/scripts/99-cleanup.sh

#==============================================================================
# POST-FLIGHT RUNTIME DIAGNOSTIC TELEMETRY
#==============================================================================
echo "=== POST-INSTALL FINAL LAYOUT VERIFICATION ==="
lsblk -o NAME,SIZE,FSTYPE,LABEL,MOUNTPOINT || true
cat /proc/mdstat || true
pvs || true
vgs || true
lvs || true
efibootmgr -v || true

echo "======================================================"
echo "POST_INSTALL_COMPLETE"
echo "======================================================"
%end
