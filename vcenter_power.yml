---
- name: Power ON or OFF vCenter from VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vmrun_path: 'D:/VM workstation/vmrun.exe'
    vcenter_vmx: 'D:/vCenter/vCenter.vmx'

    # Default action
    power_action: "{{ action | default('on') }}"

  tasks:

    - name: Validate requested action
      ansible.builtin.assert:
        that:
          - power_action in ['on', 'off']
        fail_msg: "Invalid action '{{ power_action }}'. Use: on or off"
        success_msg: "Requested power action: {{ power_action }}"

    - name: Check currently running VMware Workstation VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_list
      changed_when: false

    - name: Check vCenter power state
      ansible.builtin.set_fact:
        vcenter_running: "{{ vcenter_vmx in vmrun_list.stdout }}"

    - name: Show current vCenter power state
      ansible.builtin.debug:
        msg: >-
          vCenter is currently
          {{ 'POWERED ON' if vcenter_running else 'POWERED OFF' }}.

    - name: Power ON vCenter
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ vcenter_vmx }}"
          - "nogui"
      when:
        - power_action == 'on'
        - not vcenter_running

    - name: vCenter already powered ON
      ansible.builtin.debug:
        msg: "vCenter is already powered ON. No action required."
      when:
        - power_action == 'on'
        - vcenter_running

    - name: Power OFF vCenter
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vcenter_vmx }}"
          - "soft"
      when:
        - power_action == 'off'
        - vcenter_running

    - name: vCenter already powered OFF
      ansible.builtin.debug:
        msg: "vCenter is already powered OFF. No action required."
      when:
        - power_action == 'off'
        - not vcenter_running

    - name: Show completion message
      ansible.builtin.debug:
        msg: >-
          vCenter power {{ power_action | upper }} operation completed.
