---
- name: Power ON or OFF VMware Lab VMs
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # VMware Workstation vmrun executable
    vmrun_path: 'D:/VM workstation/vmrun.exe'

    # VMX file paths
    esxi_vmx: 'D:/ESXI/VMware ESXi 7 and later.vmx'
    vcenter_vmx: 'D:/vCenter/vCenter.vmx'

    # Variables passed from command line
    target: "{{ target_vm | default('all') }}"
    power_action: "{{ power | default('on') }}"

  tasks:

    # ============================================================
    # VALIDATION
    # ============================================================

    - name: Validate target
      ansible.builtin.assert:
        that:
          - target in ['esxi', 'vcenter', 'all']
        fail_msg: >-
          Invalid target '{{ target }}'.
          Use: esxi, vcenter, or all.

    - name: Validate power action
      ansible.builtin.assert:
        that:
          - power_action in ['on', 'off']
        fail_msg: >-
          Invalid power action '{{ power_action }}'.
          Use: on or off.

    # ============================================================
    # CHECK CURRENTLY RUNNING VMS
    # ============================================================

    - name: Check currently running VMware Workstation VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_list
      changed_when: false

    - name: Display running VMs
      ansible.builtin.debug:
        var: vmrun_list.stdout_lines

    - name: Set ESXi running state
      ansible.builtin.set_fact:
        esxi_running: >-
          {{
            'D:\\ESXI\\VMware ESXi 7 and later.vmx'
            in vmrun_list.stdout
          }}

    - name: Set vCenter running state
      ansible.builtin.set_fact:
        vcenter_running: >-
          {{
            'D:\\vCenter\\vCenter.vmx'
            in vmrun_list.stdout
          }}

    - name: Display VM states
      ansible.builtin.debug:
        msg:
          - "ESXi running: {{ esxi_running }}"
          - "vCenter running: {{ vcenter_running }}"

    # ============================================================
    # POWER ON / RESUME
    #
    # vmrun start handles both:
    #   - Powered OFF VM -> starts it
    #   - Suspended VM    -> resumes it
    # ============================================================

    - name: Start or resume ESXi
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ esxi_vmx }}"
          - "nogui"
      register: esxi_start
      changed_when: esxi_start.rc == 0
      when:
        - power_action == 'on'
        - target in ['esxi', 'all']
        - not esxi_running

    - name: Start or resume vCenter
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ vcenter_vmx }}"
          - "nogui"
      register: vcenter_start
      changed_when: vcenter_start.rc == 0
      when:
        - power_action == 'on'
        - target in ['vcenter', 'all']
        - not vcenter_running

    # ============================================================
    # POWER OFF
    #
    # When target=all:
    #   1. Power OFF vCenter
    #   2. Power OFF ESXi
    # ============================================================

    - name: Power OFF vCenter gracefully
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vcenter_vmx }}"
          - "soft"
      register: vcenter_stop
      changed_when: vcenter_stop.rc == 0
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - vcenter_running

    - name: Power OFF ESXi
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ esxi_vmx }}"
          - "hard"
      register: esxi_stop
      changed_when: esxi_stop.rc == 0
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - esxi_running

    # ============================================================
    # COMPLETION
    # ============================================================

    - name: Show completion message
      ansible.builtin.debug:
        msg: >-
          Requested {{ power_action | upper }} operation completed
          for {{ target }}.
