---
- name: Power ON or OFF VMware Lab VMs
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ============================================================
    # VMWARE WORKSTATION
    # ============================================================

    vmware_workstation_path: 'D:/VM workstation/vmware.exe'

    vmrun_path: 'D:/VM workstation/vmrun.exe'

    # ============================================================
    # VMX PATHS
    # ============================================================

    esxi_vmx: 'D:/ESXI/ESXI-01/ESXI-01.vmx'

    vcenter_vmx: 'D:/vCenter/vCenter.vmx'

    # ============================================================
    # SUSPENDED VM STATE FILES
    #
    # VMware Workstation normally creates .vmss when suspended.
    # ============================================================

    esxi_vmss: 'D:/ESXI/ESXI-01/ESXI-01.vmss'

    vcenter_vmss: 'D:/vCenter/vCenter.vmss'

    # ============================================================
    # RUNNING VM PATHS
    #
    # Must match:
    #
    # vmrun -T ws list
    # ============================================================

    esxi_vmx_running_path: 'D:\ESXI\ESXI-01\ESXI-01.vmx'

    vcenter_vmx_running_path: 'D:\vCenter\vCenter.vmx'

    # ============================================================
    # COMMAND LINE VARIABLES
    #
    # Supported:
    #
    # target_hosts=esxi
    # target_hosts=vcenter
    # target_hosts=all
    #
    # target_vm=esxi
    # target_vm=vcenter
    # target_vm=all
    #
    # power=on
    # power=off
    # ============================================================

    target: "{{ target_hosts | default(target_vm | default('all')) | lower }}"

    power_action: "{{ power | default('on') | lower }}"

  tasks:

    # ============================================================
    # STEP 1 - VALIDATION
    # ============================================================

    - name: Validate target
      ansible.builtin.assert:
        that:
          - target in ['esxi', 'vcenter', 'all']
        fail_msg: >-
          Invalid target '{{ target }}'.
          Use: esxi, vcenter, or all.
        success_msg: "Target '{{ target }}' is valid."

    - name: Validate power action
      ansible.builtin.assert:
        that:
          - power_action in ['on', 'off']
        fail_msg: >-
          Invalid power action '{{ power_action }}'.
          Use: on or off.
        success_msg: "Power action '{{ power_action }}' is valid."

    # ============================================================
    # STEP 2 - OPEN VMWARE WORKSTATION
    # ============================================================

    - name: Display VMware Workstation path
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "OPENING VMWARE WORKSTATION"
          - "=============================================="
          - "VMware GUI : {{ vmware_workstation_path }}"
          - "vmrun      : {{ vmrun_path }}"
          - "=============================================="

    - name: Open VMware Workstation GUI
      ansible.builtin.command:
        argv:
          - cmd.exe
          - /c
          - start
          - ""
          - "{{ vmware_workstation_path }}"
      register: vmware_workstation_start
      changed_when: vmware_workstation_start.rc == 0

    - name: Display VMware Workstation launch status
      ansible.builtin.debug:
        msg:
          - "VMware Workstation launch command completed."
          - "Return Code: {{ vmware_workstation_start.rc }}"

    - name: Wait for VMware Workstation to initialize
      ansible.builtin.pause:
        seconds: 10

    # ============================================================
    # STEP 3 - CHECK RUNNING VMS
    # ============================================================

    - name: Check currently running VMware Workstation VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - list
      register: vmrun_list
      changed_when: false

    - name: Display running VMware Workstation VMs
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CURRENTLY RUNNING VMWARE VMS"
          - "=============================================="
          - "{{ vmrun_list.stdout }}"
          - "=============================================="

    # ============================================================
    # STEP 4 - DETECT RUNNING STATE
    # ============================================================

    - name: Set ESXi running state
      ansible.builtin.set_fact:
        esxi_running: "{{ esxi_vmx_running_path in vmrun_list.stdout }}"

    - name: Set vCenter running state
      ansible.builtin.set_fact:
        vcenter_running: "{{ vcenter_vmx_running_path in vmrun_list.stdout }}"

    # ============================================================
    # STEP 5 - CHECK SUSPENDED STATE FILES
    #
    # IMPORTANT:
    #
    # vmrun list does NOT show suspended VMs.
    #
    # VMware Workstation normally creates .vmss when suspended.
    # ============================================================

    - name: Check ESXi suspended state file
      ansible.builtin.stat:
        path: "{{ esxi_vmss }}"
      register: esxi_vmss_stat

    - name: Check vCenter suspended state file
      ansible.builtin.stat:
        path: "{{ vcenter_vmss }}"
      register: vcenter_vmss_stat

    - name: Set ESXi suspended state
      ansible.builtin.set_fact:
        esxi_suspended: "{{ esxi_vmss_stat.stat.exists }}"

    - name: Set vCenter suspended state
      ansible.builtin.set_fact:
        vcenter_suspended: "{{ vcenter_vmss_stat.stat.exists }}"

    # ============================================================
    # STEP 6 - DISPLAY COMPLETE VM STATE
    # ============================================================

    - name: Display detected VM states
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CURRENT VM STATUS"
          - "=============================================="
          - "ESXi VMX          : {{ esxi_vmx_running_path }}"
          - "vCenter VMX       : {{ vcenter_vmx_running_path }}"
          - "----------------------------------------------"
          - "ESXi running      : {{ esxi_running }}"
          - "ESXi suspended    : {{ esxi_suspended }}"
          - "vCenter running   : {{ vcenter_running }}"
          - "vCenter suspended : {{ vcenter_suspended }}"
          - "=============================================="

    # ============================================================
    # POWER ON
    #
    # vmrun start:
    #
    # - Starts stopped VM
    # - Resumes suspended VM
    # ============================================================

    # ============================================================
    # START / RESUME ESXI
    # ============================================================

    - name: Start or resume ESXi
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - start
          - "{{ esxi_vmx }}"
          - nogui
      register: esxi_start
      changed_when: esxi_start.rc == 0
      when:
        - power_action == 'on'
        - target in ['esxi', 'all']
        - not esxi_running

    - name: Display ESXi started or resumed message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "ESXI STARTED / RESUMED"
          - "=============================================="
          - "VMX: {{ esxi_vmx }}"
          - "=============================================="
      when:
        - power_action == 'on'
        - target in ['esxi', 'all']
        - not esxi_running
        - esxi_start is defined
        - esxi_start.rc == 0

    - name: Display ESXi already running message
      ansible.builtin.debug:
        msg: "ESXi is already running. Skipping startup."
      when:
        - power_action == 'on'
        - target in ['esxi', 'all']
        - esxi_running

    # ============================================================
    # WAIT BEFORE VCENTER
    # ============================================================

    - name: Wait for ESXi startup
      ansible.builtin.pause:
        seconds: 15
      when:
        - power_action == 'on'
        - target == 'all'
        - not esxi_running

    # ============================================================
    # START / RESUME VCENTER
    # ============================================================

    - name: Start or resume vCenter
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - start
          - "{{ vcenter_vmx }}"
          - nogui
      register: vcenter_start
      changed_when: vcenter_start.rc == 0
      when:
        - power_action == 'on'
        - target in ['vcenter', 'all']
        - not vcenter_running

    - name: Display vCenter started or resumed message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "VCENTER STARTED / RESUMED"
          - "=============================================="
          - "VMX: {{ vcenter_vmx }}"
          - "=============================================="
      when:
        - power_action == 'on'
        - target in ['vcenter', 'all']
        - not vcenter_running
        - vcenter_start is defined
        - vcenter_start.rc == 0

    - name: Display vCenter already running message
      ansible.builtin.debug:
        msg: "vCenter is already running. Skipping startup."
      when:
        - power_action == 'on'
        - target in ['vcenter', 'all']
        - vcenter_running

    # ============================================================
    # POWER OFF VCENTER
    #
    # PRIORITY:
    #
    # 1. Running      -> soft stop
    # 2. Suspended    -> resume then hard stop
    # 3. Stopped      -> skip
    # ============================================================

    # ============================================================
    # RUNNING VCENTER
    # ============================================================

    - name: Gracefully power OFF running vCenter
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - stop
          - "{{ vcenter_vmx }}"
          - soft
      register: vcenter_soft_stop
      changed_when: vcenter_soft_stop.rc == 0
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - vcenter_running

    - name: Display vCenter graceful shutdown message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "VCENTER GRACEFUL SHUTDOWN INITIATED"
          - "=============================================="
          - "VMX: {{ vcenter_vmx }}"
          - "=============================================="
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - vcenter_running
        - vcenter_soft_stop.rc == 0

    - name: Wait for vCenter shutdown
      ansible.builtin.pause:
        seconds: 20
      when:
        - power_action == 'off'
        - target == 'all'
        - vcenter_running
        - vcenter_soft_stop.rc == 0

    # ============================================================
    # SUSPENDED VCENTER
    #
    # THIS IS THE IMPORTANT FIX.
    #
    # vmrun stop does not reliably power off a suspended VM.
    #
    # Instead:
    #
    # 1. Resume it
    # 2. Wait a few seconds
    # 3. Hard power it off
    # ============================================================

    - name: Resume suspended vCenter before power off
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - start
          - "{{ vcenter_vmx }}"
          - nogui
      register: vcenter_resume
      changed_when: vcenter_resume.rc == 0
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - not vcenter_running
        - vcenter_suspended

    - name: Display vCenter resume message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "VCENTER WAS SUSPENDED"
          - "=============================================="
          - "Suspended VM detected."
          - "Resuming VM before hard power OFF."
          - "=============================================="
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - vcenter_suspended
        - vcenter_resume is defined
        - vcenter_resume.rc == 0

    - name: Wait for suspended vCenter to resume
      ansible.builtin.pause:
        seconds: 5
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - vcenter_suspended
        - vcenter_resume is defined
        - vcenter_resume.rc == 0

    - name: Hard power OFF previously suspended vCenter
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - stop
          - "{{ vcenter_vmx }}"
          - hard
      register: vcenter_suspended_stop
      changed_when: vcenter_suspended_stop.rc == 0
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - vcenter_suspended
        - vcenter_resume is defined
        - vcenter_resume.rc == 0

    - name: Display suspended vCenter power OFF result
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "SUSPENDED VCENTER POWERED OFF"
          - "=============================================="
          - "VMX: {{ vcenter_vmx }}"
          - "Method: RESUME -> HARD POWER OFF"
          - "=============================================="
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - vcenter_suspended
        - vcenter_suspended_stop is defined
        - vcenter_suspended_stop.rc == 0

    # ============================================================
    # STOPPED VCENTER
    # ============================================================

    - name: Display vCenter already stopped message
      ansible.builtin.debug:
        msg:
          - "vCenter is already powered OFF."
          - "No shutdown action required."
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - not vcenter_running
        - not vcenter_suspended

    # ============================================================
    # POWER OFF ESXI
    #
    # Running   -> graceful shutdown
    # Suspended -> resume then hard shutdown
    # Stopped   -> skip
    # ============================================================

    # ============================================================
    # RUNNING ESXI
    # ============================================================

    - name: Gracefully power OFF running ESXi
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - stop
          - "{{ esxi_vmx }}"
          - soft
      register: esxi_soft_stop
      changed_when: esxi_soft_stop.rc == 0
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - esxi_running

    - name: Display ESXi graceful shutdown message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "ESXI GRACEFUL SHUTDOWN INITIATED"
          - "=============================================="
          - "VMX: {{ esxi_vmx }}"
          - "=============================================="
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - esxi_running
        - esxi_soft_stop.rc == 0

    # ============================================================
    # SUSPENDED ESXI
    # ============================================================

    - name: Resume suspended ESXi before power off
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - start
          - "{{ esxi_vmx }}"
          - nogui
      register: esxi_resume
      changed_when: esxi_resume.rc == 0
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - not esxi_running
        - esxi_suspended

    - name: Display ESXi resume message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "ESXI WAS SUSPENDED"
          - "=============================================="
          - "Resuming VM before hard power OFF."
          - "=============================================="
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - esxi_suspended
        - esxi_resume is defined
        - esxi_resume.rc == 0

    - name: Wait for suspended ESXi to resume
      ansible.builtin.pause:
        seconds: 5
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - esxi_suspended
        - esxi_resume is defined
        - esxi_resume.rc == 0

    - name: Hard power OFF previously suspended ESXi
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - stop
          - "{{ esxi_vmx }}"
          - hard
      register: esxi_suspended_stop
      changed_when: esxi_suspended_stop.rc == 0
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - esxi_suspended
        - esxi_resume is defined
        - esxi_resume.rc == 0

    - name: Display suspended ESXi power OFF result
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "SUSPENDED ESXI POWERED OFF"
          - "=============================================="
          - "VMX: {{ esxi_vmx }}"
          - "Method: RESUME -> HARD POWER OFF"
          - "=============================================="
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - esxi_suspended
        - esxi_suspended_stop is defined
        - esxi_suspended_stop.rc == 0

    # ============================================================
    # STOPPED ESXI
    # ============================================================

    - name: Display ESXi already stopped message
      ansible.builtin.debug:
        msg:
          - "ESXi is already powered OFF."
          - "No shutdown action required."
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - not esxi_running
        - not esxi_suspended

    # ============================================================
    # FINAL STATUS
    # ============================================================

    - name: Show completion message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "VMWARE LAB OPERATION COMPLETED"
          - "=============================================="
          - "Target : {{ target | upper }}"
          - "Action : {{ power_action | upper }}"
          - "=============================================="
