---
- name: Power ON or OFF VMware Lab VMs
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ============================================================
    # VMWARE WORKSTATION PATHS
    # ============================================================
    vmware_workstation_path: 'D:/VM workstation/vmware.exe'
    vmrun_path: 'D:/VM workstation/vmrun.exe'

    # ============================================================
    # VMX PATHS
    # ============================================================
    esxi_vmx: 'D:/ESXI/ESXI-01/ESXI-01.vmx'
    vcenter_vmx: 'D:/vCenter/vCenter.vmx'

    # ============================================================
    # PATHS AS SHOWN BY: vmrun -T ws list
    # ============================================================
    esxi_vmx_running_path: 'D:\ESXI\ESXI-01\ESXI-01.vmx'
    vcenter_vmx_running_path: 'D:\vCenter\vCenter.vmx'

    # ============================================================
    # COMMAND-LINE VARIABLES
    #
    # Examples:
    #
    # target_hosts=esxi
    # target_hosts=vcenter
    # target_hosts=all
    #
    # power=on
    # power=off
    # ============================================================
    target: "{{ target_hosts | default(target_vm | default('all')) | lower }}"
    power_action: "{{ power | default('on') | lower }}"

  tasks:

    # ============================================================
    # STEP 1 - VALIDATE INPUT
    # ============================================================

    - name: Validate target
      ansible.builtin.assert:
        that:
          - target in ['esxi', 'vcenter', 'all']
        fail_msg: >-
          Invalid target '{{ target }}'.
          Use: esxi, vcenter, or all.
        success_msg: "Target '{{ target }}' is valid."

    - name: Validate power action
      ansible.builtin.assert:
        that:
          - power_action in ['on', 'off']
        fail_msg: >-
          Invalid power action '{{ power_action }}'.
          Use: on or off.
        success_msg: "Power action '{{ power_action }}' is valid."

    # ============================================================
    # STEP 2 - OPEN VMWARE WORKSTATION
    # ============================================================

    - name: Open VMware Workstation
      ansible.builtin.command:
        argv:
          - cmd.exe
          - /c
          - start
          - ""
          - "{{ vmware_workstation_path }}"
      register: vmware_start
      changed_when: vmware_start.rc == 0

    - name: Display VMware Workstation startup message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "OPENING VMWARE WORKSTATION"
          - "=============================================="
          - "VMware Workstation is starting..."
          - "Path: {{ vmware_workstation_path }}"
          - "=============================================="

    - name: Wait for VMware Workstation to initialize
      ansible.builtin.pause:
        seconds: 5

    # ============================================================
    # STEP 3 - CHECK RUNNING VMS
    # ============================================================

    - name: Check currently running VMware Workstation VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - list
      register: vmrun_list
      changed_when: false

    - name: Display running VMware Workstation VMs
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CURRENTLY RUNNING VMWARE VMS"
          - "=============================================="
          - "{{ vmrun_list.stdout }}"
          - "=============================================="

    # ============================================================
    # STEP 4 - DETECT RUNNING STATE
    #
    # Suspended VMs normally do not appear in vmrun list.
    # ============================================================

    - name: Set ESXi running state
      ansible.builtin.set_fact:
        esxi_running: "{{ esxi_vmx_running_path in vmrun_list.stdout }}"

    - name: Set vCenter running state
      ansible.builtin.set_fact:
        vcenter_running: "{{ vcenter_vmx_running_path in vmrun_list.stdout }}"

    - name: Display detected VM states
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CURRENT VM STATUS"
          - "=============================================="
          - "ESXi running    : {{ esxi_running }}"
          - "vCenter running : {{ vcenter_running }}"
          - "=============================================="

    # ============================================================
    # POWER ON
    #
    # vmrun start:
    # - Starts a powered-off VM
    # - Resumes a suspended VM
    #
    # Startup order for ALL:
    # ESXi -> Wait -> vCenter
    # ============================================================

    - name: Start or resume ESXi
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - start
          - "{{ esxi_vmx }}"
          - nogui
      register: esxi_start
      changed_when: esxi_start.rc == 0
      when:
        - power_action == 'on'
        - target in ['esxi', 'all']
        - not esxi_running

    - name: Display ESXi started or resumed
      ansible.builtin.debug:
        msg: "ESXi successfully started or resumed."
      when:
        - power_action == 'on'
        - target in ['esxi', 'all']
        - not esxi_running
        - esxi_start is defined
        - esxi_start.rc == 0

    - name: Display ESXi already running
      ansible.builtin.debug:
        msg: "ESXi is already running. Skipping startup."
      when:
        - power_action == 'on'
        - target in ['esxi', 'all']
        - esxi_running

    - name: Wait for ESXi before starting vCenter
      ansible.builtin.pause:
        seconds: 15
      when:
        - power_action == 'on'
        - target == 'all'
        - not esxi_running

    - name: Start or resume vCenter
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - start
          - "{{ vcenter_vmx }}"
          - nogui
      register: vcenter_start
      changed_when: vcenter_start.rc == 0
      when:
        - power_action == 'on'
        - target in ['vcenter', 'all']
        - not vcenter_running

    - name: Display vCenter started or resumed
      ansible.builtin.debug:
        msg: "vCenter successfully started or resumed."
      when:
        - power_action == 'on'
        - target in ['vcenter', 'all']
        - not vcenter_running
        - vcenter_start is defined
        - vcenter_start.rc == 0

    - name: Display vCenter already running
      ansible.builtin.debug:
        msg: "vCenter is already running. Skipping startup."
      when:
        - power_action == 'on'
        - target in ['vcenter', 'all']
        - vcenter_running

    # ============================================================
    # POWER OFF - VCENTER
    #
    # RUNNING:
    #   Soft shutdown
    #
    # NOT RUNNING:
    #   Try vmrun start.
    #
    #   If successful, VM was either suspended or powered off.
    #   We then check vmrun list again.
    #
    #   If it appears as running, it was resumed and we hard stop it.
    #
    #   This safely avoids calling hard stop on a VM that remains off.
    # ============================================================

    - name: Gracefully power OFF running vCenter
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - stop
          - "{{ vcenter_vmx }}"
          - soft
      register: vcenter_soft_stop
      changed_when: vcenter_soft_stop.rc == 0
      failed_when: false
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - vcenter_running

    - name: Display vCenter graceful shutdown result
      ansible.builtin.debug:
        msg: "vCenter graceful shutdown initiated."
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - vcenter_running
        - vcenter_soft_stop.rc == 0

    - name: Attempt to resume non-running vCenter
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - start
          - "{{ vcenter_vmx }}"
          - nogui
      register: vcenter_resume
      changed_when: false
      failed_when: false
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - not vcenter_running

    - name: Wait after vCenter resume attempt
      ansible.builtin.pause:
        seconds: 5
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - not vcenter_running
        - vcenter_resume is defined
        - vcenter_resume.rc == 0

    - name: Check vCenter state after resume attempt
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - list
      register: vmrun_list_after_vcenter_resume
      changed_when: false
      failed_when: false
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - not vcenter_running
        - vcenter_resume is defined
        - vcenter_resume.rc == 0

    - name: Set vCenter resumed state
      ansible.builtin.set_fact:
        vcenter_resumed: >-
          {{ vcenter_vmx_running_path in
             vmrun_list_after_vcenter_resume.stdout }}
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - not vcenter_running
        - vmrun_list_after_vcenter_resume is defined

    - name: Hard power OFF resumed vCenter
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - stop
          - "{{ vcenter_vmx }}"
          - hard
      register: vcenter_hard_stop
      changed_when: vcenter_hard_stop.rc == 0
      failed_when: false
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - not vcenter_running
        - vcenter_resumed | default(false)

    - name: Display suspended vCenter powered off
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "SUSPENDED VCENTER POWERED OFF"
          - "=============================================="
          - "vCenter was resumed."
          - "vCenter was then hard powered off."
          - "=============================================="
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - vcenter_hard_stop is defined
        - vcenter_hard_stop.rc == 0

    - name: Display vCenter already stopped
      ansible.builtin.debug:
        msg: "vCenter is already powered off."
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - not vcenter_running
        - not (vcenter_resumed | default(false))

    # ============================================================
    # WAIT FOR VCENTER SHUTDOWN BEFORE ESXI
    # ============================================================

    - name: Wait before shutting down ESXi
      ansible.builtin.pause:
        seconds: 20
      when:
        - power_action == 'off'
        - target == 'all'
        - vcenter_running

    # ============================================================
    # POWER OFF - ESXI
    #
    # Same logic as vCenter.
    # ============================================================

    - name: Gracefully power OFF running ESXi
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - stop
          - "{{ esxi_vmx }}"
          - soft
      register: esxi_soft_stop
      changed_when: esxi_soft_stop.rc == 0
      failed_when: false
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - esxi_running

    - name: Display ESXi graceful shutdown result
      ansible.builtin.debug:
        msg: "ESXi graceful shutdown initiated."
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - esxi_running
        - esxi_soft_stop.rc == 0

    - name: Attempt to resume non-running ESXi
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - start
          - "{{ esxi_vmx }}"
          - nogui
      register: esxi_resume
      changed_when: false
      failed_when: false
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - not esxi_running

    - name: Wait after ESXi resume attempt
      ansible.builtin.pause:
        seconds: 5
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - not esxi_running
        - esxi_resume is defined
        - esxi_resume.rc == 0

    - name: Check ESXi state after resume attempt
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - list
      register: vmrun_list_after_esxi_resume
      changed_when: false
      failed_when: false
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - not esxi_running
        - esxi_resume is defined
        - esxi_resume.rc == 0

    - name: Set ESXi resumed state
      ansible.builtin.set_fact:
        esxi_resumed: >-
          {{ esxi_vmx_running_path in
             vmrun_list_after_esxi_resume.stdout }}
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - not esxi_running
        - vmrun_list_after_esxi_resume is defined

    - name: Hard power OFF resumed ESXi
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - stop
          - "{{ esxi_vmx }}"
          - hard
      register: esxi_hard_stop
      changed_when: esxi_hard_stop.rc == 0
      failed_when: false
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - not esxi_running
        - esxi_resumed | default(false)

    - name: Display suspended ESXi powered off
      ansible.builtin.debug:
        msg:
          - "ESXi was resumed from suspended state."
          - "ESXi was then hard powered off."
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - esxi_hard_stop is defined
        - esxi_hard_stop.rc == 0

    - name: Display ESXi already stopped
      ansible.builtin.debug:
        msg: "ESXi is already powered off."
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - not esxi_running
        - not (esxi_resumed | default(false))

    # ============================================================
    # FINAL STATUS
    # ============================================================

    - name: Show completion message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "VMWARE LAB OPERATION COMPLETED"
          - "=============================================="
          - "Target : {{ target | upper }}"
          - "Action : {{ power_action | upper }}"
          - "=============================================="
