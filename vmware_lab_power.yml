---
- name: Power ON or OFF VMware Lab VMs
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Path used to execute vmrun from Git Bash / Ansible
    vmrun_path: 'D:/VM workstation/vmrun.exe'

    # VMX paths
    esxi_vmx: 'D:/ESXI/VMware ESXi 7 and later.vmx'
    vcenter_vmx: 'D:/vCenter/vCenter.vmx'

    # Paths exactly as returned by: vmrun -T ws list
    esxi_vmx_running: 'D:\ESXI\VMware ESXi 7 and later.vmx'
    vcenter_vmx_running: 'D:\vCenter\vCenter.vmx'

    target: "{{ target_vm | default('all') }}"
    power_action: "{{ power | default('on') }}"

  tasks:

    - name: Validate target
      ansible.builtin.assert:
        that:
          - target in ['esxi', 'vcenter', 'all']
        fail_msg: "Invalid target '{{ target }}'. Use: esxi, vcenter, or all."

    - name: Validate power action
      ansible.builtin.assert:
        that:
          - power_action in ['on', 'off']
        fail_msg: "Invalid power action '{{ power_action }}'. Use: on or off."

    - name: Check currently running VMware Workstation VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_list
      changed_when: false

    - name: Display running VMs
      ansible.builtin.debug:
        var: vmrun_list.stdout_lines

    - name: Set ESXi running state
      ansible.builtin.set_fact:
        esxi_running: "{{ esxi_vmx_running in vmrun_list.stdout }}"

    - name: Set vCenter running state
      ansible.builtin.set_fact:
        vcenter_running: "{{ vcenter_vmx_running in vmrun_list.stdout }}"

    - name: Display VM states
      ansible.builtin.debug:
        msg:
          - "ESXi running: {{ esxi_running }}"
          - "vCenter running: {{ vcenter_running }}"

    # ============================================================
    # POWER ON / RESUME
    # ============================================================

    - name: Resume ESXi if paused
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "unpause"
          - "{{ esxi_vmx }}"
      register: esxi_unpause
      failed_when: false
      changed_when: esxi_unpause.rc == 0
      when:
        - power_action == 'on'
        - target in ['esxi', 'all']
        - esxi_running

    - name: Power ON ESXi if not running
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ esxi_vmx }}"
          - "nogui"
      when:
        - power_action == 'on'
        - target in ['esxi', 'all']
        - not esxi_running

    - name: Resume vCenter if paused
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "unpause"
          - "{{ vcenter_vmx }}"
      register: vcenter_unpause
      failed_when: false
      changed_when: vcenter_unpause.rc == 0
      when:
        - power_action == 'on'
        - target in ['vcenter', 'all']
        - vcenter_running

    - name: Power ON vCenter if not running
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ vcenter_vmx }}"
          - "nogui"
      when:
        - power_action == 'on'
        - target in ['vcenter', 'all']
        - not vcenter_running

    # ============================================================
    # POWER OFF
    # ============================================================

    - name: Power OFF vCenter gracefully
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vcenter_vmx }}"
          - "soft"
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - vcenter_running

    - name: Power OFF ESXi
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ esxi_vmx }}"
          - "hard"
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - esxi_running

    - name: Show completion message
      ansible.builtin.debug:
        msg: "Requested {{ power_action | upper }} operation completed for {{ target }}."
