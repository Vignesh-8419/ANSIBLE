---
- name: Power ON or OFF VMware Lab VMs
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ============================================================
    # VMWARE WORKSTATION GUI
    #
    # Actual location from your system:
    # D:\VM workstation\vmware.exe
    # ============================================================
    vmware_workstation_path: 'D:/VM workstation/vmware.exe'

    # ============================================================
    # VMWARE WORKSTATION VMRUN
    #
    # Actual location from your system:
    # D:\VM workstation\vmrun.exe
    # ============================================================
    vmrun_path: 'D:/VM workstation/vmrun.exe'

    # ============================================================
    # VMX PATHS
    #
    # Used for vmrun start/stop commands
    # ============================================================
    esxi_vmx: 'D:/ESXI/ESXI-01/ESXI-01.vmx'
    vcenter_vmx: 'D:/vCenter/vCenter.vmx'

    # ============================================================
    # RUNNING VM PATHS
    #
    # These MUST exactly match the output from:
    #
    # "D:/VM workstation/vmrun.exe" -T ws list
    # ============================================================
    esxi_vmx_running_path: 'D:\ESXI\ESXI-01\ESXI-01.vmx'
    vcenter_vmx_running_path: 'D:\vCenter\vCenter.vmx'

    # ============================================================
    # COMMAND LINE VARIABLES
    #
    # Supports both:
    #
    # target_hosts=esxi
    # target_vm=esxi
    #
    # Valid values:
    # esxi
    # vcenter
    # all
    # ============================================================
    target: "{{ target_hosts | default(target_vm | default('all')) | lower }}"

    # Valid values:
    # on
    # off
    power_action: "{{ power | default('on') | lower }}"

  tasks:

    # ============================================================
    # STEP 1 - VALIDATE INPUT FIRST
    # ============================================================

    - name: Validate target
      ansible.builtin.assert:
        that:
          - target in ['esxi', 'vcenter', 'all']
        fail_msg: >-
          Invalid target '{{ target }}'.
          Use: esxi, vcenter, or all.
        success_msg: "Target '{{ target }}' is valid."

    - name: Validate power action
      ansible.builtin.assert:
        that:
          - power_action in ['on', 'off']
        fail_msg: >-
          Invalid power action '{{ power_action }}'.
          Use: on or off.
        success_msg: "Power action '{{ power_action }}' is valid."

    # ============================================================
    # STEP 2 - OPEN VMWARE WORKSTATION
    #
    # cmd.exe /c start is used because Ansible is being run
    # from Git Bash on Windows.
    # ============================================================

    - name: Display VMware Workstation path
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "OPENING VMWARE WORKSTATION"
          - "=============================================="
          - "VMware GUI : {{ vmware_workstation_path }}"
          - "vmrun      : {{ vmrun_path }}"
          - "=============================================="

    - name: Open VMware Workstation GUI
      ansible.builtin.command:
        argv:
          - cmd.exe
          - /c
          - start
          - ""
          - "{{ vmware_workstation_path }}"
      register: vmware_workstation_start
      changed_when: vmware_workstation_start.rc == 0

    - name: Display VMware Workstation launch status
      ansible.builtin.debug:
        msg:
          - "VMware Workstation launch command completed."
          - "Return Code: {{ vmware_workstation_start.rc }}"

    - name: Wait for VMware Workstation to initialize
      ansible.builtin.pause:
        seconds: 10

    # ============================================================
    # STEP 3 - CHECK CURRENTLY RUNNING VMS
    # ============================================================

    - name: Check currently running VMware Workstation VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - list
      register: vmrun_list
      changed_when: false

    - name: Display running VMware Workstation VMs
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CURRENTLY RUNNING VMWARE VMS"
          - "=============================================="
          - "{{ vmrun_list.stdout }}"
          - "=============================================="

    # ============================================================
    # STEP 4 - DETECT ESXI STATUS
    # ============================================================

    - name: Set ESXi running state
      ansible.builtin.set_fact:
        esxi_running: "{{ esxi_vmx_running_path in vmrun_list.stdout }}"

    # ============================================================
    # STEP 5 - DETECT VCENTER STATUS
    # ============================================================

    - name: Set vCenter running state
      ansible.builtin.set_fact:
        vcenter_running: "{{ vcenter_vmx_running_path in vmrun_list.stdout }}"

    - name: Display detected VM states
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CURRENT VM STATUS"
          - "=============================================="
          - "ESXi VMX    : {{ esxi_vmx_running_path }}"
          - "vCenter VMX : {{ vcenter_vmx_running_path }}"
          - "----------------------------------------------"
          - "ESXi running    : {{ esxi_running }}"
          - "vCenter running : {{ vcenter_running }}"
          - "=============================================="

    # ============================================================
    # POWER ON
    #
    # Startup order:
    #
    # 1. VMware Workstation GUI
    # 2. ESXi
    # 3. Wait 15 seconds
    # 4. vCenter
    # ============================================================

    - name: Start or resume ESXi
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - start
          - "{{ esxi_vmx }}"
          - nogui
      register: esxi_start
      changed_when: esxi_start.rc == 0
      when:
        - power_action == 'on'
        - target in ['esxi', 'all']
        - not esxi_running

    - name: Display ESXi started message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "ESXI STARTED SUCCESSFULLY"
          - "=============================================="
          - "VMX: {{ esxi_vmx }}"
          - "=============================================="
      when:
        - power_action == 'on'
        - target in ['esxi', 'all']
        - not esxi_running
        - esxi_start is defined
        - esxi_start.rc == 0

    - name: Display ESXi already running message
      ansible.builtin.debug:
        msg: "ESXi is already running. Skipping startup."
      when:
        - power_action == 'on'
        - target in ['esxi', 'all']
        - esxi_running

    - name: Wait for ESXi startup before starting vCenter
      ansible.builtin.pause:
        seconds: 15
      when:
        - power_action == 'on'
        - target == 'all'
        - not esxi_running

    - name: Start or resume vCenter
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - start
          - "{{ vcenter_vmx }}"
          - nogui
      register: vcenter_start
      changed_when: vcenter_start.rc == 0
      when:
        - power_action == 'on'
        - target in ['vcenter', 'all']
        - not vcenter_running

    - name: Display vCenter started message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "VCENTER STARTED SUCCESSFULLY"
          - "=============================================="
          - "VMX: {{ vcenter_vmx }}"
          - "=============================================="
      when:
        - power_action == 'on'
        - target in ['vcenter', 'all']
        - not vcenter_running
        - vcenter_start is defined
        - vcenter_start.rc == 0

    - name: Display vCenter already running message
      ansible.builtin.debug:
        msg: "vCenter is already running. Skipping startup."
      when:
        - power_action == 'on'
        - target in ['vcenter', 'all']
        - vcenter_running

    # ============================================================
    # POWER OFF
    #
    # Shutdown order:
    #
    # 1. vCenter
    # 2. Wait 20 seconds
    # 3. ESXi
    # ============================================================

    - name: Power OFF vCenter gracefully
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - stop
          - "{{ vcenter_vmx }}"
          - soft
      register: vcenter_stop
      changed_when: vcenter_stop.rc == 0
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - vcenter_running

    - name: Display vCenter shutdown message
      ansible.builtin.debug:
        msg:
          - "vCenter graceful shutdown initiated."
          - "VMX: {{ vcenter_vmx }}"
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - vcenter_running
        - vcenter_stop is defined
        - vcenter_stop.rc == 0

    - name: Display vCenter already stopped message
      ansible.builtin.debug:
        msg: "vCenter is already stopped. Skipping shutdown."
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - not vcenter_running

    - name: Wait for vCenter graceful shutdown
      ansible.builtin.pause:
        seconds: 20
      when:
        - power_action == 'off'
        - target == 'all'
        - vcenter_running

    - name: Power OFF ESXi gracefully
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - stop
          - "{{ esxi_vmx }}"
          - soft
      register: esxi_stop
      changed_when: esxi_stop.rc == 0
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - esxi_running

    - name: Display ESXi shutdown message
      ansible.builtin.debug:
        msg:
          - "ESXi graceful shutdown initiated."
          - "VMX: {{ esxi_vmx }}"
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - esxi_running
        - esxi_stop is defined
        - esxi_stop.rc == 0

    - name: Display ESXi already stopped message
      ansible.builtin.debug:
        msg: "ESXi is already stopped. Skipping shutdown."
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - not esxi_running

    # ============================================================
    # FINAL STATUS
    # ============================================================

    - name: Show completion message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "VMWARE LAB OPERATION COMPLETED"
          - "=============================================="
          - "Target : {{ target | upper }}"
          - "Action : {{ power_action | upper }}"
          - "=============================================="
