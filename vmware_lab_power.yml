---
- name: Power ON or OFF VMware Lab VMs
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # ============================================================
    # VMware Workstation vmrun executable
    # ============================================================
    vmrun_path: 'D:/VM workstation/vmrun.exe'

    # ============================================================
    # VMX file paths
    # Use FORWARD SLASHES consistently
    # ============================================================
    esxi_vmx: 'D:/ESXI/ESXI-01/ESXI-01.vmx'
    vcenter_vmx: 'D:/vCenter/vCenter.vmx'

    # ============================================================
    # Variables passed from command line
    # ============================================================
    target: "{{ target_vm | default('all') | lower }}"
    power_action: "{{ power | default('on') | lower }}"

  tasks:

    # ============================================================
    # VALIDATION
    # ============================================================

    - name: Validate target
      ansible.builtin.assert:
        that:
          - target in ['esxi', 'vcenter', 'all']
        fail_msg: >-
          Invalid target '{{ target }}'.
          Use: esxi, vcenter, or all.

    - name: Validate power action
      ansible.builtin.assert:
        that:
          - power_action in ['on', 'off']
        fail_msg: >-
          Invalid power action '{{ power_action }}'.
          Use: on or off.

    # ============================================================
    # CHECK CURRENTLY RUNNING VMS
    # ============================================================

    - name: Check currently running VMware Workstation VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_list
      changed_when: false

    - name: Display running VMs
      ansible.builtin.debug:
        var: vmrun_list.stdout_lines

    # ============================================================
    # NORMALIZE VM PATHS
    #
    # vmrun on Windows returns paths with \
    # Convert our configured paths from / to \
    # ============================================================

    - name: Normalize ESXi VMX path
      ansible.builtin.set_fact:
        esxi_vmx_normalized: "{{ esxi_vmx | replace('/', '\\') }}"

    - name: Normalize vCenter VMX path
      ansible.builtin.set_fact:
        vcenter_vmx_normalized: "{{ vcenter_vmx | replace('/', '\\') }}"

    - name: Set ESXi running state
      ansible.builtin.set_fact:
        esxi_running: "{{ esxi_vmx_normalized in vmrun_list.stdout }}"

    - name: Set vCenter running state
      ansible.builtin.set_fact:
        vcenter_running: "{{ vcenter_vmx_normalized in vmrun_list.stdout }}"

    - name: Display detected VM states
      ansible.builtin.debug:
        msg:
          - "ESXi VMX configured: {{ esxi_vmx_normalized }}"
          - "vCenter VMX configured: {{ vcenter_vmx_normalized }}"
          - "ESXi running: {{ esxi_running }}"
          - "vCenter running: {{ vcenter_running }}"

    # ============================================================
    # POWER ON / RESUME
    #
    # vmrun start:
    #   Powered OFF -> starts VM
    #   Suspended   -> resumes VM
    #
    # Startup order:
    #   ESXi first
    #   vCenter second
    # ============================================================

    - name: Start or resume ESXi
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ esxi_vmx }}"
          - "nogui"
      register: esxi_start
      changed_when: esxi_start.rc == 0
      when:
        - power_action == 'on'
        - target in ['esxi', 'all']
        - not esxi_running

    - name: Wait after starting ESXi
      ansible.builtin.pause:
        seconds: 10
      when:
        - power_action == 'on'
        - target == 'all'
        - not esxi_running

    - name: Start or resume vCenter
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ vcenter_vmx }}"
          - "nogui"
      register: vcenter_start
      changed_when: vcenter_start.rc == 0
      when:
        - power_action == 'on'
        - target in ['vcenter', 'all']
        - not vcenter_running

    # ============================================================
    # POWER OFF
    #
    # Shutdown order:
    #   vCenter first
    #   ESXi second
    # ============================================================

    - name: Power OFF vCenter gracefully
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ vcenter_vmx }}"
          - "soft"
      register: vcenter_stop
      changed_when: vcenter_stop.rc == 0
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - vcenter_running

    - name: Wait for vCenter shutdown
      ansible.builtin.pause:
        seconds: 15
      when:
        - power_action == 'off'
        - target == 'all'
        - vcenter_running

    - name: Power OFF ESXi
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "stop"
          - "{{ esxi_vmx }}"
          - "soft"
      register: esxi_stop
      changed_when: esxi_stop.rc == 0
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - esxi_running

    # ============================================================
    # COMPLETION
    # ============================================================

    - name: Show completion message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "VMWARE LAB OPERATION COMPLETED"
          - "=============================================="
          - "Target: {{ target | upper }}"
          - "Action: {{ power_action | upper }}"
          - "=============================================="
