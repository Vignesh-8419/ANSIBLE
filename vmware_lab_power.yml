---
- name: Power ON or OFF VMware Lab VMs
  hosts: localhost
  connection: local
  gather_facts: false

  vars:

    # ============================================================
    # VMWARE WORKSTATION GUI
    # ============================================================
    vmware_workstation_path: 'D:/VM workstation/vmware.exe'

    # ============================================================
    # VMWARE WORKSTATION VMRUN
    # ============================================================
    vmrun_path: 'D:/VM workstation/vmrun.exe'

    # ============================================================
    # VMX PATHS
    # ============================================================
    esxi_vmx: 'D:/ESXI/ESXI-01/ESXI-01.vmx'
    vcenter_vmx: 'D:/vCenter/vCenter.vmx'

    # ============================================================
    # RUNNING VM PATHS
    #
    # These must match vmrun -T ws list output.
    # ============================================================
    esxi_vmx_running_path: 'D:\ESXI\ESXI-01\ESXI-01.vmx'
    vcenter_vmx_running_path: 'D:\vCenter\vCenter.vmx'

    # ============================================================
    # COMMAND LINE VARIABLES
    #
    # Supports:
    #
    # target_hosts=esxi
    # target_hosts=vcenter
    # target_hosts=all
    #
    # OR:
    #
    # target_vm=esxi
    # target_vm=vcenter
    # target_vm=all
    #
    # power=on
    # power=off
    # ============================================================
    target: "{{ target_hosts | default(target_vm | default('all')) | lower }}"
    power_action: "{{ power | default('on') | lower }}"

  tasks:

    # ============================================================
    # STEP 1 - VALIDATE INPUT
    # ============================================================

    - name: Validate target
      ansible.builtin.assert:
        that:
          - target in ['esxi', 'vcenter', 'all']
        fail_msg: >-
          Invalid target '{{ target }}'.
          Use: esxi, vcenter, or all.
        success_msg: "Target '{{ target }}' is valid."

    - name: Validate power action
      ansible.builtin.assert:
        that:
          - power_action in ['on', 'off']
        fail_msg: >-
          Invalid power action '{{ power_action }}'.
          Use: on or off.
        success_msg: "Power action '{{ power_action }}' is valid."

    # ============================================================
    # STEP 2 - OPEN VMWARE WORKSTATION
    # ============================================================

    - name: Display VMware Workstation path
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "OPENING VMWARE WORKSTATION"
          - "=============================================="
          - "VMware GUI : {{ vmware_workstation_path }}"
          - "vmrun      : {{ vmrun_path }}"
          - "=============================================="

    - name: Open VMware Workstation GUI
      ansible.builtin.command:
        argv:
          - cmd.exe
          - /c
          - start
          - ""
          - "{{ vmware_workstation_path }}"
      register: vmware_workstation_start
      changed_when: vmware_workstation_start.rc == 0

    - name: Display VMware Workstation launch status
      ansible.builtin.debug:
        msg:
          - "VMware Workstation launch command completed."
          - "Return Code: {{ vmware_workstation_start.rc }}"

    - name: Wait for VMware Workstation to initialize
      ansible.builtin.pause:
        seconds: 10

    # ============================================================
    # STEP 3 - CHECK RUNNING VMS
    #
    # vmrun list detects powered-on/running VMs.
    # Suspended/paused VMs may not appear here.
    # ============================================================

    - name: Check currently running VMware Workstation VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - list
      register: vmrun_list
      changed_when: false

    - name: Display running VMware Workstation VMs
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CURRENTLY RUNNING VMWARE VMS"
          - "=============================================="
          - "{{ vmrun_list.stdout }}"
          - "=============================================="

    # ============================================================
    # STEP 4 - DETECT ESXI STATUS
    # ============================================================

    - name: Set ESXi running state
      ansible.builtin.set_fact:
        esxi_running: "{{ esxi_vmx_running_path in vmrun_list.stdout }}"

    # ============================================================
    # STEP 5 - DETECT VCENTER STATUS
    # ============================================================

    - name: Set vCenter running state
      ansible.builtin.set_fact:
        vcenter_running: "{{ vcenter_vmx_running_path in vmrun_list.stdout }}"

    # ============================================================
    # STEP 6 - DISPLAY DETECTED STATUS
    # ============================================================

    - name: Display detected VM states
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CURRENT VM STATUS"
          - "=============================================="
          - "ESXi VMX    : {{ esxi_vmx_running_path }}"
          - "vCenter VMX : {{ vcenter_vmx_running_path }}"
          - "----------------------------------------------"
          - "ESXi running    : {{ esxi_running }}"
          - "vCenter running : {{ vcenter_running }}"
          - "=============================================="

    # ============================================================
    # POWER ON
    #
    # Startup order:
    #
    # 1. VMware Workstation
    # 2. ESXi
    # 3. Wait 15 seconds
    # 4. vCenter
    #
    # vmrun start also resumes suspended VMs.
    # ============================================================

    - name: Start or resume ESXi
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - start
          - "{{ esxi_vmx }}"
          - nogui
      register: esxi_start
      changed_when: esxi_start.rc == 0
      when:
        - power_action == 'on'
        - target in ['esxi', 'all']
        - not esxi_running

    - name: Display ESXi started or resumed message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "ESXI STARTED OR RESUMED SUCCESSFULLY"
          - "=============================================="
          - "VMX: {{ esxi_vmx }}"
          - "=============================================="
      when:
        - power_action == 'on'
        - target in ['esxi', 'all']
        - not esxi_running
        - esxi_start is defined
        - esxi_start.rc == 0

    - name: Display ESXi already running message
      ansible.builtin.debug:
        msg: "ESXi is already running. Skipping startup."
      when:
        - power_action == 'on'
        - target in ['esxi', 'all']
        - esxi_running

    - name: Wait for ESXi startup before starting vCenter
      ansible.builtin.pause:
        seconds: 15
      when:
        - power_action == 'on'
        - target == 'all'
        - not esxi_running

    - name: Start or resume vCenter
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - start
          - "{{ vcenter_vmx }}"
          - nogui
      register: vcenter_start
      changed_when: vcenter_start.rc == 0
      when:
        - power_action == 'on'
        - target in ['vcenter', 'all']
        - not vcenter_running

    - name: Display vCenter started or resumed message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "VCENTER STARTED OR RESUMED SUCCESSFULLY"
          - "=============================================="
          - "VMX: {{ vcenter_vmx }}"
          - "=============================================="
      when:
        - power_action == 'on'
        - target in ['vcenter', 'all']
        - not vcenter_running
        - vcenter_start is defined
        - vcenter_start.rc == 0

    - name: Display vCenter already running message
      ansible.builtin.debug:
        msg: "vCenter is already running. Skipping startup."
      when:
        - power_action == 'on'
        - target in ['vcenter', 'all']
        - vcenter_running

    # ============================================================
    # POWER OFF - VCENTER
    #
    # If running:
    #   Try graceful shutdown.
    #
    # If not listed:
    #   It may be paused/suspended or already stopped.
    #   Try hard power off.
    #
    # If hard power off succeeds:
    #   VM was paused/suspended and is now powered off.
    #
    # If it fails:
    #   VM is treated as already stopped.
    # ============================================================

    - name: Gracefully power OFF running vCenter
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - stop
          - "{{ vcenter_vmx }}"
          - soft
      register: vcenter_soft_stop
      changed_when: vcenter_soft_stop.rc == 0
      failed_when: false
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - vcenter_running

    - name: Display vCenter graceful shutdown result
      ansible.builtin.debug:
        msg:
          - "vCenter graceful shutdown initiated successfully."
          - "VMX: {{ vcenter_vmx }}"
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - vcenter_running
        - vcenter_soft_stop is defined
        - vcenter_soft_stop.rc == 0

    - name: Wait for vCenter graceful shutdown
      ansible.builtin.pause:
        seconds: 20
      when:
        - power_action == 'off'
        - target == 'all'
        - vcenter_running
        - vcenter_soft_stop is defined
        - vcenter_soft_stop.rc == 0

    - name: Hard power OFF vCenter if paused or suspended
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - stop
          - "{{ vcenter_vmx }}"
          - hard
      register: vcenter_hard_stop
      changed_when: vcenter_hard_stop.rc == 0
      failed_when: false
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - not vcenter_running

    - name: Display vCenter paused or suspended power off message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "VCENTER PAUSED OR SUSPENDED VM POWERED OFF"
          - "=============================================="
          - "VMX: {{ vcenter_vmx }}"
          - "Mode: HARD POWER OFF"
          - "=============================================="
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - not vcenter_running
        - vcenter_hard_stop is defined
        - vcenter_hard_stop.rc == 0

    - name: Display vCenter already stopped message
      ansible.builtin.debug:
        msg:
          - "vCenter is not running."
          - "Hard power-off was not required or VM is already stopped."
      when:
        - power_action == 'off'
        - target in ['vcenter', 'all']
        - not vcenter_running
        - vcenter_hard_stop is defined
        - vcenter_hard_stop.rc != 0

    # ============================================================
    # POWER OFF - ESXI
    #
    # Same logic:
    #
    # Running          -> Graceful shutdown
    # Paused/Suspended -> Hard power off attempt
    # Stopped          -> Skip
    # ============================================================

    - name: Gracefully power OFF running ESXi
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - stop
          - "{{ esxi_vmx }}"
          - soft
      register: esxi_soft_stop
      changed_when: esxi_soft_stop.rc == 0
      failed_when: false
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - esxi_running

    - name: Display ESXi graceful shutdown result
      ansible.builtin.debug:
        msg:
          - "ESXi graceful shutdown initiated successfully."
          - "VMX: {{ esxi_vmx }}"
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - esxi_running
        - esxi_soft_stop is defined
        - esxi_soft_stop.rc == 0

    - name: Hard power OFF ESXi if paused or suspended
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - ws
          - stop
          - "{{ esxi_vmx }}"
          - hard
      register: esxi_hard_stop
      changed_when: esxi_hard_stop.rc == 0
      failed_when: false
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - not esxi_running

    - name: Display ESXi paused or suspended power off message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "ESXI PAUSED OR SUSPENDED VM POWERED OFF"
          - "=============================================="
          - "VMX: {{ esxi_vmx }}"
          - "Mode: HARD POWER OFF"
          - "=============================================="
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - not esxi_running
        - esxi_hard_stop is defined
        - esxi_hard_stop.rc == 0

    - name: Display ESXi already stopped message
      ansible.builtin.debug:
        msg:
          - "ESXi is not running."
          - "Hard power-off was not required or VM is already stopped."
      when:
        - power_action == 'off'
        - target in ['esxi', 'all']
        - not esxi_running
        - esxi_hard_stop is defined
        - esxi_hard_stop.rc != 0

    # ============================================================
    # FINAL STATUS
    # ============================================================

    - name: Show completion message
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "VMWARE LAB OPERATION COMPLETED"
          - "=============================================="
          - "Target : {{ target | upper }}"
          - "Action : {{ power_action | upper }}"
          - "=============================================="
