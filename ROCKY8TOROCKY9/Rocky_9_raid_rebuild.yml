---
- name: Rocky Linux 9 Post Upgrade Cleanup
  hosts: "{{ target_hosts.split(',') | map('trim') | map('regex_replace', '$', '*') | join(',') }}"
  gather_facts: false
  become: true
  serial: 1

  tasks:

    ####################################################################
    # Wait for Host
    ####################################################################

    - name: Wait for SSH
      wait_for_connection:
        timeout: 1800
        sleep: 10

    ####################################################################
    # Ensure Python
    ####################################################################

    - name: Ensure Python 3 exists
      raw: |
        if ! command -v python3 >/dev/null 2>&1; then
          dnf -y install python3
        fi
      changed_when: false

    - meta: reset_connection

    - name: Gather Facts
      setup:

    ####################################################################
    # Detect Software RAID
    ####################################################################

    - name: Check md0
      stat:
        path: /dev/md0
      register: md0_device

    - name: Check md1
      stat:
        path: /dev/md1
      register: md1_device

    - name: Determine RAID
      set_fact:
        software_raid: "{{ md0_device.stat.exists or md1_device.stat.exists }}"

    - debug:
        msg: >-
          {{
            'Software RAID detected. Rebuilding RAID.'
            if software_raid
            else
            'Standalone disk detected. RAID rebuild skipped.'
          }}

    ####################################################################
    # Rebuild RAID
    ####################################################################

    - block:

        - name: Clone partition table
          command: sgdisk -R=/dev/sdb /dev/sda

        - name: Generate new GPT GUID
          command: sgdisk -G /dev/sdb

        - name: Reload partition table
          command: partprobe /dev/sdb

        - name: Wait for partitions
          wait_for:
            path: /dev/sdb3
            timeout: 60

        - name: Add sdb2 back into md0
          command: mdadm --add /dev/md0 /dev/sdb2

        - name: Add sdb3 back into md1
          command: mdadm --add /dev/md1 /dev/sdb3

        - name: Wait for RAID rebuild
          shell: |
            while grep -qE 'recovery|resync' /proc/mdstat; do
              sleep 15
            done
          args:
            executable: /bin/bash

        ################################################################
        # EFI
        ################################################################

        - name: Create FAT32 filesystem
          filesystem:
            fstype: vfat
            dev: /dev/sdb1

        - name: Create EFI mountpoint
          file:
            path: /boot/efi2
            state: directory

        - name: Mount secondary EFI
          mount:
            path: /boot/efi2
            src: /dev/sdb1
            fstype: vfat
            state: mounted

        - name: Synchronize EFI
          command: rsync -aH --delete /boot/efi/ /boot/efi2/

        ################################################################
        # Recreate UEFI Boot Entries
        ################################################################
        
        - name: Get current EFI boot entries
          command: efibootmgr
          register: efi_boot_entries
          changed_when: false
        
        - name: Remove old CentOS and Rocky EFI entries
          shell: |
            for id in $(efibootmgr | \
              awk '/CentOS|Rocky/{print $1}' | \
              sed 's/Boot//;s/*//'); do
              efibootmgr -b "$id" -B
            done
          args:
            executable: /bin/bash
        
        - name: Remove old CentOS EFI directories
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /boot/efi/EFI/centos
            - /boot/efi2/EFI/centos
          ignore_errors: yes
        
        - name: Create Rocky RAID1 Disk 1 EFI entry
          command:
            argv:
              - efibootmgr
              - -c
              - -d
              - /dev/sda
              - -p
              - "1"
              - -L
              - "Rocky RAID1 Disk 1"
              - -l
              - '\EFI\rocky\shimx64.efi'
        
        - name: Create Rocky RAID1 Disk 2 EFI entry
          command:
            argv:
              - efibootmgr
              - -c
              - -d
              - /dev/sdb
              - -p
              - "1"
              - -L
              - "Rocky RAID1 Disk 2"
              - -l
              - '\EFI\rocky\shimx64.efi'
        
        - name: Get new EFI boot entries
          command: efibootmgr
          register: new_efi_entries
          changed_when: false
        
        - name: Extract Rocky boot numbers
          set_fact:
            rocky_boot_order: >-
              {{
                new_efi_entries.stdout_lines
                | select('search','Rocky RAID1 Disk')
                | map('regex_replace','Boot([0-9A-F]{4}).*','\\1')
                | list
              }}
        
        - name: Set Rocky boot order
          command:
            argv:
              - efibootmgr
              - -o
              - "{{ rocky_boot_order | join(',') }}"
          when: rocky_boot_order | length >= 2
        
        - name: Verify EFI boot entries
          command: efibootmgr -v
          register: final_efi
          changed_when: false
        
        - debug:
            var: final_efi.stdout_lines

        ################################################################
        # Save RAID Configuration
        ################################################################

        - name: Save mdadm configuration
          shell: |
            mdadm --detail --scan | tee /etc/mdadm.conf >/dev/null

        - name: Verify mdadm configuration
          command: cat /etc/mdadm.conf
          register: mdadm_conf
          changed_when: false

        - debug:
            var: mdadm_conf.stdout_lines

        - name: Rebuild initramfs
          command: dracut -f

        - name: Regenerate GRUB configuration
          command: grub2-mkconfig -o /boot/grub2/grub.cfg

        - name: Verify RAID
          shell: cat /proc/mdstat
          register: raid_status
          changed_when: false

        - debug:
            var: raid_status.stdout_lines

        - name: Flush filesystem buffers
          command: sync

        - name: Remove temporary /boot/efi fstab entry
          lineinfile:
            path: /etc/fstab
            regexp: '^[^#].*\s+/boot/efi\s+vfat\s+'
            state: absent

        - name: Verify fstab
          command: cat /etc/fstab
          register: fstab_verify
          changed_when: false

        - debug:
            var: fstab_verify.stdout_lines

        - name: Unmount secondary EFI
          mount:
            path: /boot/efi2
            state: unmounted
      when: software_raid

    ####################################################################
    # Final Verification
    ####################################################################

    - name: Show Operating System
      command: cat /etc/os-release
      register: os_release
      changed_when: false

    - debug:
        var: os_release.stdout_lines

    - name: Show Kernel
      command: uname -r
      register: kernel_version
      changed_when: false

    - debug:
        var: kernel_version.stdout

    - name: Show Block Devices
      command: lsblk
      register: lsblk_output
      changed_when: false

    - debug:
        var: lsblk_output.stdout_lines

    - name: Show EFI Entries
      command: efibootmgr -v
      register: efiboot
      changed_when: false

    - debug:
        var: efiboot.stdout_lines

    - name: Migration Complete
      debug:
        msg:
          - "Rocky Linux 9 migration completed successfully."
          - "RAID Status : {{ 'Healthy' if software_raid else 'Not Applicable' }}"
          - "Kernel      : {{ kernel_version.stdout }}"
          - "OS          : {{ ansible_distribution }} {{ ansible_distribution_version }}"
