---
- name: Rocky Linux 8 to Rocky Linux 9 - ELevate Migration
  hosts: "{{ target_hosts.split(',') | map('trim') | map('regex_replace', '$', '*') | join(',') }}"
  gather_facts: false
  become: true
  become_method: sudo
  become_user: root
  serial: 1

  vars:

    repo_server: "http://192.168.253.136"

    target_version: "{{ target_os | default('9') }}"

    rocky9_repo: >-
      {{
        'rocky9.2'
        if target_version == '9.2'
        else 'rocky9'
      }}

    elevate_repo_url: >-
      {{
        repo_server +
        '/repo/leapp/' +
        ('9.2' if target_version == '9.2' else '9') +
        '/el8toel9'
      }}

    rocky8_baseos: "{{ repo_server }}/repo/rocky8/BaseOS"
    rocky8_appstream: "{{ repo_server }}/repo/rocky8/AppStream"

    rocky9_baseos: "{{ repo_server }}/repo/{{ rocky9_repo }}/BaseOS"
    rocky9_appstream: "{{ repo_server }}/repo/{{ rocky9_repo }}/AppStream"

    elevate_repo_file: /etc/yum.repos.d/el8toel9.repo
    leapp_repo_file: /etc/leapp/files/leapp_upgrade_repositories.repo

  ####################################################################
  # Bootstrap
  ####################################################################

  pre_tasks:

    - name: Ensure Python 3 is installed
      raw: |
        if ! command -v python3 >/dev/null 2>&1; then
          dnf -y install python3
        fi
      changed_when: false

    - meta: reset_connection

    - name: Gather facts
      setup:

    ####################################################################
    # Validate Source Operating System
    ####################################################################

    - name: Fail if operating system is not Rocky Linux
      fail:
        msg: This playbook supports only Rocky Linux.
      when: ansible_distribution != "Rocky"

    - name: End play if already Rocky Linux 9
      meta: end_play
      when:
        - ansible_distribution == "Rocky"
        - ansible_distribution_major_version == "9"

    - name: Fail if source version is not Rocky Linux 8
      fail:
        msg: Only Rocky Linux 8.x systems can be upgraded.
      when: ansible_distribution_major_version != "8"

    ####################################################################
    # Repository Connectivity
    ####################################################################

    - name: Verify ELevate repository
      uri:
        url: "{{ elevate_repo_url }}"
        method: HEAD
        status_code:
          - 200
          - 301
          - 302
      register: repo_check
      retries: 5
      delay: 5
      until: repo_check.status in [200,301,302]

    - name: Display repository status
      debug:
        msg: Repository server is reachable.

  ####################################################################
  # Tasks
  ####################################################################

  tasks:

    ####################################################################
    # Configure Repositories
    ####################################################################

    - name: Backup existing repositories
      shell: |
        mkdir -p /etc/yum.repos.d/backup
        find /etc/yum.repos.d -maxdepth 1 -name "*.repo" \
          -exec mv {} /etc/yum.repos.d/backup/ \;
      args:
        executable: /bin/bash

    - name: Configure Rocky Linux 8 repositories
      copy:
        dest: "{{ elevate_repo_file }}"
        mode: "0644"
        content: |
          [el8toel9]
          name=ELevate Repository
          baseurl={{ elevate_repo_url }}
          enabled=1
          gpgcheck=0

          [rocky8-baseos]
          name=Rocky Linux 8 BaseOS
          baseurl={{ rocky8_baseos }}
          enabled=1
          gpgcheck=0

          [rocky8-appstream]
          name=Rocky Linux 8 AppStream
          baseurl={{ rocky8_appstream }}
          enabled=1
          gpgcheck=0

    ####################################################################
    # Refresh DNF
    ####################################################################

    - name: Remove DNF cache
      file:
        path: /var/cache/dnf
        state: absent

    - name: Clean DNF metadata
      command: dnf clean all

    - name: Rebuild DNF metadata
      command: dnf makecache

    ####################################################################
    # Remove DNF Excludes
    ####################################################################

    - name: Remove DNF exclude entries
      lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: '^exclude='
        state: absent

    - name: Clean DNF metadata again
      command: dnf clean all

    - name: Remove DNF cache again
      file:
        path: /var/cache/dnf
        state: absent

    - name: Rebuild DNF cache
      command: dnf makecache

    ####################################################################
    # Install ELevate Packages
    ####################################################################

    - name: Install ELevate packages
      dnf:
        name:
          - leapp
          - python3-leapp
          - leapp-deps
          - snactor
          - leapp-data-rocky
          - leapp-upgrade-el8toel9
          - leapp-upgrade-el8toel9-deps
        state: present

    - name: Verify installed packages
      shell: |
        rpm -qa | egrep '^(leapp|python3-leapp|snactor)' | sort
      register: leapp_packages
      changed_when: false

    - debug:
        var: leapp_packages.stdout_lines

    ####################################################################
    # Verify Leapp
    ####################################################################

    - name: Verify leapp version
      command: leapp --version
      register: leapp_version
      changed_when: false

    - debug:
        var: leapp_version.stdout_lines

    ####################################################################
    # Configure Leapp Repository
    ####################################################################

    - name: Ensure Leapp files directory exists
      file:
        path: /etc/leapp/files
        state: directory
        mode: "0755"

    - name: Configure Rocky Linux 9 repository mapping
      copy:
        dest: "{{ leapp_repo_file }}"
        mode: "0644"
        content: |
          [rocky9-baseos]
          name=Rocky Linux 9 BaseOS
          baseurl={{ rocky9_baseos }}
          enabled=1
          gpgcheck=0

          [rocky9-appstream]
          name=Rocky Linux 9 AppStream
          baseurl={{ rocky9_appstream }}
          enabled=1
          gpgcheck=0

    ####################################################################
    # Validate Repositories
    ####################################################################

    - name: Verify Rocky 9 BaseOS repository
      uri:
        url: "{{ rocky9_baseos }}/repodata/repomd.xml"
        method: HEAD
        status_code: 200

    - name: Verify Rocky 9 AppStream repository
      uri:
        url: "{{ rocky9_appstream }}/repodata/repomd.xml"
        method: HEAD
        status_code: 200

    - name: Verify ELevate repository metadata
      uri:
        url: "{{ elevate_repo_url }}/repodata/repomd.xml"
        method: HEAD
        status_code: 200

    ####################################################################
    # Remove Previous Leapp Data
    ####################################################################

    - name: Remove previous Leapp logs
      file:
        path: /var/log/leapp
        state: absent

    - name: Remove previous Leapp cache
      file:
        path: /var/lib/leapp
        state: absent

    - name: Create Leapp log directory
      file:
        path: /var/log/leapp
        state: directory
        mode: "0755"

    ####################################################################
    # Prepare System
    ####################################################################

    - name: Set SELinux to permissive
      command: setenforce 0
      when:
        - ansible_selinux is defined
        - ansible_selinux.status == "enabled"
      ignore_errors: yes

    - name: Disable root SSH login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: PermitRootLogin no
        backup: yes

    - name: Restart SSH
      service:
        name: sshd
        state: restarted

    ####################################################################
    # Remove Loaded Kernel Modules
    ####################################################################

    - name: Remove floppy module
      shell: |
        lsmod | grep -q '^floppy' && modprobe -r floppy || true
      changed_when: false

    - name: Remove pata_acpi module
      shell: |
        lsmod | grep -q '^pata_acpi' && modprobe -r pata_acpi || true
      changed_when: false

    ####################################################################
    # Generate Initial Answerfile
    ####################################################################

    - name: Check for EL7 packages
      shell: rpm -qa | grep '\.el7' || true
      register: el7_packages
      changed_when: false

    - name: Fail if EL7 packages exist
      fail:
        msg: |
          EL7 packages detected:

          {{ el7_packages.stdout }}

          Remove these packages before running ELevate.
      when: el7_packages.stdout != ""

    - name: Run initial Leapp preupgrade
      command: leapp preupgrade
      register: preupgrade_initial
      failed_when: false
      changed_when: true

    - name: Display initial preupgrade output
      debug:
        var: preupgrade_initial.stdout_lines

    - name: Verify answerfile exists
      stat:
        path: /var/log/leapp/answerfile
      register: answerfile

    - name: Fail if initial preupgrade failed unexpectedly
      fail:
        msg: |
          Initial Leapp preupgrade failed.

          stdout:
          {{ preupgrade_initial.stdout }}

          stderr:
          {{ preupgrade_initial.stderr }}
      when:
        - preupgrade_initial.rc != 0
        - not answerfile.stat.exists

    - name: Fail when answerfile is missing
      fail:
        msg: "Leapp answerfile was not generated."
      when: not answerfile.stat.exists

    ####################################################################
    # Answer Leapp Questions
    ####################################################################

    - name: Answer authselect question
      command: >
        leapp answer
        --section authselect_check.confirm=True
      failed_when: false

    - name: Answer pam_pkcs11 question
      command: >
        leapp answer
        --section remove_pam_pkcs11_module_check.confirm=True
      failed_when: false

    ####################################################################
    # Firewalld Fix
    ####################################################################

    - name: Ensure AllowZoneDrifting is disabled
      lineinfile:
        path: /etc/firewalld/firewalld.conf
        regexp: '^#?AllowZoneDrifting='
        line: 'AllowZoneDrifting=no'
        insertafter: EOF
        create: yes
        backup: yes
      ignore_errors: yes

    - name: Reload firewalld if running
      shell: |
        if systemctl is-active --quiet firewalld; then
          firewall-cmd --reload
        fi
      changed_when: false
      ignore_errors: yes

    ####################################################################
    # Final Preupgrade
    ####################################################################

    - name: Run final Leapp preupgrade
      command: leapp preupgrade
      register: preupgrade
      changed_when: true

    - name: Read Leapp report
      slurp:
        src: /var/log/leapp/leapp-report.txt
      register: leapp_report

    - name: Save report text
      set_fact:
        leapp_report_text: "{{ leapp_report.content | b64decode }}"

    ####################################################################
    # Validate Leapp Report
    ####################################################################
    
    - name: Check for Leapp inhibitors
      shell: |
        grep -q "Risk Factor: high (inhibitor)" /var/log/leapp/leapp-report.txt
      register: leapp_inhibitors
      changed_when: false
      failed_when: false
    
    - name: Stop migration if Leapp report contains inhibitors
      fail:
        msg: |
          Leapp preupgrade report contains inhibitors.
          Resolve them before continuing with RAID preparation.
    
          Report:
            /var/log/leapp/leapp-report.txt
      when:
        - preupgrade.rc != 0
          or leapp_inhibitors.rc == 0

    ####################################################################
    # Detect Software RAID
    ####################################################################

    - name: Check if md0 exists
      stat:
        path: /dev/md0
      register: md0_device

    - name: Check if md1 exists
      stat:
        path: /dev/md1
      register: md1_device

    - name: Determine if software RAID is present
      set_fact:
        software_raid: "{{ md0_device.stat.exists or md1_device.stat.exists }}"

    - name: Display RAID detection
      debug:
        msg: >-
          {{
            'Software RAID detected. Applying temporary RAID workaround.'
            if software_raid
            else
            'Software RAID not detected. Continuing normally.'
          }}

    ####################################################################
    # RAID Workaround (Only for RAID Systems)
    ####################################################################

    - block:

        - name: Create secondary EFI mount point
          file:
            path: /boot/efi2
            state: directory

        - name: Unmount secondary EFI
          mount:
            path: /boot/efi2
            state: unmounted
          ignore_errors: yes

        - name: Remove sdb2 from md0
          shell: |
            if mdadm --detail /dev/md0 | grep -q "/dev/sdb2"; then
              mdadm /dev/md0 --fail /dev/sdb2
              mdadm /dev/md0 --remove /dev/sdb2
            fi
          args:
            executable: /bin/bash

        - name: Remove sdb3 from md1
          shell: |
            if mdadm --detail /dev/md1 | grep -q "/dev/sdb3"; then
              mdadm /dev/md1 --fail /dev/sdb3
              mdadm /dev/md1 --remove /dev/sdb3
            fi
          args:
            executable: /bin/bash

        - name: Zero RAID superblocks
          shell: |
            mdadm --zero-superblock /dev/sdb1 || true
            mdadm --zero-superblock /dev/sdb2 || true
            mdadm --zero-superblock /dev/sdb3 || true
          args:
            executable: /bin/bash

        - name: Wipe secondary disk
          shell: |
            sgdisk --zap-all /dev/sdb || true
            wipefs -a -f /dev/sdb || true
            partprobe /dev/sdb || true
          args:
            executable: /bin/bash

        - name: Display RAID status
          shell: cat /proc/mdstat
          register: mdstat_before_upgrade
          changed_when: false

        - debug:
            var: mdstat_before_upgrade.stdout_lines

      when: software_raid

    ####################################################################
    # Verify Primary EFI Before Leapp Upgrade
    ####################################################################

    - name: Create EFI mount points
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /boot/efi
        - /mnt/efi2

    - name: Unmount existing EFI mount
      mount:
        path: /boot/efi
        state: unmounted
      ignore_errors: yes

    - name: Ensure only one EFI mount exists
      shell: |
        while mountpoint -q /boot/efi; do
          umount /boot/efi
        done
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Mount primary EFI
      mount:
        path: /boot/efi
        src: /dev/sda1
        fstype: vfat
        state: mounted

    - name: Verify primary EFI mount
      command: findmnt /boot/efi
      register: efi_mount
      changed_when: false

    - debug:
        var: efi_mount.stdout_lines

    - name: Check if primary EFI grub.cfg exists
      stat:
        path: /boot/efi/EFI/rocky/grub.cfg
      register: primary_grub

    - block:

        - name: Unmount primary EFI
          mount:
            path: /boot/efi
            state: unmounted

        - name: Format primary EFI
          filesystem:
            dev: /dev/sda1
            fstype: vfat

        - name: Mount primary EFI
          mount:
            path: /boot/efi
            src: /dev/sda1
            fstype: vfat
            state: mounted

        - name: Mount secondary EFI
          mount:
            path: /mnt/efi2
            src: /dev/sdb1
            fstype: vfat
            state: mounted

        - name: Restore EFI
          command: rsync -aH /mnt/efi2/ /boot/efi/

        - name: Sync disks
          command: sync

        - name: Unmount secondary EFI
          mount:
            path: /mnt/efi2
            state: unmounted

      when:
        - software_raid
        - not primary_grub.stat.exists

    - name: Get UUID of sda1
      command: blkid -s UUID -o value /dev/sda1
      register: efi_uuid
      changed_when: false

    - name: Ensure /boot/efi exists in fstab
      mount:
        path: /boot/efi
        src: "UUID={{ efi_uuid.stdout }}"
        fstype: vfat
        opts: "umask=0077,shortname=winnt"
        state: mounted

    - name: Mount EFI temporarily
      mount:
        path: /boot/efi
        src: "UUID={{ efi_uuid.stdout }}"
        fstype: vfat
        opts: "umask=0077,shortname=winnt"
        state: ephemeral

    - name: Verify grub.cfg
      stat:
        path: /boot/efi/EFI/rocky/grub.cfg
      register: grub_cfg

    - name: Fail if grub.cfg is missing
      fail:
        msg: "Primary EFI partition is missing /EFI/rocky/grub.cfg"
      when: not grub_cfg.stat.exists

    - name: Verify grubby
      command: grubby --info=ALL
      changed_when: false

    - name: Verify default kernel
      command: grubby --default-kernel
      changed_when: false
    ####################################################################
    # Prepare Final Upgrade
    ####################################################################

    - name: Check if rocky-logos is installed
      shell: rpm -q rocky-logos
      register: rocky_logos
      failed_when: false
      changed_when: false

    - name: Remove Rocky 8 logos package
      command: rpm -e --nodeps rocky-logos
      when: rocky_logos.rc == 0

    - name: Verify rocky-logos removal
      shell: rpm -q rocky-logos
      register: rocky_logos_removed
      failed_when: false
      changed_when: false

    - name: Display rocky-logos status
      debug:
        msg: >-
          {{
            'rocky-logos removed successfully.'
            if rocky_logos_removed.rc != 0
            else
            'rocky-logos is still installed.'
          }}

    - name: Disable network naming scheme check
      lineinfile:
        path: /etc/environment
        regexp: '^LEAPP_DISABLE_NET_NAMING_SCHEMES='
        line: 'LEAPP_DISABLE_NET_NAMING_SCHEMES=1'
        create: yes

    - name: Export LEAPP_DISABLE_NET_NAMING_SCHEMES
      shell: export LEAPP_DISABLE_NET_NAMING_SCHEMES=1
      changed_when: false

    ####################################################################
    # Execute Upgrade
    ####################################################################

    - name: Run Leapp upgrade
      command: leapp upgrade
      register: leapp_upgrade
      changed_when: true
      failed_when: leapp_upgrade.rc != 0

    - name: Display Leapp upgrade output
      debug:
        var: leapp_upgrade.stdout_lines

    ####################################################################
    # Verify Upgrade Kernel
    ####################################################################

    - name: Verify upgrade initramfs exists
      stat:
        path: "/boot/initramfs-{{ ansible_kernel }}.img"
      register: initramfs_check

    - name: Fail if upgrade initramfs is missing
      fail:
        msg: "Upgrade initramfs was not generated."
      when: not initramfs_check.stat.exists

    - name: Display default kernel
      command: grubby --default-kernel
      changed_when: false

    ####################################################################
    # Reboot into Upgrade Environment
    ####################################################################

    - name: Pause before reboot
      pause:
        seconds: 5

    - name: Reboot to start Rocky Linux 9 migration
      reboot:
        msg: "Starting Rocky Linux 9 ELevate migration"
        connect_timeout: 5
        reboot_timeout: 7200
        pre_reboot_delay: 10
        post_reboot_delay: 0

    ####################################################################
    # End Current Play
    ####################################################################

    - name: Display reboot message
      debug:
        msg:
          - "The system has rebooted into the Leapp upgrade environment."
          - "Leapp will perform the migration automatically."
          - "The host will reboot again when the migration completes."
          - "Post-upgrade tasks will continue after the system returns."

    - meta: end_play
