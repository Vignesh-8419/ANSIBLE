#==============================================================================
# Rocky Linux 9.2 Enterprise Golden Image
# UEFI + GPT + Single Disk (No RAID / No LVM)
#==============================================================================

text
cdrom

lang en_US.UTF-8
keyboard us
timezone Asia/Kolkata --isUtc
rootpw --plaintext Root@123

network --bootproto=dhcp --device=link --activate
firewall --enabled --service=ssh
selinux --enforcing
services --enabled="NetworkManager,sshd,chronyd"
reboot

###############################################################################
# PRE-INSTALL DISK CLEANUP
###############################################################################

%pre --interpreter=/bin/bash

# Deactivate any existing LVM volume groups
vgchange -an 2>/dev/null || true

# Stop any existing software RAID arrays
mdadm --stop --scan 2>/dev/null || true

# Remove old RAID / LVM / filesystem signatures from the installation disk
wipefs -a /dev/sda 2>/dev/null || true

# Remove old GPT/MBR partition information
sgdisk --zap-all /dev/sda 2>/dev/null || true

# Ask kernel to reread the partition table
partprobe /dev/sda 2>/dev/null || true

%end

###############################################################################
# STORAGE
###############################################################################

ignoredisk --only-use=sda

zerombr

clearpart --all --initlabel --drives=sda

bootloader --boot-drive=sda --append="crashkernel=auto"

###############################################################################
# EFI
###############################################################################

part /boot/efi --fstype="efi" --size=600 --ondisk=sda

###############################################################################
# /boot
###############################################################################

part /boot --fstype="xfs" --size=1024 --ondisk=sda

###############################################################################
# LVM PV
###############################################################################

part pv.01 --fstype="lvmpv" --size=1 --grow --ondisk=sda

###############################################################################
# VOLUME GROUP
###############################################################################

volgroup vg_system pv.01

###############################################################################
# LOGICAL VOLUMES
###############################################################################

logvol /var/log --fstype="xfs" --vgname="vg_system" --name="lv_var_log" --size=4096

logvol /var --fstype="xfs" --vgname="vg_system" --name="lv_var" --size=8192

logvol swap --fstype="swap" --vgname="vg_system" --name="lv_swap" --size=4096

logvol / --fstype="xfs" --vgname="vg_system" --name="lv_root" --size=10240 --grow

%packages
@^server
dosfstools
xfsprogs
grub2-efi-x64
grub2-tools
shim-x64
efibootmgr
open-vm-tools
vim
nano
wget
curl
bash-completion
net-tools
lsof
perl
tcpdump
rsync
tar
unzip
zip
gdisk
%end

%post --interpreter=/usr/bin/bash --log=/root/anaconda-post.log --erroronfail

exec >/root/anaconda-post.log 2>&1
set -euxo pipefail

if ! id admin >/dev/null 2>&1; then
    useradd -m -s /bin/bash admin
fi

echo 'admin:Vigneshv12$' | chpasswd
usermod -aG wheel admin

cat >/etc/sudoers.d/admin <<EOF
admin ALL=(ALL) NOPASSWD: ALL
EOF
chmod 0440 /etc/sudoers.d/admin

cat >/etc/motd <<EOF
==================================================
 Rocky Linux 9.2 Enterprise Golden Image
 UEFI + GPT + Single Disk
==================================================
EOF

echo
echo "======================================================"
echo "Rocky Linux 9.2 Golden Image Build Completed Successfully"
echo "======================================================"

%end
