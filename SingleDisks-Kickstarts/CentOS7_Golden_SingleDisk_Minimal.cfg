#==============================================================================
# CentOS 7 Enterprise Golden Image
# UEFI + GPT + Single Disk (No RAID / No LVM)
#==============================================================================

text
cdrom

lang en_US.UTF-8
keyboard us
timezone Asia/Kolkata --isUtc
rootpw --plaintext Root@123

network --bootproto=dhcp --device=link --activate

firewall --enabled --service=ssh
selinux --enforcing
services --enabled="NetworkManager,sshd,chronyd"
reboot

###############################################################################
# PRE-INSTALL STORAGE CLEANUP
###############################################################################

%pre --interpreter=/bin/bash

echo "=============================================================="
echo "Cleaning existing RAID / LVM / filesystem metadata"
echo "=============================================================="

###############################################################################
# Deactivate any existing LVM
###############################################################################

vgchange -an 2>/dev/null || true

###############################################################################
# Stop any existing RAID arrays
###############################################################################

mdadm --stop --scan 2>/dev/null || true

###############################################################################
# Clean sda
###############################################################################

if [ -b /dev/sda ]; then
    echo "Cleaning /dev/sda"

    wipefs -a /dev/sda 2>/dev/null || true
    sgdisk --zap-all /dev/sda 2>/dev/null || true
    partprobe /dev/sda 2>/dev/null || true
fi

###############################################################################
# Clean sdb
#
# sdb is NOT used by the Kickstart installation.
# It is cleaned only to remove old RAID metadata so mdadm
# cannot automatically assemble the old RAID arrays.
###############################################################################

if [ -b /dev/sdb ]; then
    echo "Cleaning /dev/sdb"

    wipefs -a /dev/sdb 2>/dev/null || true
    sgdisk --zap-all /dev/sdb 2>/dev/null || true
    partprobe /dev/sdb 2>/dev/null || true
fi

###############################################################################
# Final RAID check
###############################################################################

echo "=============================================================="
echo "RAID status after cleanup:"
echo "=============================================================="

cat /proc/mdstat || true

echo "=============================================================="
echo "Storage cleanup completed"
echo "=============================================================="

%end

###############################################################################
# STORAGE
###############################################################################

ignoredisk --only-use=sda

zerombr

clearpart --all --initlabel --drives=sda

bootloader --boot-drive=sda --append="crashkernel=auto"

part /boot/efi --fstype="efi" --size=600 --ondisk=sda

part /boot --fstype="xfs" --size=1024 --ondisk=sda

part pv.01 --fstype="lvmpv" --size=1 --grow --ondisk=sda

volgroup vg_system pv.01

logvol /var/log --fstype="xfs" --vgname="vg_system" --name="lv_var_log" --size=20480

logvol /var --fstype="xfs" --vgname="vg_system" --name="lv_var" --size=20480

logvol swap --fstype="swap" --vgname="vg_system" --name="lv_swap" --size=4096

logvol / --fstype="xfs" --vgname="vg_system" --name="lv_root" --size=10240 --grow

%packages
@^infrastructure-server-environment
grub2
grub2-common
grub2-efi-x64
grub2-tools
grub2-tools-extra
grub2-tools-minimal
shim-x64
efibootmgr
dosfstools
xfsprogs
open-vm-tools
vim
nano
wget
curl
net-tools
gdisk
rsync
%end

%post --interpreter=/usr/bin/bash --log=/root/anaconda-post.log --erroronfail

set -euo pipefail

if ! id admin >/dev/null 2>&1; then
    useradd -m -s /bin/bash admin
fi

echo 'admin:Vigneshv12$' | chpasswd
usermod -aG wheel admin

cat >/etc/sudoers.d/admin <<EOF
admin ALL=(ALL) NOPASSWD: ALL
EOF
chmod 0440 /etc/sudoers.d/admin

cat >/etc/yum.repos.d/base.repo <<EOF
[base]
name=base-repo
baseurl=http://http-server-01/repo/centos/
enabled=1
gpgcheck=0
EOF

sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config || true
sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config || true
sed -i 's/^#\?UseDNS.*/UseDNS no/' /etc/ssh/sshd_config || true

cat >/etc/sysctl.d/99-golden.conf <<EOF
vm.swappiness=10
net.ipv4.ip_forward=0
kernel.sysrq=0
EOF

sysctl --system

cat >/etc/motd <<EOF
==================================================
 CentOS 7 Enterprise Golden Image
 UEFI + GPT + Single Disk
==================================================
EOF

echo
echo "======================================================"
echo "CentOS 7 Golden Image Build Completed Successfully"
echo "======================================================"

%end
