---
- name: Power ON vCenter from VMware Workstation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vmrun_path: 'D:/VM workstation/vmrun.exe'
    vcenter_vmx: 'D:/vCenter/vCenter.vmx'

  tasks:

    - name: Check currently running VMware Workstation VMs
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "list"
      register: vmrun_list
      changed_when: false

    - name: Display currently running VMs
      ansible.builtin.debug:
        var: vmrun_list.stdout_lines

    - name: Power ON vCenter VM if not already running
      ansible.builtin.command:
        argv:
          - "{{ vmrun_path }}"
          - "-T"
          - "ws"
          - "start"
          - "{{ vcenter_vmx }}"
          - "nogui"
      when: vcenter_vmx not in vmrun_list.stdout
      register: poweron_result

    - name: vCenter already running
      ansible.builtin.debug:
        msg: "vCenter VM is already powered ON."
      when: vcenter_vmx in vmrun_list.stdout

    - name: vCenter power ON completed
      ansible.builtin.debug:
        msg: "vCenter VM has been successfully powered ON from VMware Workstation."
      when: vcenter_vmx not in vmrun_list.stdout
