---
- name: Install AWX on Rocky/RHEL 8 + K3s
  hosts: Linux
  become: true
  become_method: sudo
  become_user: root
  gather_facts: true

  vars:

    # ============================================================
    # 1. VARIABLES
    # ============================================================

    awx_namespace: "awx"

    operator_version: "2.19.1"

    vip: "192.168.253.145"

    admin_password: "Root@123"

    kube_rbac_proxy_image: "quay.io/brancz/kube-rbac-proxy:v0.18.0"

    # ============================================================
    # PATHS
    # ============================================================

    awx_operator_dir: "/root/awx-operator"
    awx_ee_dir: "/root/awx-ee-vmware"

    k3s_binary_path: "/usr/local/bin/k3s"
    kubectl_path: "/usr/local/bin/kubectl"

    kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"
    root_kubeconfig_path: "/root/.kube/config"

    registry_dir: "/opt/registry"

    podman_registry_conf: "/etc/containers/registries.conf.d/localhost.conf"
    k3s_registry_conf: "/etc/rancher/k3s/registries.yaml"

    awx_instance_manifest: "/root/awx-operator/awx-instance.yaml"
    awx_ingress_manifest: "/root/awx-operator/awx-ingress.yaml"

    # ============================================================
    # VMWARE EXECUTION ENVIRONMENT
    # ============================================================

    ee_image: "localhost:5000/awx-ee-vmware:24.6.1"

    # ============================================================
    # K3S
    # ============================================================

    k3s_ready_timeout: "300s"

    # ============================================================
    # RETRIES / DELAYS
    # ============================================================

    metrics_ready_retries: 120
    metrics_ready_delay: 5

    awx_deployment_retries: 60
    awx_deployment_delay: 10

    migration_retries: 120
    migration_delay: 5

    awx_pod_retries: 120
    awx_pod_delay: 5

    awx_service_retries: 60
    awx_service_delay: 5

    awx_ingress_retries: 60
    awx_ingress_delay: 5

    awx_ui_retries: 120
    awx_ui_delay: 10

    task_pod_retries: 120
    task_pod_delay: 5

    # ============================================================
    # REBOOT
    # ============================================================

    reboot_timeout: 1800
    reboot_connect_timeout: 30
    post_reboot_delay: 20

  # ============================================================
  # GLOBAL ENVIRONMENT
  #
  # Important:
  # make deploy internally calls kubectl.
  # ============================================================

  environment:
    PATH: "/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin"
    KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

  tasks:

    # ============================================================
    # 1. VARIABLES
    # ============================================================

    - name: Display variables
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "# 1. Variables"
          - "============================================================"
          - "Starting AWX installation on K3s"
          - "Namespace            : {{ awx_namespace }}"
          - "Operator Version     : {{ operator_version }}"
          - "VIP                  : {{ vip }}"
          - "Interface            : {{ ansible_default_ipv4.interface | default('UNKNOWN') }}"
          - "kube-rbac-proxy      : {{ kube_rbac_proxy_image }}"
          - "K3s                  : {{ k3s_binary_path }}"
          - "kubectl              : {{ kubectl_path }}"
          - "Kubeconfig           : {{ kubeconfig_path }}"
          - "============================================================"

    # ============================================================
    # PRE-FLIGHT - CGROUP V2
    #
    # NO EFI STEPS.
    #
    # If already enabled:
    #   continue
    #
    # If disabled:
    #   update kernel args
    #   reboot
    #   verify again
    #
    # If still disabled:
    #   FAIL
    # ============================================================

    - name: Check current cgroup filesystem
      ansible.builtin.command:
        cmd: stat -fc %T /sys/fs/cgroup
      register: cgroup_fs_before
      changed_when: false

    - name: Display initial cgroup status
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "CGROUP V2 PRE-FLIGHT"
          - "============================================================"
          - >-
            {{
              'cgroup v2 is already active.'
              if (cgroup_fs_before.stdout | trim == 'cgroup2fs')
              else
              'cgroup v2 is not enabled.'
            }}
          - "Filesystem Type: {{ cgroup_fs_before.stdout | trim }}"
          - "============================================================"

    - name: Update kernel arguments for cgroup v2
      ansible.builtin.command:
        cmd: >-
          grubby --update-kernel=ALL
          --args="systemd.unified_cgroup_hierarchy=1 systemd.legacy_systemd_cgroup_controller=false"
      when:
        - cgroup_fs_before.stdout | trim != "cgroup2fs"

    - name: Display kernel update message
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "CGROUP V2 KERNEL CONFIGURATION"
          - "============================================================"
          - "Kernel arguments updated."
          - "Server will now reboot."
          - "============================================================"
      when:
        - cgroup_fs_before.stdout | trim != "cgroup2fs"

    - name: Reboot server to activate cgroup v2
      ansible.builtin.reboot:
        msg: "Rebooting ansible-server-01 to activate cgroup v2"
        reboot_timeout: "{{ reboot_timeout }}"
        connect_timeout: "{{ reboot_connect_timeout }}"
        pre_reboot_delay: 5
        post_reboot_delay: "{{ post_reboot_delay }}"
        test_command: "stat -fc %T /sys/fs/cgroup"
      when:
        - cgroup_fs_before.stdout | trim != "cgroup2fs"

    - name: Check cgroup filesystem after reboot
      ansible.builtin.command:
        cmd: stat -fc %T /sys/fs/cgroup
      register: cgroup_fs_after
      changed_when: false
      when:
        - cgroup_fs_before.stdout | trim != "cgroup2fs"

    - name: Display post-reboot cgroup status
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "CGROUP V2 POST-REBOOT CHECK"
          - "============================================================"
          - "Filesystem Type: {{ cgroup_fs_after.stdout | default('UNKNOWN') | trim }}"
          - >-
            {{
              'cgroup v2 is enabled.'
              if (
                cgroup_fs_after.stdout | default('')
                | trim == 'cgroup2fs'
              )
              else
              'cgroup v2 is STILL NOT enabled.'
            }}
          - "============================================================"
      when:
        - cgroup_fs_before.stdout | trim != "cgroup2fs"

    - name: Stop if cgroup v2 is still disabled
      ansible.builtin.fail:
        msg: |
          ============================================================
          CGROUP V2 WAS NOT ENABLED AFTER REBOOT
          ============================================================

          Current filesystem type:
          {{ cgroup_fs_after.stdout | default('UNKNOWN') | trim }}

          AWX/K3s installation will NOT continue.

          ============================================================
      when:
        - cgroup_fs_before.stdout | trim != "cgroup2fs"
        - cgroup_fs_after.stdout | default('') | trim != "cgroup2fs"

    - name: Confirm cgroup v2 is active
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "CGROUP V2 READY"
          - "============================================================"
          - "cgroup v2 is active."
          - "Continuing with AWX installation."
          - "============================================================"

    # ============================================================
    # 2. INSTALL PREREQUISITES
    # ============================================================

    - name: Display section 2
      ansible.builtin.debug:
        msg:
          - "# 2. Install prerequisites"
          - "Installing prerequisites..."

    - name: Install prerequisites
      ansible.builtin.dnf:
        name:
          - git
          - make
          - curl
          - wget
          - tar
          - gzip
          - gettext
          - net-tools
          - container-selinux
          - selinux-policy-base
        state: present

    - name: Install K3s SELinux package
      ansible.builtin.dnf:
        name: "https://rpm.rancher.io/k3s/stable/common/centos/8/noarch/k3s-selinux-1.5-1.el8.noarch.rpm"
        state: present
        disable_gpg_check: true
      register: k3s_selinux_install
      failed_when: false

    - name: Display prerequisites result
      ansible.builtin.debug:
        msg: "Installed essential packages and SELinux policies for K3s and AWX."

    # ============================================================
    # 3. SELINUX / FIREWALL
    # ============================================================

    - name: Display section 3
      ansible.builtin.debug:
        msg:
          - "# 3. SELinux / Firewall"
          - "Setting SELinux to permissive..."
          - "Disabling firewalld..."

    - name: Set SELinux permissive
      ansible.builtin.command:
        cmd: setenforce 0
      failed_when: false
      changed_when: false

    - name: Set SELinux permissive permanently
      ansible.builtin.replace:
        path: /etc/selinux/config
        regexp: '^SELINUX=.*$'
        replace: "SELINUX=permissive"
      failed_when: false

    - name: Stop firewalld
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
      failed_when: false

    - name: Disable firewalld
      ansible.builtin.systemd:
        name: firewalld
        enabled: false
      failed_when: false

    - name: Display SELinux firewall result
      ansible.builtin.debug:
        msg: "Set SELinux to permissive and disabled firewalld."

    # ============================================================
    # 4. VERIFY AWX HOST IP
    #
    # 192.168.253.145 is the actual server IP.
    # ============================================================

    - name: Display section 4
      ansible.builtin.debug:
        msg:
          - "# 4. Verify AWX Host IP"
          - "Expected IP : {{ vip }}"
          - "Interface   : {{ ansible_default_ipv4.interface }}"

    - name: Check AWX server IP
      ansible.builtin.shell: |
        ip -4 addr show "{{ ansible_default_ipv4.interface }}" |
        grep -q "{{ vip }}/"
      args:
        executable: /bin/bash
      register: vip_present
      changed_when: false
      failed_when: false

    - name: Fail if server IP is incorrect
      ansible.builtin.fail:
        msg: |
          ============================================================
          AWX SERVER IP VALIDATION FAILED
          ============================================================

          Expected:
          {{ vip }}

          Interface:
          {{ ansible_default_ipv4.interface }}

          Current primary IP:
          {{ ansible_default_ipv4.address }}

          ============================================================
      when:
        - vip_present.rc != 0

    - name: Display IP validation result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AWX SERVER IP READY"
          - "============================================================"
          - "IP        : {{ vip }}"
          - "Interface : {{ ansible_default_ipv4.interface }}"
          - "============================================================"

    # ============================================================
    # 5. INSTALL K3S
    # ============================================================

    - name: Display section 5
      ansible.builtin.debug:
        msg:
          - "# 5. Install K3s"
          - "Installing/checking K3s..."

    - name: Check K3s binary
      ansible.builtin.stat:
        path: "{{ k3s_binary_path }}"
      register: k3s_binary

    - name: Install K3s
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -s - --write-kubeconfig-mode 644
      args:
        executable: /bin/bash
      when:
        - not k3s_binary.stat.exists

    - name: Verify K3s binary after installation
      ansible.builtin.stat:
        path: "{{ k3s_binary_path }}"
      register: k3s_binary_after

    - name: Fail if K3s binary is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          K3S INSTALLATION FAILED
          ============================================================

          K3s binary was not found:

          {{ k3s_binary_path }}

          ============================================================
      when:
        - not k3s_binary_after.stat.exists

    - name: Link kubectl to K3s
      ansible.builtin.file:
        src: "{{ k3s_binary_path }}"
        dest: "{{ kubectl_path }}"
        state: link
        force: true

    - name: Configure K3s environment
      ansible.builtin.copy:
        dest: /etc/profile.d/k3s.sh
        mode: "0644"
        content: |
          export PATH=$PATH:/usr/local/bin
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

    - name: Ensure K3s service is started and enabled
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true

    - name: Verify K3s kubectl client
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - version
          - --client=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: k3s_kubectl_client
      changed_when: false

    - name: Verify standalone kubectl path
      ansible.builtin.command:
        argv:
          - "{{ kubectl_path }}"
          - version
          - --client=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: kubectl_client
      changed_when: false

    - name: Wait for K3s node to become Ready
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - wait
          - --for=condition=Ready
          - node
          - --all
          - "--timeout={{ k3s_ready_timeout }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: k3s_ready
      changed_when: false

    - name: Create root kube directory
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: "0700"

    - name: Copy K3s kubeconfig
      ansible.builtin.copy:
        src: "{{ kubeconfig_path }}"
        dest: "{{ root_kubeconfig_path }}"
        remote_src: true
        mode: "0600"

    - name: Get K3s nodes
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - nodes
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: k3s_nodes
      changed_when: false

    - name: Display K3s nodes
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "K3s is READY"
          - "============================================================"
          - "{{ k3s_nodes.stdout }}"
          - "============================================================"

    # ============================================================
    # 5a. LOCAL CONTAINER REGISTRY
    # ============================================================

    - name: Display section 5a
      ansible.builtin.debug:
        msg:
          - "# 5a. Create Local Container Registry"

    - name: Create registry directory
      ansible.builtin.file:
        path: "{{ registry_dir }}"
        state: directory
        mode: "0755"

    - name: Get existing Podman containers
      ansible.builtin.command:
        argv:
          - podman
          - ps
          - -a
          - --format
          - "{{ '{{.Names}}' }}"
      register: podman_containers
      failed_when: false
      changed_when: false

    - name: Create registry container
      ansible.builtin.command:
        argv:
          - podman
          - run
          - -d
          - --name
          - registry
          - --restart=always
          - -p
          - "5000:5000"
          - -v
          - "/opt/registry:/var/lib/registry:z"
          - docker.io/library/registry:2
      when:
        - "'registry' not in podman_containers.stdout_lines"

    - name: Start existing registry container
      ansible.builtin.command:
        cmd: podman start registry
      register: registry_start
      failed_when: false
      changed_when: false
      when:
        - "'registry' in podman_containers.stdout_lines"

    - name: Create Podman registry configuration directory
      ansible.builtin.file:
        path: /etc/containers/registries.conf.d
        state: directory
        mode: "0755"

    - name: Configure Podman localhost registry
      ansible.builtin.copy:
        dest: "{{ podman_registry_conf }}"
        mode: "0644"
        content: |
          [[registry]]
          location="localhost:5000"
          insecure=true

    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Configure K3s localhost registry
      ansible.builtin.copy:
        dest: "{{ k3s_registry_conf }}"
        mode: "0644"
        content: |
          mirrors:
            "localhost:5000":
              endpoint:
                - "http://localhost:5000"

    - name: Restart K3s after registry configuration
      ansible.builtin.systemd:
        name: k3s
        state: restarted

    - name: Wait for K3s node after registry restart
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - wait
          - --for=condition=Ready
          - node
          - --all
          - "--timeout={{ k3s_ready_timeout }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: k3s_ready_registry
      changed_when: false

    - name: Verify local registry
      ansible.builtin.uri:
        url: "http://localhost:5000/v2/"
        method: GET
        status_code: 200
      register: registry_check

    - name: Display registry result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "LOCAL REGISTRY READY"
          - "============================================================"
          - "Registry : http://localhost:5000"
          - "K3s      : Ready"
          - "============================================================"

    # ============================================================
    # 6. INSTALL KUSTOMIZE
    # ============================================================

    - name: Display section 6
      ansible.builtin.debug:
        msg:
          - "# 6. Install Kustomize"

    - name: Check Kustomize
      ansible.builtin.command:
        cmd: /usr/bin/which kustomize
      register: kustomize_binary
      failed_when: false
      changed_when: false

    - name: Install Kustomize
      ansible.builtin.shell: |
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        mv kustomize /usr/local/bin/
      args:
        executable: /bin/bash
        chdir: /tmp
      when:
        - kustomize_binary.rc != 0

    - name: Display Kustomize result
      ansible.builtin.debug:
        msg: "Kustomize installed."

    # ============================================================
    # 7. PATCH METRICS SERVER
    # ============================================================

    - name: Display section 7
      ansible.builtin.debug:
        msg:
          - "# 7. Patch Metrics Server"
          - "Waiting for metrics-server deployment..."

    - name: Wait for metrics-server deployment
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - deployment
          - metrics-server
          - -n
          - kube-system
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: metrics_server_deployment
      retries: "{{ metrics_ready_retries }}"
      delay: "{{ metrics_ready_delay }}"
      until:
        - metrics_server_deployment.rc == 0
      changed_when: false

    - name: Get metrics-server deployment YAML
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - deployment
          - metrics-server
          - -n
          - kube-system
          - -o
          - yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: metrics_server_yaml
      changed_when: false

    - name: Determine metrics-server TLS configuration
      ansible.builtin.set_fact:
        metrics_tls_enabled: >-
          {{
            '--kubelet-insecure-tls'
            in
            metrics_server_yaml.stdout
          }}

    - name: Display metrics-server TLS status
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "METRICS-SERVER TLS STATUS"
          - "============================================================"
          - "kubelet-insecure-tls : {{ metrics_tls_enabled }}"
          - "============================================================"

    - name: Patch metrics-server with kubelet insecure TLS
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - patch
          - deployment
          - metrics-server
          - -n
          - kube-system
          - --type=json
          - -p
          - '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      when:
        - not metrics_tls_enabled

    - name: Wait for metrics-server rollout
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - rollout
          - status
          - deployment/metrics-server
          - -n
          - kube-system
          - --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Display metrics-server result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "METRICS-SERVER READY"
          - "============================================================"
          - "kubelet-insecure-tls configured."
          - "metrics-server rollout completed."
          - "============================================================"

    # ============================================================
    # 8. CLEANUP OLD AWX RESOURCES
    # ============================================================

    - name: Display section 8
      ansible.builtin.debug:
        msg:
          - "# 8. Cleanup old AWX resources"
          - "Cleaning old AWX resources..."

    - name: Check AWX namespace
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - namespace
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_namespace_check
      failed_when: false
      changed_when: false

    - name: Create AWX namespace
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - create
          - namespace
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      when:
        - awx_namespace_check.rc != 0

    - name: Delete old AWX custom resource
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - delete
          - awx
          - awx-server
          - -n
          - "{{ awx_namespace }}"
          - --ignore-not-found=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      failed_when: false
      changed_when: false

    - name: Delete old AWX ingress
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - delete
          - ingress
          - awx-ingress
          - -n
          - "{{ awx_namespace }}"
          - --ignore-not-found=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      failed_when: false
      changed_when: false

    - name: Delete old AWX operator deployment
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - delete
          - deployment
          - awx-operator-controller-manager
          - -n
          - "{{ awx_namespace }}"
          - --ignore-not-found=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      failed_when: false
      changed_when: false

    - name: Delete old ReplicaSets
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - delete
          - rs
          - --all
          - -n
          - "{{ awx_namespace }}"
          - --ignore-not-found=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      failed_when: false
      changed_when: false

    - name: Delete old Pods
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - delete
          - pods
          - --all
          - -n
          - "{{ awx_namespace }}"
          - --ignore-not-found=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      failed_when: false
      changed_when: false

    - name: Display cleanup result
      ansible.builtin.debug:
        msg: "Old AWX resources cleaned."

    # ============================================================
    # 9. VERIFY KUBE-RBAC-PROXY IMAGE
    # ============================================================

    - name: Display section 9
      ansible.builtin.debug:
        msg:
          - "# 9. Verify kube-rbac-proxy image"
          - "Image: {{ kube_rbac_proxy_image }}"

    - name: Verify K3s CRI tool
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - crictl
          - --version
      register: k3s_crictl_version
      changed_when: false

    - name: Display K3s CRI version
      ansible.builtin.debug:
        msg:
          - "K3s CRI tool:"
          - "{{ k3s_crictl_version.stdout | default(k3s_crictl_version.stderr) }}"

    - name: Pull kube-rbac-proxy image through K3s CRI
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - crictl
          - pull
          - "{{ kube_rbac_proxy_image }}"
      register: kube_rbac_proxy_pull

    - name: Display kube-rbac-proxy pull result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "KUBE-RBAC-PROXY IMAGE READY"
          - "============================================================"
          - "Image       : {{ kube_rbac_proxy_image }}"
          - "CRI command : {{ k3s_binary_path }} crictl"
          - "{{ kube_rbac_proxy_pull.stdout }}"
          - "============================================================"

    # ============================================================
    # 10. DOWNLOAD AWX OPERATOR
    # ============================================================

    - name: Display section 10
      ansible.builtin.debug:
        msg:
          - "# 10. Download AWX Operator source"
          - "Downloading AWX Operator..."

    - name: Remove existing AWX Operator directory
      ansible.builtin.file:
        path: "{{ awx_operator_dir }}"
        state: absent

    - name: Clone AWX Operator
      ansible.builtin.git:
        repo: "https://github.com/ansible/awx-operator.git"
        dest: "{{ awx_operator_dir }}"
        version: "{{ operator_version }}"
        force: true

    - name: Display Operator source result
      ansible.builtin.debug:
        msg: "AWX Operator {{ operator_version }} downloaded."

    # ============================================================
    # 11. FIX KUBE-RBAC-PROXY IMAGE
    # ============================================================

    - name: Display section 11
      ansible.builtin.debug:
        msg:
          - "# 11. Fix kube-rbac-proxy image"

    - name: Set kube-rbac-proxy image for gcr.io
      ansible.builtin.command:
        argv:
          - kustomize
          - edit
          - set
          - image
          - "gcr.io/kubebuilder/kube-rbac-proxy={{ kube_rbac_proxy_image }}"
      args:
        chdir: "{{ awx_operator_dir }}/config/default"
      failed_when: false

    - name: Set kube-rbac-proxy image for registry.k8s.io
      ansible.builtin.command:
        argv:
          - kustomize
          - edit
          - set
          - image
          - "registry.k8s.io/kube-rbac-proxy={{ kube_rbac_proxy_image }}"
      args:
        chdir: "{{ awx_operator_dir }}/config/default"
      failed_when: false

    - name: Display image patch result
      ansible.builtin.debug:
        msg: "AWX Operator kube-rbac-proxy image updated."

    # ============================================================
    # 12. CREATE AWX ADMIN PASSWORD SECRET
    # ============================================================

    - name: Display section 12
      ansible.builtin.debug:
        msg:
          - "# 12. Create AWX admin password secret"

    - name: Create AWX admin password secret
      ansible.builtin.shell: |
        {{ k3s_binary_path }} kubectl \
          create secret generic awx-server-admin-password \
          --from-literal=password="{{ admin_password }}" \
          -n "{{ awx_namespace }}" \
          --dry-run=client \
          -o yaml |
        {{ k3s_binary_path }} kubectl apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Display secret result
      ansible.builtin.debug:
        msg: "AWX admin password secret created."

    # ============================================================
    # BUILD VMWARE EXECUTION ENVIRONMENT
    # ============================================================

    - name: Create VMware EE directory
      ansible.builtin.file:
        path: "{{ awx_ee_dir }}"
        state: directory
        mode: "0755"

    - name: Create VMware EE Containerfile
      ansible.builtin.copy:
        dest: "{{ awx_ee_dir }}/Containerfile"
        mode: "0644"
        content: |
          FROM quay.io/ansible/awx-ee:24.6.1

          USER root

          RUN dnf install -y python3-pip && \
              pip3 install --no-cache-dir \
                  requests \
                  pyvmomi && \
              ansible-galaxy collection install \
                  community.vmware \
                  vmware.vmware && \
              dnf clean all

          USER 1000

    - name: Build VMware Execution Environment
      ansible.builtin.command:
        argv:
          - podman
          - build
          - -t
          - awx-ee-vmware:24.6.1
          - .
      args:
        chdir: "{{ awx_ee_dir }}"

    - name: Tag VMware Execution Environment
      ansible.builtin.command:
        argv:
          - podman
          - tag
          - localhost/awx-ee-vmware:24.6.1
          - localhost:5000/awx-ee-vmware:24.6.1

    - name: Push VMware Execution Environment
      ansible.builtin.command:
        argv:
          - podman
          - push
          - --tls-verify=false
          - localhost:5000/awx-ee-vmware:24.6.1

    - name: Pull VMware Execution Environment with K3s CRI
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - crictl
          - pull
          - localhost:5000/awx-ee-vmware:24.6.1

    # ============================================================
    # VERIFY OPERATOR SOURCE
    # ============================================================

    - name: Check AWX Operator Makefile
      ansible.builtin.stat:
        path: "{{ awx_operator_dir }}/Makefile"
      register: operator_makefile

    - name: Fail if AWX Operator Makefile is missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          AWX OPERATOR SOURCE NOT FOUND
          ============================================================

          {{ awx_operator_dir }}

          ============================================================
      when:
        - not operator_makefile.stat.exists

    # ============================================================
    # 13. DEPLOY AWX OPERATOR
    # ============================================================

    - name: Display section 13
      ansible.builtin.debug:
        msg:
          - "# 13. Deploy AWX Operator"
          - "Deploying AWX Operator..."

    - name: Verify kubectl is visible to Ansible
      ansible.builtin.command:
        cmd: which kubectl
      register: kubectl_location
      changed_when: false

    - name: Display kubectl location
      ansible.builtin.debug:
        msg:
          - "kubectl found at:"
          - "{{ kubectl_location.stdout }}"

    - name: Verify kubectl can reach K3s
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: kubectl_nodes_before_operator
      changed_when: false

    - name: Display kubectl connectivity
      ansible.builtin.debug:
        msg:
          - "Kubernetes API is reachable."
          - "{{ kubectl_nodes_before_operator.stdout }}"

    - name: Deploy AWX Operator
      ansible.builtin.command:
        argv:
          - make
          - deploy
          - "NAMESPACE={{ awx_namespace }}"
      args:
        chdir: "{{ awx_operator_dir }}"
      environment:
        PATH: "/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin"
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Set kube-rbac-proxy image on Operator deployment
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - -n
          - "{{ awx_namespace }}"
          - set
          - image
          - deployment/awx-operator-controller-manager
          - "kube-rbac-proxy={{ kube_rbac_proxy_image }}"
      environment:
        PATH: "/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin"
        KUBECONFIG: "{{ kubeconfig_path }}"
      failed_when: false

    - name: Wait for AWX Operator rollout
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - rollout
          - status
          - deployment/awx-operator-controller-manager
          - -n
          - "{{ awx_namespace }}"
          - --timeout=300s
      environment:
        PATH: "/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin"
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Display Operator result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AWX OPERATOR READY"
          - "============================================================"
          - "Operator Version : {{ operator_version }}"
          - "Namespace        : {{ awx_namespace }}"
          - "kubectl          : {{ kubectl_location.stdout }}"
          - "============================================================"

    # ============================================================
    # 14. CREATE AWX INSTANCE
    # ============================================================

    - name: Display section 14
      ansible.builtin.debug:
        msg:
          - "# 14. Create AWX instance"
          - "Creating AWX instance..."

    - name: Create AWX instance manifest
      ansible.builtin.copy:
        dest: "{{ awx_instance_manifest }}"
        mode: "0644"
        content: |
          apiVersion: awx.ansible.com/v1beta1
          kind: AWX
          metadata:
            name: awx-server
            namespace: {{ awx_namespace }}
          spec:
            service_type: ClusterIP
            admin_password_secret: awx-server-admin-password
            postgres_storage_class: local-path

    - name: Apply AWX instance manifest
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - apply
          - -f
          - "{{ awx_instance_manifest }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # ============================================================
    # WAIT FOR AWX CR
    # ============================================================

    - name: Wait for AWX custom resource
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - awx
          - awx-server
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_cr
      retries: "{{ awx_deployment_retries }}"
      delay: "{{ awx_deployment_delay }}"
      until:
        - awx_cr.rc == 0
      changed_when: false

    - name: Display AWX CR result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AWX CUSTOM RESOURCE CREATED"
          - "============================================================"
          - "{{ awx_cr.stdout }}"
          - "============================================================"

    # ============================================================
    # 14a. WAIT FOR MIGRATION
    # ============================================================

    - name: Display section 14a
      ansible.builtin.debug:
        msg:
          - "# 14a. Wait for AWX Migration"
          - "Waiting for migration job..."

    - name: Wait for AWX migration job
      ansible.builtin.shell: |
        {{ k3s_binary_path }} kubectl \
          get jobs \
          -n "{{ awx_namespace }}" \
          --no-headers 2>/dev/null |
        grep -q "awx-server-migration"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: migration_job_exists
      retries: "{{ migration_retries }}"
      delay: "{{ migration_delay }}"
      until:
        - migration_job_exists.rc == 0
      changed_when: false

    - name: Get migration job name
      ansible.builtin.shell: |
        {{ k3s_binary_path }} kubectl \
          get jobs \
          -n "{{ awx_namespace }}" \
          -o name |
        grep "awx-server-migration" |
        head -1
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: migration_job
      changed_when: false

    - name: Display migration job
      ansible.builtin.debug:
        msg:
          - "Migration job found:"
          - "{{ migration_job.stdout | trim }}"

    - name: Stream migration logs
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - logs
          - -f
          - -n
          - "{{ awx_namespace }}"
          - "{{ migration_job.stdout | trim }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Wait for migration completion
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - wait
          - --for=condition=complete
          - "{{ migration_job.stdout | trim }}"
          - -n
          - "{{ awx_namespace }}"
          - --timeout=60m
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Display migration result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AWX MIGRATION COMPLETE"
          - "============================================================"
          - "Migration job: {{ migration_job.stdout | trim }}"
          - "============================================================"

    # ============================================================
    # 15. CREATE INGRESS
    # ============================================================

    - name: Display section 15
      ansible.builtin.debug:
        msg:
          - "# 15. Create Ingress"
          - "Creating AWX Ingress..."

    - name: Check AWX service before creating Ingress
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - service
          - awx-server-service
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_service_check
      retries: "{{ awx_service_retries }}"
      delay: "{{ awx_service_delay }}"
      until:
        - awx_service_check.rc == 0
      changed_when: false

    - name: Display AWX service
      ansible.builtin.debug:
        msg:
          - "AWX service exists:"
          - "{{ awx_service_check.stdout }}"

    - name: Wait for AWX service endpoints
      ansible.builtin.shell: |
        ENDPOINTS=$(
          {{ k3s_binary_path }} kubectl \
            get endpoints awx-server-service \
            -n "{{ awx_namespace }}" \
            -o jsonpath='{.subsets[*].addresses[*].ip}' \
            2>/dev/null
        )

        test -n "$ENDPOINTS"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_service_endpoints
      retries: "{{ awx_service_retries }}"
      delay: "{{ awx_service_delay }}"
      until:
        - awx_service_endpoints.rc == 0
      changed_when: false

    - name: Display AWX endpoint addresses
      ansible.builtin.shell: |
        {{ k3s_binary_path }} kubectl \
          get endpoints awx-server-service \
          -n "{{ awx_namespace }}"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_endpoints_display
      changed_when: false

    - name: Create AWX Ingress manifest
      ansible.builtin.copy:
        dest: "{{ awx_ingress_manifest }}"
        mode: "0644"
        content: |
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: awx-ingress
            namespace: {{ awx_namespace }}
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
          spec:
            ingressClassName: traefik
            rules:
            - http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: awx-server-service
                      port:
                        number: 80

    - name: Apply AWX Ingress
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - apply
          - -f
          - "{{ awx_ingress_manifest }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Patch AWX Ingress entrypoints
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - patch
          - ingress
          - awx-ingress
          - -n
          - "{{ awx_namespace }}"
          - --type=merge
          - '-p={"metadata":{"annotations":{"traefik.ingress.kubernetes.io/router.entrypoints":"web,websecure"}}}'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      failed_when: false

    - name: Wait for AWX Ingress to exist
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - ingress
          - awx-ingress
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_ingress_check
      retries: "{{ awx_ingress_retries }}"
      delay: "{{ awx_ingress_delay }}"
      until:
        - awx_ingress_check.rc == 0
      changed_when: false

    - name: Display AWX Ingress
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AWX INGRESS CREATED"
          - "============================================================"
          - "{{ awx_ingress_check.stdout }}"
          - "============================================================"

    # ============================================================
    # TRAEFIK VALIDATION
    # ============================================================

    - name: Check Traefik pods
      ansible.builtin.shell: |
        {{ k3s_binary_path }} kubectl \
          get pods \
          -n kube-system \
          --no-headers 2>/dev/null |
        grep -i traefik
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: traefik_pods
      failed_when: false
      changed_when: false

    - name: Display Traefik pods
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "TRAEFIK"
          - "============================================================"
          - "{{ traefik_pods.stdout | default('Traefik pod not found') }}"
          - "============================================================"

    - name: Check Traefik service
      ansible.builtin.shell: |
        {{ k3s_binary_path }} kubectl \
          get svc \
          -n kube-system \
          --no-headers 2>/dev/null |
        grep -i traefik
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: traefik_service
      failed_when: false
      changed_when: false

    - name: Display Traefik service
      ansible.builtin.debug:
        msg:
          - "Traefik service:"
          - "{{ traefik_service.stdout | default('Traefik service not found') }}"

    # ============================================================
    # 16. WAIT FOR ACTUAL AWX DEPLOYMENTS
    #
    # IMPORTANT:
    #
    # There is no deployment named awx-server.
    #
    # The actual deployments are:
    #
    #   awx-server-task
    #   awx-server-web
    # ============================================================

    - name: Display section 16
      ansible.builtin.debug:
        msg:
          - "# 16. Wait for AWX"
          - "Waiting for AWX Task and Web deployments..."

    - name: Wait for AWX Task deployment
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - deployment
          - awx-server-task
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_task_deployment
      retries: "{{ awx_deployment_retries }}"
      delay: "{{ awx_deployment_delay }}"
      until:
        - awx_task_deployment.rc == 0
      changed_when: false

    - name: Wait for AWX Web deployment
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - deployment
          - awx-server-web
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_web_deployment
      retries: "{{ awx_deployment_retries }}"
      delay: "{{ awx_deployment_delay }}"
      until:
        - awx_web_deployment.rc == 0
      changed_when: false

    - name: Display AWX deployment objects
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AWX DEPLOYMENTS CREATED"
          - "============================================================"
          - "{{ awx_task_deployment.stdout }}"
          - "{{ awx_web_deployment.stdout }}"
          - "============================================================"

    # ============================================================
    # WAIT FOR ACTUAL ROLLOUT
    # ============================================================

    - name: Wait for AWX Task rollout
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - rollout
          - status
          - deployment/awx-server-task
          - -n
          - "{{ awx_namespace }}"
          - --timeout=30m
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Wait for AWX Web rollout
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - rollout
          - status
          - deployment/awx-server-web
          - -n
          - "{{ awx_namespace }}"
          - --timeout=30m
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # ============================================================
    # WAIT FOR TASK POD
    # ============================================================

    - name: Wait for AWX Task pod
      ansible.builtin.shell: |
        {{ k3s_binary_path }} kubectl \
          get pods \
          -n "{{ awx_namespace }}" \
          -l app.kubernetes.io/name=awx-server-task \
          --field-selector=status.phase=Running \
          --no-headers 2>/dev/null |
        grep -q awx-server-task
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_task_pod
      retries: "{{ awx_pod_retries }}"
      delay: "{{ awx_pod_delay }}"
      until:
        - awx_task_pod.rc == 0
      changed_when: false

    # ============================================================
    # WAIT FOR WEB POD
    # ============================================================

    - name: Wait for AWX Web pod
      ansible.builtin.shell: |
        {{ k3s_binary_path }} kubectl \
          get pods \
          -n "{{ awx_namespace }}" \
          -l app.kubernetes.io/name=awx-server-web \
          --field-selector=status.phase=Running \
          --no-headers 2>/dev/null |
        grep -q awx-server-web
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_web_pod
      retries: "{{ awx_pod_retries }}"
      delay: "{{ awx_pod_delay }}"
      until:
        - awx_web_pod.rc == 0
      changed_when: false

    # ============================================================
    # FINAL AWX POD STATUS
    # ============================================================

    - name: Get final AWX pod status
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - pods
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_pods
      changed_when: false

    - name: Display AWX pod status
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AWX POD STATUS"
          - "============================================================"
          - "{{ awx_pods.stdout }}"
          - "============================================================"

    # ============================================================
    # 17. WAIT FOR AWX UI / HTTP
    #
    # Do not require the body to contain the text "awx".
    #
    # HTTP 200/301/302/404 all prove that the HTTP listener
    # responded. We separately verify the Ingress and service.
    # ============================================================

    - name: Display section 17
      ansible.builtin.debug:
        msg:
          - "# 17. Wait for AWX UI"
          - "Waiting for HTTP listener..."

    - name: Wait for HTTP port 80
      ansible.builtin.wait_for:
        host: "{{ vip }}"
        port: 80
        state: started
        timeout: 60

    - name: Test AWX HTTP endpoint
      ansible.builtin.uri:
        url: "http://{{ vip }}/"
        method: GET
        return_content: true
        status_code:
          - 200
          - 301
          - 302
          - 404
      register: awx_http_test
      retries: "{{ awx_ui_retries }}"
      delay: "{{ awx_ui_delay }}"
      until:
        - awx_http_test.status is defined
      failed_when: false

    - name: Display AWX HTTP result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AWX HTTP STATUS"
          - "============================================================"
          - "URL    : http://{{ vip }}/"
          - "Status : {{ awx_http_test.status | default('UNKNOWN') }}"
          - "============================================================"

    # ============================================================
    # TEST INGRESS WITH HOST HEADER
    # ============================================================

    - name: Test AWX Ingress with hostname
      ansible.builtin.uri:
        url: "http://{{ vip }}/"
        method: GET
        headers:
          Host: "ansible-server-01.vgs.com"
        return_content: true
        status_code:
          - 200
          - 301
          - 302
          - 404
      register: awx_ingress_http_test
      failed_when: false

    - name: Display AWX Ingress HTTP result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AWX INGRESS HTTP TEST"
          - "============================================================"
          - "Host   : ansible-server-01.vgs.com"
          - "Status : {{ awx_ingress_http_test.status | default('UNKNOWN') }}"
          - "============================================================"

    # ============================================================
    # 18. VMWARE EXECUTION ENVIRONMENT
    # ============================================================

    - name: Display section 18
      ansible.builtin.debug:
        msg:
          - "# 18. Configure VMware Execution Environment"
          - "Locating AWX Task Pod..."

    - name: Locate AWX Task Pod
      ansible.builtin.shell: |
        {{ k3s_binary_path }} kubectl \
          get pods \
          -n "{{ awx_namespace }}" \
          --no-headers |
        awk '/awx-server-task/ {print $1; exit}'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: task_pod_lookup
      retries: "{{ task_pod_retries }}"
      delay: "{{ task_pod_delay }}"
      until:
        - task_pod_lookup.stdout | trim | length > 0
      changed_when: false

    - name: Set AWX Task Pod
      ansible.builtin.set_fact:
        task_pod: "{{ task_pod_lookup.stdout | trim }}"

    - name: Display Task Pod
      ansible.builtin.debug:
        msg: "Using Task Pod: {{ task_pod }}"

    - name: Wait for awx-manage
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - exec
          - -n
          - "{{ awx_namespace }}"
          - "{{ task_pod }}"
          - -c
          - awx-server-task
          - --
          - true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_manage_ready
      retries: "{{ task_pod_retries }}"
      delay: "{{ task_pod_delay }}"
      until:
        - awx_manage_ready.rc == 0
      changed_when: false

    - name: Configure VMware Execution Environment
      ansible.builtin.shell: |
        {{ k3s_binary_path }} kubectl exec -i \
          -n "{{ awx_namespace }}" \
          "{{ task_pod }}" \
          -c awx-server-task \
          -- bash <<'EOF'

        awx-manage shell <<'PYEOF'
        from awx.main.models.execution_environments import ExecutionEnvironment
        from awx.conf.models import Setting

        EE_IMAGE="{{ ee_image }}"

        for ee in ExecutionEnvironment.objects.filter(id__in=[1,2]):
            ee.image = EE_IMAGE
            ee.pull = "always"
            ee.credential = None
            ee.save()
            print(f"Updated: {ee.id} {ee.name}")

        default_ee = ExecutionEnvironment.objects.get(id=1)

        Setting.objects.update_or_create(
            key="DEFAULT_EXECUTION_ENVIRONMENT",
            defaults={"value": default_ee.id}
        )

        print("Default EE updated")
        PYEOF

        EOF
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Restart AWX Task deployment
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - rollout
          - restart
          - deployment/awx-server-task
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Wait for AWX Task rollout after EE configuration
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - rollout
          - status
          - deployment/awx-server-task
          - -n
          - "{{ awx_namespace }}"
          - --timeout=10m
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Display VMware Execution Environment result
      ansible.builtin.debug:
        msg: "VMware Execution Environment configured successfully."

    # ============================================================
    # FINAL SUMMARY
    # ============================================================

    - name: Display final AWX installation summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS - AWX INSTALLATION COMPLETE"
          - "============================================================"
          - "Host                : ansible-server-01.vgs.com"
          - "Namespace           : {{ awx_namespace }}"
          - "Operator Version    : {{ operator_version }}"
          - "Host IP             : {{ vip }}"
          - "AWX URL             : http://{{ vip }}"
          - "K3s                 : configured"
          - "K3s Node            : Ready"
          - "Local Registry      : localhost:5000"
          - "VMware EE           : {{ ee_image }}"
          - "Task Deployment     : awx-server-task"
          - "Web Deployment      : awx-server-web"
          - "AWX Service         : awx-server-service"
          - "Ingress             : awx-ingress"
          - "============================================================"
