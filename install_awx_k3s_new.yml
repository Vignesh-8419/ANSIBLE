---
- name: Install AWX on Rocky/RHEL 8 + K3s
  hosts: ANSIBLE
  become: true
  become_method: sudo
  become_user: root
  gather_facts: true

  vars:

    # ============================================================
    # 1. VARIABLES
    # ============================================================

    awx_namespace: "awx"

    operator_version: "2.19.1"

    vip: "192.168.253.145"

    admin_password: "Root@123"

    kube_rbac_proxy_image: "quay.io/brancz/kube-rbac-proxy:v0.18.0"

    # AWX Operator leader election
    #
    # Increased for this single-node K3s lab because the
    # Kubernetes API can occasionally take longer to respond.
    #
    leader_election_lease_duration: "60s"
    leader_election_renew_deadline: "40s"

    # ============================================================
    # PATHS
    # ============================================================

    awx_operator_dir: "/root/awx-operator"
    awx_ee_dir: "/root/awx-ee-vmware"

    k3s_binary_path: "/usr/local/bin/k3s"
    kubectl_path: "/usr/local/bin/kubectl"

    kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"
    root_kubeconfig_path: "/root/.kube/config"

    registry_dir: "/opt/registry"

    podman_registry_conf: "/etc/containers/registries.conf.d/localhost.conf"
    k3s_registry_conf: "/etc/rancher/k3s/registries.yaml"

    awx_instance_manifest: "/root/awx-operator/awx-instance.yaml"
    awx_ingress_manifest: "/root/awx-operator/awx-ingress.yaml"

    # ============================================================
    # VMWARE EXECUTION ENVIRONMENT
    # ============================================================

    ee_image: "localhost:5000/awx-ee-vmware:24.6.1"

    # ============================================================
    # TIMEOUTS
    # ============================================================

    k3s_ready_timeout: "300s"

    reboot_timeout: 1800
    reboot_connect_timeout: 30
    post_reboot_delay: 20

    api_ready_retries: 60
    api_ready_delay: 5

    api_stable_checks: 10
    api_stable_delay: 2

    metrics_ready_retries: 120
    metrics_ready_delay: 5

    operator_ready_retries: 120
    operator_ready_delay: 10

    awx_cr_retries: 120
    awx_cr_delay: 10

    migration_retries: 180
    migration_delay: 10

    awx_deployment_retries: 180
    awx_deployment_delay: 10

    awx_pod_retries: 180
    awx_pod_delay: 10

    awx_service_retries: 120
    awx_service_delay: 5

    ingress_retries: 120
    ingress_delay: 5

    task_pod_retries: 180
    task_pod_delay: 10

    awx_ui_retries: 60
    awx_ui_delay: 5

  # ============================================================
  # GLOBAL ENVIRONMENT
  # ============================================================

  environment:
    PATH: "/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin"
    KUBECONFIG: "/etc/rancher/k3s/k3s.yaml"

  tasks:

    # ============================================================
    # 1. DISPLAY VARIABLES
    # ============================================================

    - name: Display variables
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AWX ON K3S INSTALLATION"
          - "============================================================"
          - "Namespace                 : {{ awx_namespace }}"
          - "Operator Version          : {{ operator_version }}"
          - "VIP                       : {{ vip }}"
          - "Interface                 : {{ ansible_default_ipv4.interface | default('UNKNOWN') }}"
          - "K3s                       : {{ k3s_binary_path }}"
          - "kubectl                   : {{ kubectl_path }}"
          - "Kubeconfig                : {{ kubeconfig_path }}"
          - "kube-rbac-proxy           : {{ kube_rbac_proxy_image }}"
          - "Leader Lease Duration     : {{ leader_election_lease_duration }}"
          - "Leader Renew Deadline     : {{ leader_election_renew_deadline }}"
          - "VMware EE                 : {{ ee_image }}"
          - "============================================================"

    # ============================================================
    # PRE-FLIGHT - CGROUP V2
    #
    # NO EFI STEPS.
    #
    # If cgroup v2 already active:
    #     continue.
    #
    # If not:
    #     update kernel arguments
    #     reboot
    #     verify cgroup v2
    #
    # If still disabled:
    #     FAIL
    # ============================================================

    - name: Check current cgroup filesystem
      ansible.builtin.command:
        cmd: stat -fc %T /sys/fs/cgroup
      register: cgroup_fs_before
      changed_when: false

    - name: Display initial cgroup status
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "CGROUP V2 PRE-FLIGHT"
          - "============================================================"
          - "Filesystem Type: {{ cgroup_fs_before.stdout | trim }}"
          - >-
            {{
              'cgroup v2 is already active.'
              if cgroup_fs_before.stdout | trim == 'cgroup2fs'
              else
              'cgroup v2 is not enabled.'
            }}
          - "============================================================"

    - name: Update kernel arguments for cgroup v2
      ansible.builtin.command:
        cmd: >-
          grubby --update-kernel=ALL
          --args="systemd.unified_cgroup_hierarchy=1 systemd.legacy_systemd_cgroup_controller=false"
      when:
        - cgroup_fs_before.stdout | trim != "cgroup2fs"

    - name: Display cgroup reboot requirement
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "CGROUP V2 KERNEL CONFIGURATION"
          - "============================================================"
          - "Kernel arguments updated."
          - "Server will reboot now."
          - "After reboot cgroup v2 will be checked again."
          - "============================================================"
      when:
        - cgroup_fs_before.stdout | trim != "cgroup2fs"

    - name: Reboot server to activate cgroup v2
      ansible.builtin.reboot:
        msg: "Rebooting ansible-server-01 to activate cgroup v2"
        reboot_timeout: "{{ reboot_timeout }}"
        connect_timeout: "{{ reboot_connect_timeout }}"
        pre_reboot_delay: 5
        post_reboot_delay: "{{ post_reboot_delay }}"
        test_command: "stat -fc %T /sys/fs/cgroup"
      when:
        - cgroup_fs_before.stdout | trim != "cgroup2fs"

    - name: Check cgroup filesystem after reboot
      ansible.builtin.command:
        cmd: stat -fc %T /sys/fs/cgroup
      register: cgroup_fs_after
      changed_when: false
      when:
        - cgroup_fs_before.stdout | trim != "cgroup2fs"

    - name: Display post reboot cgroup status
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "CGROUP V2 POST-REBOOT CHECK"
          - "============================================================"
          - "Filesystem Type: {{ cgroup_fs_after.stdout | default('UNKNOWN') | trim }}"
          - >-
            {{
              'cgroup v2 is enabled.'
              if cgroup_fs_after.stdout | default('') | trim == 'cgroup2fs'
              else
              'cgroup v2 is STILL NOT enabled.'
            }}
          - "============================================================"
      when:
        - cgroup_fs_before.stdout | trim != "cgroup2fs"

    - name: Stop if cgroup v2 is still disabled
      ansible.builtin.fail:
        msg: |
          ============================================================
          CGROUP V2 WAS NOT ENABLED AFTER REBOOT
          ============================================================

          Current filesystem:
          {{ cgroup_fs_after.stdout | default('UNKNOWN') | trim }}

          Installation will NOT continue.

          ============================================================
      when:
        - cgroup_fs_before.stdout | trim != "cgroup2fs"
        - cgroup_fs_after.stdout | default('') | trim != "cgroup2fs"

    - name: Confirm cgroup v2 is active
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "CGROUP V2 READY"
          - "============================================================"
          - "cgroup v2 is active."
          - "Continuing with AWX installation."
          - "============================================================"

    # ============================================================
    # 2. PREREQUISITES
    # ============================================================

    - name: Display section 2
      ansible.builtin.debug:
        msg:
          - "# 2. Install prerequisites"
          - "Installing prerequisites..."

    - name: Install prerequisites
      ansible.builtin.dnf:
        name:
          - git
          - make
          - curl
          - wget
          - tar
          - gzip
          - gettext
          - net-tools
          - container-selinux
          - selinux-policy-base
        state: present

    - name: Install K3s SELinux package
      ansible.builtin.dnf:
        name: "https://rpm.rancher.io/k3s/stable/common/centos/8/noarch/k3s-selinux-1.5-1.el8.noarch.rpm"
        state: present
        disable_gpg_check: true
      register: k3s_selinux_package
      failed_when: false

    - name: Display prerequisites result
      ansible.builtin.debug:
        msg: "Prerequisites installed."

    # ============================================================
    # 3. SELINUX / FIREWALL
    # ============================================================

    - name: Display section 3
      ansible.builtin.debug:
        msg:
          - "# 3. SELinux / Firewall"
          - "Setting SELinux to permissive."
          - "Disabling firewalld."

    - name: Set SELinux permissive immediately
      ansible.builtin.command:
        cmd: setenforce 0
      register: setenforce_result
      failed_when: false
      changed_when: false

    - name: Set SELinux permissive permanently
      ansible.builtin.replace:
        path: /etc/selinux/config
        regexp: '^SELINUX=.*$'
        replace: "SELINUX=permissive"
      failed_when: false

    - name: Stop firewalld
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
      register: firewalld_stop
      failed_when: false

    - name: Disable firewalld
      ansible.builtin.systemd:
        name: firewalld
        enabled: false
      register: firewalld_disable
      failed_when: false

    - name: Display SELinux firewall result
      ansible.builtin.debug:
        msg:
          - "SELinux : permissive"
          - "firewalld : disabled"

    # ============================================================
    # 4. VERIFY VIP
    # ============================================================

    - name: Display section 4
      ansible.builtin.debug:
        msg:
          - "# 4. Verify VIP"
          - "VIP       : {{ vip }}"
          - "Interface : {{ ansible_default_ipv4.interface }}"

    - name: Check expected VIP
      ansible.builtin.shell: |
        ip -4 addr show "{{ ansible_default_ipv4.interface }}" |
        grep -q "{{ vip }}/"
      args:
        executable: /bin/bash
      register: vip_check
      failed_when: false
      changed_when: false

    - name: Add VIP to interface if missing
      ansible.builtin.command:
        cmd: "ip addr add {{ vip }}/24 dev {{ ansible_default_ipv4.interface }}"
      when:
        - vip_check.rc != 0

    - name: Verify VIP after assignment
      ansible.builtin.shell: |
        ip -4 addr show "{{ ansible_default_ipv4.interface }}" |
        grep -q "{{ vip }}/"
      args:
        executable: /bin/bash
      register: vip_check_after
      changed_when: false

    - name: Fail if VIP is still missing
      ansible.builtin.fail:
        msg: |
          ============================================================
          VIP ASSIGNMENT FAILED
          ============================================================

          VIP       : {{ vip }}
          Interface : {{ ansible_default_ipv4.interface }}

          ============================================================
      when:
        - vip_check_after.rc != 0

    # ============================================================
    # 5. INSTALL K3S
    # ============================================================

    - name: Display section 5
      ansible.builtin.debug:
        msg:
          - "# 5. Install K3s"

    - name: Check K3s binary
      ansible.builtin.stat:
        path: "{{ k3s_binary_path }}"
      register: k3s_binary

    - name: Install K3s
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io |
        sh -s - --write-kubeconfig-mode 644
      args:
        executable: /bin/bash
      when:
        - not k3s_binary.stat.exists

    - name: Verify K3s binary
      ansible.builtin.stat:
        path: "{{ k3s_binary_path }}"
      register: k3s_binary_after

    - name: Fail if K3s binary is missing
      ansible.builtin.fail:
        msg: "K3s binary does not exist: {{ k3s_binary_path }}"
      when:
        - not k3s_binary_after.stat.exists

    # ------------------------------------------------------------
    # IMPORTANT:
    # Use the K3s binary directly.
    # Do not depend on login-shell PATH.
    # ------------------------------------------------------------

    - name: Link kubectl to K3s
      ansible.builtin.file:
        src: "{{ k3s_binary_path }}"
        dest: "{{ kubectl_path }}"
        state: link
        force: true

    - name: Configure K3s environment
      ansible.builtin.copy:
        dest: /etc/profile.d/k3s.sh
        mode: "0644"
        content: |
          export PATH=$PATH:/usr/local/bin
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

    - name: Enable and start K3s
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true

    - name: Verify K3s kubectl client
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - version
          - --client=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Wait for K3s node Ready
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - wait
          - --for=condition=Ready
          - node
          - --all
          - "--timeout={{ k3s_ready_timeout }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Create root kube directory
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: "0700"

    - name: Copy K3s kubeconfig
      ansible.builtin.copy:
        src: "{{ kubeconfig_path }}"
        dest: "{{ root_kubeconfig_path }}"
        remote_src: true
        mode: "0600"

    - name: Get K3s nodes
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - nodes
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: k3s_nodes
      changed_when: false

    - name: Display K3s status
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "K3S READY"
          - "============================================================"
          - "{{ k3s_nodes.stdout }}"
          - "============================================================"

    # ============================================================
    # KUBERNETES API READINESS
    # ============================================================

    - name: Wait for Kubernetes API
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - --raw=/readyz
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: api_ready_initial
      retries: "{{ api_ready_retries }}"
      delay: "{{ api_ready_delay }}"
      until:
        - api_ready_initial.rc == 0
      changed_when: false

    - name: Verify Kubernetes API stability
      ansible.builtin.shell: |
        set -e

        for i in $(seq 1 {{ api_stable_checks }}); do
          echo "API stability check $i/{{ api_stable_checks }}"

          {{ k3s_binary_path }} kubectl \
            get --raw=/readyz >/dev/null

          sleep {{ api_stable_delay }}
        done
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: api_stable_initial
      retries: 3
      delay: 5
      until:
        - api_stable_initial.rc == 0
      changed_when: false

    # ============================================================
    # 5a. LOCAL CONTAINER REGISTRY
    # ============================================================

    - name: Display section 5a
      ansible.builtin.debug:
        msg:
          - "# 5a. Create Local Container Registry"

    - name: Create registry directory
      ansible.builtin.file:
        path: "{{ registry_dir }}"
        state: directory
        mode: "0755"

    - name: Get Podman containers
      ansible.builtin.command:
        argv:
          - podman
          - ps
          - -a
          - --format
          - "{{ '{{.Names}}' }}"
      register: podman_containers
      failed_when: false
      changed_when: false

    - name: Create registry container
      ansible.builtin.command:
        argv:
          - podman
          - run
          - -d
          - --name
          - registry
          - --restart=always
          - -p
          - "5000:5000"
          - -v
          - "/opt/registry:/var/lib/registry:z"
          - docker.io/library/registry:2
      when:
        - "'registry' not in podman_containers.stdout_lines"

    - name: Start existing registry
      ansible.builtin.command:
        cmd: podman start registry
      register: registry_start
      failed_when: false
      changed_when: false
      when:
        - "'registry' in podman_containers.stdout_lines"

    - name: Create Podman registry configuration directory
      ansible.builtin.file:
        path: /etc/containers/registries.conf.d
        state: directory
        mode: "0755"

    - name: Configure Podman localhost registry
      ansible.builtin.copy:
        dest: "{{ podman_registry_conf }}"
        mode: "0644"
        content: |
          [[registry]]
          location="localhost:5000"
          insecure=true

    - name: Create K3s registry directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Configure K3s localhost registry
      ansible.builtin.copy:
        dest: "{{ k3s_registry_conf }}"
        mode: "0644"
        content: |
          mirrors:
            "localhost:5000":
              endpoint:
                - "http://localhost:5000"

    - name: Restart K3s after registry configuration
      ansible.builtin.systemd:
        name: k3s
        state: restarted

    - name: Wait for K3s after registry restart
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - wait
          - --for=condition=Ready
          - node
          - --all
          - "--timeout={{ k3s_ready_timeout }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Wait for Kubernetes API after K3s restart
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - --raw=/readyz
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: api_ready_registry
      retries: "{{ api_ready_retries }}"
      delay: "{{ api_ready_delay }}"
      until:
        - api_ready_registry.rc == 0
      changed_when: false

    - name: Verify local registry
      ansible.builtin.uri:
        url: "http://localhost:5000/v2/"
        method: GET
        status_code: 200

    - name: Display registry result
      ansible.builtin.debug:
        msg:
          - "Local registry : localhost:5000"
          - "Registry status : reachable"

    # ============================================================
    # 6. KUSTOMIZE
    # ============================================================

    - name: Display section 6
      ansible.builtin.debug:
        msg:
          - "# 6. Install Kustomize"

    - name: Check Kustomize
      ansible.builtin.command:
        cmd: /usr/bin/which kustomize
      register: kustomize_binary
      failed_when: false
      changed_when: false

    - name: Install Kustomize
      ansible.builtin.shell: |
        curl -s \
          "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" |
          bash

        mv -f kustomize /usr/local/bin/kustomize
      args:
        executable: /bin/bash
        chdir: /tmp
      when:
        - kustomize_binary.rc != 0

    - name: Verify Kustomize
      ansible.builtin.command:
        cmd: /usr/local/bin/kustomize version
      changed_when: false

    # ============================================================
    # 7. METRICS SERVER
    # ============================================================

    - name: Display section 7
      ansible.builtin.debug:
        msg:
          - "# 7. Metrics Server"

    - name: Wait for metrics-server deployment
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - deployment
          - metrics-server
          - -n
          - kube-system
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: metrics_deployment
      retries: "{{ metrics_ready_retries }}"
      delay: "{{ metrics_ready_delay }}"
      until:
        - metrics_deployment.rc == 0
      changed_when: false

    - name: Get metrics-server deployment YAML
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - deployment
          - metrics-server
          - -n
          - kube-system
          - -o
          - yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: metrics_yaml
      changed_when: false

    - name: Determine metrics TLS configuration
      ansible.builtin.set_fact:
        metrics_tls_enabled: >-
          {{
            '--kubelet-insecure-tls' in metrics_yaml.stdout
          }}

    - name: Patch metrics-server with insecure kubelet TLS
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - patch
          - deployment
          - metrics-server
          - -n
          - kube-system
          - --type=json
          - -p
          - '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      when:
        - not metrics_tls_enabled

    - name: Wait for metrics-server rollout
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - rollout
          - status
          - deployment/metrics-server
          - -n
          - kube-system
          - --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Wait for metrics-server endpoint
      ansible.builtin.shell: |
        ENDPOINTS=$(
          {{ k3s_binary_path }} kubectl \
            get endpoints metrics-server \
            -n kube-system \
            -o jsonpath='{.subsets[*].addresses[*].ip}' \
            2>/dev/null
        )

        echo "Metrics endpoint: $ENDPOINTS"

        test -n "$ENDPOINTS"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: metrics_endpoint
      retries: "{{ metrics_ready_retries }}"
      delay: "{{ metrics_ready_delay }}"
      until:
        - metrics_endpoint.rc == 0
      changed_when: false

    # ============================================================
    # 8. CLEAN OLD AWX RESOURCES
    #
    # IMPORTANT:
    # This is a fresh install/rebuild section.
    # ============================================================

    - name: Display section 8
      ansible.builtin.debug:
        msg:
          - "# 8. Cleanup old AWX resources"

    - name: Check AWX namespace
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - namespace
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_namespace_check
      failed_when: false
      changed_when: false

    - name: Create AWX namespace
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - create
          - namespace
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      when:
        - awx_namespace_check.rc != 0

    - name: Delete old AWX resource
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - delete
          - awx
          - awx-server
          - -n
          - "{{ awx_namespace }}"
          - --ignore-not-found=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      failed_when: false
      changed_when: false

    - name: Delete old AWX ingress
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - delete
          - ingress
          - awx-ingress
          - -n
          - "{{ awx_namespace }}"
          - --ignore-not-found=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      failed_when: false
      changed_when: false

    - name: Delete old AWX operator deployment
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - delete
          - deployment
          - awx-operator-controller-manager
          - -n
          - "{{ awx_namespace }}"
          - --ignore-not-found=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      failed_when: false
      changed_when: false

    - name: Delete old AWX ReplicaSets
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - delete
          - rs
          - --all
          - -n
          - "{{ awx_namespace }}"
          - --ignore-not-found=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      failed_when: false
      changed_when: false

    - name: Delete old AWX pods
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - delete
          - pods
          - --all
          - -n
          - "{{ awx_namespace }}"
          - --ignore-not-found=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      failed_when: false
      changed_when: false

    - name: Display cleanup result
      ansible.builtin.debug:
        msg: "Old AWX resources cleaned."

    # ============================================================
    # 9. KUBE-RBAC-PROXY
    # ============================================================

    - name: Display section 9
      ansible.builtin.debug:
        msg:
          - "# 9. Verify kube-rbac-proxy image"

    - name: Pull kube-rbac-proxy using K3s CRI
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - crictl
          - pull
          - "{{ kube_rbac_proxy_image }}"

    # ============================================================
    # 10. AWX OPERATOR SOURCE
    # ============================================================

    - name: Display section 10
      ansible.builtin.debug:
        msg:
          - "# 10. Download AWX Operator source"

    - name: Remove existing AWX Operator directory
      ansible.builtin.file:
        path: "{{ awx_operator_dir }}"
        state: absent

    - name: Clone AWX Operator
      ansible.builtin.git:
        repo: "https://github.com/ansible/awx-operator.git"
        dest: "{{ awx_operator_dir }}"
        version: "{{ operator_version }}"
        force: true

    - name: Verify AWX Operator Makefile
      ansible.builtin.stat:
        path: "{{ awx_operator_dir }}/Makefile"
      register: operator_makefile

    - name: Fail if Operator Makefile is missing
      ansible.builtin.fail:
        msg: "AWX Operator Makefile not found."
      when:
        - not operator_makefile.stat.exists

    # ============================================================
    # 11. KUBE-RBAC-PROXY FIX
    # ============================================================

    - name: Display section 11
      ansible.builtin.debug:
        msg:
          - "# 11. Fix kube-rbac-proxy image"

    - name: Set kube-rbac-proxy image for gcr.io
      ansible.builtin.command:
        argv:
          - kustomize
          - edit
          - set
          - image
          - "gcr.io/kubebuilder/kube-rbac-proxy={{ kube_rbac_proxy_image }}"
      args:
        chdir: "{{ awx_operator_dir }}/config/default"
      failed_when: false

    - name: Set kube-rbac-proxy image for registry.k8s.io
      ansible.builtin.command:
        argv:
          - kustomize
          - edit
          - set
          - image
          - "registry.k8s.io/kube-rbac-proxy={{ kube_rbac_proxy_image }}"
      args:
        chdir: "{{ awx_operator_dir }}/config/default"
      failed_when: false

    # ============================================================
    # 12. ADMIN SECRET
    # ============================================================

    - name: Display section 12
      ansible.builtin.debug:
        msg:
          - "# 12. Create AWX admin password secret"

    - name: Create AWX admin password secret
      ansible.builtin.shell: |
        {{ k3s_binary_path }} kubectl \
          create secret generic awx-server-admin-password \
          --from-literal=password="{{ admin_password }}" \
          -n "{{ awx_namespace }}" \
          --dry-run=client \
          -o yaml |
        {{ k3s_binary_path }} kubectl apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Display secret result
      ansible.builtin.debug:
        msg: "AWX admin password secret created."

    # ============================================================
    # VMWARE EXECUTION ENVIRONMENT
    # ============================================================

    - name: Create VMware EE directory
      ansible.builtin.file:
        path: "{{ awx_ee_dir }}"
        state: directory
        mode: "0755"

    - name: Create VMware EE Containerfile
      ansible.builtin.copy:
        dest: "{{ awx_ee_dir }}/Containerfile"
        mode: "0644"
        content: |
          FROM quay.io/ansible/awx-ee:24.6.1

          USER root

          RUN dnf install -y python3-pip && \
              pip3 install --no-cache-dir \
                  requests \
                  pyvmomi && \
              ansible-galaxy collection install \
                  community.vmware \
                  vmware.vmware && \
              dnf clean all

          USER 1000

    - name: Build VMware EE
      ansible.builtin.command:
        argv:
          - podman
          - build
          - -t
          - awx-ee-vmware:24.6.1
          - .
      args:
        chdir: "{{ awx_ee_dir }}"

    - name: Tag VMware EE
      ansible.builtin.command:
        argv:
          - podman
          - tag
          - localhost/awx-ee-vmware:24.6.1
          - localhost:5000/awx-ee-vmware:24.6.1

    - name: Push VMware EE
      ansible.builtin.command:
        argv:
          - podman
          - push
          - --tls-verify=false
          - localhost:5000/awx-ee-vmware:24.6.1

    - name: Pull VMware EE using K3s CRI
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - crictl
          - pull
          - localhost:5000/awx-ee-vmware:24.6.1

    # ============================================================
    # 13. DEPLOY AWX OPERATOR
    # ============================================================

    - name: Display section 13
      ansible.builtin.debug:
        msg:
          - "# 13. Deploy AWX Operator"

    - name: Verify Kubernetes API before Operator
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - --raw=/readyz
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: api_ready_operator
      retries: "{{ api_ready_retries }}"
      delay: "{{ api_ready_delay }}"
      until:
        - api_ready_operator.rc == 0
      changed_when: false

    - name: Deploy AWX Operator
      ansible.builtin.command:
        argv:
          - make
          - deploy
          - "NAMESPACE={{ awx_namespace }}"
      args:
        chdir: "{{ awx_operator_dir }}"
      environment:
        PATH: "/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin"
        KUBECONFIG: "{{ kubeconfig_path }}"

    # ------------------------------------------------------------
    # IMPORTANT:
    #
    # Container order in your Operator deployment is:
    #
    #   container 0 = kube-rbac-proxy
    #   container 1 = awx-manager
    #
    # The leader-election flags MUST go to awx-manager.
    # ------------------------------------------------------------

    - name: Configure AWX Operator leader election tolerance
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - patch
          - deployment
          - awx-operator-controller-manager
          - -n
          - "{{ awx_namespace }}"
          - --type=json
          - -p
          - >-
            [
              {
                "op":"add",
                "path":"/spec/template/spec/containers/1/args/-",
                "value":"--leader-elect-lease-duration={{ leader_election_lease_duration }}"
              },
              {
                "op":"add",
                "path":"/spec/template/spec/containers/1/args/-",
                "value":"--leader-elect-renew-deadline={{ leader_election_renew_deadline }}"
              }
            ]
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Set kube-rbac-proxy image on Operator
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - -n
          - "{{ awx_namespace }}"
          - set
          - image
          - deployment/awx-operator-controller-manager
          - "kube-rbac-proxy={{ kube_rbac_proxy_image }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      failed_when: false

    - name: Display Operator leader election configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AWX OPERATOR LEADER ELECTION"
          - "============================================================"
          - "Lease duration : {{ leader_election_lease_duration }}"
          - "Renew deadline : {{ leader_election_renew_deadline }}"
          - "Target        : awx-manager container"
          - "============================================================"

    - name: Wait for AWX Operator rollout
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - rollout
          - status
          - deployment/awx-operator-controller-manager
          - -n
          - "{{ awx_namespace }}"
          - --timeout=5m
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # ============================================================
    # VERIFY OPERATOR ARGUMENTS
    # ============================================================

    - name: Get AWX Operator arguments
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - deployment
          - awx-operator-controller-manager
          - -n
          - "{{ awx_namespace }}"
          - -o
          - jsonpath={.spec.template.spec.containers[1].args}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: operator_args
      changed_when: false

    - name: Display AWX Operator arguments
      ansible.builtin.debug:
        msg: "{{ operator_args.stdout }}"

    # ============================================================
    # OPERATOR READY
    # ============================================================

    - name: Wait for AWX Operator containers Ready
      ansible.builtin.shell: |
        POD=$(
          {{ k3s_binary_path }} kubectl \
            get pods \
            -n "{{ awx_namespace }}" \
            -l control-plane=controller-manager \
            -o jsonpath='{.items[0].metadata.name}' \
            2>/dev/null
        )

        test -n "$POD"

        READY=$(
          {{ k3s_binary_path }} kubectl \
            get pod "$POD" \
            -n "{{ awx_namespace }}" \
            -o jsonpath='{range .status.containerStatuses[*]}{.ready}{" "}{end}'
        )

        echo "Operator pod: $POD"
        echo "Readiness: $READY"

        echo "$READY" | grep -q "true true"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: operator_ready
      retries: "{{ operator_ready_retries }}"
      delay: "{{ operator_ready_delay }}"
      until:
        - operator_ready.rc == 0
      changed_when: false

    # ============================================================
    # 14. CREATE AWX INSTANCE
    # ============================================================

    - name: Display section 14
      ansible.builtin.debug:
        msg:
          - "# 14. Create AWX instance"

    - name: Wait for Kubernetes API before AWX CR
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - --raw=/readyz
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: api_ready_awx
      retries: "{{ api_ready_retries }}"
      delay: "{{ api_ready_delay }}"
      until:
        - api_ready_awx.rc == 0
      changed_when: false

    - name: Verify Kubernetes API stability before AWX CR
      ansible.builtin.shell: |
        set -e

        for i in $(seq 1 {{ api_stable_checks }}); do
          echo "API stability check $i/{{ api_stable_checks }}"

          {{ k3s_binary_path }} kubectl \
            get --raw=/readyz >/dev/null

          sleep {{ api_stable_delay }}
        done
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: api_stable_awx
      retries: 3
      delay: 5
      until:
        - api_stable_awx.rc == 0
      changed_when: false

    - name: Create AWX instance manifest
      ansible.builtin.copy:
        dest: "{{ awx_instance_manifest }}"
        mode: "0644"
        content: |
          apiVersion: awx.ansible.com/v1beta1
          kind: AWX
          metadata:
            name: awx-server
            namespace: {{ awx_namespace }}
          spec:
            service_type: ClusterIP
            admin_password_secret: awx-server-admin-password
            postgres_storage_class: local-path

    - name: Apply AWX instance
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - apply
          - -f
          - "{{ awx_instance_manifest }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Wait for AWX custom resource
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - awx
          - awx-server
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_cr
      retries: "{{ awx_cr_retries }}"
      delay: "{{ awx_cr_delay }}"
      until:
        - awx_cr.rc == 0
      changed_when: false

    # ============================================================
    # CHECK OPERATOR AGAIN
    # ============================================================

    - name: Wait for AWX Operator after AWX CR creation
      ansible.builtin.shell: |
        POD=$(
          {{ k3s_binary_path }} kubectl \
            get pods \
            -n "{{ awx_namespace }}" \
            -l control-plane=controller-manager \
            -o jsonpath='{.items[0].metadata.name}' \
            2>/dev/null
        )

        test -n "$POD"

        READY=$(
          {{ k3s_binary_path }} kubectl \
            get pod "$POD" \
            -n "{{ awx_namespace }}" \
            -o jsonpath='{range .status.containerStatuses[*]}{.ready}{" "}{end}'
        )

        echo "Operator pod: $POD"
        echo "Readiness: $READY"

        echo "$READY" | grep -q "true true"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: operator_ready_after_awx
      retries: "{{ operator_ready_retries }}"
      delay: "{{ operator_ready_delay }}"
      until:
        - operator_ready_after_awx.rc == 0
      changed_when: false

    # ============================================================
    # 14a. MIGRATION
    # ============================================================

    - name: Display section 14a
      ansible.builtin.debug:
        msg:
          - "# 14a. Wait for AWX Migration"

    - name: Wait for AWX migration job
      ansible.builtin.shell: |
        {{ k3s_binary_path }} kubectl \
          get jobs \
          -n "{{ awx_namespace }}" \
          --no-headers 2>/dev/null |
        grep -q "awx-server-migration"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: migration_exists
      retries: "{{ migration_retries }}"
      delay: "{{ migration_delay }}"
      until:
        - migration_exists.rc == 0
      changed_when: false

    - name: Get AWX migration job
      ansible.builtin.shell: |
        {{ k3s_binary_path }} kubectl \
          get jobs \
          -n "{{ awx_namespace }}" \
          -o name |
        grep "awx-server-migration" |
        head -1
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: migration_job
      changed_when: false

    - name: Display migration job
      ansible.builtin.debug:
        msg: "Migration job: {{ migration_job.stdout | trim }}"

    - name: Wait for migration complete
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - wait
          - --for=condition=complete
          - "{{ migration_job.stdout | trim }}"
          - -n
          - "{{ awx_namespace }}"
          - --timeout=60m
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Display migration result
      ansible.builtin.debug:
        msg: "AWX database migration completed."

    # ============================================================
    # 15. AWX SERVICE
    # ============================================================

    - name: Wait for AWX service
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - service
          - awx-server-service
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_service
      retries: "{{ awx_service_retries }}"
      delay: "{{ awx_service_delay }}"
      until:
        - awx_service.rc == 0
      changed_when: false

    # ============================================================
    # 16. AWX DEPLOYMENTS
    # ============================================================

    - name: Wait for AWX Task deployment
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - deployment
          - awx-server-task
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: task_deployment
      retries: "{{ awx_deployment_retries }}"
      delay: "{{ awx_deployment_delay }}"
      until:
        - task_deployment.rc == 0
      changed_when: false

    - name: Wait for AWX Web deployment
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - deployment
          - awx-server-web
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: web_deployment
      retries: "{{ awx_deployment_retries }}"
      delay: "{{ awx_deployment_delay }}"
      until:
        - web_deployment.rc == 0
      changed_when: false

    - name: Wait for AWX Task rollout
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - rollout
          - status
          - deployment/awx-server-task
          - -n
          - "{{ awx_namespace }}"
          - --timeout=30m
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Wait for AWX Web rollout
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - rollout
          - status
          - deployment/awx-server-web
          - -n
          - "{{ awx_namespace }}"
          - --timeout=30m
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # ============================================================
    # TASK POD
    #
    # DO NOT run "kubectl exec -- true" as a separate readiness
    # check.
    #
    # We wait for:
    #
    #   phase = Running
    #   Ready  = True
    #
    # Then directly verify awx-manage.
    # ============================================================

    - name: Locate AWX Task pod
      ansible.builtin.shell: |
        {{ k3s_binary_path }} kubectl \
          get pods \
          -n "{{ awx_namespace }}" \
          --no-headers |
        awk '/awx-server-task/ {print $1; exit}'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: task_pod_lookup
      retries: "{{ task_pod_retries }}"
      delay: "{{ task_pod_delay }}"
      until:
        - task_pod_lookup.stdout | trim | length > 0
      changed_when: false

    - name: Set AWX Task pod
      ansible.builtin.set_fact:
        task_pod: "{{ task_pod_lookup.stdout | trim }}"

    - name: Display AWX Task pod
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AWX TASK POD"
          - "============================================================"
          - "Pod: {{ task_pod }}"
          - "============================================================"

    - name: Wait for AWX Task pod Running and Ready
      ansible.builtin.shell: |
        POD_PHASE=$(
          {{ k3s_binary_path }} kubectl \
            get pod "{{ task_pod }}" \
            -n "{{ awx_namespace }}" \
            -o jsonpath='{.status.phase}'
        )

        READY=$(
          {{ k3s_binary_path }} kubectl \
            get pod "{{ task_pod }}" \
            -n "{{ awx_namespace }}" \
            -o jsonpath='{range .status.conditions[?(@.type=="Ready")]}{.status}{end}'
        )

        echo "Pod phase : $POD_PHASE"
        echo "Ready     : $READY"

        test "$POD_PHASE" = "Running"
        test "$READY" = "True"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: task_pod_ready
      retries: "{{ awx_pod_retries }}"
      delay: "{{ awx_pod_delay }}"
      until:
        - task_pod_ready.rc == 0
      changed_when: false

    - name: Display Task pod final state
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - pod
          - "{{ task_pod }}"
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: task_pod_final_state
      changed_when: false

    - name: Show Task pod final state
      ansible.builtin.debug:
        msg: "{{ task_pod_final_state.stdout }}"

    # ============================================================
    # VERIFY AWX-MANAGE DIRECTLY
    #
    # The old unnecessary "-- true" test has been removed.
    # ============================================================

    - name: Verify awx-manage exists
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - exec
          - -n
          - "{{ awx_namespace }}"
          - "{{ task_pod }}"
          - -c
          - awx-server-task
          - --
          - which
          - awx-manage
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_manage_path
      retries: 90
      delay: 10
      until:
        - awx_manage_path.rc == 0
      changed_when: false

    - name: Display awx-manage
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "AWX-MANAGE READY"
          - "============================================================"
          - "Task Pod   : {{ task_pod }}"
          - "awx-manage : {{ awx_manage_path.stdout | trim }}"
          - "============================================================"

    # ============================================================
    # WEB POD
    # ============================================================

    - name: Wait for AWX Web pod Ready
      ansible.builtin.shell: |
        POD=$(
          {{ k3s_binary_path }} kubectl \
            get pods \
            -n "{{ awx_namespace }}" \
            --no-headers |
          awk '/awx-server-web/ {print $1; exit}'
        )

        test -n "$POD"

        READY=$(
          {{ k3s_binary_path }} kubectl \
            get pod "$POD" \
            -n "{{ awx_namespace }}" \
            -o jsonpath='{range .status.conditions[?(@.type=="Ready")]}{.status}{end}'
        )

        echo "Web pod   : $POD"
        echo "Web Ready : $READY"

        test "$READY" = "True"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: web_ready
      retries: "{{ awx_pod_retries }}"
      delay: "{{ awx_pod_delay }}"
      until:
        - web_ready.rc == 0
      changed_when: false

    # ============================================================
    # AWX SERVICE ENDPOINT
    # ============================================================

    - name: Wait for AWX service endpoint
      ansible.builtin.shell: |
        ENDPOINTS=$(
          {{ k3s_binary_path }} kubectl \
            get endpoints awx-server-service \
            -n "{{ awx_namespace }}" \
            -o jsonpath='{.subsets[*].addresses[*].ip}' \
            2>/dev/null
        )

        echo "AWX endpoints: $ENDPOINTS"

        test -n "$ENDPOINTS"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_endpoint
      retries: "{{ awx_service_retries }}"
      delay: "{{ awx_service_delay }}"
      until:
        - awx_endpoint.rc == 0
      changed_when: false

    - name: Get AWX endpoints
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - endpoints
          - awx-server-service
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_endpoint_display
      changed_when: false

    - name: Display AWX endpoints
      ansible.builtin.debug:
        msg: "{{ awx_endpoint_display.stdout }}"

    # ============================================================
    # 17. INGRESS
    # ============================================================

    - name: Display section 17
      ansible.builtin.debug:
        msg:
          - "# 17. Create AWX Ingress"

    - name: Create AWX Ingress manifest
      ansible.builtin.copy:
        dest: "{{ awx_ingress_manifest }}"
        mode: "0644"
        content: |
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: awx-ingress
            namespace: {{ awx_namespace }}
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
          spec:
            ingressClassName: traefik
            rules:
            - http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: awx-server-service
                      port:
                        number: 80

    - name: Apply AWX Ingress
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - apply
          - -f
          - "{{ awx_ingress_manifest }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Wait for AWX Ingress
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - ingress
          - awx-ingress
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: awx_ingress
      retries: "{{ ingress_retries }}"
      delay: "{{ ingress_delay }}"
      until:
        - awx_ingress.rc == 0
      changed_when: false

    # ============================================================
    # TRAEFIK
    # ============================================================

    - name: Wait for Traefik
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - rollout
          - status
          - deployment/traefik
          - -n
          - kube-system
          - --timeout=10m
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Get Traefik service
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - service
          - traefik
          - -n
          - kube-system
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: traefik_service
      changed_when: false

    - name: Display Traefik service
      ansible.builtin.debug:
        msg: "{{ traefik_service.stdout }}"

    # ============================================================
    # 18. HTTP TEST
    # ============================================================

    - name: Wait for HTTP port 80
      ansible.builtin.wait_for:
        host: "{{ vip }}"
        port: 80
        state: started
        timeout: 60

    - name: Test AWX HTTP endpoint
      ansible.builtin.uri:
        url: "http://{{ vip }}/"
        method: GET
        return_content: true
        status_code:
          - 200
          - 301
          - 302
          - 404
      register: awx_http
      retries: "{{ awx_ui_retries }}"
      delay: "{{ awx_ui_delay }}"
      until:
        - awx_http.status is defined
      failed_when: false

    - name: Display AWX HTTP response
      ansible.builtin.debug:
        msg:
          - "AWX HTTP status : {{ awx_http.status | default('UNKNOWN') }}"
          - "AWX URL         : http://{{ vip }}"

    # ============================================================
    # 19. CONFIGURE VMWARE EXECUTION ENVIRONMENT
    # ============================================================

    - name: Display section 19
      ansible.builtin.debug:
        msg:
          - "# 19. Configure VMware Execution Environment"

    - name: Configure VMware Execution Environment
      ansible.builtin.shell: |
        {{ k3s_binary_path }} kubectl exec -i \
          -n "{{ awx_namespace }}" \
          "{{ task_pod }}" \
          -c awx-server-task \
          -- bash <<'EOF'

        awx-manage shell <<'PYEOF'
        from awx.main.models.execution_environments import ExecutionEnvironment
        from awx.conf.models import Setting

        EE_IMAGE="{{ ee_image }}"

        for ee in ExecutionEnvironment.objects.filter(id__in=[1,2]):
            ee.image = EE_IMAGE
            ee.pull = "always"
            ee.credential = None
            ee.save()
            print(f"Updated: {ee.id} {ee.name}")

        default_ee = ExecutionEnvironment.objects.get(id=1)

        Setting.objects.update_or_create(
            key="DEFAULT_EXECUTION_ENVIRONMENT",
            defaults={"value": default_ee.id}
        )

        print("Default EE updated")
        PYEOF

        EOF
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Restart AWX Task deployment after EE configuration
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - rollout
          - restart
          - deployment/awx-server-task
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Wait for AWX Task rollout after EE configuration
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - rollout
          - status
          - deployment/awx-server-task
          - -n
          - "{{ awx_namespace }}"
          - --timeout=10m
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # ============================================================
    # FINAL VALIDATION
    # ============================================================

    - name: Get final AWX pods
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - pods
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: final_awx_pods
      changed_when: false

    - name: Get final AWX service
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - service
          - awx-server-service
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: final_service
      changed_when: false

    - name: Get final AWX endpoints
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - endpoints
          - awx-server-service
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: final_endpoints
      changed_when: false

    - name: Get final AWX ingress
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - ingress
          - awx-ingress
          - -n
          - "{{ awx_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: final_ingress
      changed_when: false

    - name: Get final Operator pod
      ansible.builtin.command:
        argv:
          - "{{ k3s_binary_path }}"
          - kubectl
          - get
          - pods
          - -n
          - "{{ awx_namespace }}"
          - -l
          - control-plane=controller-manager
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: final_operator
      changed_when: false

    - name: Display final AWX installation summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SUCCESS - AWX INSTALLATION COMPLETE"
          - "============================================================"
          - "Host                    : ansible-server-01.vgs.com"
          - "IP                      : {{ vip }}"
          - "Namespace               : {{ awx_namespace }}"
          - "Operator Version        : {{ operator_version }}"
          - "K3s                     : Ready"
          - "Local Registry          : localhost:5000"
          - "Leader Lease Duration   : {{ leader_election_lease_duration }}"
          - "Leader Renew Deadline   : {{ leader_election_renew_deadline }}"
          - "AWX Service             : awx-server-service"
          - "Ingress                 : awx-ingress"
          - "AWX URL                 : http://{{ vip }}"
          - "VMware EE               : {{ ee_image }}"
          - "============================================================"
          - "OPERATOR"
          - "============================================================"
          - "{{ final_operator.stdout }}"
          - "============================================================"
          - "AWX PODS"
          - "============================================================"
          - "{{ final_awx_pods.stdout }}"
          - "============================================================"
          - "AWX SERVICE"
          - "============================================================"
          - "{{ final_service.stdout }}"
          - "============================================================"
          - "AWX ENDPOINTS"
          - "============================================================"
          - "{{ final_endpoints.stdout }}"
          - "============================================================"
          - "AWX INGRESS"
          - "============================================================"
          - "{{ final_ingress.stdout }}"
          - "============================================================"
          - "HTTP STATUS"
          - "============================================================"
          - "{{ awx_http.status | default('UNKNOWN') }}"
          - "============================================================"
