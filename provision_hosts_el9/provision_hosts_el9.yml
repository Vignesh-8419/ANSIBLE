---
- name: Prepare and recreate RockyOS 9 hosts in Foreman using API
  hosts: localhost
  connection: local
  gather_facts: no

  collections:
    - community.vmware

  vars:

    ###########################################################################
    # NETBOX
    ###########################################################################

    netbox_url: "https://netbox.vgs.com"
    netbox_token: "83fb0cec1adff8ff4f36c9185df6b9e2f07c7fcd"

    ###########################################################################
    # FOREMAN SERVER SELECTION
    #
    # AWX Survey:
    #
    # 1 = Frontend
    # 2 = Backend
    #
    ###########################################################################

    foreman_server: "{{ foreman_server | default('1', true) }}"

    foreman_url: >-
      {{
        {
          '1': 'https://rocky-08-01.vgs.com',
          '2': 'https://cent-07-01.vgs.com'
        }[foreman_server | string]
      }}

    foreman_user: "admin"
    foreman_api_token: "oUzg-aMfjcT3q_wZ8NRLfQ"

    host_root_pass: "Root@123"

    ###########################################################################
    # NETBOX CLUSTER
    ###########################################################################

    cluster_name: "rocky-9-servers"

    ###########################################################################
    # TARGET HOSTS
    #
    # Example:
    #
    # target_hosts: "rocky-09-01,rocky-09-02"
    #
    ###########################################################################

    target_servers: "{{ target_hosts.split(',') | map('trim') | list }}"

    ###########################################################################
    # FOREMAN ORGANIZATION / LOCATION
    ###########################################################################

    org_id: 1
    loc_id: 2

    ###########################################################################
    # Rocky Linux 9 Host Group / OS Selection
    #
    # AWX Survey:
    #
    # 1 = RockyLinux9.2-SingleDisk
    # 2 = RockyLinux9.2-RAID
    # 3 = RockyLinux9.8-SingleDisk
    # 4 = RockyLinux9.8-RAID
    #
    ###########################################################################

    hostgroup: "{{ hostgroup | default('1', true) }}"

    hostgroup_id: >-
      {{
        {
          '1': 15,
          '2': 11,
          '3': 16,
          '4': 12
        }[hostgroup | string]
      }}

    operatingsystem_id: >-
      {{
        {
          '1': 16,
          '2': 15,
          '3': 18,
          '4': 17
        }[hostgroup | string]
      }}

    medium_id: >-
      {{
        {
          '1': 17,
          '2': 17,
          '3': 18,
          '4': 18
        }[hostgroup | string]
      }}

    ###########################################################################
    # FOREMAN PROVISIONING SETTINGS
    ###########################################################################

    ptable_id: 126

    subnet_name: "vgs-subnet-rockyos"

    architecture_id: 1
    domain_id: 1

    pxe_loader: "Grub2 UEFI"

    ###########################################################################
    # KATELLO CONTENT
    #
    # 1 = Rocky9.2-CV
    # 2 = Rocky9.2-CV
    # 3 = Rocky9.8-CV
    # 4 = Rocky9.8-CV
    #
    ###########################################################################

    content_view_id: >-
      {{
        {
          '1': 4,
          '2': 4,
          '3': 5,
          '4': 5
        }[hostgroup | string]
      }}

    lifecycle_environment_id: 1

  tasks:

    ###########################################################################
    # SHOW SELECTED CONFIGURATION
    ###########################################################################

    - name: Show selected Foreman configuration
      debug:
        msg:
          - "============================================================"
          - "FOREMAN HOST RECREATE CONFIGURATION"
          - "============================================================"
          - "Foreman URL     : {{ foreman_url }}"
          - "Cluster         : {{ cluster_name }}"
          - "Hostgroup Input : {{ hostgroup }}"
          - "Hostgroup ID    : {{ hostgroup_id }}"
          - "OS ID           : {{ operatingsystem_id }}"
          - "Medium ID       : {{ medium_id }}"
          - "Content View ID : {{ content_view_id }}"
          - "Lifecycle ID    : {{ lifecycle_environment_id }}"
          - "Subnet          : {{ subnet_name }}"
          - "Organization ID : {{ org_id }}"
          - "Location ID     : {{ loc_id }}"
          - "============================================================"

    ###########################################################################
    # GET DEVICES FROM NETBOX
    ###########################################################################

    - name: Get devices from NetBox cluster
      uri:
        url: "{{ netbox_url }}/api/dcim/devices/?cluster={{ cluster_name }}"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
        validate_certs: no
        status_code: 200
      register: netbox_devices

    - name: Show devices returned by NetBox
      debug:
        msg: "{{ netbox_devices.json.results | map(attribute='name') | list }}"

    ###########################################################################
    # FILTER SELECTED HOSTS
    ###########################################################################

    - name: Initialize filtered device list
      set_fact:
        filtered_devices: []

    - name: Filter devices by hostname
      set_fact:
        filtered_devices: "{{ filtered_devices + [item] }}"
      loop: "{{ netbox_devices.json.results }}"
      when:
        - item.name.split('.')[0] in target_servers

    - name: Show filtered devices
      debug:
        msg: "{{ filtered_devices | map(attribute='name') | list }}"

    - name: Fail if no hosts matched
      fail:
        msg: >-
          No matching hosts found in NetBox.
          Requested hosts: {{ target_servers | join(', ') }}
      when: filtered_devices | length == 0

    ###########################################################################
    # GET VM INFORMATION FROM ESXI
    ###########################################################################

    - name: Get VM information from ESXi
      community.vmware.vmware_guest_info:
        hostname: "192.168.253.128"
        username: "root"
        password: "Root@123"
        validate_certs: false
        name: "{{ item.name.split('.')[0] }}"
      loop: "{{ filtered_devices }}"
      register: vm_info

    ###########################################################################
    # GET IP ADDRESSES FROM NETBOX
    ###########################################################################

    - name: Get IP addresses from NetBox
      uri:
        url: "{{ netbox_url }}/api/ipam/ip-addresses/?limit=0"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
        validate_certs: no
        status_code: 200
      register: netbox_ips

    ###########################################################################
    # BUILD HOST INFORMATION
    ###########################################################################

    - name: Initialize host info
      set_fact:
        host_info: []

    - name: Build host info
      set_fact:
        host_info: >-
          {{
            host_info + [
              {
                'name': item.0.name,
                'ip': (
                  netbox_ips.json.results
                  | selectattr(
                      'assigned_object.device.name',
                      'equalto',
                      item.0.name
                    )
                  | map(attribute='address')
                  | map('regex_replace', '/.*$', '')
                  | first
                  | default('')
                ),
                'mac': (
                  item.1.instance.hw_eth0.macaddress
                  | default('')
                )
              }
            ]
          }}
      loop: "{{ filtered_devices | zip(vm_info.results) | list }}"

    - name: Show host information
      debug:
        var: host_info

    ###########################################################################
    # VALIDATE HOST INFORMATION
    ###########################################################################

    - name: Verify host IP addresses
      fail:
        msg: "IP address not found for host: {{ item.name }}"
      loop: "{{ host_info }}"
      when: item.ip | length == 0

    - name: Verify host MAC addresses
      fail:
        msg: "MAC address not found for host: {{ item.name }}"
      loop: "{{ host_info }}"
      when: item.mac | length == 0

    ###########################################################################
    # CHECK WHETHER HOST EXISTS IN FOREMAN
    ###########################################################################

    - name: Check if host exists in Foreman
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.name }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code:
          - 200
          - 404
      loop: "{{ host_info }}"
      register: foreman_hosts

    - name: Show existing Foreman hosts
      debug:
        msg:
          - "Host   : {{ item.item.name }}"
          - "Status : {{ item.status }}"
          - "Host ID: {{ item.json.id | default('NOT FOUND') }}"
      loop: "{{ foreman_hosts.results }}"

    ###########################################################################
    # DELETE EXISTING HOSTS
    #
    # If the host exists:
    #
    # GET /api/hosts/name -> 200
    # DELETE /api/hosts/ID
    #
    ###########################################################################

    - name: Delete existing host from Foreman
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.json.id }}"
        method: DELETE
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code:
          - 200
          - 202
          - 204
      loop: "{{ foreman_hosts.results }}"
      when: item.status == 200
      register: foreman_delete

    - name: Show deleted Foreman hosts
      debug:
        msg: >-
          Deleted existing Foreman host:
          {{ item.item.item.name }}
      loop: "{{ foreman_delete.results | default([]) }}"
      when:
        - item is not skipped
        - item.status is defined

    ###########################################################################
    # WAIT FOR FOREMAN DELETE OPERATION
    ###########################################################################

    - name: Wait briefly after Foreman host deletion
      pause:
        seconds: 3
      when: foreman_delete is defined

    ###########################################################################
    # VERIFY OLD HOST IS GONE
    ###########################################################################

    - name: Verify existing host was deleted
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.name }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code:
          - 200
          - 404
      loop: "{{ host_info }}"
      register: foreman_hosts_after_delete

    - name: Fail if host still exists after delete
      fail:
        msg: "Foreman host still exists after deletion: {{ item.item.name }}"
      loop: "{{ foreman_hosts_after_delete.results }}"
      when: item.status == 200

    ###########################################################################
    # RESOLVE FOREMAN SUBNET
    ###########################################################################

    - name: Get Foreman subnet
      uri:
        url: "{{ foreman_url }}/api/subnets?search=name={{ subnet_name | urlencode }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code: 200
      register: foreman_subnets

    - name: Resolve Foreman subnet ID
      set_fact:
        subnet_id: >-
          {{
            foreman_subnets.json.results
            | selectattr('name', 'equalto', subnet_name)
            | map(attribute='id')
            | first
            | default('')
          }}

    - name: Verify Foreman subnet
      fail:
        msg: "Foreman subnet not found: {{ subnet_name }}"
      when: subnet_id | string | length == 0

    - name: Show Foreman subnet
      debug:
        msg:
          - "Subnet Name : {{ subnet_name }}"
          - "Subnet ID   : {{ subnet_id }}"

    ###########################################################################
    # CREATE ALL HOSTS IN FOREMAN
    #
    # At this point:
    #
    # - Existing hosts have been deleted
    # - Missing hosts remain missing
    #
    # Therefore every host in host_info is created fresh.
    #
    ###########################################################################

    - name: Create fresh host in Foreman
      uri:
        url: "{{ foreman_url }}/api/hosts"
        method: POST
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120

        status_code:
          - 200
          - 201

        headers:
          Content-Type: application/json

        body_format: json

        body:
          host:
            name: "{{ item.name }}"

            organization_id: "{{ org_id }}"
            location_id: "{{ loc_id }}"

            hostgroup_id: "{{ hostgroup_id }}"
            operatingsystem_id: "{{ operatingsystem_id }}"
            medium_id: "{{ medium_id }}"
            ptable_id: "{{ ptable_id }}"
            architecture_id: "{{ architecture_id }}"

            subnet_id: "{{ subnet_id }}"
            domain_id: "{{ domain_id }}"

            build: true
            pxe_loader: "{{ pxe_loader }}"
            root_pass: "{{ host_root_pass }}"

            content_facet_attributes:
              content_view_id: "{{ content_view_id }}"
              lifecycle_environment_id: "{{ lifecycle_environment_id }}"

            interfaces_attributes:
              - type: interface
                mac: "{{ item.mac | replace('\\:', ':') }}"
                ip: "{{ item.ip }}"
                subnet_id: "{{ subnet_id }}"
                domain_id: "{{ domain_id }}"
                primary: true
                provision: true
                managed: true

      loop: "{{ host_info }}"
      register: foreman_create

    ###########################################################################
    # SHOW CREATE RESULTS
    ###########################################################################

    - name: Show Foreman create results
      debug:
        msg:
          - "Host : {{ item.item.name }}"
          - "IP   : {{ item.item.ip }}"
          - "Status : {{ item.status }}"
          - "Result : {{ item.json.message | default('Created successfully') }}"
      loop: "{{ foreman_create.results }}"

    ###########################################################################
    # REFRESH NEWLY CREATED HOST INFORMATION
    ###########################################################################

    - name: Refresh newly created Foreman host information
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.name }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code: 200
      loop: "{{ host_info }}"
      register: final_hosts

    ###########################################################################
    # SHOW FINAL HOST CONFIGURATION
    ###########################################################################

    - name: Show final host configuration
      debug:
        msg:
          - "============================================================"
          - "Host       : {{ item.json.name }}"
          - "Host ID    : {{ item.json.id }}"
          - "Host Group : {{ item.json.hostgroup_name | default('N/A') }}"
          - "OS         : {{ item.json.operatingsystem_name | default('N/A') }}"
          - "Medium     : {{ item.json.medium_name | default('N/A') }}"
          - "Subnet     : {{ item.json.subnet_name | default('N/A') }}"
          - "IP         : {{ item.json.ip | default('N/A') }}"
          - "PXE Loader : {{ item.json.pxe_loader | default('N/A') }}"
          - "Build      : {{ item.json.build }}"
          - "Status     : {{ item.json.build_status_label | default('N/A') }}"
          - "============================================================"
      loop: "{{ final_hosts.results }}"

    ###########################################################################
    # FINAL SUCCESS SUMMARY
    ###########################################################################

    - name: Final success summary
      debug:
        msg:
          - "============================================================"
          - "FOREMAN HOST RECREATE COMPLETED SUCCESSFULLY"
          - "============================================================"
          - "Hosts processed : {{ host_info | length }}"
          - "Foreman URL     : {{ foreman_url }}"
          - "Hostgroup ID    : {{ hostgroup_id }}"
          - "OS ID           : {{ operatingsystem_id }}"
          - "Medium ID       : {{ medium_id }}"
          - "============================================================"
