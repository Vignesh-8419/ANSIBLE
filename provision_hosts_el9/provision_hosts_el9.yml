---
- name: Prepare and recreate ROCKY LINUX 9 hosts in Foreman using API
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - community.vmware

  vars:

    ###########################################################################
    # ESXi
    ###########################################################################

    esxi_hostname: "192.168.253.128"
    esxi_username: "root"
    esxi_password: "Root@123"


    ###########################################################################
    # NETBOX
    ###########################################################################

    netbox_url: "https://netbox.vgs.com"
    netbox_token: "83fb0cec1adff8ff4f36c9185df6b9e2f07c7fcd"

    cluster_name: "rocky-9-servers"


    ###########################################################################
    # FOREMAN SERVER SELECTION
    #
    # AWX Survey:
    #
    # 1 = Frontend Foreman
    # 2 = Backend Foreman
    ###########################################################################

    foreman_server: "{{ foreman_server | default('1', true) }}"

    foreman_url: >-
      {{
        {
          '1': 'https://rocky-08-01.vgs.com',
          '2': 'https://cent-07-01.vgs.com'
        }[foreman_server | string]
      }}

    foreman_user: "admin"
    foreman_api_token: "_bkE_ov7gKb68d3aR01m5A"


    ###########################################################################
    # HOST SETTINGS
    ###########################################################################

    host_root_pass: "Root@123"


    ###########################################################################
    # AWX SURVEY - TARGET HOSTS
    #
    # Examples:
    #
    # rocky-09-01
    # rocky-09-01,rocky-09-02
    #
    # Leave empty to process all hosts.
    ###########################################################################

    target_hosts: "{{ target_hosts | default('', true) }}"

    target_servers: >-
      {{
        target_hosts.split(',')
        | map('trim')
        | reject('equalto', '')
        | list
      }}


    ###########################################################################
    # FOREMAN ORGANIZATION / LOCATION
    ###########################################################################

    org_id: 1
    loc_id: 2


    ###########################################################################
    # ROCKY LINUX 9 HOSTGROUP SELECTION
    #
    # AWX Survey:
    #
    # 1 = RockyLinux9-SingleDisk
    # 2 = RockyLinux9-RAID
    ###########################################################################

    hostgroup: "{{ hostgroup | default('1', true) }}"


    ###########################################################################
    # ROCKY 9 HOSTGROUP ID
    #
    # CHANGE THESE TO YOUR ACTUAL FOREMAN IDs
    #
    # Example:
    #
    # 1 = SingleDisk
    # 2 = RAID
    ###########################################################################

    hostgroup_id: >-
      {{
        {
          '1': 0,
          '2': 0
        }[hostgroup | string]
      }}


    # ============================================================================
    # Rocky Linux 9.2 Host Group / Operating System Selection
    #
    # AWX Survey:
    #
    # 1 = RockyLinux9.2-SingleDisk
    #     OS = RockyLinux9.2-SingleDisk 9.2
    #
    # 2 = RockyLinux9.2-RAID
    #     OS = RockyLinux9.2-RAID 9.2
    #
    # ============================================================================
    
    hostgroup: "{{ hostgroup | default('1', true) }}"
    
    hostgroup_id: >-
      {{
        {
          '1': 7,
          '2': 3
        }[hostgroup | string]
      }}
    
    operatingsystem_id: >-
      {{
        {
          '1': 7,
          '2': 6
        }[hostgroup | string]
      }}
    
    # Rocky 9.2 Remote
    medium_id: 17
    
    # Kickstart default
    ptable_id: 126
    
    # Rocky Linux 9.2 subnet
    subnet_name: "vgs-subnet-rockyos"
    
    # Katello Content
    content_view_id: 4
    lifecycle_environment_id: 1
    
    # Architecture
    architecture_id: 1
    
    # Domain
    domain_id: 1
    
    # PXE
    pxe_loader: "Grub2 UEFI"

    build: true


  tasks:

    ###########################################################################
    # VALIDATE SELECTION
    ###########################################################################

    - name: Validate hostgroup selection
      fail:
        msg: >-
          Invalid hostgroup '{{ hostgroup }}'.
          Valid values are:
          1 = RockyLinux9-SingleDisk
          2 = RockyLinux9-RAID
      when: hostgroup | string not in ['1', '2']


    - name: Validate Rocky 9 Foreman IDs are configured
      fail:
        msg: >-
          Rocky Linux 9 Foreman IDs are not configured correctly.
          Check hostgroup_id, operatingsystem_id, medium_id,
          ptable_id and content_view_id.
      when: >-
        hostgroup_id | int == 0
        or operatingsystem_id | int == 0
        or medium_id | int == 0
        or ptable_id | int == 0
        or content_view_id | int == 0


    ###########################################################################
    # SHOW SELECTED CONFIGURATION
    ###########################################################################

    - name: Show selected Rocky Linux 9 provisioning configuration
      debug:
        msg:
          - "============================================================"
          - "ROCKY LINUX 9 FOREMAN PROVISIONING"
          - "============================================================"
          - "Foreman Server        : {{ foreman_url }}"
          - "ESXi Server           : {{ esxi_hostname }}"
          - "Cluster               : {{ cluster_name }}"
          - "Target Hosts          : {{ target_hosts | default('ALL', true) }}"
          - "Hostgroup Selection   : {{ hostgroup }}"
          - "Hostgroup ID          : {{ hostgroup_id }}"
          - "Operating System ID   : {{ operatingsystem_id }}"
          - "Medium ID             : {{ medium_id }}"
          - "Partition Table ID    : {{ ptable_id }}"
          - "Subnet Name           : {{ subnet_name }}"
          - "Content View ID       : {{ content_view_id }}"
          - "Lifecycle Environment : {{ lifecycle_environment_id }}"
          - "Architecture ID       : {{ architecture_id }}"
          - "Domain ID             : {{ domain_id }}"
          - "PXE Loader            : {{ pxe_loader }}"
          - "Build                 : {{ build }}"
          - "============================================================"


    ###########################################################################
    # GET DEVICES FROM NETBOX
    ###########################################################################

    - name: Get devices from NetBox cluster
      uri:
        url: "{{ netbox_url }}/api/dcim/devices/?cluster={{ cluster_name | urlencode }}&limit=1000"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
        validate_certs: false
        use_proxy: false
        return_content: true
        status_code: 200
      register: netbox_devices


    - name: Show devices returned by NetBox
      debug:
        msg: "{{ netbox_devices.json.results | map(attribute='name') | list }}"


    ###########################################################################
    # FILTER SELECTED HOSTS
    ###########################################################################

    - name: Initialize filtered device list
      set_fact:
        filtered_devices: []


    - name: Use all devices when target_hosts is empty
      set_fact:
        filtered_devices: "{{ netbox_devices.json.results }}"
      when: target_servers | length == 0


    - name: Filter devices by hostname when target_hosts is specified
      set_fact:
        filtered_devices: "{{ filtered_devices + [item] }}"
      loop: "{{ netbox_devices.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - target_servers | length > 0
        - item.name.split('.')[0] in target_servers


    - name: Show filtered devices
      debug:
        msg: "{{ filtered_devices | map(attribute='name') | list }}"


    - name: Fail if no hosts matched
      fail:
        msg: "No matching hosts found in NetBox for target_hosts={{ target_hosts }}"
      when: filtered_devices | length == 0


    ###########################################################################
    # GET VM INFORMATION FROM ESXi
    ###########################################################################

    - name: Get VM information from ESXi
      community.vmware.vmware_guest_info:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        name: "{{ item.name.split('.')[0] }}"
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: vm_info


    ###########################################################################
    # GET IP ADDRESSES FROM NETBOX
    ###########################################################################

    - name: Get IP addresses from NetBox
      uri:
        url: "{{ netbox_url }}/api/ipam/ip-addresses/?limit=1000"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
        validate_certs: false
        use_proxy: false
        return_content: true
        status_code: 200
      register: netbox_ips


    ###########################################################################
    # BUILD HOST INFORMATION
    ###########################################################################

    - name: Initialize host information
      set_fact:
        host_info: []


    - name: Build host information
      set_fact:
        host_info: >-
          {{
            host_info + [
              {
                'name': item.0.name.split('.')[0],
                'netbox_name': item.0.name,
                'ip': (
                  netbox_ips.json.results
                  | selectattr('assigned_object', 'defined')
                  | selectattr('assigned_object', 'ne', none)
                  | selectattr('assigned_object.device', 'defined')
                  | selectattr('assigned_object.device', 'ne', none)
                  | selectattr(
                      'assigned_object.device.name',
                      'equalto',
                      item.0.name
                    )
                  | map(attribute='address')
                  | map('regex_replace', '/.*$', '')
                  | first
                  | default('')
                ),
                'mac': (
                  item.1.instance.hw_eth0.macaddress
                  | default('')
                )
              }
            ]
          }}
      loop: "{{ filtered_devices | zip(vm_info.results) | list }}"
      loop_control:
        label: "{{ item.0.name }}"


    - name: Show host information
      debug:
        var: host_info


    ###########################################################################
    # VALIDATE HOST INFORMATION
    ###########################################################################

    - name: Verify host IP addresses were found
      fail:
        msg: "No IP address found in NetBox for {{ item.name }}"
      loop: "{{ host_info }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.ip | length == 0


    - name: Verify host MAC addresses were found
      fail:
        msg: "No MAC address found from ESXi for {{ item.name }}"
      loop: "{{ host_info }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.mac | length == 0


    ###########################################################################
    # RESOLVE FOREMAN SUBNET
    ###########################################################################

    - name: Get Foreman subnet
      uri:
        url: "{{ foreman_url }}/api/subnets?search={{ ('name=' ~ subnet_name) | urlencode }}&per_page=1000"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: true
        validate_certs: false
        use_proxy: false
        timeout: 120
        status_code: 200
        return_content: true
      register: foreman_subnets


    - name: Resolve Foreman subnet ID
      set_fact:
        subnet_id: >-
          {{
            foreman_subnets.json.results
            | selectattr('name', 'equalto', subnet_name)
            | map(attribute='id')
            | first
            | default('')
          }}


    - name: Verify Foreman subnet
      fail:
        msg: "Foreman subnet not found: {{ subnet_name }}"
      when: subnet_id | string | length == 0


    - name: Show Foreman subnet
      debug:
        msg:
          - "Subnet Name : {{ subnet_name }}"
          - "Subnet ID   : {{ subnet_id }}"


    ###########################################################################
    # GET ALL FOREMAN HOSTS
    ###########################################################################

    - name: Get all Foreman hosts
      uri:
        url: "{{ foreman_url }}/api/hosts?per_page=1000"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: true
        validate_certs: false
        use_proxy: false
        timeout: 120
        status_code: 200
        return_content: true
      register: all_foreman_hosts


    - name: Show Foreman host count
      debug:
        msg: >-
          Total Foreman hosts returned:
          {{
            all_foreman_hosts.json.total
            | default(all_foreman_hosts.json.results | length)
          }}


    ###########################################################################
    # BUILD COMPLETE MATCHING HOST LIST
    #
    # Match:
    #
    # rocky-09-01
    # rocky-09-01.vgs.com
    ###########################################################################

    - name: Initialize Foreman hosts to delete
      set_fact:
        foreman_hosts_to_delete: []


    - name: Find all matching Foreman hosts locally
      set_fact:
        foreman_hosts_to_delete: >-
          {{
            foreman_hosts_to_delete +
            [
              {
                'target_name': item.0.name,
                'found_name': item.1.name,
                'id': item.1.id
              }
            ]
          }}
      loop: "{{ host_info | product(all_foreman_hosts.json.results) | list }}"
      loop_control:
        label: "{{ item.0.name }} -> {{ item.1.name }}"
      when: >-
        item.1.name == item.0.name
        or
        item.1.name == item.0.netbox_name
        or
        (
          item.1.name.split('.')[0] == item.0.name
        )


    - name: Remove duplicate Foreman deletion records
      set_fact:
        foreman_hosts_to_delete: >-
          {{
            foreman_hosts_to_delete
            | unique(attribute='id')
            | list
          }}


    - name: Show all matching existing Foreman hosts
      debug:
        msg: "{{ foreman_hosts_to_delete }}"


    ###########################################################################
    # DELETE EVERY MATCHING HOST
    ###########################################################################

    - name: Delete every matching existing Foreman host by numeric ID
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.id }}"
        method: DELETE
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: true
        validate_certs: false
        use_proxy: false
        timeout: 120
        status_code:
          - 200
          - 202
          - 204
        return_content: true
      loop: "{{ foreman_hosts_to_delete }}"
      loop_control:
        label: "{{ item.found_name }} (ID={{ item.id }})"
      register: foreman_delete
      when: foreman_hosts_to_delete | length > 0


    - name: Show deleted Foreman hosts
      debug:
        msg: >-
          Deleted Foreman host
          {{ item.item.found_name }}
          with ID {{ item.item.id }}
      loop: "{{ foreman_delete.results | default([]) }}"
      loop_control:
        label: "{{ item.item.found_name | default('unknown') }}"
      when:
        - item.item is defined
        - item.status is defined


    ###########################################################################
    # WAIT FOR DELETION
    ###########################################################################

    - name: Wait after Foreman host deletion
      pause:
        seconds: 5
      when: foreman_hosts_to_delete | length > 0


    ###########################################################################
    # REFRESH FOREMAN HOST LIST
    ###########################################################################

    - name: Refresh complete Foreman host list after deletion
      uri:
        url: "{{ foreman_url }}/api/hosts?per_page=1000"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: true
        validate_certs: false
        use_proxy: false
        timeout: 120
        status_code: 200
        return_content: true
      register: all_foreman_hosts_after_delete


    ###########################################################################
    # FINAL SHORT NAME / FQDN SAFETY CHECK
    ###########################################################################

    - name: Initialize final conflicting Foreman hostname list
      set_fact:
        final_name_conflicts: []


    - name: Find final short hostname and FQDN conflicts
      set_fact:
        final_name_conflicts: >-
          {{
            final_name_conflicts +
            [
              {
                'target_name': item.0.name,
                'found_name': item.1.name,
                'id': item.1.id
              }
            ]
          }}
      loop: "{{ host_info | product(all_foreman_hosts_after_delete.json.results) | list }}"
      loop_control:
        label: "{{ item.0.name }} -> {{ item.1.name }}"
      when:
        - item.1.name is defined
        - >-
          item.1.name == item.0.name
          or
          item.1.name == item.0.netbox_name
          or
          item.1.name.split('.')[0] == item.0.name


    - name: Remove duplicate final conflicts
      set_fact:
        final_name_conflicts: >-
          {{
            final_name_conflicts
            | unique(attribute='id')
            | list
          }}


    - name: Show final conflicting names
      debug:
        var: final_name_conflicts


    - name: Fail if short hostname or FQDN conflict remains
      fail:
        msg: >-
          A conflicting Foreman hostname still exists:
          Target={{ item.target_name }}
          Found={{ item.found_name }}
          ID={{ item.id }}
      loop: "{{ final_name_conflicts }}"
      loop_control:
        label: "{{ item.target_name }} -> {{ item.found_name }}"
      when: final_name_conflicts | length > 0


    ###########################################################################
    # CREATE ROCKY LINUX 9 HOSTS
    ###########################################################################

    - name: Create Rocky Linux 9 host in Foreman
      uri:
        url: "{{ foreman_url }}/api/hosts"
        method: POST
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: true
        validate_certs: false
        use_proxy: false
        timeout: 120

        status_code:
          - 200
          - 201

        headers:
          Content-Type: "application/json"

        body_format: json

        body:
          host:
            name: "{{ item.name }}"

            organization_id: "{{ org_id }}"
            location_id: "{{ loc_id }}"

            hostgroup_id: "{{ hostgroup_id }}"
            operatingsystem_id: "{{ operatingsystem_id }}"
            medium_id: "{{ medium_id }}"
            ptable_id: "{{ ptable_id }}"
            architecture_id: "{{ architecture_id }}"

            subnet_id: "{{ subnet_id }}"
            domain_id: "{{ domain_id }}"

            build: "{{ build }}"
            pxe_loader: "{{ pxe_loader }}"
            root_pass: "{{ host_root_pass }}"

            content_facet_attributes:
              content_view_id: "{{ content_view_id }}"
              lifecycle_environment_id: "{{ lifecycle_environment_id }}"

            interfaces_attributes:
              - type: "interface"
                mac: "{{ item.mac }}"
                ip: "{{ item.ip }}"
                subnet_id: "{{ subnet_id }}"
                domain_id: "{{ domain_id }}"
                primary: true
                provision: true
                managed: true

      loop: "{{ host_info }}"
      loop_control:
        label: "{{ item.name }}"
      register: foreman_create


    ###########################################################################
    # SHOW CREATE RESULTS
    ###########################################################################

    - name: Show Foreman create result
      debug:
        msg:
          - "============================================================"
          - "Host    : {{ item.item.name }}"
          - "IP      : {{ item.item.ip }}"
          - "MAC     : {{ item.item.mac }}"
          - "Status  : {{ item.status }}"
          - "Host ID : {{ item.json.id | default('UNKNOWN') }}"
          - "============================================================"
      loop: "{{ foreman_create.results }}"
      loop_control:
        label: "{{ item.item.name }}"


    ###########################################################################
    # VERIFY CREATED HOST IDs
    ###########################################################################

    - name: Verify Foreman returned a valid host ID
      fail:
        msg: >-
          Foreman created host {{ item.item.name }}
          but did not return a valid host ID.
      loop: "{{ foreman_create.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - item.json is not defined or item.json.id is not defined


    ###########################################################################
    # REFRESH CREATED HOSTS
    ###########################################################################

    - name: Refresh Foreman host information using created ID
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.json.id }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: true
        validate_certs: false
        use_proxy: false
        timeout: 120
        status_code: 200
        return_content: true
      loop: "{{ foreman_create.results }}"
      loop_control:
        label: "{{ item.item.name }} (ID={{ item.json.id }})"
      register: final_hosts


    ###########################################################################
    # SHOW FINAL CONFIGURATION
    ###########################################################################

    - name: Show final Rocky Linux 9 host configuration
      debug:
        msg:
          - "============================================================"
          - "Host       : {{ item.json.name }}"
          - "Host ID    : {{ item.json.id }}"
          - "Host Group : {{ item.json.hostgroup_name | default('N/A') }}"
          - "OS         : {{ item.json.operatingsystem_name | default('N/A') }}"
          - "Medium     : {{ item.json.medium_name | default('N/A') }}"
          - "Subnet     : {{ item.json.subnet_name | default('N/A') }}"
          - "IP         : {{ item.json.ip | default('N/A') }}"
          - "PXE Loader : {{ item.json.pxe_loader | default('N/A') }}"
          - "Build      : {{ item.json.build | default('N/A') }}"
          - "Status     : {{ item.json.build_status_label | default('N/A') }}"
          - "============================================================"
      loop: "{{ final_hosts.results }}"
      loop_control:
        label: "{{ item.json.name }}"


    ###########################################################################
    # FINAL SUCCESS MESSAGE
    ###########################################################################

    - name: Show completion message
      debug:
        msg:
          - "============================================================"
          - "ROCKY LINUX 9 FOREMAN RECREATION COMPLETED SUCCESSFULLY"
          - "============================================================"
          - "Hosts Processed       : {{ host_info | length }}"
          - "Existing hosts deleted: {{ foreman_hosts_to_delete | length }}"
          - "New hosts created     : {{ foreman_create.results | length }}"
          - "Hostgroup             : {{ hostgroup }}"
          - "PXE build mode        : {{ build }}"
          - "PXE Loader            : {{ pxe_loader }}"
          - "============================================================"
