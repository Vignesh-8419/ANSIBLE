---
# ============================================================
# PREPARE AND RECREATE ROCKY LINUX 9 HOSTS IN FOREMAN USING API
# ============================================================

- name: Prepare and recreate ROCKY LINUX 9 hosts in Foreman using API
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - community.vmware

  vars:

    ###########################################################################
    # ESXI
    ###########################################################################

    esxi_hostname: "192.168.253.128"
    esxi_username: "root"
    esxi_password: "Root@123"

    datacenter: "ha-datacenter"
    datastore: "datastore1"
    vm_network: "VM Network"
    folder: "/"

    ###########################################################################
    # NETBOX
    ###########################################################################

    netbox_url: "https://192.168.253.143"
    netbox_token: "83fb0cec1adff8ff4f36c9185df6b9e2f07c7fcd"

    ###########################################################################
    # CLUSTER
    ###########################################################################

    cluster_name: "rocky-9-servers"

    ###########################################################################
    # TARGET HOSTS
    #
    # Examples:
    #
    # rocky-09-01
    # rocky-09-01,rocky-09-02
    # rocky-09-*
    #
    # Empty = all matching Rocky 9 hosts
    ###########################################################################

    target_hosts: "{{ target_hosts | default('', true) }}"

    ###########################################################################
    # HOSTGROUP / DISK SELECTION
    #
    # 1 = SingleDisk
    #     1 x 100 GB
    #
    # 2 = RAID
    #     2 x 100 GB
    ###########################################################################

    hostgroup: "{{ hostgroup | default('1', true) }}"

    ###########################################################################
    # FOREMAN
    #
    # Keep each variable defined ONLY ONCE.
    ###########################################################################

    foreman_server: "{{ foreman_server | default('1', true) }}"

    rocky9_hostgroup_single_id: 7
    rocky9_hostgroup_raid_id: 7

    rocky9_operatingsystem_id: 7
    rocky9_medium_id: 17
    rocky9_partition_table_id: 126
    rocky9_subnet_name: "vgs-subnet-rockyos"
    rocky9_content_view_id: 4
    rocky9_lifecycle_environment_id: 1
    rocky9_architecture_id: 1
    rocky9_domain_id: 1

    ###########################################################################
    # VM HARDWARE
    ###########################################################################

    vm_memory_mb: 4096
    vm_num_cpus: 4
    vm_num_cpu_cores_per_socket: 2

    vm_disk_size_gb: 100

    vm_guest_id: "rhel9_64Guest"
    vm_boot_firmware: "efi"

  tasks:

    ###########################################################################
    # VALIDATE HOSTGROUP
    ###########################################################################

    - name: Validate hostgroup selection
      ansible.builtin.fail:
        msg: >-
          Invalid hostgroup '{{ hostgroup }}'.
          Valid values:
          1 = SingleDisk
          2 = RAID
      when: hostgroup | string not in ['1', '2']

    ###########################################################################
    # SET FOREMAN HOSTGROUP ID
    ###########################################################################

    - name: Set selected Rocky 9 Foreman hostgroup ID
      ansible.builtin.set_fact:
        selected_hostgroup_id: >-
          {{
            rocky9_hostgroup_single_id
            if hostgroup | string == '1'
            else rocky9_hostgroup_raid_id
          }}

    ###########################################################################
    # BUILD DISK CONFIGURATION
    ###########################################################################

    - name: Set disk count
      ansible.builtin.set_fact:
        disk_count: "{{ 1 if hostgroup | string == '1' else 2 }}"

    - name: Set disk layout
      ansible.builtin.set_fact:
        disk_layout: "{{ 'SingleDisk' if hostgroup | string == '1' else 'RAID' }}"

    - name: Build VM disk configuration
      ansible.builtin.set_fact:
        vm_disks: >-
          {{
            [
              {
                'size_gb': vm_disk_size_gb | int,
                'datastore': datastore,
                'type': 'thin'
              }
            ]
            +
            (
              [
                {
                  'size_gb': vm_disk_size_gb | int,
                  'datastore': datastore,
                  'type': 'thin'
                }
              ]
              if hostgroup | string == '2'
              else []
            )
          }}

    ###########################################################################
    # SHOW CONFIGURATION
    ###########################################################################

    - name: Show selected Rocky Linux 9 provisioning configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ROCKY LINUX 9 FOREMAN PROVISIONING"
          - "============================================================"
          - "ESXi Server           : {{ esxi_hostname }}"
          - "Cluster               : {{ cluster_name }}"
          - "Target Hosts          : {{ target_hosts | default('ALL', true) }}"
          - "Hostgroup Selection   : {{ hostgroup }}"
          - "Hostgroup ID          : {{ selected_hostgroup_id }}"
          - "Operating System ID   : {{ rocky9_operatingsystem_id }}"
          - "Medium ID             : {{ rocky9_medium_id }}"
          - "Partition Table ID    : {{ rocky9_partition_table_id }}"
          - "Subnet Name           : {{ rocky9_subnet_name }}"
          - "Content View ID       : {{ rocky9_content_view_id }}"
          - "Lifecycle Environment : {{ rocky9_lifecycle_environment_id }}"
          - "Architecture ID       : {{ rocky9_architecture_id }}"
          - "Domain ID             : {{ rocky9_domain_id }}"
          - "PXE Loader            : Grub2 UEFI"
          - "Build                 : True"
          - "Disk Layout           : {{ disk_layout }}"
          - "Disk Count            : {{ disk_count }}"
          - "============================================================"

    ###########################################################################
    # GET DEVICES FROM NETBOX
    ###########################################################################

    - name: Get devices from NetBox cluster
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/dcim/devices/?cluster={{ cluster_name | urlencode }}&limit=1000"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
          Accept: "application/json"
        validate_certs: false
        use_proxy: false
        return_content: true
        status_code: 200
      register: netbox_devices

    - name: Show devices returned by NetBox
      ansible.builtin.debug:
        msg: "{{ netbox_devices.json.results | map(attribute='name') | list }}"

    - name: Fail if NetBox returned no devices
      ansible.builtin.fail:
        msg: "No devices returned from NetBox."
      when: netbox_devices.json.results | length == 0

    ###########################################################################
    # INITIALIZE FILTERED DEVICE LIST
    ###########################################################################

    - name: Initialize filtered device list
      ansible.builtin.set_fact:
        filtered_devices: []

    - name: Use all devices when target_hosts is empty
      ansible.builtin.set_fact:
        filtered_devices: "{{ netbox_devices.json.results }}"
      when: target_hosts | trim | length == 0

    - name: Filter devices by hostname when target_hosts is specified
      ansible.builtin.set_fact:
        filtered_devices: "{{ filtered_devices + [item] }}"
      loop: "{{ netbox_devices.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - target_hosts | trim | length > 0
        - >
          item.name.split('.')[0]
          in
          (
            target_hosts.split(',')
            | map('trim')
            | reject('equalto', '')
            | list
          )

    - name: Show filtered devices
      ansible.builtin.debug:
        msg: "{{ filtered_devices | map(attribute='name') | list }}"

    - name: Fail if no hosts matched
      ansible.builtin.fail:
        msg: >-
          No hosts matched target_hosts '{{ target_hosts }}'.
          Available hosts:
          {{ netbox_devices.json.results | map(attribute='name') | list }}
      when: filtered_devices | length == 0

    ###########################################################################
    # GET VM INFORMATION FROM ESXI
    #
    # IMPORTANT:
    # A missing VM is EXPECTED.
    # vmware_guest_info returns an error for a non-existing VM.
    # failed_when: false prevents the playbook from stopping.
    ###########################################################################

    - name: Get VM information from ESXi
      community.vmware.vmware_guest_info:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        datacenter: "{{ datacenter }}"
        name: "{{ item.name.split('.')[0] }}"
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: vm_lookup
      failed_when: false
      changed_when: false

    ###########################################################################
    # SHOW VM EXISTENCE STATUS
    ###########################################################################

    - name: Show VM existence status
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VM EXISTENCE CHECK"
          - "============================================================"
          - "VM     : {{ item.item.name.split('.')[0] }}"
          - "Exists : {{ item.instance is defined }}"
          - "Status : {{ 'EXISTS' if item.instance is defined else 'MISSING - WILL BE CREATED' }}"
          - "Message: {{ item.msg | default('VM information retrieved successfully') }}"
          - "============================================================"
      loop: "{{ vm_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    ###########################################################################
    # CREATE ONLY MISSING VMS
    ###########################################################################

    - name: Create missing VMs
      community.vmware.vmware_guest:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false

        datacenter: "{{ datacenter }}"
        folder: "{{ folder }}"
        datastore: "{{ datastore }}"

        name: "{{ item.item.name.split('.')[0] }}"
        state: present

        guest_id: "{{ vm_guest_id }}"

        hardware:
          memory_mb: "{{ vm_memory_mb | int }}"
          num_cpus: "{{ vm_num_cpus | int }}"
          num_cpu_cores_per_socket: "{{ vm_num_cpu_cores_per_socket | int }}"
          boot_firmware: "{{ vm_boot_firmware }}"

        disk: "{{ vm_disks }}"

        networks:
          - name: "{{ vm_network }}"
            start_connected: true
            device_type: vmxnet3

      loop: "{{ vm_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.instance is not defined
      register: vm_create

    ###########################################################################
    # BUILD NEWLY CREATED VM LIST
    ###########################################################################

    - name: Initialize created VM list
      ansible.builtin.set_fact:
        created_vm_names: []

    - name: Build newly created VM list
      ansible.builtin.set_fact:
        created_vm_names: >-
          {{
            created_vm_names +
            [item.item.item.name.split('.')[0]]
          }}
      loop: "{{ vm_create.results | default([]) }}"
      loop_control:
        label: "{{ item.item.item.name | default('UNKNOWN') }}"
      when:
        - item.changed | default(false)
        - item.item is defined
        - item.item.item is defined

    - name: Show newly created VMs
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NEWLY CREATED VMS"
          - "============================================================"
          - "{{ created_vm_names }}"
          - "============================================================"

    ###########################################################################
    # POWER ON ONLY NEWLY CREATED VMS
    ###########################################################################

    - name: Power on newly created VMs
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        datacenter: "{{ datacenter }}"
        name: "{{ item }}"
        state: powered-on
      loop: "{{ created_vm_names }}"
      loop_control:
        label: "{{ item }}"
      when: created_vm_names | length > 0

    - name: Wait for MAC address initialization
      ansible.builtin.pause:
        seconds: 10
      when: created_vm_names | length > 0

    ###########################################################################
    # POWER OFF ONLY NEWLY CREATED VMS
    ###########################################################################

    - name: Power off newly created VMs
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        datacenter: "{{ datacenter }}"
        name: "{{ item }}"
        state: powered-off
      loop: "{{ created_vm_names }}"
      loop_control:
        label: "{{ item }}"
      when: created_vm_names | length > 0

    ###########################################################################
    # GET VM INFORMATION BEFORE DISK CHECK
    ###########################################################################

    - name: Get VM information before checking disks
      community.vmware.vmware_guest_info:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        datacenter: "{{ datacenter }}"
        name: "{{ item.name.split('.')[0] }}"
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: vm_info_before_disk

    ###########################################################################
    # SHOW CURRENT DISK COUNT
    #
    # Same logic as your working Rocky Linux 8 playbook.
    ###########################################################################

    - name: Show current VM disk count
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VM DISK CHECK"
          - "============================================================"
          - "VM            : {{ item.item.name.split('.')[0] }}"
          - "Current Disks : {{ item.instance.hw_files | default([]) | select('search', '\\.vmdk$') | list | length }}"
          - "Required      : {{ disk_count }}"
          - "Disk Layout   : {{ disk_layout }}"
          - "============================================================"
      loop: "{{ vm_info_before_disk.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    ###########################################################################
    # ADD MISSING SECOND DISK FOR RAID
    ###########################################################################

    - name: Add missing second disk for RAID
      community.vmware.vmware_guest_disk:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false

        datacenter: "{{ datacenter }}"
        folder: "{{ folder }}"
        name: "{{ item.item.name.split('.')[0] }}"

        disk:
          - state: present
            size_gb: "{{ vm_disk_size_gb | int }}"
            type: thin
            datastore: "{{ datastore }}"
            scsi_controller: 0
            unit_number: 1

      loop: "{{ vm_info_before_disk.results }}"
      loop_control:
        label: "{{ item.item.name }}"

      when:
        - disk_count | int == 2
        - item.instance.hw_files | default([]) | select('search', '\\.vmdk$') | list | length < 2

    ###########################################################################
    # GET FINAL VM INFORMATION
    ###########################################################################

    - name: Get final VM information
      community.vmware.vmware_guest_info:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        datacenter: "{{ datacenter }}"
        name: "{{ item.name.split('.')[0] }}"
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: final_vm_info

    ###########################################################################
    # SHOW FINAL VM INFORMATION
    ###########################################################################

    - name: Show final VM information
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL VM INFORMATION"
          - "============================================================"
          - "VM Name       : {{ item.instance.hw_name | default(item.item.name.split('.')[0]) }}"
          - "Power         : {{ item.instance.hw_power_status | default('N/A') }}"
          - "MAC           : {{ item.instance.hw_eth0.macaddress | default('N/A') }}"
          - "CPU           : {{ item.instance.hw_processor_count | default('N/A') }}"
          - "Memory MB     : {{ item.instance.hw_memtotal_mb | default('N/A') }}"
          - "Disk Count    : {{ item.instance.hw_files | default([]) | select('search', '\\.vmdk$') | list | length }}"
          - "Disk Layout   : {{ disk_layout }}"
          - "Expected Disks: {{ disk_count }}"
          - "============================================================"
      loop: "{{ final_vm_info.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    ###########################################################################
    # VERIFY ALL DISK REQUIREMENTS
    #
    # FIX:
    # Use final_vm_info because final_vm_disk_info does not exist in this
    # Rocky 9 version.
    ###########################################################################

    - name: Fail if any VM does not have required disk count
      ansible.builtin.fail:
        msg: >-
          VM '{{ item.item.name.split('.')[0] }}' does not have the required
          number of disks. Actual:
          {{ item.instance.hw_files | default([]) | select('search', '\\.vmdk$') | list | length }},
          Required: {{ disk_count }}
      loop: "{{ final_vm_info.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: >
        (
          item.instance.hw_files
          | default([])
          | select('search', '\.vmdk$')
          | list
          | length
          | int
        ) < (disk_count | int)

    ###########################################################################
    # SUMMARY
    ###########################################################################

    - name: Show final result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ROCKY LINUX 9 VM ENSURE COMPLETED SUCCESSFULLY"
          - "============================================================"
          - "Cluster              : {{ cluster_name }}"
          - "Selected VMs         : {{ filtered_devices | length }}"
          - "New VMs Created      : {{ created_vm_names | length }}"
          - "Disk Layout          : {{ disk_layout }}"
          - "Disk Count per VM    : {{ disk_count }}"
          - "Disk Size            : {{ vm_disk_size_gb }} GB"
          - "Firmware             : {{ vm_boot_firmware }}"
          - "Guest ID             : {{ vm_guest_id }}"
          - "============================================================"
