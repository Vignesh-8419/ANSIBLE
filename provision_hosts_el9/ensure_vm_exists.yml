---
# ============================================================
# ENSURE SELECTED ROCKY LINUX 9 VMS EXIST ON ESXI
# ============================================================

- name: Ensure selected Rocky Linux 9 VMs exist on ESXi
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - community.vmware

  vars:

    ###########################################################################
    # NETBOX
    ###########################################################################

    netbox_url: "https://netbox.vgs.com"
    netbox_token: "83fb0cec1adff8ff4f36c9185df6b9e2f07c7fcd"

    ###########################################################################
    # CLUSTER
    ###########################################################################

    cluster_name: "rocky-9-servers"

    ###########################################################################
    # AWX SURVEY - TARGET HOSTS
    #
    # Examples:
    #
    # rocky-09-01
    # rocky-09-01,rocky-09-02
    # rocky-09-*
    #
    # Empty = ALL hosts in cluster
    ###########################################################################

    target_hosts: "{{ target_hosts | default('', true) }}"

    ###########################################################################
    # AWX SURVEY - HOSTGROUP
    #
    # 1 = SingleDisk
    #     1 x 100 GB disk
    #
    # 2 = RAID
    #     2 x 100 GB disks
    ###########################################################################

    hostgroup: "{{ hostgroup | default('1', true) }}"

    ###########################################################################
    # VM HARDWARE
    ###########################################################################

    vm_memory_mb: 4096
    vm_num_cpus: 4
    vm_num_cpu_cores_per_socket: 2

    vm_disk_size_gb: 100

    # Rocky Linux 9
    vm_guest_id: "rhel9_64Guest"

    # UEFI
    vm_boot_firmware: "efi"

    # Defaults
    default_datacenter: "Datacenter"
    default_datastore: "datastore1"
    default_vm_network: "VM Network"
    default_vm_folder: "vm"

  tasks:

    ###########################################################################
    # VALIDATE HOSTGROUP
    ###########################################################################

    - name: Validate hostgroup selection
      fail:
        msg: >-
          Invalid hostgroup '{{ hostgroup }}'.
          Valid values:
          1 = SingleDisk
          2 = RAID
      when: hostgroup | string not in ['1', '2']

    ###########################################################################
    # BUILD DISK CONFIGURATION
    ###########################################################################

    - name: Set disk count
      set_fact:
        disk_count: "{{ 1 if hostgroup | string == '1' else 2 }}"

    - name: Set disk layout
      set_fact:
        disk_layout: "{{ 'SingleDisk' if hostgroup | string == '1' else 'RAID' }}"

    ###########################################################################
    # SHOW BASIC CONFIGURATION
    ###########################################################################

    - name: Show selected VM configuration
      debug:
        msg:
          - "============================================================"
          - "ENSURE ROCKY LINUX 9 VMS EXIST ON ESXI"
          - "============================================================"
          - "NetBox Server      : {{ netbox_url }}"
          - "Cluster            : {{ cluster_name }}"
          - "Target Hosts       : {{ target_hosts | default('ALL', true) }}"
          - "Hostgroup          : {{ hostgroup }}"
          - "Disk Layout        : {{ disk_layout }}"
          - "Disk Count         : {{ disk_count }}"
          - "Disk Size          : {{ vm_disk_size_gb }} GB"
          - "Memory             : {{ vm_memory_mb }} MB"
          - "CPUs               : {{ vm_num_cpus }}"
          - "Cores per Socket   : {{ vm_num_cpu_cores_per_socket }}"
          - "Firmware           : {{ vm_boot_firmware }}"
          - "Guest ID           : {{ vm_guest_id }}"
          - "============================================================"

    ###########################################################################
    # GET CLUSTER FROM NETBOX
    ###########################################################################

    - name: Get NetBox cluster
      uri:
        url: "{{ netbox_url }}/api/virtualization/clusters/?name={{ cluster_name | urlencode }}&limit=100"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
          Accept: "application/json"
        validate_certs: false
        use_proxy: false
        return_content: true
        status_code: 200
      register: netbox_cluster_result

    - name: Resolve NetBox cluster ID
      set_fact:
        cluster_id: >-
          {{
            netbox_cluster_result.json.results
            | selectattr('name', 'equalto', cluster_name)
            | map(attribute='id')
            | first
            | default('')
          }}

    - name: Fail if NetBox cluster does not exist
      fail:
        msg: "NetBox cluster not found: '{{ cluster_name }}'"
      when: cluster_id | string | length == 0

    - name: Show resolved NetBox cluster
      debug:
        msg:
          - "============================================================"
          - "NETBOX CLUSTER"
          - "============================================================"
          - "Cluster Name : {{ cluster_name }}"
          - "Cluster ID   : {{ cluster_id }}"
          - "============================================================"

    ###########################################################################
    # GET DEVICES FROM EXACT CLUSTER
    ###########################################################################

    - name: Get devices from exact NetBox cluster
      uri:
        url: "{{ netbox_url }}/api/dcim/devices/?cluster_id={{ cluster_id }}&limit=1000"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
          Accept: "application/json"
        validate_certs: false
        use_proxy: false
        return_content: true
        status_code: 200
      register: netbox_devices

    - name: Show devices returned by NetBox
      debug:
        msg:
          - "============================================================"
          - "DEVICES IN CLUSTER: {{ cluster_name }}"
          - "============================================================"
          - "{{ netbox_devices.json.results | map(attribute='name') | list }}"
          - "============================================================"

    - name: Fail if cluster contains no devices
      fail:
        msg: "No devices found in NetBox cluster '{{ cluster_name }}'."
      when: netbox_devices.json.results | length == 0

    ###########################################################################
    # BUILD TARGET HOST LIST
    ###########################################################################

    - name: Build requested target host list
      set_fact:
        target_hosts_list: >-
          {{
            target_hosts.split(',')
            | map('trim')
            | reject('equalto', '')
            | list
          }}

    - name: Show requested hosts
      debug:
        var: target_hosts_list

    ###########################################################################
    # FILTER SELECTED DEVICES
    ###########################################################################

    - name: Initialize filtered devices
      set_fact:
        filtered_devices: []

    - name: Select all devices when target hosts is empty
      set_fact:
        filtered_devices: "{{ netbox_devices.json.results }}"
      when: target_hosts_list | length == 0

    - name: Add exact or wildcard matching devices
      set_fact:
        filtered_devices: "{{ filtered_devices + [item.0] }}"
      loop: "{{ netbox_devices.json.results | product(target_hosts_list) | list }}"
      loop_control:
        label: "{{ item.0.name }} -> {{ item.1 }}"
      when:
        - target_hosts_list | length > 0
        - >-
          item.0.name.split('.')[0]
          is match(
            '^' ~
            (
              item.1
              | regex_replace('\\*', '.*')
              | regex_replace('\\.', '\\.')
            )
            ~ '$'
          )

    - name: Remove duplicate filtered devices
      set_fact:
        filtered_devices: "{{ filtered_devices | unique(attribute='name') | list }}"

    - name: Show cluster and filtering result
      debug:
        msg:
          - "============================================================"
          - "ROCKY LINUX 9 HOST SELECTION"
          - "============================================================"
          - "Cluster Used      : {{ cluster_name }}"
          - "Cluster ID        : {{ cluster_id }}"
          - "Requested Hosts   : {{ target_hosts_list }}"
          - "Available Hosts   : {{ netbox_devices.json.results | map(attribute='name') | list }}"
          - "Selected Hosts    : {{ filtered_devices | map(attribute='name') | list }}"
          - "============================================================"

    - name: Fail if no matching hosts found
      fail:
        msg: >-
          No matching hosts found.
          Cluster: {{ cluster_name }}
          Requested: {{ target_hosts_list }}
      when: filtered_devices | length == 0

    ###########################################################################
    # BUILD VM INFORMATION FROM NETBOX
    ###########################################################################

    - name: Initialize VM host information
      set_fact:
        vm_hosts: []

    - name: Build VM host information from NetBox
      set_fact:
        vm_hosts: >-
          {{
            vm_hosts +
            [
              {
                'fqdn': item.name,
                'vm_name': item.name.split('.')[0],

                'esxi_hostname':
                  item.config_context.esxi_hostname
                  | default(''),

                'esxi_username':
                  item.config_context.esxi_username
                  | default(''),

                'esxi_password':
                  item.config_context.esxi_password
                  | default(''),

                'datacenter':
                  item.config_context.datacenter_name
                  | default(default_datacenter),

                'datastore':
                  item.config_context.datastore
                  | default(default_datastore),

                'vm_network':
                  item.config_context.vm_network
                  | default(default_vm_network),

                'folder':
                  item.config_context.folder
                  | default(default_vm_folder)
              }
            ]
          }}
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    ###########################################################################
    # VALIDATE VMWARE CONFIGURATION
    ###########################################################################

    - name: Verify ESXi hostname exists
      fail:
        msg: "ESXi hostname missing for {{ item.fqdn }}"
      loop: "{{ vm_hosts }}"
      loop_control:
        label: "{{ item.vm_name }}"
      when: item.esxi_hostname | length == 0

    - name: Verify ESXi username exists
      fail:
        msg: "ESXi username missing for {{ item.fqdn }}"
      loop: "{{ vm_hosts }}"
      loop_control:
        label: "{{ item.vm_name }}"
      when: item.esxi_username | length == 0

    - name: Verify ESXi password exists
      fail:
        msg: "ESXi password missing for {{ item.fqdn }}"
      loop: "{{ vm_hosts }}"
      loop_control:
        label: "{{ item.vm_name }}"
      when: item.esxi_password | length == 0

    ###########################################################################
    # SHOW VM CONFIGURATION
    ###########################################################################

    - name: Show normalized VMware host information
      debug:
        msg:
          - "============================================================"
          - "ROCKY LINUX 9 VM CONFIGURATION"
          - "============================================================"
          - "FQDN       : {{ item.fqdn }}"
          - "VM Name    : {{ item.vm_name }}"
          - "ESXi       : {{ item.esxi_hostname }}"
          - "Datacenter : {{ item.datacenter }}"
          - "Datastore  : {{ item.datastore }}"
          - "Network    : {{ item.vm_network }}"
          - "Folder     : {{ item.folder }}"
          - "============================================================"
      loop: "{{ vm_hosts }}"
      loop_control:
        label: "{{ item.vm_name }}"

    ###########################################################################
    # CHECK WHETHER VM EXISTS
    ###########################################################################

    - name: Check whether VM exists on ESXi
      community.vmware.vmware_guest_info:
        hostname: "{{ item.esxi_hostname }}"
        username: "{{ item.esxi_username }}"
        password: "{{ item.esxi_password }}"
        validate_certs: false
        datacenter: "{{ item.datacenter }}"
        name: "{{ item.vm_name }}"
      loop: "{{ vm_hosts }}"
      loop_control:
        label: "{{ item.vm_name }}"
      register: vm_lookup
      failed_when: false
      changed_when: false
      no_log: true

    - name: Show VM existence status
      debug:
        msg:
          - "============================================================"
          - "VM LOOKUP"
          - "============================================================"
          - "VM     : {{ item.item.vm_name }}"
          - "FQDN   : {{ item.item.fqdn }}"
          - "Exists : {{ item.instance is defined }}"
          - "Message: {{ item.msg | default('VM exists') }}"
          - "============================================================"
      loop: "{{ vm_lookup.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"

    ###########################################################################
    # CREATE MISSING SINGLE DISK VMS
    ###########################################################################

    - name: Create missing SingleDisk Rocky Linux 9 VMs
      community.vmware.vmware_guest:
        hostname: "{{ item.item.esxi_hostname }}"
        username: "{{ item.item.esxi_username }}"
        password: "{{ item.item.esxi_password }}"
        validate_certs: false

        datacenter: "{{ item.item.datacenter }}"
        folder: "{{ item.item.folder }}"
        datastore: "{{ item.item.datastore }}"

        name: "{{ item.item.vm_name }}"
        state: present
        guest_id: "{{ vm_guest_id }}"

        hardware:
          memory_mb: "{{ vm_memory_mb | int }}"
          num_cpus: "{{ vm_num_cpus | int }}"
          num_cpu_cores_per_socket: "{{ vm_num_cpu_cores_per_socket | int }}"
          boot_firmware: "{{ vm_boot_firmware }}"

        disk:
          - size_gb: "{{ vm_disk_size_gb | int }}"
            type: thin
            datastore: "{{ item.item.datastore }}"
            controller_type: paravirtual
            controller_number: 0
            unit_number: 0

        networks:
          - name: "{{ item.item.vm_network }}"
            start_connected: true
            device_type: vmxnet3

      loop: "{{ vm_lookup.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"
      when:
        - disk_count | int == 1
        - item.instance is not defined
      register: vm_create_singledisk
      no_log: false

    ###########################################################################
    # CREATE MISSING RAID VMS
    ###########################################################################

    - name: Create missing RAID Rocky Linux 9 VMs
      community.vmware.vmware_guest:
        hostname: "{{ item.item.esxi_hostname }}"
        username: "{{ item.item.esxi_username }}"
        password: "{{ item.item.esxi_password }}"
        validate_certs: false

        datacenter: "{{ item.item.datacenter }}"
        folder: "{{ item.item.folder }}"
        datastore: "{{ item.item.datastore }}"

        name: "{{ item.item.vm_name }}"
        state: present
        guest_id: "{{ vm_guest_id }}"

        hardware:
          memory_mb: "{{ vm_memory_mb | int }}"
          num_cpus: "{{ vm_num_cpus | int }}"
          num_cpu_cores_per_socket: "{{ vm_num_cpu_cores_per_socket | int }}"
          boot_firmware: "{{ vm_boot_firmware }}"

        disk:
          - size_gb: "{{ vm_disk_size_gb | int }}"
            type: thin
            datastore: "{{ item.item.datastore }}"
            controller_type: paravirtual
            controller_number: 0
            unit_number: 0

          - size_gb: "{{ vm_disk_size_gb | int }}"
            type: thin
            datastore: "{{ item.item.datastore }}"
            controller_type: paravirtual
            controller_number: 0
            unit_number: 1

        networks:
          - name: "{{ item.item.vm_network }}"
            start_connected: true
            device_type: vmxnet3

      loop: "{{ vm_lookup.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"
      when:
        - disk_count | int == 2
        - item.instance is not defined
      register: vm_create_raid
      no_log: false

    ###########################################################################
    # BUILD CREATED VM LIST
    ###########################################################################

    - name: Initialize created VM list
      set_fact:
        created_vm_names: []

    - name: Add newly created SingleDisk VMs
      set_fact:
        created_vm_names: "{{ created_vm_names + [item.item.item.vm_name] }}"
      loop: "{{ vm_create_singledisk.results | default([]) }}"
      loop_control:
        label: "{{ item.item.item.vm_name | default('UNKNOWN') }}"
      when:
        - item.changed | default(false)
        - item.item is defined
        - item.item.item is defined

    - name: Add newly created RAID VMs
      set_fact:
        created_vm_names: "{{ created_vm_names + [item.item.item.vm_name] }}"
      loop: "{{ vm_create_raid.results | default([]) }}"
      loop_control:
        label: "{{ item.item.item.vm_name | default('UNKNOWN') }}"
      when:
        - item.changed | default(false)
        - item.item is defined
        - item.item.item is defined

    - name: Remove duplicate created VM names
      set_fact:
        created_vm_names: "{{ created_vm_names | unique | list }}"

    - name: Show newly created VMs
      debug:
        msg:
          - "============================================================"
          - "NEWLY CREATED VMS"
          - "============================================================"
          - "{{ created_vm_names }}"
          - "============================================================"

    ###########################################################################
    # POWER ON NEWLY CREATED VMS
    #
    # This initializes VMware-generated MAC addresses.
    ###########################################################################

    - name: Power on newly created VMs
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ item.esxi_hostname }}"
        username: "{{ item.esxi_username }}"
        password: "{{ item.esxi_password }}"
        validate_certs: false
        datacenter: "{{ item.datacenter }}"
        name: "{{ item.vm_name }}"
        state: powered-on
      loop: "{{ vm_hosts }}"
      loop_control:
        label: "{{ item.vm_name }}"
      when: item.vm_name in created_vm_names
      no_log: true

    - name: Wait for VMware NIC initialization
      pause:
        seconds: 10
      when: created_vm_names | length > 0

    ###########################################################################
    # POWER OFF NEWLY CREATED VMS
    ###########################################################################

    - name: Power off newly created VMs
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ item.esxi_hostname }}"
        username: "{{ item.esxi_username }}"
        password: "{{ item.esxi_password }}"
        validate_certs: false
        datacenter: "{{ item.datacenter }}"
        name: "{{ item.vm_name }}"
        state: powered-off
      loop: "{{ vm_hosts }}"
      loop_control:
        label: "{{ item.vm_name }}"
      when: item.vm_name in created_vm_names
      no_log: true

    ###########################################################################
    # GET FINAL VM INFORMATION
    ###########################################################################

    - name: Get final VM information
      community.vmware.vmware_guest_info:
        hostname: "{{ item.esxi_hostname }}"
        username: "{{ item.esxi_username }}"
        password: "{{ item.esxi_password }}"
        validate_certs: false
        datacenter: "{{ item.datacenter }}"
        name: "{{ item.vm_name }}"
      loop: "{{ vm_hosts }}"
      loop_control:
        label: "{{ item.vm_name }}"
      register: final_vm_info
      no_log: true

    ###########################################################################
    # SHOW FINAL VM INFORMATION
    ###########################################################################

    - name: Show final VM information
      debug:
        msg:
          - "============================================================"
          - "ROCKY LINUX 9 VM INFORMATION"
          - "============================================================"
          - "VM Name       : {{ item.instance.hw_name | default(item.item.vm_name) }}"
          - "Power         : {{ item.instance.hw_power_status | default('N/A') }}"
          - "MAC           : {{ item.instance.hw_eth0.macaddress | default('N/A') }}"
          - "CPU           : {{ item.instance.hw_processor_count | default('N/A') }}"
          - "Memory MB     : {{ item.instance.hw_memtotal_mb | default('N/A') }}"
          - "Disk Layout   : {{ disk_layout }}"
          - "Expected Disks: {{ disk_count }}"
          - "============================================================"
      loop: "{{ final_vm_info.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"

    ###########################################################################
    # FINAL SUMMARY
    ###########################################################################

    - name: Show final result
      debug:
        msg:
          - "============================================================"
          - "ROCKY LINUX 9 VM ENSURE COMPLETED SUCCESSFULLY"
          - "============================================================"
          - "Cluster              : {{ cluster_name }}"
          - "Selected VMs         : {{ filtered_devices | length }}"
          - "New VMs Created      : {{ created_vm_names | length }}"
          - "Created VM Names     : {{ created_vm_names }}"
          - "Disk Layout          : {{ disk_layout }}"
          - "Disk Count per VM    : {{ disk_count }}"
          - "Disk Size            : {{ vm_disk_size_gb }} GB"
          - "Memory               : {{ vm_memory_mb }} MB"
          - "CPUs                 : {{ vm_num_cpus }}"
          - "Guest ID             : {{ vm_guest_id }}"
          - "Firmware             : {{ vm_boot_firmware }}"
          - "============================================================"
