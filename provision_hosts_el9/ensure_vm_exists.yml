---
- name: Prepare and recreate ROCKY LINUX 9 hosts in Foreman using API
  hosts: localhost
  gather_facts: false

  collections:
    - community.vmware
    - netbox.netbox

  # ============================================================
  # VARIABLES
  # ============================================================
  vars:

    # ------------------------------------------------------------
    # TARGET HOST
    # ------------------------------------------------------------
    target_hosts: ""

    # ------------------------------------------------------------
    # FOREMAN
    # Can be overridden using:
    # -e "foreman_server=https://rocky-08-01.vgs.com"
    # ------------------------------------------------------------
    foreman_server: "https://rocky-08-01.vgs.com"
    foreman_validate_certs: false

    # ------------------------------------------------------------
    # NETBOX
    # ------------------------------------------------------------
    netbox_url: "https://netbox.vgs.com"
    netbox_validate_certs: false

    # ------------------------------------------------------------
    # HOSTGROUP SELECTION
    #
    # IMPORTANT:
    # Do not define "hostgroup" twice.
    # Do not define "hostgroup_id" twice.
    # ------------------------------------------------------------
    hostgroup_selection: "{{ hostgroup | default('1') | string }}"

    # ------------------------------------------------------------
    # ROCKY LINUX 9 FOREMAN IDs
    # ------------------------------------------------------------
    rocky9_hostgroup_id: 7
    rocky9_operatingsystem_id: 7
    rocky9_medium_id: 17
    rocky9_ptable_id: 126
    rocky9_content_view_id: 4
    rocky9_lifecycle_environment_id: 1
    rocky9_architecture_id: 1
    rocky9_domain_id: 1

    rocky9_subnet_name: "vgs-subnet-rockyos"
    rocky9_pxe_loader: "Grub2 UEFI"
    rocky9_build: true

  tasks:

    # ============================================================
    # VALIDATE HOSTGROUP
    # ============================================================

    - name: Validate hostgroup selection
      ansible.builtin.assert:
        that:
          - hostgroup_selection in ['1']
        fail_msg: >-
          Invalid hostgroup selection '{{ hostgroup_selection }}'.
          Valid value is: 1

    # ============================================================
    # VALIDATE FOREMAN IDS
    # ============================================================

    - name: Validate Rocky 9 Foreman IDs are configured
      ansible.builtin.assert:
        that:
          - rocky9_hostgroup_id | int > 0
          - rocky9_operatingsystem_id | int > 0
          - rocky9_medium_id | int > 0
          - rocky9_ptable_id | int > 0
          - rocky9_content_view_id | int > 0
          - rocky9_lifecycle_environment_id | int > 0
          - rocky9_architecture_id | int > 0
          - rocky9_domain_id | int > 0
        fail_msg: "One or more Rocky Linux 9 Foreman IDs are missing or invalid."

    # ============================================================
    # SHOW CONFIGURATION
    # ============================================================

    - name: Show selected Rocky Linux 9 provisioning configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ROCKY LINUX 9 FOREMAN PROVISIONING"
          - "============================================================"
          - "Foreman Server        : {{ foreman_server }}"
          - "Target Hosts          : {{ target_hosts | default('ALL') }}"
          - "Hostgroup Selection   : {{ hostgroup_selection }}"
          - "Hostgroup ID          : {{ rocky9_hostgroup_id }}"
          - "Operating System ID   : {{ rocky9_operatingsystem_id }}"
          - "Medium ID             : {{ rocky9_medium_id }}"
          - "Partition Table ID    : {{ rocky9_ptable_id }}"
          - "Subnet Name           : {{ rocky9_subnet_name }}"
          - "Content View ID       : {{ rocky9_content_view_id }}"
          - "Lifecycle Environment : {{ rocky9_lifecycle_environment_id }}"
          - "Architecture ID       : {{ rocky9_architecture_id }}"
          - "Domain ID             : {{ rocky9_domain_id }}"
          - "PXE Loader            : {{ rocky9_pxe_loader }}"
          - "Build                 : {{ rocky9_build }}"
          - "============================================================"

    # ============================================================
    # GET DEVICES FROM NETBOX
    # ============================================================

    - name: Get devices from NetBox cluster
      netbox.netbox.nb_lookup:
        api_endpoint: "{{ netbox_url }}"
        token: "{{ netbox_token }}"
        validate_certs: "{{ netbox_validate_certs }}"
        resource: devices
        api_filter: "cluster=rocky-9-servers"
      register: netbox_devices

    - name: Show devices returned by NetBox
      ansible.builtin.debug:
        msg: "{{ netbox_devices | map(attribute='value.name') | list }}"

    # ============================================================
    # INITIALIZE FILTERED LIST
    # ============================================================

    - name: Initialize filtered device list
      ansible.builtin.set_fact:
        filtered_devices: []

    # ============================================================
    # USE ALL DEVICES IF TARGET IS EMPTY
    # ============================================================

    - name: Use all devices when target_hosts is empty
      ansible.builtin.set_fact:
        filtered_devices: "{{ netbox_devices }}"
      when:
        - target_hosts | default('') | trim == ''

    # ============================================================
    # FILTER BY SHORT NAME OR FQDN
    # ============================================================

    - name: Filter devices by hostname when target_hosts is specified
      ansible.builtin.set_fact:
        filtered_devices: "{{ filtered_devices + [item] }}"
      loop: "{{ netbox_devices }}"
      when:
        - target_hosts | default('') | trim != ''
        - >
          item.value.name == target_hosts
          or
          (item.value.name | regex_replace('\..*$', '')) == target_hosts

    # ============================================================
    # SHOW FILTERED DEVICES
    # ============================================================

    - name: Show filtered devices
      ansible.builtin.debug:
        msg: "{{ filtered_devices | map(attribute='value.name') | list }}"

    # ============================================================
    # FAIL IF NO HOST FOUND
    # ============================================================

    - name: Fail if no hosts matched
      ansible.builtin.fail:
        msg: >-
          No NetBox device matched target_hosts='{{ target_hosts }}'.
          Available devices are:
          {{ netbox_devices | map(attribute='value.name') | list }}
      when:
        - filtered_devices | length == 0

    # ============================================================
    # PREPARE HOST DATA
    # ============================================================

    - name: Initialize provisioning hosts
      ansible.builtin.set_fact:
        provisioning_hosts: []

    - name: Build provisioning host information
      ansible.builtin.set_fact:
        provisioning_hosts: >-
          {{
            provisioning_hosts +
            [
              {
                'fqdn': item.value.name,
                'vm_name': item.value.name | regex_replace('\..*$', ''),
                'ip_address': (
                  item.value.primary_ip4.address
                  | default(item.value.primary_ip.address, true)
                  | regex_replace('/.*$', '')
                ),
                'netbox_id': item.value.id,

                'esxi_hostname': item.value.config_context.esxi_hostname,
                'esxi_username': item.value.config_context.esxi_username,
                'esxi_password': item.value.config_context.esxi_password,

                'datacenter_name': item.value.config_context.datacenter_name,
                'datastore': item.value.config_context.datastore,
                'vm_network': item.value.config_context.vm_network,
                'guest_domain': item.value.config_context.guest_domain,

                'dns_primary': item.value.config_context.dns_primary,
                'gateway': item.value.config_context.gateway,
                'netmask': item.value.config_context.netmask
              }
            ]
          }}
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.value.name }}"
      no_log: true

    # ============================================================
    # SHOW NORMALIZED HOST INFORMATION
    # ============================================================

    - name: Show normalized VMware host information
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FQDN       : {{ item.fqdn }}"
          - "VM Name    : {{ item.vm_name }}"
          - "IP Address : {{ item.ip_address }}"
          - "ESXi       : {{ item.esxi_hostname }}"
          - "Datacenter : {{ item.datacenter_name }}"
          - "Datastore  : {{ item.datastore }}"
          - "Network    : {{ item.vm_network }}"
          - "============================================================"
      loop: "{{ provisioning_hosts }}"
      loop_control:
        label: "{{ item.vm_name }}"

    # ============================================================
    # VMWARE VM LOOKUP
    #
    # THIS IS THE CRITICAL FIX.
    #
    # If VM does not exist:
    # "Unable to gather information for non-existing VM ..."
    #
    # That is NOT a fatal error for a provisioning playbook.
    # ============================================================

    - name: Get VM information from ESXi
      community.vmware.vmware_guest_info:
        hostname: "{{ item.esxi_hostname }}"
        username: "{{ item.esxi_username }}"
        password: "{{ item.esxi_password }}"
        validate_certs: false
        datacenter: "{{ item.datacenter_name }}"
        name: "{{ item.vm_name }}"
      register: vm_info_results
      failed_when: false
      changed_when: false
      loop: "{{ provisioning_hosts }}"
      loop_control:
        label: "{{ item.vm_name }}"
      no_log: true

    # ============================================================
    # SHOW LOOKUP RESULT
    # ============================================================

    - name: Show VM lookup results
      ansible.builtin.debug:
        msg:
          - "VM Name : {{ item.item.vm_name }}"
          - "FQDN    : {{ item.item.fqdn }}"
          - "Exists  : {{ not (item.failed | default(false)) }}"
          - "Message : {{ item.msg | default('VM information gathered successfully') }}"
      loop: "{{ vm_info_results.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"

    # ============================================================
    # INITIALIZE VM STATUS
    # ============================================================

    - name: Initialize VM status map
      ansible.builtin.set_fact:
        vm_status_map: {}

    # ============================================================
    # DETERMINE IF VM EXISTS
    # ============================================================

    - name: Record VM existence status
      ansible.builtin.set_fact:
        vm_status_map: >-
          {{
            vm_status_map | combine(
              {
                item.item.vm_name:
                (
                  not (item.failed | default(false))
                  and
                  (
                    item.instance is defined
                    or
                    item.msg | default('') == ''
                  )
                )
              }
            )
          }}
      loop: "{{ vm_info_results.results }}"
      loop_control:
        label: "{{ item.item.vm_name }}"

    # ============================================================
    # SHOW VM STATUS
    # ============================================================

    - name: Show VM existence status
      ansible.builtin.debug:
        msg: "{{ vm_status_map }}"

    # ============================================================
    # EXPLICITLY SHOW WHETHER VM EXISTS
    # ============================================================

    - name: Show VM status
      ansible.builtin.debug:
        msg: >-
          {{
            'VM ' ~ item.vm_name ~ ' EXISTS on ESXi.'
            if (vm_status_map[item.vm_name] | default(false) | bool)
            else
            'VM ' ~ item.vm_name ~ ' DOES NOT EXIST on ESXi. New VM provisioning will continue.'
          }}
      loop: "{{ provisioning_hosts }}"
      loop_control:
        label: "{{ item.vm_name }}"

    # ============================================================
    # POWER OFF EXISTING VM
    # ============================================================

    - name: Power off existing VM
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ item.esxi_hostname }}"
        username: "{{ item.esxi_username }}"
        password: "{{ item.esxi_password }}"
        validate_certs: false
        datacenter: "{{ item.datacenter_name }}"
        name: "{{ item.vm_name }}"
        state: powered-off
      loop: "{{ provisioning_hosts }}"
      loop_control:
        label: "{{ item.vm_name }}"
      when:
        - vm_status_map[item.vm_name] | default(false) | bool
      register: poweroff_results
      failed_when: false
      no_log: true

    # ============================================================
    # DELETE EXISTING VM
    # ============================================================

    - name: Delete existing VM
      community.vmware.vmware_guest:
        hostname: "{{ item.esxi_hostname }}"
        username: "{{ item.esxi_username }}"
        password: "{{ item.esxi_password }}"
        validate_certs: false
        datacenter: "{{ item.datacenter_name }}"
        name: "{{ item.vm_name }}"
        state: absent
        force: true
      loop: "{{ provisioning_hosts }}"
      loop_control:
        label: "{{ item.vm_name }}"
      when:
        - vm_status_map[item.vm_name] | default(false) | bool
      register: delete_results
      no_log: true

    # ============================================================
    # WAIT FOR VM DELETION
    # ============================================================

    - name: Wait after deleting existing VMs
      ansible.builtin.pause:
        seconds: 10
      when:
        - vm_status_map.values() | select('equalto', true) | list | length > 0

    # ============================================================
    # SHOW READY STATUS
    # ============================================================

    - name: Show VM recreation status
      ansible.builtin.debug:
        msg: >-
          {{
            'Existing VM ' ~ item.vm_name ~
            ' was removed successfully. Ready for new provisioning.'
            if (vm_status_map[item.vm_name] | default(false) | bool)
            else
            'VM ' ~ item.vm_name ~
            ' was not present. Ready for new provisioning.'
          }}
      loop: "{{ provisioning_hosts }}"
      loop_control:
        label: "{{ item.vm_name }}"

    # ============================================================
    # PREPARE FOREMAN HOST DATA
    # ============================================================

    - name: Initialize Foreman host payload list
      ansible.builtin.set_fact:
        foreman_provisioning_hosts: []

    - name: Prepare Foreman provisioning data
      ansible.builtin.set_fact:
        foreman_provisioning_hosts: >-
          {{
            foreman_provisioning_hosts +
            [
              item | combine(
                {
                  'foreman_hostgroup_id': rocky9_hostgroup_id,
                  'foreman_operatingsystem_id': rocky9_operatingsystem_id,
                  'foreman_medium_id': rocky9_medium_id,
                  'foreman_ptable_id': rocky9_ptable_id,
                  'foreman_content_view_id': rocky9_content_view_id,
                  'foreman_lifecycle_environment_id': rocky9_lifecycle_environment_id,
                  'foreman_architecture_id': rocky9_architecture_id,
                  'foreman_domain_id': rocky9_domain_id,
                  'foreman_subnet_name': rocky9_subnet_name,
                  'foreman_pxe_loader': rocky9_pxe_loader,
                  'foreman_build': rocky9_build
                }
              )
            ]
          }}
      loop: "{{ provisioning_hosts }}"
      loop_control:
        label: "{{ item.vm_name }}"

    # ============================================================
    # FINAL SUMMARY
    # ============================================================

    - name: Show hosts ready for Foreman provisioning
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "HOST READY FOR PROVISIONING"
          - "============================================================"
          - "FQDN               : {{ item.fqdn }}"
          - "VM Name            : {{ item.vm_name }}"
          - "IP Address         : {{ item.ip_address }}"
          - "Hostgroup ID       : {{ item.foreman_hostgroup_id }}"
          - "Operating System ID: {{ item.foreman_operatingsystem_id }}"
          - "Medium ID          : {{ item.foreman_medium_id }}"
          - "Partition Table ID : {{ item.foreman_ptable_id }}"
          - "Content View ID    : {{ item.foreman_content_view_id }}"
          - "Lifecycle Env ID   : {{ item.foreman_lifecycle_environment_id }}"
          - "PXE Loader         : {{ item.foreman_pxe_loader }}"
          - "Build              : {{ item.foreman_build }}"
          - "============================================================"
      loop: "{{ foreman_provisioning_hosts }}"
      loop_control:
        label: "{{ item.vm_name }}"
