---
- name: Ensure selected Rocky Linux 9 VMs exist on ESXi
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - community.vmware

  vars:

    ###########################################################################
    # ESXi
    ###########################################################################

    esxi_hostname: "192.168.253.128"
    esxi_username: "root"
    esxi_password: "Root@123"

    datacenter: "ha-datacenter"
    datastore: "datastore1"
    vm_network: "VM Network"
    folder: "/"

    ###########################################################################
    # NetBox
    ###########################################################################

    netbox_url: "https://192.168.253.143"
    netbox_token: "83fb0cec1adff8ff4f36c9185df6b9e2f07c7fcd"

    cluster_name: "rocky-9-servers"

    ###########################################################################
    # AWX SURVEY - TARGET HOSTS
    #
    # Examples:
    #
    # target_hosts = rocky-09-01
    # target_hosts = rocky-09-*
    # target_hosts = rocky-09-01,rocky-09-02
    #
    # Leave empty to process ALL hosts.
    ###########################################################################

    target_hosts: "{{ target_hosts | default('', true) }}"

    ###########################################################################
    # AWX SURVEY - DISK TYPE
    #
    # 1 = Single Disk
    # 2 = RAID
    ###########################################################################

    hostgroup: "{{ hostgroup | default('1', true) }}"

    ###########################################################################
    # VM SETTINGS
    ###########################################################################

    vm_memory_mb: 4096
    vm_num_cpus: 4
    vm_num_cpu_cores_per_socket: 2

    vm_disk_size_gb: 100

    ###########################################################################
    # RAID / DISK CONFIGURATION
    #
    # Hostgroup 1 = Single Disk
    # Hostgroup 2 = RAID
    ###########################################################################

    vm_disks: >-
      {{
        (
          [
            {
              'size_gb': vm_disk_size_gb,
              'datastore': datastore,
              'type': 'thin'
            }
          ]
        )
        if (hostgroup | string == '1')
        else
        (
          [
            {
              'size_gb': vm_disk_size_gb,
              'datastore': datastore,
              'type': 'thin'
            },
            {
              'size_gb': vm_disk_size_gb,
              'datastore': datastore,
              'type': 'thin'
            }
          ]
        )
      }}

  tasks:

    ###########################################################################
    # SHOW SELECTED CONFIGURATION
    ###########################################################################

    - name: Show selected VM configuration
      debug:
        msg:
          - "============================================================"
          - "ROCKY LINUX 9 VM CONFIGURATION"
          - "============================================================"
          - "Cluster          : {{ cluster_name }}"
          - "Target Hosts     : {{ target_hosts if target_hosts | length > 0 else 'ALL HOSTS' }}"
          - "Hostgroup        : {{ hostgroup }}"
          - "Disk Type        : {{ 'Single Disk' if hostgroup | string == '1' else 'RAID' }}"
          - "Number of Disks  : {{ vm_disks | length }}"
          - "Disk Size        : {{ vm_disk_size_gb }} GB"
          - "Total Disk Space : {{ (vm_disks | length) * vm_disk_size_gb }} GB"
          - "Guest OS         : Rocky Linux 9"
          - "Boot Firmware    : EFI"
          - "============================================================"

    ###########################################################################
    # VALIDATE HOSTGROUP
    ###########################################################################

    - name: Fail when invalid hostgroup is selected
      fail:
        msg: >-
          Invalid hostgroup '{{ hostgroup }}'.
          Valid values are:
          1 = Single Disk
          2 = RAID
      when: hostgroup | string not in ['1', '2']

    ###########################################################################
    # GET DEVICES FROM NETBOX
    ###########################################################################

    - name: Get devices from NetBox cluster
      uri:
        url: "{{ netbox_url }}/api/dcim/devices/?cluster={{ cluster_name | urlencode }}&limit=1000"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
        validate_certs: false
        use_proxy: false
        status_code: 200
        return_content: true
      register: netbox_devices

    - name: Show devices in cluster
      debug:
        msg: "{{ netbox_devices.json.results | map(attribute='name') | list }}"

    ###########################################################################
    # FILTER SELECTED DEVICES
    ###########################################################################

    - name: Initialize filtered devices
      set_fact:
        filtered_devices: []

    - name: Select all devices when target_hosts is empty
      set_fact:
        filtered_devices: "{{ netbox_devices.json.results }}"
      when: target_hosts | trim | length == 0

    - name: Build target patterns when target_hosts is specified
      set_fact:
        target_patterns: >-
          {{
            target_hosts.split(',')
            | map('trim')
            | reject('equalto', '')
            | map('regex_replace', '\*', '.*')
            | list
          }}
      when: target_hosts | trim | length > 0

    - name: Add matching devices
      set_fact:
        filtered_devices: "{{ filtered_devices + [item.0] }}"
      loop: "{{ netbox_devices.json.results | product(target_patterns | default([])) | list }}"
      when:
        - target_hosts | trim | length > 0
        - item.0.name.split('.')[0] is match('^' ~ item.1 ~ '$')

    - name: Remove duplicate devices
      set_fact:
        filtered_devices: "{{ filtered_devices | unique(attribute='name') | list }}"

    - name: Fail if no hosts found
      fail:
        msg: >-
          No matching hosts found in NetBox.
          Cluster={{ cluster_name }}
          target_hosts={{ target_hosts }}
      when: filtered_devices | length == 0

    - name: Show selected VMs
      debug:
        msg:
          - "============================================================"
          - "SELECTED VMs"
          - "============================================================"
          - "{{ filtered_devices | map(attribute='name') | list }}"
          - "============================================================"

    ###########################################################################
    # CHECK WHETHER VM ALREADY EXISTS
    ###########################################################################

    - name: Check if VM already exists
      community.vmware.vmware_guest_info:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        name: "{{ item.name.split('.')[0] }}"
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: vm_lookup
      failed_when: false

    - name: Show VM existence status
      debug:
        msg:
          - "VM     : {{ item.item.name }}"
          - "Exists : {{ item.instance is defined }}"
      loop: "{{ vm_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    ###########################################################################
    # CREATE VM ONLY IF MISSING
    ###########################################################################

    - name: Create VM only if it does not exist
      community.vmware.vmware_guest:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false

        datacenter: "{{ datacenter }}"
        folder: "{{ folder }}"
        datastore: "{{ datastore }}"

        name: "{{ item.item.name.split('.')[0] }}"
        state: present

        guest_id: rocky9_64Guest

        hardware:
          memory_mb: "{{ vm_memory_mb }}"
          num_cpus: "{{ vm_num_cpus }}"
          num_cpu_cores_per_socket: "{{ vm_num_cpu_cores_per_socket }}"
          boot_firmware: efi

        disk: "{{ vm_disks }}"

        networks:
          - name: "{{ vm_network }}"
            start_connected: true
            device_type: vmxnet3

      loop: "{{ vm_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.instance is not defined
      register: vm_create

    ###########################################################################
    # SHOW VM CREATION RESULTS
    ###########################################################################

    - name: Show VM creation results
      debug:
        msg:
          - "============================================================"
          - "VM CREATION RESULT"
          - "============================================================"
          - "VM      : {{ item.item.item.name }}"
          - "Changed : {{ item.changed }}"
          - "Status  : {{ 'CREATED' if item.changed else 'ALREADY EXISTS / SKIPPED' }}"
          - "Disks   : {{ vm_disks | length }}"
          - "============================================================"
      loop: "{{ vm_create.results | default([]) }}"
      loop_control:
        label: "{{ item.item.item.name | default('UNKNOWN') }}"

    ###########################################################################
    # POWER ON VMs
    #
    # Power on so ESXi initializes the virtual NIC and MAC address.
    ###########################################################################

    - name: Power on selected VMs
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        name: "{{ item.name.split('.')[0] }}"
        state: powered-on
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Wait for ESXi to initialize VM and assign MAC
      pause:
        seconds: 10

    ###########################################################################
    # POWER OFF VMs
    #
    # Foreman will later control the provisioning boot process.
    ###########################################################################

    - name: Power off selected VMs
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        name: "{{ item.name.split('.')[0] }}"
        state: powered-off
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"

    ###########################################################################
    # GET FINAL VM INFORMATION
    ###########################################################################

    - name: Get final VM information
      community.vmware.vmware_guest_info:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        name: "{{ item.name.split('.')[0] }}"
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: vm_info

    - name: Show VM information
      debug:
        var: vm_info.results

    ###########################################################################
    # FINAL SUMMARY
    ###########################################################################

    - name: Show result
      debug:
        msg:
          - "============================================================"
          - "VM READY"
          - "============================================================"
          - "VM Name     : {{ item.instance.hw_name }}"
          - "Power State : {{ item.instance.hw_power_status }}"
          - "MAC Address : {{ item.instance.hw_eth0.macaddress | default('UNKNOWN') }}"
          - "Disk Type   : {{ 'Single Disk' if hostgroup | string == '1' else 'RAID' }}"
          - "Disk Count  : {{ vm_disks | length }}"
          - "Disk Size   : {{ vm_disk_size_gb }} GB each"
          - "Firmware    : EFI"
          - "============================================================"
      loop: "{{ vm_info.results }}"
      loop_control:
        label: "{{ item.instance.hw_name }}"
