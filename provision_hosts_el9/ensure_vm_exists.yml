---
# ============================================================
# ENSURE SELECTED ROCKY LINUX 9 VMS EXIST ON ESXI
# ============================================================

- name: Ensure selected Rocky Linux 9 VMs exist on ESXi
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - community.vmware

  vars:

    ###########################################################################
    # ESXI
    ###########################################################################

    esxi_hostname: "192.168.253.128"
    esxi_username: "root"
    esxi_password: "Root@123"

    datacenter: "ha-datacenter"
    datastore: "datastore1"
    vm_network: "VM Network"
    folder: "/"

    ###########################################################################
    # NETBOX
    ###########################################################################

    netbox_url: "https://192.168.253.143"
    netbox_token: "83fb0cec1adff8ff4f36c9185df6b9e2f07c7fcd"

    ###########################################################################
    # CLUSTER
    ###########################################################################

    cluster_name: "rocky-9-servers"

    ###########################################################################
    # TARGET HOSTS
    #
    # Examples:
    #
    # rocky-09-01
    # rocky-09-01,rocky-09-02
    # rocky-09-*
    #
    # Empty = all hosts in rocky-9-servers
    ###########################################################################

    target_hosts: "{{ target_hosts | default('', true) }}"

    ###########################################################################
    # DISK SELECTION
    #
    # 1 = SingleDisk
    #     1 x 100 GB
    #
    # 2 = RAID
    #     2 x 100 GB
    ###########################################################################

    hostgroup: "{{ hostgroup | default('1', true) }}"

    ###########################################################################
    # VM HARDWARE
    ###########################################################################

    vm_memory_mb: 4096
    vm_num_cpus: 4
    vm_num_cpu_cores_per_socket: 2

    vm_disk_size_gb: 100

    vm_guest_id: "rhel9_64Guest"
    vm_boot_firmware: "efi"

  tasks:

    ###########################################################################
    # VALIDATE HOSTGROUP
    ###########################################################################

    - name: Validate hostgroup selection
      ansible.builtin.fail:
        msg: >-
          Invalid hostgroup '{{ hostgroup }}'.
          Valid values:
          1 = SingleDisk
          2 = RAID
      when: hostgroup | string not in ['1', '2']

    ###########################################################################
    # BUILD DISK CONFIGURATION
    ###########################################################################

    - name: Set disk count
      ansible.builtin.set_fact:
        disk_count: "{{ 1 if hostgroup | string == '1' else 2 }}"

    - name: Set disk layout
      ansible.builtin.set_fact:
        disk_layout: "{{ 'SingleDisk' if hostgroup | string == '1' else 'RAID' }}"

    - name: Build VM disk configuration
      ansible.builtin.set_fact:
        vm_disks: >-
          {{
            [
              {
                'size_gb': vm_disk_size_gb | int,
                'datastore': datastore,
                'type': 'thin'
              }
            ]
            +
            (
              [
                {
                  'size_gb': vm_disk_size_gb | int,
                  'datastore': datastore,
                  'type': 'thin'
                }
              ]
              if hostgroup | string == '2'
              else []
            )
          }}

    ###########################################################################
    # SHOW CONFIGURATION
    ###########################################################################

    - name: Show selected VM configuration
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ENSURE ROCKY LINUX 9 VMS EXIST ON ESXI"
          - "============================================================"
          - "ESXi Server        : {{ esxi_hostname }}"
          - "NetBox Server      : {{ netbox_url }}"
          - "Cluster            : {{ cluster_name }}"
          - "Target Hosts       : {{ target_hosts | default('ALL', true) }}"
          - "Hostgroup          : {{ hostgroup }}"
          - "Disk Layout        : {{ disk_layout }}"
          - "Disk Count         : {{ disk_count }}"
          - "Disk Size          : {{ vm_disk_size_gb }} GB"
          - "Memory             : {{ vm_memory_mb }} MB"
          - "CPUs               : {{ vm_num_cpus }}"
          - "Firmware           : {{ vm_boot_firmware }}"
          - "Guest ID           : {{ vm_guest_id }}"
          - "============================================================"

    ###########################################################################
    # GET CLUSTER FROM NETBOX
    ###########################################################################

    - name: Get NetBox cluster
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/virtualization/clusters/?name={{ cluster_name | urlencode }}&limit=100"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
          Accept: "application/json"
        validate_certs: false
        use_proxy: false
        return_content: true
        status_code: 200
      register: netbox_cluster_result

    - name: Resolve NetBox cluster ID
      ansible.builtin.set_fact:
        cluster_id: >-
          {{
            netbox_cluster_result.json.results
            | selectattr('name', 'equalto', cluster_name)
            | map(attribute='id')
            | first
            | default('')
          }}

    - name: Fail if NetBox cluster does not exist
      ansible.builtin.fail:
        msg: >-
          NetBox cluster not found:
          '{{ cluster_name }}'
      when: cluster_id | string | length == 0

    - name: Show resolved NetBox cluster
      ansible.builtin.debug:
        msg:
          - "Cluster Name : {{ cluster_name }}"
          - "Cluster ID   : {{ cluster_id }}"

    ###########################################################################
    # GET DEVICES FROM EXACT CLUSTER
    ###########################################################################

    - name: Get devices from exact NetBox cluster
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/dcim/devices/?cluster_id={{ cluster_id }}&limit=1000"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
          Accept: "application/json"
        validate_certs: false
        use_proxy: false
        return_content: true
        status_code: 200
      register: netbox_devices

    - name: Show devices returned by NetBox
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "DEVICES IN CLUSTER: {{ cluster_name }}"
          - "============================================================"
          - "{{ netbox_devices.json.results | map(attribute='name') | list }}"
          - "============================================================"

    - name: Fail if cluster contains no devices
      ansible.builtin.fail:
        msg: >-
          No devices found in NetBox cluster '{{ cluster_name }}'.
      when: netbox_devices.json.results | length == 0

    ###########################################################################
    # BUILD TARGET HOST LIST
    ###########################################################################

    - name: Build requested target host list
      ansible.builtin.set_fact:
        target_hosts_list: >-
          {{
            target_hosts.split(',')
            | map('trim')
            | reject('equalto', '')
            | list
          }}

    - name: Show requested hosts
      ansible.builtin.debug:
        var: target_hosts_list

    ###########################################################################
    # FILTER SELECTED DEVICES
    ###########################################################################

    - name: Initialize filtered devices
      ansible.builtin.set_fact:
        filtered_devices: []

    - name: Select all devices when target hosts is empty
      ansible.builtin.set_fact:
        filtered_devices: "{{ netbox_devices.json.results }}"
      when: target_hosts_list | length == 0

    - name: Add exact or wildcard matching devices
      ansible.builtin.set_fact:
        filtered_devices: "{{ filtered_devices + [item.0] }}"
      loop: "{{ netbox_devices.json.results | product(target_hosts_list) | list }}"
      loop_control:
        label: "{{ item.0.name }} -> {{ item.1 }}"
      when:
        - target_hosts_list | length > 0
        - item.0.name.split('.')[0] is match(
            '^' ~ (item.1 | regex_replace('\\*', '.*')) ~ '$'
          )

    - name: Remove duplicate filtered devices
      ansible.builtin.set_fact:
        filtered_devices: "{{ filtered_devices | unique(attribute='name') | list }}"

    - name: Show cluster and filtering result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "HOST FILTER RESULT"
          - "============================================================"
          - "Cluster Used      : {{ cluster_name }}"
          - "Cluster ID        : {{ cluster_id }}"
          - "Requested Hosts   : {{ target_hosts_list }}"
          - "Available Hosts   : {{ netbox_devices.json.results | map(attribute='name') | list }}"
          - "Selected Hosts    : {{ filtered_devices | map(attribute='name') | list }}"
          - "============================================================"

    - name: Fail if no matching hosts found
      ansible.builtin.fail:
        msg: >-
          No matching hosts found.
          Cluster: {{ cluster_name }}
          Cluster ID: {{ cluster_id }}
          Requested: {{ target_hosts_list }}
          Available: {{
            netbox_devices.json.results
            | map(attribute='name')
            | list
          }}
      when: filtered_devices | length == 0

    - name: Show selected devices
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SELECTED ROCKY LINUX 9 VMS"
          - "============================================================"
          - "{{ filtered_devices | map(attribute='name') | list }}"
          - "============================================================"

    ###########################################################################
    # CHECK EXISTING VMS
    ###########################################################################

    - name: Check whether VM exists on ESXi
      community.vmware.vmware_guest_info:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        datacenter: "{{ datacenter }}"
        name: "{{ item.name.split('.')[0] }}"
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: vm_lookup
      failed_when: false

    - name: Show VM existence status
      ansible.builtin.debug:
        msg:
          - "VM     : {{ item.item.name.split('.')[0] }}"
          - "Exists : {{ item.instance is defined }}"
      loop: "{{ vm_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    ###########################################################################
    # CREATE ONLY MISSING VMS
    ###########################################################################

    - name: Create missing VMs
      community.vmware.vmware_guest:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false

        datacenter: "{{ datacenter }}"
        folder: "{{ folder }}"
        datastore: "{{ datastore }}"

        name: "{{ item.item.name.split('.')[0] }}"
        state: present

        guest_id: "{{ vm_guest_id }}"

        hardware:
          memory_mb: "{{ vm_memory_mb | int }}"
          num_cpus: "{{ vm_num_cpus | int }}"
          num_cpu_cores_per_socket: "{{ vm_num_cpu_cores_per_socket | int }}"
          boot_firmware: "{{ vm_boot_firmware }}"

        disk: "{{ vm_disks }}"

        networks:
          - name: "{{ vm_network }}"
            start_connected: true
            device_type: vmxnet3

      loop: "{{ vm_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.instance is not defined
      register: vm_create

    ###########################################################################
    # BUILD NEWLY CREATED VM LIST
    ###########################################################################

    - name: Initialize created VM list
      ansible.builtin.set_fact:
        created_vm_names: []

    - name: Build newly created VM list
      ansible.builtin.set_fact:
        created_vm_names: >-
          {{
            created_vm_names +
            [item.item.item.name.split('.')[0]]
          }}
      loop: "{{ vm_create.results | default([]) }}"
      loop_control:
        label: "{{ item.item.item.name | default('UNKNOWN') }}"
      when:
        - item.changed | default(false)
        - item.item is defined
        - item.item.item is defined

    - name: Show newly created VMs
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NEWLY CREATED VMS"
          - "============================================================"
          - "{{ created_vm_names }}"
          - "============================================================"

    ###########################################################################
    # POWER ON ONLY NEWLY CREATED VMS
    ###########################################################################

    - name: Power on newly created VMs
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        datacenter: "{{ datacenter }}"
        name: "{{ item }}"
        state: powered-on
      loop: "{{ created_vm_names }}"
      loop_control:
        label: "{{ item }}"
      when: created_vm_names | length > 0

    - name: Wait for MAC address initialization
      ansible.builtin.pause:
        seconds: 10
      when: created_vm_names | length > 0

    ###########################################################################
    # POWER OFF ONLY NEWLY CREATED VMS
    ###########################################################################

    - name: Power off newly created VMs
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        datacenter: "{{ datacenter }}"
        name: "{{ item }}"
        state: powered-off
      loop: "{{ created_vm_names }}"
      loop_control:
        label: "{{ item }}"
      when: created_vm_names | length > 0

    ###########################################################################
    # GET ACTUAL VM DISK INFORMATION
    #
    # This fixes the previous problem where hw_disks showed 0 even though
    # the VM had a real 100 GB disk.
    ###########################################################################

    - name: Get actual VM disk information
      community.vmware.vmware_guest_disk_info:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        datacenter: "{{ datacenter }}"
        name: "{{ item.name.split('.')[0] }}"
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: vm_disk_info

    - name: Show actual VM disk count
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VM DISK CHECK"
          - "============================================================"
          - "VM            : {{ item.item.name.split('.')[0] }}"
          - "Current Disks : {{ item.guest_disk_info | default({}) | length }}"
          - "Required      : {{ disk_count }}"
          - "Disk Layout   : {{ disk_layout }}"
          - "============================================================"
      loop: "{{ vm_disk_info.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    ###########################################################################
    # ADD SECOND DISK WHEN RAID / HOSTGROUP 2 IS SELECTED
    ###########################################################################

    - name: Add missing second disk for RAID
      community.vmware.vmware_guest_disk:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false

        # REQUIRED
        datacenter: "{{ datacenter }}"

        name: "{{ item.item.name.split('.')[0] }}"

        disk:
          - state: present
            size_gb: "{{ vm_disk_size_gb | int }}"
            type: thin
            datastore: "{{ datastore }}"
            scsi_controller: 0
            unit_number: 1

      loop: "{{ vm_disk_info.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - disk_count | int == 2
        - item.guest_disk_info | default({}) | length < 2

    ###########################################################################
    # VERIFY FINAL DISK INFORMATION
    ###########################################################################

    - name: Get final VM disk information
      community.vmware.vmware_guest_disk_info:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        datacenter: "{{ datacenter }}"
        name: "{{ item.name.split('.')[0] }}"
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: final_vm_disk_info

    - name: Show final disk information
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL VM DISK STATUS"
          - "============================================================"
          - "VM            : {{ item.item.name.split('.')[0] }}"
          - "Actual Disks  : {{ item.guest_disk_info | default({}) | length }}"
          - "Required      : {{ disk_count }}"
          - "Disk Layout   : {{ disk_layout }}"
          - "Status        : {{ 'OK' if (item.guest_disk_info | default({}) | length | int) >= (disk_count | int) else 'FAILED' }}"
          - "============================================================"
      loop: "{{ final_vm_disk_info.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    ###########################################################################
    # GET FINAL VM INFORMATION
    ###########################################################################

    - name: Get final VM information
      community.vmware.vmware_guest_info:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        datacenter: "{{ datacenter }}"
        name: "{{ item.name.split('.')[0] }}"
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: final_vm_info

    - name: Show final VM information
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL VM INFORMATION"
          - "============================================================"
          - "VM Name       : {{ item.instance.hw_name | default(item.item.name.split('.')[0]) }}"
          - "Power         : {{ item.instance.hw_power_status | default('N/A') }}"
          - "MAC           : {{ item.instance.hw_eth0.macaddress | default('N/A') }}"
          - "CPU           : {{ item.instance.hw_processor_count | default('N/A') }}"
          - "Memory MB     : {{ item.instance.hw_memtotal_mb | default('N/A') }}"
          - "Disk Layout   : {{ disk_layout }}"
          - "Expected Disks: {{ disk_count }}"
          - "============================================================"
      loop: "{{ final_vm_info.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    ###########################################################################
    # VERIFY ALL DISK REQUIREMENTS
    ###########################################################################

    - name: Fail if any VM does not have required disk count
      ansible.builtin.fail:
        msg: >-
          VM '{{ item.item.name.split('.')[0] }}' does not have the required
          number of disks. Actual:
          {{ item.guest_disk_info | default({}) | length }},
          Required: {{ disk_count }}
      loop: "{{ final_vm_disk_info.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - item.guest_disk_info | default({}) | length | int < disk_count | int

    ###########################################################################
    # SUMMARY
    ###########################################################################

    - name: Show final result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ROCKY LINUX 9 VM ENSURE COMPLETED SUCCESSFULLY"
          - "============================================================"
          - "Cluster              : {{ cluster_name }}"
          - "Selected VMs         : {{ filtered_devices | length }}"
          - "New VMs Created      : {{ created_vm_names | length }}"
          - "Disk Layout          : {{ disk_layout }}"
          - "Disk Count per VM    : {{ disk_count }}"
          - "Disk Size            : {{ vm_disk_size_gb }} GB"
          - "Firmware             : {{ vm_boot_firmware }}"
          - "Guest ID             : {{ vm_guest_id }}"
          - "============================================================"
