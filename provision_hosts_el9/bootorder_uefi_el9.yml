---
# ============================================================
# PLAY 1: Load selected Rocky 9 VMs from NetBox
# ============================================================

- name: Load selected Rocky 9 VMs from NetBox
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    netbox_url: "https://192.168.253.143"
    netbox_token: "83fb0cec1adff8ff4f36c9185df6b9e2f07c7fcd"

    # ========================================================
    # FIXED CLUSTER
    # ========================================================
    cluster_name: "rocky-9-servers"

  tasks:

    # ========================================================
    # SHOW RUNTIME VARIABLES
    # ========================================================

    - name: Show runtime variables
      debug:
        msg:
          - "============================================================"
          - "RUNTIME VARIABLES"
          - "============================================================"
          - "Cluster Name : {{ cluster_name }}"
          - "Target Hosts : {{ target_hosts | default('NOT SET', true) }}"
          - "============================================================"

    # ========================================================
    # VALIDATE TARGET HOSTS
    # ========================================================

    - name: Fail if target_hosts is not provided
      fail:
        msg: "Please provide target_hosts in the AWX Survey."
      when: target_hosts is not defined or target_hosts | trim == ""

    # ========================================================
    # GET EXACT CLUSTER
    # ========================================================

    - name: Get cluster from NetBox
      uri:
        url: "{{ netbox_url }}/api/virtualization/clusters/?name={{ cluster_name | urlencode }}&limit=100"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
          Accept: "application/json"
        return_content: true
        validate_certs: false
        use_proxy: false
        status_code: 200
      register: cluster_lookup

    - name: Resolve exact cluster ID
      set_fact:
        cluster_id: >-
          {{
            cluster_lookup.json.results
            | selectattr('name', 'equalto', cluster_name)
            | map(attribute='id')
            | first
            | default('')
          }}

    - name: Fail if cluster not found
      fail:
        msg: "Cluster '{{ cluster_name }}' not found in NetBox."
      when: cluster_id | string | length == 0

    - name: Show cluster information
      debug:
        msg:
          - "============================================================"
          - "NETBOX CLUSTER"
          - "============================================================"
          - "Cluster Name : {{ cluster_name }}"
          - "Cluster ID   : {{ cluster_id }}"
          - "============================================================"

    # ========================================================
    # GET DEVICES FROM CLUSTER
    # ========================================================

    - name: Get devices from NetBox cluster
      uri:
        url: "{{ netbox_url }}/api/dcim/devices/?cluster_id={{ cluster_id }}&limit=1000"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
          Accept: "application/json"
        return_content: true
        validate_certs: false
        use_proxy: false
        status_code: 200
      register: netbox_devices

    - name: Show device lookup information
      debug:
        msg:
          - "Cluster Name Used : {{ cluster_name }}"
          - "Cluster ID Used   : {{ cluster_id }}"
          - "Devices Returned  : {{ netbox_devices.json.results | length }}"

    # ========================================================
    # SAFETY FILTER - EXACT CLUSTER ONLY
    # ========================================================

    - name: Initialize exact cluster devices
      set_fact:
        cluster_devices: []

    - name: Add devices belonging to exact cluster
      set_fact:
        cluster_devices: "{{ cluster_devices + [item] }}"
      loop: "{{ netbox_devices.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.cluster is defined
        - item.cluster is not none
        - item.cluster.name is defined
        - item.cluster.name == cluster_name

    - name: Show devices in exact cluster
      debug:
        msg:
          - "============================================================"
          - "DEVICES IN EXACT CLUSTER: {{ cluster_name }}"
          - "============================================================"
          - "{{ cluster_devices | map(attribute='name') | list }}"
          - "============================================================"

    - name: Fail if no devices found in exact cluster
      fail:
        msg: >-
          No devices found in exact cluster '{{ cluster_name }}'.
          Cluster ID used: {{ cluster_id }}
      when: cluster_devices | length == 0

    # ========================================================
    # CONVERT AWX SURVEY INPUT
    #
    # Examples:
    # rocky-09-01
    # rocky-09-01,rocky-09-02
    # ========================================================

    - name: Convert target_hosts string to list
      set_fact:
        target_hosts_list: >-
          {{
            target_hosts.split(',')
            | map('trim')
            | reject('equalto', '')
            | list
          }}

    - name: Show requested hosts
      debug:
        var: target_hosts_list

    # ========================================================
    # FILTER SELECTED DEVICES
    # ========================================================

    - name: Initialize filtered devices
      set_fact:
        filtered_devices: []

    - name: Filter selected devices
      set_fact:
        filtered_devices: "{{ filtered_devices + [item] }}"
      loop: "{{ cluster_devices }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name.split('.')[0] in target_hosts_list

    - name: Fail if no matching hosts found
      fail:
        msg: >-
          No matching Rocky 9 hosts found in NetBox.
          Cluster: {{ cluster_name }}
          Cluster ID: {{ cluster_id }}
          Requested: {{ target_hosts_list }}
          Available in cluster: {{ cluster_devices | map(attribute='name') | list }}
      when: filtered_devices | length == 0

    - name: Show selected devices
      debug:
        msg:
          - "============================================================"
          - "SELECTED ROCKY 9 DEVICES"
          - "============================================================"
          - "{{ filtered_devices | map(attribute='name') | list }}"
          - "============================================================"


# ============================================================
# PLAY 2: Configure Rocky 9 VM for EFI PXE Boot
# ============================================================

- name: Configure Rocky 9 VM Boot
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - community.vmware

  tasks:

    # ========================================================
    # POWER OFF
    # ========================================================

    - name: Power OFF selected VM
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ item.config_context.esxi_hostname }}"
        username: "{{ item.config_context.esxi_username }}"
        password: "{{ item.config_context.esxi_password }}"
        validate_certs: false
        name: "{{ item.name.split('.')[0] }}"
        state: powered-off
      delegate_to: localhost
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: poweroff_result

    - name: Show power OFF result
      debug:
        msg: "VM {{ item.item.name }} power operation completed"
      loop: "{{ poweroff_result.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Wait after VM power OFF
      pause:
        seconds: 5
      delegate_to: localhost

    ###########################################################################
    # SET EFI FIRMWARE
    ###########################################################################

    - name: Set EFI firmware
      community.vmware.vmware_guest:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ item.name.split('.')[0] }}"
        state: present
        hardware:
          boot_firmware: efi
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"

    ###########################################################################
    # SET PXE / NETWORK BOOT FIRST
    ###########################################################################

    - name: Set PXE first boot
      community.vmware.vmware_guest_boot_manager:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ item.name.split('.')[0] }}"
        boot_order:
          - ethernet
          - disk
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"

    ###########################################################################
    # WAIT FOR CONFIGURATION
    ###########################################################################

    - name: Pause after firmware and PXE configuration
      pause:
        seconds: 3

    ###########################################################################
    # POWER ON SELECTED VM
    ###########################################################################
    
    - name: Power ON selected Rocky Linux 8 VM
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ item.name.split('.')[0] }}"
        state: powered-on
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
    
    ###########################################################################
    # WAIT 10 SECONDS
    #
    # Give EFI/PXE boot enough time to start
    ###########################################################################
    
    - name: Wait 10 seconds after power ON
      pause:
        seconds: 10
    
    ###########################################################################
    # CHANGE BOOT ORDER TO DISK FIRST
    #
    # This affects the NEXT reboot.
    # The current PXE boot continues normally.
    ###########################################################################
    
    - name: Change boot order to disk first after PXE starts
      community.vmware.vmware_guest_boot_manager:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ item.name.split('.')[0] }}"
        boot_order:
          - disk
          - ethernet
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
    
    ###########################################################################
    # SHOW RESULT
    ###########################################################################
    
    - name: Show boot order update message
      debug:
        msg:
          - "============================================================"
          - "PXE BOOT STARTED"
          - "Waited 10 seconds"
          - "Next boot order changed to:"
          - "1. Disk"
          - "2. Ethernet"
          - "============================================================"

# ============================================================
# PLAY 3: Get NetBox IPs and Wait for SSH
# ============================================================

- name: Wait for Rocky 9 VMs and build dynamic inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    default_ssh_user: "root"
    default_ssh_password: "Root@123"

  tasks:

    # ========================================================
    # BUILD CONNECTION INFORMATION
    # ========================================================

    - name: Initialize selected VM connection information
      set_fact:
        selected_vm_connections: []

    - name: Build selected VM connection information
      set_fact:
        selected_vm_connections: >-
          {{
            selected_vm_connections
            +
            [
              {
                'name': item.name,
                'short_name': item.name.split('.')[0],
                'ip': (
                  item.primary_ip4.address
                  | default('')
                  | regex_replace('/.*$', '')
                ),
                'ssh_user': (
                  item.config_context.vm_root_user
                  | default(default_ssh_user, true)
                ),
                'ssh_password': (
                  item.config_context.vm_root_password
                  | default(default_ssh_password, true)
                )
              }
            ]
          }}
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Show selected Rocky 9 VM IP mapping
      debug:
        msg:
          - "VM       : {{ item.name }}"
          - "IP       : {{ item.ip }}"
          - "SSH User : {{ item.ssh_user }}"
      loop: "{{ selected_vm_connections }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Fail if any selected VM has no IP address
      fail:
        msg: "No IP address found in NetBox for VM {{ item.name }}"
      when: item.ip | length == 0
      loop: "{{ selected_vm_connections }}"
      loop_control:
        label: "{{ item.name }}"

    # ========================================================
    # WAIT FOR SSH
    # ========================================================

    - name: Wait for SSH port 22
      wait_for:
        host: "{{ item.ip }}"
        port: 22
        delay: 10
        timeout: 3600
        state: started
      loop: "{{ selected_vm_connections }}"
      loop_control:
        label: "{{ item.name }}"

    # ========================================================
    # ADD TO DYNAMIC INVENTORY
    # ========================================================

    - name: Add selected Rocky 9 VMs to dynamic inventory
      add_host:
        name: "{{ item.short_name }}"
        groups: verification_vms
        ansible_host: "{{ item.ip }}"
        ansible_user: "{{ item.ssh_user }}"
        ansible_password: "{{ item.ssh_password }}"
        ansible_ssh_pass: "{{ item.ssh_password }}"
        ansible_connection: ssh
        ansible_become: false
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
      loop: "{{ selected_vm_connections }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Show dynamic inventory hosts
      debug:
        msg:
          - "Host: {{ item.short_name }}"
          - "IP: {{ item.ip }}"
      loop: "{{ selected_vm_connections }}"
      loop_control:
        label: "{{ item.name }}"


# ============================================================
# PLAY 4: Final Rocky 9 System Verification
# ============================================================

- name: Final Rocky 9 System Verification
  hosts: verification_vms
  gather_facts: false

  tasks:

    - name: Wait for SSH authentication
      wait_for_connection:
        delay: 5
        timeout: 600

    - name: Check hostname
      raw: hostname
      register: hostname_result
      changed_when: false

    - name: Check uptime
      raw: uptime -p
      register: uptime_result
      changed_when: false

    - name: Check kernel
      raw: uname -r
      register: kernel_result
      changed_when: false

    - name: Check operating system
      raw: cat /etc/os-release
      register: os_result
      changed_when: false

    - name: Check block devices
      raw: lsblk -o NAME,SIZE,TYPE,MOUNTPOINT
      register: disk_result
      changed_when: false

    - name: Check RAID status
      raw: cat /proc/mdstat
      register: raid_result
      changed_when: false
      failed_when: false

    - name: Display final Rocky 9 system information
      debug:
        msg:
          - "============================================================"
          - "FINAL ROCKY 9 SYSTEM VERIFICATION"
          - "============================================================"
          - "Host      : {{ inventory_hostname }}"
          - "IP        : {{ ansible_host }}"
          - "Hostname  : {{ hostname_result.stdout | trim }}"
          - "Uptime    : {{ uptime_result.stdout | trim }}"
          - "Kernel    : {{ kernel_result.stdout | trim }}"
          - "OS        : {{ os_result.stdout_lines | select('match', '^PRETTY_NAME=') | first | default('OS information unavailable') | regex_replace('^PRETTY_NAME=', '') | regex_replace('^\"|\"$', '') }}"
          - "------------------------------------------------------------"
          - "DISKS:"
          - "{{ disk_result.stdout_lines }}"
          - "------------------------------------------------------------"
          - "RAID:"
          - "{{ raid_result.stdout_lines }}"
          - "============================================================"
