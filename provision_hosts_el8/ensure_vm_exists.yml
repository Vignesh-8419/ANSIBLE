# ============================================================
# ENSURE SELECTED ROCKY LINUX 8 VMS EXIST ON ESXI
# ============================================================

- name: Ensure selected Rocky Linux 8 VMs exist on ESXi
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - community.vmware

  vars:

    ###########################################################################
    # ESXi
    ###########################################################################

    esxi_hostname: "192.168.253.128"
    esxi_username: "root"
    esxi_password: "Root@123"

    datacenter: "ha-datacenter"
    datastore: "datastore1"
    vm_network: "VM Network"
    folder: "/"

    ###########################################################################
    # NETBOX
    ###########################################################################

    netbox_url: "https://192.168.253.143"
    netbox_token: "83fb0cec1adff8ff4f36c9185df6b9e2f07c7fcd"

    cluster_name: "rocky-8-servers"

    ###########################################################################
    # AWX SURVEY - TARGET HOSTS
    #
    # Examples:
    #
    # rocky-08-01
    # rocky-08-01,rocky-08-02
    # rocky-08-*
    #
    # Empty = ALL hosts in cluster
    ###########################################################################

    target_hosts: "{{ target_hosts | default('', true) }}"

    ###########################################################################
    # AWX SURVEY - HOSTGROUP
    #
    # 1 = SingleDisk
    # 2 = RAID
    ###########################################################################

    hostgroup: "{{ hostgroup | default('1', true) }}"

    ###########################################################################
    # VM HARDWARE
    ###########################################################################

    vm_memory_mb: 4096
    vm_num_cpus: 4
    vm_num_cpu_cores_per_socket: 2

    vm_disk_size_gb: 100

    vm_guest_id: "rocky8_64Guest"
    vm_boot_firmware: "efi"

  tasks:

    ###########################################################################
    # VALIDATE HOSTGROUP
    ###########################################################################

    - name: Validate hostgroup selection
      fail:
        msg: >-
          Invalid hostgroup '{{ hostgroup }}'.
          Valid values are:
          1 = SingleDisk
          2 = RAID
      when: hostgroup | string not in ['1', '2']


    ###########################################################################
    # SET DISK CONFIGURATION
    ###########################################################################

    - name: Set disk configuration
      set_fact:
        disk_count: "{{ 1 if hostgroup | string == '1' else 2 }}"
        disk_layout: "{{ 'SingleDisk' if hostgroup | string == '1' else 'RAID' }}"


    - name: Build VM disk configuration
      set_fact:
        vm_disks: >-
          {{
            [
              {
                'size_gb': vm_disk_size_gb,
                'datastore': datastore,
                'type': 'thin'
              }
            ]
            +
            (
              [
                {
                  'size_gb': vm_disk_size_gb,
                  'datastore': datastore,
                  'type': 'thin'
                }
              ]
              if hostgroup | string == '2'
              else []
            )
          }}


    ###########################################################################
    # SHOW CONFIGURATION
    ###########################################################################

    - name: Show selected VM configuration
      debug:
        msg:
          - "============================================================"
          - "ENSURE ROCKY LINUX 8 VMS EXIST ON ESXI"
          - "============================================================"
          - "ESXi Server        : {{ esxi_hostname }}"
          - "Datacenter         : {{ datacenter }}"
          - "Datastore          : {{ datastore }}"
          - "Network            : {{ vm_network }}"
          - "Cluster            : {{ cluster_name }}"
          - "Target Hosts       : {{ target_hosts | default('ALL', true) }}"
          - "Hostgroup          : {{ hostgroup }}"
          - "Disk Layout        : {{ disk_layout }}"
          - "Disk Count         : {{ disk_count }}"
          - "Disk Size          : {{ vm_disk_size_gb }} GB"
          - "Memory             : {{ vm_memory_mb }} MB"
          - "CPUs               : {{ vm_num_cpus }}"
          - "Firmware           : {{ vm_boot_firmware }}"
          - "============================================================"


    ###########################################################################
    # GET DEVICES FROM NETBOX
    ###########################################################################

    - name: Get devices from NetBox cluster
      uri:
        url: "{{ netbox_url }}/api/dcim/devices/?cluster={{ cluster_name | urlencode }}&limit=1000"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
        validate_certs: false
        use_proxy: false
        status_code: 200
        return_content: true
      register: netbox_devices


    - name: Show devices returned by NetBox
      debug:
        msg:
          - "============================================================"
          - "NETBOX DEVICES RETURNED"
          - "============================================================"
          - "{{ netbox_devices.json.results | map(attribute='name') | list }}"
          - "============================================================"


    ###########################################################################
    # BUILD TARGET PATTERNS
    ###########################################################################

    - name: Initialize target patterns
      set_fact:
        target_patterns: []


    - name: Build target patterns from AWX survey
      set_fact:
        target_patterns: >-
          {{
            target_hosts.split(',')
            | map('trim')
            | reject('equalto', '')
            | map('regex_replace', '\*', '.*')
            | list
          }}
      when: target_hosts | trim | length > 0


    - name: Show requested hosts
      debug:
        msg:
          - "Requested Input : {{ target_hosts | default('ALL', true) }}"
          - "Target Patterns : {{ target_patterns }}"


    ###########################################################################
    # FILTER SELECTED DEVICES
    ###########################################################################

    - name: Initialize filtered devices
      set_fact:
        filtered_devices: []


    - name: Use all devices when target hosts is empty
      set_fact:
        filtered_devices: "{{ netbox_devices.json.results }}"
      when: target_patterns | length == 0


    - name: Add devices matching target patterns
      set_fact:
        filtered_devices: "{{ filtered_devices + [item.0] }}"
      loop: "{{ netbox_devices.json.results | product(target_patterns) | list }}"
      loop_control:
        label: "{{ item.0.name }} -> {{ item.1 }}"
      when:
        - target_patterns | length > 0
        - item.0.name.split('.')[0] is match('^' ~ item.1 ~ '$')


    - name: Remove duplicate filtered devices
      set_fact:
        filtered_devices: "{{ filtered_devices | unique(attribute='name') | list }}"


    - name: Show filtered devices
      debug:
        msg:
          - "============================================================"
          - "SELECTED ROCKY LINUX 8 VMS"
          - "============================================================"
          - "{{ filtered_devices | map(attribute='name') | list }}"
          - "============================================================"


    - name: Fail if no matching hosts found
      fail:
        msg: >-
          No matching hosts found in NetBox.
          Cluster: {{ cluster_name }}
          Requested: {{ target_hosts }}
          Available:
          {{ netbox_devices.json.results | map(attribute='name') | list }}
      when: filtered_devices | length == 0


    ###########################################################################
    # CHECK WHETHER VM EXISTS
    ###########################################################################

    - name: Check if VM already exists
      community.vmware.vmware_guest_info:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        name: "{{ item.name.split('.')[0] }}"
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: vm_lookup
      failed_when: false


    - name: Show VM existence status
      debug:
        msg:
          - "VM     : {{ item.item.name.split('.')[0] }}"
          - "Exists : {{ item.instance is defined }}"
      loop: "{{ vm_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"


    ###########################################################################
    # CREATE ONLY MISSING VMS
    ###########################################################################

    - name: Create missing VM
      community.vmware.vmware_guest:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false

        datacenter: "{{ datacenter }}"
        folder: "{{ folder }}"
        datastore: "{{ datastore }}"

        name: "{{ item.item.name.split('.')[0] }}"
        state: present

        guest_id: "{{ vm_guest_id }}"

        hardware:
          memory_mb: "{{ vm_memory_mb }}"
          num_cpus: "{{ vm_num_cpus }}"
          num_cpu_cores_per_socket: "{{ vm_num_cpu_cores_per_socket }}"
          boot_firmware: "{{ vm_boot_firmware }}"

        disk: "{{ vm_disks }}"

        networks:
          - name: "{{ vm_network }}"
            start_connected: true
            device_type: vmxnet3

      loop: "{{ vm_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.instance is not defined
      register: vm_create


    ###########################################################################
    # BUILD NEW VM LIST
    ###########################################################################

    - name: Initialize created VM list
      set_fact:
        created_vm_names: []


    - name: Build list of newly created VMs
      set_fact:
        created_vm_names: >-
          {{
            created_vm_names +
            [item.item.item.name.split('.')[0]]
          }}
      loop: "{{ vm_create.results | default([]) }}"
      loop_control:
        label: "{{ item.item.item.name | default('unknown') }}"
      when:
        - item.changed | default(false)
        - item.item is defined
        - item.item.item is defined


    - name: Remove duplicate newly created VM names
      set_fact:
        created_vm_names: "{{ created_vm_names | unique | list }}"


    - name: Show newly created VMs
      debug:
        msg:
          - "============================================================"
          - "NEWLY CREATED VMS"
          - "============================================================"
          - "{{ created_vm_names }}"
          - "============================================================"


    ###########################################################################
    # POWER ON ONLY NEW VMS
    ###########################################################################

    - name: Power on newly created VMs
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        name: "{{ item }}"
        state: powered-on
      loop: "{{ created_vm_names }}"
      loop_control:
        label: "{{ item }}"
      when: created_vm_names | length > 0


    - name: Wait for ESXi to initialize newly created VMs
      pause:
        seconds: 10
      when: created_vm_names | length > 0


    ###########################################################################
    # POWER OFF ONLY NEW VMS
    #
    # Existing VMs ARE NOT touched.
    ###########################################################################

    - name: Power off newly created VMs
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        name: "{{ item }}"
        state: powered-off
      loop: "{{ created_vm_names }}"
      loop_control:
        label: "{{ item }}"
      when: created_vm_names | length > 0


    ###########################################################################
    # GET FINAL VM INFORMATION
    ###########################################################################

    - name: Get final VM information
      community.vmware.vmware_guest_info:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        name: "{{ item.name.split('.')[0] }}"
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: vm_info


    ###########################################################################
    # SHOW FINAL VM INFORMATION
    ###########################################################################

    - name: Show VM information
      debug:
        msg:
          - "============================================================"
          - "VM Name       : {{ item.instance.hw_name | default(item.item.name.split('.')[0]) }}"
          - "Power         : {{ item.instance.hw_power_status | default('N/A') }}"
          - "MAC           : {{ item.instance.hw_eth0.macaddress | default('N/A') }}"
          - "CPU           : {{ item.instance.hw_processor_count | default('N/A') }}"
          - "Memory MB     : {{ item.instance.hw_memtotal_mb | default('N/A') }}"
          - "Configured For: {{ disk_layout }}"
          - "Expected Disks: {{ disk_count }}"
          - "============================================================"
      loop: "{{ vm_info.results }}"
      loop_control:
        label: "{{ item.item.name }}"


    ###########################################################################
    # FINAL SUMMARY
    ###########################################################################

    - name: Show final result
      debug:
        msg:
          - "============================================================"
          - "ROCKY LINUX 8 VM ENSURE OPERATION COMPLETED"
          - "============================================================"
          - "Cluster              : {{ cluster_name }}"
          - "Selected VMs         : {{ filtered_devices | length }}"
          - "New VMs Created      : {{ created_vm_names | length }}"
          - "New VM Names         : {{ created_vm_names }}"
          - "Disk Layout          : {{ disk_layout }}"
          - "Disk Count per VM    : {{ disk_count }}"
          - "Disk Size            : {{ vm_disk_size_gb }} GB"
          - "Expected Total Space : {{ disk_count | int * vm_disk_size_gb | int }} GB per VM"
          - "Firmware             : {{ vm_boot_firmware }}"
          - "============================================================"
