---
- name: Prepare and recreate Rocky 8 hosts in Foreman using API
  hosts: localhost
  connection: local
  gather_facts: no

  collections:
    - community.vmware

  vars:

    ###########################################################################
    # NETBOX
    ###########################################################################

    netbox_url: "https://netbox.vgs.com"
    netbox_token: "83fb0cec1adff8ff4f36c9185df6b9e2f07c7fcd"


    ###########################################################################
    # FOREMAN SERVER SELECTION
    #
    # AWX Survey:
    #
    # 1 = Frontend
    # 2 = Backend
    #
    ###########################################################################

    foreman_server: "{{ foreman_server | default('1', true) }}"

    foreman_url: >-
      {{
        {
          '1': 'https://rocky-08-01.vgs.com',
          '2': 'https://cent-07-01.vgs.com'
        }[foreman_server | string]
      }}

    foreman_user: "admin"
    foreman_api_token: "_bkE_ov7gKb68d3aR01m5A"


    ###########################################################################
    # HOST SETTINGS
    ###########################################################################

    host_root_pass: "Root@123"

    cluster_name: "rocky-8-servers"

    # Examples:
    #
    # rocky-08-01
    # rocky-08-01,rocky-08-02
    #
    # Leave empty to process all hosts in the cluster.
    #
    target_hosts: "{{ target_hosts | default('', true) }}"

    target_servers: >-
      {{
        target_hosts.split(',')
        | map('trim')
        | reject('equalto', '')
        | list
      }}


    ###########################################################################
    # FOREMAN ORGANIZATION / LOCATION
    ###########################################################################

    org_id: 1
    loc_id: 2


    ###########################################################################
    # Rocky Linux 8.10 Host Group / OS Selection
    #
    # AWX Survey:
    #
    # 1 = RockyLinux8.10-SingleDisk
    # 2 = RockyLinux8.10-RAID
    #
    ###########################################################################

    hostgroup: "{{ hostgroup | default('1', true) }}"

    hostgroup_id: >-
      {{
        {
          '1': 6,
          '2': 2
        }[hostgroup | string]
      }}

    # Rocky Linux 8.10
    operatingsystem_id: 4

    # Rocky 8 Remote
    medium_id: 16

    # Kickstart default
    ptable_id: 126

    # Rocky Linux subnet
    subnet_name: "vgs-subnet-rockyos"

    # Katello Content
    content_view_id: 3
    lifecycle_environment_id: 1

    # Architecture
    architecture_id: 1

    # Domain
    domain_id: 1

    # PXE
    pxe_loader: "Grub2 UEFI"


    ###########################################################################
    # ESXI
    ###########################################################################

    esxi_hostname: "192.168.253.128"
    esxi_username: "root"
    esxi_password: "Root@123"


  tasks:

    ###########################################################################
    # SHOW SELECTED CONFIGURATION
    ###########################################################################

    - name: Show selected Rocky 8 provisioning configuration
      debug:
        msg:
          - "============================================================"
          - "ROCKY LINUX 8 FOREMAN PROVISIONING"
          - "============================================================"
          - "Foreman Server        : {{ foreman_url }}"
          - "Foreman Selection     : {{ foreman_server }}"
          - "Cluster               : {{ cluster_name }}"
          - "Target Hosts          : {{ target_servers | join(', ') if target_servers | length > 0 else 'ALL HOSTS' }}"
          - "Hostgroup Selection   : {{ hostgroup }}"
          - "Hostgroup ID          : {{ hostgroup_id }}"
          - "Operating System ID   : {{ operatingsystem_id }}"
          - "Medium ID             : {{ medium_id }}"
          - "Partition Table ID    : {{ ptable_id }}"
          - "Architecture ID       : {{ architecture_id }}"
          - "Domain ID             : {{ domain_id }}"
          - "Subnet Name           : {{ subnet_name }}"
          - "Content View ID       : {{ content_view_id }}"
          - "Lifecycle Environment : {{ lifecycle_environment_id }}"
          - "PXE Loader            : {{ pxe_loader }}"
          - "============================================================"


    ###########################################################################
    # TEST FOREMAN CONNECTION
    ###########################################################################

    - name: Test Foreman API connection
      uri:
        url: "{{ foreman_url }}/api/status"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code: 200
        return_content: yes
      register: foreman_status


    - name: Show Foreman connection status
      debug:
        msg: "Connected successfully to Foreman: {{ foreman_url }}"


    ###########################################################################
    # GET DEVICES FROM NETBOX
    ###########################################################################

    - name: Get devices from NetBox cluster
      uri:
        url: "{{ netbox_url }}/api/dcim/devices/?cluster={{ cluster_name | urlencode }}&limit=1000"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
        validate_certs: no
        return_content: yes
        status_code: 200
      register: netbox_devices


    - name: Show devices returned by NetBox
      debug:
        msg: "{{ netbox_devices.json.results | map(attribute='name') | list }}"


    - name: Fail when no devices exist in NetBox cluster
      fail:
        msg: "No devices found in NetBox cluster: {{ cluster_name }}"
      when: netbox_devices.json.results | length == 0


    ###########################################################################
    # FILTER SELECTED HOSTS
    ###########################################################################

    - name: Initialize filtered device list
      set_fact:
        filtered_devices: []


    - name: Use all devices when target_hosts is empty
      set_fact:
        filtered_devices: "{{ netbox_devices.json.results }}"
      when: target_servers | length == 0


    - name: Filter devices by hostname when target_hosts is specified
      set_fact:
        filtered_devices: "{{ filtered_devices + [item] }}"
      loop: "{{ netbox_devices.json.results }}"
      when:
        - target_servers | length > 0
        - item.name.split('.')[0] in target_servers


    - name: Show selected devices
      debug:
        msg: "{{ filtered_devices | map(attribute='name') | list }}"


    - name: Fail if no selected hosts matched
      fail:
        msg: >-
          No matching hosts found in NetBox.
          Requested hosts: {{ target_servers | join(', ') }}
      when: filtered_devices | length == 0


    ###########################################################################
    # GET VM INFORMATION FROM ESXI
    ###########################################################################

    - name: Get VM information from ESXi
      community.vmware.vmware_guest_info:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: false
        name: "{{ item.name.split('.')[0] }}"
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: vm_info


    - name: Verify ESXi VM lookup succeeded
      fail:
        msg: "Unable to retrieve VM information for {{ item.item.name }}"
      loop: "{{ vm_info.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.failed | default(false)


    ###########################################################################
    # GET IP ADDRESSES FROM NETBOX
    ###########################################################################

    - name: Get IP addresses from NetBox
      uri:
        url: "{{ netbox_url }}/api/ipam/ip-addresses/?limit=1000"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
        validate_certs: no
        return_content: yes
        status_code: 200
      register: netbox_ips


    - name: Initialize host information
      set_fact:
        host_info: []


    - name: Build host information
      set_fact:
        host_info: "{{ host_info + [ {
          'name': item.0.name.split('.')[0],
          'netbox_name': item.0.name,
          'ip': (
            netbox_ips.json.results
            | selectattr('assigned_object', 'defined')
            | selectattr('assigned_object', 'ne', none)
            | selectattr('assigned_object.device', 'defined')
            | selectattr('assigned_object.device.name', 'equalto', item.0.name)
            | map(attribute='address')
            | map('regex_replace', '/.*$', '')
            | first
            | default('')
          ),
          'mac': (
            item.1.instance.hw_eth0.macaddress
            | default('')
          )
        } ] }}"
      loop: "{{ filtered_devices | zip(vm_info.results) | list }}"
      loop_control:
        label: "{{ item.0.name }}"


    - name: Show host information
      debug:
        var: host_info


    - name: Verify host IP addresses were found
      fail:
        msg: "No IP address found in NetBox for {{ item.name }}"
      loop: "{{ host_info }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.ip | length == 0


    - name: Verify host MAC addresses were found
      fail:
        msg: "No MAC address found from ESXi for {{ item.name }}"
      loop: "{{ host_info }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.mac | length == 0


    ###########################################################################
    # RESOLVE FOREMAN SUBNET
    ###########################################################################

    - name: Get Foreman subnet
      uri:
        url: "{{ foreman_url }}/api/subnets?search=name={{ subnet_name | urlencode }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code: 200
        return_content: yes
      register: foreman_subnets


    - name: Resolve Foreman subnet ID
      set_fact:
        subnet_id: >-
          {{
            foreman_subnets.json.results
            | selectattr('name', 'equalto', subnet_name)
            | map(attribute='id')
            | first
            | default('')
          }}


    - name: Verify Foreman subnet
      fail:
        msg: "Foreman subnet not found: {{ subnet_name }}"
      when: subnet_id | string | length == 0


    - name: Show Foreman subnet
      debug:
        msg:
          - "Subnet Name : {{ subnet_name }}"
          - "Subnet ID   : {{ subnet_id }}"


    ###########################################################################
    # CHECK IF HOST ALREADY EXISTS
    #
    # Search API is used instead of /api/hosts/<short-hostname>.
    # This avoids the previous 'Resource host not found by id' issue.
    ###########################################################################

    - name: Search for existing Foreman hosts
      uri:
        url: "{{ foreman_url }}/api/hosts?search=name={{ item.name | urlencode }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code: 200
        return_content: yes
      loop: "{{ host_info }}"
      loop_control:
        label: "{{ item.name }}"
      register: foreman_host_search


    - name: Show existing Foreman host status
      debug:
        msg: >-
          Host {{ item.item.name }} :
          {{
            'EXISTS - will delete and recreate'
            if (item.json.results | length > 0)
            else 'DOES NOT EXIST - will create'
          }}
      loop: "{{ foreman_host_search.results }}"
      loop_control:
        label: "{{ item.item.name }}"


    ###########################################################################
    # BUILD LIST OF EXISTING HOSTS
    ###########################################################################

    - name: Initialize existing Foreman hosts list
      set_fact:
        existing_foreman_hosts: []


    - name: Build existing Foreman hosts list
      set_fact:
        existing_foreman_hosts: "{{ existing_foreman_hosts + [ {
          'name': item.item.name,
          'id': (item.json.results | first).id
        } ] }}"
      loop: "{{ foreman_host_search.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.json.results | length > 0


    - name: Show existing Foreman hosts to be deleted
      debug:
        var: existing_foreman_hosts


    ###########################################################################
    # DELETE EXISTING FOREMAN HOSTS
    ###########################################################################

    - name: Delete existing Foreman hosts
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.id }}"
        method: DELETE
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code:
          - 200
          - 202
          - 204
      loop: "{{ existing_foreman_hosts }}"
      loop_control:
        label: "{{ item.name }}"
      register: foreman_delete


    - name: Show deleted Foreman hosts
      debug:
        msg: "Deleted existing Foreman host: {{ item.item.name }} (ID: {{ item.item.id }})"
      loop: "{{ foreman_delete.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: not (item.skipped | default(false))


    ###########################################################################
    # WAIT FOR DELETION
    #
    # Check using the old numeric Foreman ID.
    ###########################################################################

    - name: Wait until deleted Foreman hosts are completely removed
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.id }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code:
          - 200
          - 404
        return_content: yes
      register: deletion_check
      retries: 12
      delay: 5
      until: deletion_check.status == 404
      loop: "{{ existing_foreman_hosts }}"
      loop_control:
        label: "{{ item.name }}"
      when: existing_foreman_hosts | length > 0


    ###########################################################################
    # CREATE HOSTS
    ###########################################################################

    - name: Create Rocky 8 host in Foreman
      uri:
        url: "{{ foreman_url }}/api/hosts"
        method: POST
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120

        status_code:
          - 200
          - 201

        headers:
          Content-Type: application/json

        body_format: json

        body:
          host:
            name: "{{ item.name }}"

            organization_id: "{{ org_id }}"
            location_id: "{{ loc_id }}"

            hostgroup_id: "{{ hostgroup_id }}"
            operatingsystem_id: "{{ operatingsystem_id }}"
            medium_id: "{{ medium_id }}"
            ptable_id: "{{ ptable_id }}"
            architecture_id: "{{ architecture_id }}"

            subnet_id: "{{ subnet_id }}"
            domain_id: "{{ domain_id }}"

            build: true
            pxe_loader: "{{ pxe_loader }}"
            root_pass: "{{ host_root_pass }}"

            content_facet_attributes:
              content_view_id: "{{ content_view_id }}"
              lifecycle_environment_id: "{{ lifecycle_environment_id }}"

            interfaces_attributes:
              - type: interface
                mac: "{{ item.mac | replace('\\:', ':') }}"
                ip: "{{ item.ip }}"
                subnet_id: "{{ subnet_id }}"
                domain_id: "{{ domain_id }}"
                primary: true
                provision: true
                managed: true

      loop: "{{ host_info }}"
      loop_control:
        label: "{{ item.name }}"
      register: foreman_create


    ###########################################################################
    # VERIFY CREATE RESULTS
    ###########################################################################

    - name: Fail if Foreman did not return a host ID
      fail:
        msg: >-
          Foreman created request for {{ item.item.name }},
          but no host ID was returned.
          Response: {{ item.json | default({}) }}
      loop: "{{ foreman_create.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: >
        item.json is not defined or
        item.json.id is not defined


    - name: Show Foreman create result
      debug:
        msg:
          - "============================================================"
          - "Host    : {{ item.item.name }}"
          - "Status  : {{ item.status }}"
          - "Host ID : {{ item.json.id }}"
          - "============================================================"
      loop: "{{ foreman_create.results }}"
      loop_control:
        label: "{{ item.item.name }}"


    ###########################################################################
    # BUILD NEW FOREMAN HOST ID LIST
    #
    # IMPORTANT:
    # Use IDs returned directly by POST.
    # Do NOT search again using short hostname.
    ###########################################################################

    - name: Initialize created Foreman hosts list
      set_fact:
        created_foreman_hosts: []


    - name: Build created Foreman hosts list from POST response
      set_fact:
        created_foreman_hosts: "{{ created_foreman_hosts + [ {
          'name': item.item.name,
          'id': item.json.id
        } ] }}"
      loop: "{{ foreman_create.results }}"
      loop_control:
        label: "{{ item.item.name }}"


    - name: Show newly created Foreman host IDs
      debug:
        var: created_foreman_hosts


    ###########################################################################
    # REFRESH FOREMAN HOST INFORMATION
    #
    # FIX:
    # Uses numeric ID returned by POST.
    ###########################################################################

    - name: Refresh Foreman host information
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.id }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code: 200
        return_content: yes
      loop: "{{ created_foreman_hosts }}"
      loop_control:
        label: "{{ item.name }} (ID: {{ item.id }})"
      register: foreman_hosts_updated


    - name: Show refreshed Foreman hosts
      debug:
        msg:
          - "Host : {{ item.json.name }}"
          - "ID   : {{ item.json.id }}"
      loop: "{{ foreman_hosts_updated.results }}"
      loop_control:
        label: "{{ item.json.name }}"


    ###########################################################################
    # VERIFY FINAL FOREMAN HOST
    ###########################################################################

    - name: Verify final Foreman hosts using returned IDs
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.id }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code: 200
        return_content: yes
      loop: "{{ created_foreman_hosts }}"
      loop_control:
        label: "{{ item.name }} (ID: {{ item.id }})"
      register: final_hosts


    ###########################################################################
    # SHOW FINAL HOST CONFIGURATION
    ###########################################################################

    - name: Show final host configuration
      debug:
        msg:
          - "============================================================"
          - "Host       : {{ item.json.name }}"
          - "Host ID    : {{ item.json.id }}"
          - "Host Group : {{ item.json.hostgroup_name | default('N/A') }}"
          - "OS         : {{ item.json.operatingsystem_name | default('N/A') }}"
          - "Medium     : {{ item.json.medium_name | default('N/A') }}"
          - "Subnet     : {{ item.json.subnet_name | default('N/A') }}"
          - "IP         : {{ item.json.ip | default('N/A') }}"
          - "MAC        : {{ item.json.mac | default('N/A') }}"
          - "PXE Loader : {{ item.json.pxe_loader | default('N/A') }}"
          - "Build      : {{ item.json.build }}"
          - "Status     : {{ item.json.build_status_label | default('N/A') }}"
          - "============================================================"
      loop: "{{ final_hosts.results }}"
      loop_control:
        label: "{{ item.json.name }}"


    ###########################################################################
    # FINAL SUCCESS MESSAGE
    ###########################################################################

    - name: Show completion message
      debug:
        msg:
          - "============================================================"
          - "ROCKY LINUX 8 FOREMAN RECREATION COMPLETED SUCCESSFULLY"
          - "============================================================"
          - "Foreman Server : {{ foreman_url }}"
          - "Cluster        : {{ cluster_name }}"
          - "Hosts Created  : {{ created_foreman_hosts | map(attribute='name') | list }}"
          - "Host IDs       : {{ created_foreman_hosts | map(attribute='id') | list }}"
          - "============================================================"
          - "Existing hosts were deleted when found."
          - "All selected hosts were recreated."
          - "New Foreman IDs returned by POST were used for verification."
          - "PXE build mode is enabled."
          - "============================================================"
