---
- name: Prepare and create Rocky 8 hosts in Foreman using API
  hosts: localhost
  connection: local
  gather_facts: no

  collections:
    - community.vmware

  vars:
    netbox_url: "https://netbox.vgs.com"
    netbox_token: "83fb0cec1adff8ff4f36c9185df6b9e2f07c7fcd"
  
    # 1 = Frontend (default)
    # 2 = Backend
    foreman_server: "{{ foreman_server | default('1', true) }}"
  
    foreman_url: >-
      {{
        {
          '1': 'https://rocky-08-01.vgs.com',
          '2': 'https://cent-07-01.vgs.com'
        }[foreman_server | string]
      }}
  
    foreman_user: "admin"
    foreman_api_token: "_bkE_ov7gKb68d3aR01m5A"

    host_root_pass: "Root@123"
    cluster_name: "rocky-8-servers"

    # Leave empty to create all Rocky hosts
    target_servers: "{{ target_hosts.split(',') | map('trim') | list }}"

    # Foreman IDs
    # Foreman IDs
    # Foreman IDs
    org_id: 1
    loc_id: 2
    
    # ==============================================================================
    # Rocky Linux 8.10 Host Group / OS Selection
    #
    # AWX Survey:
    #
    # 1 = RockyLinux8.10-SingleDisk
    # 2 = RockyLinux8.10-RAID
    #
    # ==============================================================================

    hostgroup: "{{ hostgroup | default('1', true) }}"

    hostgroup_id: >-
      {{
        {
          '1': 14,
          '2': 10
        }[hostgroup | string]
      }}

    operatingsystem_id: >-
      {{
        {
          '1': 14,
          '2': 13
        }[hostgroup | string]
      }}

    # Rocky Linux 8 Remote
    medium_id: 16

    # Kickstart default
    ptable_id: 126

    # Rocky 8 subnet
    subnet_name: "vgs-subnet-rockyos"

    # Katello Content
    content_view_id: 3
    lifecycle_environment_id: 1

  tasks:

    ###########################################################################
    # Get devices from NetBox
    ###########################################################################

    - name: Get devices from NetBox cluster
      uri:
        url: "{{ netbox_url }}/api/dcim/devices/?cluster={{ cluster_name }}"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
        validate_certs: no
      register: netbox_devices

    - name: Show devices returned by NetBox
      debug:
        msg: "{{ netbox_devices.json.results | map(attribute='name') | list }}"

    ###########################################################################
    # Filter selected hosts
    ###########################################################################

    - name: Initialize filtered device list
      set_fact:
        filtered_devices: []

    - name: Filter devices by hostname
      set_fact:
        filtered_devices: "{{ filtered_devices + [item] }}"
      loop: "{{ netbox_devices.json.results }}"
      when:
        - item.name.split('.')[0] in target_servers

    - name: Show filtered devices
      debug:
        var: filtered_devices

    - name: Fail if no hosts matched
      fail:
        msg: "No matching hosts found in NetBox."
      when: filtered_devices | length == 0


    ###########################################################################
    # Get VM information from ESXi
    ###########################################################################

    - name: Get VM information from ESXi
      community.vmware.vmware_guest_info:
        hostname: "192.168.253.128"
        username: "root"
        password: "Root@123"
        validate_certs: false
        name: "{{ item.name.split('.')[0] }}"
      loop: "{{ filtered_devices }}"
      register: vm_info

    ###########################################################################
    # Get IP addresses
    ###########################################################################
    
    - name: Get IP addresses from NetBox
      uri:
        url: "{{ netbox_url }}/api/ipam/ip-addresses/"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
        validate_certs: no
      register: netbox_ips

    - name: Initialize host info
      set_fact:
        host_info: []
    
    - name: Build host info
      set_fact:
        host_info: "{{ host_info + [ {
          'name': item.0.name,
          'ip': (
            netbox_ips.json.results
            | selectattr('assigned_object.device.name','equalto',item.0.name)
            | map(attribute='address')
            | map('regex_replace','/.*$','')
            | first
            | default('')
          ),
          'mac': (
            item.1.instance.hw_eth0.macaddress
            | default('')
          )
        } ] }}"
      loop: "{{ filtered_devices | zip(vm_info.results) | list }}"

    - debug:
        var: host_info

    ###########################################################################
    # Check if host already exists in Foreman
    ###########################################################################

    - name: Check if host exists in Foreman
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.name }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        status_code:
          - 200
          - 404
      loop: "{{ host_info }}"
      register: foreman_hosts

    ###########################################################################
    # Resolve Foreman Subnet
    ###########################################################################

    - name: Get Foreman subnet
      uri:
        url: "{{ foreman_url }}/api/subnets?search=name={{ subnet_name | urlencode }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code: 200
      register: foreman_subnets

    - name: Resolve Foreman subnet ID
      set_fact:
        subnet_id: >-
          {{
            foreman_subnets.json.results
            | selectattr('name', 'equalto', subnet_name)
            | map(attribute='id')
            | first
            | default('')
          }}

    - name: Verify Foreman subnet
      fail:
        msg: "Foreman subnet not found: {{ subnet_name }}"
      when: subnet_id | string | length == 0

    - name: Show Foreman subnet
      debug:
        msg:
          - "Subnet Name : {{ subnet_name }}"
          - "Subnet ID   : {{ subnet_id }}"

    # ==========================================================================
    # Create hosts in Foreman
    # ==========================================================================

    - name: Create host in Foreman (only if missing)
      uri:
        url: "{{ foreman_url }}/api/hosts"
        method: POST
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120

        status_code:
          - 200
          - 201

        headers:
          Content-Type: application/json

        body_format: json

        body:
          host:
            name: "{{ item.item.name }}"

            # Explicit organization and location
            organization_id: 1
            location_id: 2

            hostgroup_id: "{{ hostgroup_id }}"
            operatingsystem_id: "{{ operatingsystem_id }}"
            medium_id: "{{ medium_id }}"
            ptable_id: "{{ ptable_id }}"
            architecture_id: 1

            subnet_id: "{{ subnet_id }}"
            domain_id: 1

            build: true
            pxe_loader: "Grub2 UEFI"
            root_pass: "{{ host_root_pass }}"

            content_facet_attributes:
              content_view_id: "{{ content_view_id }}"
              lifecycle_environment_id: "{{ lifecycle_environment_id }}"

            interfaces_attributes:
              - type: interface
                mac: "{{ item.item.mac | replace('\\:', ':') }}"
                ip: "{{ item.item.ip }}"
                subnet_id: "{{ subnet_id }}"
                domain_id: 1
                primary: true
                provision: true
                managed: true

      when: item.status == 404
      loop: "{{ foreman_hosts.results }}"
      register: foreman_create

    - name: Refresh Foreman host information
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.name }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code: 200
      loop: "{{ host_info }}"
      register: foreman_hosts_updated

    - name: Show refreshed Foreman hosts
      debug:
        msg:
          - "Host: {{ item.json.name }}"
          - "ID: {{ item.json.id }}"
      loop: "{{ foreman_hosts_updated.results }}"
        
    ###########################################################################
    # Update existing Foreman host
    ###########################################################################

    - name: Update existing Foreman host
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.json.id }}"
        method: PUT
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        headers:
          Content-Type: application/json
        body_format: json

        body:
          host:
            name: "{{ item.json.name }}"
            hostgroup_id: "{{ hostgroup_id }}"
            operatingsystem_id: "{{ operatingsystem_id }}"
            medium_id: "{{ medium_id }}"
            ptable_id: "{{ ptable_id }}"
            architecture_id: 1
            subnet_id: "{{ subnet_id }}"
            domain_id: 1

            build: true
            pxe_loader: "Grub2 UEFI"
            root_pass: "{{ host_root_pass }}"

            content_facet_attributes:
              content_view_id: "{{ content_view_id }}"
              lifecycle_environment_id: "{{ lifecycle_environment_id }}"

            interfaces_attributes:
              - id: "{{ item.json.interfaces[0].id }}"
                subnet_id: "{{ subnet_id }}"
                domain_id: 1
                mac: "{{ item.json.interfaces[0].mac }}"
                ip: "{{ item.json.interfaces[0].ip }}"
                primary: true
                provision: true

        status_code:
          - 200

      loop: "{{ foreman_hosts_updated.results }}"
      register: foreman_update


    ###########################################################################
    # Verify final Foreman host
    ###########################################################################

    - name: Verify final Foreman host
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.json.id }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code: 200
      loop: "{{ foreman_hosts_updated.results }}"
      register: final_hosts


    ###########################################################################
    # Show final host configuration
    ###########################################################################

    - name: Show final host configuration
      debug:
        msg:
          - "============================================================"
          - "Host       : {{ item.json.name }}"
          - "Host ID    : {{ item.json.id }}"
          - "Host Group : {{ item.json.hostgroup_name }}"
          - "OS         : {{ item.json.operatingsystem_name }}"
          - "Medium     : {{ item.json.medium_name }}"
          - "Subnet     : {{ item.json.subnet_name }}"
          - "IP         : {{ item.json.ip }}"
          - "PXE Loader : {{ item.json.pxe_loader }}"
          - "Build      : {{ item.json.build }}"
          - "Status     : {{ item.json.build_status_label }}"
          - "============================================================"
      loop: "{{ final_hosts.results }}"


    ###########################################################################
    # Show update result
    ###########################################################################

    - name: Show Foreman update result
      debug:
        var: foreman_update
