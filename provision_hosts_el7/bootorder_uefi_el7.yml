---
# ============================================================
# PLAY 1: Load selected CentOS 7 VMs from NetBox
# ============================================================

- name: Load selected CentOS 7 VMs from NetBox
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    netbox_url: "https://192.168.253.143"
    netbox_token: "83fb0cec1adff8ff4f36c9185df6b9e2f07c7fcd"

    # ==========================================================
    # FIXED CLUSTER
    # ==========================================================
    cluster_name: "centos-07-servers"

  tasks:

    # ==========================================================
    # SHOW RUNTIME VARIABLES
    # ==========================================================

    - name: Show runtime variables
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "RUNTIME VARIABLES"
          - "============================================================"
          - "Cluster Name : {{ cluster_name }}"
          - "Target Hosts : {{ target_hosts | default('NOT SET', true) }}"
          - "============================================================"

    # ==========================================================
    # VALIDATE TARGET HOSTS
    # ==========================================================

    - name: Fail if target_hosts is not provided
      ansible.builtin.fail:
        msg: "Please provide target_hosts in the AWX Survey."
      when: target_hosts is not defined or target_hosts | trim == ""

    # ==========================================================
    # GET EXACT CLUSTER
    # ==========================================================

    - name: Get cluster from NetBox
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/virtualization/clusters/?name={{ cluster_name | urlencode }}&limit=100"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
          Accept: "application/json"
        return_content: true
        validate_certs: false
        use_proxy: false
        status_code: 200
      register: cluster_lookup

    - name: Resolve exact cluster ID
      ansible.builtin.set_fact:
        cluster_id: >-
          {{
            cluster_lookup.json.results
            | selectattr('name', 'equalto', cluster_name)
            | map(attribute='id')
            | list
            | first
            | default('')
          }}

    - name: Fail if cluster not found
      ansible.builtin.fail:
        msg: "Cluster '{{ cluster_name }}' not found in NetBox."
      when: cluster_id | string | length == 0

    - name: Show cluster information
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NETBOX CLUSTER"
          - "============================================================"
          - "Cluster Name : {{ cluster_name }}"
          - "Cluster ID   : {{ cluster_id }}"
          - "============================================================"

    # ==========================================================
    # GET DEVICES FROM CLUSTER
    # ==========================================================

    - name: Get devices from NetBox cluster
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/dcim/devices/?cluster_id={{ cluster_id }}&limit=1000"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
          Accept: "application/json"
        return_content: true
        validate_certs: false
        use_proxy: false
        status_code: 200
      register: netbox_devices

    - name: Show device lookup information
      ansible.builtin.debug:
        msg:
          - "Cluster Name Used : {{ cluster_name }}"
          - "Cluster ID Used   : {{ cluster_id }}"
          - "Devices Returned  : {{ netbox_devices.json.results | length }}"

    # ==========================================================
    # SAFETY FILTER
    # ==========================================================

    - name: Initialize exact cluster devices
      ansible.builtin.set_fact:
        cluster_devices: []

    - name: Add devices belonging to exact cluster
      ansible.builtin.set_fact:
        cluster_devices: "{{ cluster_devices + [item] }}"
      loop: "{{ netbox_devices.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.cluster is defined
        - item.cluster is not none
        - item.cluster.name is defined
        - item.cluster.name == cluster_name

    - name: Show devices in exact cluster
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "DEVICES IN EXACT CLUSTER: {{ cluster_name }}"
          - "============================================================"
          - "{{ cluster_devices | map(attribute='name') | list }}"
          - "============================================================"

    - name: Fail if no devices found in exact cluster
      ansible.builtin.fail:
        msg: >-
          No devices found in exact cluster '{{ cluster_name }}'.
          Cluster ID used: {{ cluster_id }}
      when: cluster_devices | length == 0

    # ==========================================================
    # CONVERT AWX SURVEY INPUT
    # ==========================================================

    - name: Convert target_hosts string to list
      ansible.builtin.set_fact:
        target_hosts_list: >-
          {{
            target_hosts.split(',')
            | map('trim')
            | reject('equalto', '')
            | list
          }}

    - name: Show requested hosts
      ansible.builtin.debug:
        var: target_hosts_list

    # ==========================================================
    # FILTER SELECTED DEVICES
    # ==========================================================

    - name: Initialize filtered devices
      ansible.builtin.set_fact:
        filtered_devices: []

    - name: Filter selected devices
      ansible.builtin.set_fact:
        filtered_devices: "{{ filtered_devices + [item] }}"
      loop: "{{ cluster_devices }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name.split('.')[0] in target_hosts_list

    - name: Fail if no matching hosts found
      ansible.builtin.fail:
        msg: >-
          No matching hosts found in NetBox.
          Cluster: {{ cluster_name }}
          Cluster ID: {{ cluster_id }}
          Requested: {{ target_hosts_list }}
          Available in cluster: {{ cluster_devices | map(attribute='name') | list }}
      when: filtered_devices | length == 0

    - name: Show selected devices
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "SELECTED CENTOS 7 DEVICES"
          - "============================================================"
          - "{{ filtered_devices | map(attribute='name') | list }}"
          - "============================================================"


# ============================================================
# PLAY 2: Configure ESXi PXE Boot
# ============================================================

- name: Configure CentOS 7 VM Boot
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - community.vmware

  vars:
    esxi_hostname: "192.168.253.128"
    esxi_username: "root"
    esxi_password: "Root@123"

    validate_certs: false

  tasks:

    # ==========================================================
    # POWER OFF
    # ==========================================================

    - name: Power OFF selected VM
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ item.name.split('.')[0] }}"
        state: powered-off
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      register: poweroff_result

    # ==========================================================
    # SET EFI
    # ==========================================================

    - name: Set EFI firmware
      community.vmware.vmware_guest:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ item.name.split('.')[0] }}"
        state: present
        hardware:
          boot_firmware: efi
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost

    # ==========================================================
    # WAIT AFTER CONFIGURATION
    # ==========================================================

    - name: Pause after firmware configuration
      ansible.builtin.pause:
        seconds: 3

    # ==========================================================
    # SET PXE / NETWORK BOOT
    #
    # IMPORTANT:
    # The previous vmware_guest_boot_manager task caused Ansible
    # to attempt remote temporary directory creation.
    #
    # Use vmware_guest with boot settings instead.
    # ==========================================================

    - name: Configure network boot first
      community.vmware.vmware_guest:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ item.name.split('.')[0] }}"
        state: present
        hardware:
          boot_firmware: efi
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost

    # ==========================================================
    # POWER ON
    # ==========================================================

    - name: Power ON selected VM
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ item.name.split('.')[0] }}"
        state: powered-on
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost


# ============================================================
# PLAY 3: Get NetBox IPs and Wait for SSH
# ============================================================

- name: Wait for CentOS 7 VMs and build dynamic inventory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    default_ssh_user: "root"
    default_ssh_password: "Root@123"

  tasks:

    # ==========================================================
    # BUILD CONNECTION INFORMATION DIRECTLY FROM SELECTED DEVICE
    # ==========================================================

    - name: Initialize selected VM connection information
      ansible.builtin.set_fact:
        selected_vm_connections: []

    - name: Build selected VM connection information
      ansible.builtin.set_fact:
        selected_vm_connections: >-
          {{
            selected_vm_connections
            +
            [
              {
                'name': item.name,
                'short_name': item.name.split('.')[0],
                'ip': (
                  item.primary_ip4.address
                  | default('')
                  | regex_replace('/.*$', '')
                ),
                'ssh_user': (
                  item.config_context.vm_root_user
                  | default(default_ssh_user)
                ),
                'ssh_password': (
                  item.config_context.vm_root_password
                  | default(default_ssh_password)
                )
              }
            ]
          }}
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Show selected VM IP mapping
      ansible.builtin.debug:
        msg:
          - "VM       : {{ item.name }}"
          - "IP       : {{ item.ip }}"
          - "SSH User : {{ item.ssh_user }}"
      loop: "{{ selected_vm_connections }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Fail if any selected VM has no IP address
      ansible.builtin.fail:
        msg: "No IP address found in NetBox for VM {{ item.name }}"
      when: item.ip | length == 0
      loop: "{{ selected_vm_connections }}"
      loop_control:
        label: "{{ item.name }}"

    # ==========================================================
    # WAIT FOR VM SSH
    # ==========================================================

    - name: Wait for SSH port 22
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 22
        delay: 10
        timeout: 3600
        state: started
      loop: "{{ selected_vm_connections }}"
      loop_control:
        label: "{{ item.name }}"

    # ==========================================================
    # ADD TO DYNAMIC INVENTORY
    # ==========================================================

    - name: Add selected VMs to dynamic inventory
      ansible.builtin.add_host:
        name: "{{ item.short_name }}"
        groups: verification_vms
        ansible_host: "{{ item.ip }}"
        ansible_user: "{{ item.ssh_user }}"
        ansible_password: "{{ item.ssh_password }}"
        ansible_ssh_pass: "{{ item.ssh_password }}"
        ansible_connection: ssh
        ansible_become: false
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
      loop: "{{ selected_vm_connections }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Show dynamic inventory hosts
      ansible.builtin.debug:
        msg:
          - "Host: {{ item.short_name }}"
          - "IP: {{ item.ip }}"
      loop: "{{ selected_vm_connections }}"
      loop_control:
        label: "{{ item.name }}"


# ============================================================
# PLAY 4: Final System Verification
# ============================================================

- name: Final CentOS 7 System Verification
  hosts: verification_vms
  gather_facts: false

  tasks:

    - name: Wait for SSH authentication
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 600

    - name: Check hostname
      ansible.builtin.raw: hostname
      register: hostname_result
      changed_when: false

    - name: Check uptime
      ansible.builtin.raw: uptime -p
      register: uptime_result
      changed_when: false

    - name: Check kernel
      ansible.builtin.raw: uname -r
      register: kernel_result
      changed_when: false

    - name: Check operating system
      ansible.builtin.raw: cat /etc/os-release
      register: os_result
      changed_when: false

    - name: Check block devices
      ansible.builtin.raw: lsblk -o NAME,SIZE,TYPE,MOUNTPOINT
      register: disk_result
      changed_when: false

    - name: Check RAID status
      ansible.builtin.raw: cat /proc/mdstat
      register: raid_result
      changed_when: false
      failed_when: false

    - name: Display final system information
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "FINAL SYSTEM VERIFICATION"
          - "============================================================"
          - "Host      : {{ inventory_hostname }}"
          - "IP        : {{ ansible_host }}"
          - "Hostname  : {{ hostname_result.stdout | trim }}"
          - "Uptime    : {{ uptime_result.stdout | trim }}"
          - "Kernel    : {{ kernel_result.stdout | trim }}"
          - "OS        : {{ os_result.stdout_lines | select('match', '^PRETTY_NAME=') | first | default('OS information unavailable') | regex_replace('^PRETTY_NAME=', '') | regex_replace('^\"|\"$', '') }}"
          - "------------------------------------------------------------"
          - "DISKS:"
          - "{{ disk_result.stdout_lines }}"
          - "------------------------------------------------------------"
          - "RAID:"
          - "{{ raid_result.stdout_lines }}"
          - "============================================================"
