---
- name: Prepare and recreate CENTOS 7 hosts in Foreman using API
  hosts: localhost
  connection: local
  gather_facts: no

  collections:
    - community.vmware

  vars:

    ###########################################################################
    # NETBOX
    ###########################################################################

    netbox_url: "https://netbox.vgs.com"
    netbox_token: "83fb0cec1adff8ff4f36c9185df6b9e2f07c7fcd"


    ###########################################################################
    # FOREMAN SERVER SELECTION
    #
    # 1 = Frontend Foreman
    # 2 = Backend Foreman
    ###########################################################################

    foreman_server: "{{ foreman_server | default('1', true) }}"

    foreman_url: >-
      {{
        {
          '1': 'https://rocky-08-01.vgs.com',
          '2': 'https://cent-07-01.vgs.com'
        }[foreman_server | string]
      }}

    foreman_user: "admin"
    foreman_api_token: "oUzg-aMfjcT3q_wZ8NRLfQ"


    ###########################################################################
    # HOST SETTINGS
    ###########################################################################

    host_root_pass: "Root@123"

    cluster_name: "centos-07-servers"

    # AWX Survey
    #
    # Example:
    # target_hosts = cent-07-01,cent-07-02
    #
    # Leave empty to process all hosts in the cluster.
    #

    target_hosts: "{{ target_hosts | default('', true) }}"

    target_servers: >-
      {{
        target_hosts.split(',')
        | map('trim')
        | reject('equalto', '')
        | list
      }}


    ###########################################################################
    # FOREMAN ORGANIZATION / LOCATION
    ###########################################################################

    org_id: 1
    loc_id: 2


    ###########################################################################
    # CENTOS LINUX 7 HOST GROUP / OS SELECTION
    #
    # AWX Survey:
    #
    # 1 = CentOSLinux7-SingleDisk
    # 2 = CentOSLinux7-RAID
    ###########################################################################

    hostgroup: "{{ hostgroup | default('1', true) }}"


    ###########################################################################
    # HOSTGROUP ID
    #
    # 1 = SingleDisk = ID 5
    # 2 = RAID       = ID 1
    ###########################################################################

    hostgroup_id: >-
      {{
        {
          '1': 5,
          '2': 1
        }[hostgroup | string]
      }}


    ###########################################################################
    # OPERATING SYSTEM ID
    #
    # CentOSLinux7-SingleDisk 7 = ID 3
    # CentOSLinux7-RAID 7       = ID 2
    ###########################################################################

    operatingsystem_id: >-
      {{
        {
          '1': 3,
          '2': 2
        }[hostgroup | string]
      }}


    ###########################################################################
    # INSTALLATION MEDIUM
    #
    # CentOS 7 Remote = ID 15
    ###########################################################################

    medium_id: 15


    ###########################################################################
    # PARTITION TABLE
    #
    # Kickstart default
    ###########################################################################

    ptable_id: 126


    ###########################################################################
    # ARCHITECTURE
    ###########################################################################

    architecture_id: 1


    ###########################################################################
    # NETWORK
    ###########################################################################

    subnet_name: "vgs-subnet-centos"

    domain_id: 1


    ###########################################################################
    # KATELLO CONTENT
    ###########################################################################

    content_view_id: 2

    # Library
    lifecycle_environment_id: 1


    ###########################################################################
    # PXE SETTINGS
    ###########################################################################

    pxe_loader: "Grub2 UEFI"
    build: true


  tasks:

    ###########################################################################
    # SHOW SELECTED CONFIGURATION
    ###########################################################################

    - name: Show selected Foreman configuration
      debug:
        msg:
          - "============================================================"
          - "CENTOS 7 FOREMAN PROVISIONING CONFIGURATION"
          - "============================================================"
          - "Foreman Server          : {{ foreman_url }}"
          - "Cluster                 : {{ cluster_name }}"
          - "Target Hosts            : {{ target_servers | join(', ') if target_servers | length > 0 else 'ALL HOSTS' }}"
          - "Hostgroup Selection     : {{ hostgroup }}"
          - "Hostgroup ID            : {{ hostgroup_id }}"
          - "Operating System ID     : {{ operatingsystem_id }}"
          - "Medium ID               : {{ medium_id }}"
          - "Partition Table ID      : {{ ptable_id }}"
          - "Architecture ID         : {{ architecture_id }}"
          - "Subnet Name             : {{ subnet_name }}"
          - "Content View ID         : {{ content_view_id }}"
          - "Lifecycle Environment ID: {{ lifecycle_environment_id }}"
          - "PXE Loader              : {{ pxe_loader }}"
          - "============================================================"


    ###########################################################################
    # GET DEVICES FROM NETBOX
    ###########################################################################

    - name: Get devices from NetBox cluster
      uri:
        url: "{{ netbox_url }}/api/dcim/devices/?cluster={{ cluster_name | urlencode }}&limit=1000"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
        validate_certs: no
        use_proxy: false
        status_code: 200
        return_content: yes
      register: netbox_devices


    - name: Show devices returned by NetBox
      debug:
        msg: "{{ netbox_devices.json.results | map(attribute='name') | list }}"


    ###########################################################################
    # FILTER SELECTED HOSTS
    ###########################################################################

    - name: Initialize filtered device list
      set_fact:
        filtered_devices: []


    - name: Select all devices when target_hosts is empty
      set_fact:
        filtered_devices: "{{ netbox_devices.json.results }}"
      when: target_servers | length == 0


    - name: Filter devices by hostname when target_hosts is specified
      set_fact:
        filtered_devices: "{{ filtered_devices + [item] }}"
      loop: "{{ netbox_devices.json.results }}"
      when:
        - target_servers | length > 0
        - item.name.split('.')[0] in target_servers


    - name: Show selected devices
      debug:
        msg: "{{ filtered_devices | map(attribute='name') | list }}"


    - name: Fail if no hosts matched
      fail:
        msg: >-
          No matching hosts found in NetBox.
          Cluster={{ cluster_name }}
          target_hosts={{ target_servers }}
      when: filtered_devices | length == 0


    ###########################################################################
    # GET VM INFORMATION FROM ESXI
    ###########################################################################

    - name: Get VM information from ESXi
      community.vmware.vmware_guest_info:
        hostname: "192.168.253.128"
        username: "root"
        password: "Root@123"
        validate_certs: false
        name: "{{ item.name.split('.')[0] }}"
      loop: "{{ filtered_devices }}"
      loop_control:
        label: "{{ item.name }}"
      register: vm_info


    ###########################################################################
    # GET IP ADDRESSES FROM NETBOX
    ###########################################################################

    - name: Get IP addresses from NetBox
      uri:
        url: "{{ netbox_url }}/api/ipam/ip-addresses/?limit=1000"
        method: GET
        headers:
          Authorization: "Token {{ netbox_token }}"
        validate_certs: no
        use_proxy: false
        status_code: 200
        return_content: yes
      register: netbox_ips


    ###########################################################################
    # BUILD HOST INFORMATION
    ###########################################################################

    - name: Initialize host information
      set_fact:
        host_info: []


    - name: Build host information
      set_fact:
        host_info: "{{ host_info + [host_data] }}"
      vars:
        host_data:
          name: "{{ item.0.name }}"
          ip: >-
            {{
              netbox_ips.json.results
              | selectattr('assigned_object', 'defined')
              | selectattr('assigned_object', 'ne', none)
              | selectattr('assigned_object.device', 'defined')
              | selectattr('assigned_object.device', 'ne', none)
              | selectattr('assigned_object.device.name', 'equalto', item.0.name)
              | map(attribute='address')
              | map('regex_replace', '/.*$', '')
              | first
              | default('')
            }}
          mac: "{{ item.1.instance.hw_eth0.macaddress | default('') }}"
      loop: "{{ filtered_devices | zip(vm_info.results) | list }}"
      loop_control:
        label: "{{ item.0.name }}"


    - name: Show host information
      debug:
        var: host_info


    ###########################################################################
    # VALIDATE HOST INFORMATION
    ###########################################################################

    - name: Fail when IP address is missing
      fail:
        msg: "IP address not found in NetBox for host: {{ item.name }}"
      loop: "{{ host_info }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.ip | length == 0


    - name: Fail when MAC address is missing
      fail:
        msg: "MAC address not found in ESXi for host: {{ item.name }}"
      loop: "{{ host_info }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.mac | length == 0


    ###########################################################################
    # CHECK IF HOST ALREADY EXISTS IN FOREMAN
    #
    # Search by hostname instead of using:
    #
    # /api/hosts/{{ hostname }}
    #
    # This avoids Foreman interpreting the hostname as a host ID.
    ###########################################################################

    - name: Search for existing Foreman host by name
      uri:
        url: "{{ foreman_url }}/api/hosts?search=name={{ item.name | urlencode }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code: 200
        return_content: yes
      loop: "{{ host_info }}"
      loop_control:
        label: "{{ item.name }}"
      register: foreman_host_search


    - name: Build existing Foreman host information
      set_fact:
        existing_foreman_hosts: >-
          {{
            existing_foreman_hosts | default([]) +
            [
              {
                'name': item.item.name,
                'exists': (item.json.results | length > 0),
                'id': (
                  item.json.results
                  | map(attribute='id')
                  | first
                  | default('')
                )
              }
            ]
          }}
      loop: "{{ foreman_host_search.results }}"
      loop_control:
        label: "{{ item.item.name }}"


    - name: Show existing Foreman host status
      debug:
        msg:
          - "Host   : {{ item.name }}"
          - "Exists : {{ item.exists }}"
          - "Host ID: {{ item.id if item.exists else 'NOT FOUND' }}"
      loop: "{{ existing_foreman_hosts }}"
      loop_control:
        label: "{{ item.name }}"


    ###########################################################################
    # DELETE EXISTING FOREMAN HOSTS
    ###########################################################################

    - name: Delete existing Foreman host
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.id }}"
        method: DELETE
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code:
          - 200
          - 202
          - 204
        return_content: yes
      loop: "{{ existing_foreman_hosts }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.exists | bool
      register: foreman_delete


    - name: Show deleted Foreman hosts
      debug:
        msg:
          - "============================================================"
          - "EXISTING FOREMAN HOST DELETED"
          - "============================================================"
          - "Host : {{ item.item.name }}"
          - "Host ID: {{ item.item.id }}"
          - "============================================================"
      loop: "{{ foreman_delete.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name | default('SKIPPED') }}"
      when:
        - item.skipped is not defined
        - item.status is defined


    ###########################################################################
    # WAIT UNTIL OLD HOSTS ARE FULLY DELETED
    ###########################################################################

    - name: Wait until existing Foreman hosts are fully deleted
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.id }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code:
          - 200
          - 404
      register: foreman_delete_check
      until: foreman_delete_check.status == 404
      retries: 30
      delay: 2
      loop: "{{ existing_foreman_hosts }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.exists | bool


    ###########################################################################
    # RESOLVE FOREMAN SUBNET
    ###########################################################################

    - name: Get Foreman subnet
      uri:
        url: "{{ foreman_url }}/api/subnets?search=name={{ subnet_name | urlencode }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code: 200
        return_content: yes
      register: foreman_subnets


    - name: Resolve Foreman subnet ID
      set_fact:
        subnet_id: >-
          {{
            foreman_subnets.json.results
            | selectattr('name', 'equalto', subnet_name)
            | map(attribute='id')
            | first
            | default('')
          }}


    - name: Verify Foreman subnet
      fail:
        msg: "Foreman subnet not found: {{ subnet_name }}"
      when: subnet_id | string | length == 0


    - name: Show Foreman subnet
      debug:
        msg:
          - "Subnet Name : {{ subnet_name }}"
          - "Subnet ID   : {{ subnet_id }}"


    ###########################################################################
    # CREATE / RECREATE ALL HOSTS
    ###########################################################################

    - name: Create Foreman hosts
      uri:
        url: "{{ foreman_url }}/api/hosts"
        method: POST
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120

        status_code:
          - 200
          - 201

        headers:
          Content-Type: application/json

        body_format: json

        body:
          host:
            name: "{{ item.name }}"

            organization_id: "{{ org_id }}"
            location_id: "{{ loc_id }}"

            hostgroup_id: "{{ hostgroup_id }}"
            operatingsystem_id: "{{ operatingsystem_id }}"
            medium_id: "{{ medium_id }}"
            ptable_id: "{{ ptable_id }}"
            architecture_id: "{{ architecture_id }}"

            subnet_id: "{{ subnet_id }}"
            domain_id: "{{ domain_id }}"

            build: "{{ build }}"
            pxe_loader: "{{ pxe_loader }}"
            root_pass: "{{ host_root_pass }}"

            content_facet_attributes:
              content_view_id: "{{ content_view_id }}"
              lifecycle_environment_id: "{{ lifecycle_environment_id }}"

            interfaces_attributes:
              - type: interface
                mac: "{{ item.mac }}"
                ip: "{{ item.ip }}"
                subnet_id: "{{ subnet_id }}"
                domain_id: "{{ domain_id }}"
                primary: true
                provision: true
                managed: true

      loop: "{{ host_info }}"
      loop_control:
        label: "{{ item.name }}"
      register: foreman_create


    ###########################################################################
    # SHOW CREATION RESULTS
    ###########################################################################

    - name: Show Foreman creation result
      debug:
        msg:
          - "============================================================"
          - "FOREMAN HOST CREATED"
          - "============================================================"
          - "Host    : {{ item.item.name }}"
          - "Host ID : {{ item.json.id | default('UNKNOWN') }}"
          - "Status  : {{ item.status }}"
          - "Result  : {{ item.msg | default('Host created successfully') }}"
          - "============================================================"
      loop: "{{ foreman_create.results }}"
      loop_control:
        label: "{{ item.item.name }}"


    ###########################################################################
    # VALIDATE FOREMAN RETURNED HOST ID
    ###########################################################################

    - name: Fail if Foreman did not return a host ID
      fail:
        msg: >-
          Foreman did not return a valid Host ID after creating:
          {{ item.item.name }}
      loop: "{{ foreman_create.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.json.id is not defined


    ###########################################################################
    # REFRESH FOREMAN HOST INFORMATION
    #
    # IMPORTANT:
    #
    # Use the numeric Foreman ID returned directly from POST /api/hosts.
    #
    # Example:
    #
    # POST /api/hosts
    #        |
    #        v
    # Returns:
    # {
    #   "id": 123,
    #   "name": "cent-07-01"
    # }
    #        |
    #        v
    # GET /api/hosts/123
    #
    ###########################################################################

    - name: Refresh Foreman host information using created Foreman ID
      uri:
        url: "{{ foreman_url }}/api/hosts/{{ item.json.id }}"
        method: GET
        user: "{{ foreman_user }}"
        password: "{{ foreman_api_token }}"
        force_basic_auth: yes
        validate_certs: no
        use_proxy: false
        timeout: 120
        status_code: 200
        return_content: yes
      loop: "{{ foreman_create.results }}"
      loop_control:
        label: "{{ item.item.name }} (ID={{ item.json.id }})"
      register: final_hosts


    ###########################################################################
    # SHOW FINAL HOST CONFIGURATION
    ###########################################################################

    - name: Show final host configuration
      debug:
        msg:
          - "============================================================"
          - "FINAL FOREMAN HOST CONFIGURATION"
          - "============================================================"
          - "Host       : {{ item.json.name }}"
          - "Host ID    : {{ item.json.id }}"
          - "Host Group : {{ item.json.hostgroup_name | default('N/A') }}"
          - "OS         : {{ item.json.operatingsystem_name | default('N/A') }}"
          - "Medium     : {{ item.json.medium_name | default('N/A') }}"
          - "Subnet     : {{ item.json.subnet_name | default('N/A') }}"
          - "IP         : {{ item.json.ip | default('N/A') }}"
          - "PXE Loader : {{ item.json.pxe_loader | default('N/A') }}"
          - "Build      : {{ item.json.build | default('N/A') }}"
          - "Status     : {{ item.json.build_status_label | default('N/A') }}"
          - "============================================================"
      loop: "{{ final_hosts.results }}"
      loop_control:
        label: "{{ item.json.name }}"


    ###########################################################################
    # FINAL SUCCESS SUMMARY
    ###########################################################################

    - name: Final success summary
      debug:
        msg:
          - "============================================================"
          - "CENTOS 7 FOREMAN RECREATION COMPLETED SUCCESSFULLY"
          - "============================================================"
          - "Hosts processed          : {{ host_info | length }}"
          - "Foreman URL              : {{ foreman_url }}"
          - "Hostgroup ID             : {{ hostgroup_id }}"
          - "Operating System ID      : {{ operatingsystem_id }}"
          - "Medium ID                : {{ medium_id }}"
          - "Partition Table ID       : {{ ptable_id }}"
          - "Architecture ID          : {{ architecture_id }}"
          - "Content View ID          : {{ content_view_id }}"
          - "Lifecycle Environment ID : {{ lifecycle_environment_id }}"
          - "PXE Loader               : {{ pxe_loader }}"
          - "PXE Build Mode           : {{ build }}"
          - "============================================================"
